<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Adventure Engine - Game Studio V14.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #22d3ee;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            height: 100dvh;
            font-family: 'Play', sans-serif; 
            background-color: var(--bg-dark); 
            color: #f8fafc; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        
        #studio-view, #community-view { height: 100%; overflow-y: auto; padding: 1rem; padding-bottom: 5rem; }
        @media (min-width: 768px) { #studio-view, #community-view { padding: 2.5rem; } }
        
        #studio-view { display: none; }
        #community-view { display: block; }
        
        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 1rem; }

        .input-style { background: #0f172a; color: var(--secondary); border: 1px solid #334155; border-radius: 0.5rem; padding: 0.8rem; outline: none; transition: 0.2s; width: 100%; font-size: 1rem; }
        .input-style:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; cursor: pointer; user-select: none; }
        .page-item:hover { background: #2d3748; }
        .page-item.selected { border-color: var(--secondary); background: #4c1d95; box-shadow: 0 0 15px rgba(34, 211, 238, 0.2); }
        .handle { cursor: grab; padding: 5px 15px 5px 5px; color: #64748b; font-size: 0.9rem; }
        .handle:active { cursor: grabbing; }

        /* Mobil Studio Optimalizálás */
        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; opacity: 0.6; }
        
        #player-view { position: fixed; inset: 0; z-index: 9000; background: #000; display: none; flex-direction: column; height: 100dvh; }
        .p-dialog-box { position: relative; background: rgba(0,0,0,0.8); border-top: 4px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 25px; padding-top: 45px; min-height: 280px; display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <div id="save-indicator" class="fixed bottom-6 right-6 bg-emerald-500 text-white px-5 py-2 rounded-full font-bold text-xs z-[10000] hidden">
        <i class="fa fa-sync-alt fa-spin mr-2"></i> SAVING...
    </div>

    <div id="community-view">
        <header class="max-w-7xl mx-auto flex justify-between items-center p-6">
            <div class="flex items-center gap-4">
                <img src="https://treasurehuntsites.github.io/kalandmotor/logo.png" class="w-12 h-12">
                <h1 class="text-2xl font-bold uppercase tracking-tighter">Adventure Engine</h1>
            </div>
            <div class="flex items-center gap-4">
                <a href="https://discord.gg/V7sYBbP69v" target="_blank" class="text-white text-2xl hover:text-purple-400"><i class="fab fa-discord"></i></a>
                <button id="login-btn" onclick="window.login()" class="bg-purple-600 px-6 py-2 rounded-xl font-bold uppercase text-xs">Login</button>
                <button id="studio-btn" onclick="window.switchView('studio')" class="hidden bg-slate-700 px-6 py-2 rounded-xl font-bold uppercase text-xs">Studio</button>
            </div>
        </header>
        
        <div class="max-w-7xl mx-auto p-6">
            <div id="community-game-list" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <p class="text-center col-span-full opacity-50">Loading adventures...</p>
            </div>
        </div>
    </div>

    <div id="studio-view" class="hidden">
        <div class="max-w-7xl mx-auto flex justify-between p-6">
            <button onclick="window.switchView('community')" class="text-xs uppercase font-bold opacity-50">← Back</button>
            <div id="admin-panel" class="hidden text-red-500 font-bold text-xs">ADMIN MODE</div>
        </div>
        
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 p-6">
            <div class="lg:col-span-8 space-y-6">
                 <input type="text" id="appTitle" class="input-style" placeholder="Game Title" oninput="window.autoSave()">
                 <div id="pageList" class="space-y-2"></div>
                 <button onclick="window.addPage()" class="bg-purple-600 w-full py-3 rounded-xl font-bold">+ NEW PAGE</button>
                 
                 <div id="editorPanel" class="glass-card p-6 hidden">
                     <textarea id="pageText" class="input-style h-32" oninput="window.autoSave()"></textarea>
                     <div class="flex gap-4 mt-4">
                        <button onclick="window.copyPage()" class="bg-slate-700 flex-1 py-2 rounded-lg text-xs">COPY PAGE</button>
                        <button onclick="window.deletePage()" class="bg-red-900 flex-1 py-2 rounded-lg text-xs">DELETE PAGE</button>
                     </div>
                 </div>
            </div>
            <div class="lg:col-span-4 hidden lg:flex">
                <div class="sim-container">
                    <div id="sim-viewport" class="p-6">
                        <div id="sim-text" class="text-sm"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="player-view">
        <div class="p-game-wrapper">
             <div id="p-content-layer">
                 <div class="p-dialog-box">
                     <div id="p-story-text" class="p-6"></div>
                     <div id="p-button-container" class="p-6 space-y-3"></div>
                     <button onclick="window.togglePlayerMode()" class="absolute top-4 right-4 text-white/20"><i class="fa fa-times"></i></button>
                 </div>
             </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // KONFIGURÁCIÓ - Az eredeti működő kulccsal
        const _k = ["AIzaSy", "CfVce17Yye6jyvpSSoW6jlh3ei7T0N618"].join('');
        const firebaseConfig = { apiKey: _k, authDomain: "kalandmotor.firebaseapp.com", projectId: "kalandmotor", storageBucket: "kalandmotor.firebasestorage.app", messagingSenderId: "108860908140", appId: "1:108860908140:web:5fbec83f4ae7b51487ee49" };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.config = { appTitle: "Új játék", storyPages: [{ id: self.crypto.randomUUID(), content: "Kezdés..." }] };
        window.currentIdx = 0;
        let currentUser = null;

        // FÜGGVÉNYEK EXPORTÁLÁSA A WINDOW OBJEKTUMRA (Hogy a gombok lássák)
        window.login = () => signInWithPopup(auth, provider).catch(console.error);
        window.logout = () => signOut(auth).then(() => location.reload());

        window.switchView = (v) => {
            document.getElementById('studio-view').classList.toggle('hidden', v !== 'studio');
            document.getElementById('community-view').classList.toggle('hidden', v !== 'community');
            if(v === 'studio') window.refreshUI();
        };

        window.autoSave = () => {
            window.config.appTitle = document.getElementById('appTitle').value;
            const p = window.config.storyPages[window.currentIdx];
            if(p) p.content = document.getElementById('pageText').value;
            
            localStorage.setItem('KALAND_STUDIO_V13', JSON.stringify(window.config));
            window.updateSimulator();
            window.renderPageList();
        };

        window.addPage = () => {
            window.config.storyPages.push({ id: self.crypto.randomUUID(), content: "Új oldal..." });
            window.autoSave();
        };

        window.copyPage = () => {
            const copy = JSON.parse(JSON.stringify(window.config.storyPages[window.currentIdx]));
            copy.id = self.crypto.randomUUID();
            window.config.storyPages.splice(window.currentIdx + 1, 0, copy);
            window.autoSave();
        };

        window.deletePage = () => {
            if(window.config.storyPages.length <= 1) return;
            window.config.storyPages.splice(window.currentIdx, 1);
            window.currentIdx = 0;
            window.autoSave();
            window.refreshUI();
        };

        window.refreshUI = () => {
            document.getElementById('appTitle').value = window.config.appTitle;
            window.renderPageList();
            window.loadPage(window.currentIdx);
        };

        window.renderPageList = () => {
            const list = document.getElementById('pageList');
            list.innerHTML = '';
            window.config.storyPages.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `page-item ${i === window.currentIdx ? 'selected' : ''}`;
                div.innerHTML = `<span>#${i}: ${p.content.substring(0,20)}...</span>`;
                div.onclick = () => window.loadPage(i);
                list.appendChild(div);
            });
        };

        window.loadPage = (i) => {
            window.currentIdx = i;
            const p = window.config.storyPages[i];
            document.getElementById('editorPanel').classList.remove('hidden');
            document.getElementById('pageText').value = p.content;
            window.renderPageList();
        };

        window.updateSimulator = () => {
            const p = window.config.storyPages[window.currentIdx];
            document.getElementById('sim-text').textContent = p ? p.content : "";
        };

        window.togglePlayerMode = () => {
            const v = document.getElementById('player-view');
            v.style.display = v.style.display === 'flex' ? 'none' : 'flex';
            if(v.style.display === 'flex') {
                // Progress betöltése
                const saved = localStorage.getItem('PLAYER_PROGRESS_' + (window.config.cloudId || 'local'));
                let startIdx = 0;
                if(saved) startIdx = parseInt(saved);
                window.pShowPage(startIdx);
            }
        };

        window.pShowPage = (idx) => {
            const p = window.config.storyPages[idx];
            if(!p) return;
            document.getElementById('p-story-text').textContent = p.content;
            const btnContainer = document.getElementById('p-button-container');
            btnContainer.innerHTML = '';
            
            // Mentés
            localStorage.setItem('PLAYER_PROGRESS_' + (window.config.cloudId || 'local'), idx);

            const nextBtn = document.createElement('button');
            nextBtn.className = "p-action-btn";
            nextBtn.textContent = "Tovább";
            nextBtn.onclick = () => window.pShowPage(idx + 1);
            btnContainer.appendChild(nextBtn);
        };

        // AUTH FIGYELŐ
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const isLoggedIn = user && !user.isAnonymous;
            document.getElementById('login-btn').classList.toggle('hidden', isLoggedIn);
            document.getElementById('studio-btn').classList.toggle('hidden', !isLoggedIn);
            
            if(isLoggedIn) {
                if(user.email === 'jatszmabunker@gmail.com') document.getElementById('admin-panel').classList.remove('hidden');
            }
            window.initCommunitySync();
        });

        window.initCommunitySync = () => {
            const list = document.getElementById('community-game-list');
            onSnapshot(collection(db, 'artifacts', 'kalandmotor-v13', 'public', 'data', 'publishedGames'), (snap) => {
                list.innerHTML = '';
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = "glass-card p-6 flex flex-col gap-4";
                    card.innerHTML = `<h3 class="font-bold">${data.title}</h3><button onclick="window.loadGame('${docSnap.id}')" class="bg-purple-600 py-2 rounded-lg text-xs font-bold">PLAY</button>`;
                    list.appendChild(card);
                });
            });
        };

        window.loadGame = async (id) => {
            const snap = await getDoc(doc(db, 'artifacts', 'kalandmotor-v13', 'public', 'data', 'publishedGames', id));
            if(snap.exists()) {
                window.config = snap.data().config;
                window.config.cloudId = id;
                window.togglePlayerMode();
            }
        };

        window.onload = () => {
             console.log("Adventure Engine Ready.");
        };
    </script>
</body>
</html>
