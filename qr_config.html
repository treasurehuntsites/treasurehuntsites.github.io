<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Kód Konfiguráció v3.0 (Hardcoded)</title>
    <!-- Tailwind CSS a stílusokhoz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#4f46e5',
                        'secondary': '#f97316',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4 font-sans">

    <!-- Fő alkalmazás konténer -->
    <div class="w-full max-w-lg bg-white shadow-xl rounded-2xl p-6 space-y-6">
        <h1 class="text-3xl font-bold text-center text-secondary border-b pb-4">QR Kód Konfiguráció (v3.0 - Rögzített Kód)</h1>
        
        <p id="status-message" class="text-center text-sm font-medium text-gray-700 h-10 flex items-center justify-center bg-green-100 rounded-lg p-2 border border-green-300">
            A konfiguráció sikeresen betöltve a kódból.
        </p>

        <!-- Konfigurációs Rész -->
        <div class="space-y-4">
            <p class="text-xs text-red-600 font-semibold p-2 bg-red-100 rounded-lg">
                FIGYELEM: Ez a verzió teljes egészében a HTML kódban rögzített (hardcoded) értékeket használja. A módosításhoz a <span class='font-mono bg-yellow-200 px-1 rounded'>qr_reader.html</span> fájl forráskódját kell szerkesztened!
            </p>

            <div>
                <label for="target-value" class="block text-sm font-medium text-gray-700">Cél QR kód Tartalom:</label>
                <input type="text" id="target-value" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-gray-100 focus:outline-none font-bold" value="0000" readonly>
            </div>

            <div>
                <label for="redirect-url" class="block text-sm font-medium text-gray-700">Siker Esetén Átirányítási URL:</label>
                <input type="url" id="redirect-url" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-gray-100 focus:outline-none font-bold" value="https://siker.example.com/nyeremeny" readonly>
            </div>

            <button class="w-full py-3 bg-gray-400 text-white font-semibold rounded-lg shadow-md cursor-not-allowed">
                Mentés (Kikapcsolva a Rögzített Kód miatt)
            </button>
        </div>

    </div>
</body>
</html>
