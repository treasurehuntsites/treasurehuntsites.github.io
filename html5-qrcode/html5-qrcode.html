<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Kód Olvasó és Titkos Kulcs Ellenőrző</title>
    <!-- Tailwind CSS CDN a szép és reszponzív stílushoz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter betűtípus beállítása -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
        }
        /* Egyedi stílus a videó konténerhez */
        #reader {
            width: 100%;
            max-width: 400px;
            margin: auto;
            border: 4px solid #3b82f6;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
    <!-- html5-qrcode könyvtár a QR-kód olvasáshoz -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Fő alkalmazás konténer -->
    <div class="w-full max-w-lg bg-white p-6 md:p-8 rounded-xl shadow-2xl space-y-6">
        
        <header class="text-center">
            <h1 class="text-3xl font-bold text-gray-900">QR Kód Ellenőrző</h1>
            <p class="mt-2 text-gray-500">Olvasson be egy QR kódot a titkos kulcs ellenőrzéséhez.</p>
        </header>

        <!-- A QR-kód olvasó megjelenítési területe -->
        <div id="reader"></div>

        <!-- Állapotüzenet megjelenítése -->
        <div id="status-message" class="text-center p-3 rounded-lg font-medium transition-all duration-300 bg-blue-100 text-blue-700">
            Kamera betöltése...
        </div>

        <div class="mt-4 text-sm text-gray-400 text-center">
            <p>A működéshez engedélyeznie kell a kamera hozzáférést.</p>
            <p>Titkos kulcs: <span id="secret-display" class="font-mono text-xs">A kód látható a JavaScript kódban.</span></p>
        </div>
    </div>

    <script>
        // --- KONFIGURÁCIÓS VÁLTOZÓK ---
        // A szöveg, amivel a QR-kód tartalmát összehasonlítjuk.
        const SECRET_CODE = "TITKOS_ENGEDELYEZO_KULCS_2024";
        
        // Az URL, ahová a felhasználót átirányítjuk, ha az egyezés sikeres.
        const REDIRECT_URL = "https://www.google.com/search?q=sikeres+ellenorzes";
        
        // Várjon az átirányítással ennyi másodpercet (felhasználói élmény javítása)
        const REDIRECT_DELAY_MS = 2000;
        // ------------------------------

        const html5QrCode = new Html5Qrcode("reader");
        const statusMessageEl = document.getElementById("status-message");
        const secretDisplayEl = document.getElementById("secret-display");

        // A futás idején használt beállítások
        const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            // Előnyben részesítjük a hátsó kamerát mobileszközön
            facingMode: "environment" 
        };

        /**
         * Kezeli a sikeres beolvasást (amikor egy QR kódot dekódoltunk).
         * @param {string} decodedText - A beolvasott QR kód tartalma.
         */
        function onScanSuccess(decodedText) {
            // A kód leállítása, hogy ne olvasson be folyamatosan
            html5QrCode.stop().then((ignore) => {
                console.log("QR Code olvasás leállítva.");
            }).catch((err) => {
                console.error("Hiba az olvasó leállításakor:", err);
            });

            // 1. Állapot frissítése
            statusMessageEl.className = "text-center p-3 rounded-lg font-medium transition-all duration-300 bg-yellow-100 text-yellow-700";
            statusMessageEl.innerHTML = `Sikeresen beolvasva: <b>${decodedText}</b>. Ellenőrzés...`;

            // 2. Összehasonlítás
            if (decodedText.trim() === SECRET_CODE) {
                // Egyezés sikeres
                statusMessageEl.className = "text-center p-3 rounded-lg font-medium transition-all duration-300 bg-green-100 text-green-700";
                statusMessageEl.innerHTML = `Kód EGYEZIK! Átirányítás ${REDIRECT_DELAY_MS / 1000} másodperc múlva ide: <b>${REDIRECT_URL}</b>`;
                
                console.log(`Siker! Átirányítás: ${REDIRECT_URL}`);
                
                // Átirányítás késleltetése a felhasználói élmény érdekében
                setTimeout(() => {
                    window.location.href = REDIRECT_URL;
                }, REDIRECT_DELAY_MS);

            } else {
                // Egyezés sikertelen
                statusMessageEl.className = "text-center p-3 rounded-lg font-medium transition-all duration-300 bg-red-100 text-red-700";
                statusMessageEl.innerHTML = `Kód NEM EGYEZIK. Várt kulcs: ${SECRET_CODE.substring(0, 5)}... Próbálja újra 5 másodperc múlva.`;
                
                console.warn(`Sikertelen egyezés. Beolvasott: "${decodedText}", Várt: "${SECRET_CODE}"`);

                // Újraindítás 5 másodperc múlva
                setTimeout(startScanner, 5000);
            }
        }

        /**
         * Kezeli a beolvasási hibákat (pl. ha a kamera nem lát QR kódot).
         * @param {string} errorMessage - A hibaüzenet.
         */
        function onScanError(errorMessage) {
            // Nem kell folyamatosan hibaüzenetet kiírni, csak csendben folytatjuk az olvasást
            // console.error("Olvasási hiba:", errorMessage);
        }

        /**
         * Inicializálja és elindítja a QR kód olvasót.
         */
        async function startScanner() {
            try {
                // Megpróbáljuk elindítani az olvasót a kamera kiválasztása nélkül
                // A rendszer automatikusan kéri az engedélyt és kiválaszt egy kamerát
                await html5QrCode.start(
                    { facingMode: "environment" }, // Próbáljuk a környezeti kamerát mobileszközön
                    config, 
                    onScanSuccess, 
                    onScanError
                );
                statusMessageEl.className = "text-center p-3 rounded-lg font-medium transition-all duration-300 bg-blue-100 text-blue-700";
                statusMessageEl.innerHTML = "QR Kód Olvasó Elindítva. Keresés...";
                console.log("QR Kód Olvasó sikeresen elindult.");

            } catch (err) {
                // Kamera hozzáférési hiba kezelése
                statusMessageEl.className = "text-center p-3 rounded-lg font-medium transition-all duration-300 bg-red-500 text-white";
                statusMessageEl.innerHTML = "HIBA: Nem sikerült elérni a kamerát. Ellenőrizze az engedélyeket!";
                console.error("Kamera indítási hiba:", err);
            }
        }

        // Indítsa el az olvasót az oldal betöltése után
        window.onload = startScanner;
    </script>
</body>
</html>
