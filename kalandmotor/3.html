<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaland Játék Stúdió</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Play', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        /* Views */
        .app-view { display: none; height: 100%; overflow-y: auto; }
        .app-view.active { display: block; }

        #studio-view { padding: 2.5rem; }
        #home-view { padding: 2.5rem; }

        .glass-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            border-radius: 1rem; 
        }
        .input-style { 
            background: #0f172a; 
            color: #22d3ee; 
            border: 1px solid #334155; 
            border-radius: 0.5rem; 
            padding: 0.6rem; 
            outline: none; 
            transition: 0.2s; 
            width: 100%; 
        }
        .input-style:focus { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; }
        .page-item.selected { border-color: #22d3ee; background: #4c1d95; }
        .handle { cursor: grab; padding-right: 15px; color: #64748b; font-size: 0.9rem; }

        @keyframes fadeInOutSplash {
            0% { opacity: 0; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
            90% { opacity: 0; transform: scale(1.02); }
            100% { opacity: 0; }
        }
        .splash-text-anim {
            font-family: 'Special Elite', cursive;
            animation: fadeInOutSplash 10s ease-in-out forwards;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .avatar-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 0.75rem;
            display: grid;
            grid-template-columns: 45px 1fr 1fr 40px auto;
            gap: 10px;
            align-items: center;
        }

        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s ease-in-out; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { position: relative; background: rgba(0,0,0,0.94); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 35px; min-height: 220px; display: flex; flex-direction: column; }
        .sim-avatar { position: absolute; top: -40px; left: 10px; width: 65px; height: 65px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; }
        .sim-btn { flex: 1; background: #8b5cf6; color: white; padding: 12px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.05rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .sim-bottom-bar { height: 65px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; }

        #player-view { position: fixed; inset: 0; z-index: 4000; background: #000; display: none; flex-direction: column; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; }
        #p-content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        
        .p-dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 40px; min-height: 250px; display: flex; flex-direction: column; }
        .p-avatar-frame { position: absolute; top: -40px; left: 10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; }
        
        .p-action-btn { flex: 1; background: #8b5cf6; color: white; padding: 16px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.25rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        
        .p-bottom-nav { height: 75px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .p-nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; transition: color 0.3s; }
        .p-nav-item.active { color: #8b5cf6; }
        
        #save-indicator { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; font-size: 0.75rem; font-weight: bold; display: none; z-index: 1000; }
        #notification-box { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid #8b5cf6; color: white; padding: 0.8rem 1.5rem; border-radius: 1rem; font-size: 0.9rem; display: none; z-index: 10000; }

        .view-toggle-btn {
            position: fixed; top: 1.5rem; right: 1.5rem; z-index: 6000;
            background: #8b5cf6; color: white; padding: 0.75rem 1.25rem;
            border-radius: 0.75rem; font-weight: 800; font-size: 0.75rem;
            text-transform: uppercase; cursor: pointer; border: none;
            display: flex; align-items: center; gap: 8px;
        }

        .game-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 1rem; padding: 1.5rem;
            transition: all 0.3s; cursor: pointer;
            display: flex; flex-direction: column; gap: 1rem;
        }
        .game-card:hover { transform: translateY(-5px); background: rgba(139, 92, 246, 0.1); border-color: #8b5cf6; }
    </style>
</head>
<body>
    <div id="save-indicator"><i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...</div>
    <div id="notification-box"></div>

    <button id="main-view-toggle" class="view-toggle-btn hidden" onclick="switchToView('home')">
        <i class="fa fa-home"></i> <span>Főoldal</span>
    </button>

    <!-- Home View -->
    <div id="home-view" class="app-view active">
        <div class="max-w-6xl mx-auto">
            <header class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
                <div>
                    <h1 class="text-5xl font-bold uppercase tracking-tighter text-white">Kalandmotor</h1>
                    <p class="text-cyan-400 text-sm mt-2 font-bold tracking-widest uppercase">Fedezd fel vagy készítsd el saját kalandodat</p>
                </div>
                <div id="auth-actions" class="flex gap-4"></div>
            </header>

            <section class="mb-12">
                <div class="flex items-center gap-3 mb-6">
                    <i class="fa fa-globe text-purple-500 text-2xl"></i>
                    <h2 class="text-2xl font-bold uppercase tracking-tight">Kalandok Könyvtára</h2>
                </div>
                <div id="public-games-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <p class="text-slate-500 italic">Betöltés...</p>
                </div>
            </section>

            <section id="my-games-section" class="hidden">
                <div class="flex items-center gap-3 mb-6">
                    <i class="fa fa-user-circle text-cyan-500 text-2xl"></i>
                    <h2 class="text-2xl font-bold uppercase tracking-tight">Saját Világok</h2>
                </div>
                <div id="my-games-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>
        </div>
    </div>

    <!-- Studio View -->
    <div id="studio-view" class="app-view">
        <div class="max-w-7xl mx-auto">
            <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex items-center gap-4">
                    <button onclick="switchToView('home')" class="bg-slate-800 p-3 rounded-xl hover:bg-slate-700 transition">
                        <i class="fa fa-chevron-left"></i>
                    </button>
                    <div>
                        <h1 class="text-4xl font-bold uppercase tracking-tighter text-white">Stúdió</h1>
                        <p class="text-cyan-400 text-sm mt-1">Szerkesztő Mód</p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button onclick="saveToCloud(true)" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-indigo-500 transition-colors flex items-center gap-2">
                        <i class="fa fa-cloud-upload-alt"></i> Publikálás
                    </button>
                    <button onclick="togglePlayerPreview()" class="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-emerald-500 transition-colors">Tesztelés</button>
                </div>
            </header>

            <div class="flex flex-col lg:flex-row gap-10">
                <div class="flex-1 space-y-8">
                    <div class="glass-card p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-4">
                            <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Alapbeállítások</h3>
                            <input type="text" id="appTitle" class="input-style" placeholder="Kaland címe" oninput="autoSave()">
                            <input type="url" id="globalBg" class="input-style" placeholder="Globális Háttér URL" oninput="autoSave()">
                        </div>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Avatarok</h3>
                                <button onclick="addAvatar()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ</button>
                            </div>
                            <div id="avatarList" class="space-y-2 max-h-48 overflow-y-auto pr-2"></div>
                        </div>
                    </div>

                    <div class="glass-card p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Jelenetek</h3>
                            <button onclick="addPage()" class="bg-purple-600 px-4 py-2 rounded-lg text-[10px] font-bold">+ ÚJ OLDAL</button>
                        </div>
                        <div id="pageList" class="max-h-60 overflow-y-auto pr-2 space-y-1"></div>
                    </div>

                    <div id="editorPanel" class="glass-card p-8 space-y-6 hidden border-t-4 border-t-cyan-500">
                        <textarea id="pageText" rows="5" class="input-style text-base" placeholder="Írd ide a történetet..." oninput="autoSave()"></textarea>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                            <select id="pageType" class="input-style text-xs" onchange="autoSave();">
                                <option value="story">Leírás</option>
                                <option value="choice">Választás</option>
                            </select>
                            <input type="number" id="nextIdx" class="input-style text-xs" placeholder="Tovább ID" oninput="autoSave()">
                            <input type="url" id="pageBg" class="input-style text-xs" placeholder="Egyedi háttér URL" oninput="autoSave()">
                        </div>
                    </div>
                </div>

                <div class="w-full lg:w-auto flex justify-center">
                    <div class="sim-container">
                        <div id="sim-viewport">
                            <img id="sim-bg" src="">
                            <div id="sim-content">
                                <div id="sim-main-box" class="sim-box">
                                    <img id="sim-avatar" class="sim-avatar" src="">
                                    <div id="sim-actual-text" class="text-sm"></div>
                                    <div id="sim-actions" class="mt-4"></div>
                                </div>
                            </div>
                        </div>
                        <div class="sim-bottom-bar">
                            <button class="text-slate-500" onclick="resetSim()"><i class="fa fa-undo"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Player View -->
    <div id="player-view">
        <div class="relative h-full w-full">
            <img id="p-bg-layer" class="absolute inset-0 w-full h-full object-cover" src="">
            <div id="p-content-layer" class="h-full flex flex-col justify-end">
                <div class="p-dialog-box">
                    <img id="p-avatar-img" class="p-avatar-frame" src="">
                    <div id="p-story-text" class="text-xl font-bold mb-6"></div>
                    <div id="p-button-container" class="mt-auto flex flex-col gap-3"></div>
                </div>
            </div>
        </div>
        <div class="p-bottom-nav">
            <button class="p-nav-item" onclick="switchToView('home')"><i class="fa fa-sign-out-alt"></i></button>
        </div>
    </div>

    <!-- Firebase System -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, getDocs, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kalandmotor-canvas';
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user = null;
        let unsubscribeUserGames = null;

        // RULE 3: Auth First
        const initAuth = async () => {
            try {
                if (initialToken) await signInWithCustomToken(auth, initialToken);
                else await signInAnonymously(auth);
            } catch (err) { console.error("Auth hiba:", err); }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            updateAuthUI();
            if (user) {
                loadPublicGames();
                listenToUserGames();
            }
        });

        function updateAuthUI() {
            const container = document.getElementById('auth-actions');
            if (user) {
                container.innerHTML = `
                    <button onclick="createNewGame()" class="bg-purple-600 px-6 py-2.5 rounded-xl font-bold text-xs uppercase hover:bg-purple-500 transition">
                        <i class="fa fa-plus mr-2"></i> Új Projekt
                    </button>
                `;
                document.getElementById('my-games-section').classList.remove('hidden');
            }
        }

        async function loadPublicGames() {
            if (!auth.currentUser) return;
            try {
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'games');
                const snap = await getDocs(q);
                const list = document.getElementById('public-games-list');
                list.innerHTML = '';
                if (snap.empty) { list.innerHTML = '<p class="text-slate-500 italic">Nincsenek publikus játékok.</p>'; return; }
                snap.forEach(docSnap => list.appendChild(createGameCard(docSnap.id, docSnap.data(), true)));
            } catch (err) { console.error(err); }
        }

        function listenToUserGames() {
            if (!user) return;
            const q = collection(db, 'artifacts', appId, 'users', user.uid, 'games');
            unsubscribeUserGames = onSnapshot(q, (snap) => {
                const list = document.getElementById('my-games-list');
                list.innerHTML = '';
                snap.forEach(docSnap => list.appendChild(createGameCard(docSnap.id, docSnap.data(), false)));
            });
        }

        function createGameCard(id, data, isPublic) {
            const div = document.createElement('div');
            div.className = 'game-card';
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <h3 class="font-bold text-xl text-white truncate">${data.title}</h3>
                    <span class="text-[10px] text-cyan-400 font-bold uppercase">${isPublic ? 'Könyvtár' : 'Vázlat'}</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="playGame('${id}', ${isPublic})" class="flex-1 bg-purple-600 py-2 rounded font-bold text-xs">INDÍTÁS</button>
                    ${!isPublic ? `<button onclick="editGame('${id}')" class="bg-slate-800 p-2 rounded text-xs"><i class="fa fa-pen"></i></button>` : ''}
                </div>
            `;
            return div;
        }

        window.saveToCloud = async (publish = false) => {
            if (!user) return;
            const title = document.getElementById('appTitle').value.trim() || "Névtelen Kaland";
            const payload = {
                title: title, authorId: user.uid, authorName: user.displayName || user.email || "Kalandmester",
                config: window.config, updatedAt: serverTimestamp()
            };
            try {
                document.getElementById('save-indicator').style.display = 'block';
                if (!window.currentGameId) {
                    const newDoc = await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'games'), payload);
                    window.currentGameId = newDoc.id;
                } else {
                    await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'games', window.currentGameId), payload, { merge: true });
                }
                if (publish) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'games', window.currentGameId), payload, { merge: true });
                    window.showNotification("Kaland publikálva!");
                }
                setTimeout(() => document.getElementById('save-indicator').style.display = 'none', 1000);
            } catch (err) { console.error(err); document.getElementById('save-indicator').style.display = 'none'; }
        };

        window.editGame = async (id) => {
            if (!user) return;
            const snap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'games', id));
            if (snap.exists()) {
                window.config = snap.data().config;
                window.currentGameId = id;
                switchToView('studio');
                refreshStudioUI();
                loadPage(0);
            }
        };

        window.playGame = async (id, isPublic) => {
            const path = isPublic 
                ? doc(db, 'artifacts', appId, 'public', 'data', 'games', id)
                : doc(db, 'artifacts', appId, 'users', user.uid, 'games', id);
            const snap = await getDoc(path);
            if (snap.exists()) {
                window.config = snap.data().config;
                switchToView('player');
                pSimIdx = 0; pUpdateUI();
            }
        };

        initAuth();
    </script>

    <script>
        // Engine Logic
        let currentIdx = 0, pSimIdx = 0, saveTimeout;
        window.config = { appTitle: "Új Kaland", storyPages: [], avatars: [] };
        window.currentGameId = null;

        function switchToView(id) {
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            document.getElementById(id + '-view').classList.add('active');
            document.getElementById('main-view-toggle').classList.toggle('hidden', id === 'home');
        }

        function createNewGame() {
            window.config = { appTitle: "Új Kaland", storyPages: [{content: "A kaland kezdődik...", pageType: "story"}], avatars: [] };
            window.currentGameId = null;
            switchToView('studio');
            refreshStudioUI();
            loadPage(0);
        }

        function loadPage(i) {
            currentIdx = i; const p = window.config.storyPages[i]; if(!p) return;
            document.getElementById('editorPanel').classList.remove('hidden');
            document.getElementById('pageText').value = p.content || "";
            document.getElementById('pageType').value = p.pageType || 'story';
            document.getElementById('nextIdx').value = p.nextIdx || "";
            document.getElementById('pageBg').value = p.pageBg || "";
            renderPageList(); updateSimulator();
        }

        function addPage() {
            window.config.storyPages.push({content: "Új jelenet...", pageType: "story"});
            loadPage(window.config.storyPages.length - 1);
            autoSave();
        }

        function addAvatar() {
            window.config.avatars.push({id: 'A', name: 'Új Karakter', url: ''});
            renderAvatarAdmin(); autoSave();
        }

        function autoSave() {
            clearTimeout(saveTimeout);
            const p = window.config.storyPages[currentIdx];
            if(p) {
                p.content = document.getElementById('pageText').value;
                p.pageType = document.getElementById('pageType').value;
                p.nextIdx = document.getElementById('nextIdx').value;
                p.pageBg = document.getElementById('pageBg').value;
            }
            window.config.appTitle = document.getElementById('appTitle').value;
            window.config.globalBg = document.getElementById('globalBg').value;
            saveTimeout = setTimeout(() => { renderPageList(); updateSimulator(); }, 500);
        }

        function renderPageList() {
            const list = document.getElementById('pageList'); list.innerHTML = '';
            window.config.storyPages.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `page-item ${i === currentIdx ? 'selected' : ''}`;
                div.innerHTML = `<span onclick="loadPage(${i})" class="cursor-pointer">#${i}: ${p.content.substring(0, 20)}</span>`;
                list.appendChild(div);
            });
        }

        function renderAvatarAdmin() {
            const list = document.getElementById('avatarList'); list.innerHTML = '';
            window.config.avatars.forEach((av, i) => {
                const div = document.createElement('div'); div.className = "avatar-card text-xs";
                div.innerHTML = `<span>${av.id}</span><input class="input-style p-1" value="${av.name}" oninput="window.config.avatars[${i}].name=this.value;autoSave()">`;
                list.appendChild(div);
            });
        }

        function updateSimulator() {
            const p = window.config.storyPages[currentIdx]; if(!p) return;
            document.getElementById('sim-bg').src = p.pageBg || window.config.globalBg || "";
            document.getElementById('sim-actual-text').textContent = p.content;
            const acts = document.getElementById('sim-actions'); acts.innerHTML = '';
            const btn = document.createElement('button'); btn.className = "sim-btn"; btn.textContent = "TOVÁBB";
            acts.appendChild(btn);
        }

        function pUpdateUI() {
            const p = window.config.storyPages[pSimIdx]; if(!p) return;
            document.getElementById('p-bg-layer').src = p.pageBg || window.config.globalBg || "";
            document.getElementById('p-story-text').textContent = p.content;
            const container = document.getElementById('p-button-container'); container.innerHTML = '';
            const btn = document.createElement('button'); btn.className = "p-action-btn"; btn.textContent = "TOVÁBB";
            btn.onclick = () => { pSimIdx++; pUpdateUI(); };
            container.appendChild(btn);
        }

        function resetSim() { currentIdx = 0; loadPage(0); }
        function togglePlayerPreview() { pSimIdx = 0; switchToView('player'); pUpdateUI(); }
        function refreshStudioUI() {
            document.getElementById('appTitle').value = window.config.appTitle;
            document.getElementById('globalBg').value = window.config.globalBg;
            renderAvatarAdmin();
        }
    </script>
</body>
</html>
