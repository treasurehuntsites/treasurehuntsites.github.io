<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Tracker & Redirector - GitHub Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 1rem;
        }
        .input-field {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 0.75rem;
            border-radius: 0.5rem;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: #38bdf8;
        }
        .btn-primary {
            background: #0284c7;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: background 0.2s;
            cursor: pointer;
        }
        .btn-primary:hover {
            background: #0369a1;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- ÁTIRÁNYÍTÁSI RÉTEG -->
    <div id="redirecting-ui" class="fixed inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center hidden">
        <div class="text-4xl text-sky-500 mb-4">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
        </div>
        <h2 class="text-2xl font-bold mb-2">Átirányítás folyamatban...</h2>
        <p class="text-slate-400" id="redirect-target-text"></p>
    </div>

    <!-- VEZÉRLŐPULT UI -->
    <div id="dashboard-ui" class="max-w-5xl mx-auto space-y-8">
        <header class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-white">Link Tracker <span class="text-sky-500">Pro</span></h1>
                <p class="text-slate-400">Firebase alapú látogatás-naplózó és átirányító</p>
            </div>
            <div id="status-badge" class="px-3 py-1 rounded-full bg-slate-800 text-xs font-mono text-slate-400 border border-slate-700">
                <i class="fa-solid fa-circle text-red-500 mr-2" id="status-icon"></i> <span id="status-text">Csatlakozás...</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- BEÁLLÍTÁSOK -->
            <div class="lg:col-span-1 space-y-6">
                <div class="glass-card p-6 shadow-xl">
                    <h2 class="text-xl font-bold mb-4 flex items-center">
                        <i class="fa-solid fa-link mr-2 text-sky-500"></i> Új Link Generálása
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Oldal neve (Azonosító)</label>
                            <input type="text" id="page-id-input" class="input-field" placeholder="Pl: Facebook_Kampany_01">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Átirányítási URL</label>
                            <input type="url" id="target-url-input" class="input-field" placeholder="https://pelda.hu">
                        </div>
                        <button id="generate-btn" class="btn-primary w-full">
                            <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Link generálása
                        </button>
                    </div>
                </div>

                <div id="result-card" class="glass-card p-6 shadow-xl hidden border-sky-500/30">
                    <h3 class="text-sm font-bold uppercase text-sky-400 mb-2">Generált követő link:</h3>
                    <div class="flex gap-2">
                        <input type="text" id="generated-link" class="input-field text-xs bg-slate-900" readonly>
                        <button onclick="copyLink()" class="p-2 bg-slate-700 rounded hover:bg-slate-600">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-500 mt-2">Ezt a linket oszd meg a követéshez.</p>
                </div>
            </div>

            <!-- NAPLÓ TÁBLÁZAT -->
            <div class="lg:col-span-2">
                <div class="glass-card p-6 shadow-xl min-h-[400px]">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold flex items-center">
                            <i class="fa-solid fa-list-check mr-2 text-emerald-500"></i> Látogatási Napló
                        </h2>
                        <button onclick="clearLogs()" class="text-xs text-red-400 hover:text-red-300 transition-colors uppercase font-bold">
                            <i class="fa-solid fa-trash-can mr-1"></i> Napló ürítése
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="text-slate-500 border-b border-slate-700">
                                <tr>
                                    <th class="pb-3 font-semibold">Időpont</th>
                                    <th class="pb-3 font-semibold">Oldal Név</th>
                                    <th class="pb-3 font-semibold">Cél URL</th>
                                    <th class="pb-3 font-semibold">Eszköz</th>
                                </tr>
                            </thead>
                            <tbody id="log-table-body" class="divide-y divide-slate-800">
                                <!-- A bejegyzések ide kerülnek -->
                            </tbody>
                        </table>
                        <div id="no-logs" class="py-20 text-center text-slate-600 hidden">
                            <i class="fa-solid fa-inbox text-4xl mb-3"></i>
                            <p>Még nincs rögzített látogatás.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ÉRTESÍTÉS -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full bg-emerald-600 text-white font-bold shadow-2xl transition-all opacity-0 translate-y-10 pointer-events-none">
        Üzenet
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, getDocs, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // --- MANUÁLIS FIREBASE KONFIGURÁCIÓ (GitHub-hoz) ---
        const fbCfg = {
            apiKey: "AIzaSyCfVce17Yye6jyvpSSoW6jlh3ei7T0N618",
            authDomain: "kalandmotor.firebaseapp.com",
            projectId: "kalandmotor",
            storageBucket: "kalandmotor.firebasestorage.app",
            messagingSenderId: "108860908140",
            appId: "1:108860908140:web:5fbec83f4ae7b51487ee49"
        };

        // Fallback: Ha van környezeti változó, azt használja, ha nincs (GitHub), akkor a fenti fbCfg-t
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : fbCfg;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kalandmotor-tracker';

        let user = null;
        let isRedirectHandled = false;

        // --- AUTH INITIALIZATION (RULE 3) ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth hiba:", err);
                showToast("Kapcsolódási hiba!", "red");
            }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                document.getElementById('status-icon').classList.replace('text-red-500', 'text-emerald-500');
                document.getElementById('status-text').textContent = "Online";
                
                if (!isRedirectHandled) {
                    handleUrlParameters();
                    isRedirectHandled = true;
                }
                startLogListener();
            } else {
                document.getElementById('status-icon').classList.replace('text-emerald-500', 'text-red-500');
                document.getElementById('status-text').textContent = "Offline";
            }
        });

        // --- ÁTIRÁNYÍTÁS ÉS NAPLÓZÁS ---
        const handleUrlParameters = async () => {
            if (!user) return; // Rule 3 Guard

            const params = new URLSearchParams(window.location.search);
            const pageId = params.get('pid');
            const targetUrl = params.get('target');

            if (pageId && targetUrl) {
                document.getElementById('dashboard-ui').classList.add('hidden');
                document.getElementById('redirecting-ui').classList.remove('hidden');
                document.getElementById('redirect-target-text').textContent = targetUrl;

                try {
                    // Mentés a kijelölt Firestore útvonalra (Rule 1)
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'access_logs'), {
                        pageId: pageId,
                        targetUrl: targetUrl,
                        timestamp: serverTimestamp(),
                        userAgent: navigator.userAgent,
                        platform: navigator.platform
                    });

                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 1000);

                } catch (error) {
                    console.error("Logolási hiba:", error);
                    window.location.href = targetUrl;
                }
            }
        };

        // --- LINK LÉTREHOZÁSA ---
        document.getElementById('generate-btn').addEventListener('click', () => {
            const pageId = document.getElementById('page-id-input').value.trim();
            const targetUrl = document.getElementById('target-url-input').value.trim();

            if (!pageId || !targetUrl) {
                showToast("Hiányzó adatok!", "red");
                return;
            }

            try {
                new URL(targetUrl);
            } catch (e) {
                showToast("Hibás URL formátum!", "red");
                return;
            }

            const baseUrl = window.location.origin + window.location.pathname;
            const fullLink = `${baseUrl}?pid=${encodeURIComponent(pageId)}&target=${encodeURIComponent(targetUrl)}`;
            
            document.getElementById('generated-link').value = fullLink;
            document.getElementById('result-card').classList.remove('hidden');
            showToast("Sikeres generálás!", "emerald");
        });

        window.copyLink = () => {
            const link = document.getElementById('generated-link');
            link.select();
            document.execCommand('copy');
            showToast("Másolva!", "sky");
        };

        // --- NAPLÓ FIGYELÉSE (Rule 2) ---
        let unsubscribeLogs = null;
        const startLogListener = () => {
            if (!user) return;
            if (unsubscribeLogs) unsubscribeLogs();

            const q = collection(db, 'artifacts', appId, 'public', 'data', 'access_logs');
            
            unsubscribeLogs = onSnapshot(q, (snapshot) => {
                const logs = [];
                snapshot.forEach(doc => logs.push({ id: doc.id, ...doc.data() }));
                
                // Memóriában rendezünk a bonyolult lekérdezések elkerülése végett
                logs.sort((a, b) => {
                    const timeA = a.timestamp?.seconds || 0;
                    const timeB = b.timestamp?.seconds || 0;
                    return timeB - timeA;
                });

                renderLogs(logs);
            }, (error) => {
                console.error("Firestore hiba:", error);
            });
        };

        const renderLogs = (logs) => {
            const container = document.getElementById('log-table-body');
            const noLogs = document.getElementById('no-logs');
            container.innerHTML = '';

            if (logs.length === 0) {
                noLogs.classList.remove('hidden');
                return;
            }
            noLogs.classList.add('hidden');

            logs.forEach(log => {
                const date = log.timestamp ? new Date(log.timestamp.seconds * 1000).toLocaleString('hu-HU') : 'Mentés...';
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-800/40 transition-colors";
                row.innerHTML = `
                    <td class="py-4 text-slate-400 font-mono text-xs">${date}</td>
                    <td class="py-4 font-bold text-sky-400">${log.pageId}</td>
                    <td class="py-4 text-slate-400 truncate max-w-[150px]" title="${log.targetUrl}">${log.targetUrl}</td>
                    <td class="py-4 text-[10px] text-slate-500">${log.platform || 'Ismeretlen'}</td>
                `;
                container.appendChild(row);
            });
        };

        window.clearLogs = async () => {
            if (!user) return;
            if (!confirm("Törlöd a teljes naplót?")) return;
            
            try {
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'access_logs');
                const snapshot = await getDocs(q);
                const deletePromises = snapshot.docs.map(d => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'access_logs', d.id)));
                await Promise.all(deletePromises);
                showToast("Napló ürítve!", "emerald");
            } catch (error) {
                showToast("Hiba a törlésnél!", "red");
            }
        };

        function showToast(msg, color) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-white font-bold shadow-2xl transition-all z-[100] bg-${color}-600`;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 0)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 20px)';
            }, 3000);
        }

        initAuth();
    </script>
</body>
</html>
