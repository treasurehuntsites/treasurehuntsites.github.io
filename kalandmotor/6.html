<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaland Játék Stúdió V11.0 ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Play', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        /* Views */
        .app-view { display: none; height: 100%; overflow-y: auto; }
        .app-view.active { display: block; }

        #studio-view { padding: 2.5rem; }
        #home-view { padding: 2.5rem; }

        .glass-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            border-radius: 1rem; 
        }
        .input-style { 
            background: #0f172a; 
            color: #22d3ee; 
            border: 1px solid #334155; 
            border-radius: 0.5rem; 
            padding: 0.6rem; 
            outline: none; 
            transition: 0.2s; 
            width: 100%; 
        }
        .input-style:focus { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; }
        .page-item.selected { border-color: #22d3ee; background: #4c1d95; }
        .handle { cursor: grab; padding-right: 15px; color: #64748b; font-size: 0.9rem; }

        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s ease-in-out; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { position: relative; background: rgba(0,0,0,0.94); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 35px; min-height: 220px; display: flex; flex-direction: column; }
        .sim-avatar { position: absolute; top: -40px; left: 10px; width: 65px; height: 65px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; }
        .sim-btn { flex: 1; background: #8b5cf6; color: white; padding: 12px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.05rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .sim-bottom-bar { height: 65px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; }

        #player-view { position: fixed; inset: 0; z-index: 4000; background: #000; display: none; flex-direction: column; }
        .p-game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #p-viewport { position: relative; flex-grow: 1; overflow: hidden; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: src 0.5s ease-in-out, opacity 0.5s; }
        #p-content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        
        .p-dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 40px; min-height: 250px; max-height: 70%; display: flex; flex-direction: column; box-shadow: 0 -10px 25px rgba(0,0,0,0.5); }
        .p-avatar-frame { position: absolute; top: -40px; left: 10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .p-action-btn { flex: 1; background: #8b5cf6; color: white; padding: 16px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.25rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .p-bottom-nav { height: 75px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .p-nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; position: relative; transition: color 0.3s; }
        .p-nav-item.active { color: #8b5cf6; }

        #save-indicator { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; font-size: 0.75rem; font-weight: bold; display: none; z-index: 1000; }
        
        .game-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .game-card:hover { transform: translateY(-5px); border-color: #8b5cf6; background: rgba(139, 92, 246, 0.1); }

        #p-zoom-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; align-items: center; justify-content: center; touch-action: none; overflow: hidden; }
        #p-zoom-img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px; transition: transform 0.1s ease-out; cursor: zoom-out; }
        
        /* Modal for deletes */
        #custom-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #1e293b; border: 2px solid #8b5cf6; border-radius: 1.5rem; padding: 2rem; max-width: 400px; width: 90%; text-align: center; }
    </style>
</head>
<body>
    <div id="save-indicator"><i class="fa fa-sync-alt fa-spin mr-2"></i> FELHŐBE MENTÉS...</div>

    <!-- Modals -->
    <div id="custom-modal">
        <div class="modal-box">
            <h3 class="text-xl font-bold mb-4 uppercase">Biztosan törlöd?</h3>
            <p class="text-slate-400 mb-8">Ezt a műveletet nem lehet visszavonni a felhőből.</p>
            <div class="flex gap-4">
                <button id="modal-cancel" class="flex-1 bg-slate-700 p-3 rounded-xl font-bold uppercase text-xs">Mégse</button>
                <button id="modal-confirm" class="flex-1 bg-red-600 p-3 rounded-xl font-bold uppercase text-xs">Törlés</button>
            </div>
        </div>
    </div>

    <!-- Home View -->
    <div id="home-view" class="app-view active">
        <div class="max-w-6xl mx-auto">
            <header class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
                <div>
                    <h1 class="text-5xl font-bold uppercase tracking-tighter text-white">Kalandmotor <span class="text-purple-500 text-3xl">V11</span> ✨</h1>
                    <p class="text-cyan-400 text-sm mt-2 font-bold tracking-widest uppercase">Fedezd fel vagy készítsd el saját történeted</p>
                </div>
                <div id="auth-section" class="flex gap-4 items-center">
                    <!-- Login UI injected here -->
                </div>
            </header>

            <section class="mb-12">
                <div class="flex items-center gap-3 mb-6">
                    <i class="fa fa-globe text-purple-500 text-2xl"></i>
                    <h2 class="text-2xl font-bold uppercase tracking-tight">Publikus Kalandok</h2>
                </div>
                <div id="public-games-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <p class="text-slate-500 italic">Játékok betöltése a felhőből...</p>
                </div>
            </section>

            <section id="user-games-section" class="hidden">
                <div class="flex items-center gap-3 mb-6">
                    <i class="fa fa-user-circle text-cyan-500 text-2xl"></i>
                    <h2 class="text-2xl font-bold uppercase tracking-tight">Saját Munkáim</h2>
                </div>
                <div id="user-games-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- User games injected here -->
                </div>
            </section>
        </div>
    </div>

    <!-- Studio View -->
    <div id="studio-view" class="app-view">
        <div class="max-w-7xl mx-auto">
            <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex items-center gap-4">
                    <button onclick="switchToView('home')" class="bg-slate-800 p-3 rounded-xl hover:bg-slate-700 transition">
                        <i class="fa fa-chevron-left"></i>
                    </button>
                    <div>
                        <h1 class="text-4xl font-bold uppercase tracking-tighter text-white">Stúdió</h1>
                        <p id="game-status-label" class="text-cyan-400 text-sm mt-1">Szerkesztő Mód</p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button onclick="saveGameToCloud(true)" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-indigo-500 transition-colors flex items-center gap-2">
                        <i class="fa fa-cloud-upload-alt"></i> Publikálás
                    </button>
                    <button onclick="togglePlayerPreview()" class="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-emerald-500 transition-colors">Tesztelés</button>
                </div>
            </header>

            <div class="flex flex-col lg:flex-row gap-10">
                <!-- Editor Left -->
                <div class="flex-1 space-y-8">
                    <div class="glass-card p-6 grid grid-cols-1 md:flex-row md:grid-cols-2 gap-6">
                        <div class="space-y-4">
                            <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Alapbeállítások</h3>
                            <input type="text" id="appTitle" class="input-style" placeholder="Kaland címe" oninput="queueAutoSave()">
                            <input type="url" id="globalBg" class="input-style" placeholder="Globális Háttér URL" oninput="queueAutoSave()">
                        </div>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Oldalak</h3>
                                <button onclick="addPage()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ OLDAL</button>
                            </div>
                            <div id="pageList" class="max-h-48 overflow-y-auto pr-2 space-y-1"></div>
                        </div>
                    </div>

                    <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-4">
                                <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Megjelenítés</h3>
                                <input type="url" id="pageImage" class="input-style text-xs" placeholder="Kép URL (illusztráció)" oninput="queueAutoSave()">
                                <input type="url" id="pageBg" class="input-style text-xs" placeholder="Egyedi háttér" oninput="queueAutoSave()">
                            </div>
                            <div class="space-y-4">
                                <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Típus</h3>
                                <select id="pageType" class="input-style text-xs" onchange="updateUI(); queueAutoSave();">
                                    <option value="story">Leírás</option>
                                    <option value="choice">Választás</option>
                                    <option value="qr">QR Kód</option>
                                    <option value="password">Kódzár</option>
                                    <option value="gps">GPS Pont</option>
                                    <option value="splash">Splash</option>
                                </select>
                                <div class="flex gap-2">
                                    <input type="number" id="nextIdx" class="input-style text-xs" placeholder="Tovább ID" oninput="queueAutoSave()">
                                    <input type="number" id="prevIdx" class="input-style text-xs" placeholder="Vissza ID" oninput="queueAutoSave()">
                                </div>
                            </div>
                        </div>
                        <textarea id="pageText" rows="5" class="input-style text-base" placeholder="Történet szövege..." oninput="queueAutoSave()"></textarea>
                    </div>
                </div>

                <!-- Simulator Right -->
                <div class="w-full lg:w-auto flex justify-center">
                    <div class="sim-container">
                        <div id="sim-viewport">
                            <img id="sim-bg" src="">
                            <div id="sim-content">
                                <div class="sim-box">
                                    <div id="sim-scroll" class="overflow-y-auto pr-1 flex-grow scroll-smooth">
                                        <img id="sim-page-img" class="w-full rounded-lg mb-4 hidden" src="">
                                        <div id="sim-actual-text" style="font-size: 15px;"></div>
                                    </div>
                                    <div id="sim-actions" class="mt-4"></div>
                                </div>
                            </div>
                        </div>
                        <div class="sim-bottom-bar">
                            <button class="text-cyan-400"><i class="fa fa-compass"></i></button>
                            <button class="text-slate-500" onclick="resetSim()"><i class="fa-solid fa-undo"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Player View -->
    <div id="player-view">
        <div class="p-game-wrapper">
            <div id="p-viewport">
                <img id="p-bg-layer" src="">
                <div id="p-content-layer">
                    <div class="p-dialog-box">
                        <div id="p-scroll-area" class="overflow-y-auto pr-1 flex-grow">
                            <img id="p-page-illustration" class="w-full rounded-xl mb-4 hidden shadow-xl" src="">
                            <div id="p-story-text" class="text-xl font-bold leading-relaxed"></div>
                        </div>
                        <div id="p-button-container" class="mt-4 flex flex-col gap-3"></div>
                    </div>
                </div>
            </div>
            <div class="p-bottom-nav">
                <button class="p-nav-item active"><i class="fa fa-map-marked-alt"></i></button>
                <button class="p-nav-item" onclick="switchToView('home')"><i class="fa-solid fa-sign-out-alt"></i></button>
            </div>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, getDocs, addDoc, serverTimestamp, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let firebaseConfig = {};
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            } else {
                // Konfiguráció GitHub-on való futtatáshoz
                firebaseConfig = {
                    apiKey: "AIzaSyCfVce17Yye6jyvpSSoW6jlh3ei7T0N618",
                    authDomain: "kalandmotor.firebaseapp.com",
                    projectId: "kalandmotor",
                    storageBucket: "kalandmotor.firebasestorage.app",
                    messagingSenderId: "108860908140",
                    appId: "1:108860908140:web:5fbec83f4ae7b51487ee49"
                };
            }
        } catch (e) {
            console.error("Firebase config hiba:", e);
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kalandmotor-studio-v11';
        
        let app, auth, db, provider;
        if (firebaseConfig.apiKey) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            provider = new GoogleAuthProvider();
        }

        let user = null;
        let config = { appTitle: "Új Kaland", storyPages: [{ content: "Kezdődik a kaland!", pageType: "story" }], globalBg: "" };
        let currentGameId = null;
        let currentIdx = -1;
        let saveTimeout = null;

        if (auth) {
            onAuthStateChanged(auth, (u) => {
                user = u;
                updateAuthUI();
                if (user) {
                    const userGamesSec = document.getElementById('user-games-section');
                    if (userGamesSec) userGamesSec.classList.remove('hidden');
                    loadPublicGames();
                    loadUserGames();
                } else {
                    const userGamesSec = document.getElementById('user-games-section');
                    if (userGamesSec) userGamesSec.classList.add('hidden');
                    loadPublicGames();
                }
            });
        }

        window.loginGoogle = async () => {
            if (!auth) return;
            try { await signInWithPopup(auth, provider); } 
            catch (e) { console.error("Login failed", e); }
        };

        window.loginAnon = async () => {
            if (!auth) return;
            try { await signInAnonymously(auth); } 
            catch (e) { console.error("Anon login failed", e); }
        };

        window.logout = () => auth && signOut(auth);

        function updateAuthUI() {
            const container = document.getElementById('auth-section');
            if (!container) return;

            if (user) {
                container.innerHTML = `
                    <div class="flex flex-col items-end mr-4">
                        <span class="text-white font-bold text-sm">${user.displayName || 'Felfedező'}</span>
                        <button onclick="logout()" class="text-xs text-red-400 uppercase font-bold hover:underline">Kijelentkezés</button>
                    </div>
                    <button onclick="createNewGame()" class="bg-purple-600 px-6 py-2.5 rounded-xl font-bold text-xs uppercase hover:bg-purple-500 transition shadow-lg">
                        <i class="fa fa-plus mr-2"></i> Új Kaland
                    </button>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="loginAnon()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase hover:bg-slate-700 transition">Névtelen belépés</button>
                    <button onclick="loginGoogle()" class="bg-white text-slate-900 px-4 py-2 rounded-xl text-xs font-bold uppercase flex items-center gap-2 hover:bg-slate-100 transition shadow-lg">
                        <i class="fa-brands fa-google text-red-500"></i> Google Login
                    </button>
                `;
            }
        }

        async function loadPublicGames() {
            if (!db) return;
            const list = document.getElementById('public-games-list');
            if (!list) return;
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'games');
            try {
                const snap = await getDocs(q);
                list.innerHTML = snap.empty ? '<p class="text-slate-500 italic">Még nincs publikus kaland.</p>' : '';
                snap.forEach(doc => list.appendChild(createGameCard(doc.id, doc.data(), true)));
            } catch (e) { list.innerHTML = '<p class="text-red-500">Hiba a betöltéskor.</p>'; }
        }

        async function loadUserGames() {
            if (!user || !db) return;
            const list = document.getElementById('user-games-list');
            if (!list) return;
            const q = collection(db, 'artifacts', appId, 'users', user.uid, 'games');
            try {
                const snap = await getDocs(q);
                list.innerHTML = snap.empty ? '<p class="text-slate-500 italic">Még nincs mentett munkád.</p>' : '';
                snap.forEach(doc => list.appendChild(createGameCard(doc.id, doc.data(), false)));
            } catch (e) { console.error(e); }
        }

        function createGameCard(id, data, isPublic) {
            const div = document.createElement('div');
            div.className = 'game-card';
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <h3 class="font-bold text-xl text-white truncate pr-2">${data.title || 'Névtelen'}</h3>
                    <span class="bg-slate-800 text-[10px] px-2 py-1 rounded text-cyan-400 uppercase font-bold">${isPublic ? 'Publikus' : 'Vázlat'}</span>
                </div>
                <p class="text-slate-400 text-xs italic">Készítő: ${data.authorName || 'Ismeretlen'}</p>
                <div class="flex gap-2 mt-auto">
                    <button onclick="playGame('${id}', ${isPublic})" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white text-[10px] font-bold py-2 rounded uppercase shadow-md">Indítás</button>
                    ${(!isPublic || data.authorId === user?.uid) ? `<button onclick="editGame('${id}')" class="flex-1 border border-slate-700 hover:border-purple-500 text-white text-[10px] font-bold py-2 rounded uppercase">Szerkesztés</button>` : ''}
                </div>
            `;
            return div;
        }

        window.createNewGame = () => {
            config = { appTitle: "Új Kaland", storyPages: [{ content: "Kezdődik a kaland!", pageType: "story" }], globalBg: "" };
            currentGameId = null;
            switchToView('studio');
            loadPage(0);
        };

        window.editGame = async (id) => {
            if (!db || !user) return;
            const docSnap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'games', id));
            if (docSnap.exists()) {
                const data = docSnap.data();
                config = data.config;
                currentGameId = id;
                switchToView('studio');
                syncInputsToConfig();
                loadPage(0);
            }
        };

        window.playGame = async (id, isPublic) => {
            if (!db) return;
            const path = isPublic 
                ? doc(db, 'artifacts', appId, 'public', 'data', 'games', id)
                : doc(db, 'artifacts', appId, 'users', user.uid, 'games', id);
            const docSnap = await getDoc(path);
            if (docSnap.exists()) {
                config = docSnap.data().config;
                switchToView('player');
                pLoadPage(0);
            }
        };

        window.saveGameToCloud = async (publish = false) => {
            if (!user || !db) return;
            const saveIndicator = document.getElementById('save-indicator');
            if (saveIndicator) saveIndicator.style.display = 'block';

            const gameData = {
                title: config.appTitle,
                authorId: user.uid,
                authorName: user.displayName || user.email || 'Anonim',
                config: config,
                updatedAt: serverTimestamp(),
                isPublished: publish
            };

            try {
                if (!currentGameId) {
                    const newDoc = await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'games'), gameData);
                    currentGameId = newDoc.id;
                } else {
                    await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'games', currentGameId), gameData, { merge: true });
                }

                if (publish) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'games', currentGameId), gameData, { merge: true });
                }
                
                loadUserGames();
                loadPublicGames();
                setTimeout(() => { if (saveIndicator) saveIndicator.style.display = 'none'; }, 800);
            } catch (err) { 
                console.error(err); 
                if (saveIndicator) saveIndicator.style.display = 'none';
            }
        };

        window.switchToView = (v) => {
            document.querySelectorAll('.app-view').forEach(view => view.classList.remove('active'));
            const targetView = document.getElementById(v + '-view');
            if (targetView) targetView.classList.add('active');
            
            const playerView = document.getElementById('player-view');
            if (playerView) {
                if (v === 'player') playerView.style.display = 'flex';
                else playerView.style.display = 'none';
            }
        };

        function loadPage(i) {
            currentIdx = i;
            const p = config.storyPages[i];
            if(!p) return;
            
            const editorPanel = document.getElementById('editorPanel');
            if (editorPanel) editorPanel.classList.remove('hidden');
            
            document.getElementById('pageText').value = p.content || "";
            document.getElementById('pageType').value = p.pageType || "story";
            document.getElementById('nextIdx').value = p.nextIdx || "";
            document.getElementById('prevIdx').value = p.prevIdx || "";
            document.getElementById('pageImage').value = p.pageImage || "";
            document.getElementById('pageBg').value = p.pageBg || "";
            
            renderPageList();
            updateSimulator();
        }

        window.addPage = () => {
            config.storyPages.push({ content: "Új jelenet...", pageType: "story" });
            loadPage(config.storyPages.length - 1);
            queueAutoSave();
        };

        function renderPageList() {
            const list = document.getElementById('pageList');
            if (!list) return;
            list.innerHTML = '';
            config.storyPages.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `page-item ${i === currentIdx ? 'selected' : ''}`;
                div.innerHTML = `<span onclick="loadPage(${i})" class="truncate text-xs font-bold cursor-pointer uppercase">#${i}: ${p.content.substring(0, 15)}...</span>`;
                list.appendChild(div);
            });
        }

        window.queueAutoSave = () => {
            clearTimeout(saveTimeout);
            const p = config.storyPages[currentIdx];
            if (p) {
                p.content = document.getElementById('pageText').value;
                p.pageType = document.getElementById('pageType').value;
                p.nextIdx = document.getElementById('nextIdx').value;
                p.prevIdx = document.getElementById('prevIdx').value;
                p.pageImage = document.getElementById('pageImage').value;
                p.pageBg = document.getElementById('pageBg').value;
            }
            config.appTitle = document.getElementById('appTitle').value;
            config.globalBg = document.getElementById('globalBg').value;

            updateSimulator();
            if (db && user) {
                saveTimeout = setTimeout(() => saveGameToCloud(false), 2000);
            }
        };

        function syncInputsToConfig() {
            document.getElementById('appTitle').value = config.appTitle;
            document.getElementById('globalBg').value = config.globalBg || "";
        }

        function updateSimulator() {
            const p = config.storyPages[currentIdx];
            if (!p) return;
            document.getElementById('sim-bg').src = p.pageBg || config.globalBg || "";
            document.getElementById('sim-actual-text').textContent = p.content;
            const img = document.getElementById('sim-page-img');
            if (p.pageImage) { img.src = p.pageImage; img.classList.remove('hidden'); }
            else { img.classList.add('hidden'); }
            
            const actions = document.getElementById('sim-actions');
            actions.innerHTML = '';
            if (p.nextIdx !== "" && config.storyPages[p.nextIdx]) {
                const b = document.createElement('button');
                b.className = "sim-btn";
                b.textContent = "TOVÁBB";
                b.onclick = () => { currentIdx = parseInt(p.nextIdx); loadPage(currentIdx); };
                actions.appendChild(b);
            }
        }

        function pLoadPage(i) {
            const p = config.storyPages[i];
            if (!p) return;
            document.getElementById('p-bg-layer').src = p.pageBg || config.globalBg || "";
            document.getElementById('p-story-text').textContent = p.content;
            const ill = document.getElementById('p-page-illustration');
            if (p.pageImage) { ill.src = p.pageImage; ill.classList.remove('hidden'); }
            else { ill.classList.add('hidden'); }
            
            const btnContainer = document.getElementById('p-button-container');
            btnContainer.innerHTML = '';
            if (p.nextIdx !== "" && config.storyPages[p.nextIdx]) {
                const b = document.createElement('button');
                b.className = "p-action-btn";
                b.textContent = "FOLYTATÁS";
                b.onclick = () => pLoadPage(parseInt(p.nextIdx));
                btnContainer.appendChild(b);
            } else {
                const b = document.createElement('button');
                b.className = "p-action-btn bg-slate-700";
                b.textContent = "VÉGE A JÁTÉKNAK";
                b.onclick = () => switchToView('home');
                btnContainer.appendChild(b);
            }
        }

        window.togglePlayerPreview = () => {
            switchToView('player');
            pLoadPage(0);
        };

        window.resetSim = () => loadPage(0);
        window.loadPage = loadPage;
        window.updateUI = () => {};
    </script>
</body>
</html>
