<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalandmotor | Interaktív Stúdió</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #22d3ee;
            --bg-dark: #020617;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Play', sans-serif; 
            background-color: var(--bg-dark);
            color: #f1f5f9;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .special-font { font-family: 'Special Elite', cursive; }
        .logo-glow { text-shadow: 0 0 15px rgba(34, 211, 238, 0.6); }

        /* Views */
        .app-view { display: none; height: 100%; overflow-y: auto; }
        .app-view.active { display: block; }

        .glass-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 1rem; 
        }

        .btn-primary {
            background: linear-gradient(135deg, #0891b2, #0e7490);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.5);
        }

        .input-style { 
            background: #0f172a; 
            color: var(--accent); 
            border: 1px solid #1e293b; 
            border-radius: 0.5rem; 
            padding: 0.6rem; 
            outline: none; 
            transition: 0.2s; 
            width: 100%; 
        }
        .input-style:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(34, 211, 238, 0.2); }
        
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; }
        .page-item.selected { border-color: var(--accent); background: rgba(34, 211, 238, 0.1); }
        .handle { cursor: grab; padding-right: 15px; color: #64748b; }

        /* Simulator UI */
        .sim-container { position: sticky; top: 20px; width: 320px; height: 620px; background: #000; border: 12px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
        .sim-box { position: relative; z-index: 10; background: rgba(0,0,0,0.9); border-top: 2px solid var(--accent); border-radius: 1.5rem 1.5rem 0 0; padding: 20px; min-height: 250px; margin-top: auto; }
        .sim-btn { background: var(--accent); color: #000; padding: 12px; border-radius: 0.75rem; font-weight: 700; text-align: center; width: 100%; border: none; cursor: pointer; text-transform: uppercase; margin-top: 10px; }

        /* Phone UI effect */
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .scan-effect::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: rgba(34, 211, 238, 0.1); animation: scanline 4s linear infinite; pointer-events: none; }

        #save-indicator { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; font-size: 0.75rem; font-weight: bold; display: none; z-index: 10000; }
        #notification-box { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid var(--accent); color: white; padding: 0.8rem 1.5rem; border-radius: 1rem; font-size: 0.9rem; display: none; z-index: 10001; }
    </style>
</head>
<body class="scan-effect">
    <div id="save-indicator"><i class="fa fa-sync-alt fa-spin mr-2"></i> FELHŐ SZINKRONIZÁLÁSA...</div>
    <div id="notification-box"></div>

    <!-- Home View -->
    <div id="home-view" class="app-view active pt-32 px-4 pb-20">
        <nav class="fixed top-0 left-0 w-full z-50 px-6 py-4 glass-card rounded-none border-x-0 border-t-0">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-compass text-cyan-400 text-2xl"></i>
                    <span class="text-2xl font-bold tracking-tighter text-cyan-400 logo-glow uppercase">Kalandmotor</span>
                </div>
                <div id="auth-nav" class="flex items-center gap-4">
                    <!-- Auth UI will be here -->
                </div>
            </div>
        </nav>

        <section class="max-w-7xl mx-auto text-center py-12">
            <h1 class="text-4xl md:text-8xl font-bold mb-8 tracking-tighter uppercase leading-tight">
                Építsd fel a <br>
                <span class="text-cyan-400 special-font logo-glow">Történetedet</span>
            </h1>
            <p class="text-slate-400 text-sm md:text-xl max-w-2xl mx-auto mb-12 leading-relaxed">
                A <strong>Kalandmotor</strong> segítségével kódolás nélkül hozhatsz létre interaktív világokat.
            </p>
            <div class="flex justify-center gap-4">
                <button onclick="createNewGame()" class="btn-primary px-10 py-5 rounded-2xl text-xs font-bold tracking-widest uppercase flex items-center">
                    <i class="fa-solid fa-plus mr-3"></i> Új Projekt
                </button>
            </div>
        </section>

        <section class="max-w-7xl mx-auto py-24 border-t border-white/5">
            <h2 class="text-2xl font-bold uppercase mb-12 tracking-tighter">Kalandok <span class="text-cyan-400">Könyvtára</span></h2>
            <div id="public-games-list" class="grid grid-cols-1 md:grid-cols-3 gap-8 text-left">
                <!-- Games loaded from Firebase -->
            </div>
        </section>

        <section id="my-games-section" class="max-w-7xl mx-auto py-12 border-t border-cyan-500/20 hidden">
            <h2 class="text-2xl font-bold uppercase mb-8 tracking-tighter text-white">Saját <span class="text-cyan-400">Világok</span></h2>
            <div id="user-games-list" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </section>
    </div>

    <!-- Studio View -->
    <div id="studio-view" class="app-view p-8">
        <header class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div class="flex items-center gap-4">
                <button onclick="switchToView('home')" class="bg-slate-800 p-3 rounded-xl hover:bg-slate-700 transition">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <div>
                    <h1 class="text-3xl font-bold uppercase tracking-tighter text-white">Műhely</h1>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                        <p class="text-cyan-400 text-[10px] font-bold tracking-widest uppercase">Szerkesztő Mód</p>
                    </div>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="saveToCloud(true)" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-indigo-500 transition shadow-lg">
                    <i class="fa fa-cloud-upload-alt mr-2"></i> Publikálás
                </button>
                <button onclick="launchPreview()" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-emerald-500 transition">Tesztelés</button>
            </div>
        </header>

        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-10">
            <!-- Left: Editor -->
            <div class="flex-1 space-y-8">
                <!-- Global Config -->
                <div class="glass-card p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <h3 class="text-cyan-400 font-bold uppercase text-[10px] tracking-widest">Projekt adatok</h3>
                        <input type="text" id="appTitle" class="input-style" placeholder="Kaland címe" oninput="autoSave()">
                        <input type="url" id="globalBg" class="input-style" placeholder="Globális Háttér URL" oninput="autoSave()">
                    </div>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-cyan-400 font-bold uppercase text-[10px] tracking-widest">Karakterek</h3>
                            <button onclick="addAvatar()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ</button>
                        </div>
                        <div id="avatarList" class="space-y-2 max-h-40 overflow-y-auto pr-2"></div>
                    </div>
                </div>

                <!-- Scene List -->
                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-cyan-400 font-bold uppercase text-[10px] tracking-widest">Jelenetek</h3>
                        <button onclick="addPage()" class="btn-primary px-4 py-2 rounded-lg text-[10px] font-bold">+ ÚJ JELENET</button>
                    </div>
                    <div id="pageList" class="max-h-48 overflow-y-auto pr-2 space-y-1"></div>
                </div>

                <!-- Page Editor -->
                <div id="editorPanel" class="glass-card p-8 space-y-6 hidden border-t-4 border-t-cyan-500">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-bold text-white uppercase">Szerkesztés: #<span id="curIdxDisp">0</span></h3>
                        <button onclick="deletePage()" class="text-red-500 text-xs font-bold uppercase hover:underline">Törlés</button>
                    </div>
                    
                    <textarea id="pageText" rows="5" class="input-style text-base" placeholder="Írd ide a történetet..." oninput="autoSave()"></textarea>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="text-[9px] font-bold text-slate-500 uppercase block mb-1">Típus</label>
                            <select id="pageType" class="input-style text-xs" onchange="handleTypeChange()">
                                <option value="story">Leírás</option>
                                <option value="choice">Választás</option>
                                <option value="qr">QR Kód</option>
                                <option value="password">Számkód</option>
                                <option value="gps">GPS Pont</option>
                                <option value="call">Telefonhívás</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[9px] font-bold text-slate-500 uppercase block mb-1">Következő Jelenet</label>
                            <input type="number" id="nextIdx" class="input-style text-xs" placeholder="ID" oninput="autoSave()">
                        </div>
                        <div>
                            <label class="text-[9px] font-bold text-slate-500 uppercase block mb-1">Egyedi Háttér</label>
                            <input type="url" id="pageBg" class="input-style text-xs" placeholder="URL" oninput="autoSave()">
                        </div>
                    </div>

                    <!-- Conditional Editors -->
                    <div id="sub-editors" class="pt-4 border-t border-white/5 space-y-4">
                        <div id="choice-editor" class="hidden">
                            <div class="flex justify-between items-center mb-2">
                                <h4 class="text-[10px] font-bold text-cyan-400 uppercase">Választási lehetőségek</h4>
                                <button onclick="addChoice()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ GOMB</button>
                            </div>
                            <div id="choices-container" class="space-y-2"></div>
                        </div>
                        <div id="password-editor" class="hidden">
                            <label class="text-[9px] font-bold text-slate-500 uppercase block mb-1">Helyes Kód</label>
                            <input type="text" id="pagePassword" class="input-style text-sm" oninput="autoSave()">
                        </div>
                        <div id="qr-editor" class="hidden">
                            <label class="text-[9px] font-bold text-slate-500 uppercase block mb-1">QR Kód Tartalma</label>
                            <input type="text" id="pageQrCode" class="input-style text-sm" oninput="autoSave()">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Simulator -->
            <div class="w-full lg:w-auto flex justify-center">
                <div class="sim-container">
                    <div id="sim-viewport">
                        <img id="sim-bg" src="">
                        <div id="sim-content">
                            <div class="sim-box">
                                <img id="sim-avatar" class="w-16 h-16 rounded-full border-2 border-cyan-400 absolute -top-8 left-4 hidden" src="">
                                <div id="sim-actual-text" class="text-xs text-slate-300 mb-4 leading-relaxed"></div>
                                <div id="sim-actions"></div>
                            </div>
                        </div>
                    </div>
                    <div class="sim-bottom-bar">
                        <button class="text-cyan-400" onclick="resetSim()"><i class="fa fa-undo"></i></button>
                        <button class="text-slate-500"><i class="fa fa-suitcase"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Player View -->
    <div id="player-view" class="app-view bg-black">
        <div class="relative h-full w-full flex flex-col justify-end">
            <img id="p-bg" class="absolute inset-0 w-full h-full object-cover opacity-60" src="">
            <div class="relative z-10 p-8 md:p-16 max-w-4xl mx-auto w-full">
                <div id="p-text" class="text-2xl md:text-5xl font-bold text-white mb-12 drop-shadow-lg"></div>
                <div id="p-actions" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
            <div class="absolute bottom-0 left-0 w-full h-20 bg-gradient-to-t from-black flex justify-around items-center px-10">
                <button onclick="switchToView('home')" class="text-slate-500 hover:text-white transition text-xl"><i class="fa fa-times"></i></button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, getDocs, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kalandmotor-v3';
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user = null;
        let unsubscribeUserGames = null;

        // AUTH INITIALIZATION (RULE 3)
        const initAuth = async () => {
            try {
                if (initialToken) await signInWithCustomToken(auth, initialToken);
                else await signInAnonymously(auth);
            } catch (err) { console.error("Auth hiba:", err); }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            updateAuthUI();
            if (user) {
                loadPublicGames();
                listenToUserGames();
            }
        });

        function updateAuthUI() {
            const nav = document.getElementById('auth-nav');
            if (user) {
                nav.innerHTML = `
                    <div class="text-right hidden sm:block">
                        <span class="text-cyan-400 font-bold block text-[10px] uppercase tracking-widest">${(user.displayName || user.email || 'Mester').substring(0,10)}</span>
                    </div>
                    <button onclick="logout()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 border border-white/5"><i class="fa fa-power-off text-xs"></i></button>
                `;
                document.getElementById('my-games-section').classList.remove('hidden');
            }
        }

        async function loadPublicGames() {
            if (!auth.currentUser) return;
            try {
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'games');
                const snap = await getDocs(q);
                const list = document.getElementById('public-games-list');
                list.innerHTML = '';
                if (snap.empty) {
                    list.innerHTML = '<p class="col-span-full text-center text-slate-600 italic">Nincs publikus tartalom.</p>';
                }
                snap.forEach(docSnap => list.appendChild(createGameCard(docSnap.id, docSnap.data(), true)));
            } catch (err) { console.error(err); }
        }

        function listenToUserGames() {
            if (!user) return;
            const q = collection(db, 'artifacts', appId, 'users', user.uid, 'games');
            unsubscribeUserGames = onSnapshot(q, (snap) => {
                const list = document.getElementById('user-games-list');
                list.innerHTML = '';
                snap.forEach(docSnap => list.appendChild(createGameCard(docSnap.id, docSnap.data(), false)));
            });
        }

        function createGameCard(id, data, isPublic) {
            const card = document.createElement('div');
            card.className = "glass-card p-6 flex flex-col justify-between group hover:border-cyan-500/50 transition-all min-h-[180px]";
            card.innerHTML = `
                <div>
                    <h3 class="font-bold text-white uppercase tracking-tight mb-2 truncate">${data.title || "Névtelen Világ"}</h3>
                    <p class="text-[9px] text-slate-500 uppercase tracking-widest mb-6">Mester: ${data.authorName || "Ismeretlen"}</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="playGame('${id}', ${isPublic})" class="flex-grow btn-primary py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest">Indítás</button>
                    ${!isPublic ? `<button onclick="editGame('${id}')" class="px-4 py-2 bg-slate-800 rounded-lg text-xs hover:bg-slate-700 transition"><i class="fa fa-pen"></i></button>` : ''}
                </div>
            `;
            return card;
        }

        window.saveToCloud = async (publish = false) => {
            if (!user) return;
            const title = document.getElementById('appTitle').value.trim() || "Névtelen Kaland";
            const payload = {
                title: title, authorId: user.uid, authorName: user.displayName || user.email || "Kalandmester",
                config: window.config, updatedAt: serverTimestamp()
            };
            try {
                document.getElementById('save-indicator').style.display = 'block';
                if (!window.currentGameId) {
                    const newDoc = await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'games'), payload);
                    window.currentGameId = newDoc.id;
                } else {
                    await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'games', window.currentGameId), payload, { merge: true });
                }
                if (publish) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'games', window.currentGameId), payload, { merge: true });
                    window.showNotification("A kaland kikerült a könyvtárba!");
                }
                setTimeout(() => document.getElementById('save-indicator').style.display = 'none', 1000);
            } catch (err) { console.error(err); document.getElementById('save-indicator').style.display = 'none'; }
        };

        window.editGame = async (id) => {
            const snap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'games', id));
            if (snap.exists()) {
                window.config = snap.data().config;
                window.currentGameId = id;
                switchToView('studio');
                refreshStudioGlobalUI();
                loadStudioPage(0);
            }
        };

        window.playGame = async (id, isPublic) => {
            const path = isPublic 
                ? doc(db, 'artifacts', appId, 'public', 'data', 'games', id)
                : doc(db, 'artifacts', appId, 'users', user.uid, 'games', id);
            const snap = await getDoc(path);
            if (snap.exists()) {
                window.config = snap.data().config;
                switchToView('player');
                pIdx = 0; pUpdateUI();
            }
        };

        window.logout = () => signOut(auth).then(() => { location.reload(); });
        
        initAuth();
    </script>

    <script>
        // STUDIO LOGIC
        let curIdx = 0;
        let pIdx = 0;
        let saveTimeout = null;
        window.config = { appTitle: "Új Kaland", pages: [], avatars: [], globalBg: "" };
        window.currentGameId = null;

        function switchToView(id) {
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function createNewGame() {
            window.config = { 
                appTitle: "Új Kaland", 
                pages: [{ content: "Kezdődik a történet...", type: "story", choices: [] }], 
                avatars: [], 
                globalBg: "" 
            };
            window.currentGameId = null;
            switchToView('studio');
            refreshStudioGlobalUI();
            loadStudioPage(0);
        }

        function refreshStudioGlobalUI() {
            document.getElementById('appTitle').value = window.config.appTitle;
            document.getElementById('globalBg').value = window.config.globalBg;
            renderPageList();
            renderAvatarAdmin();
        }

        function loadStudioPage(idx) {
            curIdx = idx;
            const p = window.config.pages[idx];
            if (!p) return;

            document.getElementById('editorPanel').classList.remove('hidden');
            document.getElementById('curIdxDisp').textContent = idx;
            document.getElementById('pageText').value = p.content || "";
            document.getElementById('pageType').value = p.type || "story";
            document.getElementById('nextIdx').value = p.nextIdx || "";
            document.getElementById('pageBg').value = p.pageBg || "";
            
            if (p.password) document.getElementById('pagePassword').value = p.password;
            if (p.qrCode) document.getElementById('pageQrCode').value = p.qrCode;

            handleTypeChange(false);
            renderPageList();
            updateSimulator();
        }

        function addPage() {
            window.config.pages.push({ content: "Új jelenet...", type: "story", choices: [] });
            loadStudioPage(window.config.pages.length - 1);
            autoSave();
        }

        function handleTypeChange(shouldSave = true) {
            const type = document.getElementById('pageType').value;
            document.getElementById('choice-editor').classList.toggle('hidden', type !== 'choice');
            document.getElementById('password-editor').classList.toggle('hidden', type !== 'password');
            document.getElementById('qr-editor').classList.toggle('hidden', type !== 'qr');
            
            if (type === 'choice') renderChoiceEditor();
            if (shouldSave) autoSave();
        }

        function autoSave() {
            clearTimeout(saveTimeout);
            document.getElementById('save-indicator').style.display = 'block';
            saveTimeout = setTimeout(() => {
                const p = window.config.pages[curIdx];
                if (p) {
                    p.content = document.getElementById('pageText').value;
                    p.type = document.getElementById('pageType').value;
                    p.nextIdx = document.getElementById('nextIdx').value;
                    p.pageBg = document.getElementById('pageBg').value;
                    if (p.type === 'password') p.password = document.getElementById('pagePassword').value;
                    if (p.type === 'qr') p.qrCode = document.getElementById('pageQrCode').value;
                }
                window.config.appTitle = document.getElementById('appTitle').value;
                window.config.globalBg = document.getElementById('globalBg').value;
                updateSimulator();
                renderPageList();
                setTimeout(() => document.getElementById('save-indicator').style.display = 'none', 500);
            }, 800);
        }

        function renderPageList() {
            const list = document.getElementById('pageList');
            list.innerHTML = '';
            window.config.pages.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `page-item ${i === curIdx ? 'selected' : ''}`;
                div.innerHTML = `<span onclick="loadStudioPage(${i})" class="cursor-pointer font-bold text-xs uppercase truncate">#${i}: ${p.content.substring(0,25)}</span><span class="text-[8px] opacity-40 font-black">${p.type}</span>`;
                list.appendChild(div);
            });
        }

        function addAvatar() {
            window.config.avatars.push({ id: 'A', name: 'Új Karakter', url: '' });
            renderAvatarAdmin();
            autoSave();
        }

        function renderAvatarAdmin() {
            const list = document.getElementById('avatarList');
            list.innerHTML = '';
            window.config.avatars.forEach((av, i) => {
                const div = document.createElement('div');
                div.className = "flex gap-2 items-center bg-slate-900/50 p-2 rounded border border-white/5";
                div.innerHTML = `<span class="text-[9px] font-bold text-cyan-400">${av.id}</span><input class="flex-grow bg-transparent text-[10px] outline-none" value="${av.name}" oninput="window.config.avatars[${i}].name=this.value;autoSave()">`;
                list.appendChild(div);
            });
        }

        function addChoice() {
            const p = window.config.pages[curIdx];
            if (!p.choices) p.choices = [];
            p.choices.push({ text: "Gomb szöveg", target: 0 });
            renderChoiceEditor();
            autoSave();
        }

        function renderChoiceEditor() {
            const p = window.config.pages[curIdx];
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            (p.choices || []).forEach((c, i) => {
                const div = document.createElement('div');
                div.className = "flex gap-2";
                div.innerHTML = `<input class="input-style text-xs flex-grow" value="${c.text}" oninput="window.config.pages[${curIdx}].choices[${i}].text=this.value;autoSave()"><input type="number" class="input-style text-xs w-16" value="${c.target}" oninput="window.config.pages[${curIdx}].choices[${i}].target=this.value;autoSave()">`;
                container.appendChild(div);
            });
        }

        function updateSimulator() {
            const p = window.config.pages[curIdx];
            if (!p) return;
            document.getElementById('sim-bg').src = p.pageBg || window.config.globalBg || "";
            document.getElementById('sim-actual-text').textContent = p.content;
            const acts = document.getElementById('sim-actions');
            acts.innerHTML = '';
            if (p.type === 'choice') {
                (p.choices || []).forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = "sim-btn";
                    btn.textContent = c.text;
                    acts.appendChild(btn);
                });
            } else {
                const btn = document.createElement('button');
                btn.className = "sim-btn";
                btn.textContent = "TOVÁBB";
                acts.appendChild(btn);
            }
        }

        function pUpdateUI() {
            const p = window.config.pages[pIdx];
            if (!p) return;
            document.getElementById('p-bg').src = p.pageBg || window.config.globalBg || "";
            document.getElementById('p-text').textContent = p.content;
            const acts = document.getElementById('p-actions');
            acts.innerHTML = '';
            if (p.type === 'choice') {
                (p.choices || []).forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = "p-action-btn";
                    btn.textContent = c.text;
                    btn.onclick = () => { pIdx = parseInt(c.target); pUpdateUI(); };
                    acts.appendChild(btn);
                });
            } else {
                const btn = document.createElement('button');
                btn.className = "p-action-btn";
                btn.textContent = "TOVÁBB";
                btn.onclick = () => { if(p.nextIdx) pIdx = parseInt(p.nextIdx); else pIdx++; pUpdateUI(); };
                acts.appendChild(btn);
            }
        }

        window.showNotification = (txt) => {
            const b = document.getElementById('notification-box');
            b.textContent = txt; b.style.display = 'block';
            setTimeout(() => b.style.display = 'none', 3000);
        };

        function resetSim() { curIdx = 0; loadStudioPage(0); }
        function launchPreview() { pIdx = 0; switchToView('player'); pUpdateUI(); }
        function deletePage() { if(window.config.pages.length > 1) { window.config.pages.splice(curIdx, 1); loadStudioPage(0); autoSave(); } }

        window.onload = () => {
            const el = document.getElementById('pageList');
            if (el) Sortable.create(el, { handle: '.handle', animation: 150, onEnd: autoSave });
        };
    </script>
</body>
</html>
