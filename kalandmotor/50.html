<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kaland Játék Stúdió V13.1 ✨ (Cloud Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #22d3ee;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            height: 100dvh;
            font-family: 'Play', sans-serif; 
            background-color: var(--bg-dark); 
            color: #f8fafc; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        
        #studio-view, #community-view { height: 100%; overflow-y: auto; padding: 1rem; padding-bottom: 5rem; }
        @media (min-width: 768px) {
            #studio-view, #community-view { padding: 2.5rem; }
        }
        
        #community-view { display: none; }
        
        .glass-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            border-radius: 1rem; 
        }

        .input-style { 
            background: #0f172a; 
            color: var(--secondary); 
            border: 1px solid #334155; 
            border-radius: 0.5rem; 
            padding: 0.6rem; 
            outline: none; 
            transition: 0.2s; 
            width: 100%; 
            font-size: 0.875rem;
        }
        .input-style:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        
        .page-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; 
            background: #1e293b; border: 1px solid transparent; transition: 0.2s; 
            cursor: pointer;
        }
        .page-item.selected { border-color: var(--secondary); background: #4c1d95; }
        .handle { cursor: grab; padding-right: 15px; color: #64748b; font-size: 0.9rem; }

        /* SZIMULÁTOR (Studio) */
        .sim-container { 
            position: sticky; top: 0; width: 320px; height: 600px; 
            background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; 
            overflow: hidden; display: flex; flex-direction: column; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); 
        }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; opacity: 0.6; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { 
            position: relative; background: rgba(0,0,0,0.92); 
            border-top: 3px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; 
            padding: 20px; padding-top: 35px; min-height: 220px;
            display: flex; flex-direction: column; 
        }
        .sim-avatar { position: absolute; top: -40px; left: 10px; width: 65px; height: 65px; border-radius: 50%; border: 3px solid var(--primary); background: #000; z-index: 20; object-fit: cover; display: none; }
        .sim-btn { 
            background: var(--primary); color: white; padding: 12px; 
            border-radius: 0.75rem; font-weight: 700; text-align: center; 
            font-size: 1rem; cursor: pointer; text-transform: uppercase; 
            transition: 0.2s; width: 100%; border: none; 
        }
        .sim-btn-secondary { background: #334155; }

        /* JÁTÉKOS MÓD (Mobilra optimalizált) */
        #player-view { 
            position: fixed; inset: 0; z-index: 9000; background: #000; 
            display: none; flex-direction: column; height: 100dvh; 
        }
        .p-game-wrapper { 
            width: 100%; height: 100%; display: flex; flex-direction: column; 
            position: relative; background: #000; 
        }
        #p-viewport { position: relative; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s ease-in-out; }
        
        #p-content-layer { 
            position: relative; 
            z-index: 10; 
            margin-top: auto; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
        }

        .p-dialog-box { 
            position: relative; 
            background: rgba(0,0,0,0.92); 
            border-top: 4px solid var(--primary); 
            border-radius: 1.5rem 1.5rem 0 0; 
            padding: 25px; 
            padding-top: 45px; 
            min-height: 280px; 
            max-height: 80dvh; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 -15px 35px rgba(0,0,0,0.7);
        }
        
        .p-avatar-frame { 
            position: absolute; 
            top: -45px; 
            left: 20px; 
            width: 85px; 
            height: 85px; 
            border-radius: 50%; 
            border: 4px solid var(--primary); 
            background: #000; 
            z-index: 20; 
            object-fit: cover; 
            display: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        
        #p-story-text { 
            text-align: left; 
            font-size: 1.1rem; 
            font-weight: 400; 
            line-height: 1.5; 
            margin-bottom: 15px; 
            color: #f1f5f9; 
        }

        #p-button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .p-nav-btn-row {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            gap: 12px;
            width: 100%;
        }

        .p-action-btn { 
            flex: 1;
            background: var(--primary); color: white; padding: 18px; border-radius: 1rem; 
            font-weight: 700; text-align: center; font-size: 1.1rem; cursor: pointer; 
            text-transform: uppercase; transition: 0.15s; display: flex; align-items: center; 
            justify-content: center; border: none; 
            box-shadow: 0 4px 0 rgba(139, 92, 246, 0.4);
        }
        .p-action-btn:active { transform: translateY(2px); box-shadow: none; filter: brightness(1.2); }
        .p-action-btn.btn-secondary { background: #334155; box-shadow: 0 4px 0 rgba(51, 65, 85, 0.4); }

        .p-bottom-nav { 
            height: 80px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.4); 
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 100; padding-bottom: env(safe-area-inset-bottom);
        }
        .p-nav-item { color: #94a3b8; font-size: 1.6rem; cursor: pointer; border: none; background: transparent; position: relative; width: 25%; height: 100%; transition: 0.2s; }
        .p-nav-item:active { color: var(--primary); transform: scale(0.9); }
        .p-nav-item.active { color: var(--primary); }
        .p-badge { position: absolute; top: 15px; right: 25%; background: #ef4444; color: white; font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: bold; border: 2px solid #0f172a; }

        .view-toggle-btn { 
            position: fixed; top: 1.5rem; right: 1.5rem; z-index: 9500; 
            background: var(--primary); color: white; padding: 0.85rem 1.5rem; 
            border-radius: 1rem; font-weight: 800; font-size: 0.8rem; 
            text-transform: uppercase; cursor: pointer; border: none; 
            display: flex; align-items: center; gap: 10px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
        }

        /* Hátizsák Overlay */
        #p-inventory-overlay { 
            position: absolute; inset: 0; background: #0f172a; z-index: 150; 
            display: none; padding: 30px; padding-top: 70px; overflow-y: auto; 
        }
        .p-item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .p-item-card { position: relative; background: #1e293b; border: 2px solid #334155; border-radius: 1.25rem; padding: 20px; text-align: center; cursor: pointer; }
        .p-item-card img { width: 90px; height: 90px; object-fit: contain; margin: 0 auto 15px; }

        /* Zoom Nézet */
        #p-zoom-viewer {
            user-select: none;
            touch-action: none; /* Letiltjuk a default zoomot a csippentés kézi kezeléséhez */
        }
        #p-zoom-img {
            transition: transform 0.1s ease-out;
            transform-origin: center;
        }

        @keyframes fadeInOutSplash {
            0% { opacity: 0; transform: scale(0.9); }
            20% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); }
        }
        .splash-text-anim { font-family: 'Special Elite', cursive; animation: fadeInOutSplash 10s ease-in-out forwards; text-transform: uppercase; letter-spacing: 0.2em; }
    </style>
</head>
<body>

    <div id="save-indicator" class="fixed bottom-6 right-6 bg-emerald-500 text-white px-5 py-2 rounded-full font-bold text-xs z-[10000] hidden">
        <i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...
    </div>

    <div id="confirm-modal" class="hidden fixed inset-0 bg-black/90 z-[11000] flex items-center justify-center backdrop-filter blur-sm">
        <div class="glass-card p-10 max-w-sm w-full text-center m-4">
            <h3 id="confirm-title" class="text-xl font-bold mb-4 uppercase text-white">Megerősítés</h3>
            <p id="confirm-body" class="text-slate-400 mb-8 text-sm"></p>
            <div class="flex gap-4">
                <button onclick="closeConfirm()" class="flex-1 bg-slate-700 p-4 rounded-xl font-bold uppercase text-xs">Mégse</button>
                <button id="confirm-btn" class="flex-1 bg-purple-600 p-4 rounded-xl font-bold uppercase text-xs">Igen</button>
            </div>
        </div>
    </div>

    <button id="main-view-toggle" class="view-toggle-btn" onclick="togglePlayerMode()">
        <span id="toggle-icon"><i class="fa fa-gamepad"></i></span>
        <span id="toggle-text">Tesztelés</span>
    </button>

    <!-- STUDIO VIEW -->
    <div id="studio-view">
        <div class="max-w-7xl mx-auto">
            <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <h1 class="text-3xl md:text-5xl font-bold uppercase tracking-tighter text-white">Stúdió <span class="text-purple-500">V13.1</span> ✨</h1>
                    <p class="text-cyan-400 text-xs md:text-sm mt-1 font-bold uppercase">Pro Engine • Mobile Optimized</p>
                </div>
                
                <div class="flex flex-col items-start md:items-end gap-3 w-full md:w-auto">
                    <div id="auth-section" class="flex flex-wrap items-center gap-4 w-full md:w-auto">
                        <button onclick="switchView('community')" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-lg font-bold text-[10px] uppercase">Közösség</button>
                        <button id="login-btn" class="bg-white text-black px-5 py-2 rounded-full font-bold text-xs">Belépés</button>
                        <div id="user-info" class="hidden flex items-center gap-3 bg-slate-800/80 p-1 pr-4 rounded-full border border-slate-700">
                            <img id="user-photo" src="" class="w-8 h-8 rounded-full border border-purple-500">
                            <span id="user-name" class="text-xs font-bold"></span>
                            <button id="logout-btn-trigger" class="text-slate-500 ml-2"><i class="fa fa-sign-out-alt"></i></button>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button id="publish-btn" onclick="publishGame()" class="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase hover:bg-emerald-500 shadow-lg">Mentés Felhőbe</button>
                        <button onclick="exportJson()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase">Export JSON</button>
                        <button onclick="triggerImport()" class="bg-amber-600 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase">Import JSON</button>
                        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importJson(event)">
                    </div>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-8 space-y-8">
                    <!-- Global Config -->
                    <div class="glass-card p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <label class="text-purple-400 font-bold uppercase text-[10px] tracking-widest block">Alapbeállítások</label>
                            <input type="text" id="appTitle" class="input-style" placeholder="Kaland címe" oninput="autoSave()">
                            <input type="url" id="globalBg" class="input-style" placeholder="Globális Háttér URL" oninput="autoSave()">
                            <input type="url" id="initialMapLink" class="input-style" placeholder="Térkép Link (Google Maps)" oninput="autoSave()">
                        </div>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <label class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Avatarok</label>
                                <button onclick="addAvatar()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ</button>
                            </div>
                            <div id="avatarList" class="space-y-2 max-h-40 overflow-y-auto pr-2"></div>
                        </div>
                    </div>

                    <!-- Page List -->
                    <div class="glass-card p-6">
                        <div class="flex justify-between items-center mb-6">
                            <label class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Jelenetek</label>
                            <button onclick="addPage()" class="bg-purple-600 text-white px-4 py-2 rounded-lg text-[10px] font-bold">+ ÚJ OLDAL</button>
                        </div>
                        <div id="pageList" class="max-h-60 overflow-y-auto pr-2"></div>
                    </div>

                    <!-- Editor Panel -->
                    <div id="editorPanel" class="glass-card p-8 space-y-8 hidden">
                        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                            <h2 class="text-2xl font-bold text-white">Szerkesztés: <span id="editing-page-id" class="text-purple-500">#0</span></h2>
                            <select id="pageType" class="input-style !w-44 !py-1" onchange="updateUI(); autoSave();">
                                <option value="story">Leírás</option>
                                <option value="choice">Választás</option>
                                <option value="password">Kódzár</option>
                                <option value="qr">QR Kód</option>
                                <option value="gps">GPS Pont</option>
                                <option value="splash">Splash Screen</option>
                                <option value="call">Telefonhívás</option>
                            </select>
                        </div>

                        <textarea id="pageText" rows="6" class="input-style text-base" placeholder="Írd ide a történetet..." oninput="autoSave()"></textarea>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-6">
                                <div>
                                    <label class="text-[10px] text-slate-500 uppercase font-bold tracking-widest block mb-2">Design</label>
                                    <input type="url" id="pageImage" class="input-style mb-2 text-xs" placeholder="Kép URL" oninput="autoSave()">
                                    <input type="url" id="pageBg" class="input-style text-xs" placeholder="Egyedi Háttér URL" oninput="autoSave()">
                                </div>
                                <div id="rewardArea">
                                    <div class="flex justify-between items-center mb-2">
                                        <label class="text-[10px] text-emerald-400 uppercase font-bold tracking-widest">Tárgy Szerzés</label>
                                        <button onclick="addRewardItem()" class="text-emerald-400 text-[9px] font-bold">+ ÚJ</button>
                                    </div>
                                    <div id="rewardsContainer" class="space-y-2"></div>
                                </div>
                            </div>
                            <div class="space-y-6">
                                <div id="choiceArea" class="hidden">
                                    <div class="flex justify-between items-center mb-2">
                                        <label class="text-[10px] text-cyan-400 uppercase font-bold tracking-widest">Választások</label>
                                        <button onclick="addChoiceItem()" class="text-cyan-400 text-[9px] font-bold">+ ÚJ</button>
                                    </div>
                                    <div id="choicesContainer" class="space-y-2"></div>
                                </div>
                            </div>
                        </div>

                        <div id="specialInputs" class="grid grid-cols-1 md:grid-cols-3 gap-6 border-t border-slate-700 pt-6">
                            <div id="passInputs" class="hidden space-y-4">
                                <input type="text" id="correctPass" class="input-style" placeholder="Jelszó" oninput="autoSave()">
                            </div>
                            <div id="gpsInputs" class="hidden space-y-2">
                                <input type="number" id="targetLat" step="any" class="input-style text-xs" placeholder="Latitude" oninput="autoSave()">
                                <input type="number" id="targetLng" step="any" class="input-style text-xs" placeholder="Longitude" oninput="autoSave()">
                            </div>
                            <div id="callInputs" class="hidden space-y-2">
                                <input type="url" id="audioUrl" class="input-style text-xs" placeholder="Hang URL" oninput="autoSave()">
                            </div>
                            <div id="qrInputs" class="hidden">
                                <input type="text" id="qrCode" class="input-style" placeholder="QR Tartalom" oninput="autoSave()">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-500 uppercase font-bold block mb-2">Navigáció</label>
                                <div class="flex gap-2">
                                    <input type="number" id="prevIdx" class="input-style text-xs" placeholder="Vissza ID" oninput="autoSave()">
                                    <input type="number" id="nextIdx" class="input-style text-xs" placeholder="Tovább ID" oninput="autoSave()">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sim (Desktop) -->
                <div class="lg:col-span-4 hidden lg:flex justify-center">
                    <div class="sim-container">
                        <div id="sim-viewport">
                            <img id="sim-bg" src="">
                            <div id="sim-content">
                                <div id="sim-main-box" class="sim-box">
                                    <img id="sim-avatar" class="sim-avatar" src="">
                                    <div id="sim-scroll" class="overflow-y-auto flex-grow">
                                        <div id="sim-actual-text" class="text-sm"></div>
                                        <div id="sim-gps-monitor" class="hidden text-center p-3 bg-slate-900 rounded-xl mt-4 border border-cyan-500/30">
                                            <div class="text-[9px] text-cyan-500 font-bold uppercase">Távolság</div>
                                            <div class="text-xl font-bold text-white"><span id="sim-distance-val">...</span> m</div>
                                        </div>
                                    </div>
                                    <div id="sim-actions" class="mt-4"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- COMMUNITY VIEW -->
    <div id="community-view">
        <div class="max-w-7xl mx-auto pb-20">
            <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <h1 class="text-3xl md:text-5xl font-bold uppercase text-white">Portál 🌐</h1>
                    <p class="text-emerald-400 text-xs font-bold uppercase">Fedezd fel a közösség kalandjait</p>
                </div>
                <button onclick="switchView('studio')" class="bg-purple-600 text-white px-8 py-4 rounded-2xl font-bold text-xs uppercase">Vissza</button>
            </header>
            <div id="community-game-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </div>

    <!-- PLAYER VIEW -->
    <div id="player-view">
        <!-- Nagyított kép nézet -->
        <div id="p-zoom-viewer" class="fixed inset-0 bg-black/95 z-[20000] hidden flex items-center justify-center p-0 overflow-hidden">
            <img id="p-zoom-img" src="" class="max-w-full max-h-full cursor-pointer">
        </div>

        <div id="p-qr-layer" class="hidden absolute inset-0 bg-black z-[10000] flex flex-col items-center justify-center p-10">
            <div id="p-qr-reader" class="w-full max-w-sm aspect-square bg-black border-4 border-cyan-400 rounded-3xl overflow-hidden"></div>
            <button onclick="pStopQR()" class="mt-8 bg-red-600 text-white px-10 py-5 rounded-3xl font-bold uppercase">Mégse</button>
        </div>
        
        <div class="p-game-wrapper">
            <div id="p-viewport">
                <img id="p-bg-layer" src="" class="absolute inset-0 w-full h-full object-cover">
                
                <div id="p-splash-screen" class="absolute inset-0 bg-black z-[5000] hidden flex items-center justify-center">
                    <div id="p-splash-text" class="text-white text-center p-10 splash-text-anim text-4xl"></div>
                </div>

                <div id="p-call-screen" class="absolute inset-0 z-[6000] hidden">
                    <div class="phone-ui h-full w-full bg-slate-950 flex flex-col items-center justify-between py-24 px-10 text-center text-white">
                        <div>
                            <p class="text-sm uppercase tracking-widest opacity-50 mb-4">Bejövő hívás</p>
                            <h1 id="p-call-name" class="text-5xl font-bold">...</h1>
                        </div>
                        <div class="flex gap-12">
                            <button onclick="pEndCall()" class="w-20 h-20 bg-red-600 rounded-full flex items-center justify-center text-3xl shadow-2xl"><i class="fa fa-phone-slash"></i></button>
                            <button onclick="pAnswerCall()" class="w-20 h-20 bg-emerald-500 rounded-full flex items-center justify-center text-3xl shadow-2xl animate-bounce"><i class="fa fa-phone"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Hátizsák Overlay -->
                <div id="p-inventory-overlay" onclick="pCloseInventory(event)">
                    <div class="pointer-events-none">
                        <h2 class="text-center text-cyan-400 font-bold mb-10 uppercase tracking-widest text-2xl">Hátizsák</h2>
                    </div>
                    <div id="p-item-list" class="p-item-grid"></div>
                </div>

                <div id="p-content-layer">
                    <div class="p-dialog-box">
                        <img id="p-avatar-img" class="p-avatar-frame" src="">
                        <div id="p-scroll-area" class="overflow-y-auto flex-grow mb-4">
                            <img id="p-page-illustration" class="w-full rounded-2xl mb-6 hidden shadow-2xl" src="">
                            <div id="p-story-text"></div>
                            <div id="p-gps-monitor" class="hidden text-center p-6 bg-slate-900/80 rounded-3xl mt-4 border border-cyan-500/40">
                                <div class="text-[10px] text-cyan-500 uppercase font-bold tracking-widest mb-1">Távolság</div>
                                <div class="text-4xl font-bold text-white"><span id="p-distance-val">...</span> m</div>
                                <div id="p-gps-hint" class="text-[10px] text-slate-400 mt-2 italic">Menj közelebb a folytatáshoz! (20m)</div>
                            </div>
                        </div>
                        <div id="p-button-container"></div>
                    </div>
                </div>
            </div>
            
            <div class="p-bottom-nav">
                <button class="p-nav-item active" onclick="pOpenMap()"><i class="fa fa-map-marked-alt"></i></button>

                    <div id="p-inv-badge" class="p-badge hidden">0</div>

            </div>

    <audio id="p-call-voice-audio"></audio>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const userFirebaseConfig = {
            apiKey: "AIzaSyCfVce17Yye6jyvpSSoW6jlh3ei7T0N618",
            authDomain: "kalandmotor.firebaseapp.com",
            projectId: "kalandmotor",
            storageBucket: "kalandmotor.firebasestorage.app",
            messagingSenderId: "108860908140",
            appId: "1:108860908140:web:5fbec83f4ae7b51487ee49"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kalandmotor-v13';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : userFirebaseConfig;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let isSyncing = false;
        let isPublicPlayMode = false;

        window.config = JSON.parse(localStorage.getItem('KALAND_STUDIO_V13')) || {
            appTitle: "A Város Titka",
            globalBg: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?q=80&w=2000",
            initialMapLink: "",
            avatars: [{ id: 'A', name: 'Mesélő', url: '', color: '#8b5cf6' }],
            storyPages: [{ content: "Üdvözöllek a történetben! §A", pageType: "story", rewards: [], hiddenItems: [], choices: [] }]
        };

        let currentIdx = 0;
        let pSimIdx = 0;
        let pInventory = [];
        let pQrScanner = null;
        let splashTimer = null;
        
        // --- GPS Logika ---
        let userPos = null;
        let lastAutoGpsIdx = -1;

        function getDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return 999999;
            const R = 6371e3; // Föld sugara méterben
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                updateGpsDisplays();
            }, (err) => {
                console.warn("GPS hiba: ", err.message);
            }, { enableHighAccuracy: true });
        }

        function updateGpsDisplays() {
            if (!userPos) return;

            // Szimulátor frissítése (Stúdió mód)
            const simP = window.config.storyPages[currentIdx];
            if (simP && simP.pageType === 'gps') {
                const dist = getDistance(userPos.lat, userPos.lng, simP.targetLat, simP.targetLng);
                const simEl = document.getElementById('sim-distance-val');
                if (simEl) simEl.textContent = dist;
            }

            // Játékos mód frissítése
            const pP = window.config.storyPages[pSimIdx];
            if (pP && pP.pageType === 'gps') {
                const dist = getDistance(userPos.lat, userPos.lng, pP.targetLat, pP.targetLng);
                const pEl = document.getElementById('p-distance-val');
                if (pEl) pEl.textContent = dist;

                const hint = document.getElementById('p-gps-hint');
                if (hint) {
                    if (dist <= 20) {
                        hint.textContent = "Megérkeztél! Továbblépés...";
                        hint.classList.replace('text-slate-400', 'text-emerald-400');
                        hint.classList.add('font-bold');
                        
                        if (lastAutoGpsIdx !== pSimIdx) {
                            lastAutoGpsIdx = pSimIdx;
                            setTimeout(() => {
                                pSimIdx = (pP.nextIdx !== "" && pP.nextIdx !== undefined) ? parseInt(pP.nextIdx) : pSimIdx + 1;
                                window.pUpdateUI();
                            }, 1000);
                        }
                    } else {
                        hint.textContent = "Menj közelebb a folytatáshoz! (20m)";
                        hint.classList.replace('text-emerald-400', 'text-slate-400');
                        hint.classList.remove('font-bold');
                    }
                }
            }
        }

        // --- Pinch to Zoom Logika ---
        let zoomLevel = 1;
        let lastDist = 0;
        const zoomImg = document.getElementById('p-zoom-img');
        const zoomViewer = document.getElementById('p-zoom-viewer');

        zoomViewer.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                lastDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        }, { passive: false });

        zoomViewer.addEventListener('touchmove', e => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                const delta = (dist - lastDist) / 100;
                zoomLevel = Math.min(Math.max(1, zoomLevel + delta), 4);
                zoomImg.style.transform = `scale(${zoomLevel})`;
                lastDist = dist;
            }
        }, { passive: false });

        zoomImg.addEventListener('click', (e) => {
            zoomViewer.style.display = 'none';
            zoomLevel = 1;
            zoomImg.style.transform = `scale(1)`;
            e.stopPropagation();
        });

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                try { await signInWithCustomToken(auth, __initial_auth_token); } catch (e) { console.error(e); }
            }
        };

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user && !user.isAnonymous) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-name').textContent = user.displayName;
                document.getElementById('user-photo').src = user.photoURL;
                await loadFromCloud();
                window.initCommunitySync();
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);
        document.getElementById('login-btn').onclick = window.login;
        document.getElementById('logout-btn-trigger').onclick = window.logout;

        async function saveToCloud() {
            if (!currentUser || currentUser.isAnonymous || isSyncing) return;
            isSyncing = true;
            document.getElementById('save-indicator').classList.remove('hidden');
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'userConfig');
                await setDoc(userDocRef, { configData: JSON.parse(JSON.stringify(window.config)), updatedAt: new Date().toISOString() }, { merge: true });
            } catch (err) { console.error(err); }
            finally { setTimeout(() => { document.getElementById('save-indicator').classList.add('hidden'); isSyncing = false; }, 1000); }
        }

        async function loadFromCloud() {
            if (!currentUser || currentUser.isAnonymous) return;
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'userConfig');
                const snap = await getDoc(userDocRef);
                if (snap.exists()) {
                    window.config = snap.data().configData;
                    localStorage.setItem('KALAND_STUDIO_V13', JSON.stringify(window.config));
                    window.refreshUI();
                }
            } catch (err) { console.error(err); }
        }

        window.initCommunitySync = () => {
            const col = collection(db, 'artifacts', appId, 'public', 'data', 'publishedGames');
            onSnapshot(col, (snap) => {
                const list = document.getElementById('community-game-list');
                list.innerHTML = '';
                snap.docs.forEach(docSnap => {
                    const data = docSnap.data();
                    const isAuthor = currentUser && (data.authorId === currentUser.uid);
                    const card = document.createElement('div');
                    card.className = "glass-card p-6 flex flex-col gap-4 border border-slate-700 hover:border-purple-500 transition-all";
                    card.innerHTML = `
                        <div class="relative rounded-xl h-32 overflow-hidden bg-slate-900">
                            <img src="${data.background || ''}" class="w-full h-full object-cover opacity-60">
                            ${isAuthor ? `<button onclick="deletePublishedGame('${docSnap.id}')" class="absolute top-2 right-2 bg-red-600/80 p-2 rounded-lg"><i class="fa fa-trash text-white"></i></button>` : ''}
                        </div>
                        <h3 class="font-bold text-lg text-white truncate">${data.title}</h3>
                        <button class="bg-purple-600 hover:bg-purple-500 py-4 rounded-xl font-bold uppercase text-xs" onclick="loadAndPlayPublicGame('${docSnap.id}')">Játék indítása</button>
                    `;
                    list.appendChild(card);
                });
            }, (err) => console.error(err));
        };

        window.loadAndPlayPublicGame = async (id) => {
            const publicDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id);
            const snap = await getDoc(publicDocRef);
            if (snap.exists()) {
                window.config = snap.data().config;
                isPublicPlayMode = true; 
                document.getElementById('main-view-toggle').classList.add('hidden');
                window.refreshUI();
                togglePlayerMode(); 
            }
        };

        window.deletePublishedGame = async (gameId) => {
            if (!confirm("Biztosan törölni akarod?")) return;
            try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', gameId)); } catch (e) { console.error(e); }
        };

        window.refreshUI = () => {
            document.getElementById('appTitle').value = window.config.appTitle || "";
            document.getElementById('globalBg').value = window.config.globalBg || "";
            document.getElementById('initialMapLink').value = window.config.initialMapLink || "";
            window.renderPageList();
            window.renderAvatarAdmin();
            window.loadPage(currentIdx || 0);
        };

        window.loadPage = (i) => {
            currentIdx = i; const p = window.config.storyPages[i]; if (!p) return;
            document.getElementById('editorPanel').classList.remove('hidden');
            document.getElementById('editing-page-id').textContent = `#${i}`;
            document.getElementById('pageText').value = p.content || "";
            document.getElementById('pageType').value = p.pageType || 'story';
            document.getElementById('pageImage').value = p.pageImage || "";
            document.getElementById('pageBg').value = p.pageBg || "";
            document.getElementById('nextIdx').value = p.nextIdx || "";
            document.getElementById('prevIdx').value = p.prevIdx || "";
            document.getElementById('qrCode').value = p.qrCode || "";
            document.getElementById('correctPass').value = p.password || "";
            document.getElementById('targetLat').value = p.targetLat || "";
            document.getElementById('targetLng').value = p.targetLng || "";
            document.getElementById('audioUrl').value = p.audioUrl || "";
            window.updateUI(); window.renderChoices(); window.renderRewards();
            window.updateSimulator();
        };

        window.updateUI = () => {
            const t = document.getElementById('pageType').value;
            document.getElementById('choiceArea').classList.toggle('hidden', t !== 'choice');
            document.getElementById('passInputs').classList.toggle('hidden', t !== 'password');
            document.getElementById('gpsInputs').classList.toggle('hidden', t !== 'gps');
            document.getElementById('callInputs').classList.toggle('hidden', t !== 'call');
            document.getElementById('qrInputs').classList.toggle('hidden', t !== 'qr');
        };

        window.autoSave = () => {
            const p = window.config.storyPages[currentIdx];
            if (p) {
                p.content = document.getElementById('pageText').value;
                p.pageType = document.getElementById('pageType').value;
                p.pageImage = document.getElementById('pageImage').value;
                p.pageBg = document.getElementById('pageBg').value;
                p.nextIdx = document.getElementById('nextIdx').value;
                p.prevIdx = document.getElementById('prevIdx').value;
                p.qrCode = document.getElementById('qrCode').value;
                p.password = document.getElementById('correctPass').value;
                p.targetLat = document.getElementById('targetLat').value;
                p.targetLng = document.getElementById('targetLng').value;
                p.audioUrl = document.getElementById('audioUrl').value;
            }
            window.config.appTitle = document.getElementById('appTitle').value;
            window.config.globalBg = document.getElementById('globalBg').value;
            window.config.initialMapLink = document.getElementById('initialMapLink').value;
            localStorage.setItem('KALAND_STUDIO_V13', JSON.stringify(window.config));
            window.renderPageList(); window.updateSimulator(); saveToCloud();
        };

        window.updateSimulator = () => {
            const p = window.config.storyPages[currentIdx]; if (!p) return;
            document.getElementById('sim-bg').src = p.pageBg || window.config.globalBg || "";
            let text = p.content || ""; const avBox = document.getElementById('sim-avatar'); avBox.style.display = 'none';
            window.config.avatars.forEach(av => { if(text.includes(`§${av.id}`)) { avBox.src = av.url || ""; avBox.style.display = 'block'; avBox.style.borderColor = av.color; text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color};font-weight:700">${av.name}:</span>`); } });
            document.getElementById('sim-actual-text').innerHTML = text;
            
            // GPS doboz kezelése
            document.getElementById('sim-gps-monitor').classList.toggle('hidden', p.pageType !== 'gps');
            
            const acts = document.getElementById('sim-actions'); acts.innerHTML = '';
            const navRow = document.createElement('div'); navRow.className = "p-nav-btn-row";
            
            if (p.prevIdx !== "" && p.prevIdx !== undefined) {
                const bBack = document.createElement('button'); bBack.className="sim-btn sim-btn-secondary flex-1"; bBack.textContent="Vissza";
                navRow.appendChild(bBack);
            }
            const bNext = document.createElement('button'); bNext.className="sim-btn flex-1"; bNext.textContent="Tovább";
            if (p.pageType === 'gps') bNext.classList.add('opacity-50'); 
            navRow.appendChild(bNext);
            acts.appendChild(navRow);
            
            updateGpsDisplays();
        };

        window.renderPageList = () => {
            const l = document.getElementById('pageList'); l.innerHTML = '';
            window.config.storyPages.forEach((p, i) => {
                const d = document.createElement('div');
                d.className = `page-item ${i === currentIdx ? 'selected' : ''}`; d.dataset.id = i;
                d.innerHTML = `<div class="flex items-center gap-3"><i class="fa fa-bars handle"></i><span onclick="loadPage(${i})" class="truncate text-xs font-bold uppercase">#${i}: ${p.content ? p.content.substring(0,25).replace(/§\w/g, '') : '...'}</span></div><div class="flex gap-2"><button onclick="duplicatePage(${i})" class="text-emerald-400 p-1"><i class="fa fa-copy"></i></button><button onclick="openDelete(${i})" class="text-red-400 p-1"><i class="fa fa-trash"></i></button></div>`;
                l.appendChild(d);
            });
        };

        window.addPage = () => { window.config.storyPages.push({ content: "Új jelenet...", pageType: "story", rewards: [], hiddenItems: [], choices: [] }); window.loadPage(window.config.storyPages.length - 1); window.autoSave(); };
        window.duplicatePage = (i) => { const copy = JSON.parse(JSON.stringify(window.config.storyPages[i])); window.config.storyPages.splice(i + 1, 0, copy); window.renderPageList(); window.autoSave(); };
        window.openDelete = (i) => { 
            document.getElementById('confirm-title').textContent = "Törlés"; document.getElementById('confirm-body').textContent = "Biztosan törlöd?"; document.getElementById('confirm-modal').classList.remove('hidden');
            document.getElementById('confirm-btn').onclick = () => { window.config.storyPages.splice(i, 1); if (window.config.storyPages.length === 0) window.config.storyPages.push({ content: "Üdv!", pageType: "story" }); window.loadPage(0); closeConfirm(); window.autoSave(); };
        };
        window.closeConfirm = () => document.getElementById('confirm-modal').classList.add('hidden');

        window.renderAvatarAdmin = () => {
            const l = document.getElementById('avatarList'); l.innerHTML = '';
            window.config.avatars.forEach((av, i) => {
                const d = document.createElement('div'); d.className = "flex gap-2 items-center mb-2 bg-slate-900/40 p-1 rounded-lg";
                d.innerHTML = `<input type="text" class="input-style !w-10 text-center font-bold !p-1" value="${av.id}" oninput="window.config.avatars[${i}].id=this.value.toUpperCase();window.autoSave()"><input type="text" class="input-style flex-1 !p-1" value="${av.name}" oninput="window.config.avatars[${i}].name=this.value;window.autoSave()"><input type="color" class="w-8 h-8 rounded border-none" value="${av.color}" oninput="window.config.avatars[${i}].color=this.value;window.autoSave()"><button onclick="window.config.avatars.splice(${i},1);window.renderAvatarAdmin();window.autoSave()" class="text-red-400"><i class="fa fa-trash"></i></button>`;
                l.appendChild(d);
            });
        };
        window.addAvatar = () => { window.config.avatars.push({ id: 'X', name: 'Név', url: '', color: '#ffffff' }); window.renderAvatarAdmin(); window.autoSave(); };

        window.renderChoices = () => {
            const container = document.getElementById('choicesContainer'); container.innerHTML = '';
            const p = window.config.storyPages[currentIdx];
            if (!p.choices) p.choices = [];
            p.choices.forEach((c, i) => {
                const d = document.createElement('div'); d.className = "flex gap-2 bg-slate-900/50 p-2 rounded-lg";
                d.innerHTML = `<input type="text" class="input-style flex-1 !text-[10px]" value="${c.text}" oninput="window.config.storyPages[${currentIdx}].choices[${i}].text=this.value;window.autoSave()"><input type="number" class="input-style !w-12 !text-[10px]" value="${c.target}" oninput="window.config.storyPages[${currentIdx}].choices[${i}].target=this.value;window.autoSave()"><button onclick="window.config.storyPages[${currentIdx}].choices.splice(${i},1);window.renderChoices();window.autoSave()" class="text-red-400">X</button>`;
                container.appendChild(d);
            });
        };
        window.addChoiceItem = () => { if(!window.config.storyPages[currentIdx].choices) window.config.storyPages[currentIdx].choices = []; window.config.storyPages[currentIdx].choices.push({ text: "Opció", target: 0 }); window.renderChoices(); window.autoSave(); };

        window.renderRewards = () => {
            const container = document.getElementById('rewardsContainer'); container.innerHTML = '';
            const p = window.config.storyPages[currentIdx];
            if(!p.rewards) p.rewards = [];
            p.rewards.forEach((r, i) => {
                const d = document.createElement('div'); d.className = "flex gap-2 items-center bg-slate-900/40 p-2 rounded-lg";
                d.innerHTML = `<input type="text" class="input-style flex-1 !text-[10px]" value="${r.name}" oninput="window.config.storyPages[${currentIdx}].rewards[${i}].name=this.value;window.autoSave()"><input type="url" class="input-style flex-1 !text-[10px]" value="${r.url||''}" placeholder="Kép URL" oninput="window.config.storyPages[${currentIdx}].rewards[${i}].url=this.value;window.autoSave()"><button onclick="window.config.storyPages[${currentIdx}].rewards.splice(${i},1);window.renderRewards();window.autoSave()" class="text-red-400">X</button>`;
                container.appendChild(d);
            });
        };
        window.addRewardItem = () => { if(!window.config.storyPages[currentIdx].rewards) window.config.storyPages[currentIdx].rewards = []; window.config.storyPages[currentIdx].rewards.push({ name: "Tárgy", url: "" }); window.renderRewards(); window.autoSave(); };

        window.togglePlayerMode = () => {
            const pv = document.getElementById('player-view'); const sv = document.getElementById('studio-view'); 
            const toggleBtn = document.getElementById('main-view-toggle');
            if (pv.style.display === 'flex') {
                pv.style.display = 'none'; sv.style.display = 'block'; isPublicPlayMode = false; toggleBtn.classList.remove('hidden'); window.pStopAllAudio();
            } else {
                pv.style.display = 'flex'; sv.style.display = 'none'; if (isPublicPlayMode) toggleBtn.classList.add('hidden'); window.pResetGame();
            }
        };

        window.toggleFullScreen = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                document.getElementById('fs-icon').className = 'fa fa-compress';
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); document.getElementById('fs-icon').className = 'fa fa-expand'; }
            }
        };

        window.pUpdateUI = () => {
            const p = window.config.storyPages[pSimIdx]; if (!p) return;
            clearTimeout(splashTimer); window.pStopAllAudio();
            document.getElementById('p-splash-screen').classList.add('hidden'); 
            document.getElementById('p-call-screen').classList.add('hidden'); 
            document.getElementById('p-content-layer').classList.remove('hidden');
            
            if (p.pageType === 'splash') {
                document.getElementById('p-splash-screen').classList.remove('hidden'); 
                document.getElementById('p-content-layer').classList.add('hidden');
                document.getElementById('p-splash-text').textContent = p.content;
                splashTimer = setTimeout(() => { pSimIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : pSimIdx + 1; window.pUpdateUI(); }, 10500);
            } else if (p.pageType === 'call') {
                document.getElementById('p-call-screen').classList.remove('hidden'); 
                document.getElementById('p-content-layer').classList.add('hidden');
                document.getElementById('p-call-name').textContent = p.content;
                const ring = document.getElementById('p-ringtone-audio'); ring.src = "https://cdn.pixabay.com/audio/2022/03/15/audio_73663a7587.mp3"; ring.play().catch(()=>{});
            } else {
                document.getElementById('p-bg-layer').src = p.pageBg || window.config.globalBg || "";
                let text = p.content || ""; const avImg = document.getElementById('p-avatar-img'); avImg.style.display = 'none';
                window.config.avatars.forEach(av => { 
                    if(text.includes(`§${av.id}`)) { 
                        avImg.src = av.url || "https://api.dicebear.com/7.x/bottts/svg?seed=" + av.id; 
                        avImg.style.display = 'block'; avImg.style.borderColor = av.color; 
                        text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color}; font-weight:bold;">${av.name}:</span>`); 
                    } 
                });
                document.getElementById('p-story-text').innerHTML = text;
                const ill = document.getElementById('p-page-illustration'); if(p.pageImage) { ill.src = p.pageImage; ill.classList.remove('hidden'); } else { ill.classList.add('hidden'); }
                
                // GPS Monitor frissítése
                document.getElementById('p-gps-monitor').classList.toggle('hidden', p.pageType !== 'gps');
                
                const btnCont = document.getElementById('p-button-container'); btnCont.innerHTML = '';
                
                if(p.pageType==='choice'&&p.choices) {
                    p.choices.forEach(c=>{ 
                        const b = document.createElement('button'); b.className = "p-action-btn"; b.textContent = c.text;
                        b.onclick = () => { pSimIdx=parseInt(c.target); window.pUpdateUI(); }; btnCont.appendChild(b);
                    });
                } else {
                    if (p.pageType === 'password') {
                        const i = document.createElement('input'); 
                        i.className="input-style !p-5 !text-3xl text-center mb-2 font-bold"; 
                        i.placeholder="KÓD..."; 
                        btnCont.appendChild(i);
                    }

                    const navRow = document.createElement('div'); 
                    navRow.className = "p-nav-btn-row";
                    
                    if (p.prevIdx !== "" && p.prevIdx !== undefined) {
                        const bBack = document.createElement('button'); 
                        bBack.className = "p-action-btn btn-secondary"; 
                        bBack.innerHTML = '<i class="fa fa-arrow-left mr-2"></i> Vissza';
                        bBack.onclick = () => { pSimIdx = parseInt(p.prevIdx); window.pUpdateUI(); }; 
                        navRow.appendChild(bBack);
                    }

                    const bNext = document.createElement('button'); 
                    bNext.className = "p-action-btn";
                    
                    if (p.pageType === 'password') {
                        bNext.textContent = "Nyitás"; 
                        bNext.onclick = () => { 
                            const input = btnCont.querySelector('input');
                            if(input && input.value.toLowerCase()===(p.password||"").toLowerCase()){ 
                                pSimIdx=(p.nextIdx!=""&&p.nextIdx!=undefined)?parseInt(p.nextIdx):pSimIdx+1; window.pUpdateUI(); 
                            } else if(input) { input.style.borderColor = 'red'; }
                        };
                    } else if(p.pageType==='qr') { 
                        bNext.textContent = "QR Olvasás"; 
                        bNext.onclick = window.pStartQR; 
                    } else if (p.pageType === 'gps') {
                        bNext.textContent = "Keresés..."; 
                        bNext.classList.add('opacity-50');
                        bNext.disabled = true;
                    } else { 
                        bNext.innerHTML = 'Tovább <i class="fa fa-arrow-right ml-2"></i>'; 
                        bNext.onclick = () => { pSimIdx=(p.nextIdx!=""&&p.nextIdx!=undefined)?parseInt(p.nextIdx):pSimIdx+1; window.pUpdateUI(); }; 
                    }
                    
                    navRow.appendChild(bNext); 
                    btnCont.appendChild(navRow);
                }
                if(p.rewards) p.rewards.forEach(r=>{ if(r.name&&!pInventory.find(i=>i.name===r.name)) pInventory.push({...r, seen:false}); });
            }
            window.pUpdateBadge(); 
            document.getElementById('p-scroll-area').scrollTop = 0;
            updateGpsDisplays();
        };

        window.pStartQR = () => { document.getElementById('p-qr-layer').style.display = 'flex'; pQrScanner = new Html5Qrcode("p-qr-reader"); pQrScanner.start({facingMode:"environment"},{fps:10,qrbox:250},t=>{ const p=window.config.storyPages[pSimIdx]; if(t.trim().toUpperCase()===(p.qrCode||"").toUpperCase()){ pStopQR(); pSimIdx=(p.nextIdx!=""&&p.nextIdx!=undefined)?parseInt(p.nextIdx):pSimIdx+1; window.pUpdateUI(); } }); };
        window.pStopQR = () => { if(pQrScanner) pQrScanner.stop().finally(()=>{ document.getElementById('p-qr-layer').style.display='none'; pQrScanner=null; }); };
        window.pEndCall = () => { document.getElementById('p-ringtone-audio').pause(); document.getElementById('p-call-voice-audio').pause(); const p=window.config.storyPages[pSimIdx]; pSimIdx=(p.nextIdx!=""&&p.nextIdx!=undefined)?parseInt(p.nextIdx):pSimIdx+1; window.pUpdateUI(); };
        window.pAnswerCall = () => { document.getElementById('p-ringtone-audio').pause(); const v=document.getElementById('p-call-voice-audio'); v.src=window.config.storyPages[pSimIdx].audioUrl; v.play().catch(window.pEndCall); v.onended=window.pEndCall; };
        window.pOpenMap = () => { if(window.config.initialMapLink) window.open(window.config.initialMapLink, '_blank'); };
        
        window.pToggleInventory = () => {
            const inv = document.getElementById('p-inventory-overlay');
            if (inv.style.display === 'block') {
                inv.style.display = 'none';
            } else {
                window.pRenderInventory();
                inv.style.display = 'block';
            }
        };

        window.pCloseInventory = (e) => {
            if (e.target.id === 'p-inventory-overlay') {
                document.getElementById('p-inventory-overlay').style.display = 'none';
            }
        };

        window.pRenderInventory = () => {
            const list = document.getElementById('p-item-list'); list.innerHTML = '';
            pInventory.forEach(item => {
                const d = document.createElement('div'); d.className = "p-item-card"; 
                d.innerHTML = (item.url ? `<img src="${item.url}">` : `<div class="text-4xl mb-2">📦</div>`) + `<div class="text-xs font-bold uppercase">${item.name}</div>`;
                if (!item.seen) d.innerHTML += `<div class="p-item-unread-dot absolute top-2 right-2 w-3 h-3 bg-red-500 rounded-full"></div>`;
                d.onclick = (e) => { 
                    if (item.url) { 
                        document.getElementById('p-zoom-viewer').style.display = 'flex'; 
                        document.getElementById('p-zoom-img').src = item.url; 
                    } 
                    item.seen = true; 
                    window.pUpdateBadge(); 
                    window.pRenderInventory();
                    e.stopPropagation();
                };
                list.appendChild(d);
            });
        };
        window.pUpdateBadge = () => { const count = pInventory.filter(i => !i.seen).length; const b = document.getElementById('p-inv-badge'); b.textContent = count; b.classList.toggle('hidden', count === 0); };
        window.pResetGame = () => { pSimIdx = 0; pInventory = []; lastAutoGpsIdx = -1; window.pUpdateUI(); };
        window.pStopAllAudio = () => { document.getElementById('p-ringtone-audio').pause(); document.getElementById('p-call-voice-audio').pause(); };
        window.switchView = (v) => { document.getElementById('studio-view').style.display = v === 'studio' ? 'block' : 'none'; document.getElementById('community-view').style.display = v === 'community' ? 'block' : 'none'; };
        
        window.publishGame = async () => {
            if (!currentUser || currentUser.isAnonymous) return;
            const gameId = window.config.cloudId || self.crypto.randomUUID();
            window.config.cloudId = gameId;
            const btn = document.getElementById('publish-btn'); btn.textContent = "KÜLDÉS..."; btn.disabled = true;
            try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', gameId), { title: window.config.appTitle, author: currentUser.displayName, authorPhoto: currentUser.photoURL, authorId: currentUser.uid, background: window.config.globalBg, config: JSON.parse(JSON.stringify(window.config)), publishedAt: new Date().toISOString() }); saveToCloud(); } catch (err) {} finally { btn.textContent = "Mentés Felhőbe"; btn.disabled = false; }
        };

        window.exportJson = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.config, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href",     dataStr);
            downloadAnchorNode.setAttribute("download", (window.config.appTitle || "kaland") + ".json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };

        window.triggerImport = () => document.getElementById('importFile').click();

        window.importJson = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.storyPages && Array.isArray(imported.storyPages)) {
                        window.config = imported;
                        localStorage.setItem('KALAND_STUDIO_V13', JSON.stringify(window.config));
                        window.refreshUI();
                        window.autoSave();
                    }
                } catch (err) {
                    console.error("Hiba az importálás során", err);
                }
            };
            reader.readAsText(file);
        };

        initAuth();
        Sortable.create(document.getElementById('pageList'), { handle: '.handle', animation: 150, onEnd: () => { const items = Array.from(document.getElementById('pageList').children); const old = [...window.config.storyPages]; window.config.storyPages = items.map(it => old[parseInt(it.dataset.id)]); window.autoSave(); } });
        window.refreshUI();
    </script>
</body>
</html>
