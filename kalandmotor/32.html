<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Adventure Engine - Game Studio V15.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #22d3ee;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            height: 100dvh;
            font-family: 'Play', sans-serif; 
            background-color: var(--bg-dark); 
            color: #f8fafc; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        
        #studio-view, #community-view { height: 100%; overflow-y: auto; padding: 1rem; padding-bottom: 5rem; }
        @media (min-width: 768px) { #studio-view, #community-view { padding: 2.5rem; } }
        
        #studio-view { display: none; }
        #community-view { display: block; }
        
        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 1rem; }

        /* JAVÍTÁS: Nagyobb beviteli mezők */
        .input-style { 
            background: #0f172a; 
            color: var(--secondary); 
            border: 1px solid #334155; 
            border-radius: 0.75rem; 
            padding: 0.9rem; 
            outline: none; 
            transition: 0.2s; 
            width: 100%; 
            font-size: 1rem; 
        }
        .input-style:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        
        .filter-chip { padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; border: 1px solid #334155; transition: 0.2s; cursor: pointer; background: rgba(30, 41, 59, 0.5); }
        .filter-chip.active { background: var(--primary); border-color: var(--primary); color: white; }

        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; cursor: pointer; }
        .page-item.selected { border-color: var(--secondary); background: #4c1d95; }

        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        
        /* JAVÍTÁS: Átlátszóbb szövegdobozok */
        .sim-box, .p-dialog-box { 
            position: relative; 
            background: rgba(0,0,0,0.8) !important; 
            backdrop-filter: blur(10px);
            border-top: 3px solid var(--primary); 
            border-radius: 1.5rem 1.5rem 0 0; 
            padding: 20px; padding-top: 35px; 
            min-height: 220px; 
        }

        #player-view { position: fixed; inset: 0; z-index: 9000; background: #000; display: none; flex-direction: column; height: 100dvh; }
        .p-game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 20000; display: none; align-items: center; justify-content: center; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body>

    <div id="save-indicator" class="fixed bottom-6 right-6 bg-emerald-500 text-white px-5 py-2 rounded-full font-bold text-xs z-[10000] hidden">
        <i class="fa fa-sync-alt fa-spin mr-2"></i> CLOUD SAVING...
    </div>

    <div id="confirm-modal" class="modal-overlay">
        <div class="glass-card p-8 max-sm w-full mx-4 text-center border-red-500/50">
            <div class="w-16 h-16 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl">
                <i id="confirm-icon" class="fa fa-trash-can"></i>
            </div>
            <h2 id="confirm-title" class="text-xl font-bold mb-2">Are you sure?</h2>
            <p id="confirm-desc" class="text-slate-400 text-sm mb-8">This action cannot be undone.</p>
            <div class="flex gap-4">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-slate-700 rounded-xl font-bold text-xs uppercase">Cancel</button>
                <button id="confirm-action-btn" class="flex-1 py-3 bg-red-600 rounded-xl font-bold text-xs uppercase shadow-lg shadow-red-600/20">Execute</button>
            </div>
        </div>
    </div>

    <div id="studio-view">
        <div class="max-w-7xl mx-auto flex justify-between items-center pt-4 px-4 md:px-0 mb-6">
            <button onclick="switchView('community')" class="bg-slate-800 text-slate-300 px-6 py-2.5 rounded-xl font-bold text-[10px] uppercase border border-slate-700">Back to Home</button>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-slate-800/50 px-3 py-1.5 rounded-full border border-slate-700">
                    <span class="text-[9px] uppercase font-bold text-slate-400">Public visibility</span>
                    <label class="switch">
                        <input type="checkbox" id="isPublicToggle" onchange="autoSave()">
                        <span class="slider"></span>
                    </label>
                </div>
                <img id="user-photo-studio" src="" class="w-8 h-8 rounded-full border border-slate-700">
            </div>
        </div>

        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 space-y-6">
                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <label class="text-purple-400 font-bold uppercase text-[10px]">Basic Settings</label>
                        <button onclick="newGame()" class="text-red-400 text-[10px] font-bold">RESET ALL</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="appTitle" class="input-style" placeholder="Adventure Title" oninput="autoSave()">
                        <input type="text" id="appTags" class="input-style" placeholder="Tags (mystery, city)" oninput="autoSave()">
                        <input type="url" id="globalBg" class="input-style" placeholder="Global Background URL" oninput="autoSave()">
                        <input type="url" id="initialMapLink" class="input-style" placeholder="Initial Map Link" oninput="autoSave()">
                        <input type="text" id="adminCustomAuthor" class="input-style hidden" placeholder="Custom Creator Name (Admin Only)" oninput="autoSave()">
                    </div>
                </div>

                <div class="glass-card p-6">
                    <label class="text-purple-400 font-bold uppercase text-[10px]">Scenes</label>
                    <div id="pageList" class="mt-4 max-h-60 overflow-y-auto pr-2"></div>
                    <button onclick="addPage()" class="mt-4 bg-purple-600 text-white px-6 py-2 rounded-lg text-xs font-bold">+ NEW PAGE</button>
                </div>

                <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                        <h2 class="text-xl font-bold">Editing <span id="editing-page-id" class="text-purple-500">#0</span></h2>
                        <select id="pageType" class="input-style !w-44" onchange="updateUI(); autoSave();">
                            <option value="story">Description</option>
                            <option value="choice">Choice</option>
                            <option value="password">Passcode</option>
                            <option value="qr">QR Code</option>
                            <option value="gps">GPS Point</option>
                            <option value="splash">Transition</option>
                            <option value="call">Call</option>
                        </select>
                    </div>
                    <textarea id="pageText" rows="4" class="input-style" placeholder="Story text..." oninput="autoSave()"></textarea>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <input type="url" id="pageImage" class="input-style" placeholder="Image URL" oninput="autoSave()">
                        <input type="url" id="pageBg" class="input-style" placeholder="Custom BG" oninput="autoSave()">
                    </div>

                    <div id="passwordInputs" class="hidden"><input type="text" id="passwordVal" class="input-style" placeholder="Correct Code" oninput="autoSave()"></div>
                    <div id="qrInputs" class="hidden"><input type="text" id="qrCodeVal" class="input-style" placeholder="QR Data" oninput="autoSave()"></div>
                    <div id="gpsInputs" class="hidden flex gap-2">
                        <input type="number" id="targetLat" step="any" class="input-style" placeholder="Lat" oninput="autoSave()">
                        <input type="number" id="targetLng" step="any" class="input-style" placeholder="Lng" oninput="autoSave()">
                    </div>

                    <div class="flex gap-4 pt-4 border-t border-slate-700">
                        <input type="number" id="prevIdx" class="input-style" placeholder="Prev Page #" oninput="autoSave()">
                        <input type="number" id="nextIdx" class="input-style" placeholder="Next Page #" oninput="autoSave()">
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 hidden lg:flex justify-center">
                <div class="sim-container">
                    <div id="sim-viewport">
                        <img id="sim-bg" class="absolute inset-0 w-full h-full object-cover opacity-60">
                        <div class="absolute inset-0 flex flex-col justify-end">
                            <div class="sim-box">
                                <div id="sim-actual-text" class="font-bold"></div>
                                <button onclick="togglePlayerMode()" class="mt-4 bg-purple-600 w-full py-2 rounded-lg font-bold">TEST GAME</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="community-view">
        <div class="max-w-7xl mx-auto">
            <header class="flex justify-between items-center mb-12">
                <h1 class="text-3xl font-bold uppercase tracking-tighter">Adventure Engine</h1>
                <div id="auth-area" class="flex items-center gap-4">
                    <button id="login-btn" onclick="window.login()" class="bg-purple-600 px-6 py-2 rounded-xl font-bold text-xs uppercase">Login</button>
                    <div id="user-info" class="hidden flex items-center gap-2">
                        <button onclick="switchView('studio')" class="bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold uppercase">Studio</button>
                        <img id="community-user-photo" src="" class="w-8 h-8 rounded-full">
                    </div>
                </div>
            </header>
            <div id="community-game-list" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </div>
    </div>

    <div id="player-view">
        <div class="p-game-wrapper">
            <img id="p-bg-layer" class="absolute inset-0 w-full h-full object-cover">
            <div id="p-content-layer" class="mt-auto">
                <div class="p-dialog-box">
                    <div id="p-story-text" class="text-xl font-bold mb-6"></div>
                    <div id="p-button-container" class="flex flex-col gap-3"></div>
                    <button onclick="togglePlayerMode()" class="mt-4 text-slate-500 text-xs uppercase">Exit</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const fbCfg = { apiKey: "AIzaSyCfVce17Yye6jyvpSSoW6jlh3ei7T0N618", authDomain: "kalandmotor.firebaseapp.com", projectId: "kalandmotor", storageBucket: "kalandmotor.firebasestorage.app", messagingSenderId: "108860908140", appId: "1:108860908140:web:5fbec83f4ae7b51487ee49" };
        const appId = 'kalandmotor-v15-independent';
        const app = initializeApp(fbCfg);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const defaultConfig = {
            appTitle: "New Adventure",
            isPublic: true,
            storyPages: [{ id: self.crypto.randomUUID(), content: "Welcome to the game!", pageType: "story" }]
        };

        window.config = JSON.parse(localStorage.getItem('KALAND_V15')) || defaultConfig;
        let currentUser = null;
        let pSimIdx = 0;
        let autoSaveTimeout;

        // JAVÍTÁS: Admin azonosítás
        const isAdmin = () => currentUser && currentUser.email === 'jatszmabunker@gmail.com';

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const isLoggedIn = !!user;
            document.getElementById('login-btn').classList.toggle('hidden', isLoggedIn);
            document.getElementById('user-info').classList.toggle('hidden', !isLoggedIn);
            if(isLoggedIn) {
                document.getElementById('community-user-photo').src = user.photoURL;
                document.getElementById('user-photo-studio').src = user.photoURL;
                if(isAdmin()) document.getElementById('adminCustomAuthor').classList.remove('hidden');
                
                // Felhő adat betöltése belépéskor
                const snap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'userSaves', 'latest'));
                if(snap.exists()) {
                    window.config = snap.data().config;
                    if(document.getElementById('studio-view').style.display === 'block') refreshUI();
                }
            }
            initCommunitySync();
        });

        window.login = () => signInWithPopup(auth, provider);
        window.switchView = (v) => {
            document.getElementById('studio-view').style.display = v === 'studio' ? 'block' : 'none';
            document.getElementById('community-view').style.display = v === 'community' ? 'block' : 'none';
            if(v === 'studio') refreshUI();
        };

        // JAVÍTÁS: Cross-Device AutoSave a szerkesztőben is
        window.autoSave = () => {
            const p = window.config.storyPages[window.currentIdx];
            if (p) {
                p.content = document.getElementById('pageText').value;
                p.pageType = document.getElementById('pageType').value;
                p.pageImage = document.getElementById('pageImage').value;
                p.pageBg = document.getElementById('pageBg').value;
                p.password = document.getElementById('passwordVal').value;
                p.qrCode = document.getElementById('qrCodeVal').value;
                p.targetLat = document.getElementById('targetLat').value;
                p.targetLng = document.getElementById('targetLng').value;
                p.nextPageId = getPageIdByIdx(document.getElementById('nextIdx').value);
                p.prevPageId = getPageIdByIdx(document.getElementById('prevIdx').value);
            }
            window.config.appTitle = document.getElementById('appTitle').value;
            window.config.appTags = document.getElementById('appTags').value;
            window.config.globalBg = document.getElementById('globalBg').value;
            window.config.initialMapLink = document.getElementById('initialMapLink').value;
            window.config.isPublic = document.getElementById('isPublicToggle').checked;
            
            // JAVÍTÁS: Admin egyedi név mentése
            if(isAdmin()) window.config.customAuthor = document.getElementById('adminCustomAuthor').value;

            localStorage.setItem('KALAND_V15', JSON.stringify(window.config));
            renderPageList();
            updateSimulator();

            clearTimeout(autoSaveTimeout);
            autoSaveTimeout = setTimeout(async () => {
                if (currentUser) {
                    document.getElementById('save-indicator').classList.remove('hidden');
                    await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'userSaves', 'latest'), { 
                        config: window.config, 
                        updatedAt: new Date().toISOString() 
                    });
                    // Ha publikus, a publikus listát is frissítjük
                    if(window.config.cloudId) {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', window.config.cloudId), {
                            title: window.config.appTitle,
                            author: window.config.customAuthor || currentUser.displayName,
                            authorId: currentUser.uid,
                            config: window.config,
                            updatedAt: new Date().toISOString()
                        });
                    }
                    setTimeout(() => document.getElementById('save-indicator').classList.add('hidden'), 1000);
                }
            }, 2000);
        };

        // JAVÍTÁS: Intelligens másolás és Törlés
        window.copyPage = (i) => {
            const source = window.config.storyPages[i];
            const copy = JSON.parse(JSON.stringify(source));
            copy.id = self.crypto.randomUUID();
            window.config.storyPages.splice(i + 1, 0, copy); // Közvetlenül alá
            window.autoSave();
        };

        window.deletePage = (id) => {
            window.openConfirmModal("Delete Scene?", "Are you sure?", "trash", () => {
                window.config.storyPages = window.config.storyPages.filter(p => p.id !== id);
                window.autoSave();
                window.currentIdx = 0;
                window.loadPage(0);
            });
        };

        window.loadPage = (i) => {
            window.currentIdx = i; const p = window.config.storyPages[i]; if (!p) return;
            document.getElementById('editorPanel').classList.remove('hidden');
            document.getElementById('editing-page-id').textContent = `#${i}`;
            document.getElementById('pageText').value = p.content || "";
            document.getElementById('pageType').value = p.pageType || 'story';
            document.getElementById('pageImage').value = p.pageImage || "";
            document.getElementById('pageBg').value = p.pageBg || "";
            document.getElementById('nextIdx').value = getPageIdxById(p.nextPageId) ?? "";
            document.getElementById('prevIdx').value = getPageIdxById(p.prevPageId) ?? "";
            document.getElementById('passwordVal').value = p.password || "";
            document.getElementById('qrCodeVal').value = p.qrCode || "";
            document.getElementById('targetLat').value = p.targetLat || "";
            document.getElementById('targetLng').value = p.targetLng || "";
            updateUI(); updateSimulator();
        };

        window.renderPageList = () => {
            const l = document.getElementById('pageList'); l.innerHTML = '';
            window.config.storyPages.forEach((p, i) => {
                const d = document.createElement('div');
                d.className = `page-item ${i === window.currentIdx ? 'selected' : ''}`;
                d.innerHTML = `
                    <div class="truncate font-bold text-xs">#${i}: ${p.content.substring(0,15)}...</div>
                    <div class="flex gap-2">
                        <button onclick="event.stopPropagation(); window.copyPage(${i})"><i class="fa fa-copy"></i></button>
                        <button onclick="event.stopPropagation(); window.deletePage('${p.id}')"><i class="fa fa-trash text-red-400"></i></button>
                    </div>`;
                d.onclick = () => window.loadPage(i);
                l.appendChild(d);
            });
        };

        function refreshUI() {
            document.getElementById('appTitle').value = window.config.appTitle || "";
            document.getElementById('appTags').value = window.config.appTags || "";
            document.getElementById('globalBg').value = window.config.globalBg || "";
            document.getElementById('initialMapLink').value = window.config.initialMapLink || "";
            document.getElementById('isPublicToggle').checked = window.config.isPublic !== false;
            if(isAdmin()) document.getElementById('adminCustomAuthor').value = window.config.customAuthor || "";
            renderPageList();
            window.loadPage(0);
        }

        window.updateUI = () => {
            const t = document.getElementById('pageType').value;
            document.getElementById('passwordInputs').classList.toggle('hidden', t !== 'password');
            document.getElementById('qrInputs').classList.toggle('hidden', t !== 'qr');
            document.getElementById('gpsInputs').classList.toggle('hidden', t !== 'gps');
        };

        window.updateSimulator = () => {
            const p = window.config.storyPages[window.currentIdx]; if (!p) return;
            document.getElementById('sim-bg').src = p.pageBg || window.config.globalBg || "";
            document.getElementById('sim-actual-text').textContent = p.content;
        };

        window.togglePlayerMode = () => {
            const v = document.getElementById('player-view');
            if(v.style.display !== 'flex') {
                v.style.display = 'flex'; pSimIdx = 0; pUpdateUI();
            } else v.style.display = 'none';
        };

        function pUpdateUI() {
            const p = window.config.storyPages[pSimIdx]; if(!p) return;
            document.getElementById('p-bg-layer').src = p.pageBg || window.config.globalBg || "";
            document.getElementById('p-story-text').textContent = p.content;
            const bc = document.getElementById('p-button-container'); bc.innerHTML = '';
            const btn = document.createElement('button');
            btn.className = "bg-purple-600 py-4 rounded-xl font-bold uppercase";
            btn.textContent = "Continue";
            btn.onclick = () => { pSimIdx++; pUpdateUI(); };
            bc.appendChild(btn);
        }

        function initCommunitySync() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'publishedGames'), (snap) => {
                const list = document.getElementById('community-game-list');
                list.innerHTML = '';
                snap.docs.forEach(d => {
                    const g = d.data();
                    const canEdit = isAdmin() || (currentUser && d.data().authorId === currentUser.uid);
                    const card = document.createElement('div');
                    card.className = "glass-card p-6 flex flex-col gap-4";
                    card.innerHTML = `
                        <h3 class="font-bold text-xl">${g.title}</h3>
                        <p class="text-xs text-slate-400">By: ${g.author}</p>
                        <button onclick="playPublic('${d.id}')" class="bg-purple-600 py-2 rounded-lg font-bold">PLAY</button>
                        ${canEdit ? `<button onclick="editPublic('${d.id}')" class="bg-slate-700 py-2 rounded-lg text-xs">EDIT</button>` : ''}
                    `;
                    list.appendChild(card);
                });
            });
        }

        window.playPublic = async (id) => {
            const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id));
            if(snap.exists()) { window.config = snap.data().config; togglePlayerMode(); }
        };

        window.editPublic = async (id) => {
            const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id));
            if(snap.exists()) { window.config = snap.data().config; window.config.cloudId = id; switchView('studio'); }
        };

        window.openConfirmModal = (title, desc, icon, onConfirm) => {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-desc').textContent = desc;
            const btn = document.getElementById('confirm-action-btn');
            btn.onclick = () => { onConfirm(); closeConfirmModal(); };
            document.getElementById('confirm-modal').style.display = 'flex';
        };
        window.closeConfirmModal = () => document.getElementById('confirm-modal').style.display = 'none';

        const getPageIdxById = (id) => window.config.storyPages.findIndex(p => p.id === id);
        const getPageIdByIdx = (idx) => { if(idx==="") return null; const p = window.config.storyPages[parseInt(idx)]; return p ? p.id : null; };
        
        window.addPage = () => {
            window.config.storyPages.push({ id: self.crypto.randomUUID(), content: "New scene...", pageType: "story" });
            window.autoSave();
        };

        window.newGame = () => {
            window.openConfirmModal("Reset everything?", "This will delete your current draft.", "rotate-left", () => {
                window.config = JSON.parse(JSON.stringify(defaultConfig));
                refreshUI();
                window.autoSave();
            });
        };
    </script>
</body>
</html>
