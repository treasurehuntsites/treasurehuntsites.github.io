<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Adventure Engine - Game Studio V15.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8b5cf6; --secondary: #22d3ee; --bg-dark: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; font-family: 'Play', sans-serif; background-color: var(--bg-dark); color: #f8fafc; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        #studio-view, #community-view { height: 100%; overflow-y: auto; padding: 1rem; padding-bottom: 5rem; }
        @media (min-width: 768px) { #studio-view, #community-view { padding: 2.5rem; } }
        #studio-view { display: none; }
        #community-view { display: block; }
        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 1rem; }
        .input-style { background: #0f172a; color: var(--secondary); border: 1px solid #334155; border-radius: 0.5rem; padding: 0.85rem; outline: none; transition: 0.2s; width: 100%; font-size: 1rem; }
        .input-style:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        .filter-chip { padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; border: 1px solid #334155; transition: 0.2s; cursor: pointer; background: rgba(30, 41, 59, 0.5); }
        .filter-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
        .tag-pill { background: rgba(34, 211, 238, 0.1); border: 1px solid rgba(34, 211, 238, 0.3); color: var(--secondary); padding: 2px 8px; border-radius: 4px; font-size: 9px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(22px); }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; cursor: pointer; user-select: none; }
        .page-item:hover { background: #2d3748; }
        .page-item.selected { border-color: var(--secondary); background: #4c1d95; box-shadow: 0 0 15px rgba(34, 211, 238, 0.2); }
        .handle { cursor: grab; padding: 5px 15px 5px 5px; color: #64748b; font-size: 0.9rem; }
        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; opacity: 0.6; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { position: relative; background: rgba(0,0,0,0.85); border-top: 3px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 35px; min-height: 220px; display: flex; flex-direction: column; }
        .sim-avatar { position: absolute; top: -40px; left: 10px; width: 65px; height: 65px; border-radius: 50%; border: 3px solid var(--primary); background: #000; z-index: 20; object-fit: cover; font-size: 0; }
        .sim-btn { background: var(--primary); color: white; padding: 10px; border-radius: 0.5rem; font-weight: 700; text-align: center; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; width: 100%; border: none; }
        .sim-btn-secondary, .btn-secondary { background: #334155 !important; }
        #player-view { position: fixed; inset: 0; z-index: 9000; background: #000; display: none; flex-direction: column; height: 100dvh; }
        .p-game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #p-viewport { position: relative; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s ease-in-out; }
        #p-content-layer { position: relative; z-index: 10; margin-top: auto; width: 100%; display: flex; flex-direction: column; }
        .p-dialog-box { position: relative; background: rgba(0,0,0,0.85); border-top: 4px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 25px; padding-top: 45px; min-height: 280px; max-height: 80dvh; display: flex; flex-direction: column; box-shadow: 0 -15px 35px rgba(0,0,0,0.7); }
        .p-avatar-frame { position: absolute; top: -45px; left: 20px; width: 85px; height: 85px; border-radius: 50%; border: 4px solid var(--primary); background: #000; z-index: 20; object-fit: cover; display: none; }
        #p-hint-btn { align-self: center; margin-bottom: 12px; width: 36px; height: 36px; background: rgba(139, 92, 246, 0.2); border: 2px solid var(--primary); border-radius: 50%; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: 0.2s; z-index: 50; }
        #p-story-text { text-align: justify; hyphens: auto; font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 15px; color: #f8fafc; }
        #p-button-container { display: flex; flex-direction: column; gap: 12px; width: 100%; position: relative; }
        .p-nav-row { display: flex !important; flex-direction: row !important; gap: 10px; width: 100%; margin-top: 10px; }
        .p-action-btn { flex: 1; background: var(--primary); color: white; padding: 16px; border-radius: 0.85rem; font-weight: 700; text-align: center; font-size: 1.05rem; cursor: pointer; text-transform: uppercase; transition: 0.1s; display: flex; align-items: center; justify-content: center; border: none; }
        .p-bottom-nav { height: 80px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.4); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .p-nav-item { color: #94a3b8; font-size: 1.6rem; cursor: pointer; border: none; background: transparent; position: relative; width: 25%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .p-nav-item.active { color: var(--primary); }
        .p-badge { position: absolute; top: 15px; right: 25%; background: #ef4444; color: white; font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: bold; border: 2px solid #0f172a; }
        #p-inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 150; display: none; overflow-y: auto; }
        .p-item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
        .p-item-card { background: #1e293b; border: 2px solid #334155; border-radius: 1.25rem; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 120px; position: relative; cursor: pointer; }
        .p-item-card:active { transform: scale(0.95); }
        .p-item-card img { width: 100%; height: auto; object-fit: contain; max-height: 100px; border-radius: 0.5rem; }
        .phone-ui { background: radial-gradient(circle at top, #2c3e50, #000); width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 15% 20px 10% 20px; box-sizing: border-box; text-align: center; color: white; }
        .p-call-status { color: #bdc3c7; font-size: 0.9rem; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; }
        .p-call-name { font-size: 2.8rem; font-weight: 300; margin-top: 10px; }
        .p-call-controls-wrapper { display: flex; justify-content: space-around; align-items: flex-end; width: 100%; height: 350px; margin-bottom: 20px; }
        .slide-container-v { position: relative; width: 76px; height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 6px; }
        .slide-handle-v { width: 64px; height: 64px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; cursor: grab; transition: transform 0.1s linear; touch-action: none; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .slide-handle-v.accept { background: #2ecc71; }
        .slide-handle-v.decline { background: #e74c3c; }
        .pulse-soft { animation: pulse-soft-anim 2s infinite; }
        @keyframes pulse-soft-anim { 0% { box-shadow: 0 0 0 0px rgba(46, 204, 113, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0px rgba(46, 204, 113, 0); } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 20000; display: none; align-items: center; justify-content: center; }
        #p-zoomed-img { max-width: 90%; max-height: 90%; object-fit: contain; transition: none; touch-action: none; user-select: none; transform-origin: center; }
        .hero-gradient { background: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(34, 211, 238, 0.05) 100%); }
        .feature-card { border-left: 3px solid var(--primary); transition: 0.3s; }
        .feature-card:hover { transform: translateX(5px); background: rgba(255,255,255,0.03); }
        @keyframes fadeInOutSplash { 0% { opacity: 0; transform: scale(0.9); } 20% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
        .splash-text-anim { font-family: 'Special Elite', cursive; animation: fadeInOutSplash 10s ease-in-out forwards; text-transform: uppercase; letter-spacing: 0.2em; }
    </style>
</head>
<body>
<div id="save-indicator" class="fixed bottom-6 right-6 bg-emerald-500 text-white px-5 py-2 rounded-full font-bold text-xs z-[10000] hidden">
    <i class="fa fa-sync-alt fa-spin mr-2"></i> SAVING...
</div>
<div id="confirm-modal" class="modal-overlay">
    <div class="glass-card p-8 max-sm w-full mx-4 text-center border-red-500/50">
        <div class="w-16 h-16 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl">
            <i id="confirm-icon" class="fa fa-trash-can"></i>
        </div>
        <h2 id="confirm-title" class="text-xl font-bold mb-2">Are you sure?</h2>
        <p id="confirm-desc" class="text-slate-400 text-sm mb-8">This action cannot be undone.</p>
        <div class="flex gap-4">
            <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-slate-700 rounded-xl font-bold text-xs uppercase">Cancel</button>
            <button id="confirm-action-btn" class="flex-1 py-3 bg-red-600 rounded-xl font-bold text-xs uppercase shadow-lg shadow-red-600/20">Execute</button>
        </div>
    </div>
</div>
<div id="hint-modal" class="modal-overlay">
    <div class="glass-card p-8 max-w-sm w-full mx-4 text-center">
        <div id="hint-confirm-view">
            <h3 class="text-xl font-bold mb-4 uppercase text-cyan-400">Request Help</h3>
            <p class="text-slate-400 mb-8 text-sm">Are you sure you want to see the next hint?</p>
            <div class="flex gap-4">
                <button onclick="closeHintModal()" class="flex-1 py-3 bg-slate-700 rounded-xl font-bold text-xs uppercase">Cancel</button>
                <button id="hint-show-btn" onclick="window.pShowHint()" class="flex-1 py-3 bg-purple-600 rounded-xl font-bold text-xs uppercase">Yes, please</button>
            </div>
        </div>
        <div id="hint-display-view" class="hidden">
            <h3 class="text-xl font-bold mb-4 uppercase text-purple-400">Guidance</h3>
            <p id="hint-text" class="text-white text-lg font-bold mb-8 italic"></p>
            <button onclick="closeHintModal()" class="w-full py-3 bg-cyan-600 rounded-xl font-bold text-xs uppercase">Got it</button>
        </div>
    </div>
</div>

<div id="studio-view">
    <div class="max-w-7xl mx-auto flex justify-between items-center pt-4 px-4 md:px-0 mb-6">
        <button onclick="switchView('community')" class="bg-slate-800 text-slate-300 px-6 py-2.5 rounded-xl font-bold text-[10px] uppercase border border-slate-700 hover:border-purple-500 transition-all">Back to Home</button>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-slate-800/50 px-3 py-1.5 rounded-full border border-slate-700">
                <span class="text-[9px] uppercase font-bold text-slate-400">Public visibility</span>
                <label class="switch"><input type="checkbox" id="isPublicToggle" onchange="autoSave()"><span class="slider"></span></label>
            </div>
            <div id="user-info-studio" class="flex items-center gap-2 bg-slate-800 p-1 rounded-full border border-slate-700">
                <img id="user-photo-studio" src="" class="w-8 h-8 rounded-full">
                <button onclick="window.logout()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-red-400 transition-colors"><i class="fa fa-sign-out-alt"></i></button>
            </div>
        </div>
    </div>
    <div class="max-w-7xl mx-auto">
        <header class="mb-10 flex flex-col md:flex-row justify-center items-center gap-4">
            <button onclick="togglePlayerMode()" class="bg-purple-600 text-white px-10 py-3.5 rounded-xl font-bold text-[10px] uppercase shadow-lg w-full md:w-auto"><i class="fa fa-play mr-2"></i> Start Test</button>
            <button id="publish-btn" onclick="publishGame()" class="bg-emerald-600 text-white px-10 py-3.5 rounded-xl font-bold text-[10px] uppercase shadow-lg w-full md:w-auto">Publish</button>
        </header>
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 space-y-6">
                <div class="glass-card p-6">
                    <div class="flex justify-between items-end mb-3">
                        <label class="text-purple-400 font-bold uppercase text-[10px]">Basic Settings</label>
                        <button onclick="newGame()" class="w-8 h-8 bg-slate-700 text-white rounded-lg flex items-center justify-center hover:bg-slate-600 transition-all shadow-lg border border-slate-600"><i class="fa fa-plus"></i></button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-3">
                            <input type="text" id="appTitle" class="input-style" placeholder="Adventure Title" oninput="autoSave()">
                            <input type="text" id="appAuthor" class="input-style hidden" placeholder="Creator Name (Admin only)" oninput="autoSave()">
                            <input type="text" id="appTags" class="input-style" placeholder="Tags" oninput="autoSave()">
                            <input type="url" id="globalBg" class="input-style" placeholder="Global Background URL" oninput="autoSave()">
                            <input type="url" id="initialMapLink" class="input-style" placeholder="Main Map Link" oninput="autoSave()">
                            <div class="flex gap-2 pt-2">
                                <button onclick="window.importGame()" class="flex-1 bg-slate-800 text-slate-400 border border-slate-700 py-2 rounded-lg font-bold text-[9px] uppercase">Import</button>
                                <button onclick="window.exportGame()" class="flex-1 bg-slate-800 text-slate-400 border border-slate-700 py-2 rounded-lg font-bold text-[9px] uppercase">Export</button>
                            </div>
                        </div>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center"><label class="text-slate-500 font-bold uppercase text-[9px]">Avatars</label><button onclick="addAvatar()" class="text-cyan-400 text-[9px] font-bold">+ NEW</button></div>
                            <div id="avatarList" class="space-y-2 max-h-60 overflow-y-auto"></div>
                        </div>
                    </div>
                </div>
                <div class="glass-card p-6">
                    <label class="text-purple-400 font-bold uppercase text-[10px]">Scenes</label>
                    <div id="pageList" class="mt-4 max-h-60 overflow-y-auto pr-2"></div>
                    <button onclick="addPage()" class="mt-4 bg-purple-600 text-white px-4 py-2 rounded-lg text-[10px] font-bold">+ NEW PAGE</button>
                </div>
                <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                        <h2 class="text-xl font-bold text-white"><span id="editing-page-id" class="text-purple-500">#0</span></h2>
                        <select id="pageType" class="input-style !w-44" onchange="updateUI(); autoSave();">
                            <option value="story">Description</option>
                            <option value="choice">Choice</option>
                            <option value="password">Passcode</option>
                            <option value="qr">QR Code</option>
                            <option value="gps">GPS Point</option>
                            <option value="splash">Transition</option>
                            <option value="call">Call</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <div class="flex items-center justify-between"><label class="text-purple-400 font-bold uppercase text-[10px]">Story Text</label><div id="avatarQuickSelect" class="flex gap-2"></div></div>
                        <textarea id="pageText" rows="5" class="input-style" oninput="autoSave()"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="url" id="pageImage" class="input-style text-xs" placeholder="Image URL" oninput="autoSave()">
                        <input type="url" id="pageBg" class="input-style text-xs" placeholder="Custom BG" oninput="autoSave()">
                    </div>
                    <div id="passwordInputs" class="hidden space-y-3"><input type="text" id="passwordVal" class="input-style" placeholder="Code" oninput="autoSave()"><textarea id="pageHints" class="input-style text-xs" placeholder="Hints" oninput="autoSave()"></textarea></div>
                    <div id="qrInputs" class="hidden"><input type="text" id="qrCodeVal" class="input-style" placeholder="QR code" oninput="autoSave()"></div>
                    <div id="gpsInputs" class="hidden grid grid-cols-2 gap-4"><input type="number" id="targetLat" step="any" class="input-style" placeholder="Lat" oninput="autoSave()"><input type="number" id="targetLng" step="any" class="input-style" placeholder="Lng" oninput="autoSave()"></div>
                    <div id="choiceEditor" class="hidden space-y-3 pt-4 border-t border-slate-700"><div id="choiceList" class="space-y-2"></div><button onclick="addChoice()" class="text-cyan-400 text-[10px] font-bold">+ NEW OPTION</button></div>
                    <div class="pt-4 border-t border-slate-700 grid grid-cols-2 gap-4">
                        <input type="number" id="prevIdx" class="input-style" placeholder="Prev #" oninput="autoSave()">
                        <input type="number" id="nextIdx" class="input-style" placeholder="Next #" oninput="autoSave()">
                    </div>
                </div>
            </div>
            <div class="lg:col-span-4 hidden lg:flex justify-center">
                <div class="sim-container"><div id="sim-viewport"><img id="sim-bg" src=""><div id="sim-content"><div class="sim-box"><img id="sim-avatar" class="sim-avatar" src=""><div id="sim-scroll" class="overflow-y-auto flex-grow"><div id="sim-actual-text" style="font-size: 16px; font-weight: 700;"></div></div><div id="sim-actions" class="mt-4"></div></div></div></div></div>
            </div>
        </div>
    </div>
</div>

<div id="community-view">
    <div class="max-w-7xl mx-auto pb-20">
        <header class="mb-12 flex flex-col sm:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-4"><img src="https://treasurehuntsites.github.io/kalandmotor/logo.png" class="w-12 h-12"><div><h1 class="text-2xl font-bold uppercase text-white">Adventure Engine</h1></div></div>
            <div class="flex items-center gap-4"><button id="community-studio-btn" onclick="switchView('studio')" class="hidden bg-purple-600 text-white px-8 py-3 rounded-2xl font-bold text-xs uppercase">Studio</button></div>
        </header>
        <div id="community-game-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </div>
</div>

<div id="player-view">
    <div id="p-qr-layer" class="hidden absolute inset-0 bg-black z-[10000] flex flex-col items-center justify-center">
        <div id="p-qr-reader" class="w-64 h-64 border-2 border-cyan-400 rounded-3xl overflow-hidden"></div>
        <button onclick="pStopQR()" class="mt-8 bg-red-600 text-white px-10 py-4 rounded-xl font-bold uppercase">Cancel</button>
    </div>
    <div id="p-splash-screen" class="absolute inset-0 bg-black z-[5000] hidden flex items-center justify-center"><div id="p-splash-text" class="text-white text-center p-10 splash-text-anim text-4xl"></div></div>
    <div id="p-call-screen" class="absolute inset-0 z-[5500] hidden">
        <div class="phone-ui">
            <div class="pt-10"><p id="p-call-status" class="p-call-status">INCOMING CALL</p><h1 id="p-call-name" class="p-call-name">Unknown</h1></div>
            <div id="p-call-controls" class="p-call-controls-wrapper">
                <div class="slide-container-v"><div class="slide-handle-v decline" id="p-handle-decline"><i class="fa fa-phone" style="transform: rotate(135deg);"></i></div></div>
                <div class="slide-container-v"><div class="slide-handle-v accept pulse-soft" id="p-handle-accept"><i class="fa fa-phone"></i></div></div>
            </div>
        </div>
    </div>
    <div id="p-image-zoom" class="modal-overlay" onclick="window.pCloseZoom()"><img id="p-zoomed-img" src=""></div>
    <div class="p-game-wrapper">
        <div id="p-viewport">
            <img id="p-bg-layer" src="" class="absolute inset-0 w-full h-full object-cover">
            <div id="p-content-layer">
                <div class="p-dialog-box">
                    <img id="p-avatar-img" class="p-avatar-frame" src="">
                    <div id="p-scroll-area" class="overflow-y-auto flex-grow mb-4"><img id="p-page-illustration" class="w-full rounded-2xl mb-6 hidden"><div id="p-story-text"></div></div>
                    <div id="p-button-container" class="flex flex-col"></div>
                </div>
            </div>
        </div>
        <div class="p-bottom-nav">
            <button class="p-nav-item" onclick="pOpenMap()"><i class="fa fa-map-marked-alt"></i></button>
            <button class="p-nav-item" onclick="pToggleInventory()"><i class="fa fa-briefcase"></i><div id="p-inv-badge" class="p-badge hidden">0</div></button>
            <button class="p-nav-item" onclick="pResetGame()"><i class="fa fa-rotate-right"></i></button>
            <button class="p-nav-item" onclick="toggleFullScreen()"><i class="fa fa-expand"></i></button>
        </div>
    </div>
</div>

<audio id="p-ringtone-audio" loop></audio>
<audio id="p-call-voice-audio"></audio>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signInAnonymously, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

const fbCfg = { apiKey: "AIzaSyCfVce17Yye6jyvpSSoW6jlh3ei7T0N618", authDomain: "kalandmotor.firebaseapp.com", projectId: "kalandmotor", storageBucket: "kalandmotor.firebasestorage.app", messagingSenderId: "108860908140", appId: "1:108860908140:web:5fbec83f4ae7b51487ee49" };
const appId = 'kalandmotor-v15-independent';
const app = initializeApp(fbCfg);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const defaultConfig = {
    appTitle: "The Forgotten Path", appAuthor: "", appTags: "mystery", 
    globalBg: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?q=80&w=2000",
    initialMapLink: "https://goo.gl/maps/RVNTKULSiVMahYHg9?g_st=ac",
    isPublic: true, avatars: [{ id: 'A', name: 'Narrator', url: '', color: '#8b5cf6' }],
    storyPages: [{ id: self.crypto.randomUUID(), content: "Welcome! §A", pageType: "story", rewards: [], hints: "" }]
};

window.config = JSON.parse(localStorage.getItem('KALAND_V15')) || defaultConfig;
let pSimIdx = 0, pInventory = [], pQrScanner = null, currentUser = null, gpsWatcher = null;

onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    const isLoggedIn = user && !user.isAnonymous;
    const isAdmin = user && user.email === 'jatszmabunker@gmail.com';
    
    document.getElementById('community-studio-btn')?.classList.toggle('hidden', !isLoggedIn);
    document.getElementById('appAuthor')?.classList.toggle('hidden', !isAdmin);
    
    if (isLoggedIn) {
        document.getElementById('user-photo-studio').src = user.photoURL;
        const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'userSaves', 'latest');
        const snap = await getDoc(ref);
        if (snap.exists()) { window.config = snap.data().config; window.refreshUI(); }
    }
    window.initCommunitySync();
});

window.login = () => signInWithPopup(auth, provider);
window.logout = () => signOut(auth).then(() => location.reload());

window.switchView = (v) => {
    document.getElementById('studio-view').style.display = v === 'studio' ? 'block' : 'none';
    document.getElementById('community-view').style.display = v === 'community' ? 'block' : 'none';
    if(v==='studio') window.refreshUI();
};

window.autoSave = () => {
    const p = window.config.storyPages[window.currentIdx];
    if (p) {
        p.content = document.getElementById('pageText').value;
        p.pageType = document.getElementById('pageType').value;
        p.pageImage = document.getElementById('pageImage').value;
        p.pageBg = document.getElementById('pageBg').value;
        p.nextPageId = window.getPageIdByIdx(document.getElementById('nextIdx').value);
        p.prevPageId = window.getPageIdByIdx(document.getElementById('prevIdx').value);
    }
    window.config.appTitle = document.getElementById('appTitle').value;
    window.config.appAuthor = document.getElementById('appAuthor')?.value || "";
    window.config.isPublic = document.getElementById('isPublicToggle').checked;
    localStorage.setItem('KALAND_V15', JSON.stringify(window.config));
    window.updateSimulator();
    if (currentUser && !currentUser.isAnonymous) window.saveGame();
};

window.saveGame = async () => {
    document.getElementById('save-indicator').classList.remove('hidden');
    await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'userSaves', 'latest'), { config: window.config, updatedAt: new Date().toISOString() });
    setTimeout(() => document.getElementById('save-indicator').classList.add('hidden'), 500);
};

window.publishGame = async () => {
    const gid = window.config.cloudId || self.crypto.randomUUID();
    window.config.cloudId = gid;
    const author = window.config.appAuthor || currentUser.displayName;
    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', gid), { title: window.config.appTitle, author, authorId: currentUser.uid, config: window.config, updatedAt: new Date().toISOString() });
    alert("Published!");
};

window.loadPage = (i) => {
    window.currentIdx = i; const p = window.config.storyPages[i];
    document.getElementById('editorPanel').classList.remove('hidden');
    document.getElementById('editing-page-id').textContent = `#${i}`;
    document.getElementById('pageText').value = p.content || "";
    document.getElementById('nextIdx').value = window.getPageIdxById(p.nextPageId) ?? "";
    document.getElementById('prevIdx').value = window.getPageIdxById(p.prevPageId) ?? "";
    window.updateUI(); window.updateSimulator(); window.renderPageList();
};

window.getPageIdxById = (id) => window.config.storyPages.findIndex(p => p.id === id);
window.getPageIdByIdx = (idx) => { if (idx==="") return null; const p = window.config.storyPages[parseInt(idx)]; return p ? p.id : null; };

window.deletePage = (id) => {
    const idx = window.config.storyPages.findIndex(p => p.id === id);
    if (idx !== -1) {
        window.config.storyPages.splice(idx, 1);
        window.autoSave();
        window.refreshUI();
    }
};

window.renderPageList = () => {
    const l = document.getElementById('pageList'); l.innerHTML = '';
    window.config.storyPages.forEach((p, i) => {
        const d = document.createElement('div'); d.className = `page-item ${i === window.currentIdx ? 'selected' : ''}`; d.dataset.id = p.id;
        d.innerHTML = `<div class="flex items-center gap-2 truncate font-bold text-sm"><i class="fa fa-bars handle"></i>#${i}: ${p.content.substring(0,15)}</div>
        <div class="flex gap-2"><button onclick="event.stopPropagation(); window.copyPage(${i})"><i class="fa fa-copy"></i></button>
        <button onclick="event.stopPropagation(); window.openConfirmModal('Delete?','Remove?','trash',()=>{window.deletePage('${p.id}');})"><i class="fa fa-trash text-red-400"></i></button></div>`;
        d.onclick = () => window.loadPage(i); l.appendChild(d);
    });
};

window.initSortable = () => {
    new Sortable(document.getElementById('pageList'), { handle: '.handle', animation: 150, onEnd: () => {
        window.config.storyPages = Array.from(document.getElementById('pageList').children).map(item => window.config.storyPages.find(p => p.id === item.dataset.id));
        window.autoSave(); window.renderPageList();
    }});
};

window.refreshUI = () => {
    document.getElementById('appTitle').value = window.config.appTitle || "";
    document.getElementById('isPublicToggle').checked = window.config.isPublic !== false;
    window.renderPageList(); window.loadPage(0); window.initSortable();
};

window.initCommunitySync = () => {
    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'publishedGames'), (snap) => {
        const list = document.getElementById('community-game-list'); list.innerHTML = '';
        snap.docs.forEach(d => {
            const g = d.data();
            const isAdmin = currentUser && currentUser.email === 'jatszmabunker@gmail.com';
            const canEdit = isAdmin || (currentUser && g.authorId === currentUser.uid);
            const card = document.createElement('div'); card.className = "glass-card p-6 border border-slate-700";
            card.innerHTML = `<h3 class="font-bold text-xl mb-2">${g.title}</h3><p class="text-xs text-slate-400 mb-4">By: ${g.author}</p>
            <button class="w-full bg-purple-600 py-3 rounded-xl font-bold uppercase text-xs" onclick="window.loadAndPlayPublicGame('${d.id}')">Play</button>
            ${canEdit ? `<button class="w-full mt-2 bg-slate-800 py-2 rounded-lg text-xs" onclick="window.loadAndEditPublicGame('${d.id}')">Edit</button>` : ''}`;
            list.appendChild(card);
        });
    });
};

window.pUpdateUI = () => {
    const p = window.config.storyPages[pSimIdx]; if (!p) return;
    document.getElementById('p-bg-layer').src = p.pageBg || window.config.globalBg;
    let text = p.content || "";
    window.config.avatars.forEach(av => {
        if (text.includes(`§${av.id}`)) {
            const frame = document.getElementById('p-avatar-img'); frame.src = av.url; frame.style.display = av.url ? 'block' : 'none';
            text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color}">${av.name}:</span>`);
        }
    });
    document.getElementById('p-story-text').innerHTML = text;
    const bc = document.getElementById('p-button-container'); bc.innerHTML = '';
    const btn = document.createElement('button'); btn.className = "p-action-btn"; btn.textContent = "Next";
    btn.onclick = () => { pSimIdx = window.getPageIdxById(p.nextPageId) !== -1 ? window.getPageIdxById(p.nextPageId) : pSimIdx + 1; window.pUpdateUI(); };
    bc.appendChild(btn);
};

window.openConfirmModal = (title, desc, icon, onConfirm) => {
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-icon').className = `fa fa-${icon}`;
    document.getElementById('confirm-action-btn').onclick = () => { onConfirm(); window.closeConfirmModal(); };
    document.getElementById('confirm-modal').style.display = 'flex';
};
window.closeConfirmModal = () => document.getElementById('confirm-modal').style.display = 'none';

window.togglePlayerMode = () => {
    const v = document.getElementById('player-view');
    v.style.display = v.style.display === 'flex' ? 'none' : 'flex';
    if(v.style.display === 'flex') { pSimIdx = 0; window.pUpdateUI(); }
};

window.copyPage = (i) => {
    const c = JSON.parse(JSON.stringify(window.config.storyPages[i]));
    c.id = self.crypto.randomUUID();
    window.config.storyPages.splice(i + 1, 0, c);
    window.autoSave(); window.renderPageList();
};

function setupSliders() {
    const sliders = [{h:'p-handle-accept', cb:()=>alert('Accepted')}, {h:'p-handle-decline', cb:()=>alert('Declined')}];
    sliders.forEach(s => {
        const h = document.getElementById(s.h); if(!h) return;
        let sY=0, isD=false;
        h.addEventListener('touchstart', e=>{ sY=e.touches[0].clientY; isD=true; });
        h.addEventListener('touchmove', e=>{ if(!isD) return; let d=Math.max(-180, Math.min(0, e.touches[0].clientY-sY)); h.style.transform=`translateY(${d}px)`; });
        h.addEventListener('touchend', ()=>{ if(!isD) return; isD=false; h.style.transform='translateY(0px)'; });
    });
}

window.onload = () => { setupSliders(); signInAnonymously(auth); };
window.addPage = () => { window.config.storyPages.push({ id: self.crypto.randomUUID(), content: "New scene...", pageType: "story" }); window.autoSave(); window.renderPageList(); };
window.newGame = () => { window.config = JSON.parse(JSON.stringify(defaultConfig)); window.refreshUI(); };
window.loadAndEditPublicGame = async (id) => { const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id)); if(snap.exists()){ window.config = snap.data().config; window.switchView('studio'); } };
window.loadAndPlayPublicGame = async (id) => { const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id)); if(snap.exists()){ window.config = snap.data().config; window.togglePlayerMode(); } };
</script>
</body>
</html>
