<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Adventure Engine - Game Studio V15.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #22d3ee;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            height: 100dvh;
            font-family: 'Play', sans-serif; 
            background-color: var(--bg-dark); 
            color: #f8fafc; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        
        #studio-view, #community-view { height: 100%; overflow-y: auto; padding: 1rem; padding-bottom: 5rem; }
        @media (min-width: 768px) { #studio-view, #community-view { padding: 2.5rem; } }
        
        #studio-view { display: none; }
        #community-view { display: block; }
        
        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 1rem; }

        .input-style { background: #0f172a; color: var(--secondary); border: 1px solid #334155; border-radius: 0.5rem; padding: 0.6rem; outline: none; transition: 0.2s; width: 100%; font-size: 0.875rem; }
        .input-style:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; cursor: pointer; }
        .page-item.selected { border-color: var(--secondary); background: #4c1d95; }
        .handle { cursor: grab; padding: 5px; color: #64748b; }

        /* Mobil előnézet (Simulator) - Olyan mint az élő játék */
        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .sim-dialog-box { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.92); border-top: 3px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 20px; min-height: 220px; display: flex; flex-direction: column; }
        .sim-avatar { position: absolute; top: -35px; left: 15px; width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--primary); background: #000; object-fit: cover; }

        /* Játék nézet stílusok */
        #player-view { position: fixed; inset: 0; z-index: 9000; background: #000; display: none; flex-direction: column; height: 100dvh; }
        .p-dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 4px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 25px; padding-top: 45px; min-height: 280px; display: flex; flex-direction: column; }
        .p-avatar-frame { position: absolute; top: -45px; left: 20px; width: 85px; height: 85px; border-radius: 50%; border: 4px solid var(--primary); background: #000; z-index: 20; object-fit: cover; display: none; }
        .p-action-btn { background: var(--primary); color: white; padding: 16px; border-radius: 0.85rem; font-weight: 700; text-align: center; cursor: pointer; text-transform: uppercase; border: none; width: 100%; margin-bottom: 10px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 20000; display: none; align-items: center; justify-content: center; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body>

    <div id="save-indicator" class="fixed bottom-6 right-6 bg-emerald-500 text-white px-5 py-2 rounded-full font-bold text-xs z-[10000] hidden">
        <i class="fa fa-sync-alt fa-spin mr-2"></i> CLOUD SYNC...
    </div>

    <div id="confirm-modal" class="modal-overlay">
        <div class="glass-card p-8 max-sm w-full mx-4 text-center">
            <h2 id="confirm-title" class="text-xl font-bold mb-2">Are you sure?</h2>
            <p id="confirm-desc" class="text-slate-400 text-sm mb-8">This action cannot be undone.</p>
            <div class="flex gap-4">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-slate-700 rounded-xl font-bold text-xs uppercase">Cancel</button>
                <button id="confirm-action-btn" class="flex-1 py-3 bg-red-600 rounded-xl font-bold text-xs uppercase">Execute</button>
            </div>
        </div>
    </div>

    <div id="studio-view">
        <div class="max-w-7xl mx-auto flex justify-between items-center mb-6">
            <button onclick="switchView('community')" class="bg-slate-800 text-slate-300 px-6 py-2.5 rounded-xl font-bold text-[10px] uppercase border border-slate-700">Back to Home</button>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-slate-800/50 px-3 py-1.5 rounded-full border border-slate-700">
                    <span class="text-[9px] uppercase font-bold text-slate-400">Public</span>
                    <label class="switch"><input type="checkbox" id="isPublicToggle" onchange="autoSave()"><span class="slider"></span></label>
                </div>
                <img id="user-photo-studio" src="" class="w-8 h-8 rounded-full">
            </div>
        </div>

        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 space-y-6">
                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-purple-400 font-bold uppercase text-[10px]">Settings</label>
                        <button onclick="newGame()" class="text-red-400 text-[10px] font-bold">NEW GAME</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="appTitle" class="input-style" placeholder="Title" oninput="autoSave()">
                        <input type="text" id="appTags" class="input-style" placeholder="Tags" oninput="autoSave()">
                        <input type="url" id="globalBg" class="input-style" placeholder="Global Background URL" oninput="autoSave()">
                        <input type="url" id="initialMapLink" class="input-style" placeholder="Map Link" oninput="autoSave()">
                    </div>
                    <div class="mt-4 pt-4 border-t border-slate-700">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-slate-500 font-bold uppercase text-[9px]">Avatars</label>
                            <button onclick="addAvatar()" class="text-cyan-400 text-[9px] font-bold">+ ADD NEW</button>
                        </div>
                        <div id="avatarList" class="space-y-2 max-h-40 overflow-y-auto"></div>
                    </div>
                </div>

                <div class="glass-card p-6">
                    <label class="text-purple-400 font-bold uppercase text-[10px]">Scenes</label>
                    <div id="pageList" class="mt-4 max-h-60 overflow-y-auto pr-2"></div>
                    <button onclick="addPage()" class="mt-4 bg-purple-600 text-white px-4 py-2 rounded-lg text-[10px] font-bold">+ NEW PAGE</button>
                </div>

                <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                        <h2 class="text-xl font-bold">Editing #<span id="editing-page-id">0</span></h2>
                        <select id="pageType" class="input-style !w-44" onchange="updateUI(); autoSave();">
                            <option value="story">Description</option>
                            <option value="choice">Choice</option>
                            <option value="password">Passcode</option>
                            <option value="qr">QR Code</option>
                            <option value="gps">GPS Point</option>
                            <option value="splash">Transition</option>
                            <option value="call">Call</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <div class="flex items-center justify-between">
                            <label class="text-purple-400 font-bold uppercase text-[10px]">Text (use §ID for avatars)</label>
                            <div id="avatarQuickSelect" class="flex gap-2"></div>
                        </div>
                        <textarea id="pageText" rows="4" class="input-style" oninput="autoSave()"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <input type="url" id="pageImage" class="input-style" placeholder="Image URL" oninput="autoSave()">
                        <input type="url" id="pageBg" class="input-style" placeholder="Page BG URL" oninput="autoSave()">
                    </div>

                    <div id="passwordInputs" class="hidden"><input type="text" id="passwordVal" class="input-style" placeholder="Passcode" oninput="autoSave()"></div>
                    <div id="qrInputs" class="hidden"><input type="text" id="qrCodeVal" class="input-style" placeholder="QR Data" oninput="autoSave()"></div>
                    <div id="gpsInputs" class="hidden grid grid-cols-2 gap-2">
                        <input type="number" id="targetLat" step="any" class="input-style" placeholder="Lat" oninput="autoSave()">
                        <input type="number" id="targetLng" step="any" class="input-style" placeholder="Lng" oninput="autoSave()">
                    </div>
                    <div id="callInputs" class="hidden grid grid-cols-2 gap-2">
                        <input type="url" id="ringtoneUrl" class="input-style" placeholder="Ringtone URL" oninput="autoSave()">
                        <input type="url" id="voiceUrl" class="input-style" placeholder="Voice Clip URL" oninput="autoSave()">
                    </div>
                    <div id="choiceEditor" class="hidden space-y-2">
                        <div id="choiceList" class="space-y-2"></div>
                        <button onclick="addChoice()" class="text-cyan-400 text-[10px] font-bold">+ ADD OPTION</button>
                    </div>

                    <div class="pt-4 border-t border-slate-700 grid grid-cols-2 gap-4">
                        <input type="number" id="prevIdx" class="input-style" placeholder="Prev Page #" oninput="autoSave()">
                        <input type="number" id="nextIdx" class="input-style" placeholder="Next Page #" oninput="autoSave()">
                        <input type="url" id="externalUrl" class="input-style col-span-2" placeholder="External Link (Auto-open)" oninput="autoSave()">
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 hidden lg:flex justify-center">
                <div class="sim-container">
                    <div id="sim-viewport">
                        <img id="sim-bg" src="">
                        <div class="sim-dialog-box">
                            <img id="sim-avatar" class="sim-avatar hidden" src="">
                            <div id="sim-actual-text" class="text-sm font-bold overflow-y-auto flex-grow"></div>
                            <div id="sim-actions" class="mt-4">
                                <button onclick="togglePlayerMode()" class="bg-purple-600 w-full py-2 rounded-lg text-xs font-bold uppercase">Start Full Test</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="community-view">
        <div class="max-w-7xl mx-auto">
            <header class="flex justify-between items-center mb-10">
                <h1 class="text-2xl font-bold uppercase">Adventure Engine</h1>
                <div id="auth-area">
                    <button id="login-btn" onclick="window.login()" class="bg-purple-600 px-6 py-2 rounded-xl font-bold text-xs uppercase">Login</button>
                    <div id="user-info" class="hidden flex items-center gap-2">
                        <button onclick="switchView('studio')" class="bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold uppercase">Studio</button>
                        <img id="community-user-photo" src="" class="w-8 h-8 rounded-full">
                    </div>
                </div>
            </header>
            <div id="community-game-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <div id="player-view">
        <div class="p-game-wrapper">
            <img id="p-bg-layer" class="absolute inset-0 w-full h-full object-cover">
            <div class="mt-auto">
                <div class="p-dialog-box">
                    <img id="p-avatar-img" class="p-avatar-frame" src="">
                    <div id="p-story-text" class="mb-6"></div>
                    <div id="p-button-container"></div>
                    <button onclick="togglePlayerMode()" class="mt-4 text-slate-500 text-xs uppercase">Exit</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const fbCfg = { apiKey: "AIzaSyCfVce17Yye6jyvpSSoW6jlh3ei7T0N618", authDomain: "kalandmotor.firebaseapp.com", projectId: "kalandmotor", storageBucket: "kalandmotor.firebasestorage.app", messagingSenderId: "108860908140", appId: "1:108860908140:web:5fbec83f4ae7b51487ee49" };
        const appId = 'kalandmotor-v15-independent';
        const app = initializeApp(fbCfg);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const defaultConfig = {
            appTitle: "Forgotten Path",
            globalBg: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?q=80&w=2000",
            isPublic: true,
            storyPages: [{ id: self.crypto.randomUUID(), content: "Welcome §A", pageType: "story" }],
            avatars: [{ id: 'A', name: 'Narrator', url: '', color: '#8b5cf6' }]
        };

        window.config = JSON.parse(localStorage.getItem('KALAND_V15')) || defaultConfig;
        let currentUser = null;
        let pSimIdx = 0;
        let autoSaveTimeout;

        const isAdmin = () => currentUser && currentUser.email === 'jatszmabunker@gmail.com';

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if(user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('community-user-photo').src = user.photoURL;
                document.getElementById('user-photo-studio').src = user.photoURL;
                const snap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'userSaves', 'latest'));
                if(snap.exists()) {
                    window.config = snap.data().config;
                    if(document.getElementById('studio-view').style.display === 'block') refreshUI();
                }
            }
            initCommunitySync();
        });

        window.login = () => signInWithPopup(auth, provider);
        window.switchView = (v) => {
            document.getElementById('studio-view').style.display = v === 'studio' ? 'block' : 'none';
            document.getElementById('community-view').style.display = v === 'community' ? 'block' : 'none';
            if(v === 'studio') refreshUI();
        };

        // Cloud Auto-Save
        window.autoSave = () => {
            const p = window.config.storyPages[window.currentIdx];
            if (p) {
                p.content = document.getElementById('pageText').value;
                p.pageType = document.getElementById('pageType').value;
                p.pageImage = document.getElementById('pageImage').value;
                p.pageBg = document.getElementById('pageBg').value;
                p.password = document.getElementById('passwordVal').value;
                p.qrCode = document.getElementById('qrCodeVal').value;
                p.targetLat = document.getElementById('targetLat').value;
                p.targetLng = document.getElementById('targetLng').value;
                p.ringtoneUrl = document.getElementById('ringtoneUrl').value;
                p.voiceUrl = document.getElementById('voiceUrl').value;
                p.externalUrl = document.getElementById('externalUrl').value;
                p.nextPageId = getPageIdByIdx(document.getElementById('nextIdx').value);
                p.prevPageId = getPageIdByIdx(document.getElementById('prevIdx').value);
            }
            window.config.appTitle = document.getElementById('appTitle').value;
            window.config.appTags = document.getElementById('appTags').value;
            window.config.globalBg = document.getElementById('globalBg').value;
            window.config.initialMapLink = document.getElementById('initialMapLink').value;
            window.config.isPublic = document.getElementById('isPublicToggle').checked;

            localStorage.setItem('KALAND_V15', JSON.stringify(window.config));
            renderPageList();
            updateSimulator();

            clearTimeout(autoSaveTimeout);
            autoSaveTimeout = setTimeout(async () => {
                if (currentUser) {
                    document.getElementById('save-indicator').classList.remove('hidden');
                    await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'userSaves', 'latest'), { config: window.config, updatedAt: new Date().toISOString() });
                    setTimeout(() => document.getElementById('save-indicator').classList.add('hidden'), 1000);
                }
            }, 2000);
        };

        window.copyPage = (i) => {
            const copy = JSON.parse(JSON.stringify(window.config.storyPages[i]));
            copy.id = self.crypto.randomUUID();
            window.config.storyPages.splice(i + 1, 0, copy); // Közvetlenül alá
            window.autoSave();
        };

        window.deletePage = (id) => {
            window.openConfirmModal("Delete?", "Scene removal?", "trash", () => {
                window.config.storyPages = window.config.storyPages.filter(p => p.id !== id);
                window.autoSave();
            });
        };

        window.loadPage = (i) => {
            window.currentIdx = i; const p = window.config.storyPages[i]; if (!p) return;
            document.getElementById('editorPanel').classList.remove('hidden');
            document.getElementById('editing-page-id').textContent = i;
            document.getElementById('pageText').value = p.content || "";
            document.getElementById('pageType').value = p.pageType || 'story';
            document.getElementById('pageImage').value = p.pageImage || "";
            document.getElementById('pageBg').value = p.pageBg || "";
            document.getElementById('nextIdx').value = getPageIdxById(p.nextPageId) ?? "";
            document.getElementById('prevIdx').value = getPageIdxById(p.prevPageId) ?? "";
            document.getElementById('passwordVal').value = p.password || "";
            document.getElementById('qrCodeVal').value = p.qrCode || "";
            document.getElementById('targetLat').value = p.targetLat || "";
            document.getElementById('targetLng').value = p.targetLng || "";
            document.getElementById('ringtoneUrl').value = p.ringtoneUrl || "";
            document.getElementById('voiceUrl').value = p.voiceUrl || "";
            document.getElementById('externalUrl').value = p.externalUrl || "";
            updateUI(); updateSimulator();
        };

        window.renderPageList = () => {
            const l = document.getElementById('pageList'); l.innerHTML = '';
            window.config.storyPages.forEach((p, i) => {
                const d = document.createElement('div');
                d.className = `page-item ${i === window.currentIdx ? 'selected' : ''}`;
                d.innerHTML = `
                    <div class="truncate text-xs"><i class="fa fa-bars handle"></i> #${i}: ${p.content.substring(0,15)}</div>
                    <div class="flex gap-2">
                        <button onclick="event.stopPropagation(); window.copyPage(${i})"><i class="fa fa-copy"></i></button>
                        <button onclick="event.stopPropagation(); window.deletePage('${p.id}')"><i class="fa fa-trash text-red-400"></i></button>
                    </div>`;
                d.onclick = () => window.loadPage(i);
                l.appendChild(d);
            });
        };

        window.renderAvatarAdmin = () => {
            const l = document.getElementById('avatarList'); l.innerHTML = '';
            window.config.avatars.forEach((av, i) => {
                const d = document.createElement('div');
                d.className = "flex gap-2 items-center bg-slate-800/50 p-2 rounded";
                d.innerHTML = `
                    <input type="text" class="input-style !w-10 text-center" value="${av.id}" oninput="window.config.avatars[${i}].id=this.value.toUpperCase();window.autoSave()">
                    <input type="text" class="input-style flex-1" value="${av.name}" oninput="window.config.avatars[${i}].name=this.value;window.autoSave()">
                    <input type="color" value="${av.color}" oninput="window.config.avatars[${i}].color=this.value;window.autoSave()">
                    <button onclick="window.config.avatars.splice(${i},1);window.renderAvatarAdmin();window.autoSave()"><i class="fa fa-times text-red-500"></i></button>`;
                l.appendChild(d);
            });
            const qs = document.getElementById('avatarQuickSelect'); qs.innerHTML = '';
            window.config.avatars.forEach(av => {
                const b = document.createElement('button');
                b.className = "w-6 h-6 rounded-full border border-slate-600 text-[8px] font-bold";
                b.style.backgroundColor = av.color; b.textContent = av.id;
                b.onclick = () => { document.getElementById('pageText').value += ` §${av.id} `; window.autoSave(); };
                qs.appendChild(b);
            });
        };

        function refreshUI() {
            document.getElementById('appTitle').value = window.config.appTitle || "";
            document.getElementById('globalBg').value = window.config.globalBg || "";
            document.getElementById('isPublicToggle').checked = window.config.isPublic !== false;
            renderPageList(); renderAvatarAdmin(); loadPage(0);
        }

        window.updateUI = () => {
            const t = document.getElementById('pageType').value;
            document.getElementById('passwordInputs').classList.toggle('hidden', t !== 'password');
            document.getElementById('qrInputs').classList.toggle('hidden', t !== 'qr');
            document.getElementById('gpsInputs').classList.toggle('hidden', t !== 'gps');
            document.getElementById('callInputs').classList.toggle('hidden', t !== 'call');
            document.getElementById('choiceEditor').classList.toggle('hidden', t !== 'choice');
        };

        window.updateSimulator = () => {
            const p = window.config.storyPages[window.currentIdx]; if(!p) return;
            document.getElementById('sim-bg').src = p.pageBg || window.config.globalBg || "";
            let text = p.content || ""; const av = document.getElementById('sim-avatar'); av.classList.add('hidden');
            window.config.avatars.forEach(a => {
                if(text.includes(`§${a.id}`)) {
                    av.classList.remove('hidden'); av.src = a.url || "";
                    text = text.replace(new RegExp(`§${a.id}`, 'g'), `<span style="color:${a.color}">${a.name}:</span>`);
                }
            });
            document.getElementById('sim-actual-text').innerHTML = text;
        };

        window.togglePlayerMode = () => {
            const v = document.getElementById('player-view');
            v.style.display = v.style.display === 'flex' ? 'none' : 'flex';
            if(v.style.display === 'flex') { pSimIdx = 0; pUpdateUI(); }
        };

        function pUpdateUI() {
            const p = window.config.storyPages[pSimIdx]; if(!p) return;
            document.getElementById('p-bg-layer').src = p.pageBg || window.config.globalBg || "";
            let text = p.content || ""; const avImg = document.getElementById('p-avatar-img'); avImg.style.display = 'none';
            window.config.avatars.forEach(a => {
                if(text.includes(`§${a.id}`)) {
                    avImg.style.display = 'block'; avImg.src = a.url || "";
                    text = text.replace(new RegExp(`§${a.id}`, 'g'), `<span style="color:${a.color}">${a.name}:</span>`);
                }
            });
            document.getElementById('p-story-text').innerHTML = text;
            const bc = document.getElementById('p-button-container'); bc.innerHTML = '';
            const btn = document.createElement('button'); btn.className = "p-action-btn"; btn.textContent = "Continue";
            btn.onclick = () => { pSimIdx++; pUpdateUI(); }; bc.appendChild(btn);
        }

        function initCommunitySync() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'publishedGames'), (snap) => {
                const list = document.getElementById('community-game-list'); list.innerHTML = '';
                snap.docs.forEach(d => {
                    const g = d.data();
                    const canEdit = isAdmin() || (currentUser && d.data().authorId === currentUser.uid);
                    const card = document.createElement('div'); card.className = "glass-card p-6 flex flex-col gap-4";
                    card.innerHTML = `<h3 class="font-bold text-xl">${g.title}</h3><p class="text-xs text-slate-400">By: ${g.author}</p><button onclick="playPublic('${d.id}')" class="bg-purple-600 py-2 rounded-lg font-bold">PLAY</button>${canEdit ? `<button onclick="editPublic('${d.id}')" class="bg-slate-700 py-2 rounded-lg text-xs">EDIT</button>` : ''}`;
                    list.appendChild(card);
                });
            });
        }

        window.playPublic = async (id) => {
            const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id));
            if(snap.exists()) { window.config = snap.data().config; togglePlayerMode(); }
        };

        window.editPublic = async (id) => {
            const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id));
            if(snap.exists()) { window.config = snap.data().config; switchView('studio'); }
        };

        window.openConfirmModal = (title, desc, icon, onConfirm) => {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-desc').textContent = desc;
            document.getElementById('confirm-action-btn').onclick = () => { onConfirm(); closeConfirmModal(); };
            document.getElementById('confirm-modal').style.display = 'flex';
        };
        window.closeConfirmModal = () => document.getElementById('confirm-modal').style.display = 'none';

        const getPageIdxById = (id) => window.config.storyPages.findIndex(p => p.id === id);
        const getPageIdByIdx = (idx) => { if(idx==="") return null; const p = window.config.storyPages[parseInt(idx)]; return p ? p.id : null; };
        window.addPage = () => { window.config.storyPages.push({ id: self.crypto.randomUUID(), content: "New scene...", pageType: "story" }); window.autoSave(); };
        window.addAvatar = () => { window.config.avatars.push({ id: 'X', name: 'New', url: '', color: '#8b5cf6' }); window.renderAvatarAdmin(); window.autoSave(); };
        window.newGame = () => { window.config = JSON.parse(JSON.stringify(defaultConfig)); refreshUI(); window.autoSave(); };
    </script>
</body>
</html>
