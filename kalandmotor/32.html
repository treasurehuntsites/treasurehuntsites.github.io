<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaland Játék Stúdió V12.5 ✨ (Cloud & Pro Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #22d3ee;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Play', sans-serif; 
            background-color: var(--bg-dark); 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        #studio-view, #community-view { height: 100%; overflow-y: auto; padding: 1rem; scroll-behavior: smooth; }
        @media (min-width: 768px) {
            #studio-view, #community-view { padding: 2rem; }
        }
        
        #community-view { display: none; }
        
        .glass-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(139, 92, 246, 0.2); 
            border-radius: 1.25rem; 
            transition: border 0.3s ease;
        }

        .input-style { 
            background: #020617; 
            color: var(--secondary); 
            border: 1px solid #334155; 
            border-radius: 0.6rem; 
            padding: 0.7rem; 
            outline: none; 
            transition: 0.2s; 
            width: 100%; 
            font-size: 0.875rem;
        }
        .input-style:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }
        
        .page-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0.75rem 1rem; margin-bottom: 0.5rem; border-radius: 0.75rem; 
            background: #1e293b; border: 1px solid transparent; transition: all 0.2s; 
            cursor: pointer;
        }
        .page-item:hover { background: #334155; }
        .page-item.selected { border-color: var(--secondary); background: #4c1d95; transform: translateX(5px); }
        .handle { cursor: grab; padding-right: 12px; color: #64748b; }

        /* SIMULATOR */
        .sim-container { 
            position: sticky; top: 0; width: 100%; max-width: 320px; height: 600px; 
            background: #000; border: 8px solid #1e293b; border-radius: 2.5rem; 
            overflow: hidden; display: flex; flex-direction: column; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9); 
        }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { 
            position: relative; background: rgba(0,0,0,0.94); 
            border-top: 2px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; 
            padding: 20px; padding-top: 40px; min-height: 220px; max-height: 80%;
            display: flex; flex-direction: column; 
        }
        .sim-btn { 
            background: var(--primary); color: white; padding: 10px; 
            border-radius: 0.75rem; font-weight: 700; text-align: center; 
            font-size: 0.85rem; cursor: pointer; text-transform: uppercase; 
            transition: 0.2s; width: 100%; border: none; margin-bottom: 8px;
        }

        #save-indicator { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; font-size: 0.75rem; font-weight: bold; display: none; z-index: 1000; }
        #status-toast { 
            position: fixed; top: 2rem; left: 50%; transform: translateX(-50%); 
            z-index: 20000; padding: 1rem 2rem; border-radius: 1rem; 
            font-weight: bold; font-size: 0.875rem; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }

        /* PLAYER VIEW */
        #player-view { position: fixed; inset: 0; z-index: 5000; background: #000; display: none; flex-direction: column; }
        .p-game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #p-viewport { position: relative; flex-grow: 1; overflow: hidden; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; }
        #p-content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .p-dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 40px; min-height: 250px; max-height: 70%; display: flex; flex-direction: column; }
        .p-action-btn { flex: 1; background: #8b5cf6; color: white; padding: 16px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.25rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        
        .p-bottom-nav { 
            height: 80px; background: #0f172a; border-top: 2px solid rgba(139, 92, 246, 0.4); 
            display: flex; justify-content: space-around; align-items: center; 
            padding-bottom: env(safe-area-inset-bottom);
        }
        .p-nav-item { color: #64748b; font-size: 1.75rem; cursor: pointer; border: none; background: transparent; transition: 0.3s; flex: 1; display: flex; justify-content: center; align-items: center; height: 100%; }
        .p-nav-item.active { color: #8b5cf6; }
        .p-nav-item:active { background: rgba(139, 92, 246, 0.1); }

        /* BACKPACK OVERLAY */
        #p-backpack-overlay {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.98); 
            z-index: 6000; display: none; flex-direction: column; padding: 2rem;
            backdrop-filter: blur(10px);
        }
        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; overflow-y: auto; padding-bottom: 2rem; }
        .inventory-item { 
            background: #1e293b; border: 2px solid #334155; border-radius: 1rem; 
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; transition: 0.2s; padding: 0.5rem; overflow: hidden;
        }
        .inventory-item:active { border-color: var(--primary); transform: scale(0.95); }
        .inventory-item span { font-size: 0.6rem; text-transform: uppercase; font-weight: bold; margin-top: 0.5rem; text-align: center; color: #94a3b8; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .inventory-item i { font-size: 2rem; color: var(--primary); }
        .inventory-item img { width: 100%; height: 100%; object-fit: cover; }

        /* DETAIL MODAL */
        #p-detail-modal {
            position: fixed; inset: 0; z-index: 7000; background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center; padding: 2rem;
        }
        .detail-box { 
            background: #1e293b; border: 2px solid var(--primary); border-radius: 2rem; 
            width: 100%; max-width: 400px; padding: 2rem; text-align: center;
            position: relative;
        }
        .detail-img-container { width: 100%; aspect-ratio: 1; margin-bottom: 1.5rem; background: #0f172a; border-radius: 1.5rem; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #334155; }
        .detail-img-container img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s ease; cursor: zoom-in; }

        .view-toggle-btn {
            position: fixed; top: 1.5rem; right: 1.5rem; z-index: 6000;
            background: #8b5cf6; color: white; padding: 0.75rem 1.25rem; border-radius: 0.75rem;
            font-weight: 800; font-size: 0.75rem; text-transform: uppercase; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            cursor: pointer; border: none; display: flex; align-items: center; gap: 8px;
        }

        .user-badge {
            display: flex; align-items: center; gap: 8px; background: rgba(139, 92, 246, 0.1); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body>

    <div id="save-indicator">
        <i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...
    </div>

    <div id="status-toast"></div>

    <button id="main-view-toggle" class="view-toggle-btn" onclick="togglePlayerMode()">
        <span id="toggle-icon"><i class="fa fa-gamepad"></i></span>
        <span id="toggle-text">Játék Mód</span>
    </button>

    <!-- STUDIO VIEW -->
    <div id="studio-view">
        <div class="max-w-7xl mx-auto pb-20">
            <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <h1 class="text-3xl md:text-5xl font-bold uppercase tracking-tighter text-white">Stúdió <span class="text-purple-500">V12.5</span> ✨</h1>
                    <p class="text-cyan-400 text-xs md:text-sm mt-1 font-bold tracking-widest uppercase">Cloud Pro Edition</p>
                </div>
                
                <div class="flex flex-col items-start md:items-end gap-3 w-full md:w-auto">
                    <div id="auth-section" class="flex flex-wrap items-center gap-4 w-full md:w-auto">
                        <button onclick="switchView('community')" class="text-purple-400 font-bold text-[10px] md:text-xs uppercase hover:text-purple-300 transition-all">
                            <i class="fa fa-users mr-1"></i> Közösség
                        </button>
                        <button id="login-btn" class="bg-white text-black px-4 py-2 rounded-full font-bold text-[10px] md:text-xs flex items-center gap-2 hover:bg-slate-200 transition-all">
                            <i class="fab fa-google"></i> Belépés
                        </button>
                        <div id="user-info" class="user-badge hidden">
                            <img id="user-photo" src="" class="w-6 h-6 md:w-8 md:h-8 rounded-full border border-purple-500">
                            <span id="user-name" class="text-[10px] md:text-xs font-bold truncate"></span>
                            <button id="logout-btn" class="text-slate-500 hover:text-white ml-2"><i class="fa fa-sign-out-alt"></i></button>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2 w-full md:w-auto">
                        <button onclick="previewLiveHTML()" class="flex-1 md:flex-none bg-emerald-600 text-white px-3 py-2 rounded-xl font-bold text-[9px] md:text-[10px] uppercase tracking-widest">Élő Előnézet</button>
                        <button id="publish-btn" onclick="publishGame()" class="flex-1 md:flex-none bg-purple-600 text-white px-3 py-2 rounded-xl font-bold text-[9px] md:text-[10px] uppercase tracking-widest">Publikálás</button>
                        <button onclick="downloadConfig()" class="flex-1 md:flex-none bg-slate-700 text-white px-3 py-2 rounded-xl font-bold text-[9px] md:text-[10px] uppercase tracking-widest">Export</button>
                        <button onclick="document.getElementById('uploadInput').click()" class="flex-1 md:flex-none bg-slate-700 text-white px-3 py-2 rounded-xl font-bold text-[9px] md:text-[10px] uppercase tracking-widest">Import</button>
                        <input type="file" id="uploadInput" class="hidden" accept=".json" onchange="handleFileUpload(event)">
                    </div>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-8 space-y-8">
                    <div class="glass-card p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <label class="text-purple-400 font-bold uppercase text-[10px] tracking-widest block">Alapbeállítások</label>
                            <input type="text" id="appTitle" class="input-style" placeholder="Kaland címe" oninput="autoSave()">
                            <input type="url" id="globalBg" class="input-style" placeholder="Globális Háttér URL" oninput="autoSave()">
                            <input type="url" id="initialMapLink" class="input-style" placeholder="Játék térkép link" oninput="autoSave()">
                        </div>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <label class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Avatarok</label>
                                <button onclick="addAvatar()" class="text-cyan-400 text-[10px] font-bold hover:underline">+ ÚJ</button>
                            </div>
                            <div id="avatarList" class="space-y-2 max-h-40 overflow-y-auto pr-2"></div>
                        </div>
                    </div>

                    <div class="glass-card p-6">
                        <div class="flex justify-between items-center mb-6">
                            <label class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Jelenetek</label>
                            <button onclick="addPage()" class="bg-purple-600 text-white px-4 py-2 rounded-lg text-[10px] font-bold">+ ÚJ JELENET</button>
                        </div>
                        <div id="pageList" class="max-h-80 overflow-y-auto pr-2"></div>
                    </div>

                    <div id="editorPanel" class="glass-card p-6 md:p-8 space-y-6 hidden">
                        <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-700 pb-4 gap-4">
                            <h2 class="text-xl md:text-2xl font-bold text-white">Szerkesztés: <span id="editing-page-id" class="text-purple-500">#0</span></h2>
                            <select id="pageType" class="input-style !w-full md:!w-40 !py-1" onchange="updateUI(); autoSave();">
                                <option value="story">Leírás</option>
                                <option value="choice">Választás</option>
                                <option value="qr">QR Kód</option>
                                <option value="password">Kódzár</option>
                                <option value="gps">GPS Pont</option>
                                <option value="splash">Splash Átvezető</option>
                                <option value="call">Telefonhívás</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-4">
                                <label class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Média</label>
                                <input type="url" id="pageImage" class="input-style" placeholder="Kép URL" oninput="autoSave()">
                                <input type="url" id="pageBg" class="input-style" placeholder="Egyedi Háttér URL" oninput="autoSave()">
                            </div>
                            <div class="space-y-4">
                                <label class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Hátizsák elrejtése</label>
                                <div id="visibilityToggles" class="flex flex-wrap gap-2 max-h-24 overflow-y-auto bg-slate-900/50 p-3 rounded-xl"></div>
                            </div>
                        </div>

                        <textarea id="pageText" rows="5" class="input-style text-base" placeholder="Történet..." oninput="autoSave()"></textarea>

                        <div id="choiceArea" class="hidden border-t border-slate-700 pt-4">
                            <div class="flex justify-between items-center mb-4">
                                <label class="text-cyan-400 font-bold uppercase text-[10px]">Opciók</label>
                                <button onclick="addChoiceItem()" class="text-xs bg-cyan-900/40 text-cyan-400 px-3 py-1 rounded-full">+ ÚJ GOMB</button>
                            </div>
                            <div id="choicesContainer" class="space-y-3"></div>
                        </div>

                        <div id="rewardArea" class="border-t border-slate-700 pt-4 space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Tárgyak megszerzése</h3>
                                <button onclick="addRewardItem()" class="text-cyan-400 text-[10px] font-bold hover:underline">+ ÚJ TÁRGY</button>
                            </div>
                            <div id="rewardsContainer" class="space-y-3"></div>
                        </div>

                        <div id="passwordArea" class="hidden border-t border-slate-700 pt-4 space-y-3">
                            <input type="text" id="correctPass" class="input-style" placeholder="Megoldás" oninput="autoSave()">
                            <textarea id="pageHints" rows="3" class="input-style text-xs" placeholder="Segítségek..." oninput="autoSave()"></textarea>
                        </div>

                        <div id="gpsArea" class="hidden border-t border-slate-700 pt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                            <input type="number" id="targetLat" step="any" class="input-style" placeholder="Lat" oninput="autoSave()">
                            <input type="number" id="targetLng" step="any" class="input-style" placeholder="Lng" oninput="autoSave()">
                            <input type="url" id="mapLink" class="input-style" placeholder="Térkép Link" oninput="autoSave()">
                        </div>

                        <div id="qrArea" class="hidden border-t border-slate-700 pt-4">
                            <input type="text" id="qrCode" class="input-style" placeholder="QR Kód értéke" oninput="autoSave()">
                        </div>

                        <div id="callArea" class="hidden border-t border-slate-700 pt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="url" id="ringtoneUrl" class="input-style" placeholder="Csengőhang URL" oninput="autoSave()">
                            <input type="url" id="audioUrl" class="input-style" placeholder="Hívás hang URL" oninput="autoSave()">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t border-slate-700 pt-6">
                            <input type="number" id="prevIdx" class="input-style" placeholder="Vissza ID" oninput="autoSave()">
                            <input type="number" id="nextIdx" class="input-style" placeholder="Következő ID" oninput="autoSave()">
                            <input type="url" id="redirectUrl" class="input-style" placeholder="Külső URL" oninput="autoSave()">
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-4 flex justify-center mt-10 lg:mt-0">
                    <div class="sim-container">
                        <div id="sim-viewport">
                            <img id="sim-bg" src="">
                            <div id="sim-content">
                                <div id="sim-main-box" class="sim-box">
                                    <img id="sim-avatar" class="absolute -top-10 left-4 w-16 h-16 rounded-full border-2 border-purple-500 bg-black hidden object-cover" src="">
                                    <div id="sim-scroll" class="overflow-y-auto pr-1 flex-grow scroll-smooth">
                                        <img id="sim-page-img" class="w-full rounded-xl mb-4 hidden shadow-lg" src="">
                                        <div id="sim-actual-text" class="text-base leading-relaxed whitespace-pre-wrap"></div>
                                    </div>
                                    <div id="sim-actions" class="mt-4"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PLAYER VIEW -->
    <div id="player-view">
        <!-- BACKPACK OVERLAY -->
        <div id="p-backpack-overlay">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold uppercase text-white tracking-widest"><i class="fa fa-briefcase mr-3 text-purple-500"></i>Hátizsák</h2>
                <button onclick="pToggleBackpack()" class="text-slate-400 text-2xl"><i class="fa fa-times"></i></button>
            </div>
            <div id="inventory-grid" class="inventory-grid">
                <!-- Tárgyak helye -->
            </div>
        </div>

        <!-- DETAIL MODAL -->
        <div id="p-detail-modal" onclick="pCloseDetail()">
            <div class="detail-box" onclick="event.stopPropagation()">
                <div id="detail-img-container" class="detail-img-container">
                    <img id="detail-img" src="" onclick="pZoomImage(this)">
                </div>
                <h3 id="detail-name" class="text-xl font-bold text-white mb-2 uppercase">Tárgy Neve</h3>
                <p id="detail-desc" class="text-slate-400 text-sm mb-6">Leírás helye...</p>
                <button onclick="pCloseDetail()" class="w-full bg-purple-600 py-3 rounded-xl font-bold uppercase text-xs">Bezárás</button>
            </div>
        </div>

        <div class="p-game-wrapper">
            <div id="p-viewport">
                <img id="p-bg-layer" src="">
                <div id="p-content-layer">
                    <div class="p-dialog-box">
                        <img id="p-avatar-img" class="absolute -top-10 left-4 w-20 h-20 rounded-full border-2 border-purple-500 bg-black hidden object-cover" src="">
                        <div id="p-scroll-area" class="overflow-y-auto pr-1 flex-grow">
                            <img id="p-page-illustration" class="w-full rounded-xl mb-4 hidden shadow-xl" src="">
                            <div id="p-story-text" class="text-lg leading-relaxed mb-4"></div>
                        </div>
                        <div id="p-button-container" class="mt-4 flex flex-col gap-3"></div>
                    </div>
                </div>
            </div>
            <div class="p-bottom-nav">
                <button class="p-nav-item" onclick="pOpenMap()"><i class="fa-solid fa-map-location-dot"></i></button>
                <button id="p-nav-backpack" class="p-nav-item" onclick="pToggleBackpack()"><i class="fa-solid fa-briefcase"></i></button>
                <button class="p-nav-item" onclick="pResetGame()"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>
    </div>

    <!-- COMMUNITY VIEW -->
    <div id="community-view">
        <div class="max-w-7xl mx-auto pb-20">
            <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <h1 class="text-3xl md:text-5xl font-bold uppercase tracking-tighter text-white">Közösségi <span class="text-emerald-500">Portál</span> 🌐</h1>
                    <button onclick="switchView('studio')" class="bg-purple-600 text-white px-6 py-3 rounded-xl font-bold text-xs uppercase hover:bg-purple-500 transition-all mt-4 md:mt-0">Vissza</button>
                </div>
            </header>
            <div id="community-game-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithCustomToken, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js';

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-studio-v12';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: ""
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentIdx = 0;
        let pSimIdx = 0;
        let pInventory = [];

        window.config = JSON.parse(localStorage.getItem('KALAND_STUDIO_V12')) || {
            appTitle: "Új Kaland",
            globalBg: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0",
            avatars: [{ id: 'A', name: 'Mesélő', url: '', color: '#8b5cf6' }],
            storyPages: [{ content: "Kezdődik a történet...", pageType: "story", choices: [], rewards: [], hiddenItems: [], nextIdx: "", prevIdx: "" }],
            initialMapLink: ""
        };

        window.showToast = (msg, type = 'info') => {
            const t = document.getElementById('status-toast');
            if(!t) return;
            t.textContent = msg;
            t.style.background = type === 'error' ? '#ef4444' : '#10b981';
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        };

        window.switchView = (v) => {
            document.getElementById('studio-view').style.display = v === 'studio' ? 'block' : 'none';
            document.getElementById('community-view').style.display = v === 'community' ? 'block' : 'none';
        };

        window.autoSave = () => {
            if (currentIdx === -1) return;
            const p = window.config.storyPages[currentIdx];
            if (p) {
                p.content = document.getElementById('pageText').value;
                p.pageType = document.getElementById('pageType').value;
                p.pageImage = document.getElementById('pageImage').value;
                p.pageBg = document.getElementById('pageBg').value;
                p.nextIdx = document.getElementById('nextIdx').value;
                p.prevIdx = document.getElementById('prevIdx').value;
                p.redirectUrl = document.getElementById('redirectUrl').value;
                p.qrCode = document.getElementById('qrCode').value;
                p.targetLat = document.getElementById('targetLat').value;
                p.targetLng = document.getElementById('targetLng').value;
                p.mapLink = document.getElementById('mapLink').value;
                p.password = document.getElementById('correctPass').value;
                p.hints = document.getElementById('pageHints').value;
                p.audioUrl = document.getElementById('audioUrl').value;
                p.ringtoneUrl = document.getElementById('ringtoneUrl').value;
            }
            window.config.appTitle = document.getElementById('appTitle').value;
            window.config.globalBg = document.getElementById('globalBg').value;
            window.config.initialMapLink = document.getElementById('initialMapLink').value;

            localStorage.setItem('KALAND_STUDIO_V12', JSON.stringify(window.config));
            saveToCloud();
            window.renderPageList();
            updateSimulator();
        };

        window.loadPage = (i) => {
            currentIdx = i;
            const p = window.config.storyPages[i];
            if (!p) return;
            document.getElementById('editorPanel').classList.remove('hidden');
            document.getElementById('editing-page-id').textContent = `#${i}`;
            document.getElementById('pageText').value = p.content || "";
            document.getElementById('pageType').value = p.pageType || 'story';
            document.getElementById('pageImage').value = p.pageImage || "";
            document.getElementById('pageBg').value = p.pageBg || "";
            document.getElementById('prevIdx').value = p.prevIdx || "";
            document.getElementById('nextIdx').value = p.nextIdx || "";
            document.getElementById('redirectUrl').value = p.redirectUrl || "";
            document.getElementById('qrCode').value = p.qrCode || "";
            document.getElementById('targetLat').value = p.targetLat || "";
            document.getElementById('targetLng').value = p.targetLng || "";
            document.getElementById('mapLink').value = p.mapLink || "";
            document.getElementById('correctPass').value = p.password || "";
            document.getElementById('pageHints').value = p.hints || "";
            document.getElementById('audioUrl').value = p.audioUrl || "";
            document.getElementById('ringtoneUrl').value = p.ringtoneUrl || "";
            window.updateUI();
            window.renderChoices();
            window.renderRewards();
            window.renderVisibilityToggles();
            window.renderPageList();
            updateSimulator();
        };

        window.updateUI = () => {
            const t = document.getElementById('pageType').value;
            const areas = ['choiceArea', 'passwordArea', 'gpsArea', 'qrArea', 'callArea'];
            areas.forEach(a => document.getElementById(a).classList.add('hidden'));
            if(t === 'choice') document.getElementById('choiceArea').classList.remove('hidden');
            if(t === 'password') document.getElementById('passwordArea').classList.remove('hidden');
            if(t === 'gps') document.getElementById('gpsArea').classList.remove('hidden');
            if(t === 'qr') document.getElementById('qrArea').classList.remove('hidden');
            if(t === 'call') document.getElementById('callArea').classList.remove('hidden');
        };

        window.addAvatar = () => {
            const nextId = String.fromCharCode(65 + window.config.avatars.length);
            window.config.avatars.push({ id: nextId, name: 'Új Karakter', url: '', color: '#8b5cf6' });
            window.renderAvatarAdmin();
            window.autoSave();
        };

        window.renderAvatarAdmin = () => {
            const l = document.getElementById('avatarList'); l.innerHTML = '';
            window.config.avatars.forEach((av, i) => {
                const d = document.createElement('div');
                d.className = "flex gap-2 items-center bg-slate-900/50 p-2 rounded-lg border border-slate-700";
                d.innerHTML = `
                    <input type="text" class="input-style !p-1 !w-10 text-center font-bold" value="${av.id}" oninput="config.avatars[${i}].id=this.value;autoSave()">
                    <input type="text" class="input-style !p-1 flex-1" value="${av.name}" oninput="config.avatars[${i}].name=this.value;autoSave()">
                    <input type="color" class="w-8 h-8 bg-transparent" value="${av.color}" oninput="config.avatars[${i}].color=this.value;autoSave()">
                    <button onclick="config.avatars.splice(${i},1);renderAvatarAdmin();autoSave()" class="text-red-500 px-2"><i class="fa fa-times"></i></button>
                `;
                l.appendChild(d);
            });
        };

        window.addPage = () => {
            window.config.storyPages.push({ content: "Új oldal...", pageType: "story", choices: [], rewards: [], hiddenItems: [], nextIdx: "", prevIdx: "" });
            window.renderPageList();
            window.loadPage(window.config.storyPages.length - 1);
            window.autoSave();
        };

        window.renderPageList = () => {
            const l = document.getElementById('pageList'); l.innerHTML = '';
            window.config.storyPages.forEach((p, i) => {
                const d = document.createElement('div');
                d.className = `page-item ${i === currentIdx ? 'selected' : ''}`;
                d.innerHTML = `
                    <div class="flex items-center gap-2 truncate flex-1" onclick="loadPage(${i})">
                        <i class="fa fa-bars handle"></i>
                        <span class="text-xs font-bold uppercase truncate">#${i}: ${p.content ? p.content.substring(0,20) : '...'}</span>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="config.storyPages.push(JSON.parse(JSON.stringify(config.storyPages[${i}]))); renderPageList(); autoSave(); event.stopPropagation();" class="text-cyan-400 p-1 hover:bg-slate-700 rounded"><i class="fa fa-copy"></i></button>
                        <button onclick="if(config.storyPages.length > 1) { config.storyPages.splice(${i},1); currentIdx=0; loadPage(0); autoSave(); } event.stopPropagation();" class="text-red-400 p-1 hover:bg-slate-700 rounded"><i class="fa fa-trash"></i></button>
                    </div>
                `;
                l.appendChild(d);
            });
        };

        window.renderChoices = () => {
            const c = document.getElementById('choicesContainer'); c.innerHTML = '';
            const p = window.config.storyPages[currentIdx];
            if (!p || !p.choices) return;
            p.choices.forEach((ch, i) => {
                const r = document.createElement('div'); r.className = "flex gap-2 items-center bg-slate-800/40 p-2 rounded";
                r.innerHTML = `
                    <input type="text" class="input-style flex-1 text-xs" placeholder="Szöveg" value="${ch.text}" oninput="config.storyPages[${currentIdx}].choices[${i}].text=this.value;autoSave()">
                    <input type="number" class="input-style w-20 text-xs" placeholder="Cél" value="${ch.target}" oninput="config.storyPages[${currentIdx}].choices[${i}].target=this.value;autoSave()">
                    <button onclick="config.storyPages[${currentIdx}].choices.splice(${i},1);renderChoices();autoSave()" class="text-red-500 px-2"><i class="fa fa-trash"></i></button>
                `;
                c.appendChild(r);
            });
        };

        window.addChoiceItem = () => {
            if(!window.config.storyPages[currentIdx].choices) window.config.storyPages[currentIdx].choices = [];
            window.config.storyPages[currentIdx].choices.push({ text: "Gomb", target: currentIdx + 1 });
            window.renderChoices();
            window.autoSave();
        };

        window.renderRewards = () => {
            const container = document.getElementById('rewardsContainer'); container.innerHTML = '';
            const p = window.config.storyPages[currentIdx];
            if (!p || !p.rewards) return;
            p.rewards.forEach((item, i) => {
                const div = document.createElement('div'); div.className = "grid grid-cols-3 gap-2 bg-slate-800/30 p-2 rounded";
                div.innerHTML = `
                    <input type="text" class="input-style text-xs" placeholder="Név" value="${item.name}" oninput="config.storyPages[${currentIdx}].rewards[${i}].name=this.value;autoSave()">
                    <input type="text" class="input-style text-xs" placeholder="Ikon URL" value="${item.icon}" oninput="config.storyPages[${currentIdx}].rewards[${i}].icon=this.value;autoSave()">
                    <button onclick="config.storyPages[${currentIdx}].rewards.splice(${i},1);renderRewards();autoSave();" class="text-red-400 text-xs font-bold">Törlés</button>
                `;
                container.appendChild(div);
            });
        };

        window.addRewardItem = () => {
            if(!window.config.storyPages[currentIdx].rewards) window.config.storyPages[currentIdx].rewards = [];
            window.config.storyPages[currentIdx].rewards.push({ name: "Tárgy", icon: "" });
            window.renderRewards();
            window.autoSave();
        };

        window.renderVisibilityToggles = () => {
            const container = document.getElementById('visibilityToggles'); container.innerHTML = '';
            const allItems = new Set();
            window.config.storyPages.forEach(pg => pg.rewards?.forEach(r => { if(r.name) allItems.add(r.name); }));
            const p = window.config.storyPages[currentIdx];
            if (!p) return;
            if (!p.hiddenItems) p.hiddenItems = [];
            allItems.forEach(name => {
                const label = document.createElement('label');
                label.className = "flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg text-[10px] cursor-pointer hover:bg-slate-700 transition-all";
                const isChecked = p.hiddenItems.includes(name);
                label.innerHTML = `<input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleItemVisibility('${name}', this.checked)"> ${name}`;
                container.appendChild(label);
            });
        };

        window.toggleItemVisibility = (name, hide) => {
            if (!window.config.storyPages[currentIdx].hiddenItems) window.config.storyPages[currentIdx].hiddenItems = [];
            const h = window.config.storyPages[currentIdx].hiddenItems;
            if (hide) { if (!h.includes(name)) h.push(name); }
            else { window.config.storyPages[currentIdx].hiddenItems = h.filter(n => n !== name); }
            window.autoSave();
        };

        function updateSimulator() {
            const p = window.config.storyPages[currentIdx];
            if (!p) return;
            document.getElementById('sim-bg').src = p.pageBg || window.config.globalBg;
            let text = p.content || "";
            const avBox = document.getElementById('sim-avatar'); avBox.classList.add('hidden');
            window.config.avatars.forEach(av => {
                if (text.includes(`§${av.id}`)) {
                    avBox.src = av.url || ""; avBox.classList.remove('hidden');
                    avBox.style.borderColor = av.color;
                    text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color}; font-weight:bold">${av.name}: </span>`);
                }
            });
            document.getElementById('sim-actual-text').innerHTML = text;
            const img = document.getElementById('sim-page-img');
            if (p.pageImage) { img.src = p.pageImage; img.classList.remove('hidden'); } else { img.classList.add('hidden'); }
            const acts = document.getElementById('sim-actions'); acts.innerHTML = '';
            if (p.pageType === 'choice' && p.choices) {
                p.choices.forEach(c => {
                    const b = document.createElement('button'); b.className = "sim-btn";
                    b.textContent = c.text; b.onclick = () => { loadPage(parseInt(c.target)); };
                    acts.appendChild(b);
                });
            } else {
                const b = document.createElement('button'); b.className = "sim-btn";
                b.textContent = "Tovább"; b.onclick = () => { 
                    const n = (p.nextIdx !== "" && !isNaN(parseInt(p.nextIdx))) ? parseInt(p.nextIdx) : currentIdx + 1;
                    if(window.config.storyPages[n]) loadPage(n);
                };
                acts.appendChild(b);
            }
        }

        // PLAYER MODE LOGIC
        window.togglePlayerMode = () => {
            const isP = document.getElementById('player-view').style.display === 'flex';
            document.getElementById('studio-view').style.display = isP ? 'block' : 'none';
            document.getElementById('player-view').style.display = isP ? 'none' : 'flex';
            document.getElementById('toggle-text').textContent = isP ? "Játék Mód" : "Szerkesztő";
            if (!isP) { 
                pSimIdx = 0; 
                pInventory = []; 
                document.getElementById('p-backpack-overlay').style.display = 'none';
                pUpdateUI(); 
            }
        };

        window.pUpdateUI = () => {
            const p = window.config.storyPages[pSimIdx];
            if (!p) return;

            // Grant rewards
            if (p.rewards) {
                p.rewards.forEach(rew => {
                    if (!pInventory.find(i => i.name === rew.name)) {
                        pInventory.push(rew);
                    }
                });
            }

            document.getElementById('p-bg-layer').src = p.pageBg || window.config.globalBg;
            let text = p.content || "";
            const av = document.getElementById('p-avatar-img'); av.classList.add('hidden');
            window.config.avatars.forEach(a => {
                if (text.includes(`§${a.id}`)) {
                    av.src = a.url || ""; av.classList.remove('hidden');
                    av.style.borderColor = a.color;
                    text = text.replace(new RegExp(`§${a.id}`, 'g'), `<span style="color:${a.color}; font-weight:bold">${a.name}: </span>`);
                }
            });
            document.getElementById('p-story-text').innerHTML = text;
            const ill = document.getElementById('p-page-illustration');
            if (p.pageImage) { ill.src = p.pageImage; ill.classList.remove('hidden'); } else { ill.classList.add('hidden'); }

            const btns = document.getElementById('p-button-container'); btns.innerHTML = '';
            if (p.pageType === 'choice' && p.choices) {
                p.choices.forEach(c => {
                    const b = document.createElement('button'); b.className = "p-action-btn";
                    b.textContent = c.text; b.onclick = () => { pSimIdx = parseInt(c.target); pUpdateUI(); };
                    btns.appendChild(b);
                });
            } else {
                const b = document.createElement('button'); b.className = "p-action-btn";
                b.textContent = "Tovább"; b.onclick = () => { pSimIdx = parseInt(p.nextIdx) || pSimIdx + 1; pUpdateUI(); };
                btns.appendChild(b);
            }
        };

        // BACKPACK FUNCTIONS
        window.pToggleBackpack = () => {
            const overlay = document.getElementById('p-backpack-overlay');
            const isVisible = overlay.style.display === 'flex';
            overlay.style.display = isVisible ? 'none' : 'flex';
            if (!isVisible) {
                const grid = document.getElementById('inventory-grid');
                grid.innerHTML = '';
                const p = window.config.storyPages[pSimIdx];
                const hidden = p?.hiddenItems || [];
                
                pInventory.forEach(item => {
                    if (hidden.includes(item.name)) return;
                    const el = document.createElement('div');
                    el.className = "inventory-item";
                    el.onclick = () => pShowItem(item);
                    if (item.icon && item.icon.startsWith('http')) {
                        el.innerHTML = `<img src="${item.icon}"><span>${item.name}</span>`;
                    } else {
                        el.innerHTML = `<i class="fa fa-box"></i><span>${item.name}</span>`;
                    }
                    grid.appendChild(el);
                });
            }
        };

        window.pShowItem = (item) => {
            document.getElementById('detail-name').textContent = item.name;
            document.getElementById('detail-desc').textContent = "Tárgy részleteinek megtekintése. Kattints a képre a nagyításhoz.";
            const img = document.getElementById('detail-img');
            img.src = item.icon || "https://cdn-icons-png.flaticon.com/512/679/679821.png";
            img.style.transform = "scale(1)";
            document.getElementById('p-detail-modal').style.display = 'flex';
        };

        window.pCloseDetail = () => {
            document.getElementById('p-detail-modal').style.display = 'none';
        };

        window.pZoomImage = (img) => {
            if (img.style.transform === "scale(2)") {
                img.style.transform = "scale(1)";
                img.style.cursor = "zoom-in";
            } else {
                img.style.transform = "scale(2)";
                img.style.cursor = "zoom-out";
            }
        };

        window.pOpenMap = () => {
            if (window.config.initialMapLink) window.open(window.config.initialMapLink, '_blank');
            else showToast("Nincs megadott térkép link!");
        };

        window.pResetGame = () => { 
            if(confirm("Biztosan újrakezded a játékot?")) {
                pSimIdx = 0; pInventory = []; pUpdateUI(); 
            }
        };

        // PUBLISH & DOWNLOAD
        window.publishGame = async () => {
            // 1. Save to cloud
            if (currentUser && !currentUser.isAnonymous && db) {
                try {
                    const gameId = window.config.cloudId || self.crypto.randomUUID();
                    window.config.cloudId = gameId;
                    const ref = doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', gameId);
                    await setDoc(ref, {
                        title: window.config.appTitle,
                        author: currentUser.displayName,
                        background: window.config.globalBg,
                        config: window.config,
                        authorId: currentUser.uid,
                        updatedAt: new Date().toISOString()
                    });
                    showToast("Felhőbe mentve!");
                } catch(e) { console.error(e); }
            }

            // 2. Standalone HTML generation (Offline support)
            const currentHTML = document.documentElement.outerHTML;
            const configString = JSON.stringify(window.config);
            const standaloneHTML = currentHTML.replace(
                /window\.config\s*=\s*JSON\.parse\(localStorage\.getItem\('KALAND_STUDIO_V12'\)\)\s*\|\|\s*\{[\s\S]*?\};/,
                `window.config = ${configString};`
            );

            const blob = new Blob([standaloneHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${window.config.appTitle || 'kaland'}.html`;
            a.click();
            showToast("Játékfájl letöltve!");
        };

        // AUTH & INIT
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token).catch(() => signInAnonymously(auth));
            } else { await signInAnonymously(auth); }
        };

        // Login UI logic
        document.getElementById('login-btn').onclick = () => {
            signInWithPopup(auth, provider).catch(err => {
                console.error("Popup hiba:", err);
                showToast("Belépési hiba (ellenőrizd a böngésző tiltásokat)!", "error");
            });
        };
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const loginBtn = document.getElementById('login-btn');
            const userInfo = document.getElementById('user-info');
            if (user && !user.isAnonymous) {
                loginBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');
                document.getElementById('user-name').textContent = user.displayName;
                document.getElementById('user-photo').src = user.photoURL;
                await loadFromCloud();
            } else {
                loginBtn.classList.remove('hidden');
                userInfo.classList.add('hidden');
            }
        });

        async function saveToCloud() {
            if (!currentUser || currentUser.isAnonymous || !db) return;
            document.getElementById('save-indicator').style.display = 'block';
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'userConfig');
                await setDoc(userDocRef, { configData: window.config, updatedAt: new Date().toISOString() }, { merge: true });
            } catch (err) { console.error(err); }
            finally { setTimeout(() => { document.getElementById('save-indicator').style.display = 'none'; }, 1000); }
        }

        async function loadFromCloud() {
            if (!currentUser || currentUser.isAnonymous || !db) return;
            const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'userConfig');
            const snap = await getDoc(userDocRef);
            if (snap.exists()) {
                window.config = snap.data().configData;
                window.refreshUI();
            }
        }

        window.refreshUI = () => {
            document.getElementById('appTitle').value = window.config.appTitle || "";
            document.getElementById('globalBg').value = window.config.globalBg || "";
            document.getElementById('initialMapLink').value = window.config.initialMapLink || "";
            window.renderAvatarAdmin();
            window.renderPageList();
            window.loadPage(0);
        };

        window.downloadConfig = () => {
            const b = new Blob([JSON.stringify(window.config, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'kaland.json'; a.click();
        };

        window.handleFileUpload = (e) => {
            const r = new FileReader();
            r.onload = (ev) => { window.config = JSON.parse(ev.target.result); window.refreshUI(); };
            r.readAsText(e.target.files[0]);
        };

        window.previewLiveHTML = () => {
            const b = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            window.open(URL.createObjectURL(b));
        };

        initAuth().then(() => window.refreshUI());
    </script>
</body>
</html>
