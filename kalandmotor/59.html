<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kaland Játék Stúdió V13.2 ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #22d3ee;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            height: 100dvh;
            font-family: 'Play', sans-serif; 
            background-color: var(--bg-dark); 
            color: #f8fafc; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        
        #studio-view, #community-view { height: 100%; overflow-y: auto; padding: 1rem; padding-bottom: 5rem; }
        @media (min-width: 768px) { #studio-view, #community-view { padding: 2.5rem; } }
        
        #community-view { display: none; }
        
        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 1rem; }

        .input-style { background: #0f172a; color: var(--secondary); border: 1px solid #334155; border-radius: 0.5rem; padding: 0.6rem; outline: none; transition: 0.2s; width: 100%; font-size: 0.875rem; }
        .input-style:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; cursor: pointer; }
        .page-item.selected { border-color: var(--secondary); background: #4c1d95; }
        .handle { cursor: grab; padding-right: 15px; color: #64748b; font-size: 0.9rem; }

        /* SIMULATOR */
        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; opacity: 0.6; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 35px; min-height: 220px; display: flex; flex-direction: column; }
        .sim-avatar { position: absolute; top: -40px; left: 10px; width: 65px; height: 65px; border-radius: 50%; border: 3px solid var(--primary); background: #000; z-index: 20; object-fit: cover; display: none; }
        .sim-btn { background: var(--primary); color: white; padding: 10px; border-radius: 0.5rem; font-weight: 700; text-align: center; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; width: 100%; border: none; }
        .sim-btn-secondary { background: #334155; }
        .sim-nav-row { display: flex; gap: 8px; width: 100%; }

        /* PLAYER VIEW */
        #player-view { position: fixed; inset: 0; z-index: 9000; background: #000; display: none; flex-direction: column; height: 100dvh; }
        .p-game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #p-viewport { position: relative; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s ease-in-out; }
        #p-content-layer { position: relative; z-index: 10; margin-top: auto; width: 100%; display: flex; flex-direction: column; }

        .p-dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 4px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 25px; padding-top: 45px; min-height: 280px; max-height: 80dvh; display: flex; flex-direction: column; box-shadow: 0 -15px 35px rgba(0,0,0,0.7); }
        .p-avatar-frame { position: absolute; top: -45px; left: 20px; width: 85px; height: 85px; border-radius: 50%; border: 4px solid var(--primary); background: #000; z-index: 20; object-fit: cover; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        #p-story-text { text-align: justify; hyphens: auto; font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 15px; color: #f8fafc; }
        #p-button-container { display: flex; flex-direction: column; gap: 12px; width: 100%; position: relative; }
        
        .p-nav-row { display: flex !important; flex-direction: row !important; gap: 10px; width: 100%; margin-top: 10px; background: transparent !important; }
        .p-action-btn { flex: 1; background: var(--primary); color: white; padding: 16px; border-radius: 0.85rem; font-weight: 700; text-align: center; font-size: 1.05rem; cursor: pointer; text-transform: uppercase; transition: 0.15s; display: flex; align-items: center; justify-content: center; border: none; box-shadow: 0 4px 0 rgba(139, 92, 246, 0.3); }
        .p-action-btn:active { transform: translateY(2px); box-shadow: none; }
        .p-action-btn.btn-secondary { background: #334155; box-shadow: 0 4px 0 rgba(51, 65, 85, 0.3); }

        .p-bottom-nav { height: 80px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.4); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .p-nav-item { color: #94a3b8; font-size: 1.6rem; cursor: pointer; border: none; background: transparent; position: relative; width: 20%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .p-nav-item.active { color: var(--primary); }
        .p-nav-label { font-size: 9px; font-weight: bold; text-transform: uppercase; margin-top: 4px; }
        .p-badge { position: absolute; top: 15px; right: 25%; background: #ef4444; color: white; font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: bold; border: 2px solid #0f172a; }

        #p-inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 150; display: none; padding: 30px; padding-top: 70px; overflow-y: auto; }
        .p-item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .p-item-card { position: relative; background: #1e293b; border: 2px solid #334155; border-radius: 1.25rem; padding: 20px; text-align: center; }
        .p-item-card img { width: 90px; height: 90px; object-fit: contain; margin: 0 auto 15px; }

        @keyframes fadeInOutSplash { 0% { opacity: 0; transform: scale(0.9); } 20% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
        .splash-text-anim { font-family: 'Special Elite', cursive; animation: fadeInOutSplash 10s ease-in-out forwards; text-transform: uppercase; letter-spacing: 0.2em; }
    </style>
</head>
<body>

    <div id="save-indicator" class="fixed bottom-6 right-6 bg-emerald-500 text-white px-5 py-2 rounded-full font-bold text-xs z-[10000] hidden">
        <i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...
    </div>

    <!-- STUDIO -->
    <div id="studio-view">
        <div class="max-w-7xl mx-auto">
            <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <h1 class="text-3xl md:text-5xl font-bold uppercase text-white">Stúdió <span class="text-purple-500">V13.2</span></h1>
                    <p class="text-cyan-400 text-xs font-bold uppercase">Minden oldalon navigáció • GPS • Cloud</p>
                </div>
                <div class="flex flex-wrap items-center gap-2 md:gap-3">
                    <button onclick="switchView('community')" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-lg font-bold text-[10px] uppercase">Közösség</button>
                    <button onclick="newGame()" class="bg-slate-700 text-white px-4 py-2 rounded-lg font-bold text-[10px] uppercase">Új játék</button>
                    <button onclick="togglePlayerMode()" class="bg-purple-600 text-white px-5 py-2 rounded-lg font-bold text-[10px] uppercase shadow-lg hover:brightness-110 active:scale-95 transition-all"><i class="fa fa-play mr-2"></i> Teszt</button>
                    <button id="login-btn" class="bg-white text-black px-5 py-2 rounded-full font-bold text-xs">Belépés</button>
                    <div id="user-info" class="hidden flex items-center gap-3 bg-slate-800 p-1 pr-4 rounded-full border border-slate-700">
                        <img id="user-photo" src="" class="w-8 h-8 rounded-full">
                        <span id="user-name" class="text-xs font-bold"></span>
                    </div>
                    <div class="flex gap-1 md:gap-2">
                        <button id="save-btn" onclick="saveGame()" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl font-bold text-[10px] uppercase shadow-lg hover:brightness-110 active:scale-95 transition-all">Mentés</button>
                        <button id="publish-btn" onclick="publishGame()" class="bg-emerald-600 text-white px-4 py-2.5 rounded-xl font-bold text-[10px] uppercase shadow-lg hover:brightness-110 active:scale-95 transition-all">Publikálás</button>
                    </div>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-8 space-y-6">
                    <div class="glass-card p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-3">
                            <label class="text-purple-400 font-bold uppercase text-[10px]">Alapbeállítások</label>
                            <input type="text" id="appTitle" class="input-style" placeholder="Cím" oninput="autoSave()">
                            <input type="url" id="globalBg" class="input-style" placeholder="Háttér URL" oninput="autoSave()">
                            <input type="url" id="initialMapLink" class="input-style" placeholder="Térkép Link" oninput="autoSave()">
                        </div>
                        <div class="space-y-3">
                            <label class="text-purple-400 font-bold uppercase text-[10px]">Avatarok</label>
                            <div id="avatarList" class="space-y-2 max-h-40 overflow-y-auto"></div>
                            <button onclick="addAvatar()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ AVATAR</button>
                        </div>
                    </div>

                    <div class="glass-card p-6">
                        <label class="text-purple-400 font-bold uppercase text-[10px]">Jelenetek</label>
                        <div id="pageList" class="mt-4 max-h-60 overflow-y-auto pr-2"></div>
                        <button onclick="addPage()" class="mt-4 bg-purple-600 text-white px-4 py-2 rounded-lg text-[10px] font-bold">+ ÚJ OLDAL</button>
                    </div>

                    <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                            <h2 class="text-2xl font-bold text-white">Szerkesztés: <span id="editing-page-id" class="text-purple-500">#0</span></h2>
                            <select id="pageType" class="input-style !w-44" onchange="updateUI(); autoSave();">
                                <option value="story">Leírás</option>
                                <option value="choice">Választás</option>
                                <option value="password">Kódzár</option>
                                <option value="qr">QR Kód</option>
                                <option value="gps">GPS Pont</option>
                                <option value="splash">Átvezetés</option>
                                <option value="call">Hívás</option>
                            </select>
                        </div>

                        <textarea id="pageText" rows="5" class="input-style text-base" placeholder="Szöveg..." oninput="autoSave()"></textarea>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="url" id="pageImage" class="input-style text-xs" placeholder="Illusztráció URL" oninput="autoSave()">
                            <input type="url" id="pageBg" class="input-style text-xs" placeholder="Egyedi Háttér URL" oninput="autoSave()">
                        </div>

                        <div id="gpsInputs" class="hidden grid grid-cols-2 gap-4">
                            <input type="number" id="targetLat" step="any" class="input-style" placeholder="Latitude" oninput="autoSave()">
                            <input type="number" id="targetLng" step="any" class="input-style" placeholder="Longitude" oninput="autoSave()">
                        </div>

                        <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-700">
                            <input type="number" id="prevIdx" class="input-style" placeholder="Előző oldal ID" oninput="autoSave()">
                            <input type="number" id="nextIdx" class="input-style" placeholder="Következő oldal ID" oninput="autoSave()">
                        </div>
                    </div>
                </div>

                <!-- SIMULATOR -->
                <div class="lg:col-span-4 hidden lg:flex justify-center">
                    <div class="sim-container">
                        <div id="sim-viewport">
                            <img id="sim-bg" src="">
                            <div id="sim-content">
                                <div id="sim-main-box" class="sim-box">
                                    <img id="sim-avatar" class="sim-avatar" src="">
                                    <div id="sim-scroll" class="overflow-y-auto flex-grow">
                                        <div id="sim-actual-text" style="font-size: 17px; font-weight: 700; text-align: justify;"></div>
                                        <div id="sim-gps-monitor" class="hidden text-center p-3 bg-slate-900 rounded-xl mt-4 border border-cyan-500/30">
                                            <div class="text-[9px] text-cyan-500 font-bold">Távolság: <span id="sim-distance-val">...</span> m</div>
                                        </div>
                                    </div>
                                    <div id="sim-actions" class="mt-4"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- COMMUNITY -->
    <div id="community-view">
        <div class="max-w-7xl mx-auto pb-20">
            <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <h1 class="text-3xl md:text-5xl font-bold uppercase text-white">Portál 🌐</h1>
                    <p class="text-emerald-400 text-xs font-bold uppercase">Fedezd fel a közösség kalandjait</p>
                </div>
                <button onclick="switchView('studio')" class="bg-purple-600 text-white px-8 py-4 rounded-2xl font-bold text-xs uppercase">Vissza a Stúdióba</button>
            </header>
            <div id="community-game-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </div>

    <!-- PLAYER -->
    <div id="player-view">
        <div id="p-qr-layer" class="hidden absolute inset-0 bg-black z-[10000] flex flex-col items-center justify-center">
            <div id="p-qr-reader" class="w-64 h-64 border-2 border-cyan-400 rounded-3xl overflow-hidden"></div>
            <button onclick="pStopQR()" class="mt-8 bg-red-600 text-white px-10 py-4 rounded-xl font-bold uppercase">Mégse</button>
        </div>
        
        <div class="p-game-wrapper">
            <div id="p-viewport">
                <img id="p-bg-layer" src="" class="absolute inset-0 w-full h-full object-cover">
                <div id="p-splash-screen" class="absolute inset-0 bg-black z-[5000] hidden flex items-center justify-center">
                    <div id="p-splash-text" class="text-white text-center p-10 splash-text-anim text-4xl"></div>
                </div>

                <div id="p-inventory-overlay" onclick="document.getElementById('p-inventory-overlay').style.display='none'">
                    <h2 class="text-center text-cyan-400 font-bold mb-10 uppercase text-2xl">Hátizsák</h2>
                    <div id="p-item-list" class="p-item-grid"></div>
                </div>

                <div id="p-content-layer">
                    <div class="p-dialog-box">
                        <img id="p-avatar-img" class="p-avatar-frame" src="">
                        <div id="p-scroll-area" class="overflow-y-auto flex-grow mb-4">
                            <img id="p-page-illustration" class="w-full rounded-2xl mb-6 hidden" src="">
                            <div id="p-story-text"></div>
                            <div id="p-gps-monitor" class="hidden text-center p-6 bg-slate-900/80 rounded-3xl mt-4 border border-cyan-500/40">
                                <div class="text-4xl font-bold text-white"><span id="p-distance-val">...</span> m</div>
                                <div id="p-gps-hint" class="text-[10px] text-slate-400 mt-2 italic">Menj közelebb a folytatáshoz! (20m)</div>
                            </div>
                        </div>
                        <div id="p-button-container"></div>
                    </div>
                </div>
            </div>
            
            <div class="p-bottom-nav">
                <button class="p-nav-item active" onclick="if(window.config.initialMapLink) window.open(window.config.initialMapLink,'_blank')">
                    <i class="fa fa-map-marked-alt text-xl"></i>
                    <span class="p-nav-label">Térkép</span>
                </button>
                <button class="p-nav-item" onclick="pToggleInventory()">
                    <i class="fa fa-briefcase text-xl"></i>
                    <span class="p-nav-label">Zsák</span>
                    <div id="p-inv-badge" class="p-badge hidden">0</div>
                </button>
                <button class="p-nav-item" onclick="pResetGame()">
                    <i class="fa fa-rotate-right text-xl"></i>
                    <span class="p-nav-label">Újra</span>
                </button>
                <button class="p-nav-item" onclick="toggleFullScreen()">
                    <i class="fa fa-expand text-xl"></i>
                    <span class="p-nav-label">Teljes</span>
                </button>
                <button class="p-nav-item text-red-400" onclick="togglePlayerMode()">
                    <i class="fa fa-xmark-circle text-xl"></i>
                    <span class="p-nav-label">Bezár</span>
                </button>
            </div>
        </div>
    </div>

    <audio id="p-ringtone-audio" loop></audio>
    <audio id="p-call-voice-audio"></audio>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithCustomToken, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const userFallbackConfig = { apiKey: "AIzaSyCfVce17Yye6jyvpSSoW6jlh3ei7T0N618", authDomain: "kalandmotor.firebaseapp.com", projectId: "kalandmotor", storageBucket: "kalandmotor.firebasestorage.app", messagingSenderId: "108860908140", appId: "1:108860908140:web:5fbec83f4ae7b51487ee49" };
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : userFallbackConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kalandmotor-v13';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const defaultConfig = {
            appTitle: "A Város Titka",
            globalBg: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?q=80&w=2000",
            avatars: [{ id: 'A', name: 'Mesélő', url: '', color: '#8b5cf6' }],
            storyPages: [{ content: "Üdvözöllek a történetben! §A", pageType: "story" }]
        };

        window.config = JSON.parse(localStorage.getItem('KALAND_STUDIO_V13')) || defaultConfig;

        let currentIdx = 0, pSimIdx = 0, pInventory = [], pQrScanner = null, splashTimer = null, userPos = null, lastAutoGpsIdx = -1, currentUser = null;

        function getDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return 999999;
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                updateGpsDisplays();
            }, null, { enableHighAccuracy: true });
        }

        function updateGpsDisplays() {
            if (!userPos) return;
            const simP = window.config.storyPages[currentIdx];
            if (simP && simP.pageType === 'gps') {
                const el = document.getElementById('sim-distance-val');
                if (el) el.textContent = getDistance(userPos.lat, userPos.lng, simP.targetLat, simP.targetLng);
            }
            const pP = window.config.storyPages[pSimIdx];
            if (pP && pP.pageType === 'gps') {
                const dist = getDistance(userPos.lat, userPos.lng, pP.targetLat, pP.targetLng);
                const valEl = document.getElementById('p-distance-val');
                if (valEl) valEl.textContent = dist;
                const hint = document.getElementById('p-gps-hint');
                if (dist <= 20 && lastAutoGpsIdx !== pSimIdx) {
                    lastAutoGpsIdx = pSimIdx; if(hint) { hint.textContent = "Megérkeztél!"; hint.classList.add('text-emerald-400'); }
                    setTimeout(() => { pSimIdx = (pP.nextIdx !== "" && pP.nextIdx !== undefined) ? parseInt(pP.nextIdx) : pSimIdx + 1; window.pUpdateUI(); }, 1000);
                }
            }
        }

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    try { await signInAnonymously(auth); } catch (e) {}
                }
            } catch (err) {
                try { await signInAnonymously(auth); } catch (e) {}
            }
        };

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user && !user.isAnonymous) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-name').textContent = user.displayName;
                document.getElementById('user-photo').src = user.photoURL;
                window.initCommunitySync();
                // Betöltjük a legutóbbi privát mentést
                const privateSaveRef = doc(db, 'artifacts', appId, 'users', user.uid, 'userSaves', 'latest');
                const snap = await getDoc(privateSaveRef);
                if (snap.exists()) {
                    window.config = snap.data().config;
                    window.refreshUI();
                }
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        document.getElementById('login-btn').onclick = window.login;

        window.newGame = () => {
            if (!confirm("Biztosan új játékot kezdesz? A nem mentett változtatások elvesznek.")) return;
            window.config = JSON.parse(JSON.stringify(defaultConfig));
            delete window.config.cloudId;
            window.refreshUI();
            window.autoSave();
        };

        window.saveGame = async () => {
            if (!currentUser || currentUser.isAnonymous) { alert("A mentéshez bejelentkezés szükséges (Google)!"); return; }
            const btn = document.getElementById('save-btn'); 
            const originalText = btn.textContent;
            btn.textContent = "MENTÉS...";

            try {
                const privateSaveRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'userSaves', 'latest');
                await setDoc(privateSaveRef, {
                    config: window.config,
                    updatedAt: new Date().toISOString()
                });

                if (window.config.cloudId) {
                    const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', window.config.cloudId);
                    await setDoc(publicRef, {
                        title: window.config.appTitle,
                        author: currentUser.displayName,
                        authorId: currentUser.uid,
                        config: window.config,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                    alert("A játék sikeresen frissítve a publikált listában!");
                } else {
                    alert("Sikeresen mentve a saját fiókodba! (Még nincs publikálva)");
                }
            } catch (e) {
                console.error("Hiba a mentéskor:", e);
                alert("Hiba történt a mentés során!");
            } finally {
                btn.textContent = originalText;
            }
        };

        window.publishGame = async () => {
            if (!currentUser || currentUser.isAnonymous) { alert("A publikáláshoz bejelentkezés szükséges (Google)!"); return; }
            const btn = document.getElementById('publish-btn');
            const originalText = btn.textContent;
            btn.textContent = "KÜLDÉS...";

            try {
                const newGameId = self.crypto.randomUUID();
                window.config.cloudId = newGameId;

                const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', newGameId);
                await setDoc(publicRef, {
                    title: window.config.appTitle,
                    author: currentUser.displayName,
                    authorId: currentUser.uid,
                    config: window.config,
                    updatedAt: new Date().toISOString()
                });

                const privateSaveRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'userSaves', 'latest');
                await setDoc(privateSaveRef, { config: window.config, updatedAt: new Date().toISOString() });

                alert("Sikeresen publikálva ÚJ játékként a közösségnek!");
            } catch (e) {
                console.error("Hiba a publikáláskor:", e);
                alert("Hiba történt a publikálás során!");
            } finally {
                btn.textContent = originalText;
            }
        };

        window.initCommunitySync = () => {
            const col = collection(db, 'artifacts', appId, 'public', 'data', 'publishedGames');
            onSnapshot(col, (snap) => {
                const list = document.getElementById('community-game-list');
                list.innerHTML = '';
                snap.docs.forEach(docSnap => {
                    const data = docSnap.data();
                    const isAuthor = currentUser && (data.authorId === currentUser.uid);
                    const card = document.createElement('div');
                    card.className = "glass-card p-6 flex flex-col gap-4 border border-slate-700 hover:border-purple-500 transition-all";
                    card.innerHTML = `
                        <div class="relative rounded-xl h-32 overflow-hidden bg-slate-900">
                            <img src="${data.config?.globalBg || ''}" class="w-full h-full object-cover opacity-60">
                        </div>
                        <h3 class="font-bold text-lg text-white truncate">${data.title}</h3>
                        <p class="text-xs text-slate-400">Szerző: ${data.author || 'Ismeretlen'}</p>
                        <div class="flex flex-col gap-2 mt-2">
                            <button class="bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-bold uppercase text-xs" onclick="loadAndPlayPublicGame('${docSnap.id}')">Játék indítása</button>
                            ${isAuthor ? `
                                <div class="flex gap-2">
                                    <button onclick="loadAndEditPublicGame('${docSnap.id}')" class="flex-1 bg-amber-600 hover:bg-amber-500 py-2 rounded-lg font-bold uppercase text-[10px]">Szerkesztés</button>
                                    <button onclick="deletePublishedGame('${docSnap.id}')" class="bg-red-600 hover:bg-red-500 p-2 rounded-lg"><i class="fa fa-trash text-white"></i></button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                    list.appendChild(card);
                });
            }, (err) => console.error(err));
        };

        window.loadAndPlayPublicGame = async (id) => {
            const publicDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id);
            const snap = await getDoc(publicDocRef);
            if (snap.exists()) {
                window.config = snap.data().config;
                window.refreshUI();
                togglePlayerMode();
            }
        };

        window.loadAndEditPublicGame = async (id) => {
            const publicDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id);
            const snap = await getDoc(publicDocRef);
            if (snap.exists()) {
                window.config = snap.data().config;
                window.refreshUI();
                switchView('studio');
            }
        };

        window.deletePublishedGame = async (gameId) => {
            if (!confirm("Biztosan törölni akarod ezt a játékot a közösségi listáról?")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', gameId));
            } catch (e) { console.error(e); }
        };

        window.switchView = (v) => {
            document.getElementById('studio-view').style.display = v === 'studio' ? 'block' : 'none';
            document.getElementById('community-view').style.display = v === 'community' ? 'block' : 'none';
        };

        window.refreshUI = () => {
            document.getElementById('appTitle').value = window.config.appTitle; 
            document.getElementById('globalBg').value = window.config.globalBg;
            window.renderPageList(); 
            window.renderAvatarAdmin(); 
            window.loadPage(0);
        };

        window.autoSave = () => {
            const p = window.config.storyPages[currentIdx];
            if (p) {
                p.content = document.getElementById('pageText').value;
                p.pageType = document.getElementById('pageType').value;
                p.pageImage = document.getElementById('pageImage').value;
                p.pageBg = document.getElementById('pageBg').value;
                p.nextIdx = document.getElementById('nextIdx').value;
                p.prevIdx = document.getElementById('prevIdx').value;
                p.targetLat = document.getElementById('targetLat').value;
                p.targetLng = document.getElementById('targetLng').value;
            }
            window.config.appTitle = document.getElementById('appTitle').value;
            window.config.globalBg = document.getElementById('globalBg').value;
            localStorage.setItem('KALAND_STUDIO_V13', JSON.stringify(window.config));
            window.renderPageList(); window.updateSimulator();
        };

        window.updateSimulator = () => {
            const p = window.config.storyPages[currentIdx]; if (!p) return;
            document.getElementById('sim-bg').src = p.pageBg || window.config.globalBg || "";
            let text = p.content || ""; const avBox = document.getElementById('sim-avatar'); avBox.style.display = 'none';
            window.config.avatars.forEach(av => { if(text.includes(`§${av.id}`)) { avBox.src = av.url || ""; avBox.style.display = 'block'; avBox.style.borderColor = av.color; text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color}">${av.name}:</span>`); } });
            document.getElementById('sim-actual-text').innerHTML = text;
            document.getElementById('sim-gps-monitor').classList.toggle('hidden', p.pageType !== 'gps');
            const acts = document.getElementById('sim-actions'); acts.innerHTML = '';
            const navRow = document.createElement('div'); navRow.className = "sim-nav-row";
            const bBack = document.createElement('button'); bBack.className="sim-btn sim-btn-secondary flex-1"; bBack.textContent="Vissza";
            bBack.onclick = () => { currentIdx = (p.prevIdx !== "" && p.prevIdx !== undefined) ? parseInt(p.prevIdx) : Math.max(0, currentIdx - 1); window.loadPage(currentIdx); };
            const bNext = document.createElement('button'); bNext.className="sim-btn flex-1"; bNext.textContent="Tovább";
            bNext.onclick = () => { currentIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : currentIdx + 1; window.loadPage(currentIdx); };
            navRow.append(bBack, bNext);
            acts.appendChild(navRow);
            updateGpsDisplays();
        };

        window.loadPage = (i) => { currentIdx = i; const p = window.config.storyPages[i]; if (!p) return; document.getElementById('editorPanel').classList.remove('hidden'); document.getElementById('editing-page-id').textContent = `#${i}`; document.getElementById('pageText').value = p.content || ""; document.getElementById('pageType').value = p.pageType || 'story'; document.getElementById('nextIdx').value = p.nextIdx || ""; document.getElementById('prevIdx').value = p.prevIdx || ""; document.getElementById('targetLat').value = p.targetLat || ""; document.getElementById('targetLng').value = p.targetLng || ""; window.updateUI(); window.updateSimulator(); };

        window.pUpdateUI = () => {
            const p = window.config.storyPages[pSimIdx]; if (!p) return;
            clearTimeout(splashTimer); document.getElementById('p-splash-screen').classList.add('hidden'); 
            document.getElementById('p-bg-layer').src = p.pageBg || window.config.globalBg || "";
            let text = p.content || ""; const avImg = document.getElementById('p-avatar-img'); avImg.style.display = 'none';
            window.config.avatars.forEach(av => { if(text.includes(`§${av.id}`)) { avImg.src = av.url || ""; avImg.style.display = 'block'; avImg.style.borderColor = av.color; text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color}">${av.name}:</span>`); } });
            document.getElementById('p-story-text').innerHTML = text;
            const ill = document.getElementById('p-page-illustration'); if(p.pageImage) { ill.src = p.pageImage; ill.classList.remove('hidden'); } else { ill.classList.add('hidden'); }
            document.getElementById('p-gps-monitor').classList.toggle('hidden', p.pageType !== 'gps');
            const btnCont = document.getElementById('p-button-container'); btnCont.innerHTML = '';
            if(p.pageType === 'password') {
                const inp = document.createElement('input'); inp.className = "input-style !p-4 !text-2xl text-center font-bold mb-2"; inp.placeholder="KÓD..."; btnCont.appendChild(inp);
            } else if(p.pageType === 'qr') {
                const qb = document.createElement('button'); qb.className="p-action-btn mb-2"; qb.textContent='Beolvasás'; qb.onclick=window.pStartQR; btnCont.appendChild(qb);
            } else if(p.pageType === 'choice' && p.choices) {
                p.choices.forEach(c => {
                    const cb = document.createElement('button'); cb.className="p-action-btn mb-2"; cb.textContent=c.text; cb.onclick=()=>{ pSimIdx=parseInt(c.target); window.pUpdateUI(); }; btnCont.appendChild(cb);
                });
            }
            const navRow = document.createElement('div'); navRow.className = "p-nav-row";
            const bBack = document.createElement('button'); bBack.className = "p-action-btn btn-secondary"; bBack.textContent = "Vissza";
            bBack.onclick = () => { pSimIdx = (p.prevIdx !== "" && p.prevIdx !== undefined) ? parseInt(p.prevIdx) : Math.max(0, pSimIdx - 1); window.pUpdateUI(); };
            const bNext = document.createElement('button'); bNext.className = "p-action-btn"; bNext.textContent = "Tovább";
            bNext.onclick = () => { pSimIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : pSimIdx + 1; window.pUpdateUI(); };
            navRow.append(bBack, bNext);
            btnCont.appendChild(navRow);
            updateGpsDisplays();
        };

        window.togglePlayerMode = () => { const pv = document.getElementById('player-view'); pv.style.display = pv.style.display === 'flex' ? 'none' : 'flex'; if(pv.style.display==='flex') { pSimIdx=0; window.pUpdateUI(); } };
        window.renderPageList = () => { const l = document.getElementById('pageList'); l.innerHTML = ''; window.config.storyPages.forEach((p, i) => { const d = document.createElement('div'); d.className = `page-item ${i === currentIdx ? 'selected' : ''}`; d.dataset.id = i; d.innerHTML = `<div class="flex items-center gap-2"><i class="fa fa-bars handle"></i><span onclick="loadPage(${i})">#${i}: ${p.content ? p.content.substring(0,20) : '...'}</span></div><button onclick="window.config.storyPages.splice(${i},1);window.renderPageList();window.autoSave()"><i class="fa fa-trash text-red-400"></i></button>`; l.appendChild(d); }); };
        window.addPage = () => { window.config.storyPages.push({ content: "Új oldal...", pageType: "story" }); window.renderPageList(); window.autoSave(); };
        window.updateUI = () => { const t = document.getElementById('pageType').value; document.getElementById('gpsInputs').classList.toggle('hidden', t !== 'gps'); };
        window.addAvatar = () => { window.config.avatars.push({ id: 'X', name: 'Új', color: '#ffffff' }); window.renderAvatarAdmin(); window.autoSave(); };
        window.renderAvatarAdmin = () => { const l = document.getElementById('avatarList'); l.innerHTML = ''; window.config.avatars.forEach((av, i) => { const d = document.createElement('div'); d.className="flex gap-2 items-center mb-1"; d.innerHTML=`<input type="text" class="input-style !w-8 text-center" value="${av.id}" oninput="window.config.avatars[${i}].id=this.value.toUpperCase();window.autoSave()"><input type="text" class="input-style flex-1" value="${av.name}" oninput="window.config.avatars[${i}].name=this.value;window.autoSave()"><button onclick="window.config.avatars.splice(${i},1);window.renderAvatarAdmin();window.autoSave()"><i class="fa fa-times text-red-500"></i></button>`; l.appendChild(d); }); };
        window.pToggleInventory = () => { const inv = document.getElementById('p-inventory-overlay'); inv.style.display = inv.style.display === 'block' ? 'none' : 'block'; };
        window.pResetGame = () => { pSimIdx = 0; pInventory = []; window.pUpdateUI(); };
        window.pStartQR = () => { document.getElementById('p-qr-layer').style.display='flex'; pQrScanner = new Html5Qrcode("p-qr-reader"); pQrScanner.start({facingMode:"environment"}, {fps:10,qrbox:250}, t=>{ const p=window.config.storyPages[pSimIdx]; if(t.trim().toUpperCase()===(p.qrCode||"").toUpperCase()){ window.pStopQR(); pSimIdx=(p.nextIdx!=""&&p.nextIdx!=undefined)?parseInt(p.nextIdx):pSimIdx+1; window.pUpdateUI(); } }); };
        window.pStopQR = () => { if(pQrScanner) pQrScanner.stop().finally(()=>{ document.getElementById('p-qr-layer').style.display='none'; pQrScanner=null; }); };
        window.toggleFullScreen = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };

        initAuth();
        window.onload = () => { 
            window.refreshUI();
        };
    </script>
</body>
</html>
