<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kalandmotor | Interaktív Történetmesélés</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #22d3ee;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #22d3ee;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Play', sans-serif; 
            background-color: var(--bg-dark); 
            color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Navigáció és Layout */
        #landing-view, #studio-view { height: 100dvh; overflow-y: auto; scroll-behavior: smooth; }
        #studio-view { display: none; padding: 1rem; }
        @media (min-width: 768px) { #studio-view { padding: 2.5rem; } }

        /* Landing Design */
        .hero-bg {
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 1rem; }
        .special-font { font-family: 'Special Elite', cursive; }
        .logo-glow { text-shadow: 0 0 15px rgba(34, 211, 238, 0.6); }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(139, 92, 246, 0.5); }

        /* Szerkesztő Specifikus Stílusok (V14.1 megőrizve) */
        .input-style { background: #0f172a; color: var(--secondary); border: 1px solid #334155; border-radius: 0.5rem; padding: 0.6rem; outline: none; transition: 0.2s; width: 100%; font-size: 0.875rem; }
        .input-style:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; cursor: pointer; user-select: none; }
        .page-item:hover { background: #2d3748; }
        .page-item.selected { border-color: var(--secondary); background: #4c1d95; box-shadow: 0 0 15px rgba(34, 211, 238, 0.2); }
        .handle { cursor: grab; padding: 5px 15px 5px 5px; color: #64748b; font-size: 0.9rem; }

        /* SIMULATOR */
        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; opacity: 0.6; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 35px; min-height: 220px; display: flex; flex-direction: column; }
        .sim-avatar { position: absolute; top: -40px; left: 10px; width: 65px; height: 65px; border-radius: 50%; border: 3px solid var(--primary); background: #000; z-index: 20; object-fit: cover; display: none; }
        .sim-btn { background: var(--primary); color: white; padding: 10px; border-radius: 0.5rem; font-weight: 700; text-align: center; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; width: 100%; border: none; }

        /* PLAYER VIEW */
        #player-view { position: fixed; inset: 0; z-index: 9000; background: #000; display: none; flex-direction: column; height: 100dvh; }
        .p-game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        .p-dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 4px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 25px; padding-top: 45px; min-height: 280px; max-height: 80dvh; display: flex; flex-direction: column; }
        .p-action-btn { flex: 1; background: var(--primary); color: white; padding: 16px; border-radius: 0.85rem; font-weight: 700; text-align: center; font-size: 1.05rem; cursor: pointer; text-transform: uppercase; transition: 0.1s; display: flex; align-items: center; justify-content: center; border: none; }
        .p-bottom-nav { height: 80px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.4); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .p-nav-item { color: #94a3b8; font-size: 1.6rem; cursor: pointer; border: none; background: transparent; width: 25%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 20000; display: none; align-items: center; justify-content: center; }
    </style>
</head>
<body class="hero-bg">

    <div id="save-indicator" class="fixed bottom-6 right-6 bg-emerald-500 text-white px-5 py-2 rounded-full font-bold text-xs z-[10000] hidden">
        <i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...
    </div>

    <!-- LANDING VIEW -->
    <div id="landing-view">
        <!-- Navigation -->
        <nav class="fixed w-full z-50 px-6 py-4 glass-card rounded-none border-x-0 border-t-0 bg-opacity-90 backdrop-blur-md">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2 cursor-pointer" onclick="switchView('landing')">
                    <i class="fa-solid fa-bolt text-cyan-400 text-2xl"></i>
                    <span class="text-2xl font-bold tracking-tighter text-white uppercase">Kaland<span class="text-cyan-400">motor</span></span>
                </div>
                
                <div class="flex items-center gap-4">
                    <div id="auth-nav-guest" class="flex items-center gap-2">
                        <button id="login-btn-landing" class="btn-primary px-6 py-2 rounded-xl text-white text-xs font-bold uppercase tracking-widest">Belépés</button>
                    </div>

                    <div id="auth-nav-user" class="hidden flex items-center gap-3 border-l border-white/10 pl-4">
                        <div class="flex items-center gap-3">
                            <img id="user-photo-nav" src="" class="w-8 h-8 rounded-full border border-cyan-400/50">
                            <span id="user-name-nav" class="text-xs font-bold text-slate-300 hidden sm:block"></span>
                        </div>
                        <button onclick="window.logout()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-red-400 transition">
                            <i class="fa-solid fa-power-off text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="pt-32 px-6">
            <!-- Hero -->
            <section class="max-w-7xl mx-auto py-12 text-center md:text-left flex flex-col md:flex-row items-center gap-12">
                <div class="flex-1 space-y-8">
                    <h1 class="text-5xl md:text-8xl font-bold leading-tight uppercase tracking-tighter">
                        Éld át a <br>
                        <span class="text-cyan-400 special-font logo-glow">Kalandot</span>
                    </h1>
                    <p class="text-slate-400 text-lg max-w-xl leading-relaxed">
                        Készíts interaktív történeteket kódolás nélkül, vagy fedezd fel a közösség által épített világokat. GPS alapú küldetések, kódzárak és rejtélyek várnak.
                    </p>
                    <div id="studio-access-container">
                        <button id="start-studio-btn" onclick="switchView('studio')" class="btn-primary px-10 py-5 rounded-2xl text-xs font-bold tracking-widest uppercase flex items-center gap-3 opacity-50 cursor-not-allowed" disabled>
                            <i class="fa-solid fa-plus-circle"></i> Stúdió Indítása (Belépés szükséges)
                        </button>
                    </div>
                </div>
                <div class="flex-1 hidden lg:block">
                    <div class="glass-card p-4 rotate-3 shadow-2xl">
                        <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1000" class="rounded-lg opacity-80 grayscale hover:grayscale-0 transition-all duration-700">
                    </div>
                </div>
            </section>

            <!-- MY GAMES (Only if logged in) -->
            <section id="user-games-section" class="max-w-7xl mx-auto py-12 hidden border-t border-white/5">
                <h2 class="text-2xl font-bold uppercase mb-8 tracking-tighter">Saját <span class="text-purple-400">Világok</span></h2>
                <div id="user-game-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Dinamikus tartalom -->
                </div>
            </section>

            <!-- PUBLIC GAMES -->
            <section id="public-games-section" class="max-w-7xl mx-auto py-24 border-t border-white/5">
                <h2 class="text-2xl font-bold uppercase mb-12 tracking-tighter">Közösségi <span class="text-cyan-400">Kalandok</span></h2>
                <div id="community-game-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Dinamikus tartalom -->
                </div>
            </section>
        </main>
    </div>

    <!-- STUDIO VIEW (ORIGINAL V14.1) -->
    <div id="studio-view">
        <div class="max-w-7xl mx-auto flex justify-between items-center mb-10">
            <button onclick="switchView('landing')" class="text-cyan-400 font-bold text-[10px] uppercase tracking-widest hover:text-white transition">
                <i class="fa fa-arrow-left mr-2"></i> Vissza a Terminálhoz
            </button>
            <div class="flex items-center gap-4">
                <button onclick="togglePlayerMode()" class="bg-purple-600 text-white px-8 py-3 rounded-xl font-bold text-[10px] uppercase shadow-lg shadow-purple-600/20 hover:brightness-110 active:scale-95 transition-all"><i class="fa fa-play mr-2"></i> Teszt indítása</button>
                <button id="publish-btn" onclick="publishGame()" class="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold text-[10px] uppercase shadow-lg shadow-emerald-600/20 hover:brightness-110 active:scale-95 transition-all">Publikálás</button>
            </div>
        </div>

        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 space-y-6">
                <!-- Editor belső elemei (V14.1 eredeti tartalom) -->
                <div class="glass-card p-6">
                    <div class="flex justify-between items-end mb-3">
                        <label class="text-purple-400 font-bold uppercase text-[10px]">Alapbeállítások</label>
                        <button onclick="newGame()" class="w-8 h-8 bg-slate-700 text-white rounded-lg flex items-center justify-center hover:bg-slate-600 transition-all shadow-lg border border-slate-600"><i class="fa fa-plus"></i></button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-3">
                            <input type="text" id="appTitle" class="input-style" placeholder="Cím" oninput="autoSave()">
                            <input type="url" id="globalBg" class="input-style" placeholder="Háttér URL" oninput="autoSave()">
                            <input type="url" id="initialMapLink" class="input-style" placeholder="Főtérkép Link" oninput="autoSave()">
                        </div>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center"><label class="text-slate-500 font-bold uppercase text-[9px]">Avatarok</label><button onclick="addAvatar()" class="text-cyan-400 text-[9px] font-bold">+ ÚJ</button></div>
                            <div id="avatarList" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
                        </div>
                    </div>
                </div>

                <div class="glass-card p-6">
                    <label class="text-purple-400 font-bold uppercase text-[10px]">Jelenetek</label>
                    <div id="pageList" class="mt-4 max-h-60 overflow-y-auto pr-2"></div>
                    <button onclick="addPage()" class="mt-4 bg-purple-600 text-white px-4 py-2 rounded-lg text-[10px] font-bold">+ ÚJ OLDAL</button>
                </div>

                <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                        <div class="flex flex-col"><label class="text-purple-400 font-bold uppercase text-[10px]">Szerkesztés</label><h2 class="text-xl font-bold text-white"><span id="editing-page-id" class="text-purple-500">#0</span></h2></div>
                        <select id="pageType" class="input-style !w-44" onchange="updateUI(); autoSave();">
                            <option value="story">Leírás</option>
                            <option value="choice">Választás</option>
                            <option value="password">Kódzár</option>
                            <option value="qr">QR Kód</option>
                            <option value="gps">GPS Pont</option>
                            <option value="splash">Átvezetés</option>
                            <option value="call">Hívás</option>
                        </select>
                    </div>
                    <textarea id="pageText" rows="5" class="input-style text-base" placeholder="Szöveg..." oninput="autoSave()"></textarea>
                    
                    <!-- Dinamikus inputok (Password, QR, etc - eredeti logika) -->
                    <div id="passwordInputs" class="hidden space-y-3">
                        <input type="text" id="passwordVal" class="input-style" placeholder="Helyes jelszó" oninput="autoSave()">
                        <textarea id="pageHints" class="input-style text-xs" placeholder="Súgók" oninput="autoSave()"></textarea>
                    </div>
                    <div id="qrInputs" class="hidden"><input type="text" id="qrCodeVal" class="input-style" placeholder="QR Signature" oninput="autoSave()"></div>
                    <div id="gpsInputs" class="hidden grid grid-cols-2 gap-4">
                        <input type="number" id="targetLat" step="any" class="input-style" placeholder="Lat" oninput="autoSave()">
                        <input type="number" id="targetLng" step="any" class="input-style" placeholder="Lng" oninput="autoSave()">
                    </div>
                    <div id="choiceEditor" class="hidden space-y-3 pt-4 border-t border-slate-700">
                        <div id="choiceList" class="space-y-2"></div>
                        <button onclick="addChoice()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ LEHETŐSÉG</button>
                    </div>
                </div>
            </div>

            <!-- Simulator -->
            <div class="lg:col-span-4 hidden lg:flex justify-center">
                <div class="sim-container">
                    <div id="sim-viewport">
                        <img id="sim-bg" src="">
                        <div id="sim-content"><div class="sim-box"><img id="sim-avatar" class="sim-avatar"><div id="sim-scroll" class="overflow-y-auto flex-grow"><div id="sim-actual-text" style="font-size: 16px; font-weight: 700;"></div></div><div id="sim-actions" class="mt-4"></div></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PLAYER OVERLAY -->
    <div id="player-view">
        <div class="p-game-wrapper">
            <div id="p-viewport">
                <img id="p-bg-layer" src="" class="absolute inset-0 w-full h-full object-cover">
                <div id="p-content-layer">
                    <div class="p-dialog-box">
                        <img id="p-avatar-img" class="p-avatar-frame">
                        <div id="p-scroll-area" class="overflow-y-auto flex-grow mb-4">
                            <div id="p-story-text"></div>
                        </div>
                        <div id="p-button-container"></div>
                    </div>
                </div>
            </div>
            <div class="p-bottom-nav">
                <button class="p-nav-item" onclick="pToggleInventory()"><i class="fa fa-briefcase text-2xl"></i></button>
                <button class="p-nav-item" onclick="togglePlayerMode()"><i class="fa fa-times text-2xl"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signInAnonymously, signInWithCustomToken, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // Firebase Konfiguráció (Sajátodra cserélendő, ha szükséges)
        const firebaseConfig = { 
            apiKey: "AIzaSyCfVce17Yye6jyvpSSoW6jlh3ei7T0N618", 
            authDomain: "kalandmotor.firebaseapp.com", 
            projectId: "kalandmotor", 
            storageBucket: "kalandmotor.firebasestorage.app", 
            messagingSenderId: "108860908140", 
            appId: "1:108860908140:web:5fbec83f4ae7b51487ee49" 
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kalandmotor-portal';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const defaultConfig = {
            appTitle: "Új Kaland",
            globalBg: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?q=80&w=2000",
            avatars: [{ id: 'A', name: 'Mesélő', url: '', color: '#8b5cf6' }],
            storyPages: [{ id: self.crypto.randomUUID(), content: "Kapcsolat létrejött. §A", pageType: "story" }]
        };

        window.config = JSON.parse(localStorage.getItem('KALAND_PORTAL_V1')) || defaultConfig;
        window.currentIdx = 0; 
        let currentUser = null;

        // --- NÉZET KEZELÉS ---
        window.switchView = (v) => {
            if(v === 'studio' && (!currentUser || currentUser.isAnonymous)) {
                alert("A Stúdió használatához kérlek jelentkezz be!");
                return;
            }
            document.getElementById('landing-view').style.display = v === 'landing' ? 'block' : 'none';
            document.getElementById('studio-view').style.display = v === 'studio' ? 'block' : 'none';
            if(v === 'landing') {
                window.initCommunitySync();
                if(currentUser) window.initUserGamesSync();
            }
        };

        // --- AUTH ---
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const guestNav = document.getElementById('auth-nav-guest');
            const userNav = document.getElementById('auth-nav-user');
            const studioBtn = document.getElementById('start-studio-btn');

            if (user && !user.isAnonymous) {
                guestNav.classList.add('hidden');
                userNav.classList.remove('hidden');
                document.getElementById('user-photo-nav').src = user.photoURL;
                document.getElementById('user-name-nav').textContent = user.displayName;
                studioBtn.disabled = false;
                studioBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                studioBtn.innerHTML = '<i class="fa-solid fa-plus-circle"></i> Stúdió Indítása';
                window.initUserGamesSync();
            } else {
                guestNav.classList.remove('hidden');
                userNav.classList.add('hidden');
                studioBtn.disabled = true;
                studioBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => location.reload());
        document.getElementById('login-btn-landing').onclick = window.login;

        // --- JÁTÉKOK LISTÁZÁSA ---
        window.initCommunitySync = () => {
            const col = collection(db, 'artifacts', appId, 'public', 'data', 'publishedGames');
            onSnapshot(col, (snap) => {
                const list = document.getElementById('community-game-list');
                list.innerHTML = '';
                snap.docs.forEach(docSnap => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = "glass-card p-6 flex flex-col gap-4 border border-slate-700 hover:border-purple-500 transition-all";
                    card.innerHTML = `
                        <div class="h-40 bg-slate-900 rounded-xl overflow-hidden relative">
                            <img src="${data.config?.globalBg || ''}" class="w-full h-full object-cover opacity-40">
                            <i class="fa-solid fa-mountain text-4xl text-cyan-400/20 absolute inset-0 flex items-center justify-center"></i>
                        </div>
                        <h3 class="font-bold text-white uppercase">${data.title}</h3>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest">Szerző: ${data.author || 'Ismeretlen'}</p>
                        <button class="btn-primary py-3 rounded-xl font-bold uppercase text-[10px]" onclick="window.loadAndPlay('${docSnap.id}', 'public')">Indítás</button>
                    `;
                    list.appendChild(card);
                });
            });
        };

        window.initUserGamesSync = () => {
            if(!currentUser) return;
            const col = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'userGames');
            onSnapshot(col, (snap) => {
                const section = document.getElementById('user-games-section');
                const list = document.getElementById('user-game-list');
                section.classList.toggle('hidden', snap.empty);
                list.innerHTML = '';
                snap.docs.forEach(docSnap => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = "glass-card p-6 flex flex-col gap-4 border border-purple-500/30 hover:border-purple-500 transition-all";
                    card.innerHTML = `
                        <h3 class="font-bold text-white uppercase truncate">${data.config?.appTitle || 'Névtelen'}</h3>
                        <div class="flex gap-2">
                            <button class="flex-1 bg-purple-600 hover:bg-purple-500 py-2 rounded-lg font-bold uppercase text-[10px]" onclick="window.loadAndEdit('${docSnap.id}')">Szerkesztés</button>
                            <button class="flex-1 bg-slate-800 hover:bg-slate-700 py-2 rounded-lg font-bold uppercase text-[10px]" onclick="window.loadAndPlay('${docSnap.id}', 'private')">Teszt</button>
                        </div>
                    `;
                    list.appendChild(card);
                });
            });
        };

        window.loadAndPlay = async (id, type) => {
            const path = type === 'public' 
                ? doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id)
                : doc(db, 'artifacts', appId, 'users', currentUser.uid, 'userGames', id);
            const snap = await getDoc(path);
            if(snap.exists()) {
                window.config = snap.data().config;
                window.togglePlayerMode();
            }
        };

        window.loadAndEdit = async (id) => {
            const snap = await getDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'userGames', id));
            if(snap.exists()) {
                window.config = snap.data().config;
                window.config.cloudId = id;
                window.refreshUI();
                window.switchView('studio');
            }
        };

        // --- STÚDIÓ FUNKCIÓK (V14.1 EREDETI LOGIKA) ---
        window.autoSave = async () => {
            const p = window.config.storyPages[window.currentIdx];
            p.content = document.getElementById('pageText').value;
            p.pageType = document.getElementById('pageType').value;
            window.config.appTitle = document.getElementById('appTitle').value;
            window.config.globalBg = document.getElementById('globalBg').value;
            localStorage.setItem('KALAND_PORTAL_V1', JSON.stringify(window.config));
            window.updateSimulator();
            window.renderPageList();

            // Cloud Save
            if(currentUser && !currentUser.isAnonymous) {
                document.getElementById('save-indicator').classList.remove('hidden');
                const saveId = window.config.cloudId || self.crypto.randomUUID();
                window.config.cloudId = saveId;
                await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'userGames', saveId), {
                    config: window.config,
                    updatedAt: new Date().toISOString()
                });
                setTimeout(() => document.getElementById('save-indicator').classList.add('hidden'), 800);
            }
        };

        window.publishGame = async () => {
            if(!currentUser) return;
            const publishId = window.config.cloudId || self.crypto.randomUUID();
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', publishId), {
                title: window.config.appTitle,
                author: currentUser.displayName,
                authorId: currentUser.uid,
                config: window.config
            });
            alert("Publikálva a közösségi könyvtárba!");
        };

        // Editor Segédfüggvények (V14.1-ből átemelve)
        window.refreshUI = () => {
            document.getElementById('appTitle').value = window.config.appTitle;
            document.getElementById('globalBg').value = window.config.globalBg;
            window.renderPageList();
            window.renderAvatarAdmin();
            window.loadPage(0);
        };

        window.loadPage = (i) => {
            window.currentIdx = i;
            const p = window.config.storyPages[i];
            document.getElementById('editorPanel').classList.remove('hidden');
            document.getElementById('editing-page-id').textContent = `#${i}`;
            document.getElementById('pageText').value = p.content;
            document.getElementById('pageType').value = p.pageType || 'story';
            window.updateUI(); window.updateSimulator(); window.renderPageList();
        };

        window.updateUI = () => {
            const t = document.getElementById('pageType').value;
            document.getElementById('passwordInputs').classList.toggle('hidden', t !== 'password');
            document.getElementById('qrInputs').classList.toggle('hidden', t !== 'qr');
            document.getElementById('gpsInputs').classList.toggle('hidden', t !== 'gps');
            document.getElementById('choiceEditor').classList.toggle('hidden', t !== 'choice');
        };

        window.renderPageList = () => {
            const l = document.getElementById('pageList'); l.innerHTML = '';
            window.config.storyPages.forEach((p, i) => {
                const d = document.createElement('div');
                d.className = `page-item ${i === window.currentIdx ? 'selected' : ''}`;
                d.innerHTML = `<div class="flex items-center gap-2 truncate pr-2"><i class="fa fa-bars handle"></i><span class="font-bold text-sm">#${i}: ${p.content.substring(0,20)}</span></div>`;
                d.onclick = () => window.loadPage(i);
                l.appendChild(d);
            });
        };

        window.addPage = () => { window.config.storyPages.push({id: self.crypto.randomUUID(), content: 'Új szöveg...', pageType: 'story'}); window.autoSave(); };
        window.newGame = () => { if(confirm("Törlöd az aktuális szerkesztést?")) { window.config = JSON.parse(JSON.stringify(defaultConfig)); window.refreshUI(); } };

        window.updateSimulator = () => {
            const p = window.config.storyPages[window.currentIdx]; if(!p) return;
            document.getElementById('sim-bg').src = p.pageBg || window.config.globalBg;
            document.getElementById('sim-actual-text').innerHTML = p.content;
        };

        window.renderAvatarAdmin = () => {
            const l = document.getElementById('avatarList'); l.innerHTML = '';
            window.config.avatars.forEach((av, i) => {
                const d = document.createElement('div'); d.className = "flex gap-2 mb-2";
                d.innerHTML = `<input type="text" class="input-style !w-12 text-center" value="${av.id}" oninput="window.config.avatars[${i}].id=this.value.toUpperCase();window.autoSave()"><input type="text" class="input-style flex-1" value="${av.name}" oninput="window.config.avatars[${i}].name=this.value;window.autoSave()">`;
                l.appendChild(d);
            });
        };

        window.addAvatar = () => { window.config.avatars.push({id:'X', name:'Új', color:'#fff'}); window.renderAvatarAdmin(); };
        window.togglePlayerMode = () => { 
            const pv = document.getElementById('player-view'); 
            pv.style.display = pv.style.display === 'flex' ? 'none' : 'flex'; 
            if(pv.style.display === 'flex') window.pUpdateUI();
        };

        window.pUpdateUI = () => {
            const p = window.config.storyPages[0]; // Kezdőoldal
            document.getElementById('p-bg-layer').src = window.config.globalBg;
            document.getElementById('p-story-text').innerHTML = p.content;
            const bc = document.getElementById('p-button-container'); bc.innerHTML = '';
            const b = document.createElement('button'); b.className = "p-action-btn"; b.textContent = "Kezdés";
            b.onclick = () => alert("Ez a teszt üzemmód.");
            bc.appendChild(b);
        };

        window.onload = () => {
            window.switchView('landing');
            window.refreshUI();
            new Sortable(document.getElementById('pageList'), { handle: '.handle', animation: 150 });
        };
    </script>
</body>
</html>
