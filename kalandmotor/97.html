<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Adventure Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #22d3ee;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            height: 100dvh;
            font-family: 'Play', sans-serif; 
            background-color: var(--bg-dark); 
            color: #f8fafc; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Navigáció */
        nav {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .view-section { display: none; min-height: calc(100vh - 64px); }
        .view-section.active { display: block; }
        
        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 1rem; }

        .input-style { background: #0f172a; color: var(--secondary); border: 1px solid #334155; border-radius: 0.5rem; padding: 0.6rem; outline: none; transition: 0.2s; width: 100%; font-size: 0.875rem; }
        .input-style:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; cursor: pointer; user-select: none; }
        .page-item:hover { background: #2d3748; }
        .page-item.selected { border-color: var(--secondary); background: #4c1d95; box-shadow: 0 0 15px rgba(34, 211, 238, 0.2); }
        .handle { cursor: grab; padding: 5px 15px 5px 5px; color: #64748b; font-size: 0.9rem; }

        /* SIMULATOR */
        .sim-container { position: sticky; top: 80px; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; opacity: 0.6; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 35px; min-height: 220px; display: flex; flex-direction: column; }
        .sim-avatar { position: absolute; top: -40px; left: 10px; width: 65px; height: 65px; border-radius: 50%; border: 3px solid var(--primary); background: #000; z-index: 20; object-fit: cover; display: none; }
        .sim-btn { background: var(--primary); color: white; padding: 10px; border-radius: 0.5rem; font-weight: 700; text-align: center; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; width: 100%; border: none; }

        /* PLAYER VIEW (FULLSCREEN) */
        #player-view { position: fixed; inset: 0; z-index: 9000; background: #000; display: none; flex-direction: column; height: 100dvh; }
        .p-game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s ease-in-out; }
        
        .p-dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 4px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 25px; padding-top: 45px; min-height: 280px; max-height: 80dvh; display: flex; flex-direction: column; box-shadow: 0 -15px 35px rgba(0,0,0,0.7); margin-top: auto; }
        .p-avatar-frame { position: absolute; top: -45px; left: 20px; width: 85px; height: 85px; border-radius: 50%; border: 4px solid var(--primary); background: #000; z-index: 20; object-fit: cover; display: none; }
        #p-story-text { font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 15px; color: #f8fafc; }
        .p-action-btn { background: var(--primary); color: white; padding: 16px; border-radius: 0.85rem; font-weight: 700; text-align: center; font-size: 1.05rem; cursor: pointer; text-transform: uppercase; transition: 0.1s; display: flex; align-items: center; justify-content: center; border: none; width: 100%; margin-bottom: 10px; }

        /* MODALS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 20000; display: none; align-items: center; justify-content: center; }

        .splash-text-anim { font-family: 'Special Elite', cursive; animation: fadeInOutSplash 10s ease-in-out forwards; text-transform: uppercase; letter-spacing: 0.2em; }
        @keyframes fadeInOutSplash { 0% { opacity: 0; transform: scale(0.9); } 20% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
</head>
<body>

    <!-- NAVIGÁCIÓ -->
    <nav class="h-16 px-4 md:px-8 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-white tracking-tighter cursor-pointer" onclick="switchView('portal')">
                ADVENTURE <span class="text-purple-500">STUDIO</span>
            </h1>
        </div>
        
        <div class="flex items-center gap-6">
            <button onclick="switchView('portal')" class="text-sm font-bold uppercase text-slate-400 hover:text-white transition-colors hidden md:block">Felfedezés</button>
            <button id="nav-studio-btn" onclick="switchView('studio')" class="hidden text-sm font-bold uppercase text-purple-400 hover:text-purple-300 transition-colors">Stúdió</button>
            
            <div id="auth-section">
                <button id="login-btn" onclick="window.login()" class="bg-white text-black px-5 py-2 rounded-full font-bold text-xs uppercase hover:bg-slate-200 transition-all">Belépés</button>
                <div id="user-info" class="hidden flex items-center gap-3">
                    <img id="user-photo" src="" class="w-8 h-8 rounded-full border border-purple-500">
                    <button onclick="window.logout()" class="text-slate-400 hover:text-red-400 text-sm"><i class="fa fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- FŐOLDAL / PORTÁL -->
    <div id="portal-view" class="view-section active p-6 md:p-12">
        <div class="max-w-7xl mx-auto">
            <header class="mb-12">
                <h2 class="text-4xl md:text-6xl font-bold mb-4">Üdvözöljük a <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">Kalandok</span> világában!</h2>
                <p class="text-slate-400 max-w-2xl">Válogass a közösség által készített interaktív történetek közül, vagy jelentkezz be, hogy saját játékot építs kódolás nélkül.</p>
            </header>
            
            <div id="community-game-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Játék kártyák helye -->
            </div>
        </div>
    </div>

    <!-- STÚDIÓ (SZERKESZTŐ) -->
    <div id="studio-view" class="view-section p-6 md:p-12">
        <div class="max-w-7xl mx-auto">
            <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                    <h2 class="text-2xl font-bold">Stúdió Munkaterület</h2>
                    <p class="text-xs text-purple-400 uppercase font-bold tracking-widest">Szerkesztő V14.1</p>
                </div>
                <div class="flex gap-4 w-full md:w-auto">
                    <button onclick="togglePlayerMode()" class="flex-1 md:flex-none bg-purple-600 px-8 py-3 rounded-xl font-bold text-[10px] uppercase shadow-lg hover:brightness-110 transition-all"><i class="fa fa-play mr-2"></i> Teszt</button>
                    <button onclick="publishGame()" class="flex-1 md:flex-none bg-emerald-600 px-8 py-3 rounded-xl font-bold text-[10px] uppercase shadow-lg hover:brightness-110 transition-all">Publikálás</button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <!-- Szerkesztő panel (Bal oldal) -->
                <div class="lg:col-span-8 space-y-6">
                    <div class="glass-card p-6">
                        <div class="flex justify-between items-center mb-4">
                            <label class="text-purple-400 font-bold uppercase text-[10px]">Alapbeállítások</label>
                            <button onclick="newGame()" class="text-[10px] text-cyan-400 font-bold">+ ÚJ PROJEKT</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="appTitle" class="input-style" placeholder="Játék címe" oninput="autoSave()">
                            <input type="url" id="globalBg" class="input-style" placeholder="Globális háttér URL" oninput="autoSave()">
                        </div>
                    </div>

                    <div class="glass-card p-6">
                        <label class="text-purple-400 font-bold uppercase text-[10px]">Jelenetek kezelése</label>
                        <div id="pageList" class="mt-4 max-h-60 overflow-y-auto pr-2"></div>
                        <button onclick="addPage()" class="mt-4 w-full py-3 border-2 border-dashed border-slate-700 text-slate-500 rounded-xl hover:text-purple-400 hover:border-purple-400 transition-all font-bold text-xs uppercase">+ Jelenet hozzáadása</button>
                    </div>

                    <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                            <h3 class="text-xl font-bold text-white">Szerkesztés: <span id="editing-page-id" class="text-purple-500">#0</span></h3>
                            <select id="pageType" class="input-style !w-44" onchange="updateUI(); autoSave();">
                                <option value="story">Leírás</option>
                                <option value="choice">Választás</option>
                                <option value="password">Kódzár</option>
                                <option value="qr">QR Kód</option>
                                <option value="call">Hívás</option>
                                <option value="splash">Átvezetés</option>
                            </select>
                        </div>

                        <textarea id="pageText" rows="4" class="input-style text-base" placeholder="Írd ide a történetet..." oninput="autoSave()"></textarea>

                        <div class="grid grid-cols-2 gap-4">
                            <input type="url" id="pageImage" class="input-style text-xs" placeholder="Kép URL" oninput="autoSave()">
                            <input type="url" id="pageBg" class="input-style text-xs" placeholder="Egyedi háttér" oninput="autoSave()">
                        </div>
                        
                        <!-- Dinamikus bemenetek (Választások, kódok stb.) -->
                        <div id="choiceEditor" class="hidden space-y-3">
                            <div id="choiceList" class="space-y-2"></div>
                            <button onclick="addChoice()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ OPCIÓ</button>
                        </div>
                        
                        <div id="passwordInputs" class="hidden">
                            <input type="text" id="passwordVal" class="input-style" placeholder="Megoldás" oninput="autoSave()">
                        </div>
                    </div>
                </div>

                <!-- Szimulátor (Jobb oldal) -->
                <div class="lg:col-span-4 hidden lg:block">
                    <div class="sim-container">
                        <div id="sim-viewport">
                            <img id="sim-bg" src="">
                            <div id="sim-content">
                                <div class="sim-box">
                                    <div id="sim-actual-text" class="text-sm font-bold mb-4"></div>
                                    <div id="sim-actions"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JÁTÉKOS NÉZET (OVERLAY) -->
    <div id="player-view">
        <div class="p-game-wrapper">
            <img id="p-bg-layer" src="">
            
            <!-- Átvezető képernyő -->
            <div id="p-splash-screen" class="absolute inset-0 bg-black z-[5000] hidden flex items-center justify-center">
                <div id="p-splash-text" class="text-white text-center p-10 splash-text-anim text-4xl"></div>
            </div>

            <div class="p-dialog-box">
                <div id="p-scroll-area" class="overflow-y-auto flex-grow mb-4 pr-2">
                    <img id="p-page-illustration" class="w-full rounded-2xl mb-6 hidden" src="">
                    <div id="p-story-text"></div>
                </div>
                <div id="p-button-container"></div>
                
                <div class="flex justify-between items-center mt-4 border-t border-slate-800 pt-4">
                    <button onclick="togglePlayerMode()" class="text-slate-500 text-xs font-bold uppercase hover:text-red-400"><i class="fa fa-times mr-1"></i> Kilépés</button>
                    <button onclick="pResetGame()" class="text-slate-500 text-xs font-bold uppercase hover:text-white"><i class="fa fa-rotate-right mr-1"></i> Újrakezdés</button>
                </div>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="modal-overlay">
        <div class="glass-card p-8 max-w-sm w-full mx-4 text-center">
            <h2 id="confirm-title" class="text-xl font-bold mb-2">Megerősítés</h2>
            <p id="confirm-desc" class="text-slate-400 text-sm mb-8">Biztosan folytatni akarod?</p>
            <div class="flex gap-4">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-slate-700 rounded-xl font-bold text-xs uppercase">Mégse</button>
                <button id="confirm-action-btn" class="flex-1 py-3 bg-red-600 rounded-xl font-bold text-xs uppercase">Igen</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signInAnonymously, signInWithCustomToken, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // Firebase Setup
        const firebaseConfig = JSON.parse(__firebase_config || '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kaland-v14-portal';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // State
        const defaultConfig = {
            appTitle: "Új Kaland",
            globalBg: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?q=80&w=2000",
            avatars: [],
            storyPages: [{ id: self.crypto.randomUUID(), content: "Kezdődik a történet...", pageType: "story" }]
        };

        window.config = JSON.parse(localStorage.getItem('KALAND_V14_CONFIG')) || defaultConfig;
        window.currentIdx = 0;
        let currentUser = null;
        let pSimIdx = 0;

        // View Controller
        window.switchView = (viewName) => {
            if (viewName === 'studio' && (!currentUser || currentUser.isAnonymous)) {
                alert("A Stúdió használatához kérjük, jelentkezzen be!");
                return;
            }
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById(`${viewName}-view`).classList.add('active');
            
            if (viewName === 'portal') initPortal();
        };

        // Auth Logic
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user && !user.isAnonymous) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-photo').src = user.photoURL;
                document.getElementById('nav-studio-btn').classList.remove('hidden');
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('nav-studio-btn').classList.add('hidden');
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => { location.reload(); });

        // Portál / Közösségi játékok betöltése
        const initPortal = () => {
            const col = collection(db, 'artifacts', appId, 'public', 'data', 'publishedGames');
            onSnapshot(col, (snap) => {
                const list = document.getElementById('community-game-list');
                list.innerHTML = '';
                snap.docs.forEach(docSnap => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = "glass-card overflow-hidden group hover:border-purple-500 transition-all flex flex-col";
                    card.innerHTML = `
                        <div class="h-48 overflow-hidden relative">
                            <img src="${data.config?.globalBg || ''}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500 opacity-60">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 to-transparent"></div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <h3 class="text-xl font-bold mb-1">${data.title || 'Névtelen játék'}</h3>
                            <p class="text-xs text-slate-400 mb-6 uppercase tracking-widest font-bold">Készítette: ${data.author || 'Ismeretlen'}</p>
                            <button onclick="window.playGame('${docSnap.id}')" class="mt-auto w-full py-4 bg-purple-600 rounded-xl font-bold uppercase text-xs hover:bg-purple-500 transition-all shadow-lg shadow-purple-600/20">Játék indítása</button>
                        </div>
                    `;
                    list.appendChild(card);
                });
            });
        };

        window.playGame = async (id) => {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id);
            const snap = await getDoc(ref);
            if (snap.exists()) {
                window.config = snap.data().config;
                togglePlayerMode();
            }
        };

        // --- SZERKESZTŐ LOGIKA (Eredeti funkciók megtartása) ---

        window.loadPage = (i) => {
            window.currentIdx = i;
            const p = window.config.storyPages[i];
            document.getElementById('editorPanel').classList.remove('hidden');
            document.getElementById('editing-page-id').textContent = `#${i}`;
            document.getElementById('pageText').value = p.content || "";
            document.getElementById('pageType').value = p.pageType || "story";
            document.getElementById('pageImage').value = p.pageImage || "";
            document.getElementById('pageBg').value = p.pageBg || "";
            
            window.updateUI();
            window.updateSimulator();
            window.renderPageList();
        };

        window.updateUI = () => {
            const type = document.getElementById('pageType').value;
            document.getElementById('choiceEditor').classList.toggle('hidden', type !== 'choice');
            document.getElementById('passwordInputs').classList.toggle('hidden', type !== 'password');
            if (type === 'choice') renderChoiceEditor();
        };

        window.autoSave = () => {
            const p = window.config.storyPages[window.currentIdx];
            if (p) {
                p.content = document.getElementById('pageText').value;
                p.pageType = document.getElementById('pageType').value;
                p.pageImage = document.getElementById('pageImage').value;
                p.pageBg = document.getElementById('pageBg').value;
                p.password = document.getElementById('passwordVal').value;
            }
            window.config.appTitle = document.getElementById('appTitle').value;
            window.config.globalBg = document.getElementById('globalBg').value;
            localStorage.setItem('KALAND_V14_CONFIG', JSON.stringify(window.config));
            window.updateSimulator();
            window.renderPageList();
        };

        window.addPage = () => {
            window.config.storyPages.push({ id: self.crypto.randomUUID(), content: "Új jelenet...", pageType: "story" });
            window.autoSave();
        };

        window.renderPageList = () => {
            const l = document.getElementById('pageList');
            l.innerHTML = '';
            window.config.storyPages.forEach((p, i) => {
                const d = document.createElement('div');
                d.className = `page-item ${i === window.currentIdx ? 'selected' : ''}`;
                d.dataset.id = p.id;
                d.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden">
                        <i class="fa fa-bars handle"></i>
                        <span class="truncate font-bold text-sm">#${i}: ${p.content.substring(0, 20)}...</span>
                    </div>
                    <button onclick="event.stopPropagation(); window.config.storyPages.splice(${i},1); window.autoSave();"><i class="fa fa-trash text-red-500"></i></button>
                `;
                d.onclick = () => window.loadPage(i);
                l.appendChild(d);
            });
        };

        window.addChoice = () => {
            const p = window.config.storyPages[window.currentIdx];
            if (!p.choices) p.choices = [];
            p.choices.push({ text: "Új lehetőség", targetIdx: window.currentIdx + 1 });
            renderChoiceEditor();
            autoSave();
        };

        window.renderChoiceEditor = () => {
            const p = window.config.storyPages[window.currentIdx];
            const l = document.getElementById('choiceList');
            l.innerHTML = '';
            if (p.choices) p.choices.forEach((c, i) => {
                const d = document.createElement('div');
                d.className = "flex gap-2";
                d.innerHTML = `
                    <input type="text" class="input-style flex-1 text-xs" value="${c.text}" oninput="window.config.storyPages[window.currentIdx].choices[${i}].text=this.value; autoSave()">
                    <input type="number" class="input-style !w-20 text-xs" value="${c.targetIdx}" oninput="window.config.storyPages[window.currentIdx].choices[${i}].targetIdx=parseInt(this.value); autoSave()">
                `;
                l.appendChild(d);
            });
        };

        // --- PLAYER LOGIKA ---
        window.togglePlayerMode = () => {
            const pv = document.getElementById('player-view');
            if (pv.style.display !== 'flex') {
                pv.style.display = 'flex';
                pSimIdx = 0;
                window.pUpdateUI();
            } else {
                pv.style.display = 'none';
            }
        };

        window.pUpdateUI = () => {
            const p = window.config.storyPages[pSimIdx];
            if (!p) return;
            
            document.getElementById('p-bg-layer').src = p.pageBg || window.config.globalBg || "";
            document.getElementById('p-story-text').textContent = p.content;
            
            const ill = document.getElementById('p-page-illustration');
            if(p.pageImage) { ill.src = p.pageImage; ill.classList.remove('hidden'); } else { ill.classList.add('hidden'); }

            const bc = document.getElementById('p-button-container');
            bc.innerHTML = '';

            if (p.pageType === 'choice' && p.choices) {
                p.choices.forEach(c => {
                    const b = document.createElement('button');
                    b.className = "p-action-btn";
                    b.textContent = c.text;
                    b.onclick = () => { pSimIdx = c.targetIdx; window.pUpdateUI(); };
                    bc.appendChild(b);
                });
            } else if (p.pageType === 'password') {
                const inp = document.createElement('input');
                inp.className = "input-style mb-4 text-center text-xl uppercase font-bold p-4";
                inp.placeholder = "KÓD?";
                bc.appendChild(inp);
                const b = document.createElement('button');
                b.className = "p-action-btn";
                b.textContent = "Ellenőrzés";
                b.onclick = () => {
                    if (inp.value.toLowerCase() === p.password.toLowerCase()) {
                        pSimIdx++;
                        window.pUpdateUI();
                    }
                };
                bc.appendChild(b);
            } else {
                const b = document.createElement('button');
                b.className = "p-action-btn";
                b.textContent = "Folytatás";
                b.onclick = () => { pSimIdx++; window.pUpdateUI(); };
                bc.appendChild(b);
            }
        };

        window.pResetGame = () => { pSimIdx = 0; window.pUpdateUI(); };

        window.publishGame = async () => {
            if (!currentUser) return;
            try {
                const gameId = window.config.cloudId || self.crypto.randomUUID();
                window.config.cloudId = gameId;
                const ref = doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', gameId);
                await setDoc(ref, {
                    title: window.config.appTitle,
                    author: currentUser.displayName,
                    authorId: currentUser.uid,
                    config: window.config,
                    updatedAt: new Date().toISOString()
                });
                alert("Játék sikeresen publikálva a Portálra!");
            } catch (e) { alert("Hiba a publikálás során!"); }
        };

        window.updateSimulator = () => {
            const p = window.config.storyPages[window.currentIdx];
            if (!p) return;
            document.getElementById('sim-bg').src = p.pageBg || window.config.globalBg || "";
            document.getElementById('sim-actual-text').textContent = p.content;
            const acts = document.getElementById('sim-actions');
            acts.innerHTML = '<button class="sim-btn">TESZT GOMB</button>';
        };

        window.newGame = () => {
            if (confirm("Biztosan új projektet kezdesz? A mentetlen adatok elvesznek.")) {
                window.config = JSON.parse(JSON.stringify(defaultConfig));
                window.loadPage(0);
            }
        };

        // Init
        window.onload = () => {
            initPortal();
            if (window.config.storyPages.length > 0) window.loadPage(0);
            
            new Sortable(document.getElementById('pageList'), {
                handle: '.handle',
                animation: 150,
                onEnd: () => {
                    const domItems = Array.from(document.getElementById('pageList').children);
                    window.config.storyPages = domItems.map(item => window.config.storyPages.find(p => p.id === item.dataset.id));
                    window.autoSave();
                }
            });
            
            // Kezdeti anonim bejelentkezés, ha nincs bejelentkezve
            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            initAuth();
        };
    </script>
</body>
</html>
