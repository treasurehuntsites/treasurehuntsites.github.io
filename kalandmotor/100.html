<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kaland Játék Stúdió V14.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #22d3ee;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            height: 100dvh;
            font-family: 'Play', sans-serif; 
            background-color: var(--bg-dark); 
            color: #f8fafc; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        
        #studio-view, #community-view { height: 100%; overflow-y: auto; padding: 1rem; padding-bottom: 5rem; }
        @media (min-width: 768px) { #studio-view, #community-view { padding: 2.5rem; } }
        
        /* Alapértelmezett nézet: Portál */
        #studio-view { display: none; }
        #community-view { display: block; }
        
        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 1rem; }

        .input-style { background: #0f172a; color: var(--secondary); border: 1px solid #334155; border-radius: 0.5rem; padding: 0.6rem; outline: none; transition: 0.2s; width: 100%; font-size: 0.875rem; }
        .input-style:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; cursor: pointer; user-select: none; }
        .page-item:hover { background: #2d3748; }
        .page-item.selected { border-color: var(--secondary); background: #4c1d95; box-shadow: 0 0 15px rgba(34, 211, 238, 0.2); }
        .handle { cursor: grab; padding: 5px 15px 5px 5px; color: #64748b; font-size: 0.9rem; }
        .handle:active { cursor: grabbing; }

        /* SIMULATOR */
        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; opacity: 0.6; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 35px; min-height: 220px; display: flex; flex-direction: column; }
        .sim-avatar { position: absolute; top: -40px; left: 10px; width: 65px; height: 65px; border-radius: 50%; border: 3px solid var(--primary); background: #000; z-index: 20; object-fit: cover; display: none; }
        .sim-btn { background: var(--primary); color: white; padding: 10px; border-radius: 0.5rem; font-weight: 700; text-align: center; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; width: 100%; border: none; }
        .sim-btn-secondary { background: #334155; }

        /* PLAYER VIEW */
        #player-view { position: fixed; inset: 0; z-index: 9000; background: #000; display: none; flex-direction: column; height: 100dvh; }
        .p-game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #p-viewport { position: relative; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s ease-in-out; }
        #p-content-layer { position: relative; z-index: 10; margin-top: auto; width: 100%; display: flex; flex-direction: column; }

        .p-dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 4px solid var(--primary); border-radius: 1.5rem 1.5rem 0 0; padding: 25px; padding-top: 45px; min-height: 280px; max-height: 80dvh; display: flex; flex-direction: column; box-shadow: 0 -15px 35px rgba(0,0,0,0.7); }
        .p-avatar-frame { position: absolute; top: -45px; left: 20px; width: 85px; height: 85px; border-radius: 50%; border: 4px solid var(--primary); background: #000; z-index: 20; object-fit: cover; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        #p-story-text { text-align: justify; hyphens: auto; font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 15px; color: #f8fafc; }
        #p-button-container { display: flex; flex-direction: column; gap: 12px; width: 100%; position: relative; }
        
        .p-nav-row { display: flex !important; flex-direction: row !important; gap: 10px; width: 100%; margin-top: 10px; background: transparent !important; }
        .p-action-btn { flex: 1; background: var(--primary); color: white; padding: 16px; border-radius: 0.85rem; font-weight: 700; text-align: center; font-size: 1.05rem; cursor: pointer; text-transform: uppercase; transition: 0.1s; display: flex; align-items: center; justify-content: center; border: none; }
        .p-action-btn:active { transform: scale(0.98); }
        .p-action-btn.btn-secondary { background: #334155; }

        .p-bottom-nav { height: 80px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.4); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .p-nav-item { color: #94a3b8; font-size: 1.6rem; cursor: pointer; border: none; background: transparent; position: relative; width: 25%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: color 0.2s; }
        .p-nav-item.active { color: var(--primary); }
        .p-badge { position: absolute; top: 15px; right: 25%; background: #ef4444; color: white; font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: bold; border: 2px solid #0f172a; }

        /* INVENTORY STYLES */
        #p-inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 150; display: none; overflow-y: auto; }
        .p-item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
        .p-item-card { background: #1e293b; border: 2px solid #334155; border-radius: 1.25rem; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 120px; cursor: default; }
        .p-item-card img { width: 100%; height: auto; object-fit: contain; cursor: zoom-in; max-height: 100px; }
        .p-item-card .text-4xl { font-size: 3.5rem; }

        /* PHONE UI */
        .phone-ui { background: radial-gradient(circle at top, #2c3e50, #000); width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 15% 20px 10% 20px; box-sizing: border-box; text-align: center; font-family: 'Roboto', sans-serif; color: white; }
        .p-call-status { color: #bdc3c7; font-size: 0.9rem; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 5px; }
        .p-call-timer { font-size: 1.2rem; font-weight: 400; opacity: 0.9; margin-top: 8px; font-variant-numeric: tabular-nums; }
        .p-call-name { font-size: 2.8rem; font-weight: 300; margin-top: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .p-call-controls-wrapper { display: flex; justify-content: space-around; align-items: flex-end; width: 100%; height: 350px; margin-bottom: 20px; }
        .slide-container-v { position: relative; width: 76px; height: 260px; background: transparent; border-radius: 38px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 6px; box-sizing: border-box; border: none; }
        .slide-handle-v { width: 64px; height: 64px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; cursor: grab; transition: transform 0.1s linear; touch-action: none; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .slide-handle-v.accept { background: #2ecc71; }
        .slide-handle-v.decline { background: #e74c3c; }
        .pulse-soft { animation: pulse-soft-anim 2s infinite; }
        @keyframes pulse-soft-anim { 0% { box-shadow: 0 0 0 0px rgba(46, 204, 113, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0px rgba(46, 204, 113, 0); } }
        .p-active-ui-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; max-width: 320px; margin: 0 auto; opacity: 0.8; }
        .p-active-icon-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 10px; color: #ecf0f1; }
        .p-active-icon-btn i { width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 50px; }

        @keyframes fadeInOutSplash { 0% { opacity: 0; transform: scale(0.9); } 20% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
        .splash-text-anim { font-family: 'Special Elite', cursive; animation: fadeInOutSplash 10s ease-in-out forwards; text-transform: uppercase; letter-spacing: 0.2em; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 20000; display: none; align-items: center; justify-content: center; }
        #p-zoomed-img { max-width: 95%; max-height: 95%; object-fit: contain; transition: transform 0.05s ease-out; touch-action: none; user-select: none; will-change: transform; }
    </style>
</head>
<body>

    <div id="save-indicator" class="fixed bottom-6 right-6 bg-emerald-500 text-white px-5 py-2 rounded-full font-bold text-xs z-[10000] hidden">
        <i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...
    </div>

    <!-- EGYSÉGES MEGERŐSÍTŐ ABLAK -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="glass-card p-8 max-sm w-full mx-4 text-center border-red-500/50">
            <div id="confirm-icon-box" class="w-16 h-16 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl">
                <i id="confirm-icon" class="fa fa-trash-can"></i>
            </div>
            <h2 id="confirm-title" class="text-xl font-bold mb-2">Megerősítés</h2>
            <p id="confirm-desc" class="text-slate-400 text-sm mb-8">Biztos vagy benne?</p>
            <div class="flex gap-4">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-slate-700 rounded-xl font-bold text-xs uppercase">Mégse</button>
                <button id="confirm-action-btn" class="flex-1 py-3 bg-red-600 rounded-xl font-bold text-xs uppercase">Végrehajtás</button>
            </div>
        </div>
    </div>

    <!-- HINT MODAL -->
    <div id="hint-modal" class="modal-overlay">
        <div class="glass-card p-8 max-w-sm w-full mx-4 text-center">
            <div id="hint-confirm-view">
                <h3 class="text-xl font-bold mb-4 uppercase text-cyan-400">Segítség</h3>
                <p class="text-slate-400 mb-8 text-sm">Megnézed a súgót?</p>
                <div class="flex gap-4">
                    <button onclick="closeHintModal()" class="flex-1 py-3 bg-slate-700 rounded-xl font-bold text-xs uppercase">Mégse</button>
                    <button id="hint-show-btn" class="flex-1 py-3 bg-purple-600 rounded-xl font-bold text-xs uppercase">Igen</button>
                </div>
            </div>
            <div id="hint-display-view" class="hidden">
                <h3 class="text-xl font-bold mb-4 uppercase text-purple-400">Súgó</h3>
                <p id="hint-text" class="text-white text-lg font-bold mb-8 italic"></p>
                <button onclick="closeHintModal()" class="w-full py-3 bg-cyan-600 rounded-xl font-bold text-xs uppercase">Értem</button>
            </div>
        </div>
    </div>

    <!-- STUDIO VIEW -->
    <div id="studio-view">
        <div class="max-w-7xl mx-auto flex justify-between items-center pt-4 px-4 md:px-0 mb-6">
            <button onclick="switchView('community')" class="bg-slate-800 text-slate-300 px-6 py-2.5 rounded-xl font-bold text-[10px] uppercase border border-slate-700 hover:border-purple-500">Vissza a Portálra</button>
            <div id="auth-container-studio" class="flex items-center gap-2 bg-slate-800 p-1 rounded-full border border-slate-700">
                <img id="user-photo-studio" src="" class="w-8 h-8 rounded-full">
                <button onclick="window.logout()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-red-400"><i class="fa fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div class="max-w-7xl mx-auto">
            <header class="mb-10 flex flex-col md:flex-row justify-center items-center gap-4">
                <button onclick="togglePlayerMode()" class="bg-purple-600 text-white px-10 py-3.5 rounded-xl font-bold text-[10px] uppercase w-full md:w-auto"><i class="fa fa-play mr-2"></i> Teszt indítása</button>
                <button onclick="publishGame()" class="bg-emerald-600 text-white px-10 py-3.5 rounded-xl font-bold text-[10px] uppercase w-full md:w-auto">Publikálás</button>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-8 space-y-6">
                    <!-- Basic Config -->
                    <div class="glass-card p-6">
                        <div class="flex justify-between items-end mb-3">
                            <label class="text-purple-400 font-bold uppercase text-[10px]">Alapbeállítások</label>
                            <button onclick="newGame()" class="w-8 h-8 bg-slate-700 text-white rounded-lg flex items-center justify-center"><i class="fa fa-plus"></i></button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-3">
                                <input type="text" id="appTitle" class="input-style" placeholder="Cím" oninput="autoSave()">
                                <input type="url" id="globalBg" class="input-style" placeholder="Háttér URL" oninput="autoSave()">
                                <input type="url" id="initialMapLink" class="input-style" placeholder="Térkép Link" oninput="autoSave()">
                            </div>
                            <div class="space-y-3">
                                <div class="flex justify-between items-center"><label class="text-slate-500 font-bold uppercase text-[9px]">Avatarok</label><button onclick="addAvatar()" class="text-cyan-400 text-[9px] font-bold">+ ÚJ</button></div>
                                <div id="avatarList" class="space-y-2 max-h-60 overflow-y-auto"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Page List -->
                    <div class="glass-card p-6">
                        <label class="text-purple-400 font-bold uppercase text-[10px]">Jelenetek</label>
                        <div id="pageList" class="mt-4 max-h-60 overflow-y-auto pr-2"></div>
                        <button onclick="addPage()" class="mt-4 bg-purple-600 text-white px-4 py-2 rounded-lg text-[10px] font-bold">+ ÚJ OLDAL</button>
                    </div>

                    <!-- EDITOR PANEL -->
                    <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                            <div class="flex flex-col">
                                <label class="text-purple-400 font-bold uppercase text-[10px]">Szerkesztés</label>
                                <h2 class="text-xl font-bold text-white">Jelenet <span id="editing-page-id" class="text-purple-500">#0</span></h2>
                            </div>
                            <select id="pageType" class="input-style !w-44" onchange="updateUI(); autoSave();">
                                <option value="story">Leírás</option>
                                <option value="choice">Választás</option>
                                <option value="password">Kódzár</option>
                                <option value="qr">QR Kód</option>
                                <option value="gps">GPS Pont</option>
                                <option value="splash">Átvezetés</option>
                                <option value="call">Hívás</option>
                            </select>
                        </div>

                        <div class="space-y-2">
                            <div class="flex items-center justify-between"><label class="text-purple-400 font-bold uppercase text-[10px]">Szöveg</label><div id="avatarQuickSelect" class="flex gap-2"></div></div>
                            <textarea id="pageText" rows="5" class="input-style text-base" placeholder="Történet..." oninput="autoSave()"></textarea>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="url" id="pageImage" class="input-style text-xs" placeholder="Kép URL (illusztráció)" oninput="autoSave()">
                            <input type="url" id="pageBg" class="input-style text-xs" placeholder="Egyedi Háttér URL" oninput="autoSave()">
                        </div>

                        <!-- Rewards & Visibility -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-4 border-t border-slate-700">
                            <div>
                                <div class="flex justify-between items-center mb-2"><label class="text-purple-400 font-bold uppercase text-[10px]">Tárgyak itt</label><button onclick="addReward()" class="text-cyan-400 text-[10px] font-bold">+ AD</button></div>
                                <div id="rewardsList" class="space-y-3"></div>
                            </div>
                            <div>
                                <label class="text-purple-400 font-bold uppercase text-[10px] block mb-2">Tárgyak elrejtése</label>
                                <div id="visibilityToggles" class="flex flex-wrap gap-2"></div>
                            </div>
                        </div>

                        <!-- Context Inputs -->
                        <div id="passwordInputs" class="hidden space-y-3 pt-4 border-t border-slate-700">
                            <input type="text" id="passwordVal" class="input-style" placeholder="Helyes jelszó" oninput="autoSave()">
                            <textarea id="pageHints" class="input-style text-xs" placeholder="Súgók (soronként egy)" oninput="autoSave()"></textarea>
                        </div>
                        <div id="qrInputs" class="hidden pt-4 border-t border-slate-700">
                            <input type="text" id="qrCodeVal" class="input-style" placeholder="Várt QR kód szövege" oninput="autoSave()">
                        </div>
                        <div id="callInputs" class="hidden grid grid-cols-2 gap-4 pt-4 border-t border-slate-700">
                            <input type="url" id="ringtoneUrl" class="input-style text-xs" placeholder="Csengőhang URL" oninput="autoSave()">
                            <input type="url" id="voiceUrl" class="input-style text-xs" placeholder="Hangfelvétel URL" oninput="autoSave()">
                        </div>
                        <div id="gpsInputs" class="hidden grid grid-cols-1 gap-4 pt-4 border-t border-slate-700">
                            <div class="grid grid-cols-2 gap-4"><input type="number" id="targetLat" step="any" class="input-style" placeholder="Szélesség" oninput="autoSave()"><input type="number" id="targetLng" step="any" class="input-style" placeholder="Hosszúság" oninput="autoSave()"></div>
                            <input type="url" id="targetUrl" class="input-style text-xs" placeholder="Külső link GPS érkezéskor" oninput="autoSave()">
                        </div>
                        <div id="choiceEditor" class="hidden space-y-3 pt-4 border-t border-slate-700">
                            <label class="text-purple-400 font-bold uppercase text-[10px]">Választások</label>
                            <div id="choiceList" class="space-y-2"></div>
                            <button onclick="addChoice()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ OPCIÓ</button>
                        </div>

                        <div class="pt-4 border-t border-slate-700 space-y-3">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="number" id="prevIdx" class="input-style" placeholder="Előző oldal #" oninput="autoSave()">
                                <input type="number" id="nextIdx" class="input-style" placeholder="Következő oldal #" oninput="autoSave()">
                            </div>
                            <input type="url" id="externalUrl" class="input-style text-xs" placeholder="Külső link (Tovább gombhoz)" oninput="autoSave()">
                        </div>
                    </div>
                    
                    <div class="flex justify-center gap-4 mt-12 pb-10">
                        <button onclick="importGame()" class="bg-slate-800 text-cyan-400 px-6 py-2.5 rounded-xl font-bold text-[10px] border border-cyan-400/30">Import</button>
                        <button onclick="exportGame()" class="bg-slate-800 text-cyan-400 px-6 py-2.5 rounded-xl font-bold text-[10px] border border-cyan-400/30">Export</button>
                    </div>
                </div>

                <!-- SIMULATOR -->
                <div class="lg:col-span-4 hidden lg:flex justify-center">
                    <div class="sim-container">
                        <div id="sim-viewport">
                            <img id="sim-bg" src="">
                            <div id="sim-content">
                                <div class="sim-box">
                                    <img id="sim-avatar" class="sim-avatar" src="">
                                    <div class="overflow-y-auto flex-grow"><div id="sim-actual-text" style="font-size: 16px; font-weight: 700;"></div><div id="sim-gps-monitor" class="hidden text-center p-3 bg-slate-900 rounded-xl mt-4 border border-cyan-500/30"><div class="text-[9px] text-cyan-500 font-bold">Távolság: <span id="sim-distance-val">...</span> m</div></div></div>
                                    <div id="sim-actions" class="mt-4"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- COMMUNITY / HOME VIEW -->
    <div id="community-view">
        <div class="max-w-7xl mx-auto pb-20">
            <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div><h1 class="text-3xl md:text-5xl font-bold uppercase text-white">Portál 🌐</h1><p class="text-emerald-400 text-xs font-bold uppercase">Fedezd fel a közösség kalandjait</p></div>
                <div class="flex items-center gap-4">
                    <button id="community-login-btn" onclick="window.login()" class="bg-white text-black px-8 py-3 rounded-2xl font-bold text-xs uppercase shadow-lg">Bejelentkezés</button>
                    <button id="community-studio-btn" onclick="switchView('studio')" class="hidden bg-purple-600 text-white px-8 py-4 rounded-2xl font-bold text-xs uppercase shadow-lg">Saját Stúdió</button>
                    <div id="community-user-info" class="hidden flex items-center gap-2 bg-slate-800 p-1 rounded-full border border-slate-700"><img id="community-user-photo" src="" class="w-10 h-10 rounded-full"><button onclick="window.logout()" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-red-400"><i class="fa fa-sign-out-alt"></i></button></div>
                </div>
            </header>
            <div id="community-game-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </div>

    <!-- PLAYER VIEW -->
    <div id="player-view">
        <!-- QR -->
        <div id="p-qr-layer" class="hidden absolute inset-0 bg-black z-[10000] flex flex-col items-center justify-center"><div id="p-qr-reader" class="w-64 h-64 border-2 border-cyan-400 rounded-3xl overflow-hidden"></div><button onclick="pStopQR()" class="mt-8 bg-red-600 text-white px-10 py-4 rounded-xl font-bold uppercase">Mégse</button></div>
        <!-- Splash -->
        <div id="p-splash-screen" class="absolute inset-0 bg-black z-[5000] hidden flex items-center justify-center"><div id="p-splash-text" class="text-white text-center p-10 splash-text-anim text-4xl"></div></div>
        <!-- Call -->
        <div id="p-call-screen" class="absolute inset-0 z-[5500] hidden"><div class="phone-ui"><div class="flex flex-col items-center pt-10"><p class="p-call-status" id="p-call-status-label">BEJÖVŐ HÍVÁS</p><h1 id="p-call-name" class="p-call-name">...</h1><div id="p-call-timer" class="p-call-timer">00:00</div></div><div id="p-call-controls" class="p-call-controls-wrapper"><div class="slide-container-v"><div class="slide-handle-v decline" id="p-handle-decline"><i class="fa fa-phone" style="transform: rotate(135deg);"></i></div></div><div class="slide-container-v"><div class="slide-handle-v accept pulse-soft" id="p-handle-accept"><i class="fa fa-phone"></i></div></div></div><div id="p-call-active-controls" class="hidden w-full pb-10 flex flex-col items-center gap-20"><div class="p-active-ui-buttons"><div class="p-active-icon-btn"><i class="fa fa-microphone-slash"></i><span>Némítás</span></div><div class="p-active-icon-btn"><i class="fa fa-th"></i><span>Billentyűzet</span></div><div class="p-active-icon-btn"><i class="fa fa-volume-up"></i><span>Hangszóró</span></div></div><button onclick="pEndCall()" class="w-20 h-20 bg-red-600 rounded-full flex items-center justify-center"><i class="fa fa-phone text-white text-3xl" style="transform: rotate(135deg);"></i></button></div></div></div>
        <!-- Image Zoom -->
        <div id="p-image-zoom" class="modal-overlay" onclick="this.style.display='none'"><img id="p-zoomed-img" src=""></div>

        <div class="p-game-wrapper">
            <div id="p-viewport">
                <img id="p-bg-layer" src="" class="absolute inset-0 w-full h-full object-cover">
                <div id="p-inventory-overlay" onclick="pToggleInventory()"><div class="max-w-xl mx-auto h-full bg-slate-900/40" onclick="event.stopPropagation()"><h2 class="text-center text-cyan-400 font-bold uppercase text-xs opacity-60 pt-6 mb-4 tracking-widest">Hátizsák</h2><div id="p-item-list" class="p-item-grid pb-20"></div></div></div>
                <div id="p-content-layer"><div class="p-dialog-box"><img id="p-avatar-img" class="p-avatar-frame" src=""><div id="p-scroll-area" class="overflow-y-auto flex-grow mb-4"><img id="p-page-illustration" class="w-full rounded-2xl mb-6 hidden" src=""><div id="p-story-text"></div><div id="p-gps-monitor" class="hidden text-center p-6 bg-slate-900/80 rounded-3xl mt-4 border border-cyan-500/40"><div class="text-4xl font-bold text-white"><span id="p-distance-val">...</span> m</div></div></div><div id="p-button-container"></div></div></div>
            </div>
            <div class="p-bottom-nav">
                <button class="p-nav-item active" onclick="if(window.config.initialMapLink) window.open(window.config.initialMapLink,'_blank')"><i class="fa fa-map-marked-alt text-2xl"></i></button>
                <button class="p-nav-item" onclick="pToggleInventory()"><i class="fa fa-briefcase text-2xl"></i><div id="p-inv-badge" class="p-badge hidden">0</div></button>
                <button class="p-nav-item" onclick="pResetGame()"><i class="fa fa-rotate-right text-2xl"></i></button>
                <button class="p-nav-item" onclick="toggleFullScreen()"><i class="fa fa-expand text-2xl"></i></button>
            </div>
        </div>
    </div>

    <audio id="p-ringtone-audio" loop></audio>
    <audio id="p-call-voice-audio"></audio>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signInAnonymously, signInWithCustomToken, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const userFallbackConfig = { apiKey: "AIzaSyCfVce17Yye6jyvpSSoW6jlh3ei7T0N618", authDomain: "kalandmotor.firebaseapp.com", projectId: "kalandmotor", storageBucket: "kalandmotor.firebasestorage.app", messagingSenderId: "108860908140", appId: "1:108860908140:web:5fbec83f4ae7b51487ee49" };
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : userFallbackConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kalandmotor-v13';

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);
        const provider = new GoogleAuthProvider();

        const defaultConfig = {
            appTitle: "A Város Titka",
            globalBg: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?q=80&w=2000",
            initialMapLink: "",
            avatars: [{ id: 'A', name: 'Mesélő', url: '', color: '#8b5cf6' }],
            storyPages: [{ id: self.crypto.randomUUID(), content: "Üdvözöllek! §A", pageType: "story", rewards: [], hiddenItems: [], externalUrl: "" }]
        };

        window.config = JSON.parse(localStorage.getItem('KALAND_STUDIO_V13')) || defaultConfig;
        
        let pSimIdx = 0, pInventory = [], pQrScanner = null, splashTimer = null, userPos = null, lastAutoGpsIdx = -1, currentUser = null;
        let cloudSaveDebounce = null;
        let pCallTimeSeconds = 0, pCallTimerInterval = null;

        // AUTH & VIEW SWITCH
        window.switchView = (v) => {
            if (v === 'studio' && (!currentUser || currentUser.isAnonymous)) {
                alert("A Stúdióhoz bejelentkezés kell!"); return;
            }
            document.getElementById('studio-view').style.display = v === 'studio' ? 'block' : 'none';
            document.getElementById('community-view').style.display = v === 'community' ? 'block' : 'none';
            if(v==='community') window.initCommunitySync();
            if(v==='studio') window.refreshUI();
        };

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const isLoggedIn = user && !user.isAnonymous;
            document.getElementById('community-login-btn').classList.toggle('hidden', isLoggedIn);
            document.getElementById('community-studio-btn').classList.toggle('hidden', !isLoggedIn);
            document.getElementById('community-user-info').classList.toggle('hidden', !isLoggedIn);
            if (isLoggedIn) {
                document.getElementById('community-user-photo').src = user.photoURL;
                document.getElementById('user-photo-studio').src = user.photoURL;
                const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'userSaves', 'latest');
                const snap = await getDoc(ref);
                if (snap.exists()) { window.config = snap.data().config; if (document.getElementById('studio-view').style.display === 'block') window.refreshUI(); }
            } else {
                if (document.getElementById('studio-view').style.display === 'block') window.switchView('community');
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => location.reload());

        // HELPERS
        const getPageIdxById = (id) => { if (!id) return null; const idx = window.config.storyPages.findIndex(p => p.id === id); return idx === -1 ? null : idx; };
        const getPageIdByIdx = (idx) => { if (idx === "" || idx === null || idx === undefined) return null; const page = window.config.storyPages[parseInt(idx)]; return page ? page.id : null; };
        window.getPageIdxById = getPageIdxById; window.getPageIdByIdx = getPageIdByIdx;

        // GPS
        function getDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return 999999;
            const R = 6371e3; const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => { userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude }; updateGpsDisplays(); }, null, { enableHighAccuracy: true });
        }

        function updateGpsDisplays() {
            if (!userPos) return;
            const simP = window.config.storyPages[window.currentIdx];
            if (simP && simP.pageType === 'gps' && document.getElementById('sim-distance-val')) document.getElementById('sim-distance-val').textContent = getDistance(userPos.lat, userPos.lng, simP.targetLat, simP.targetLng);
            const pP = window.config.storyPages[pSimIdx];
            if (pP && pP.pageType === 'gps') {
                const dist = getDistance(userPos.lat, userPos.lng, pP.targetLat, pP.targetLng);
                if (document.getElementById('p-distance-val')) document.getElementById('p-distance-val').textContent = dist;
                if (dist <= 20 && lastAutoGpsIdx !== pSimIdx) {
                    lastAutoGpsIdx = pSimIdx;
                    setTimeout(() => { if (pP.targetUrl) window.open(pP.targetUrl, '_blank'); const nextIdx = getPageIdxById(pP.nextPageId); pSimIdx = nextIdx !== null ? nextIdx : pSimIdx + 1; window.pUpdateUI(); }, 1200);
                }
            }
        }

        // SAVE & EDITOR LOGIC
        window.saveGame = async () => {
            if (!currentUser || currentUser.isAnonymous) return;
            document.getElementById('save-indicator').classList.remove('hidden');
            try {
                const ref = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'userSaves', 'latest');
                await setDoc(ref, { config: window.config, updatedAt: new Date().toISOString() });
            } catch (e) {}
            setTimeout(() => document.getElementById('save-indicator').classList.add('hidden'), 1000);
        };

        window.autoSave = () => {
            const p = window.config.storyPages[window.currentIdx];
            if (p) {
                p.content = document.getElementById('pageText').value;
                p.pageType = document.getElementById('pageType').value;
                p.pageImage = document.getElementById('pageImage').value;
                p.pageBg = document.getElementById('pageBg').value;
                p.nextPageId = getPageIdByIdx(document.getElementById('nextIdx').value);
                p.prevPageId = getPageIdByIdx(document.getElementById('prevIdx').value);
                p.externalUrl = document.getElementById('externalUrl').value;
                p.password = document.getElementById('passwordVal').value;
                p.hints = document.getElementById('pageHints').value;
                p.qrCode = document.getElementById('qrCodeVal').value;
                p.targetLat = document.getElementById('targetLat').value;
                p.targetLng = document.getElementById('targetLng').value;
                p.targetUrl = document.getElementById('targetUrl').value;
                p.ringtoneUrl = document.getElementById('ringtoneUrl').value;
                p.voiceUrl = document.getElementById('voiceUrl').value;
            }
            window.config.appTitle = document.getElementById('appTitle').value;
            window.config.globalBg = document.getElementById('globalBg').value;
            window.config.initialMapLink = document.getElementById('initialMapLink').value;
            localStorage.setItem('KALAND_STUDIO_V13', JSON.stringify(window.config));
            window.updateSimulator(); window.renderPageList();
            clearTimeout(cloudSaveDebounce); cloudSaveDebounce = setTimeout(window.saveGame, 3000);
        };

        window.loadPage = (i) => {
            window.currentIdx = i; const p = window.config.storyPages[i]; if (!p) return;
            document.getElementById('editorPanel').classList.remove('hidden');
            document.getElementById('editing-page-id').textContent = `#${i}`;
            document.getElementById('pageText').value = p.content || "";
            document.getElementById('pageType').value = p.pageType || 'story';
            document.getElementById('pageImage').value = p.pageImage || "";
            document.getElementById('pageBg').value = p.pageBg || "";
            document.getElementById('nextIdx').value = getPageIdxById(p.nextPageId) ?? "";
            document.getElementById('prevIdx').value = getPageIdxById(p.prevPageId) ?? "";
            document.getElementById('externalUrl').value = p.externalUrl || "";
            document.getElementById('passwordVal').value = p.password || "";
            document.getElementById('pageHints').value = p.hints || "";
            document.getElementById('qrCodeVal').value = p.qrCode || "";
            document.getElementById('targetLat').value = p.targetLat || "";
            document.getElementById('targetLng').value = p.targetLng || "";
            document.getElementById('targetUrl').value = p.targetUrl || "";
            document.getElementById('ringtoneUrl').value = p.ringtoneUrl || "";
            document.getElementById('voiceUrl').value = p.voiceUrl || "";
            window.updateUI(); window.updateSimulator(); window.renderPageList(); window.renderRewardsEditor(); window.renderVisibilityToggles();
        };

        window.updateUI = () => {
            const t = document.getElementById('pageType').value;
            document.getElementById('passwordInputs').classList.toggle('hidden', t !== 'password');
            document.getElementById('qrInputs').classList.toggle('hidden', t !== 'qr');
            document.getElementById('gpsInputs').classList.toggle('hidden', t !== 'gps');
            document.getElementById('callInputs').classList.toggle('hidden', t !== 'call');
            document.getElementById('choiceEditor').classList.toggle('hidden', t !== 'choice');
            if (t === 'choice') window.renderChoiceEditor();
        };

        window.refreshUI = () => {
            document.getElementById('appTitle').value = window.config.appTitle || "";
            document.getElementById('globalBg').value = window.config.globalBg || "";
            document.getElementById('initialMapLink').value = window.config.initialMapLink || "";
            window.renderPageList(); window.renderAvatarAdmin();
            window.loadPage(Math.min(window.currentIdx, window.config.storyPages.length - 1));
        };

        // RENDERERS
        window.renderPageList = () => {
            const l = document.getElementById('pageList'); l.innerHTML = '';
            window.config.storyPages.forEach((p, i) => {
                const d = document.createElement('div'); d.className = `page-item ${i === window.currentIdx ? 'selected' : ''}`; d.dataset.id = p.id;
                d.innerHTML = `<div class="flex items-center gap-2 truncate font-bold text-sm"><i class="fa fa-bars handle"></i>#${i}: ${p.content.substring(0,20)}</div><div class="flex gap-2"><button onclick="event.stopPropagation(); window.copyPage(${i})"><i class="fa fa-copy"></i></button><button onclick="event.stopPropagation(); window.openConfirmModal('Törlés?','Biztos törlöd?','trash',()=>{window.config.storyPages.splice(${i},1);window.autoSave();})"><i class="fa fa-trash"></i></button></div>`;
                d.onclick = () => window.loadPage(i); l.appendChild(d);
            });
        };

        window.renderChoiceEditor = () => {
            const p = window.config.storyPages[window.currentIdx]; const l = document.getElementById('choiceList'); l.innerHTML = '';
            if (p.choices) p.choices.forEach((c, i) => {
                const d = document.createElement('div'); d.className = "grid grid-cols-1 md:grid-cols-4 gap-2 bg-slate-800/20 p-2 rounded-lg";
                d.innerHTML = `<input type="text" class="input-style text-xs" value="${c.text}" oninput="window.config.storyPages[window.currentIdx].choices[${i}].text=this.value;window.autoSave()" placeholder="Gomb"><input type="number" class="input-style text-xs" value="${getPageIdxById(c.targetId) ?? ''}" placeholder="Cél #" oninput="window.config.storyPages[window.currentIdx].choices[${i}].targetId=getPageIdByIdx(this.value);window.autoSave()"><input type="text" class="input-style text-[10px]" value="${c.req || ''}" placeholder="Tárgy kell" oninput="window.config.storyPages[window.currentIdx].choices[${i}].req=this.value;window.autoSave()"><button onclick="window.config.storyPages[window.currentIdx].choices.splice(${i},1);window.renderChoiceEditor();window.autoSave()"><i class="fa fa-trash-can"></i></button>`;
                l.appendChild(d);
            });
        };

        window.renderRewardsEditor = () => {
            const p = window.config.storyPages[window.currentIdx]; const l = document.getElementById('rewardsList'); l.innerHTML = ''; if(!p.rewards) p.rewards = [];
            p.rewards.forEach((r, i) => {
                const d = document.createElement('div'); d.className = "flex gap-2 items-center";
                d.innerHTML = `<input type="text" class="input-style !p-1 text-[10px]" value="${r.name}" oninput="window.config.storyPages[window.currentIdx].rewards[${i}].name=this.value;window.autoSave();window.renderVisibilityToggles();"><input type="text" class="input-style !w-10 !p-1 text-center" value="${r.icon}" oninput="window.config.storyPages[window.currentIdx].rewards[${i}].icon=this.value;window.autoSave()"><button onclick="window.config.storyPages[window.currentIdx].rewards.splice(${i},1);window.renderRewardsEditor();window.autoSave();window.renderVisibilityToggles();"><i class="fa fa-times text-red-500"></i></button>`;
                l.appendChild(d);
            });
        };

        window.renderVisibilityToggles = () => {
            const container = document.getElementById('visibilityToggles'); container.innerHTML = ''; const items = new Set();
            window.config.storyPages.forEach(p => { if(p.rewards) p.rewards.forEach(r => { if(r.name) items.add(r.name); }); });
            const p = window.config.storyPages[window.currentIdx]; if(!p.hiddenItems) p.hiddenItems = [];
            Array.from(items).forEach(name => {
                const hide = p.hiddenItems.includes(name);
                const btn = document.createElement('button'); btn.className = `px-2 py-1 rounded-full text-[9px] font-bold border ${hide ? 'bg-red-500/20 border-red-500' : 'bg-emerald-500/20 border-emerald-500'}`;
                btn.innerHTML = `<i class="fa ${hide ? 'fa-eye-slash' : 'fa-eye'} mr-1"></i> ${name}`;
                btn.onclick = () => { if(hide) p.hiddenItems = p.hiddenItems.filter(n => n !== name); else p.hiddenItems.push(name); window.autoSave(); window.renderVisibilityToggles(); };
                container.appendChild(btn);
            });
        };

        window.renderAvatarAdmin = () => {
            const l = document.getElementById('avatarList'); l.innerHTML = '';
            window.config.avatars.forEach((av, i) => {
                const d = document.createElement('div'); d.className = "p-2 bg-slate-800/60 rounded mb-2 border border-slate-700/50";
                d.innerHTML = `<div class="flex gap-1 mb-1"><input type="text" class="input-style !w-10 text-center" value="${av.id}" oninput="window.config.avatars[${i}].id=this.value.toUpperCase();window.autoSave()"><input type="text" class="input-style flex-1" value="${av.name}" oninput="window.config.avatars[${i}].name=this.value;window.autoSave()"><button onclick="window.config.avatars.splice(${i},1);window.renderAvatarAdmin();window.autoSave()"><i class="fa fa-trash"></i></button></div><input type="url" class="input-style text-[9px]" value="${av.url||''}" placeholder="Kép URL" oninput="window.config.avatars[${i}].url=this.value;window.autoSave()">`;
                l.appendChild(d);
            });
            const qs = document.getElementById('avatarQuickSelect'); qs.innerHTML = '';
            window.config.avatars.forEach(av => {
                const b = document.createElement('button'); b.className = "w-6 h-6 rounded-full border border-slate-600 font-bold text-[8px] flex items-center justify-center"; b.textContent = av.id; b.style.color = av.color || 'white';
                b.onclick = () => { const t = document.getElementById('pageText'); t.value += ` §${av.id} `; window.autoSave(); };
                qs.appendChild(b);
            });
        };

        // SIMULATOR UPDATE
        window.updateSimulator = () => {
            const p = window.config.storyPages[window.currentIdx]; if (!p) return;
            document.getElementById('sim-bg').src = p.pageBg || window.config.globalBg || "";
            let text = p.content || ""; const av = document.getElementById('sim-avatar'); av.style.display = 'none';
            window.config.avatars.forEach(a => { if (text.includes(`§${a.id}`)) { av.src = a.url || ""; av.style.display = 'block'; text = text.replace(new RegExp(`§${a.id}`, 'g'), `<span style="color:${a.color || '#fff'}">${a.name}:</span>`); } });
            document.getElementById('sim-actual-text').innerHTML = text;
            const acts = document.getElementById('sim-actions'); acts.innerHTML = '';
            const bB = document.createElement('button'); bB.className="sim-btn sim-btn-secondary flex-1"; bB.textContent="Vissza"; bB.onclick=()=>{ const idx = getPageIdxById(p.prevPageId) ?? Math.max(0, window.currentIdx-1); window.loadPage(idx); };
            const bN = document.createElement('button'); bN.className="sim-btn flex-1"; bN.textContent="Tovább"; bN.onclick=()=>{ const idx = getPageIdxById(p.nextPageId); if(idx!==null) window.loadPage(idx); else window.loadPage(window.currentIdx + 1); };
            const row = document.createElement('div'); row.className="flex gap-2"; row.append(bB, bN); acts.appendChild(row);
        };

        // PLAYER
        window.pUpdateUI = () => {
            const p = window.config.storyPages[pSimIdx]; if (!p) return;
            pStopAllAudio(); if(splashTimer) clearTimeout(splashTimer);
            document.getElementById('p-splash-screen').classList.add('hidden');
            document.getElementById('p-call-screen').classList.add('hidden');
            document.getElementById('p-content-layer').classList.remove('hidden');

            if(p.rewards) p.rewards.forEach(r => { if(r.name && !pInventory.find(i=>i.name===r.name)) pInventory.push({...r, seen: false}); });
            window.pUpdateBadge();

            if (p.pageType === 'splash') {
                document.getElementById('p-splash-screen').classList.remove('hidden'); document.getElementById('p-content-layer').classList.add('hidden');
                document.getElementById('p-splash-text').textContent = p.content || "";
                splashTimer = setTimeout(() => { pSimIdx = getPageIdxById(p.nextPageId) ?? pSimIdx + 1; window.pUpdateUI(); }, 10500);
                return;
            }

            if (p.pageType === 'call') {
                document.getElementById('p-call-screen').classList.remove('hidden'); document.getElementById('p-content-layer').classList.add('hidden');
                document.getElementById('p-call-name').textContent = p.content || "Ismeretlen";
                document.getElementById('p-call-status-label').textContent = "BEJÖVŐ HÍVÁS";
                document.getElementById('p-call-timer').style.display = 'none';
                document.getElementById('p-call-controls').classList.remove('hidden');
                document.getElementById('p-call-active-controls').classList.add('hidden');
                const ring = document.getElementById('p-ringtone-audio'); ring.src = p.ringtoneUrl || "https://cdn.pixabay.com/audio/2022/03/15/audio_73663a7587.mp3"; ring.play().catch(()=>{});
                return;
            }

            document.getElementById('p-bg-layer').src = p.pageBg || window.config.globalBg || "";
            let text = p.content || ""; const avImg = document.getElementById('p-avatar-img'); avImg.style.display = 'none';
            window.config.avatars.forEach(av => { if (text.includes(`§${av.id}`)) { avImg.src = av.url || ""; avImg.style.display = 'block'; text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color || '#fff'}">${av.name}:</span>`); } });
            document.getElementById('p-story-text').innerHTML = text;
            const ill = document.getElementById('p-page-illustration'); if(p.pageImage){ill.src=p.pageImage; ill.classList.remove('hidden');}else ill.classList.add('hidden');

            const bc = document.getElementById('p-button-container'); bc.innerHTML = '';
            if (p.pageType === 'password') {
                const inp = document.createElement('input'); inp.className = "input-style !p-4 !text-2xl text-center font-bold mb-4"; inp.placeholder = "KÓD..."; bc.appendChild(inp);
                const sb = document.createElement('button'); sb.className = "p-action-btn"; sb.textContent = "NYITÁS";
                sb.onclick = () => { if(inp.value.trim().toLowerCase() === (p.password||"").toLowerCase()) { pSimIdx = getPageIdxById(p.nextPageId) ?? pSimIdx + 1; window.pUpdateUI(); } }; bc.appendChild(sb);
            } else if (p.pageType === 'qr') {
                const qb = document.createElement('button'); qb.className = "p-action-btn"; qb.textContent = "QR BEOLVASÁS"; qb.onclick = window.pStartQR; bc.appendChild(qb);
            } else if (p.pageType === 'choice' && p.choices) {
                p.choices.forEach(c => { if(c.req && !pInventory.find(i=>i.name===c.req)) return; const b = document.createElement('button'); b.className = "p-action-btn"; b.textContent = c.text; b.onclick = () => { pSimIdx = getPageIdxById(c.targetId) ?? pSimIdx; window.pUpdateUI(); }; bc.appendChild(b); });
            }

            const nr = document.createElement('div'); nr.className = "p-nav-row";
            const bB = document.createElement('button'); bB.className = "p-action-btn btn-secondary"; bB.textContent = "Vissza";
            bB.onclick = () => { pSimIdx = getPageIdxById(p.prevPageId) ?? Math.max(0, pSimIdx - 1); window.pUpdateUI(); };
            nr.append(bB);
            if (!['password','choice','qr','gps'].includes(p.pageType)) {
                const bN = document.createElement('button'); bN.className = "p-action-btn"; bN.textContent = "Tovább";
                bN.onclick = () => { pSimIdx = getPageIdxById(p.nextPageId) ?? pSimIdx + 1; window.pUpdateUI(); };
                nr.append(bN);
            }
            bc.appendChild(nr); updateGpsDisplays();
        };

        window.pToggleInventory = () => { const inv = document.getElementById('p-inventory-overlay'); inv.style.display = inv.style.display === 'block' ? 'none' : 'block'; if(inv.style.display === 'block') window.pRenderInventory(); };
        window.pUpdateBadge = () => { const unread = pInventory.filter(i=>!i.seen).length; document.getElementById('p-inv-badge').textContent = unread; document.getElementById('p-inv-badge').classList.toggle('hidden', unread === 0); };
        window.pRenderInventory = () => {
            const list = document.getElementById('p-item-list'); list.innerHTML = '';
            pInventory.forEach(item => { const c = document.createElement('div'); c.className = 'p-item-card'; c.onclick = () => { item.seen = true; window.pUpdateBadge(); window.pRenderInventory(); }; c.innerHTML = item.url ? `<img src="${item.url}">` : `<div class="text-4xl">${item.icon}</div>`; list.appendChild(c); });
        };

        window.pStartQR = () => { document.getElementById('p-qr-layer').style.display='flex'; pQrScanner = new Html5Qrcode("p-qr-reader"); pQrScanner.start({facingMode:"environment"}, {fps:10,qrbox:250}, t=>{ const p=window.config.storyPages[pSimIdx]; if(t.trim().toUpperCase()===(p.qrCode||"").toUpperCase()){ window.pStopQR(); pSimIdx = getPageIdxById(p.nextPageId) ?? pSimIdx + 1; window.pUpdateUI(); } }); };
        window.pStopQR = () => { if(pQrScanner) pQrScanner.stop().finally(()=>{ document.getElementById('p-qr-layer').style.display='none'; pQrScanner=null; }); };
        window.pAnswerCall = () => { pStopAllAudio(); document.getElementById('p-call-status-label').textContent = "HÍVÁS FOLYAMATBAN..."; document.getElementById('p-call-timer').style.display = 'block'; document.getElementById('p-call-controls').classList.add('hidden'); document.getElementById('p-call-active-controls').classList.remove('hidden'); pStartCallTimer(); const voice = document.getElementById('p-call-voice-audio'); voice.src = window.config.storyPages[pSimIdx].voiceUrl || ""; voice.play().catch(()=>window.pEndCall()); voice.onended = window.pEndCall; };
        window.pEndCall = () => { pStopAllAudio(); pStopCallTimer(); pSimIdx = getPageIdxById(window.config.storyPages[pSimIdx].nextPageId) ?? pSimIdx + 1; window.pUpdateUI(); };
        function pStartCallTimer(){ pCallTimeSeconds=0; pCallTimerInterval=setInterval(()=>{ pCallTimeSeconds++; const m=Math.floor(pCallTimeSeconds/60).toString().padStart(2,'0'), s=(pCallTimeSeconds%60).toString().padStart(2,'0'); document.getElementById('p-call-timer').textContent=`${m}:${s}`; },1000); }
        function pStopCallTimer(){ clearInterval(pCallTimerInterval); }
        function pStopAllAudio(){ document.getElementById('p-ringtone-audio').pause(); document.getElementById('p-call-voice-audio').pause(); }

        function setupSliders() {
            const sliders = [{h:'p-handle-accept', cb:window.pAnswerCall}, {h:'p-handle-decline', cb:window.pEndCall}];
            sliders.forEach(s => {
                const h = document.getElementById(s.h); if(!h) return;
                let startY=0, isDragging=false; const maxY=-180;
                h.addEventListener('touchstart', e=>{ startY=e.touches[0].clientY; isDragging=true; h.classList.remove('pulse-soft'); });
                h.addEventListener('touchmove', e=>{ if(!isDragging) return; let d=Math.max(maxY, Math.min(0, e.touches[0].clientY-startY)); h.style.transform=`translateY(${d}px)`; });
                h.addEventListener('touchend', e=>{ if(!isDragging) return; isDragging=false; const finalY=parseInt(h.style.transform.replace('translateY(',''))||0; if(finalY<=maxY+20) s.cb(); else { h.style.transform='translateY(0px)'; if(s.h==='p-handle-accept') h.classList.add('pulse-soft'); } });
            });
        }

        // PUBLISH & COMMUNITY
        window.publishGame = async () => { if(!currentUser || currentUser.isAnonymous){alert("Bejelentkezés kell!"); return;} const gid = window.config.cloudId || self.crypto.randomUUID(); window.config.cloudId = gid; await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', gid), { title: window.config.appTitle, author: currentUser.displayName, authorId: currentUser.uid, config: window.config, updatedAt: new Date().toISOString() }); alert("Publikálva!"); };
        window.initCommunitySync = () => { onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'publishedGames'), (snap) => { const list = document.getElementById('community-game-list'); list.innerHTML = ''; snap.docs.forEach(docSnap => { const d = docSnap.data(), isAuthor = currentUser && (d.authorId === currentUser.uid); const card = document.createElement('div'); card.className = "glass-card p-6 border border-slate-700 hover:border-purple-500 transition-all"; card.innerHTML = `<div class="h-32 bg-slate-900 rounded mb-4 overflow-hidden"><img src="${d.config?.globalBg||''}" class="w-full h-full object-cover opacity-50"></div><h3 class="font-bold text-white mb-2">${d.title}</h3><p class="text-[10px] text-slate-400 mb-4">Szerző: ${d.author||'Ismeretlen'}</p><button class="w-full bg-purple-600 py-2 rounded font-bold text-xs" onclick="window.loadAndPlayPublicGame('${docSnap.id}')">Játék</button>${isAuthor ? `<div class="flex gap-2 mt-2"><button onclick="window.loadAndEditPublicGame('${docSnap.id}')" class="flex-1 bg-amber-600 py-2 rounded text-[10px]">Szerkeszt</button><button onclick="window.deletePublic('${docSnap.id}')" class="p-2 bg-red-600 rounded"><i class="fa fa-trash"></i></button></div>` : ''}`; list.appendChild(card); }); }); };
        window.loadAndPlayPublicGame = async (id) => { const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id)); if(snap.exists()){ window.config = snap.data().config; window.togglePlayerMode(); } };
        window.loadAndEditPublicGame = async (id) => { const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id)); if(snap.exists()){ window.config = snap.data().config; window.switchView('studio'); } };
        window.deletePublic = (id) => { window.openConfirmModal("Törlés?", "Törlöd a portálról?", "globe", async () => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'publishedGames', id)); }); };

        // UTILS
        window.copyPage = (i) => { const c = JSON.parse(JSON.stringify(window.config.storyPages[i])); c.id = self.crypto.randomUUID(); window.config.storyPages.push(c); window.autoSave(); };
        window.addPage = () => { window.config.storyPages.push({ id: self.crypto.randomUUID(), content: "Új...", pageType: "story", rewards: [], hiddenItems: [] }); window.autoSave(); };
        window.addAvatar = () => { window.config.avatars.push({ id: 'X', name: 'Új', url: '', color: '#fff' }); window.renderAvatarAdmin(); };
        window.addReward = () => { const p = window.config.storyPages[window.currentIdx]; if(!p.rewards) p.rewards=[]; p.rewards.push({name:'Tárgy', icon:'📦'}); window.renderRewardsEditor(); window.autoSave(); };
        window.addChoice = () => { const p = window.config.storyPages[window.currentIdx]; if(!p.choices) p.choices=[]; p.choices.push({text:'Opció', targetId:null}); window.renderChoiceEditor(); window.autoSave(); };
        window.newGame = () => { window.openConfirmModal("Új kaland?", "Minden elvész!", "plus", () => { window.config = JSON.parse(JSON.stringify(defaultConfig)); window.refreshUI(); window.autoSave(); }); };
        window.importGame = () => { const i = document.createElement('input'); i.type='file'; i.onchange=e=>{ const f=e.target.files[0]; const r=new FileReader(); r.onload=re=>{ window.config=JSON.parse(re.target.result); window.refreshUI(); }; r.readAsText(f); }; i.click(); };
        window.exportGame = () => { const b=new Blob([JSON.stringify(window.config,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='kaland.json'; a.click(); };
        window.togglePlayerMode = () => { const v=document.getElementById('player-view'); if(v.style.display!=='flex'){ v.style.display='flex'; pSimIdx=0; pInventory=[]; lastAutoGpsIdx=-1; window.pUpdateUI(); } else { v.style.display='none'; pStopAllAudio(); } };
        window.toggleFullScreen = () => { if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
        window.closeConfirmModal = () => document.getElementById('confirm-modal').style.display = 'none';
        window.openHintModal = (text) => { document.getElementById('hint-text').textContent = text; document.getElementById('hint-confirm-view').classList.remove('hidden'); document.getElementById('hint-display-view').classList.add('hidden'); document.getElementById('hint-modal').style.display = 'flex'; };
        window.closeHintModal = () => document.getElementById('hint-modal').style.display = 'none';
        document.getElementById('hint-show-btn').onclick = () => { document.getElementById('hint-confirm-view').classList.add('hidden'); document.getElementById('hint-display-view').classList.remove('hidden'); };

        window.onload = () => {
            window.initCommunitySync(); setupSliders();
            new Sortable(document.getElementById('pageList'), { handle: '.handle', animation: 150, onEnd: () => { 
                const cid = window.config.storyPages[window.currentIdx]?.id;
                const domItems = Array.from(document.getElementById('pageList').children);
                window.config.storyPages = domItems.map(item => window.config.storyPages.find(p => p.id === item.dataset.id));
                if (cid) window.currentIdx = window.config.storyPages.findIndex(p => p.id === cid);
                window.autoSave(); 
            }});
            const initAuth = async () => { if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token); else await signInAnonymously(auth); };
            initAuth();
        };
    </script>
</body>
</html>
