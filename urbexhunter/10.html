<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbex Hunter v8 - Mobile Optimized</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged,
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc, 
            collection, 
            onSnapshot, 
            updateDoc, 
            arrayUnion, 
            increment,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- FIREBASE KONFIGURÁCIÓ ---
        const firebaseConfig = {
            apiKey: "AIzaSyCE9HsgnhCbjGWkRUSYeWblSAJAj9Y-3lk",
            authDomain: "urbex-hunter.firebaseapp.com",
            projectId: "urbex-hunter",
            storageBucket: "urbex-hunter.firebasestorage.app",
            messagingSenderId: "23703144828",
            appId: "1:23703144828:web:016a96cd6c1fe01ab5fcf9",
            measurementId: "G-NWN15EC2RW"
        };

        const appId = "urbex-hunter-v8"; 
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();
        const ADMIN_EMAIL = "jatszmabunker@gmail.com";

        const LEVELS = [
            { min: 0, name: "Zöldfülű Betörő", maxScan: 100 },
            { min: 100, name: "Rozsdás Vándor", maxScan: 250 },
            { min: 300, name: "Falkajáró", maxScan: 500 },
            { min: 500, name: "Ipari Alpinista", maxScan: 9999 }
        ];

        let user = null;
        let userData = { score: 0, groups: [], visited: [], username: "" };
        let groups = [];
        let locations = [];
        let map = null;
        let markers = [];
        let selectedCoords = null;
        let currentLocId = null; 
        let unsubscribeList = [];

        const getLevelInfo = (score) => LEVELS.slice().reverse().find(l => score >= l.min) || LEVELS[0];
        
        const showMessage = (text, type = 'info') => {
            const box = document.getElementById('message-box');
            if (!box) return;
            box.innerText = text;
            box.className = `fixed top-4 left-1/2 -translate-x-1/2 p-5 rounded-3xl shadow-2xl z-[6000] text-white font-bold text-center text-sm transition-all ${type === 'error' ? 'bg-red-600 shadow-red-500/20' : 'bg-green-600 shadow-green-500/20'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        };

        const getDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        };

        const getCurrentPos = () => new Promise((res, rej) => {
            navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true });
        });

        window.showView = (viewId) => {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            const target = document.getElementById(viewId);
            if (target) target.classList.remove('hidden');
            if (viewId === 'view-map' && map) setTimeout(() => map.invalidateSize(), 200);
            if (viewId !== 'view-add') selectedCoords = null;
        };

        window.login = async () => {
            try { await signInWithPopup(auth, googleProvider); } catch (err) { showMessage("Bejelentkezési hiba!", "error"); }
        };

        window.logout = async () => {
            await signOut(auth);
            location.reload();
        };

        // --- CSOPORTKEZELÉS ---
        window.createGroup = async () => {
            const name = prompt("Új csoport neve:");
            if (!name) return;
            const minScoreStr = prompt("Minimális pontszám a láthatósághoz:", "0");
            const minScore = parseInt(minScoreStr) || 0;
            const gid = "GRP-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            try {
                const groupRef = doc(db, 'artifacts', appId, 'public', 'data', 'groups', gid);
                await setDoc(groupRef, {
                    id: gid, name, ownerId: user.uid, ownerName: userData.username || user.displayName,
                    members: [user.uid], requests: [], minScore, totalGroupScore: userData.score, createdAt: Date.now()
                });
                const userRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
                await updateDoc(userRef, { groups: arrayUnion(gid) });
                showMessage("Csoport létrehozva!");
            } catch (e) { showMessage("Hiba!", "error"); }
        };

        window.requestJoin = async (gid) => {
            const reason = prompt("Indoklás az adminnak:");
            if (!reason) return;
            try {
                const gRef = doc(db, 'artifacts', appId, 'public', 'data', 'groups', gid);
                await updateDoc(gRef, {
                    requests: arrayUnion({ uid: user.uid, name: userData.username || user.displayName, reason, email: user.email })
                });
                showMessage("Kérelem elküldve!");
            } catch (e) { showMessage("Hiba!", "error"); }
        };

        window.approveRequest = async (gid, targetUid) => {
            try {
                const gRef = doc(db, 'artifacts', appId, 'public', 'data', 'groups', gid);
                const gSnap = await getDoc(gRef);
                const gData = gSnap.data();
                const targetUserRef = doc(db, 'artifacts', appId, 'users', targetUid, 'profile', 'data');
                const tSnap = await getDoc(targetUserRef);
                const tScore = tSnap.data()?.score || 0;

                const updatedRequests = gData.requests.filter(r => r.uid !== targetUid);
                await updateDoc(gRef, { members: arrayUnion(targetUid), requests: updatedRequests, totalGroupScore: increment(tScore) });
                await updateDoc(targetUserRef, { groups: arrayUnion(gid) });
                showMessage("Elfogadva!");
            } catch (e) { showMessage("Hiba!", "error"); }
        };

        window.rejectRequest = async (gid, targetUid) => {
            if (!confirm("Biztosan elutasítod a jelentkezőt?")) return;
            try {
                const gRef = doc(db, 'artifacts', appId, 'public', 'data', 'groups', gid);
                const gSnap = await getDoc(gRef);
                const gData = gSnap.data();
                const updatedRequests = gData.requests.filter(r => r.uid !== targetUid);
                await updateDoc(gRef, { requests: updatedRequests });
                showMessage("Kérelem elutasítva.");
            } catch (e) { showMessage("Hiba!", "error"); }
        };

        // --- CHECK-IN LOGIKA ---
        window.triggerCheckIn = async () => {
            if (!currentLocId || !user) return;
            const loc = locations.find(l => l.id === currentLocId);
            if (!loc) return;

            const isAdmin = user.email === ADMIN_EMAIL;
            if (!isAdmin) {
                showMessage("GPS jel keresése...");
                try {
                    const pos = await getCurrentPos();
                    const distance = getDistance(pos.coords.latitude, pos.coords.longitude, loc.lat, loc.lng);
                    if (distance > 45) {
                        showMessage(`Túl messze vagy! (${Math.round(distance)}m > 40m)`, "error");
                        return;
                    }
                } catch (e) {
                    showMessage("GPS hiba! Engedélyezd a helymeghatározást.", "error");
                    return;
                }
            }

            const modal = document.getElementById('install-modal');
            const modalTitle = modal.querySelector('h2');
            const modalDesc = modal.querySelector('p');

            if (loc.installed) {
                const visitorPoints = Math.round(loc.finalPoints / 2);
                modalTitle.innerText = "Pontszerzés";
                modalDesc.innerText = `Sikeresen megérkeztél! Bejelentkezel ${visitorPoints} pontért?`;
            } else {
                const isOriginalCreator = user?.uid === loc.creatorId;
                modalTitle.innerText = isOriginalCreator ? "Telepítés" : "Rablás";
                modalDesc.innerText = isOriginalCreator 
                    ? "Szeretnéd aktiválni ezt a helyszínt ezen a ponton?"
                    : "Ez a spot még gazdátlan! Ha most aktiválod, a tiéd lesz a tulajdonjog!";
            }
            modal.classList.remove('hidden');
        };

        window.confirmInstallation = async (confirmed) => {
            document.getElementById('install-modal').classList.add('hidden');
            if (!confirmed || !currentLocId) return;

            try {
                const locRef = doc(db, 'artifacts', appId, 'public', 'data', 'locations', currentLocId);
                const loc = locations.find(l => l.id === currentLocId);

                if (!loc.installed) {
                    const isOriginalCreator = loc.creatorId === user.uid;
                    const updates = { installed: true };
                    if (!isOriginalCreator) {
                        updates.creatorId = user.uid;
                        updates.creatorName = userData.username || user.displayName;
                        showMessage("RABLÁS! Mostantól te vagy a spot gazdája.");
                    } else {
                        showMessage("Helyszín sikeresen aktiválva!");
                    }
                    await updateDoc(locRef, updates);
                    window.showView('view-map');
                } else {
                    if (userData.visited?.includes(currentLocId)) return showMessage("Ezt a pontot már begyűjtötted!");
                    const visitorPoints = Math.round(loc.finalPoints / 2);
                    const userRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
                    await updateDoc(userRef, { score: increment(visitorPoints), visited: arrayUnion(currentLocId) });
                    const creatorRef = doc(db, 'artifacts', appId, 'users', loc.creatorId, 'profile', 'data');
                    await setDoc(creatorRef, { score: increment(5) }, { merge: true });
                    showMessage(`Begyűjtve: +${visitorPoints} pont!`);
                    window.showView('view-map');
                }
            } catch (err) { showMessage("Hiba történt a mentéskor!", "error"); }
        };

        // --- SPOT MŰVELETEK ---
        window.saveLocation = async (e) => {
            e.preventDefault();
            const name = document.getElementById('loc-name').value;
            const gid = document.getElementById('loc-group').value;
            if (!name || !gid) return showMessage("Név és csoport megadása kötelező!", "error");

            const id = "LOC-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'locations', id), {
                    id, name, lat: selectedCoords.lat, lng: selectedCoords.lng, groups: [gid],
                    installed: false, creatorId: user.uid, creatorName: userData.username || user.displayName,
                    finalPoints: 50, security: document.getElementById('loc-security').value,
                    access: document.getElementById('loc-access').value,
                    difficulty: document.getElementById('loc-difficulty').value,
                    danger: document.getElementById('loc-danger').value,
                    risk: document.getElementById('loc-risk').value,
                    tips: [], createdAt: Date.now()
                });
                showMessage("Sikeres rögzítés!");
                window.showView('view-map');
            } catch (e) { showMessage("Hiba a mentés során!", "error"); }
        };

        window.deleteLocation = async () => {
            if (!currentLocId) return;
            const loc = locations.find(l => l.id === currentLocId);
            if (!loc) return;
            if (loc.creatorId !== user.uid && user.email !== ADMIN_EMAIL) {
                return showMessage("Csak a saját pontodat törölheted!", "error");
            }
            if (!confirm("Biztosan törölni szeretnéd ezt a helyszínt?")) return;

            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'locations', currentLocId));
                showMessage("Helyszín törölve.");
                window.showView('view-map');
            } catch (e) { showMessage("Hiba a törléskor!", "error"); }
        };

        window.openDetails = async (locId) => {
            currentLocId = locId;
            const loc = locations.find(l => l.id === locId);
            if (!loc) return;
            
            document.getElementById('det-name').innerText = loc.name;
            document.getElementById('det-security').innerText = loc.security || "Ismeretlen";
            document.getElementById('det-access').innerText = loc.access || "Ismeretlen";
            document.getElementById('det-difficulty').innerText = "⭐".repeat(loc.difficulty || 1);
            document.getElementById('det-danger').innerText = "💀".repeat(loc.danger || 1);
            document.getElementById('det-risk').innerText = loc.risk || "Alacsony";
            document.getElementById('det-points').innerText = loc.finalPoints + " PTS";
            
            // Csak a tulajdonos látja a törlés gombot
            const delBtn = document.getElementById('det-delete-btn');
            if (loc.creatorId === user?.uid || user?.email === ADMIN_EMAIL) {
                delBtn.classList.remove('hidden');
            } else {
                delBtn.classList.add('hidden');
            }

            renderTips(loc.tips || []);
            window.showView('view-details');
        };

        const renderTips = (tips) => {
            const list = document.getElementById('det-tips-list');
            if (tips.length === 0) {
                list.innerHTML = `<p class="text-xs text-gray-600 uppercase font-bold italic">Még nincsenek tanácsok.</p>`;
                return;
            }
            const sorted = [...tips].sort((a, b) => (b.votes || 0) - (a.votes || 0));
            list.innerHTML = sorted.map((t, idx) => `
                <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl mb-3 flex justify-between items-start">
                    <div class="flex-1">
                        <p class="text-sm text-white italic leading-relaxed mb-2">"${t.text}"</p>
                        <span class="text-[8px] text-gray-500 uppercase font-bold tracking-widest">— Feladó</span>
                    </div>
                    <div class="flex flex-col items-center ml-4">
                        <button onclick="window.voteTip('${idx}')" class="p-2 bg-gray-800 hover:bg-green-900/40 rounded-xl transition-colors">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${t.voters?.includes(user.uid) ? '#22c55e' : '#6b7280'}" stroke-width="3"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                        </button>
                        <span class="text-xs font-bold text-green-500 mt-2">${t.votes || 0}</span>
                    </div>
                </div>
            `).join('');
        };

        window.submitTip = async () => {
            const input = document.getElementById('tip-input');
            const text = input.value.trim();
            if (!text || !currentLocId) return;
            try {
                const locRef = doc(db, 'artifacts', appId, 'public', 'data', 'locations', currentLocId);
                await updateDoc(locRef, { tips: arrayUnion({ text, authorId: user.uid, votes: 0, voters: [], createdAt: Date.now() }) });
                input.value = "";
                showMessage("Tanács elküldve!");
            } catch (e) { showMessage("Hiba!", "error"); }
        };

        window.voteTip = async (tipIdx) => {
            if (!currentLocId || !user) return;
            const loc = locations.find(l => l.id === currentLocId);
            const tip = loc.tips[tipIdx];
            if (tip.voters?.includes(user.uid) || tip.authorId === user.uid) return;
            try {
                const locRef = doc(db, 'artifacts', appId, 'public', 'data', 'locations', currentLocId);
                const updatedTips = [...loc.tips];
                updatedTips[tipIdx].votes = (updatedTips[tipIdx].votes || 0) + 1;
                updatedTips[tipIdx].voters = [...(updatedTips[tipIdx].voters || []), user.uid];
                await updateDoc(locRef, { tips: updatedTips });
                await setDoc(doc(db, 'artifacts', appId, 'users', tip.authorId, 'profile', 'data'), { score: increment(10) }, { merge: true });
                await setDoc(doc(db, 'artifacts', appId, 'users', loc.creatorId, 'profile', 'data'), { score: increment(5) }, { merge: true });
                showMessage("Voks rögzítve!");
            } catch (e) { showMessage("Hiba!", "error"); }
        };

        // --- RENDERING ---
        const renderGroups = () => {
            const list = document.getElementById('group-list');
            const reqArea = document.getElementById('group-requests');
            let gHtml = ""; let rHtml = "";
            groups.forEach(g => {
                const isMember = g.members.includes(user.uid);
                const isOwner = g.ownerId === user.uid;
                if (userData.score < (g.minScore || 0) && !isMember) return;
                gHtml += `<div class="bg-gray-800 p-6 rounded-[2.5rem] border border-gray-700 mb-4 flex justify-between items-center shadow-xl">
                    <div><h3 class="font-bold text-white text-base uppercase italic tracking-tight">${g.name}</h3><p class="text-[9px] text-gray-400 font-bold uppercase mt-1">${g.totalGroupScore || 0} ÖSSZPONT</p></div>
                    ${isMember ? `<span class="text-green-500 text-[10px] font-bold uppercase tracking-widest">Tag</span>` : g.requests?.some(r => r.uid === user.uid) ? `<span class="text-orange-500 text-[10px] font-bold uppercase italic">Függőben</span>` : `<button onclick="window.requestJoin('${g.id}')" class="bg-blue-600 text-[10px] px-5 py-2.5 rounded-2xl font-bold uppercase active:scale-90">Belépés</button>`}
                </div>`;
                if (isOwner && g.requests?.length > 0) {
                    g.requests.forEach(req => {
                        rHtml += `<div class="bg-gray-900 border border-orange-500/30 p-5 rounded-3xl mb-4 shadow-lg"><div class="flex justify-between items-start mb-3"><span class="text-sm font-bold text-white uppercase">${g.name}</span><span class="text-[10px] text-gray-500 font-bold uppercase">Kérelem</span></div><p class="text-xs text-gray-400 italic mb-4 leading-relaxed">"${req.reason}"</p><div class="flex gap-3"><button onclick="window.approveRequest('${g.id}', '${req.uid}')" class="flex-1 bg-green-600 text-black text-[10px] font-bold py-3 rounded-xl uppercase">Elfogadás</button><button onclick="window.rejectRequest('${g.id}', '${req.uid}')" class="flex-1 bg-red-600 text-white text-[10px] font-bold py-3 rounded-xl uppercase">Elutasítás</button></div></div>`;
                    });
                }
            });
            list.innerHTML = gHtml || `<p class="text-center text-gray-600 text-xs uppercase font-bold py-10">Nincs elérhető csoport.</p>`;
            reqArea.innerHTML = rHtml;
        };

        const updateMarkers = () => {
            if (!map) return;
            markers.forEach(m => m.remove());
            markers = [];
            const myGroups = userData.groups || [];
            locations.filter(loc => loc.groups.some(gid => myGroups.includes(gid))).forEach(loc => {
                const color = loc.installed ? '#22c55e' : '#f97316';
                const marker = L.circle([loc.lat, loc.lng], { color, fillColor: color, fillOpacity: 0.2, weight: 2, radius: 25 }).addTo(map);
                marker.on('click', (e) => { L.DomEvent.stopPropagation(e); window.openDetails(loc.id); });
                markers.push(marker);
            });
        };

        // --- AUTH ---
        onAuthStateChanged(auth, async (u) => {
            user = u;
            unsubscribeList.forEach(un => un());
            unsubscribeList = [];
            if (u) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('profile-area').classList.remove('hidden');
                const userRef = doc(db, 'artifacts', appId, 'users', u.uid, 'profile', 'data');
                const snap = await getDoc(userRef);
                if (!snap.exists()) await setDoc(userRef, { score: 0, visited: [], groups: [], username: u.displayName });
                unsubscribeList.push(onSnapshot(userRef, s => {
                    userData = s.data();
                    const info = getLevelInfo(userData.score);
                    document.getElementById('user-score').innerText = userData.score;
                    document.getElementById('user-level').innerText = info.name;
                    if (u.photoURL) document.getElementById('profile-img').src = u.photoURL;
                    renderGroups();
                    updateMarkers();
                }));
                unsubscribeList.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'groups'), s => { groups = s.docs.map(d => d.data()); renderGroups(); }));
                unsubscribeList.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'locations'), s => { locations = s.docs.map(d => d.data()); updateMarkers(); }));
                window.showView('view-map');
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('profile-area').classList.add('hidden');
            }
        });

        window.addEventListener('load', () => {
            map = L.map('map-container', { zoomControl: false }).setView([47.4979, 19.0402], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CartoDB' }).addTo(map);
            map.on('click', (e) => {
                if (!user) return showMessage("Lépj be előbb!", "error");
                selectedCoords = e.latlng;
                document.getElementById('lat-val').innerText = e.latlng.lat.toFixed(5);
                document.getElementById('lng-val').innerText = e.latlng.lng.toFixed(5);
                const select = document.getElementById('loc-group');
                const myOwned = groups.filter(g => g.members.includes(user.uid));
                select.innerHTML = `<option value="">Válassz csoportot...</option>` + myOwned.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
                window.showView('view-add');
            });
        });
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
        body { font-family: 'Space Mono', monospace; background: #080808; color: #f3f4f6; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .green-glow { text-shadow: 0 0 15px rgba(34, 197, 94, 0.6); }
        .view { animation: fadeInUp 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        #map-container { height: calc(100vh - 280px); border-radius: 3rem; border: 2px solid #1f2937; margin-top: 1rem; box-shadow: inset 0 0 30px rgba(0,0,0,0.6); }
        select, input { background: #000; border: 1px solid #1f2937; color: #fff; border-radius: 1.25rem; padding: 1rem; font-size: 1rem; width: 100%; transition: border 0.3s; }
        select:focus, input:focus { border-color: #22c55e; outline: none; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen">
    <div id="message-box" class="hidden"></div>
    
    <header class="p-6 bg-black/90 backdrop-blur-2xl sticky top-0 z-[1100] border-b border-gray-800 shadow-2xl">
        <div class="flex justify-between items-center max-w-2xl mx-auto relative">
            <div>
                <h1 class="text-xl font-bold text-green-500 green-glow italic uppercase tracking-tighter leading-none">Urbex Hunter v8</h1>
                <p id="user-level" class="text-[8px] text-gray-500 font-bold uppercase tracking-widest mt-1.5 italic">A térkép csak bizalmasoké...</p>
            </div>
            
            <div id="login-area" class="flex items-center gap-4">
                <button id="login-btn" onclick="window.login()" class="bg-white text-black px-6 py-2.5 rounded-full text-xs font-bold transition-transform active:scale-95 shadow-lg shadow-white/5">BELÉPÉS</button>
                <div id="profile-area" class="hidden flex items-center gap-4">
                    <div id="user-score" class="text-4xl font-bold text-green-500 green-glow tracking-tighter">0</div>
                    <div class="flex flex-col items-center gap-1">
                        <img id="profile-img" src="" class="w-10 h-10 rounded-full border-2 border-green-500 p-0.5 shadow-lg">
                        <button onclick="window.logout()" class="text-[7px] text-red-500 font-bold uppercase tracking-widest hover:underline">Kilépés</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="admin-tag" class="hidden text-center text-[8px] text-orange-500 font-bold uppercase mt-3 animate-pulse tracking-widest">ADMIN HOZZÁFÉRÉS AKTÍV</div>
    </header>

    <main class="max-w-2xl mx-auto p-4 mb-32">
        <div id="view-map" class="view">
            <div id="map-container"></div>
            <p class="mt-6 p-5 bg-gray-900/40 border border-gray-800 rounded-[2.5rem] text-xs text-gray-500 italic text-center uppercase font-bold tracking-tight">Kattints a térképre új pont rögzítéséhez a csoportodban!</p>
        </div>

        <div id="view-groups" class="view hidden">
            <div id="group-requests" class="mb-8"></div>
            <div class="flex justify-between items-center mb-8 px-2">
                <h2 class="text-sm font-bold text-white uppercase italic tracking-widest">Közösségek</h2>
                <button onclick="window.createGroup()" class="bg-green-600 text-black text-[10px] px-5 py-3 rounded-2xl font-bold uppercase shadow-lg shadow-green-500/10 active:scale-95">+ Új Csoport</button>
            </div>
            <div id="group-list" class="space-y-4"></div>
        </div>

        <!-- Adatlap -->
        <div id="view-details" class="view hidden">
            <div class="flex justify-between items-center mb-6">
                <button onclick="window.showView('view-map')" class="flex items-center gap-2 text-gray-500 uppercase text-[10px] font-bold tracking-widest hover:text-white transition-colors">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> VISSZA
                </button>
                <button id="det-delete-btn" onclick="window.deleteLocation()" class="hidden bg-red-900/40 text-red-500 text-[10px] px-4 py-2 rounded-xl font-bold uppercase border border-red-900/50 active:scale-90">Törlés</button>
            </div>

            <div class="bg-gray-800 border border-gray-700 p-8 rounded-[3.5rem] shadow-2xl relative overflow-hidden mb-8">
                <div class="flex justify-between items-start mb-8">
                    <div>
                        <h2 id="det-name" class="text-3xl font-bold text-white uppercase tracking-tighter leading-none mb-2">...</h2>
                        <div id="det-points" class="inline-block bg-green-600 text-black font-bold px-4 py-1.5 rounded-xl text-xs tracking-widest">0 PTS</div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-10">
                    <div class="bg-black/40 p-5 rounded-3xl border border-gray-700 text-[10px] uppercase font-bold"><span class="text-gray-500 block mb-1">Őrzés</span><p id="det-security" class="text-white text-sm">...</p></div>
                    <div class="bg-black/40 p-5 rounded-3xl border border-gray-700 text-[10px] uppercase font-bold"><span class="text-gray-500 block mb-1">Bejutás</span><p id="det-access" class="text-white text-sm">...</p></div>
                    <div class="bg-black/40 p-5 rounded-3xl border border-gray-700 text-[10px] uppercase font-bold"><span class="text-gray-500 block mb-1">Nehézség</span><p id="det-difficulty" class="text-lg mt-1 tracking-widest">...</p></div>
                    <div class="bg-black/40 p-5 rounded-3xl border border-gray-700 text-[10px] uppercase font-bold"><span class="text-gray-500 block mb-1">Veszély</span><p id="det-danger" class="text-lg mt-1 tracking-widest">...</p></div>
                </div>
                
                <button onclick="window.triggerCheckIn()" class="w-full py-6 bg-white text-black font-bold rounded-3xl uppercase text-sm tracking-[0.25em] active:scale-95 transition-all shadow-xl shadow-white/5 mb-10">BEJELENTKEZÉS (GPS)</button>

                <div class="border-t border-gray-700 pt-8">
                    <h4 class="text-xs font-bold text-white uppercase mb-6 tracking-widest italic">💡 Játéktippek</h4>
                    <div id="det-tips-list" class="space-y-4 mb-8"></div>
                    <div class="flex gap-3">
                        <input id="tip-input" type="text" placeholder="Írj egy hasznos tanácsot..." class="flex-1 rounded-2xl">
                        <button onclick="window.submitTip()" class="bg-green-600 px-6 rounded-2xl active:scale-95 flex items-center justify-center">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-add" class="view hidden">
            <div class="bg-gray-900 border border-gray-800 p-10 rounded-[3.5rem] shadow-2xl">
                <h2 class="text-2xl font-bold text-green-500 mb-8 uppercase italic tracking-tighter">Új Helyszín</h2>
                <form onsubmit="window.saveLocation(event)" class="space-y-5 text-[10px] font-bold uppercase text-gray-500">
                    <div>
                        <label class="ml-2 mb-2 block">Helyszín megnevezése</label>
                        <input id="loc-name" type="text" required placeholder="Pl: Soviet Hospital" class="text-base">
                    </div>
                    <div>
                        <label class="ml-2 mb-2 block">Cél csoport</label>
                        <select id="loc-group" required class="text-base"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="ml-2 mb-2 block">Őrzés</label><select id="loc-security" class="text-base"><option value="Nincs">Nincs</option><option value="Kerítés">Kerítés</option><option value="Kamera">Kamera</option><option value="Élőerős">Élőerős</option><option value="Kutyás">Kutyás</option></select></div>
                        <div><label class="ml-2 mb-2 block">Bejutás</label><select id="loc-access" class="text-base"><option value="Séta">Séta</option><option value="Bemászás">Bemászás</option><option value="Mászás">Mászás</option></select></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="ml-2 mb-2 block">Nehézség (1-5)</label><input id="loc-difficulty" type="number" min="1" max="5" value="1" class="text-base"></div>
                        <div><label class="ml-2 mb-2 block">Veszély (1-5)</label><input id="loc-danger" type="number" min="1" max="5" value="1" class="text-base"></div>
                    </div>
                    <div>
                        <label class="ml-2 mb-2 block">Látogatási kockázat</label>
                        <select id="loc-risk" class="text-base"><option value="Alacsony">Alacsony</option><option value="Közepes">Közepes</option><option value="Magas">Magas</option></select>
                    </div>
                    <p class="text-center mt-4 lowercase italic text-[11px]">Pozíció: <span id="lat-val" class="text-white"></span>, <span id="lng-val" class="text-white"></span></p>
                    <button type="submit" class="w-full py-6 bg-green-600 text-black font-bold rounded-3xl uppercase text-sm tracking-widest mt-6 active:scale-95 shadow-xl shadow-green-500/10">ADATLAP MENTÉSE</button>
                    <button type="button" onclick="window.showView('view-map')" class="w-full py-3 text-gray-600 font-bold hover:text-white transition-colors text-xs">MÉGSE</button>
                </form>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 inset-x-0 bg-black/95 backdrop-blur-2xl border-t border-gray-800 p-8 pb-12 z-[1100] shadow-2xl">
        <div class="max-w-2xl mx-auto flex justify-around items-center">
            <button onclick="window.showView('view-map')" class="flex flex-col items-center gap-2 group transition-transform active:scale-90">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-500 group-hover:text-green-500 transition-colors"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">Térkép</span>
            </button>
            <button onclick="window.showView('view-groups')" class="flex flex-col items-center gap-2 group transition-transform active:scale-90">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-500 group-hover:text-green-500 transition-colors"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">Csoportok</span>
            </button>
        </div>
    </nav>

    <div id="install-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[5000] flex items-center justify-center p-8 text-center">
        <div class="bg-gray-900 border border-gray-700 w-full max-w-sm p-10 rounded-[3.5rem] shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-6 uppercase tracking-tighter italic font-bold">Megerősítés</h2>
            <p class="text-sm text-gray-400 mb-10 uppercase tracking-widest leading-relaxed">...</p>
            <div class="flex gap-4">
                <button onclick="window.confirmInstallation(true)" class="flex-1 py-5 bg-green-600 text-black font-bold rounded-2xl uppercase text-xs active:scale-95">IGEN</button>
                <button onclick="window.confirmInstallation(false)" class="flex-1 py-5 bg-gray-800 text-gray-400 font-bold rounded-2xl uppercase text-xs active:scale-95">MÉGSE</button>
            </div>
        </div>
    </div>
</body>
</html>
