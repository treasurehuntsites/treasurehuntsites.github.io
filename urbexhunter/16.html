<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbex Hunter v9 - Clans & Privacy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signInAnonymously, signInWithCustomToken, signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, arrayUnion, increment, query, deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyCE9HsgnhCbjGWkRUSYeWblSAJAj9Y-3lk",
                authDomain: "urbex-hunter.firebaseapp.com",
                projectId: "urbex-hunter",
                storageBucket: "urbex-hunter.firebasestorage.app",
                messagingSenderId: "23703144828",
                appId: "1:23703144828:web:016a96cd6c1fe01ab5fcf9",
                measurementId: "G-NWN15EC2RW"
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'urbex-hunter-v9'; 
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        const LEVELS = [
            { min: 0, name: "Zöldfülű", maxScan: 100 },
            { min: 100, name: "Vándor", maxScan: 300 },
            { min: 500, name: "Alpinista", maxScan: 9999 }
        ];

        let user = null;
        let userData = { score: 0, groups: [], visited: [], username: "Hunter" };
        let locations = [];
        let allGroups = [];
        let publicProfiles = {}; 
        let map = null;
        let markers = [];
        let userMarker = null; 
        let lastTrackedPos = null;
        let selectedCoords = null;
        let currentGroupId = null;
        let isDemoMode = false;
        let isChecking = false;
        let unsubscribeList = [];

        const getLevelInfo = (score) => LEVELS.slice().reverse().find(l => score >= l.min) || LEVELS[0];

        const showMessage = (text, type = 'info') => {
            const box = document.getElementById('message-box');
            box.innerText = text;
            box.className = `fixed top-4 left-1/2 -translate-x-1/2 p-4 rounded shadow-2xl z-[6000] text-white font-bold text-center text-xs transition-all ${type === 'error' ? 'bg-red-600' : 'bg-green-600'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        };

        window.showView = (viewId) => {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            if (viewId === 'view-map' && map) setTimeout(() => map.invalidateSize(), 200);
            if (viewId === 'view-group-detail') renderGroupLocations();
        };

        const getDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        };

        const getCurrentPos = () => new Promise((res, rej) => {
            if (!navigator.geolocation) return rej("Nincs GPS támogatás");
            navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 5000 });
        });

        const trackUserPosition = () => {
            if (!navigator.geolocation) return;
            navigator.geolocation.watchPosition(pos => {
                const { latitude, longitude, accuracy } = pos.coords;
                
                // GPS Stabilizáció: Ha a pontosság rosszabb mint 50m, eldobjuk az ugrálást elkerülendő
                if (accuracy > 50) return;
                
                // Ha már volt korábbi pozíció, és kevesebbet mozdultunk mint 2 méter, nem frissítünk
                if (lastTrackedPos && getDistance(latitude, longitude, lastTrackedPos.lat, lastTrackedPos.lng) < 2) return;
                
                lastTrackedPos = { lat: latitude, lng: longitude };
                const latlng = [latitude, longitude];

                if (!userMarker) {
                    userMarker = L.circleMarker(latlng, {
                        radius: 8, fillColor: "#3b82f6", color: "white", weight: 2, opacity: 1, fillOpacity: 0.9, className: "player-pulse"
                    }).addTo(map).bindPopup("Te itt vagy");
                } else {
                    userMarker.setLatLng(latlng);
                }
            }, err => console.log("Helymeghatározási hiba:", err), { enableHighAccuracy: true, maximumAge: 1000 });
        };

        window.loginWithGoogle = () => signInWithPopup(auth, googleProvider);
        window.loginAsDemo = async () => {
            isDemoMode = true;
            try { 
                await signInAnonymously(auth); 
            } catch(e) { 
                handleAuthChange({ uid: "demo-user-" + Math.random().toString(36).substr(2, 5), displayName: "Demo Hunter", isAnonymous: true }); 
                showMessage("Demo mód (szimulált) aktív!");
            }
        };

        window.logout = () => signOut(auth).then(() => location.reload());

        const handleAuthChange = (u) => {
            user = u;
            unsubscribeList.forEach(unsub => unsub());
            unsubscribeList = [];
            if (u) {
                document.getElementById('login-area').classList.add('hidden');
                document.getElementById('profile-area').classList.remove('hidden');
                setupListeners();
            } else {
                document.getElementById('login-area').classList.remove('hidden');
                document.getElementById('profile-area').classList.add('hidden');
            }
        };

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                }
            } catch(e) { console.log("Kezdeti token hiba:", e.message); }
            onAuthStateChanged(auth, handleAuthChange);
        };

        const setupListeners = () => {
            if (!user) return;
            unsubscribeList.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'profiles'), snap => {
                snap.docs.forEach(d => publicProfiles[d.id] = d.data());
                if (currentGroupId) renderGroupMembers();
            }));
            unsubscribeList.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'groups'), snap => {
                allGroups = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderGroups();
                updateMarkers();
            }));
            if (user.uid.indexOf("demo-user") === -1) {
                unsubscribeList.push(onSnapshot(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), snap => {
                    userData = snap.data() || { score: 0, groups: [], visited: [], username: user.displayName || "Hunter" };
                    updateUI();
                    setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'profiles', user.uid), {
                        username: userData.username, score: userData.score
                    }, { merge: true });
                    renderGroups();
                    updateMarkers();
                }));
                unsubscribeList.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'locations'), snap => {
                    locations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    updateMarkers();
                    if (currentGroupId) renderGroupLocations();
                }));
                unsubscribeList.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'applications'), snap => {
                    renderApplications(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                }));
            } else {
                updateUI();
                renderGroups();
            }
        };

        const updateUI = () => {
            const info = getLevelInfo(userData.score || 0);
            document.getElementById('user-score').innerText = userData.score || 0;
            document.getElementById('user-level').innerText = isDemoMode ? "TESZTER / DEBUG" : info.name;
            document.getElementById('profile-name').innerText = userData.username || "Hunter";
        };

        window.addEventListener('load', () => {
            map = L.map('map-container', { zoomControl: false }).setView([47.4979, 19.0402], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            map.on('click', (e) => {
                if (!user) return showMessage("Lépj be!", "error");
                if (!userData.groups || userData.groups.length === 0) return showMessage("Előbb csatlakozz egy csoporthoz!", "error");
                selectedCoords = e.latlng;
                document.getElementById('lat-val').innerText = selectedCoords.lat.toFixed(5);
                document.getElementById('lng-val').innerText = selectedCoords.lng.toFixed(5);
                const select = document.getElementById('loc-group-select');
                const myGroups = allGroups.filter(g => userData.groups.includes(g.id));
                select.innerHTML = myGroups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
                window.showView('view-add');
            });
            trackUserPosition();
            initAuth();
        });

        const updateMarkers = () => {
            if (!map) return;
            markers.forEach(m => m.remove());
            markers = [];
            const visibleLocations = locations.filter(loc => userData.groups && userData.groups.includes(loc.groupId));
            visibleLocations.forEach(loc => {
                let color = '#3b82f6'; // voting
                if (loc.status === 'active') {
                    color = loc.installed ? '#22c55e' : '#f97316';
                }
                const circle = L.circle([loc.lat, loc.lng], { color, fillColor: color, fillOpacity: 0.2, radius: 250 }).addTo(map);
                circle.bindPopup(`<b>${loc.name}</b><br>Státusz: ${loc.status === 'active' ? (loc.installed ? 'Éles' : 'Aktiválásra vár') : 'Szavazás alatt'}`);
                markers.push(circle);
            });
        };

        window.checkInNearby = async () => {
            if (!user) return showMessage("Jelentkezz be!", "error");
            if (isChecking) return;
            isChecking = true;
            const btn = document.getElementById('checkin-btn');
            if (btn) btn.classList.add('animate-spin');
            try {
                const pos = await getCurrentPos().catch(e => {
                    if (isDemoMode && map) return { coords: { latitude: map.getCenter().lat, longitude: map.getCenter().lng }};
                    throw e;
                });
                const uLat = pos.coords.latitude;
                const uLng = pos.coords.longitude;
                let closestLoc = null;
                let minDistance = Infinity;
                locations.forEach(loc => {
                    // Csak az aktív helyszíneket lehet leigazolni
                    if (loc.status === 'active' && userData.groups && userData.groups.includes(loc.groupId)) {
                        const dist = getDistance(uLat, uLng, loc.lat, loc.lng);
                        if (dist < minDistance) { minDistance = dist; closestLoc = loc; }
                    }
                });
                if (closestLoc && (minDistance <= 25 || isDemoMode)) {
                    await processLocationAction(closestLoc);
                } else {
                    const distMsg = closestLoc ? `(Legközelebbi: ${Math.round(minDistance)}m)` : "";
                    showMessage(`Nincs aktív csoportos helyszín 25m-en belül! ${distMsg}`, "error");
                }
            } catch (err) { showMessage("GPS hiba!", "error"); } finally { isChecking = false; if (btn) btn.classList.remove('animate-spin'); }
        };

        const processLocationAction = async (locData) => {
            try {
                const locRef = doc(db, 'artifacts', appId, 'public', 'data', 'locations', locData.id);
                const userRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
                
                // Aktiválás (Telepítés)
                if (!locData.installed) {
                    if (locData.creatorId !== user.uid) return showMessage("Ezt a pontot csak a beküldője aktiválhatja!", "error");
                    await updateDoc(locRef, { installed: true });
                    showMessage("Helyszín sikeresen aktiválva! Mostantól kaphatsz pontot mások bejelentkezései után.");
                    return;
                }

                // Pontszerzés látogatóként
                if (userData.visited && userData.visited.includes(locData.id)) return showMessage("Ezt már meglátogattad!", "error");
                if (locData.creatorId === user.uid) return showMessage("A saját helyszínedért nem kapsz látogatói pontot!");

                const pts = Math.round((locData.finalPoints || 50) / 2);
                await setDoc(userRef, { score: increment(pts), visited: arrayUnion(locData.id) }, { merge: true });
                
                // Jutalom a készítőnek (5 pont minden látogató után)
                const creatorProfileRef = doc(db, 'artifacts', appId, 'users', locData.creatorId, 'profile', 'data');
                await setDoc(creatorProfileRef, { score: increment(5) }, { merge: true });

                showMessage(`Sikeres igazolás! +${pts} pont.`);
            } catch (err) { showMessage("Hiba a pontszerzésnél!", "error"); }
        };

        // SZAVAZÁSI LOGIKA
        window.voteValue = async (locId, val) => {
            if (!user) return;
            const locRef = doc(db, 'artifacts', appId, 'public', 'data', 'locations', locId);
            const snap = await getDoc(locRef);
            const data = snap.data();
            
            if (data.voters?.includes(user.uid) && !isDemoMode) return showMessage("Már szavaztál erre!");

            const newTotal = (data.voteTotal || 0) + val;
            const newCount = (data.voteCount || 0) + 1;
            let updates = { voteTotal: newTotal, voteCount: newCount, voters: arrayUnion(user.uid) };
            
            if (newCount >= 10) {
                updates.status = 'active';
                updates.finalPoints = Math.round(newTotal / 10);
                showMessage(`Helyszín elfogadva! Értéke: ${updates.finalPoints} PTS`);
            } else {
                showMessage("Voks rögzítve!");
            }
            await updateDoc(locRef, updates);
        };

        window.createGroup = async () => {
            if (!user) return;
            const name = document.getElementById('new-group-name').value.trim();
            const minScore = parseInt(document.getElementById('new-group-min').value) || 0;
            if (!name) return;
            const id = "GRP-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'groups', id), {
                    id, name, creatorId: user.uid, members: [user.uid], totalScore: userData.score || 0, minScoreToSee: minScore
                });
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), {
                    groups: arrayUnion(id)
                }, { merge: true });
                showMessage("Csoport létrehozva!");
                document.getElementById('new-group-name').value = "";
                document.getElementById('new-group-min').value = "";
            } catch (err) { showMessage("Hiba!", "error"); }
        };

        window.applyToGroup = async (e, groupId) => {
            e.stopPropagation();
            if (!user) return;
            const reason = prompt("Miért szeretnél csatlakozni?");
            if (!reason) return;
            const id = `APP-${user.uid}-${groupId}`;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'applications', id), {
                    id, groupId, userId: user.uid, username: userData.username, reason, creatorId: allGroups.find(g => g.id === groupId).creatorId
                });
                showMessage("Jelentkezés elküldve!");
            } catch (err) { showMessage("Hiba!", "error"); }
        };

        const renderGroups = () => {
            const container = document.getElementById('group-list');
            const score = userData.score || 0;
            const visibleGroups = allGroups.filter(g => score >= (g.minScoreToSee || 0));
            container.innerHTML = visibleGroups.map(g => {
                const isMember = userData.groups && userData.groups.includes(g.id);
                return `
                <div onclick="window.showGroupDetail('${g.id}')" class="bg-gray-800 p-4 rounded-2xl border border-gray-700 mb-3 flex justify-between items-center active:bg-gray-700 transition-colors cursor-pointer">
                    <div>
                        <h4 class="font-bold text-white uppercase tracking-tight">${g.name}</h4>
                        <p class="text-[9px] text-gray-500 uppercase">Tagok: ${g.members.length} | Összpont: ${g.totalScore || 0}</p>
                    </div>
                    ${isMember ? 
                        `<span class="text-[9px] bg-green-900 text-green-400 px-3 py-1 rounded-full font-bold uppercase">TAG</span>` : 
                        `<button onclick="window.applyToGroup(event, '${g.id}')" class="bg-blue-600 text-white text-[9px] px-3 py-1.5 rounded-lg font-bold uppercase">Jelentkezés</button>`
                    }
                </div>`;
            }).join('');
        };

        window.showGroupDetail = (groupId) => {
            currentGroupId = groupId;
            const group = allGroups.find(g => g.id === groupId);
            if (!group) return;
            document.getElementById('detail-group-name').innerText = group.name;
            window.showView('view-group-detail');
        };

        const renderGroupLocations = () => {
            const container = document.getElementById('detail-location-list');
            const groupLocs = locations.filter(loc => loc.groupId === currentGroupId);
            if (groupLocs.length === 0) {
                container.innerHTML = `<div class="text-center p-10 text-gray-500 uppercase italic text-[10px] font-bold">Még nincs rögzített helyszín.</div>`;
                return;
            }
            container.innerHTML = groupLocs.map(loc => {
                const isCreator = loc.creatorId === user?.uid;
                const canVote = loc.status === 'voting' && (!loc.voters?.includes(user?.uid) || isDemoMode);
                
                return `
                <div class="bg-gray-800/50 p-5 rounded-3xl border border-gray-700 mb-4 shadow-xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 ${loc.status === 'active' ? (loc.installed ? 'bg-green-600' : 'bg-orange-600 animate-pulse') : 'bg-blue-600'} text-[8px] px-3 py-1 font-bold uppercase rounded-bl-xl tracking-tighter">
                        ${loc.status === 'active' ? (loc.installed ? (loc.finalPoints || 50) + ' PTS' : 'AKTIVÁLÁSRA VÁR') : 'VOTING ('+ (loc.voteCount || 0) +'/10)'}
                    </div>
                    <div class="mb-3">
                        <h3 class="font-bold text-white uppercase tracking-tight">${loc.name}</h3>
                        <p class="text-[8px] text-gray-500 uppercase font-bold tracking-widest italic">Beküldte: ${loc.creatorName || 'Hunter'}</p>
                    </div>
                    ${loc.status === 'voting' ? `
                        <div class="bg-black/40 p-3 rounded-2xl border border-gray-700/50 mt-2">
                            <p class="text-[8px] text-gray-400 uppercase mb-2 font-bold tracking-wider italic">Értékeld a spottot:</p>
                            <div class="grid grid-cols-4 gap-1.5">
                                ${[10, 20, 50, 100, 150, 200, 300, 500].map(v => `<button onclick="window.voteValue('${loc.id}', ${v})" class="py-1.5 text-[9px] font-bold border border-gray-700 rounded-lg text-blue-400 active:bg-blue-900 ${!canVote ? 'opacity-20 pointer-events-none' : ''}">${v}</button>`).join('')}
                            </div>
                        </div>
                    ` : ''}
                    ${loc.status === 'active' && !loc.installed && isCreator ? `
                        <div class="mt-2 p-3 bg-orange-900/20 border border-orange-500/30 rounded-2xl text-center">
                            <p class="text-[9px] text-orange-400 font-bold uppercase mb-2">Menj a helyszínre és nyomd meg a pipát az aktiváláshoz!</p>
                        </div>
                    ` : ''}
                </div>`;
            }).join('');
        };

        window.showGroupMembers = () => {
            const group = allGroups.find(g => g.id === currentGroupId);
            if (!group) return;
            document.getElementById('member-modal-title').innerText = `${group.name} - Tagok`;
            const memberList = document.getElementById('modal-member-list');
            memberList.innerHTML = group.members.map(uid => {
                const profile = publicProfiles[uid] || { username: "Ismeretlen Hunter", score: 0 };
                const info = getLevelInfo(profile.score);
                return `
                <div class="flex justify-between items-center p-3 bg-black/40 rounded-xl border border-gray-800 mb-2">
                    <div>
                        <p class="text-xs font-bold text-white">${profile.username}</p>
                        <p class="text-[8px] text-blue-400 uppercase font-bold">${info.name}</p>
                    </div>
                    <p class="text-[10px] font-bold text-green-500">${profile.score} PTS</p>
                </div>`;
            }).join('');
            document.getElementById('member-modal').classList.remove('hidden');
        };

        window.closeMemberModal = () => document.getElementById('member-modal').classList.add('hidden');

        const renderApplications = (apps) => {
            const container = document.getElementById('app-list');
            if (!user) return;
            const myManagedApps = apps.filter(a => a.creatorId === user.uid);
            if (myManagedApps.length === 0) {
                container.innerHTML = `<p class="text-[10px] text-gray-600 italic">Nincs függőben lévő jelentkezés.</p>`;
                return;
            }
            container.innerHTML = myManagedApps.map(a => `
                <div class="bg-gray-900 p-4 rounded-2xl border border-blue-900/30 mb-2">
                    <p class="text-[10px] text-white font-bold mb-1">${a.username} -> ${allGroups.find(g => g.id === a.groupId)?.name || 'Klán'}</p>
                    <p class="text-[9px] text-gray-400 italic mb-3">"${a.reason}"</p>
                    <div class="flex gap-2">
                        <button onclick="window.processApp('${a.id}', true)" class="flex-1 bg-green-600 text-black text-[9px] font-bold py-2 rounded-lg uppercase">Elfogad</button>
                        <button onclick="window.processApp('${a.id}', false)" class="flex-1 bg-red-600 text-white text-[9px] font-bold py-2 rounded-lg uppercase">Elutasít</button>
                    </div>
                </div>`).join('');
        };

        window.processApp = async (appIdStr, accept) => {
            const appRef = doc(db, 'artifacts', appId, 'public', 'data', 'applications', appIdStr);
            const appSnap = await getDoc(appRef);
            if (!appSnap.exists()) return;
            const aData = appSnap.data();
            try {
                if (accept) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'groups', aData.groupId), { members: arrayUnion(aData.userId) });
                    await setDoc(doc(db, 'artifacts', appId, 'users', aData.userId, 'profile', 'data'), { groups: arrayUnion(aData.groupId) }, { merge: true });
                    showMessage("Tag felvéve!");
                } else { showMessage("Jelentkezés elutasítva."); }
                await deleteDoc(appRef);
            } catch (err) { showMessage("Hiba!", "error"); }
        };

        window.saveLocation = async (e) => {
            e.preventDefault();
            if (!user || !selectedCoords) return;
            const name = document.getElementById('loc-name').value;
            const groupId = document.getElementById('loc-group-select').value;
            const id = "LOC-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'locations', id), {
                    id, name, groupId, lat: selectedCoords.lat, lng: selectedCoords.lng,
                    installed: false, creatorId: user.uid, creatorName: userData.username, 
                    voteCount: 0, voteTotal: 0, voters: [], status: 'voting', createdAt: Date.now()
                });
                showMessage("Helyszín beküldve szavazásra!");
                window.showView('view-map');
            } catch (err) { showMessage("Hiba!", "error"); }
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
        body { font-family: 'Space Mono', monospace; background: #050505; color: #eee; -webkit-tap-highlight-color: transparent; }
        .view { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        #map-container { height: calc(100vh - 350px); border-radius: 1.5rem; border: 1px solid #1f2937; }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .player-pulse { animation: pulse-ring 2s infinite; }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body class="min-h-screen pb-32">
    <div id="message-box" class="hidden"></div>

    <header class="p-6 border-b border-gray-800 bg-black/50 backdrop-blur-md sticky top-0 z-[1000]">
        <div class="flex justify-between items-start max-w-xl mx-auto">
            <div>
                <h1 class="text-xl font-bold text-green-500 tracking-tighter italic uppercase">Urbex Hunter <span class="text-[10px] bg-gray-800 px-2 py-0.5 rounded ml-2 text-gray-400">v9</span></h1>
                <p id="user-level" class="text-[9px] text-gray-500 font-bold uppercase tracking-widest italic">Betöltés...</p>
            </div>
            <div id="login-area" class="flex gap-2">
                <button onclick="window.loginWithGoogle()" class="bg-white text-black text-[10px] px-3 py-1.5 rounded-full font-bold">Google</button>
                <button onclick="window.loginAsDemo()" class="bg-blue-600 text-white text-[10px] px-3 py-1.5 rounded-full font-bold">Demo</button>
            </div>
            <div id="profile-area" class="hidden text-right">
                <p id="profile-name" class="text-xs font-bold text-white mb-1">Hunter</p>
                <p class="text-green-500 font-bold text-[10px]"><span id="user-score">0</span> PTS</p>
                <button onclick="window.logout()" class="text-[8px] text-red-500 uppercase font-bold mt-1">Kilépés</button>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        <div id="view-map" class="view">
            <div id="map-container" class="shadow-2xl"></div>
            <div class="mt-4 p-4 bg-gray-900/50 border border-gray-800 rounded-2xl text-[9px] text-gray-400 uppercase leading-relaxed font-bold">
                💡 Kattints a térképre új pont rögzítéséhez! Szavazás után el kell menned aktiválni a helyszínt.
            </div>
        </div>

        <div id="view-groups" class="view hidden">
            <h2 class="text-lg font-bold mb-6 italic text-blue-500 uppercase">Klánok & Csoportok</h2>
            <div class="mb-8 p-6 bg-gray-900 rounded-3xl border border-gray-800">
                <p class="text-[10px] text-gray-500 font-bold uppercase mb-4 font-bold">Új csoport alapítása</p>
                <input id="new-group-name" type="text" placeholder="Csoport neve" class="w-full bg-black border border-gray-800 p-3 rounded-xl text-xs mb-3 outline-none focus:border-blue-500 text-white">
                <input id="new-group-min" type="number" placeholder="Láthatósági küszöb (PTS)" class="w-full bg-black border border-gray-800 p-3 rounded-xl text-xs mb-3 outline-none focus:border-blue-500 text-white">
                <button onclick="window.createGroup()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-[10px] uppercase active:scale-95 transition-all font-bold">Létrehozás</button>
            </div>
            <div id="app-area" class="mb-8">
                <p class="text-[10px] text-gray-500 font-bold uppercase mb-3 font-bold">Jelentkezések kezelése</p>
                <div id="app-list"></div>
            </div>
            <p class="text-[10px] text-gray-500 font-bold uppercase mb-3 font-bold">Elérhető csoportok</p>
            <div id="group-list"></div>
        </div>

        <div id="view-group-detail" class="view hidden">
            <div class="flex justify-between items-center mb-6">
                <button onclick="window.showView('view-groups')" class="text-[10px] text-blue-400 uppercase font-bold flex items-center gap-1">
                    ← Vissza a listához
                </button>
                <button onclick="window.showGroupMembers()" class="bg-gray-800 p-2.5 rounded-xl border border-gray-700 active:scale-90 transition-all flex items-center gap-2">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span class="text-[9px] font-bold text-gray-400 uppercase">Tagok</span>
                </button>
            </div>
            <div class="bg-gray-900/40 p-2 rounded-3xl">
                <h2 id="detail-group-name" class="text-xl font-bold text-white mb-6 uppercase tracking-tight italic text-center">Csoport neve</h2>
                <p class="text-[10px] text-gray-500 font-bold uppercase mb-4 px-4 tracking-widest font-bold">Csoportos Helyszínek</p>
                <div id="detail-location-list" class="space-y-1"></div>
            </div>
        </div>

        <div id="member-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[2000] hidden flex items-center justify-center p-4">
            <div class="bg-gray-900 w-full max-w-sm rounded-[2.5rem] border border-gray-800 p-8 shadow-2xl relative">
                <button onclick="window.closeMemberModal()" class="absolute top-6 right-6 text-gray-500">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
                <h2 id="member-modal-title" class="text-lg font-bold text-white mb-6 uppercase italic tracking-tighter">Tagok</h2>
                <div id="modal-member-list" class="max-h-[60vh] overflow-y-auto space-y-2 pr-2"></div>
            </div>
        </div>

        <div id="view-add" class="view hidden">
            <div class="bg-gray-900 p-8 rounded-[2rem] border border-gray-800">
                <h2 class="text-xl font-bold text-green-500 mb-6 italic uppercase">Pont Rögzítése</h2>
                <p class="text-[10px] text-gray-400 mb-4">Pozíció: <span id="lat-val"></span>, <span id="lng-val"></span></p>
                <form onsubmit="window.saveLocation(event)" class="space-y-4">
                    <div>
                        <label class="text-[9px] text-gray-500 font-bold uppercase block mb-2 font-bold">Helyszín neve</label>
                        <input id="loc-name" required type="text" class="w-full bg-black border border-gray-800 p-4 rounded-xl text-xs text-white outline-none focus:border-green-500">
                    </div>
                    <div>
                        <label class="text-[9px] text-gray-500 font-bold uppercase block mb-2 font-bold">Melyik csoporthoz tartozzon?</label>
                        <select id="loc-group-select" class="w-full bg-black border border-gray-800 p-4 rounded-xl text-xs text-white outline-none focus:border-green-500">
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-black font-bold py-4 rounded-xl text-xs uppercase mt-4 active:scale-95 transition-all font-bold">Rögzítés</button>
                    <button type="button" onclick="window.showView('view-map')" class="w-full py-2 text-[9px] text-gray-500 uppercase font-bold">Mégse</button>
                </form>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 inset-x-0 bg-black/95 backdrop-blur-2xl border-t border-gray-800 p-6 pb-10 z-[1100]">
        <div class="max-w-xl mx-auto flex justify-around items-end">
            <button onclick="window.showView('view-map')" class="flex flex-col items-center gap-2 group active:scale-90 transition-all">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-500 group-focus:text-green-500 transition-colors"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span class="text-[8px] font-bold text-gray-500 uppercase tracking-widest font-bold">Térkép</span>
            </button>
            <button id="checkin-btn-outer" onclick="window.checkInNearby()" class="bg-green-600 p-6 rounded-full -mt-16 border-[8px] border-black shadow-2xl active:scale-95 transition-all hover:bg-green-500 group">
                <svg id="checkin-btn" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" />
                </svg>
            </button>
            <button onclick="window.showView('view-groups')" class="flex flex-col items-center gap-2 group active:scale-90 transition-all">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-500 group-focus:text-blue-500 transition-colors"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span class="text-[8px] font-bold text-gray-500 uppercase tracking-widest font-bold">Klánok</span>
            </button>
        </div>
    </nav>
</body>
</html>
