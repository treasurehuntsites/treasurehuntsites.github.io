<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Urbex Hunter v8 - Scanner Style Check-in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, updateDoc, arrayUnion, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config || '{"apiKey": "AIzaSyCE9HsgnhCbjGWkRUSYeWblSAJAj9Y-3lk", "authDomain": "urbex-hunter.firebaseapp.com", "projectId": "urbex-hunter"}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'urbex-hunter-v8'; 
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();
        const ADMIN_EMAIL = "jatszmabunker@gmail.com";

        const LEVELS = [
            { min: 0, name: "Zöldfülű", color: "#9ca3af" },
            { min: 100, name: "Vándor", color: "#60a5fa" },
            { min: 500, name: "Farkajáró", color: "#a855f7" },
            { min: 2000, name: "Legenda", color: "#ef4444" }
        ];

        const LOC_TYPES = {
            'Bunker': { icon: '🛡️', label: 'Bunker' },
            'Kórház': { icon: '🏥', label: 'Kórház' },
            'Gyár': { icon: '🏭', label: 'Gyár' },
            'Daru': { icon: '🏗️', label: 'Daru' },
            'Kastély': { icon: '🏰', label: 'Kastély' },
            'Torony': { icon: '🗼', label: 'Torony' },
            'Egyéb': { icon: '📍', label: 'Egyéb' }
        };

        // --- ÁLLAPOT ---
        let currentUser = null;
        let isSimulatedMode = false;
        let userData = { score: 0, groups: [], visited: [], username: "Felfedező" };
        let groups = [];
        let locations = [];
        let map = null;
        let markers = [];
        let selectedCoords = null;
        let currentLocId = null;
        let selectedGroupId = null;
        let checkInBtnInterval = null;

        // --- TÁROLÁS ---
        const memoryStorage = {};
        const safeSet = (key, value) => {
            try { localStorage.setItem(key, JSON.stringify(value)); } 
            catch (e) { memoryStorage[key] = value; }
        };
        const safeGet = (key) => {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : (memoryStorage[key] || null);
            } catch (e) { return memoryStorage[key] || null; }
        };

        const STORAGE_KEYS = {
            GROUPS: `urbex_v8_groups_${appId}`,
            LOCATIONS: `urbex_v8_locations_${appId}`,
            USER: `urbex_v8_user_${appId}`
        };

        const showMessage = (text, type = 'info') => {
            const box = document.getElementById('message-box');
            box.innerText = text;
            box.className = `fixed top-6 left-1/2 -translate-x-1/2 p-5 rounded-3xl shadow-2xl z-[9999] text-white font-bold text-sm transition-all border border-white/10 ${type === 'error' ? 'bg-red-600' : 'bg-green-600'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        };

        const syncData = () => {
            if (isSimulatedMode) {
                groups = safeGet(STORAGE_KEYS.GROUPS) || [];
                locations = safeGet(STORAGE_KEYS.LOCATIONS) || [];
                const localUser = safeGet(STORAGE_KEYS.USER);
                if (localUser) userData = localUser;
                document.getElementById('user-score').innerText = userData.score;
                renderGroups();
                updateMarkers();
                if (selectedGroupId) renderGroupDetails();
            }
        };

        const getRank = (score) => LEVELS.slice().reverse().find(l => score >= l.min) || LEVELS[0];
        
        const getDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        };

        // --- AUTH ---
        window.login = async () => {
            try { 
                isSimulatedMode = false;
                await signInWithPopup(auth, googleProvider); 
            } catch (e) { showMessage("Használd az Admin Tesztet!", "error"); }
        };

        window.simulateAdminLogin = async () => {
            isSimulatedMode = true;
            const adminUid = "ADMIN-999";
            currentUser = { uid: adminUid, email: ADMIN_EMAIL, displayName: "Admin" };
            
            if (!safeGet(STORAGE_KEYS.USER)) {
                safeSet(STORAGE_KEYS.USER, { score: 9999, groups: ["G-SANDBOX"], visited: [], username: "Bunker Admin" });
            }
            
            const localGroups = safeGet(STORAGE_KEYS.GROUPS) || [];
            if (localGroups.length === 0) {
                localGroups.push({ id: "G-SANDBOX", name: "Bázis Alapcsoport", ownerId: adminUid, members: [adminUid], totalGroupScore: 9999, createdAt: Date.now() });
                safeSet(STORAGE_KEYS.GROUPS, localGroups);
            }
            
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('admin-login-btn').classList.add('hidden');
            document.getElementById('profile-area').classList.remove('hidden');
            document.getElementById('admin-tag').classList.remove('hidden');
            
            syncData();
            showMessage("Admin mód aktív!", "success");
            window.showView('view-map');
        };

        const setupDataListeners = (uid) => {
            if (!uid || isSimulatedMode) return;
            onSnapshot(doc(db, 'artifacts', appId, 'users', uid, 'profile', 'data'), s => {
                if (s.exists()) { userData = s.data(); document.getElementById('user-score').innerText = userData.score; updateMarkers(); renderGroups(); }
            });
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'groups'), s => {
                groups = s.docs.map(d => d.data()); renderGroups(); if (selectedGroupId) renderGroupDetails();
            });
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'locations'), s => {
                locations = s.docs.map(d => d.data()); updateMarkers();
            });
        };

        // --- ACTIONS ---
        window.handleCreateGroup = async () => {
            const name = document.getElementById('modal-input-name').value.trim();
            if (!name) return showMessage("Név kötelező!", "error");
            if (!currentUser) return;

            const gid = "GRP-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            
            if (isSimulatedMode) {
                const localGroups = safeGet(STORAGE_KEYS.GROUPS) || [];
                localGroups.push({ id: gid, name, ownerId: currentUser.uid, members: [currentUser.uid], totalGroupScore: userData.score, createdAt: Date.now() });
                safeSet(STORAGE_KEYS.GROUPS, localGroups);
                userData.groups.push(gid);
                safeSet(STORAGE_KEYS.USER, userData);
                syncData();
                showMessage("Csoport rögzítve!");
            } else {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'groups', gid), { id: gid, name, ownerId: currentUser.uid, members: [currentUser.uid], totalGroupScore: userData.score, createdAt: Date.now() });
                    await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'data'), { groups: arrayUnion(gid) }, { merge: true });
                    showMessage("Sikeres mentés!");
                } catch (e) { showMessage("Firebase hiba!", "error"); }
            }
            document.getElementById('input-modal').classList.add('hidden');
            document.getElementById('modal-input-name').value = "";
        };

        window.saveLocation = async (e) => {
            e.preventDefault();
            const id = "LOC-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            const newLoc = {
                id, name: document.getElementById('loc-name').value, type: document.getElementById('loc-type-select').value,
                lat: selectedCoords.lat, lng: selectedCoords.lng, groups: [document.getElementById('loc-group').value],
                installed: false, creatorId: currentUser.uid, finalPoints: 50, createdAt: Date.now()
            };

            if (isSimulatedMode) {
                const locs = safeGet(STORAGE_KEYS.LOCATIONS) || [];
                locs.push(newLoc);
                safeSet(STORAGE_KEYS.LOCATIONS, locs);
                syncData();
                showMessage("Helyszín mentve!");
            } else {
                try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'locations', id), newLoc); showMessage("Helyszín beküldve!"); } catch (e) { showMessage("Hiba!"); }
            }
            window.showView('view-map');
        };

        window.triggerCheckIn = async () => {
            const loc = locations.find(l => l.id === currentLocId);
            if (!loc) return;
            const pts = Math.round(loc.finalPoints / 2);

            if (isSimulatedMode) {
                if (!loc.installed) { loc.installed = true; } 
                else {
                    if (userData.visited.includes(loc.id)) return showMessage("Már voltál itt!");
                    userData.score += pts; userData.visited.push(loc.id);
                    safeSet(STORAGE_KEYS.USER, userData);
                }
                safeSet(STORAGE_KEYS.LOCATIONS, locations);
                syncData();
                showMessage(`Bejelentkezve: +${pts} pont!`);
            } else {
                try {
                    const locRef = doc(db, 'artifacts', appId, 'public', 'data', 'locations', loc.id);
                    if (!loc.installed) { await updateDoc(locRef, { installed: true }); showMessage("Aktiválva!"); }
                    else {
                        if (userData.visited?.includes(loc.id)) return showMessage("Már voltál itt!");
                        await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'data'), { score: increment(pts), visited: arrayUnion(loc.id) }, { merge: true });
                        showMessage(`Check-in: +${pts} pont!`, "success");
                    }
                } catch (e) { showMessage("Hiba történt!", "error"); }
            }
            window.showView('view-map');
        };

        const updateMarkers = () => {
            if (!map) return;
            markers.forEach(m => m.remove());
            markers = [];
            const myGroups = userData.groups || [];
            locations.filter(l => l.groups?.some(g => myGroups.includes(g))).forEach(loc => {
                let color = "#f97316"; 
                if (userData.visited?.includes(loc.id)) color = "#22c55e"; 
                if (loc.creatorId === currentUser?.uid) color = "#3b82f6"; 
                const typeInfo = LOC_TYPES[loc.type] || LOC_TYPES['Egyéb'];
                const icon = L.divIcon({
                    className: 'custom-pin',
                    html: `<div class="marker-container" style="background:${color};"><span class="marker-icon">${typeInfo.icon}</span></div>`,
                    iconSize: [42, 42], iconAnchor: [21, 42]
                });
                const m = L.marker([loc.lat, loc.lng], { icon }).addTo(map);
                m.on('click', () => window.openDetails(loc.id));
                markers.push(m);
            });
        };

        window.showView = (id) => {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if (id === 'view-map' && map) setTimeout(() => map.invalidateSize(), 200);
        };

        window.openDetails = (id) => {
            currentLocId = id;
            const loc = locations.find(l => l.id === id);
            if (!loc) return;
            document.getElementById('det-name').innerText = loc.name;
            document.getElementById('det-points').innerText = `+${Math.round(loc.finalPoints/2)} PTS`;
            window.showView('view-details');
            checkDistanceToCurrent();
        };

        const checkDistanceToCurrent = () => {
            const btn = document.getElementById('quick-checkin-btn');
            if (!currentLocId || !currentUser) { btn.classList.add('hidden'); return; }
            const loc = locations.find(l => l.id === currentLocId);
            if (isSimulatedMode || currentUser.email === ADMIN_EMAIL) { btn.classList.remove('hidden'); return; }
            navigator.geolocation.getCurrentPosition((pos) => {
                const dist = getDistance(pos.coords.latitude, pos.coords.longitude, loc.lat, loc.lng);
                if (dist <= 50) btn.classList.remove('hidden');
                else btn.classList.add('hidden');
            });
        };

        const renderGroups = () => {
            const list = document.getElementById('group-list');
            list.innerHTML = groups.map(g => `
                <div onclick="window.openGroup('${g.id}')" class="bg-gray-800 p-6 rounded-[2.5rem] border border-gray-700 mb-4 flex justify-between items-center active:scale-95 transition-all shadow-xl">
                    <div class="font-bold">
                        <h3 class="text-white uppercase italic">${g.name}</h3>
                        <p class="text-[9px] text-gray-500 uppercase mt-1">TAGOK: ${g.members?.length || 0}</p>
                    </div>
                    <p class="text-[10px] text-green-500 font-bold">${g.totalGroupScore || 0} PTS</p>
                </div>
            `).join('');
        };

        window.openGroup = (gid) => {
            selectedGroupId = gid;
            window.showView('view-group-details');
            renderGroupDetails();
        };

        const renderGroupDetails = () => {
            const group = groups.find(g => g.id === selectedGroupId);
            if (!group) return;
            document.getElementById('group-det-name').innerText = group.name;
            document.getElementById('group-det-score').innerText = `${group.totalGroupScore || 0} összpont`;
            document.getElementById('member-list').innerHTML = (group.members || []).map(mUid => {
                const isMe = mUid === currentUser?.uid;
                const score = isMe ? userData.score : 0;
                const rank = getRank(score);
                return `<div class="flex justify-between items-center p-4 bg-gray-900/60 rounded-2xl border border-gray-800">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center font-bold">${isMe ? '👤' : '👥'}</div>
                        <div>
                            <p class="text-xs font-bold text-white">${isMe ? 'Én' : 'Urbexer'}</p>
                            <p class="text-[9px] font-bold uppercase" style="color:${rank.color}">${rank.name}</p>
                        </div>
                    </div>
                    <p class="text-xs font-bold text-green-500">${score} PTS</p>
                </div>`;
            }).join('');
        };

        window.addEventListener('load', () => {
            map = L.map('map-container', { zoomControl: false, attributionControl: false }).setView([47.4979, 19.0402], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            map.on('click', e => {
                if (!currentUser) return showMessage("Lépj be!", "error");
                selectedCoords = e.latlng;
                const myGroups = groups.filter(g => g.members.includes(currentUser.uid));
                if (myGroups.length === 0) { showMessage("Előbb csatlakozz egy csoporthoz!", "error"); window.showView('view-groups'); return; }
                document.getElementById('loc-group').innerHTML = myGroups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
                window.showView('view-add');
            });
            document.getElementById('loc-type-select').innerHTML = Object.entries(LOC_TYPES).map(([k,v]) => `<option value="${k}">${v.icon} ${v.label}</option>`).join('');
            if (!checkInBtnInterval) checkInBtnInterval = setInterval(checkDistanceToCurrent, 3000);
        });

        onAuthStateChanged(auth, u => { if (u && !isSimulatedMode) { currentUser = u; document.getElementById('login-btn').classList.add('hidden'); document.getElementById('profile-area').classList.remove('hidden'); setupDataListeners(u.uid); } });
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
        body { font-family: 'Space Mono', monospace; background: #080808; color: #f3f4f6; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .view { height: 100vh; overflow-y: auto; padding-bottom: 160px; animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        #map-container { height: calc(100vh - 180px); border-radius: 3rem; border: 2px solid #1f2937; margin: 1rem; box-shadow: inset 0 0 40px rgba(0,0,0,0.8); }
        .marker-container { width: 42px; height: 42px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .marker-icon { transform: rotate(45deg); font-size: 20px; }
        ::-webkit-scrollbar { display: none; }
        select, input { background: #000; border: 1px solid #1f2937; color: #fff !important; border-radius: 1.5rem; padding: 1rem; width: 100%; outline: none; }
        
        /* QR SCANNER STYLE CHECK-IN BUTTON */
        .btn-scanner { 
            background: #22c55e; 
            color: #fff; 
            width: 72px; 
            height: 72px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.6); 
            border: 4px solid #fff;
            animation: pulse-green 2s infinite;
            transition: transform 0.2s active;
            z-index: 1500;
        }
        .btn-scanner:active { transform: scale(0.9); }
        @keyframes pulse-green { 
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 
            70% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } 
        }
    </style>
</head>
<body class="max-w-md mx-auto relative h-screen">
    <div id="message-box" class="hidden"></div>

    <header class="p-6 bg-black/80 backdrop-blur-xl border-b border-gray-800 sticky top-0 z-[1000] flex justify-between items-center">
        <div onclick="location.reload()">
            <h1 class="text-xl font-bold text-green-500 uppercase tracking-tighter italic leading-none">Urbex Hunter</h1>
            <p class="text-[8px] text-gray-500 font-bold uppercase mt-1">v8 Alpha / Final Flow</p>
        </div>
        <div class="flex items-center gap-3">
            <button id="admin-login-btn" onclick="window.simulateAdminLogin()" class="text-[9px] text-blue-500 uppercase font-bold border-b border-blue-900 leading-none">Admin Teszt</button>
            <button id="login-btn" onclick="window.login()" class="bg-white text-black px-4 py-2 rounded-full text-[10px] font-bold">LOGIN</button>
            <div id="profile-area" class="hidden flex items-center gap-4">
                <div id="user-score" class="text-2xl font-bold text-green-500">0</div>
                <div class="w-8 h-8 rounded-full bg-green-500/20 border border-green-500 flex items-center justify-center text-[10px] font-bold text-green-500">UH</div>
            </div>
        </div>
    </header>

    <main>
        <div id="view-map" class="view">
            <div id="map-container"></div>
            <p class="text-center text-[10px] text-gray-500 uppercase font-bold mt-2">Kattints a térképre pont rögzítéséhez</p>
        </div>

        <div id="view-groups" class="view hidden p-6">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-lg font-bold uppercase italic font-bold text-white">Közösségek</h2>
                <button onclick="document.getElementById('input-modal').classList.remove('hidden')" class="bg-green-600 text-black text-[10px] px-6 py-3 rounded-2xl font-bold uppercase active:scale-95 transition-transform">+ Új Csoport</button>
            </div>
            <div id="group-list" class="space-y-4"></div>
        </div>

        <div id="view-group-details" class="view hidden p-6">
            <button onclick="window.showView('view-groups')" class="text-[10px] text-gray-500 uppercase font-bold mb-6">← Vissza</button>
            <h2 id="group-det-name" class="text-2xl font-bold text-white uppercase italic mb-1">...</h2>
            <div class="bg-gray-900/50 p-6 rounded-[2.5rem] border border-gray-800 mb-8 shadow-xl">
                <p id="group-det-score" class="text-3xl font-bold text-green-500 font-bold tracking-tighter">0 összpont</p>
            </div>
            <h3 class="text-xs font-bold text-white uppercase mb-4 tracking-widest border-b border-gray-800 pb-2">Tagok</h3>
            <div id="member-list" class="space-y-3"></div>
        </div>

        <div id="view-details" class="view hidden fixed inset-0 z-[2000] bg-black p-8">
            <button onclick="window.showView('view-map')" class="text-[10px] text-gray-400 font-bold uppercase mb-8">← Bezárás</button>
            <div class="bg-gray-900 border border-gray-800 p-8 rounded-[3.5rem] shadow-2xl">
                <p class="text-[10px] text-blue-400 font-bold uppercase mb-2">Helyszín Adatlap</p>
                <h2 id="det-name" class="text-3xl font-bold text-white uppercase italic mb-6 leading-none">...</h2>
                <div id="det-points" class="inline-block bg-green-600 text-black font-bold px-4 py-1 rounded-xl text-xs mb-10 tracking-widest">0 PTS</div>
                <p class="text-[10px] text-gray-500 uppercase italic">A check-in gomb a navigáció felett jelenik meg, ha közel vagy!</p>
            </div>
        </div>

        <div id="view-add" class="view hidden p-6 font-bold">
            <div class="bg-gray-900 p-8 rounded-[3.5rem] border border-gray-800 shadow-2xl">
                <h2 class="text-xl font-bold text-green-500 uppercase italic mb-6 leading-none">Pont Rögzítése</h2>
                <form onsubmit="window.saveLocation(event)" class="space-y-5">
                    <input id="loc-name" type="text" placeholder="Megnevezés" required>
                    <select id="loc-type-select"></select>
                    <select id="loc-group"></select>
                    <button type="submit" class="w-full py-5 bg-green-600 text-black font-bold rounded-2xl uppercase mt-6 shadow-xl font-bold">MENTÉS ÉS BEZÁRÁS</button>
                </form>
            </div>
        </div>
    </main>

    <!-- FLOATING SCANNER BUTTON -->
    <div id="quick-checkin-btn" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 z-[2000]">
        <button onclick="window.triggerCheckIn()" class="btn-scanner">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
        </button>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 inset-x-0 bg-black/95 border-t border-gray-800 p-6 pb-10 z-[1000] flex justify-around shadow-2xl">
        <button onclick="window.showView('view-map')" class="flex flex-col items-center gap-1 group">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-500 group-focus:text-green-500"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span class="text-[8px] font-bold text-gray-500 uppercase tracking-widest">Térkép</span>
        </button>
        
        <!-- Center spacer for floating button -->
        <div class="w-16"></div>

        <button onclick="window.showView('view-groups')" class="flex flex-col items-center gap-1 group">
