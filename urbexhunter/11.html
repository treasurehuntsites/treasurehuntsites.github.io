<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbex Hunter v8 - Group Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged,
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc, 
            collection, 
            onSnapshot, 
            updateDoc, 
            arrayUnion, 
            increment,
            query,
            where,
            addDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCE9HsgnhCbjGWkRUSYeWblSAJAj9Y-3lk",
            authDomain: "urbex-hunter.firebaseapp.com",
            projectId: "urbex-hunter",
            storageBucket: "urbex-hunter.firebasestorage.app",
            messagingSenderId: "23703144828",
            appId: "1:23703144828:web:016a96cd6c1fe01ab5fcf9"
        };

        const appId = "urbex-hunter-v8-groups"; 
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();
        const ADMIN_EMAIL = "jatszmabunker@gmail.com";

        const LEVELS = [
            { min: 0, name: "Zöldfülű Betörő", maxScan: 100 },
            { min: 100, name: "Rozsdás Vándor", maxScan: 250 },
            { min: 300, name: "Falkajáró", maxScan: 500 },
            { min: 500, name: "Ipari Alpinista", maxScan: 9999 }
        ];

        let user = null;
        let currentUserData = { score: 0, groups: [] };
        let groups = [];
        let allVisibleLocations = []; 
        let map = null;
        let markers = [];
        let unsubscribeList = [];
        let videoStream = null;
        let selectedCoords = null;
        let pendingScanData = null;

        const getLevelInfo = (score) => LEVELS.slice().reverse().find(l => score >= l.min) || LEVELS[0];

        const showMessage = (text, type = 'info') => {
            const box = document.getElementById('message-box');
            box.innerText = text;
            box.className = `fixed top-4 left-1/2 -translate-x-1/2 p-4 rounded shadow-2xl z-[9000] text-white font-bold text-center text-xs transition-all ${type === 'error' ? 'bg-red-600' : 'bg-green-600'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        };

        const getDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        };

        const getCurrentPos = () => new Promise((res, rej) => {
            navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true });
        });

        window.showView = (viewId) => {
            if (!user && viewId !== 'view-map') {
                showMessage("A funkció eléréséhez be kell jelentkezned!", "error");
                return;
            }
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(viewId)?.classList.remove('hidden');
            if (viewId === 'view-map' && map) setTimeout(() => map.invalidateSize(), 200);
            if (viewId !== 'view-scan') stopCamera();
        };

        const stopCamera = () => { if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; } };

        window.login = async () => {
            try { await signInWithPopup(auth, googleProvider); } catch (e) { showMessage("Hiba a belépésnél!", "error"); }
        };
        window.logout = () => signOut(auth).then(() => location.reload());

        window.createGroup = async () => {
            if (!user) return login();
            const name = prompt("Csoport neve:");
            if (!name) return;
            try {
                const groupRef = await addDoc(collection(db, 'artifacts', appId, 'groups'), {
                    name, owner: user.uid, members: [user.uid], createdAt: Date.now()
                });
                await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), {
                    groups: arrayUnion(groupRef.id)
                });
                showMessage("Csoport létrehozva!");
            } catch (e) { showMessage("Hiba!", "error"); }
        };

        window.saveNewLocation = async (e) => {
            e.preventDefault();
            if (!user) return;
            const groupId = document.getElementById('loc-group-select').value;
            const name = document.getElementById('loc-name').value.trim();
            if (!groupId || !name || !selectedCoords) return showMessage("Hiányzó adatok!", "error");

            const locId = "LOC-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            try {
                await setDoc(doc(db, 'artifacts', appId, 'groups', groupId, 'locations', locId), {
                    id: locId, groupId, name, lat: selectedCoords.lat, lng: selectedCoords.lng,
                    creatorId: user.uid, creatorName: currentUserData.username || user.displayName,
                    installed: false, finalPoints: 50, createdAt: Date.now()
                });
                showMessage("Helyszín rögzítve a csoportba!");
                window.showView('view-map');
            } catch (e) { showMessage("Hiba mentéskor!", "error"); }
        };

        window.startScan = async () => {
            if (!user) return login();
            window.showView('view-scan');
            const video = document.getElementById('qr-video');
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = videoStream;
                video.play();
                requestAnimationFrame(tick);
            } catch (e) { showMessage("Kamera hiba!", "error"); window.showView('view-map'); }
        };

        const tick = () => {
            const video = document.getElementById('qr-video');
            if (video?.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement("canvas");
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0);
                const code = window.jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data, canvas.width, canvas.height);
                if (code) { handleScanResult(code.data); return; }
            }
            if (videoStream) requestAnimationFrame(tick);
        };

        const handleScanResult = async (data) => {
            stopCamera();
            const [gId, lId] = data.split('|');
            if (!gId || !lId) { showMessage("Érvénytelen kód!", "error"); return window.showView('view-map'); }
            
            pendingScanData = { groupId: gId, locId: lId };
            const locSnap = await getDoc(doc(db, 'artifacts', appId, 'groups', gId, 'locations', lId));
            if (!locSnap.exists()) { showMessage("Helyszín nem található!", "error"); return window.showView('view-map'); }
            
            const loc = locSnap.data();
            const modal = document.getElementById('confirm-modal');
            document.getElementById('modal-text').innerText = loc.installed ? `Pontszerzés: ${loc.name}` : `Helyszín Aktiválása / Rablása: ${loc.name}`;
            modal.classList.remove('hidden');
        };

        window.confirmAction = async (confirmed) => {
            document.getElementById('confirm-modal').classList.add('hidden');
            if (!confirmed) return window.showView('view-map');
            const { groupId, locId } = pendingScanData;
            const isAdmin = user.email === ADMIN_EMAIL;

            try {
                const locRef = doc(db, 'artifacts', appId, 'groups', groupId, 'locations', locId);
                const locSnap = await getDoc(locRef);
                const loc = locSnap.data();

                if (!isAdmin) {
                    const pos = await getCurrentPos();
                    const dist = getDistance(pos.coords.latitude, pos.coords.longitude, loc.lat, loc.lng);
                    if (dist > 20) return showMessage(`Túl messze vagy! (${Math.round(dist)}m > 20m)`, "error");
                }

                if (!loc.installed) {
                    await updateDoc(locRef, { installed: true, creatorId: user.uid, creatorName: currentUserData.username || user.displayName });
                    showMessage("Sikeres művelet!");
                } else {
                    if (currentUserData.visited?.includes(locId)) return showMessage("Már bejelentkeztél itt!");
                    const pts = Math.round(loc.finalPoints / 2);
                    await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), { score: increment(pts), visited: arrayUnion(locId) });
                    await updateDoc(doc(db, 'artifacts', appId, 'users', loc.creatorId, 'profile', 'data'), { score: increment(5) });
                    showMessage(`Gratulálunk! +${pts} pont.`);
                }
                window.showView('view-map');
            } catch (e) { showMessage("Hiba!", "error"); }
        };

        const initMap = () => {
            map = L.map('map-container', { zoomControl: false }).setView([47.4979, 19.0402], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            map.on('click', e => {
                if (!user) { showMessage("Belépés szükséges!", "error"); return; }
                selectedCoords = e.latlng;
                document.getElementById('add-coords').innerText = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
                window.showView('view-add');
            });
        };

        const updateUI = () => {
            if (user) {
                const info = getLevelInfo(currentUserData.score);
                document.getElementById('u-score').innerText = currentUserData.score;
                document.getElementById('u-level').innerText = info.name;
                document.getElementById('u-name').innerText = currentUserData.username || user.displayName;
                document.getElementById('logged-in-info').classList.remove('hidden');
                document.getElementById('logged-out-btn').classList.add('hidden');
            } else {
                document.getElementById('u-name').innerText = "Vendég";
                document.getElementById('u-level').innerText = "Belépés szükséges a mentéshez";
                document.getElementById('logged-in-info').classList.add('hidden');
                document.getElementById('logged-out-btn').classList.remove('hidden');
            }
            
            const select = document.getElementById('loc-group-select');
            select.innerHTML = groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');

            const list = document.getElementById('spot-list');
            list.innerHTML = allVisibleLocations.map(loc => `
                <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 mb-2">
                    <div class="flex justify-between items-start">
                        <h4 class="font-bold text-white text-xs uppercase">${loc.name}</h4>
                        <span class="text-[8px] ${loc.installed ? 'text-green-500' : 'text-orange-500 animate-pulse'} font-bold">${loc.installed ? 'AKTÍV' : 'TELEPÍTÉSRE VÁR'}</span>
                    </div>
                    <p class="text-[8px] text-gray-500 uppercase mt-1">Csoport: ${loc.groupName}</p>
                    ${user && loc.creatorId === user.uid ? `<button onclick="window.showQR('${loc.groupId}', '${loc.id}')" class="mt-2 w-full py-1.5 bg-blue-600 rounded-lg text-[8px] font-bold uppercase">QR Kód</button>` : ''}
                </div>
            `).join('');
            updateMarkers();
        };

        window.showQR = (gId, lId) => {
            window.showView('view-qr');
            const canvas = document.getElementById('qr-canvas');
            canvas.innerHTML = "";
            new QRCode(canvas, { text: `${gId}|${lId}`, width: 200, height: 200 });
        };

        const updateMarkers = () => {
            markers.forEach(m => m.remove());
            markers = [];
            allVisibleLocations.forEach(loc => {
                const color = loc.installed ? '#22c55e' : '#f97316';
                const m = L.circle([loc.lat, loc.lng], { color, radius: 20, fillOpacity: 0.8 }).addTo(map);
                m.bindPopup(`<b class="text-black">${loc.name}</b>`);
                markers.push(m);
            });
        };

        const syncData = async (u) => {
            unsubscribeList.forEach(un => un());
            unsubscribeList = [];
            const profileRef = doc(db, 'artifacts', appId, 'users', u.uid, 'profile', 'data');
            const pSnap = await getDoc(profileRef);
            if (!pSnap.exists()) await setDoc(profileRef, { score: 0, groups: [], username: u.displayName });

            unsubscribeList.push(onSnapshot(profileRef, async snap => {
                currentUserData = snap.data();
                const groupIds = currentUserData.groups || [];
                const loadedGroups = [];
                for (const gId of groupIds) {
                    const gSnap = await getDoc(doc(db, 'artifacts', appId, 'groups', gId));
                    if (gSnap.exists()) {
                        const gData = { id: gId, ...gSnap.data() };
                        loadedGroups.push(gData);
                        const locUnsub = onSnapshot(collection(db, 'artifacts', appId, 'groups', gId, 'locations'), s => {
                            const groupLocs = s.docs.map(d => ({ ...d.data(), groupName: gData.name }));
                            allVisibleLocations = allVisibleLocations.filter(l => l.groupId !== gId).concat(groupLocs);
                            updateUI();
                        });
                        unsubscribeList.push(locUnsub);
                    }
                }
                groups = loadedGroups;
                updateUI();
            }));
        };

        onAuthStateChanged(auth, u => {
            user = u;
            if (u) syncData(u);
            else {
                allVisibleLocations = [];
                groups = [];
                updateUI();
            }
        });

        window.addEventListener('load', initMap);
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
        body { font-family: 'Space Mono', monospace; background: #080808; color: #eee; }
        .view { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        #map-container { height: calc(100vh - 280px); border-radius: 1.5rem; }
        #qr-canvas img { margin: 0 auto; padding: 10px; background: white; border-radius: 1rem; }
        /* Map fix to be behind header/nav */
        .leaflet-container { z-index: 10; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col">

    <div id="message-box" class="hidden"></div>

    <!-- Fő App Struktúra (Mindig látható) -->
    <div id="app-content" class="flex-1 flex flex-col">
        <header class="p-6 border-b border-gray-800 flex justify-between items-center bg-black/50 backdrop-blur-md sticky top-0 z-[1000]">
            <div class="flex-1">
                <h2 id="u-name" class="text-xs font-bold text-white uppercase italic">Vendég</h2>
                <p id="u-level" class="text-[7px] text-gray-500 font-bold uppercase tracking-widest">Belépés szükséges</p>
            </div>
            
            <div id="logged-in-info" class="hidden text-right flex flex-col items-end">
                <div class="text-green-500 font-bold text-xs"><span id="u-score">0</span> PTS</div>
                <button onclick="window.logout()" class="text-[7px] text-red-500 uppercase font-bold underline mt-1">Kilépés</button>
            </div>

            <button id="logged-out-btn" onclick="window.login()" class="bg-white text-black px-4 py-2 rounded-xl text-[10px] font-bold flex items-center gap-2 active:scale-95 transition-transform shadow-lg">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_light.svg" width="14"> Belépés
            </button>
        </header>

        <main class="flex-1 p-4 overflow-y-auto pb-32">
            <!-- Térkép (Mindig látható alapértelmezettként) -->
            <div id="view-map" class="view">
                <div id="map-container" class="border border-gray-800 shadow-2xl"></div>
                <div class="mt-4 p-4 bg-gray-900/50 rounded-2xl text-[8px] text-gray-500 italic uppercase leading-relaxed text-center">
                    Urbex Hunter v8 - Group Edition <br> Pontos koordináták csak tagoknak.
                </div>
            </div>

            <!-- Lista -->
            <div id="view-list" class="view hidden">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xs font-bold uppercase tracking-widest italic text-green-500">Helyszíneid</h3>
                    <button onclick="window.createGroup()" class="text-[8px] bg-gray-800 px-3 py-1 rounded-full font-bold uppercase border border-gray-700">+ Új Csoport</button>
                </div>
                <div id="spot-list"></div>
            </div>

            <!-- Add Helyszín -->
            <div id="view-add" class="view hidden">
                <div class="bg-gray-900 p-6 rounded-3xl border border-gray-800">
                    <h3 class="text-sm font-bold text-green-500 mb-6 uppercase italic">Helyszín Rögzítése</h3>
                    <form onsubmit="window.saveNewLocation(event)" class="space-y-4">
                        <div>
                            <label class="text-[8px] text-gray-500 uppercase font-bold mb-1 block">Csoport kiválasztása</label>
                            <select id="loc-group-select" class="w-full bg-black border border-gray-800 p-3 rounded-xl text-[10px] text-white outline-none"></select>
                        </div>
                        <div>
                            <label class="text-[8px] text-gray-500 uppercase font-bold mb-1 block">Név</label>
                            <input id="loc-name" type="text" required placeholder="Pl: Elhagyatott Kórház" class="w-full bg-black border border-gray-800 p-3 rounded-xl text-[10px] text-white outline-none">
                        </div>
                        <p class="text-[8px] text-blue-400 font-bold italic">Koordináták: <span id="add-coords">...</span></p>
                        <button type="submit" class="w-full py-4 bg-green-600 text-black font-bold rounded-xl uppercase text-[10px] tracking-widest active:scale-95 transition-all">Mentés</button>
                    </form>
                </div>
            </div>

            <!-- Scan -->
            <div id="view-scan" class="view hidden flex flex-col items-center justify-center pt-10">
                <div class="relative w-64 h-64 bg-black rounded-3xl overflow-hidden border-2 border-green-500/50 shadow-[0_0_30px_rgba(34,197,94,0.2)]">
                    <video id="qr-video" class="w-full h-full object-cover"></video>
                </div>
                <p class="mt-6 text-[10px] text-green-500 animate-pulse font-bold uppercase tracking-widest">Szkennelés...</p>
            </div>

            <!-- QR Megjelenítés -->
            <div id="view-qr" class="view hidden text-center">
                <h3 class="text-sm font-bold text-white mb-8 uppercase italic">Telepítő kód</h3>
                <div id="qr-canvas" class="mb-10"></div>
                <button onclick="window.showView('view-list')" class="w-full py-4 bg-gray-800 rounded-xl text-[10px] font-bold uppercase">Vissza</button>
            </div>
        </main>

        <!-- Navigáció (Mindig látható) -->
        <nav class="fixed bottom-0 inset-x-0 bg-black/90 backdrop-blur-xl border-t border-gray-800 p-6 pb-10 flex justify-around items-end z-[1000]">
            <button onclick="window.showView('view-map')" class="flex flex-col items-center gap-2 group">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-600 group-hover:text-green-500 transition-colors"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span class="text-[7px] font-bold text-gray-600 uppercase tracking-widest">Térkép</span>
            </button>
            
            <button onclick="window.startScan()" class="bg-green-600 p-5 rounded-full -mt-12 border-[6px] border-black shadow-xl active:scale-90 transition-transform">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h10v10H7z"/></svg>
            </button>

            <button onclick="window.showView('view-list')" class="flex flex-col items-center gap-2 group">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-600 group-hover:text-green-500 transition-colors"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
                <span class="text-[7px] font-bold text-gray-600 uppercase tracking-widest">Helyek</span>
            </button>
        </nav>
    </div>

    <!-- Megerősítő Modal -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-black/90 z-[9999] flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-gray-900 border border-gray-800 p-8 rounded-[2rem] w-full max-w-xs text-center shadow-2xl">
            <h4 class="text-xs font-bold text-green-500 uppercase italic mb-4">Megerősítés</h4>
            <p id="modal-text" class="text-[10px] text-white font-bold mb-8 uppercase leading-relaxed">...</p>
            <div class="flex gap-2">
                <button onclick="window.confirmAction(true)" class="flex-1 py-3 bg-green-600 text-black font-bold rounded-xl text-[9px] uppercase">Mehet</button>
                <button onclick="window.confirmAction(false)" class="flex-1 py-3 bg-gray-800 text-gray-400 font-bold rounded-xl text-[9px] uppercase">Mégse</button>
            </div>
        </div>
    </div>

</body>
</html>
