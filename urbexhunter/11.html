<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Urbex Hunter v9 - Ranks & Categories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCE9HsgnhCbjGWkRUSYeWblSAJAj9Y-3lk",
            authDomain: "urbex-hunter.firebaseapp.com",
            projectId: "urbex-hunter",
            storageBucket: "urbex-hunter.firebasestorage.app",
            messagingSenderId: "23703144828",
            appId: "1:23703144828:web:016a96cd6c1fe01ab5fcf9",
            measurementId: "G-NWN15EC2RW"
        };

        const appId = "urbex-hunter-v9"; 
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();
        const ADMIN_EMAIL = "jatszmabunker@gmail.com";

        // --- KATEGÓRIÁK ---
        const CATEGORIES = {
            'factory': { label: 'Gyár', icon: '🏭', color: '#94a3b8' },
            'hospital': { label: 'Kórház', icon: '🏥', color: '#ef4444' },
            'bunker': { label: 'Bunker', icon: '🛡️', color: '#16a34a' },
            'crane': { label: 'Daru', icon: '🏗️', color: '#f59e0b' },
            'villa': { label: 'Kastély', icon: '🏰', color: '#a855f7' },
            'other': { label: 'Egyéb', icon: '📍', color: '#6366f1' }
        };

        // --- RANGOK ÉS SZINTEK ---
        const LEVELS = [
            { min: 0, name: "Zöldfülű Betörő" },
            { min: 100, name: "Rozsdás Vándor" },
            { min: 350, name: "Falkajáró" },
            { min: 750, name: "Ipari Alpinista" },
            { min: 1500, name: "Beton-guru" },
            { min: 3000, name: "Urbex Legenda" }
        ];

        let user = null;
        let userData = { score: 0, groups: [], visited: [], username: "" };
        let groups = [];
        let locations = [];
        let map = null;
        let markers = [];
        let selectedCoords = null;
        let unsubscribeList = [];

        const getLevelInfo = (score) => LEVELS.slice().reverse().find(l => score >= l.min) || LEVELS[0];
        
        const showMessage = (text, type = 'info') => {
            const box = document.getElementById('message-box');
            box.innerText = text;
            box.className = `fixed top-6 left-1/2 -translate-x-1/2 p-4 rounded-2xl shadow-2xl z-[9000] text-white font-bold text-center text-[10px] uppercase tracking-widest transition-all ${type === 'error' ? 'bg-red-600 shadow-red-500/30' : 'bg-green-600 shadow-green-500/30'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3500);
        };

        const getDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        };

        // --- GPS ÉS HAPTIC ---
        const vibrate = (ms) => { if (navigator.vibrate) navigator.vibrate(ms); };

        // --- OFFLINE FIGYELŐ ---
        window.addEventListener('offline', () => showMessage("Kapcsolat megszakadt! Offline mód.", "error"));
        window.addEventListener('online', () => showMessage("Visszatértél az online világba!", "info"));

        // --- UI NAVIGÁCIÓ ---
        window.showView = (viewId) => {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            const target = document.getElementById(viewId);
            if (target) target.classList.remove('hidden');
            if (viewId === 'view-map' && map) setTimeout(() => map.invalidateSize(), 200);
            vibrate(10);
        };

        window.login = async () => { try { await signInWithPopup(auth, googleProvider); } catch (err) { showMessage("Belépési hiba!", "error"); } };
        window.logout = async () => { await signOut(auth); location.reload(); };

        window.createGroup = async () => {
            const name = prompt("Új csoport neve:");
            if (!name) return;
            const gid = "GRP-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'groups', gid), {
                    id: gid, name, ownerId: user.uid, ownerName: userData.username || user.displayName,
                    members: [user.uid], requests: [], createdAt: Date.now()
                });
                await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), { groups: arrayUnion(gid) });
                showMessage("Csoport rögzítve!");
            } catch (e) { showMessage("Hiba!", "error"); }
        };

        window.requestJoin = async (gid) => {
            const reason = prompt("Indoklás az adminnak:");
            if (!reason) return;
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'groups', gid), {
                    requests: arrayUnion({ uid: user.uid, name: userData.username || user.displayName, reason })
                });
                showMessage("Kérelem elküldve!");
            } catch (e) { showMessage("Hiba!", "error"); }
        };

        window.saveLocation = async (e) => {
            e.preventDefault();
            const name = document.getElementById('loc-name').value;
            const gid = document.getElementById('loc-group').value;
            const category = document.getElementById('loc-category').value;
            if (!name || !gid || !category) return showMessage("Minden mező kötelező!", "error");

            const id = "LOC-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'locations', id), {
                    id, name, category,
                    lat: selectedCoords.lat, lng: selectedCoords.lng,
                    groups: [gid], installed: false, creatorId: user.uid,
                    creatorName: userData.username || user.displayName,
                    finalPoints: 50, createdAt: Date.now()
                });
                vibrate(50);
                showMessage("Spot rögzítve!");
                window.showView('view-map');
            } catch (e) { showMessage("Hiba a mentésnél!", "error"); }
        };

        window.checkIn = async (locId) => {
            const loc = locations.find(l => l.id === locId);
            if (!loc) return;
            
            // Távolság ellenőrzés (admin átlépheti)
            if (user.email !== ADMIN_EMAIL) {
                try {
                    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej));
                    const dist = getDistance(pos.coords.latitude, pos.coords.longitude, loc.lat, loc.lng);
                    if (dist > 35) return showMessage(`Túl messze vagy! (${Math.round(dist)}m)`, "error");
                } catch (e) { return showMessage("GPS szükséges!", "error"); }
            }

            try {
                const userRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
                const locRef = doc(db, 'artifacts', appId, 'public', 'data', 'locations', locId);

                if (!loc.installed) {
                    await updateDoc(locRef, { installed: true, creatorId: user.uid, creatorName: userData.username || user.displayName });
                    vibrate([100, 50, 100]);
                    showMessage("Spot aktiválva! Ez mostantól a tiéd.");
                } else {
                    if (userData.visited?.includes(locId)) return showMessage("Itt már jártál!");
                    await updateDoc(userRef, { score: increment(25), visited: arrayUnion(locId) });
                    await setDoc(doc(db, 'artifacts', appId, 'users', loc.creatorId, 'profile', 'data'), { score: increment(5) }, { merge: true });
                    vibrate(200);
                    showMessage("+25 Pont begyűjtve!");
                }
            } catch (e) { showMessage("Szerver hiba!", "error"); }
        };

        const updateMarkers = () => {
            if (!map) return;
            markers.forEach(m => m.remove());
            markers = [];
            const myGroupIds = userData.groups || [];
            const visibleSpots = locations.filter(loc => loc.groups.some(gid => myGroupIds.includes(gid)));

            visibleSpots.forEach(loc => {
                const cat = CATEGORIES[loc.category] || CATEGORIES.other;
                const isVisited = userData.visited?.includes(loc.id);
                const color = isVisited ? '#4b5563' : (loc.installed ? cat.color : '#f97316');
                
                // 25m Sugarú kör
                const circle = L.circle([loc.lat, loc.lng], { 
                    color, fillColor: color, fillOpacity: 0.15, weight: 1.5, radius: 25 
                }).addTo(map);
                
                // Központi Pin ikonnal
                const pinIcon = L.divIcon({
                    html: `<div class="marker-pin" style="background:${color}">${cat.icon}</div>`,
                    className: 'custom-div-icon',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                const marker = L.marker([loc.lat, loc.lng], { icon: pinIcon }).addTo(map);
                marker.bindPopup(`<div class="p-2 text-black"><b class="uppercase">${loc.name}</b><br><span class="text-[9px]">${cat.label}</span></div>`);
                
                markers.push(circle, marker);
            });
        };

        onAuthStateChanged(auth, async (u) => {
            user = u;
            unsubscribeList.forEach(un => un());
            if (u) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('profile-area').classList.remove('hidden');
                const userRef = doc(db, 'artifacts', appId, 'users', u.uid, 'profile', 'data');
                const snap = await getDoc(userRef);
                if (!snap.exists()) await setDoc(userRef, { score: 0, visited: [], groups: [], username: u.displayName });

                unsubscribeList.push(onSnapshot(userRef, s => {
                    userData = s.data();
                    const info = getLevelInfo(userData.score);
                    document.getElementById('user-score').innerText = userData.score;
                    document.getElementById('user-level').innerText = info.name;
                    document.getElementById('profile-name').innerText = userData.username || u.displayName;
                    if (u.photoURL) document.getElementById('profile-img').src = u.photoURL;
                    updateMarkers();
                }));

                unsubscribeList.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'groups'), s => {
                    groups = s.docs.map(d => d.data());
                    const myGroups = groups.filter(g => g.members.includes(u.uid));
                    document.getElementById('loc-group').innerHTML = `<option value="">Válassz csoportot...</option>` + 
                        myGroups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
                }));

                unsubscribeList.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'locations'), s => {
                    locations = s.docs.map(d => d.data());
                    updateMarkers();
                    const list = document.getElementById('location-list');
                    const myGroupIds = userData.groups || [];
                    const visible = locations.filter(loc => loc.groups.some(gid => myGroupIds.includes(gid)));
                    list.innerHTML = visible.map(loc => `
                        <div class="bg-gray-900/60 p-5 rounded-3xl border border-gray-800 mb-4 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-white text-xs uppercase tracking-tight">${loc.name}</h3>
                                <p class="text-[8px] text-gray-500 font-bold uppercase">${CATEGORIES[loc.category]?.label || 'Egyéb'} • ${loc.creatorName}</p>
                            </div>
                            <button onclick="window.checkIn('${loc.id}')" class="bg-white text-black text-[9px] font-bold px-4 py-2 rounded-xl uppercase">Check-in</button>
                        </div>
                    `).join('');
                }));
                window.showView('view-map');
            }
        });

        window.addEventListener('load', () => {
            map = L.map('map-container', { zoomControl: false, attributionControl: false }).setView([47.4979, 19.0402], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            map.on('click', (e) => {
                if (!user) return showMessage("Lépj be!", "error");
                selectedCoords = e.latlng;
                document.getElementById('lat-val').innerText = e.latlng.lat.toFixed(5);
                document.getElementById('lng-val').innerText = e.latlng.lng.toFixed(5);
                window.showView('view-add');
            });
        });
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background: #050505; color: #e5e7eb; overflow: hidden; }
        .view { height: calc(100vh - 180px); overflow-y: auto; padding-bottom: 50px; }
        #map-container { height: 100%; border-radius: 2rem; border: 1px solid #1f2937; filter: contrast(1.1) brightness(0.8); }
        
        .marker-pin {
            width: 30px; height: 30px; border-radius: 50% 50% 50% 0;
            position: absolute; transform: rotate(-45deg);
            left: 50%; top: 50%; margin: -15px 0 0 -15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .marker-pin::after {
            content: ''; width: 24px; height: 24px; margin: 3px 0 0 3px;
            background: rgba(255,255,255,0.1); position: absolute; border-radius: 50%;
        }
        .marker-pin > * { transform: rotate(45deg); }

        select, input { background: #000 !important; border-color: #1f2937 !important; }
        .green-glow { text-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <div id="message-box" class="hidden"></div>

    <header class="p-6 pt-8 bg-black/80 backdrop-blur-md border-b border-gray-900 flex justify-between items-center z-[2000]">
        <div>
            <h1 class="text-lg font-bold text-green-500 green-glow italic uppercase tracking-tighter">Hunter v9</h1>
            <p id="user-level" class="text-[7px] text-gray-600 font-bold uppercase tracking-[0.2em]">Kezdő Felderítő</p>
        </div>
        <div id="profile-area" class="hidden flex items-center gap-3">
            <div class="text-right">
                <div id="profile-name" class="text-[10px] font-bold text-white italic truncate max-w-[80px]">...</div>
                <div class="text-[9px] font-bold text-green-500"><span id="user-score">0</span> PTS</div>
            </div>
            <img id="profile-img" src="" class="w-8 h-8 rounded-full border border-gray-800">
        </div>
        <button id="login-btn" onclick="window.login()" class="bg-white text-black px-4 py-2 rounded-full text-[9px] font-bold uppercase">Belépés</button>
    </header>

    <main class="flex-1 p-4 relative">
        <!-- Térkép -->
        <div id="view-map" class="view">
            <div id="map-container"></div>
            <p class="mt-4 text-[8px] text-gray-600 text-center uppercase font-bold italic tracking-widest animate-pulse">Kattints a térképre új spot rögzítéséhez</p>
        </div>

        <!-- Spotok -->
        <div id="view-list" class="view hidden">
            <div id="location-list" class="space-y-2"></div>
        </div>

        <!-- Csoportok -->
        <div id="view-groups" class="view hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-[10px] font-bold uppercase italic text-gray-400">Csoportok</h2>
                <button onclick="window.createGroup()" class="bg-green-600 text-black text-[8px] px-3 py-1.5 rounded-lg font-bold uppercase">+ Létrehozás</button>
            </div>
            <div id="group-list" class="space-y-3"></div>
        </div>

        <!-- Új Spot -->
        <div id="view-add" class="view hidden">
            <div class="bg-gray-900 border border-gray-800 p-8 rounded-[2.5rem] shadow-2xl max-w-sm mx-auto">
                <h2 class="text-md font-bold text-green-500 mb-2 uppercase italic tracking-tighter">Új Helyszín</h2>
                <p class="text-[8px] text-gray-600 mb-6 uppercase">Koordináták: <span id="lat-val" class="text-white"></span>, <span id="lng-val" class="text-white"></span></p>
                <form onsubmit="window.saveLocation(event)" class="space-y-5">
                    <input id="loc-name" type="text" required class="w-full p-4 rounded-xl text-[10px] outline-none text-white border" placeholder="Helyszín neve">
                    <select id="loc-category" required class="w-full p-4 rounded-xl text-[10px] outline-none text-white border">
                        <option value="">Kategória...</option>
                        <option value="factory">Gyár / Ipar</option>
                        <option value="hospital">Kórház / Intézmény</option>
                        <option value="bunker">Bunker / Óvóhely</option>
                        <option value="crane">Daru / Magaslat</option>
                        <option value="villa">Kastély / Villa</option>
                        <option value="other">Egyéb</option>
                    </select>
                    <select id="loc-group" required class="w-full p-4 rounded-xl text-[10px] outline-none text-white border"></select>
                    <button type="submit" class="w-full py-4 bg-green-600 text-black font-bold rounded-xl uppercase text-[10px] tracking-widest active:scale-95 transition-all">Rögzítés</button>
                    <button type="button" onclick="window.showView('view-map')" class="w-full text-[8px] text-gray-500 uppercase font-bold pt-2">Mégse</button>
                </form>
            </div>
        </div>
    </main>

    <nav class="bg-black/90 border-t border-gray-900 p-6 pb-10 flex justify-around items-center">
        <button onclick="window.showView('view-map')" class="text-gray-600 hover:text-green-500 flex flex-col items-center gap-1">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span class="text-[7px] uppercase font-bold">Térkép</span>
        </button>
        <button onclick="window.showView('view-list')" class="text-gray-600 hover:text-green-500 flex flex-col items-center gap-1">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
            <span class="text-[7px] uppercase font-bold">Lista</span>
        </button>
        <button onclick="window.showView('view-groups')" class="text-gray-600 hover:text-green-500 flex flex-col items-center gap-1">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span class="text-[7px] uppercase font-bold">Csoport</span>
        </button>
    </nav>
</body>
</html>
