<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbex Hunter v9 - Map & Clan Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signInAnonymously, signInWithCustomToken, signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, arrayUnion, arrayRemove, increment, query, deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyCE9HsgnhCbjGWkRUSYeWblSAJAj9Y-3lk",
                authDomain: "urbex-hunter.firebaseapp.com",
                projectId: "urbex-hunter",
                storageBucket: "urbex-hunter.firebasestorage.app",
                messagingSenderId: "23703144828",
                appId: "1:23703144828:web:016a96cd6c1fe01ab5fcf9",
                measurementId: "G-NWN15EC2RW"
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'urbex-hunter-v9'; 
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "jatszmabunker@gmail.com";

        const LEVELS = [
            { min: 0, name: "Zöldfülű", color: "text-gray-400" },
            { min: 100, name: "Vándor", color: "text-blue-400" },
            { min: 500, name: "Alpinista", color: "text-purple-400" }
        ];

        const CATEGORIES = [
            { id: 'bunker', name: 'Bunker', icon: '🛡️' },
            { id: 'crane', name: 'Daru', icon: '🏗️' },
            { id: 'sanatorium', name: 'Szanatórium', icon: '🏥' },
            { id: 'hospital', name: 'Kórház', icon: '🚑' },
            { id: 'industrial', name: 'Ipari', icon: '🏭' },
            { id: 'facility', name: 'Létesítmény', icon: '🏢' },
            { id: 'residential', name: 'Lakóépület', icon: '🏚️' },
            { id: 'other', name: 'Egyéb', icon: '📍' }
        ];

        let user = null;
        let userData = { score: 0, groups: [], visited: [], username: "" };
        let locations = [];
        let allGroups = [];
        let allApplications = []; 
        let myGroupIds = []; 
        let publicProfiles = {}; 
        let map = null;
        let markers = [];
        let userMarker = null; 
        let lastTrackedPos = null;
        let selectedCoords = null;
        let currentGroupId = null;
        let activeLocationId = null; 
        let activeViewId = 'view-map'; 
        let isDemoMode = false;
        let isChecking = false;
        let unsubscribeList = [];
        let qrScanner = null;
        let groupFilter = 'all';

        let smoothLat = null;
        let smoothLng = null;

        const getLevelInfo = (score) => LEVELS.slice().reverse().find(l => score >= l.min) || LEVELS[0];

        const showMessage = (text, type = 'info') => {
            const box = document.getElementById('message-box');
            box.innerText = text;
            box.className = `fixed top-4 left-1/2 -translate-x-1/2 p-4 rounded shadow-2xl z-[6000] text-white font-bold text-center text-xs transition-all ${type === 'error' ? 'bg-red-600' : 'bg-green-600'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        };

        const updateNavVisibility = () => {
            const loginSection = document.getElementById('nav-login-section');
            const logoutSection = document.getElementById('nav-logout-section');
            const checkinBtn = document.getElementById('checkin-btn-outer');

            if (activeViewId === 'view-location-info') {
                if(checkinBtn) checkinBtn.classList.remove('hidden');
                if(loginSection) loginSection.classList.add('hidden');
                if(logoutSection) logoutSection.classList.add('hidden');
                updateCheckinButtonUI();
            } else {
                if(checkinBtn) checkinBtn.classList.add('hidden');
                activeLocationId = null;

                if (user) {
                    if(loginSection) loginSection.classList.add('hidden');
                    if(logoutSection) logoutSection.classList.remove('hidden');
                } else {
                    if(loginSection) loginSection.classList.remove('hidden');
                    if(logoutSection) logoutSection.classList.add('hidden');
                }
            }
        };

        window.showView = (viewId) => {
            activeViewId = viewId;
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            const target = document.getElementById(viewId);
            if(target) target.classList.remove('hidden');
            
            updateNavVisibility();

            if (viewId === 'view-map' && map) setTimeout(() => map.invalidateSize(), 200);
            if (viewId === 'view-group-detail') renderGroupLocations();
            if (viewId === 'view-groups') {
                renderGroupCreationLevels();
                renderGroups();
            }
        };

        const getDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        };

        const getCurrentPos = () => new Promise((res, rej) => {
            if (!navigator.geolocation) return rej("Nincs GPS támogatás");
            navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 5000 });
        });

        const updateCheckinButtonUI = () => {
            const btn = document.getElementById('checkin-btn-outer');
            if (!activeLocationId || !btn) return;
            const loc = locations.find(l => l.id === activeLocationId);
            if (!loc) return;
            const btnIcon = document.getElementById('checkin-btn');
            if (loc.verifyType === 'qr') {
                btnIcon.innerHTML = `<path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2" /><rect x="7" y="7" width="3" height="3" /><rect x="14" y="7" width="3" height="3" /><rect x="7" y="14" width="3" height="3" /><rect x="14" y="14" width="3" height="3" />`;
            } else {
                btnIcon.innerHTML = `<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" />`;
            }
            const isAdmin = user?.email === ADMIN_EMAIL;
            if (!lastTrackedPos) {
                btn.style.opacity = (isAdmin || isDemoMode) ? "1" : "0.4";
                return;
            }
            const dist = getDistance(lastTrackedPos.lat, lastTrackedPos.lng, loc.lat, loc.lng);
            if (dist <= 35 || isAdmin || isDemoMode) {
                btn.style.opacity = "1";
            } else {
                btn.style.opacity = "0.4";
            }
        };

        const trackUserPosition = () => {
            if (!navigator.geolocation) return;
            const alpha = 0.05; 
            navigator.geolocation.watchPosition(pos => {
                const { latitude, longitude, accuracy } = pos.coords;
                if (accuracy > 30) return;
                if (smoothLat === null) { smoothLat = latitude; smoothLng = longitude; } 
                else { smoothLat = (latitude * alpha) + (smoothLat * (1 - alpha)); smoothLng = (longitude * alpha) + (smoothLng * (1 - alpha)); }
                const distChange = lastTrackedPos ? getDistance(smoothLat, smoothLng, lastTrackedPos.lat, lastTrackedPos.lng) : 999;
                if (distChange < 5) return;
                lastTrackedPos = { lat: smoothLat, lng: smoothLng };
                const latlng = [smoothLat, smoothLng];
                if (!userMarker) {
                    userMarker = L.circleMarker(latlng, { radius: 8, fillColor: "#3b82f6", color: "white", weight: 2, opacity: 1, fillOpacity: 0.9, className: "player-pulse" }).addTo(map);
                } else { userMarker.setLatLng(latlng); }
                updateCheckinButtonUI();
            }, err => console.log("GPS hiba:", err), { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
        };

        window.recenterMap = () => {
            if (lastTrackedPos && map) { map.setView([lastTrackedPos.lat, lastTrackedPos.lng], 16); } 
            else { showMessage("GPS keresés...", "info"); }
        };

        window.toggleFullscreen = () => {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(e => showMessage("Fullscreen hiba", "error")); } 
            else { document.exitFullscreen(); }
        };

        window.loginWithGoogle = () => signInWithPopup(auth, googleProvider);
        window.logout = () => signOut(auth).then(() => location.reload());

        const handleAuthChange = async (u) => {
            user = u;
            unsubscribeList.forEach(unsub => unsub());
            unsubscribeList = [];
            updateNavVisibility();
            if (u) {
                document.getElementById('profile-area').classList.remove('hidden');
                const userRef = doc(db, 'artifacts', appId, 'users', u.uid, 'profile', 'data');
                const snap = await getDoc(userRef);
                if (!snap.exists() || !snap.data().username) { document.getElementById('name-setup-modal').classList.remove('hidden'); }
                setupListeners();
            } else { document.getElementById('profile-area').classList.add('hidden'); }
        };

        window.finishNameSetup = async () => {
            const name = document.getElementById('new-user-username').value.trim();
            if (!name || name.length < 3) return showMessage("Túl rövid név!", "error");
            try {
                const userRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
                await setDoc(userRef, { username: name, score: 0, groups: [], visited: [], createdAt: Date.now() }, { merge: true });
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'profiles', user.uid), { username: name, score: 0 }, { merge: true });
                document.getElementById('name-setup-modal').classList.add('hidden');
                showMessage("Üdvözlünk, " + name + "!");
            } catch (e) { showMessage("Mentési hiba", "error"); }
        };

        const setupListeners = () => {
            if (!user) return;
            unsubscribeList.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'profiles'), snap => {
                snap.docs.forEach(d => publicProfiles[d.id] = d.data());
                if (currentGroupId) renderGroupMembers();
            }));
            unsubscribeList.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'groups'), snap => {
                allGroups = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                myGroupIds = allGroups.filter(g => g.members && g.members.includes(user.uid)).map(g => g.id);
                renderGroups();
                updateMarkers();
                if (currentGroupId) { renderGroupMembers(); updateGroupDetailUI(); }
            }));
            unsubscribeList.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'applications'), snap => {
                allApplications = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderApplications(allApplications);
                renderGroups(); 
            }));
            unsubscribeList.push(onSnapshot(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), snap => {
                userData = snap.data() || { score: 0, groups: [], visited: [], username: "" };
                updateUI();
                renderGroups();
                updateMarkers();
            }));
            unsubscribeList.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'locations'), snap => {
                locations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                updateMarkers();
                if (currentGroupId) renderGroupLocations();
            }));
        };

        const updateUI = () => {
            const info = getLevelInfo(userData.score || 0);
            document.getElementById('user-score').innerText = userData.score || 0;
            document.getElementById('user-level').innerText = info.name;
            document.getElementById('profile-name').innerText = userData.username || "Hunter";
        };

        window.addEventListener('load', () => {
            map = L.map('map-container', { zoomControl: false }).setView([47.4979, 19.0402], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            map.on('click', (e) => {
                if (!user) return showMessage("Lépj be a rögzítéshez!", "error");
                if (myGroupIds.length === 0 && user.email !== ADMIN_EMAIL) return showMessage("Csatlakozz egy klánhoz!", "error");
                selectedCoords = e.latlng;
                document.getElementById('lat-val').innerText = selectedCoords.lat.toFixed(5);
                document.getElementById('lng-val').innerText = selectedCoords.lng.toFixed(5);
                const select = document.getElementById('loc-group-select');
                const myGroups = allGroups.filter(g => myGroupIds.includes(g.id));
                select.innerHTML = myGroups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
                document.getElementById('loc-category-select').innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                document.getElementById('loc-verify-qr').checked = false;
                document.getElementById('qr-secret-container').classList.add('hidden');
                window.showView('view-add');
            });
            const scoreContainer = document.getElementById('score-reveal-area');
            const profileName = document.getElementById('profile-name');
            const showName = () => profileName.classList.remove('opacity-0');
            const hideName = () => profileName.classList.add('opacity-0');
            scoreContainer.addEventListener('mousedown', showName); scoreContainer.addEventListener('mouseup', hideName); scoreContainer.addEventListener('mouseleave', hideName);
            scoreContainer.addEventListener('touchstart', (e) => { e.preventDefault(); showName(); }); scoreContainer.addEventListener('touchend', hideName);
            trackUserPosition(); initAuth();
        });

        const updateMarkers = () => {
            if (!map) return;
            markers.forEach(m => m.remove());
            markers = [];
            const visibleLocations = locations.filter(loc => myGroupIds.includes(loc.groupId));
            visibleLocations.forEach(loc => {
                let color = '#3b82f6'; 
                if (userData.visited && userData.visited.includes(loc.id)) color = '#6b7280'; 
                else if (loc.status === 'active') color = loc.installed ? '#22c55e' : '#f97316'; 
                const cat = CATEGORIES.find(c => c.id === (loc.categoryId || 'other')) || CATEGORIES[7];
                const circle = L.circle([loc.lat, loc.lng], { color, fillColor: color, fillOpacity: 0.1, radius: 25, weight: 1 }).addTo(map);
                const pinIcon = L.divIcon({
                    className: 'custom-pin-icon',
                    html: `<div class="pin-marker" style="--pin-color: ${color}">
                            <svg width="40" height="50" viewBox="0 0 34 44" fill="none">
                                <path d="M17 0C7.61 0 0 7.61 0 17C0 29.75 17 44 17 44C17 44 34 29.75 34 17C34 7.61 26.39 0 17 0Z" fill="var(--pin-color)"/>
                                <circle cx="17" cy="17" r="12" fill="white"/>
                            </svg>
                            <span class="pin-emoji-label">${cat.icon}</span>
                        </div>`,
                    iconSize: [40, 50], iconAnchor: [20, 50]
                });
                const marker = L.marker([loc.lat, loc.lng], { icon: pinIcon }).addTo(map);
                const handleClick = (e) => { L.DomEvent.stopPropagation(e); window.showLocationDetail(loc.id); };
                circle.on('click', handleClick); marker.on('click', handleClick);
                markers.push(circle, marker);
            });
        };

        window.showLocationDetail = (locId) => {
            const loc = locations.find(l => l.id === locId); if (!loc) return;
            activeLocationId = locId;
            const group = allGroups.find(g => g.id === loc.groupId);
            const levelInfo = LEVELS[loc.requiredLevelIndex || 0];
            const cat = CATEGORIES.find(c => c.id === (loc.categoryId || 'other')) || CATEGORIES[7];
            document.getElementById('info-title').innerText = loc.name;
            document.getElementById('info-status').innerText = loc.status === 'active' ? (loc.installed ? 'AKTÍV' : 'TELEPÍTÉSRE VÁR') : 'SZAVAZÁSON';
            document.getElementById('info-pts').innerText = loc.status === 'active' ? (loc.finalPoints || '?') + ' PTS' : 'Szavazáson';
            document.getElementById('info-group').innerText = group?.name || 'Klán';
            document.getElementById('info-creator').innerText = loc.creatorName || 'Hunter';
            document.getElementById('info-approach').innerText = loc.approach || 'Nincs leírás.';
            document.getElementById('info-level').innerText = levelInfo?.name || 'Zöldfülű';
            document.getElementById('info-coords').innerText = `${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}`;
            document.getElementById('info-category').innerText = `${cat.icon} ${cat.name}`;
            const actionContainer = document.getElementById('info-action-container');
            actionContainer.innerHTML = '';
            if (loc.status === 'voting') {
                const canVote = !loc.voters?.includes(user?.uid);
                actionContainer.innerHTML = `<div class="grid grid-cols-4 gap-2">${[10, 20, 50, 100, 150, 200, 300, 500].map(v => `<button onclick="window.voteValue('${loc.id}', ${v})" class="py-2 text-[10px] font-bold border border-gray-700 rounded-xl text-blue-400 active:bg-blue-900 ${!canVote ? 'opacity-20 pointer-events-none' : ''}">${v}</button>`).join('')}</div>`;
            }
            if (loc.creatorId === user?.uid || user?.email === ADMIN_EMAIL) {
                actionContainer.innerHTML += `<button onclick="window.deleteLocation('${loc.id}')" class="w-full mt-4 py-3 bg-red-900/20 text-red-500 text-[10px] font-bold uppercase rounded-xl border border-red-500/20">Helyszín Törlése</button>`;
            }
            window.showView('view-location-info');
        };

        window.deleteLocation = async (locId) => { if (confirm("Biztosan törlöd?")) { try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'locations', locId)); window.showView('view-map'); } catch (e) { showMessage("Hiba", "error"); } } };

        window.handleAction = async () => {
            const loc = locations.find(l => l.id === activeLocationId); if (!loc || isChecking) return;
            const uLat = lastTrackedPos?.lat, uLng = lastTrackedPos?.lng; if (!uLat) return showMessage("Várj a GPS jelre!", "error");
            const dist = getDistance(uLat, uLng, loc.lat, loc.lng);
            if (dist > 50 && user.email !== ADMIN_EMAIL) return showMessage(`Túl messze vagy! (${Math.round(dist)}m)`, "error");
            if (loc.verifyType === 'qr') openQrScanner(loc); else startGpsCheck(loc);
        };

        const startGpsCheck = async (loc) => {
            isChecking = true;
            document.getElementById('checkin-btn').classList.add('animate-spin');
            try { await processLocationAction(loc); window.showView('view-map'); } 
            catch (err) { showMessage("Műveleti hiba", "error"); } 
            finally { isChecking = false; document.getElementById('checkin-btn').classList.remove('animate-spin'); }
        };

        const openQrScanner = (loc) => {
            document.getElementById('qr-modal').classList.remove('hidden');
            qrScanner = new Html5Qrcode("qr-reader");
            qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (txt) => {
                if (txt.trim() === (loc.qrSecret || loc.id).trim()) { qrScanner.stop().then(() => { document.getElementById('qr-modal').classList.add('hidden'); startGpsCheck(loc); }); }
                else showMessage("Hibás QR kód!", "error");
            }).catch(e => { showMessage("Kamera hiba", "error"); document.getElementById('qr-modal').classList.add('hidden'); });
        };

        window.closeQrScanner = () => { if (qrScanner) qrScanner.stop().then(() => document.getElementById('qr-modal').classList.add('hidden')); else document.getElementById('qr-modal').classList.add('hidden'); };

        const processLocationAction = async (locData) => {
            const userRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
            const locRef = doc(db, 'artifacts', appId, 'public', 'data', 'locations', locData.id);
            if (!locData.installed) {
                if (locData.creatorId !== user.uid && user.email !== ADMIN_EMAIL) return showMessage("Ezt csak a beküldő aktiválhatja!", "error");
                await updateDoc(userRef, { score: increment(locData.finalPoints || 50), visited: arrayUnion(locData.id) });
                await updateDoc(locRef, { installed: true });
                showMessage("Aktiválva! +" + (locData.finalPoints || 50));
            } else {
                if (userData.visited?.includes(locData.id)) return showMessage("Már meglátogattad!", "error");
                const pts = Math.round((locData.finalPoints || 50) / 2);
                await updateDoc(userRef, { score: increment(pts), visited: arrayUnion(locData.id) });
                showMessage("Igazolva! +" + pts);
            }
        };

        window.voteValue = async (locId, val) => {
            const locRef = doc(db, 'artifacts', appId, 'public', 'data', 'locations', locId);
            const snap = await getDoc(locRef); const d = snap.data();
            if (d.voters?.includes(user.uid) && user.email !== ADMIN_EMAIL) return showMessage("Már szavaztál!");
            const nT = (d.voteTotal || 0) + val, nC = (d.voteCount || 0) + 1;
            let up = { voteTotal: nT, voteCount: nC, voters: arrayUnion(user.uid) };
            if (nC >= 10) { const avg = Math.round(nT/nC); up.status = 'active'; up.finalPoints = avg; up.requiredLevelIndex = avg > 300 ? 2 : (avg > 100 ? 1 : 0); }
            await updateDoc(locRef, up); showMessage("Voks rögzítve!"); window.showLocationDetail(locId);
        };

        window.toggleGroupForm = () => {
            const box = document.getElementById('create-group-box');
            box.classList.toggle('hidden');
        };

        window.createGroup = async () => {
            const name = document.getElementById('new-group-name').value.trim();
            const levelIdx = parseInt(document.getElementById('new-group-level').value) || 0;
            if (!name) return;
            const id = "GRP-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'groups', id), { id, name, creatorId: user.uid, members: [user.uid], totalScore: userData.score || 0, requiredLevelIndex: levelIdx });
                await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), { groups: arrayUnion(id) });
                showMessage("Klán alapítva!"); document.getElementById('new-group-name').value = ""; toggleGroupForm();
            } catch (e) { showMessage("Hiba", "error"); }
        };

        window.applyToGroup = async (e, gid) => {
            e.stopPropagation(); const g = allGroups.find(x => x.id === gid);
            const pLvl = getLevelInfo(userData.score).min;
            if (userData.score < LEVELS[g.requiredLevelIndex || 0].min) return showMessage("Túl alacsony szint!", "error");
            const reason = prompt("Miért akarsz belépni?"); if (!reason) return;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'applications', `APP-${user.uid}-${gid}`), { id: `APP-${user.uid}-${gid}`, groupId: gid, userId: user.uid, username: userData.username, reason, creatorId: g.creatorId });
            showMessage("Jelentkezés elküldve!");
        };

        window.setGroupFilter = (f) => { groupFilter = f; renderGroups(); };

        const renderGroups = () => {
            const container = document.getElementById('group-list'); if (!container) return;
            let f = allGroups;
            if (groupFilter === 'mine') f = allGroups.filter(g => myGroupIds.includes(g.id));
            else if (['0', '1', '2'].includes(groupFilter)) f = allGroups.filter(g => (g.requiredLevelIndex || 0).toString() === groupFilter);
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('bg-blue-600', b.dataset.filter === groupFilter));
            container.innerHTML = f.length ? f.map(g => {
                const isM = myGroupIds.includes(g.id), isP = allApplications.some(a => a.groupId === g.id && a.userId === user?.uid);
                const l = LEVELS[g.requiredLevelIndex || 0];
                return `<div onclick="window.showGroupDetail('${g.id}')" class="bg-gray-800 p-4 rounded-2xl border border-gray-700 mb-3 flex justify-between items-center active:bg-gray-700"><div><h4 class="font-bold text-white uppercase">${g.name}</h4><p class="text-[8px] ${l.color} font-bold uppercase">${l.name}</p></div>${isM ? '<span class="text-[9px] bg-green-900 text-green-400 px-3 py-1 rounded-full font-bold">TAG</span>' : (isP ? '<span class="text-[9px] text-gray-500 font-bold italic">Függőben</span>' : `<button onclick="window.applyToGroup(event, '${g.id}')" class="bg-blue-600 text-white text-[9px] px-3 py-1 rounded-lg font-bold">BELÉPÉS</button>`)}</div>`;
            }).join('') : `<p class="text-center p-10 text-gray-500 uppercase text-[10px]">Nincs találat.</p>`;
        };

        const renderGroupCreationLevels = () => {
            const select = document.getElementById('new-group-level');
            const pLvlInfo = getLevelInfo(userData.score);
            const pIdx = LEVELS.findIndex(l => l.name === pLvlInfo.name);
            select.innerHTML = LEVELS.slice(0, pIdx + 1).map((l, i) => `<option value="${i}">${l.name}</option>`).join('');
        };

        window.showGroupDetail = (gid) => { currentGroupId = gid; updateGroupDetailUI(); window.showView('view-group-detail'); };
        const updateGroupDetailUI = () => {
            const g = allGroups.find(x => x.id === currentGroupId); if (!g) return;
            document.getElementById('detail-group-name').innerText = g.name;
            const isM = user && g.members.includes(user.uid);
            document.getElementById('group-leave-container').innerHTML = isM ? `<button onclick="window.leaveCurrentGroup()" class="w-full py-2 bg-gray-900 border border-gray-800 text-gray-500 text-[9px] font-bold uppercase rounded-xl">Kilépés</button>` : '';
        };

        window.leaveCurrentGroup = async () => { if (confirm("Kilépsz?")) { try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'groups', currentGroupId), { members: arrayRemove(user.uid) }); window.showView('view-groups'); } catch (e) {} } };

        const renderGroupLocations = () => {
            const c = document.getElementById('detail-location-list');
            const g = allGroups.find(x => x.id === currentGroupId);
            if (!g?.members.includes(user?.uid) && user?.email !== ADMIN_EMAIL) { c.innerHTML = `<div class="p-10 text-center text-[10px] text-gray-500 uppercase font-bold">Privát klán adatok</div>`; return; }
            const gLocs = locations.filter(l => l.groupId === currentGroupId);
            c.innerHTML = gLocs.length ? gLocs.map(l => `<div onclick="window.showLocationDetail('${l.id}')" class="bg-gray-800/50 p-4 rounded-3xl border border-gray-700 mb-3 flex justify-between items-center"><span class="font-bold text-white text-xs uppercase">${l.name}</span><span class="text-[8px] font-bold px-2 py-1 rounded bg-black/40 text-blue-400">${l.status === 'active' ? (l.finalPoints + ' PTS') : 'SZAVAZÁS'}</span></div>`).join('') : '<p class="text-center p-10 text-[10px] text-gray-500">Nincs helyszín.</p>';
        };

        window.showGroupMembers = () => {
            const g = allGroups.find(x => x.id === currentGroupId); if (!g) return;
            document.getElementById('member-modal-title').innerText = g.name;
            document.getElementById('modal-member-list').innerHTML = g.members.map(uid => {
                const p = publicProfiles[uid] || { username: "Hunter", score: 0 };
                return `<div class="flex justify-between p-3 bg-black/40 rounded-xl border border-gray-800 mb-2 text-[10px] font-bold uppercase"><span>${p.username}</span><span class="text-green-500">${p.score} PTS</span></div>`;
            }).join('');
            document.getElementById('member-modal').classList.remove('hidden');
        };
        window.closeMemberModal = () => document.getElementById('member-modal').classList.add('hidden');

        const renderApplications = (apps) => {
            const c = document.getElementById('app-list'); const myApps = apps.filter(a => a.creatorId === user.uid);
            c.innerHTML = myApps.map(a => `<div class="bg-gray-900 p-4 rounded-2xl border border-blue-900/30 mb-2 text-[10px]"><p class="font-bold text-white uppercase">${a.username} -> ${allGroups.find(g => g.id === a.groupId)?.name}</p><p class="text-gray-400 italic mb-2">"${a.reason}"</p><div class="flex gap-2"><button onclick="window.processApp('${a.id}', true)" class="flex-1 bg-green-600 text-black font-bold py-2 rounded-lg">ELFOGAD</button><button onclick="window.processApp('${a.id}', false)" class="flex-1 bg-red-600 text-white font-bold py-2 rounded-lg">ELUTASÍT</button></div></div>`).join('');
        };
        window.processApp = async (aid, acc) => {
            const s = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'applications', aid)); if (!s.exists()) return;
            if (acc) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'groups', s.data().groupId), { members: arrayUnion(s.data().userId) });
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'applications', aid));
        };
        window.toggleQrSecret = () => document.getElementById('qr-secret-container').classList.toggle('hidden', !document.getElementById('loc-verify-qr').checked);
        window.saveLocation = async (e) => {
            e.preventDefault(); const name = document.getElementById('loc-name').value;
            const gid = document.getElementById('loc-group-select').value, cid = document.getElementById('loc-category-select').value;
            const app = document.getElementById('loc-approach').value, vt = document.getElementById('loc-verify-qr').checked ? 'qr' : 'gps';
            const qs = document.getElementById('loc-qr-secret').value;
            const id = "LOC-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'locations', id), { id, name, groupId: gid, categoryId: cid, approach: app, verifyType: vt, qrSecret: qs, requiredLevelIndex: 0, lat: selectedCoords.lat, lng: selectedCoords.lng, installed: false, creatorId: user.uid, creatorName: userData.username, voteCount: 0, voteTotal: 0, voters: [], status: 'voting', createdAt: Date.now() });
            window.showView('view-map');
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
        body { font-family: 'Space Mono', monospace; background: #050505; color: #eee; -webkit-tap-highlight-color: transparent; }
        #view-map { position: fixed; inset: 0; padding-bottom: 5rem; }
        #map-container { width: 100%; height: 100%; }
        .map-control-btn { position: absolute; right: 1rem; width: 48px; height: 48px; background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(8px); cursor: pointer; }
        #recenter-btn { bottom: 7.5rem; } #fullscreen-btn { bottom: 11rem; }
        .pin-marker { position: relative; width: 40px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .pin-emoji-label { position: absolute; top: 18px; left: 20px; transform: translate(-50%, -50%); font-size: 16px; z-index: 10; pointer-events: none; line-height: 1; }
        .custom-pin-icon { background: none !important; border: none !important; }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .profile-pulse { animation: soft-pulse 4s infinite; }
        @keyframes soft-pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body class="min-h-screen">
    <div id="message-box" class="hidden"></div>

    <div id="name-setup-modal" class="fixed inset-0 bg-black z-[9000] flex items-center justify-center p-6 hidden">
        <div class="bg-gray-900 w-full max-w-sm rounded-[3rem] border border-blue-600/30 p-8">
            <h2 class="text-2xl font-bold text-white mb-2 uppercase italic tracking-tighter">Üdv Hunter!</h2>
            <p class="text-[10px] text-gray-400 font-bold uppercase mb-6 leading-relaxed">Válassz egy nevet. Később nem változtathatod meg!</p>
            <input id="new-user-username" type="text" placeholder="Neved..." class="w-full p-4 rounded-2xl text-sm mb-6 outline-none bg-black border border-gray-800 text-white">
            <button onclick="window.finishNameSetup()" class="w-full bg-blue-600 text-white font-bold py-5 rounded-2xl text-[10px] uppercase tracking-widest">Kezdés</button>
        </div>
    </div>

    <header class="p-3 px-6 border-b border-gray-800 bg-black/50 backdrop-blur-md sticky top-0 z-[5000]">
        <div class="flex justify-between items-center max-w-xl mx-auto">
            <div>
                <h1 class="text-lg font-bold text-green-500 tracking-tighter italic uppercase leading-none">Urbex Hunter <span class="text-[8px] bg-gray-800 px-2 py-0.5 rounded ml-1 text-gray-400">v9</span></h1>
                <p id="user-level" class="text-[8px] text-gray-500 font-bold uppercase tracking-widest italic">Betöltés...</p>
            </div>
            <div id="profile-area" class="hidden text-right flex flex-col items-end">
                <p id="profile-name" class="text-[10px] font-bold text-white mb-0 uppercase opacity-0 transition-opacity">Hunter</p>
                <div id="score-reveal-area" class="bg-green-900/40 border border-green-500/30 px-3 py-1.5 rounded-2xl mt-1 profile-pulse cursor-pointer">
                    <p class="text-green-500 font-bold text-3xl tracking-tighter leading-none"><span id="user-score">0</span></p>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div id="view-map" class="view">
            <div id="map-container"></div>
            <button id="recenter-btn" onclick="window.recenterMap()" class="map-control-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2m10-10h-2M4 12H2"/></svg></button>
            <button id="fullscreen-btn" onclick="window.toggleFullscreen()" class="map-control-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
        </div>

        <div id="view-groups" class="view hidden p-4 max-w-xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold italic text-blue-500 uppercase tracking-tighter">Klánok</h2>
                <button onclick="window.toggleGroupForm()" class="bg-blue-600 text-white text-[9px] font-bold px-4 py-2 rounded-xl shadow-lg">ÚJ KLÁN ALAPÍTÁSA</button>
            </div>

            <div id="create-group-box" class="hidden mb-8 p-6 bg-gray-900 rounded-[2.5rem] border border-blue-600/30">
                <p class="text-[10px] text-gray-500 font-bold uppercase mb-4 tracking-widest">Alapítás</p>
                <input id="new-group-name" type="text" placeholder="Klán neve" class="w-full p-4 rounded-2xl text-xs mb-3 bg-black border border-gray-800 text-white outline-none">
                <label class="text-[9px] text-gray-500 uppercase font-bold ml-1">Klán szintje</label>
                <select id="new-group-level" class="w-full p-4 rounded-2xl text-xs mb-4 bg-black border border-gray-800 text-white"></select>
                <button onclick="window.createGroup()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl text-[10px] uppercase tracking-widest">Létrehozás</button>
            </div>

            <div class="mb-6 flex gap-2 overflow-x-auto pb-2">
                <button onclick="window.setGroupFilter('all')" data-filter="all" class="filter-btn px-4 py-2 bg-blue-600 text-white rounded-xl text-[10px] font-bold uppercase tracking-widest flex-shrink-0">Mind</button>
                <button onclick="window.setGroupFilter('mine')" data-filter="mine" class="filter-btn px-4 py-2 bg-gray-900 text-gray-500 border border-gray-800 rounded-xl text-[10px] font-bold uppercase tracking-widest flex-shrink-0">Saját</button>
                <button onclick="window.setGroupFilter('0')" data-filter="0" class="filter-btn px-4 py-2 bg-gray-900 text-gray-500 border border-gray-800 rounded-xl text-[10px] font-bold uppercase tracking-widest flex-shrink-0">Zöldfülű</button>
                <button onclick="window.setGroupFilter('1')" data-filter="1" class="filter-btn px-4 py-2 bg-gray-900 text-gray-500 border border-gray-800 rounded-xl text-[10px] font-bold uppercase tracking-widest flex-shrink-0">Vándor</button>
                <button onclick="window.setGroupFilter('2')" data-filter="2" class="filter-btn px-4 py-2 bg-gray-900 text-gray-500 border border-gray-800 rounded-xl text-[10px] font-bold uppercase tracking-widest flex-shrink-0">Alpinista</button>
            </div>

            <div id="app-area" class="mb-6"><div id="app-list"></div></div>
            <div id="group-list" class="space-y-1"></div>
        </div>

        <div id="view-group-detail" class="view hidden p-4 max-w-xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <button onclick="window.showView('view-groups')" class="text-[10px] text-blue-400 uppercase font-bold tracking-widest">← Vissza</button>
                <button onclick="window.showGroupMembers()" class="bg-gray-800 p-2.5 rounded-xl border border-gray-700 text-[9px] font-bold text-gray-400 uppercase tracking-widest">Tagok</button>
            </div>
            <h2 id="detail-group-name" class="text-xl font-bold text-white mb-4 uppercase italic text-center">Klán</h2>
            <div id="group-leave-container" class="max-w-xs mx-auto mb-6 text-center"></div>
            <div id="detail-location-list" class="space-y-1"></div>
        </div>

        <div id="view-location-info" class="view hidden fixed inset-0 bg-black z-[4000] overflow-y-auto p-6">
            <button onclick="window.showView('view-map')" class="text-[10px] text-green-500 uppercase font-bold mb-8">← Térkép</button>
            <h2 id="info-title" class="text-3xl font-bold text-white uppercase italic mb-2 leading-none">Helyszín</h2>
            <p id="info-category" class="text-xs font-bold text-blue-400 uppercase mb-6 tracking-widest">Kategória</p>
            <span id="info-status" class="text-[10px] font-bold px-3 py-1 rounded-full bg-blue-900 text-blue-400">Status</span>
            <div class="grid grid-cols-2 gap-4 mt-6">
                <div class="bg-gray-900 p-4 rounded-3xl border border-gray-800"><p class="text-[9px] text-gray-500 uppercase font-bold mb-1">Érték</p><p id="info-pts" class="text-xl font-bold text-green-500">0 PTS</p></div>
                <div class="bg-gray-900 p-4 rounded-3xl border border-gray-800"><p class="text-[9px] text-gray-500 uppercase font-bold mb-1">Szint</p><p id="info-level" class="text-xl font-bold text-blue-400 italic">Level</p></div>
            </div>
            <div class="bg-gray-900 p-6 rounded-[2.5rem] border border-gray-800 mt-6 space-y-4">
                <div><p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Leírás</p><p id="info-approach" class="text-sm text-gray-300">Nincs leírás.</p></div>
                <div class="grid grid-cols-2 pt-4 border-t border-gray-800">
                    <div><p class="text-[9px] text-gray-500 uppercase font-bold">Beküldő</p><p id="info-creator" class="text-xs text-white uppercase font-bold">-</p></div>
                    <div><p class="text-[9px] text-gray-500 uppercase font-bold">Klán</p><p id="info-group" class="text-xs text-white uppercase font-bold italic">-</p></div>
                </div>
                <p id="info-coords" class="text-[9px] text-gray-600 font-bold tracking-tighter">-</p>
            </div>
            <div id="info-action-container" class="mt-6 pb-20"></div>
        </div>

        <div id="view-add" class="view hidden fixed inset-0 bg-black z-[4000] overflow-y-auto p-8">
            <button onclick="window.showView('view-map')" class="text-[10px] text-gray-500 uppercase font-bold mb-8">← Mégse</button>
            <h2 class="text-4xl font-bold text-green-500 mb-6 italic uppercase tracking-tighter">Új Pont</h2>
            <p class="text-[10px] text-gray-500 uppercase font-bold mb-8">Pozíció: <span id="lat-val" class="text-white"></span>, <span id="lng-val" class="text-white"></span></p>
            <form onsubmit="window.saveLocation(event)" class="space-y-6">
                <input id="loc-name" required type="text" placeholder="Pont neve" class="w-full p-4 rounded-xl bg-black border border-gray-800 text-white font-bold uppercase">
                <select id="loc-category-select" class="w-full p-4 rounded-xl bg-black border border-gray-800 text-white uppercase"></select>
                <select id="loc-group-select" class="w-full p-4 rounded-xl bg-black border border-gray-800 text-white uppercase"></select>
                <textarea id="loc-approach" required rows="3" placeholder="Bejutás..." class="w-full p-4 rounded-xl bg-black border border-gray-800 text-white"></textarea>
                <div class="bg-gray-900 p-5 rounded-3xl border border-gray-800 flex items-center gap-4">
                    <input id="loc-verify-qr" type="checkbox" onchange="window.toggleQrSecret()" class="w-6 h-6 accent-yellow-500">
                    <label for="loc-verify-qr" class="text-[10px] text-gray-300 font-bold uppercase">QR igazolás szükséges</label>
                </div>
                <div id="qr-secret-container" class="hidden"><input id="loc-qr-secret" type="text" placeholder="QR titkos szövege" class="w-full p-4 rounded-xl bg-black border border-gray-800 text-white font-bold"></div>
                <button type="submit" class="w-full bg-green-600 text-black font-bold py-5 rounded-2xl text-sm uppercase shadow-2xl">Mentés</button>
            </form>
        </div>

        <div id="member-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[9000] hidden flex items-center justify-center p-4">
            <div class="bg-gray-900 w-full max-w-sm rounded-[3rem] border border-gray-800 p-8 relative">
                <button onclick="window.closeMemberModal()" class="absolute top-6 right-6">❌</button>
                <h2 id="member-modal-title" class="text-xl font-bold text-white mb-6 uppercase italic">Tagok</h2>
                <div id="modal-member-list"></div>
            </div>
        </div>

        <div id="qr-modal" class="fixed inset-0 bg-black z-[9999] hidden flex flex-col p-6">
            <button onclick="window.closeQrScanner()" class="self-end text-gray-500 mb-8 uppercase text-[10px] font-bold">Mégse ❌</button>
            <div id="qr-reader" class="w-full rounded-3xl overflow-hidden border border-gray-800"></div>
            <p class="mt-8 text-center text-[10px] text-gray-500 uppercase font-bold tracking-widest">Olvasd be a kihelyezett QR kódot!</p>
        </div>
    </main>

    <nav class="fixed bottom-0 inset-x-0 bg-black/95 backdrop-blur-2xl border-t border-gray-800 p-2 pb-6 z-[5000]">
        <div class="max-w-xl mx-auto flex justify-around items-end">
            <button onclick="window.showView('view-map')" class="flex-1 flex flex-col items-center gap-1 group active:scale-90 transition-all">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-500 group-focus:text-green-500"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span class="text-[8px] font-bold text-gray-500 uppercase">Térkép</span>
            </button>
            <button id="checkin-btn-outer" onclick="window.handleAction()" class="hidden bg-green-600 p-5 rounded-full -mt-10 border-[6px] border-black shadow-2xl active:scale-95 opacity-40 hover:opacity-100">
                <svg id="checkin-btn" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"></svg>
            </button>
            <button onclick="window.showView('view-groups')" class="flex-1 flex flex-col items-center gap-1 group active:scale-90 transition-all">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-500 group-focus:text-blue-500"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span class="text-[8px] font-bold text-gray-500 uppercase">Klánok</span>
            </button>
            <button id="nav-login-section" onclick="window.loginWithGoogle()" class="flex-1 flex flex-col items-center gap-1 group active:scale-90 transition-all">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-500"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                <span class="text-[8px] font-bold text-gray-500 uppercase">Belépés</span>
            </button>
            <button id="nav-logout-section" onclick="window.logout()" class="hidden flex-1 flex flex-col items-center gap-1 group active:scale-90 transition-all">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-red-500"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span class="text-[8px] font-bold text-red-500 uppercase">Kilépés</span>
            </button>
        </div>
    </nav>
</body>
</html>
