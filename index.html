<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Átirányítás</title>
</head>
<!-- A test (body) stílusa: fekete háttér és nulla margó a minimalizmus érdekében -->
<body style="background-color: black; margin: 0;">
    <!-- 
        EZ A JS RÉSZLET PRÓBÁLJA MEGHÍVNI A NATÍV ALKALMAZÁST.
        1. Azonnali kísérlet a 'comgooglemaps://' sémával (natív app indítás).
        2. Rövid késleltetés után (fallback) a webes linkre irányít.
    -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // A teljes webes link, ha a natív app indítása nem sikerül (fallback)
            const universalLink = "https://goo.gl/maps/RVNTKULSiVMahYHg9?g_st=ac";
            
            // 1. Kísérlet: Próbálja megnyitni a natív Google Maps alkalmazást a custom URI séma használatával.
            // A keresési lekérdezést használjuk az eredeti goo.gl link helyszínére (ELTE Savaria).
            const customSchemeUrl = "comgooglemaps://?q=Eötvös+Loránd+Tudományegyetem+Savaria+University+Centre";
            
            // Átállítja a címet az alkalmazássémára (ez indítja el az alkalmazást, ha létezik)
            window.location.href = customSchemeUrl;

            // 2. Visszaesés (Fallback): Ha az alkalmazás 250 ms-en belül nem indult el,
            // átirányít a webes linkre.
            setTimeout(function() {
                // Ha még mindig ezen az oldalon vagyunk, az azt jelenti, hogy 
                // az app indítás nem sikerült, így megnyitjuk a webes verziót.
                window.location.replace(universalLink);
            }, 250); // 250 milliszekundum elegendő idő az alkalmazás indításához.
        });
    </script>
</body>
</html>
