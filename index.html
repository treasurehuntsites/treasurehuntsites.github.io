<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Átirányítás a Google Térképre</title>
    <!--
        A kulcsfontosságú sor: A meta refresh tag azonnal (0 másodperc)
        átirányítja a felhasználót a megadott URL-re.
    -->
    <meta http-equiv="refresh" content="0; url=https://www.google.com/maps/d/u/0/viewer?mid=1RPu5lG2mAeR_TLl_D6Ya4ajbleLgikI&ll=47.453898687406785%2C19.01940665000001&z=13">
    
    <style>
        /* Minimalista stílus, ha az átirányítás nem azonnali, vagy a böngésző blokkolja */
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #1a73e8;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        p {
            margin-bottom: 25px;
        }
        a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 15px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            transition: background-color 0.2s, color 0.2s;
            display: inline-block;
        }
        a:hover {
            background-color: #1a73e8;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Átirányítás folyamatban...</h1>
        <p>Ha az átirányítás nem indul el automatikusan, kattintson az alábbi linkre:</p>
        <a href="https://goo.gl/maps/RVNTKULSiVMahYHg9?g_st=ac">Tovább a Google Térképre</a>
    </div>

    <!-- 
        Ez a JavaScript részlet biztosítja a visszamenőleges kompatibilitást és 
        egy extra átirányítási mechanizmust, ha a meta tag valamiért nem működne.
    -->
    <script>
        // Kisebb késleltetés hozzáadása, hogy a felhasználó lássa a lapot, 
        // mielőtt a böngésző átirányítaná (de a meta refresh a leggyorsabb)
        // setTimeout(function() {
        //     window.location.replace("https://goo.gl/maps/RVNTKULSiVMahYHg9?g_st=ac");
        // }, 1000); // 1 másodperc késleltetés
    </script>
</body>
</html>
