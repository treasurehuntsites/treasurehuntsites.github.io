<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Átirányítás</title>
</head>
<!-- A test (body) stílusa: fekete háttér és nulla margó a minimalizmus érdekében -->
<body style="background-color: black; margin: 0;">
    <!-- 
        EZ A JS RÉSZLET CSAK A NATÍV GOOGLE MAPS ALKALMAZÁS INDÍTÁSÁT KÍSÉRLI MEG.
        Az elvetett webes átirányítás (fallback) törölve lett.
    -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // A teljes webes link (most csak a keresési lekérdezés meghatározására szolgál)
            // Az eredeti goo.gl link helyszíne (ELTE Savaria).
            
            // 1. Kísérlet: Próbálja megnyitni a natív Google Maps alkalmazást a custom URI séma használatával.
            const customSchemeUrl = "comgooglemaps://?q=Eötvös+Loránd+Tudományegyetem+Savaria+University+Centre";
            
            // Átállítja a címet az alkalmazássémára (ez indítja el az alkalmazást, ha létezik)
            // FIGYELEM: Ha az alkalmazás nincs telepítve, az oldal fekete marad, és 
            // nem történik további átirányítás.
            window.location.href = customSchemeUrl;

            // A 250 ms-os setTimeout és a webes átirányítás eltávolítva.
        });
    </script>
</body>
</html>
