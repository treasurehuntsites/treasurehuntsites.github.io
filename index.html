<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalandmotor | Interaktív Történetmesélés</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #22d3ee;
            --bg-dark: #020617;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Play', sans-serif;
            background-color: var(--bg-dark);
            color: #f1f5f9;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .special-font { font-family: 'Special Elite', cursive; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0891b2, #0e7490);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.5);
        }

        .logo-glow {
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.6);
        }

        .hidden { display: none !important; }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .scan-effect::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(34, 211, 238, 0.1);
            animation: scanline 4s linear infinite;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col scan-effect">

    <!-- Navigáció -->
    <nav class="fixed w-full z-50 px-4 md:px-6 py-4 glass-card rounded-none border-x-0 border-t-0 bg-opacity-90">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <div class="flex items-center gap-2 group cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                <i class="fa-solid fa-compass text-cyan-400 text-xl md:text-2xl group-hover:rotate-[360deg] transition-transform duration-1000"></i>
                <span class="text-lg md:text-2xl font-bold tracking-tighter text-cyan-400 logo-glow uppercase">Kalandmotor</span>
            </div>
            
            <div class="flex items-center gap-2 md:gap-6">
                <!-- Csak az Auth szekció maradt -->
                <div id="auth-nav-guest" class="flex items-center gap-2 md:gap-4 border-white/10">
                    <button onclick="openModal('login')" class="px-3 py-2 text-slate-300 hover:text-white transition uppercase text-[10px] font-bold tracking-widest">Belépés</button>
                    <button onclick="openModal('register')" class="hidden sm:block btn-primary px-4 py-2 rounded-lg text-white text-[10px] font-bold tracking-widest">Csatlakozás</button>
                </div>

                <div id="auth-nav-user" class="hidden flex items-center gap-3 border-l border-white/10 pl-2 md:pl-6">
                    <div class="text-right hidden xs:block">
                        <span id="user-display-name" class="text-cyan-400 font-bold block leading-none text-[10px] md:text-xs text-nowrap"></span>
                        <span class="text-[8px] md:text-[9px] text-slate-500 uppercase tracking-widest text-nowrap">Kalandmester</span>
                    </div>
                    <button onclick="logout()" class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-red-400 transition border border-white/5">
                        <i class="fa-solid fa-power-off text-sm md:text-base"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-32 px-4">
        <!-- Hero Section -->
        <section class="max-w-7xl mx-auto py-12 text-center">
            <h1 class="text-4xl md:text-8xl font-bold mb-8 tracking-tighter uppercase leading-tight">
                Építsd fel a <br>
                <span class="text-cyan-400 special-font logo-glow">Történetedet</span>
            </h1>
            <p class="text-slate-400 text-sm md:text-xl max-w-2xl mx-auto mb-12 leading-relaxed">
                A <strong>Kalandmotor</strong> segítségével kódolás nélkül hozhatsz létre interaktív világokat.
            </p>
            <div class="flex justify-center">
                <a href="http://treasurehuntsites.github.io/studio" class="btn-primary px-10 py-5 rounded-2xl text-[10px] md:text-xs font-bold tracking-widest uppercase flex items-center">
                    <i class="fa-solid fa-play mr-3"></i> Stúdió indítása
                </a>
            </div>
        </section>

        <!-- Library Section -->
        <section id="library" class="max-w-7xl mx-auto py-24 border-t border-white/5">
            <h2 class="text-2xl font-bold uppercase mb-12 tracking-tighter">Kalandok <span class="text-cyan-400">Könyvtára</span></h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-left">
                <div class="glass-card overflow-hidden group">
                    <div class="h-40 bg-slate-900 flex items-center justify-center">
                        <i class="fa-solid fa-mountain text-4xl text-slate-800 group-hover:text-cyan-400/30 transition-all duration-700"></i>
                    </div>
                    <div class="p-6">
                        <h3 class="font-bold mb-2 uppercase tracking-tight">A Titkok Kora</h3>
                        <p class="text-[10px] text-slate-500 mb-6 uppercase tracking-widest">Készítő: AdminMaster</p>
                        <button class="text-cyan-400 text-[10px] font-black uppercase tracking-[0.2em] hover:text-white transition">Megtekintés <i class="fa-solid fa-arrow-right ml-1"></i></button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Dashboard -->
        <section id="dashboard" class="max-w-7xl mx-auto py-12 hidden border-t border-cyan-500/20">
            <h2 class="text-2xl font-bold uppercase mb-8 tracking-tighter text-white">Saját <span class="text-cyan-400">Világok</span></h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <a href="http://treasurehuntsites.github.io/studio" class="border-2 border-dashed border-slate-800 rounded-2xl p-12 flex flex-col items-center justify-center hover:bg-cyan-400/5 hover:border-cyan-500/40 transition group text-center">
                    <div class="w-12 h-12 rounded-full bg-slate-900 flex items-center justify-center mb-4 group-hover:bg-cyan-500 group-hover:text-black transition duration-500 shadow-xl">
                        <i class="fa-solid fa-plus text-xl"></i>
                    </div>
                    <span class="text-[10px] font-bold text-slate-500 group-hover:text-white uppercase tracking-widest transition">Új Projekt Indítása</span>
                </a>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <div id="auth-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-black/90 backdrop-blur-md overflow-y-auto">
        <div class="glass-card w-full max-w-md p-6 md:p-10 relative border-cyan-500/30 my-auto">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-500 hover:text-white transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            
            <!-- Login View -->
            <div id="login-view" class="hidden">
                <h2 class="text-2xl font-bold text-white uppercase text-center mb-8 tracking-tighter">Belépés</h2>
                <form onsubmit="handleAuthAction(event, 'login')" class="space-y-4">
                    <input type="email" id="login-email" placeholder="Email cím" required class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-cyan-500 transition">
                    <input type="password" id="login-pass" placeholder="Jelszó" required class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-cyan-500 transition">
                    <button type="submit" class="w-full btn-primary py-4 rounded-xl font-bold text-xs uppercase text-white shadow-lg">Rendszer betöltése</button>
                </form>
                <button onclick="handleGoogleSignIn()" class="w-full mt-4 bg-white text-black py-4 rounded-xl font-bold text-[10px] uppercase flex items-center justify-center gap-3 hover:bg-slate-200 transition">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" alt="G"> Belépés Google-lal
                </button>
                <p class="mt-8 text-center text-[10px] text-slate-500 uppercase tracking-widest">Nincs fiókod? <button onclick="switchAuthView('register')" class="text-cyan-400 font-bold hover:underline">Regisztrálj</button></p>
            </div>

            <!-- Register View -->
            <div id="register-view" class="hidden">
                <h2 class="text-2xl font-bold text-white uppercase text-center mb-8 tracking-tighter">Regisztráció</h2>
                <form onsubmit="handleAuthAction(event, 'register')" class="space-y-4">
                    <input type="text" id="reg-name" placeholder="Teljes név" required class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-cyan-500 transition">
                    <input type="email" id="reg-email" placeholder="Email cím" required class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-cyan-500 transition">
                    <input type="password" id="reg-pass" placeholder="Jelszó" required class="w-full bg-slate-900 border border-white/5 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-cyan-500 transition">
                    <button type="submit" class="w-full btn-primary py-4 rounded-xl font-bold text-xs uppercase text-white shadow-lg">Fiók létrehozása</button>
                </form>
                <p class="mt-8 text-center text-[10px] text-slate-500 uppercase tracking-widest">Már van fiókod? <button onclick="switchAuthView('login')" class="text-cyan-400 font-bold hover:underline">Belépés</button></p>
            </div>
        </div>
    </div>

    <!-- Notifier -->
    <div id="notification" class="fixed bottom-10 right-10 z-[200] transform translate-y-32 opacity-0 transition-all duration-500 pointer-events-none">
        <div class="glass-card px-6 py-3 border-cyan-500/50 bg-cyan-950/90 flex items-center gap-3">
            <span id="notif-text" class="text-[10px] font-bold tracking-widest uppercase"></span>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- 🚀 FIX FIREBASE KONFIGURÁCIÓ ---
        const firebaseConfig = {
            apiKey: "AIzaSyCfVce17Yye6jyvpSSoW6jlh3ei7T0N618",
            authDomain: "kalandmotor.firebaseapp.com",
            projectId: "kalandmotor",
            storageBucket: "kalandmotor.firebasestorage.app",
            messagingSenderId: "108860908140",
            appId: "1:108860908140:web:5fbec83f4ae7b51487ee49"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            const guestNav = document.getElementById('auth-nav-guest');
            const userNav = document.getElementById('auth-nav-user');
            const dashboard = document.getElementById('dashboard');

            if (user) {
                const name = (user.displayName || user.email || "Kalandmester").toUpperCase();
                document.getElementById('user-display-name').textContent = name;
                guestNav.classList.add('hidden');
                userNav.classList.remove('hidden');
                dashboard.classList.remove('hidden');
            } else {
                guestNav.classList.remove('hidden');
                userNav.classList.add('hidden');
                dashboard.classList.add('hidden');
            }
        });

        // Modális kezelők
        window.openModal = (type) => {
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('auth-modal').classList.add('flex');
            switchAuthView(type);
        };

        window.closeModal = () => {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('auth-modal').classList.remove('flex');
        };

        window.switchAuthView = (view) => {
            ['login', 'register'].forEach(v => {
                const el = document.getElementById(v + '-view');
                if (el) el.classList.add('hidden');
            });
            const target = document.getElementById(view + '-view');
            if (target) target.classList.remove('hidden');
        };

        window.handleAuthAction = async (e, mode) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            try {
                if (mode === 'login') {
                    await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-pass').value);
                    showNotification("Sikeres belépés!");
                } else {
                    const cred = await createUserWithEmailAndPassword(auth, document.getElementById('reg-email').value, document.getElementById('reg-pass').value);
                    await updateProfile(cred.user, { displayName: document.getElementById('reg-name').value });
                    showNotification("Fiók létrehozva!");
                }
                closeModal();
            } catch (err) { showNotification(err.message); } finally { btn.disabled = false; }
        };

        window.handleGoogleSignIn = async () => {
            try { 
                await signInWithPopup(auth, provider); 
                closeModal(); 
                showNotification("Sikeres belépés!"); 
            } catch (e) {
                console.error(e);
                showNotification("Hiba a Google belépésnél.");
            }
        };

        window.logout = async () => { await signOut(auth); showNotification("Kijelentkezve."); };

        function showNotification(text) {
            const notif = document.getElementById('notification');
            const txt = document.getElementById('notif-text');
            if (txt) txt.textContent = text;
            notif.classList.remove('translate-y-32', 'opacity-0');
            setTimeout(() => notif.classList.add('translate-y-32', 'opacity-0'), 4000);
        }
    </script>
</body>
</html>
