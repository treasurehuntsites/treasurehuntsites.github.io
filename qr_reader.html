<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Kód Leolvasó v4.0 (JSON Konfig)</title>
    <!-- Tailwind CSS a stílusokhoz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#4f46e5',
                        'secondary': '#f97316',
                    }
                }
            }
        }
    </script>
    <style>
        /* A videó és a canvas a teljes szélességet kitölti a fő konténerben */
        #video {
            width: 100%;
            height: 100%;
        }
        /* Célkereszt jelzés a QR kódhoz */
        .scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 300px;
            height: 80%;
            max-height: 300px;
            border: 5px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }
        @media (min-width: 640px) {
             .scanner-frame {
                max-width: 400px;
                max-height: 400px;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4 font-sans">

    <!-- Fő alkalmazás konténer -->
    <div class="w-full max-w-lg bg-white shadow-xl rounded-2xl p-6 space-y-4">
        <h1 class="text-3xl font-bold text-center text-primary">QR Kód Leolvasó v4.0 (JSON Konfig)</h1>
        <p id="status-message" class="text-center text-sm font-medium text-gray-700 h-10 flex items-center justify-center bg-gray-100 rounded-lg">
            Konfiguráció betöltése...
        </p>

        <!-- QR Kód Olvasó Rész -->
        <div id="video-container" class="relative w-full aspect-square bg-gray-200 rounded-xl overflow-hidden shadow-inner">
            <video id="video" playsinline></video>
            <div id="scanner-frame" class="scanner-frame"></div>
        </div>

        <button id="start-scan-button" class="w-full py-3 bg-primary text-white font-semibold rounded-lg shadow-md hover:bg-indigo-600 transition duration-150" style="display: none;">
            Kamera Engedélyezése és Indítás
        </button>

        <!-- Rejtett Canvas a feldolgozáshoz -->
        <canvas id="canvas" style="display: none;"></canvas>

        <p class="text-xs text-center text-gray-400">
            Célkód: <span id="target-display" class="font-bold text-primary">...</span>
        </p>

    </div>

    <!-- Core JS és jsQR Scriptek -->
    <script type="module">
        import jsQR from "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";

        // --- KONFIGURÁCIÓ: A JSON fájl elérési útja ---
        // A JSON fájlnak ugyanabban a mappában kell lennie, mint ennek a HTML fájlnak.
        const CONFIG_FILE_PATH = 'config.json'; 
        // ----------------------------------------------

        // Rögzített (JSON-ból betöltött) értékek
        let targetValue = '';
        let redirectUrl = ''; 
        
        // UI elemek
        const statusMessage = document.getElementById('status-message');
        const startScanButton = document.getElementById('start-scan-button');
        const targetDisplay = document.getElementById('target-display');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Állapotváltozók
        let stream = null;
        let scanning = false;

        // --- JSON Adatok Lekérése ---
        async function loadConfig() {
            try {
                // A fetch() hívás lekéri a helyi config.json fájlt
                const response = await fetch(CONFIG_FILE_PATH);
                if (!response.ok) {
                    throw new Error(`Hiba a konfigurációs fájl betöltésekor: ${response.status} ${response.statusText}`);
                }
                const data = await response.json();
                
                targetValue = data.targetValue;
                redirectUrl = data.redirectUrl;

                if (!targetValue || !redirectUrl) {
                     throw new Error('Hiányzó targetValue vagy redirectUrl a JSON fájlban.');
                }
                
                // Sikeres betöltés után frissíti a státuszt és megjeleníti a gombot
                statusMessage.textContent = `Kész. Célkód: "${targetValue}" beállítva. Kattintson az indításhoz.`;
                targetDisplay.textContent = targetValue;
                startScanButton.style.display = 'block';

            } catch (error) {
                console.error("Kritikus hiba a konfiguráció betöltésekor:", error);
                statusMessage.innerHTML = `<span class='font-bold text-red-600'>KRITIKUS HIBA:</span> Nem sikerült betölteni a konfigurációt a <span class='font-mono bg-yellow-200 px-1 rounded'>config.json</span> fájlból. Kérem, ellenőrizze az elérési utat és a fájl tartalmát.`;
                targetDisplay.textContent = 'HIBA';
            }
        }

        // --- Kamera Inicializálás / Engedélykérés Logika ---
        
        // Hibaüzenet kezelő segédfüggvény
        function handleCameraError(err) {
            console.error("Kritikus hiba a kamera elérésénél: ", err);
            let errorMessage = "Hiba: Nem sikerült elérni a kamerát. Lehetséges okok: ";
            if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                errorMessage += "A felhasználó megtagadta az engedélyt (ellenőrizd a címsort!).";
            } else if (err.name === 'NotFoundError') {
                errorMessage += "Nincs elérhető kamera a készüléken.";
            } else if (location.protocol !== 'https:' && location.protocol !== 'file:') {
                errorMessage += "Csak biztonságos (HTTPS) vagy helyi (FILE) környezetben működik.";
            } else {
                 errorMessage += `Ismeretlen hiba (${err.name}). Ellenőrizze a konzolt a részletekért.`;
            }
            
            statusMessage.textContent = errorMessage;
            startScanButton.style.display = 'block';
        }

        async function initializeCamera() {
            if (scanning || !targetValue) return;
            
            statusMessage.textContent = "Kamera engedély kérése...";

            let streamAttempted = false;
            
            // Kísérlet 1: Hátsó kamera (environment)
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                streamAttempted = true;
            } catch (err) {
                console.warn("Első kamera indítási kísérlet (environment) sikertelen:", err);
                
                if (err.name === 'NotFoundError') {
                    // Kísérlet 2: Bármely elérhető kamera (user/default)
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ video: true }); 
                        streamAttempted = true;
                    } catch (secondErr) {
                        handleCameraError(secondErr);
                        return;
                    }
                } else {
                    handleCameraError(err);
                    return;
                }
            }
            
            // Ha sikeresen kaptunk stream-et
            if (streamAttempted && stream) {
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                startScanButton.style.display = 'none';

                video.addEventListener('loadedmetadata', () => {
                    scanning = true;
                    statusMessage.textContent = "Keresés: Tartsa a QR kódot a célkeresztben.";
                    requestAnimationFrame(tick);
                });
            }
        }

        // --- Szkennelő Ciklus és Logika ---

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    handleQrCode(code.data);
                    return;
                }
            }

            if (scanning) {
                requestAnimationFrame(tick);
            }
        }

        function handleQrCode(scannedValue) {
            scanning = false;
            statusMessage.textContent = `QR kód beolvasva: ${scannedValue}`;

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            // Összehasonlítás a JSON-ból betöltött értékkel
            if (scannedValue === targetValue) {
                statusMessage.textContent = `Siker! A kód egyezik. Átirányítás ${redirectUrl} oldalra 3 másodperc múlva...`;

                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 3000);
            } else {
                statusMessage.textContent = `Hiba! A kód (${scannedValue}) NEM egyezik (${targetValue}). Próbálja újra 5 másodperc múlva.`;

                setTimeout(() => {
                    scanning = true;
                    initializeCamera(); 
                }, 5000);
            }
        }
        
        // --- Indítás A Dokumentum Betöltésekor ---
        document.addEventListener('DOMContentLoaded', () => {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                loadConfig(); // Konfiguráció betöltése a JSON-ból
            } else {
                statusMessage.textContent = 'Hiba: Ez a böngésző nem támogatja a kamerát.';
            }
        });

        startScanButton.addEventListener('click', initializeCamera);
    </script>

    <!-- jsQR import -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</body>
</html>
