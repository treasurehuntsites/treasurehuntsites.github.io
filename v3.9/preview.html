<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title id="app-title">Anna és Márk - Előnézet V3.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; }
        body {
            visibility: hidden; opacity: 0; transition: opacity 0.3s; 
            margin: 0; font-family: 'Play', sans-serif; background: var(--bg-color); color: var(--text-color);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; text-align: center;
        }
        .full-width-image-container { width: 100%; height: 100vh; position: absolute; z-index: 0; background: #111; }
        .full-width-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .content-box {
            background: rgba(0,0,0,0.85); padding: 40px 20px 10px; border-radius: 10px 10px 0 0;
            width: calc(100% - 40px); max-width: 800px; position: fixed; bottom: 50px; z-index: 10;
            border: 3px solid #8a2be2; text-align: left;
        }
        .fixed-menu-bar {
            position: fixed; bottom: 0; width: 100%; height: 50px; background: #1a1a1a;
            border-top: 2px solid #8a2be2; z-index: 50; display: flex; justify-content: space-around; align-items: center;
        }
        .menu-button { background: none; border: none; color: #fff; font-size: 1.5em; cursor: pointer; position: relative; }
        
        /* PIROS PONT */
        .notification-dot {
            position: absolute; top: 5px; right: 5px; width: 12px; height: 12px;
            background: red; border-radius: 50%; border: 2px solid #1a1a1a; display: none;
        }

        #galleryModal { display: none; position: fixed; z-index: 100; width: 100%; height: 100%; background: rgba(0,0,0,0.95); overflow-y: auto; }
        #gallery-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 50px 15px; max-width: 800px; margin: auto; }
        .gallery-thumbnail { border: 2px solid #8a2be2; height: 150px; overflow: hidden; }
        .gallery-thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        .close-gallery { position: absolute; top: 15px; right: 30px; font-size: 40px; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <div class="full-width-image-container"><img id="story-image"></div>
    <div class="content-box" id="content-box">
        <img id="avatar-display" style="position:absolute; top:-50px; left:10px; width:70px; height:70px; border-radius:50%; border:2px solid #00ffff;">
        <div id="story-text-display" style="font-weight:bold; font-size:1.2em; min-height:100px;"></div>
        <div id="interaction-container" style="margin-top:20px; text-align:right;"></div>
    </div>
    <div class="fixed-menu-bar">
        <button class="menu-button" onclick="openGallery()">
            <i class="fas fa-images"></i>
            <span id="gallery-dot" class="notification-dot"></span>
        </button>
    </div>
    <div id="galleryModal">
        <span class="close-gallery" onclick="closeModal()">&times;</span>
        <div id="gallery-container"></div>
    </div>

    <script>
        let CONFIG = JSON.parse(localStorage.getItem('game_config_preview') || '{}');
        let currentIndex = 0;
        let collectedImages = [];
        const dot = document.getElementById('gallery-dot');

        function update() {
            const p = CONFIG.pages[currentIndex];
            document.getElementById('story-text-display').innerText = p.text;
            document.getElementById('story-image').src = p.backgroundImage;
            document.getElementById('avatar-display').src = p.avatarImage || "";
            
            if (p.galleryImage && !collectedImages.includes(p.galleryImage)) {
                collectedImages.push(p.galleryImage);
                dot.style.display = 'block';
            }

            const cont = document.getElementById('interaction-container');
            cont.innerHTML = '';
            if (currentIndex < CONFIG.pages.length - 1) {
                const b = document.createElement('button');
                b.innerText = "Tovább";
                b.style.padding = "10px 20px";
                b.onclick = () => { currentIndex++; update(); };
                cont.appendChild(b);
            }
        }

        function openGallery() {
            dot.style.display = 'none';
            const g = document.getElementById('gallery-container');
            g.innerHTML = '';
            collectedImages.forEach(src => {
                g.innerHTML += `<div class="gallery-thumbnail"><img src="${src}"></div>`;
            });
            document.getElementById('galleryModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('galleryModal').style.display = 'none'; }

        if (CONFIG.pages) {
            document.body.style.visibility = 'visible';
            document.body.style.opacity = 1;
            update();
        }
    </script>
</body>
</html>
