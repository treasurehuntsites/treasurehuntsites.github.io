<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title id="app-title">Anna és Márk - Előnézet</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #8a2be2;
        }

        html { overflow-x: hidden; overflow-y: auto; }
        body.modal-open { overflow: hidden; height: 100%; touch-action: none; }

        body {
            visibility: hidden; opacity: 0; transition: opacity 0.3s ease-in-out; 
            margin: 0; padding: 0; font-family: 'Play', sans-serif;
            color: var(--text-color); 
            background-color: var(--bg-color);
            display: flex; flex-direction: column; align-items: center;
            overflow-y: auto; min-height: 100vh; touch-action: auto; 
            text-align: center; padding-bottom: 60px; 
        }
        
        .full-width-image-container {
            width: 100%; height: 100vh; overflow: hidden; position: absolute;
            top: 0; left: 0; z-index: 0; background-color: #111111;
        }
        .full-width-image-container img {
            width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block;
        }

        .content-box {
            background-color: rgba(0, 0, 0, 0.85); 
            padding: 40px 20px 10px 20px; 
            margin: 0; 
            border-radius: 10px 10px 0 0; 
            max-width: 800px;
            width: calc(100% - 40px);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.7);
            border: 3px solid var(--accent-color);
            box-sizing: border-box;
            position: fixed; bottom: 50px; left: 50%;
            transform: translateX(-50%); 
            z-index: 10;
            text-align: left;
            min-height: 250px; 
            display: flex; flex-direction: column; justify-content: space-between; 
        }

        #story-text-display {
            font-size: 1.2em; font-weight: 700; line-height: 1.6;
            margin-bottom: 20px; white-space: pre-wrap; flex-grow: 1; 
        }

        .bottom-bar { padding-top: 10px; border-top: 1px dashed var(--accent-color); min-height: 48px; width: 100%; }
        .interaction-container { display: flex; justify-content: flex-end; align-items: center; width: 100%; }
        
        .page-button {
            padding: 12px 20px; color: #ffffff; background-color: var(--accent-color); border: none; border-radius: 5px;
            font-size: 1.1em; font-weight: 700; cursor: pointer; text-transform: uppercase; margin: 5px;
            box-shadow: 0 4px 10px rgba(138, 43, 226, 0.4);
        }
        
        .avatar-image {
            position: absolute; top: -50px; left: 10px; width: 70px; height: 70px;
            border-radius: 50%; object-fit: cover; z-index: 20; border: 2px solid #00ffff;
        }
        
        .fixed-menu-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 50px;
            background-color: #1a1a1a; border-top: 2px solid var(--accent-color); z-index: 50;
            display: flex; justify-content: space-around; align-items: center;
        }

        .menu-button { 
            background: none; border: none; color: #ffffff; font-size: 1.5em; 
            cursor: pointer; position: relative; padding: 5px 10px;
        }
        .menu-button:hover { color: #00ffff; }

        /* PIROS PONT (BADGE) STÍLUS */
        .notification-dot {
            position: absolute;
            top: 5px;
            right: 8px;
            width: 12px;
            height: 12px;
            background-color: #ff0000;
            border-radius: 50%;
            border: 2px solid #1a1a1a;
            display: none; /* Kezdetben rejtve */
            box-shadow: 0 0 5px rgba(255, 0, 0, 0.8);
            z-index: 60;
        }

        #galleryModal {
            display: none; position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%; overflow-y: scroll; background-color: rgba(0, 0, 0, 0.95);
        }
        
        #gallery-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 60px 15px 15px 15px;
            max-width: 800px; margin: 0 auto; box-sizing: border-box;
        }

        .gallery-thumbnail {
            border: 2px solid var(--accent-color); height: 150px; overflow: hidden;
            border-radius: 5px; box-shadow: 0 0 10px rgba(138, 43, 226, 0.4);
        }
        .gallery-thumbnail img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .close-gallery { position: absolute; top: 15px; right: 25px; color: #fff; font-size: 40px; cursor: pointer; z-index: 110; }
    </style>
</head>
<body>
    <div class="full-width-image-container">
        <img id="story-image" src="" alt="Háttér">
    </div>

    <div class="content-box" id="content-box">
        <img id="avatar-display" class="avatar-image" src="" alt="Avatar">
        <div id="story-text-display"></div>
        <div class="bottom-bar">
            <div class="interaction-container" id="interaction-container"></div>
        </div>
    </div>

    <div class="fixed-menu-bar">
        <button class="menu-button" onclick="openGallery()" title="Galéria">
            <i class="fas fa-images"></i>
            <span id="gallery-dot" class="notification-dot"></span>
        </button>
        <button class="menu-button" onclick="alert('Súgó: Ez egy előnézeti oldal.')" title="Súgó">
            <i class="fas fa-question-circle"></i>
        </button>
    </div>

    <div id="galleryModal">
        <span class="close-gallery" onclick="closeModal()">&times;</span>
        <div id="gallery-container"></div>
    </div>

    <script>
        // Betöltés LocalStorage-ból (az Admin oldal menti ide)
        const STORAGE_KEY = 'game_config_preview';
        let CONFIG = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        let currentIndex = 0;
        let collectedImages = [];
        
        const textDisp = document.getElementById('story-text-display');
        const imgDisp = document.getElementById('story-image');
        const avaDisp = document.getElementById('avatar-display');
        const contDisp = document.getElementById('interaction-container');
        const dot = document.getElementById('gallery-dot');

        function update() {
            if (!CONFIG.pages || CONFIG.pages.length === 0) return;
            const p = CONFIG.pages[currentIndex];
            
            textDisp.innerText = p.text;
            imgDisp.src = p.backgroundImage;
            
            if (p.avatarImage) {
                avaDisp.src = p.avatarImage;
                avaDisp.style.display = "block";
            } else {
                avaDisp.style.display = "none";
            }

            // Értesítés (piros pont) kezelése
            if (p.galleryImage && p.galleryImage.trim() !== "") {
                if (!collectedImages.includes(p.galleryImage)) {
                    collectedImages.push(p.galleryImage);
                    dot.style.display = 'block'; // Megjelenik az értesítés
                }
            }

            contDisp.innerHTML = '';
            if (currentIndex < CONFIG.pages.length - 1) {
                const b = document.createElement('button');
                b.className = 'page-button';
                b.innerText = 'Tovább';
                b.onclick = () => { 
                    currentIndex++; 
                    update(); 
                };
                contDisp.appendChild(b);
            }
        }

        function openGallery() {
            dot.style.display = 'none'; // Megnyitáskor eltűnik az értesítés
            const g = document.getElementById('gallery-container');
            g.innerHTML = '';
            
            if (collectedImages.length === 0) {
                g.innerHTML = '<p style="grid-column: 1/-1;">Még nincsenek gyűjtött képek.</p>';
            } else {
                collectedImages.forEach(src => {
                    const div = document.createElement('div');
                    div.className = 'gallery-thumbnail';
                    div.innerHTML = `<img src="${src}" alt="Galéria kép">`;
                    g.appendChild(div);
                });
            }
            
            document.getElementById('galleryModal').style.display = 'block';
            document.body.classList.add('modal-open');
        }

        function closeModal() {
            document.getElementById('galleryModal').style.display = 'none';
            document.body.classList.remove('modal-open');
        }

        // Inicializálás
        if (CONFIG.pages && CONFIG.pages.length > 0) {
            document.body.style.visibility = 'visible';
            document.body.style.opacity = 1;
            update();
        } else {
            document.body.innerHTML = '<h2 style="padding:20px;">Nincs betölthető konfiguráció. Kérlek mentsd el az Admin oldalon!</h2>';
            document.body.style.visibility = 'visible';
            document.body.style.opacity = 1;
        }
    </script>
</body>
</html>
