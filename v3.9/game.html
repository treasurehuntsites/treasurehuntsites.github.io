<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title id="app-title">Anna és Márk - Játék V3.8</title>
    
    <!-- GPS és Ikonok -->
    <meta http-equiv="Permissions-Policy" content="geolocation=*">
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* CSS Változók a dinamikus színekhez */
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #8a2be2;
            --notification-red: #ff3b30;
        }

        html { overflow-x: hidden; overflow-y: auto; }
        
        /* Amikor egy modal nyitva van, a főoldal görgetését letiltjuk */
        body.modal-open { overflow: hidden; height: 100%; touch-action: none; }

        body {
            /* Kezdeti rejtés: JS állítja át opacity: 1-re a sikeres betöltés után */
            opacity: 0; 
            transition: opacity 0.3s ease-in-out; 
            margin: 0; padding: 0; font-family: 'Play', sans-serif;
            color: var(--text-color); 
            background-color: var(--bg-color);
            display: flex; flex-direction: column; align-items: center;
            overflow-y: auto; min-height: 100vh; touch-action: auto; 
            text-align: center; padding-bottom: 60px; 
        }
        
        /* Háttérkép */
        .full-width-image-container {
            width: 100%; height: 100vh; overflow: hidden; position: absolute;
            top: 0; left: 0; z-index: 0; min-height: 100vh; background-color: #111111;
        }
        .full-width-image-container img {
            width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block;
        }

        /* Fix Tartalom Doboz */
        .content-box {
            background-color: rgba(0, 0, 0, 0.85); 
            padding: 40px 20px 10px 20px; 
            margin: 0; 
            border-radius: 10px 10px 0 0; 
            max-width: 800px;
            width: calc(100% - 40px);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.7);
            border: 3px solid var(--accent-color);
            box-sizing: border-box;
            position: fixed; bottom: 50px; left: 50%;
            transform: translateX(-50%); 
            z-index: 10;
            text-align: left;
            min-height: 250px; 
            display: flex; flex-direction: column; justify-content: space-between; 
            opacity: 1; 
            transition: opacity 0.5s ease-in-out; 
        }
        
        .content-hidden { opacity: 0; }

        /* Diszkrét Vissza Gomb */
        .discreet-back-button {
            position: absolute; top: 10px; left: 10px;
            background: transparent; border: none;
            color: rgba(255, 255, 255, 0.4); font-size: 1.3em;
            cursor: pointer; transition: color 0.3s, transform 0.2s;
            z-index: 25; padding: 5px;
        }
        .discreet-back-button:hover { color: #00ffff; transform: scale(1.1); }
        .discreet-back-button:disabled { display: none; }

        #story-text-display {
            font-size: 1.2em; font-weight: 700; line-height: 1.6;
            margin-bottom: 20px; white-space: pre-wrap; flex-grow: 1; 
        }
        
        /* Audio gombok */
        .audio-container { text-align: center; margin-bottom: 15px; }
        .audio-button {
            padding: 12px 20px; text-decoration: none; color: #1a1a1a;
            background-color: #00FFFF; border: none; border-radius: 5px;
            font-size: 1.1em; font-weight: 700; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
        }

        /* Navigáció */
        .bottom-bar { padding-top: 10px; border-top: 1px dashed var(--accent-color); min-height: 48px; width: 100%; }
        .interaction-container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .page-button {
            padding: 12px 20px; color: #ffffff; background-color: var(--accent-color); border: none; border-radius: 5px;
            font-size: 1.1em; font-weight: 700; cursor: pointer; text-transform: uppercase; margin: 5px;
            box-shadow: 0 4px 10px rgba(138, 43, 226, 0.4);
        }
        .page-button:disabled { background-color: #555555; cursor: not-allowed; box-shadow: none; opacity: 0.6; }
        
        /* Választás Gombok */
        .multi-choice-container { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .choice-button {
            background-color: #00FFFF; color: #1a1a1a; padding: 12px 15px;
            border-radius: 5px; font-weight: bold; font-size: 1.1rem; border: none;
            width: 100%; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 2px 5px rgba(0, 255, 255, 0.3); transition: background-color 0.2s;
        }
        .choice-button:hover { background-color: #00ddee; }
        
        .avatar-image {
            position: absolute; top: -50px; left: -10px; width: 70px; height: 70px;
            border-radius: 50%; object-fit: cover; z-index: 20; display: block;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.5); transition: opacity 0.3s ease-in-out; 
        }
        
        /* Alsó Menüsor */
        .fixed-menu-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 50px;
            background-color: #1a1a1a; border-top: 2px solid var(--accent-color); z-index: 50;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 -4px 15px rgba(138, 43, 226, 0.5);
        }
        .menu-button-wrapper { position: relative; display: flex; align-items: center; justify-content: center; }
        .menu-button { background: none; border: none; color: #ffffff; font-size: 1.5em; cursor: pointer; padding: 5px 10px; transition: color 0.2s; }
        .menu-button:hover { color: #00ffff; }

        /* Értesítési Pötty */
        .notification-dot {
            position: absolute; top: 5px; right: 5px;
            width: 12px; height: 12px;
            background-color: var(--notification-red);
            border-radius: 50%;
            border: 2px solid #1a1a1a;
            box-shadow: 0 0 5px rgba(255, 59, 48, 0.6);
            display: none;
        }
        .notification-dot.visible { display: block; }
        
        /* Jelszó Szekció */
        #password-container { display: none; flex-direction: column; gap: 15px; width: 100%; text-align: center; }
        #password-container.visible { display: flex; }
        #password-input { padding: 12px; border: 2px solid var(--accent-color); border-radius: 5px; background-color: #2c2c2c; color: #00ffff; font-size: 1.2em; text-align: center; font-family: 'Play', sans-serif; }
        .password-interaction { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; }
        #check-password-button { flex-grow: 1; background-color: #00ffff; color: #1a1a1a; }
        
        /* Galéria Modal */
        #galleryModal {
            display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
            overflow-y: scroll; background-color: rgba(0, 0, 0, 0.95);
        }
        #gallery-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px;
            width: 100%; max-width: 800px; margin: 0 auto; box-sizing: border-box; padding-top: 50px;
        }
        .gallery-thumbnail {
            width: 100%; height: 150px; overflow: hidden; border: 2px solid var(--accent-color);
            border-radius: 5px; cursor: pointer; box-shadow: 0 0 10px rgba(138, 43, 226, 0.4);
            transition: transform 0.2s; position: relative;
        }
        .gallery-thumbnail img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* Nagyított kép */
        #full-image-display {
            display: none; position: fixed; z-index: 101; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.98); overflow: hidden; 
        }
        .full-image-content { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #fullImageDisplay { display: block; width: auto; height: auto; max-width: 100%; max-height: 100%; touch-action: auto; cursor: zoom-in; margin: auto; transition: transform 0.3s ease-in-out; }
        .close-gallery { position: absolute; top: 15px; right: 33px; color: #f1f1f1; font-size: 40px; font-weight: bold; transition: 0.3s; cursor: pointer; z-index: 110; text-shadow: 0 0 5px rgba(0, 0, 0, 1); }

        /* Súgó Modal */
        #help-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; flex-direction: column; }
        .modal-content { background: #1a1a1a; padding: 25px; border: 2px solid #00ffff; border-radius: 10px; text-align: center; max-width: 90%; color: #e0e0e0; position: relative; }
        
        /* GPS Modal */
        #distanceModal { display: none; position: fixed; z-index: 250; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(2px); flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .distance-content { padding: 20px; max-width: 90%; background-color: rgba(0, 0, 0, 0.85); border-radius: 10px; box-shadow: 0 0 30px rgba(0, 255, 255, 0.8); border: 2px solid #00ffff; }
        #distance-modal-display { font-size: 3em; color: #00ff00; margin: 20px; font-weight: bold; }
        #distance-modal-map-button { display: inline-block; margin-top: 20px; background-color: transparent; border: 2px solid #00ffff; color: #00ffff; padding: 10px 20px; border-radius: 5px; font-size: 1.2em; font-weight: bold; text-decoration: none; transition: all 0.2s; }
    </style>
</head>
<body oncontextmenu="return false;"> 
    <div class="full-width-image-container">
        <img id="story-image" alt="Háttér" onerror="this.onerror=null; this.style.opacity='0';">
    </div>

    <div class="content-box content-hidden" id="content-box"> 
        <button id="discreet-back-button" class="discreet-back-button" title="Vissza">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <img id="avatar-img" class="avatar-image" src="" alt="Avatar">
        <p id="story-text-display"></p>
        
        <div id="audio-container-1" class="audio-container" style="display:none;">
             <button id="play-audio-button-1" class="audio-button">▶️ Lejátszás (1)</button>
        </div>
        <div id="audio-container-2" class="audio-container" style="display:none;">
             <button id="play-audio-button-2" class="audio-button">▶️ Lejátszás (2)</button>
        </div>

        <div class="bottom-bar">
            <div class="interaction-container" id="interaction-container">
                <button id="prev-page-button" class="page-button" disabled>Vissza</button>
                <button id="next-page-button" class="page-button">Tovább</button>
            </div>
            <div class="multi-choice-container" id="multi-choice-container" style="display:none;"></div>
            <div id="password-container">
                <p>
                    <span id="password-prompt-text">Add meg a kódot:</span>
                    <button id="help-button" style="background:none;border:none;color:#00ffff;font-size:1.5em;margin-left:5px;"><i class="fa-solid fa-circle-question"></i></button>
                </p>
                <input type="text" id="password-input" maxlength="12">
                <div class="password-interaction">
                    <button id="back-button-password" class="page-button">Vissza</button>
                    <button id="check-password-button" class="page-button">ELLENŐRZÉS</button>
                </div>
                <p id="message" style="margin-top:10px;font-weight:bold;"></p>
            </div>
        </div>
    </div>
    
    <div class="fixed-menu-bar">
        <button id="map-button" class="menu-button" title="Térkép"><i class="fa-solid fa-map-location-dot"></i></button>
        <div class="menu-button-wrapper">
            <button id="image-button" class="menu-button" title="Galéria / Kép"><i class="fa-solid fa-image"></i></button>
            <div id="galeria-ertisites" class="notification-dot"></div>
        </div>
    </div>
    
    <!-- Modálok -->
    <div id="galleryModal">
      <span class="close-gallery">×</span>
      <div id="gallery-container"></div>
    </div>
    
    <div id="full-image-display">
        <div class="full-image-content">
            <img id="fullImageDisplay" src="" alt="Nagyított kép" />
        </div>
        <span class="close-gallery" style="z-index: 120;">×</span>
    </div>
    
    <div id="help-modal">
        <div class="modal-content">
            <h2 class="modal-title" style="color:#00ffff;">Segítség</h2>
            <p id="help-text-display"></p>
            <div class="flex gap-2 justify-center" style="margin-top:20px;">
                <button id="help-close-button" class="page-button">Bezárás</button>
                <button id="help-next-button" class="page-button">Tovább</button>
            </div>
        </div>
    </div>

    <div id="distanceModal">
        <div class="distance-content">
            <h1 id="gps-title" class="modal-title">CÉLPONT KERESÉSE</h1>
            <div id="distance-modal-display">-- M</div>
            <p id="distance-status">Helyzetmeghatározás...</p>
            <a href="#" target="_blank" id="distance-modal-map-button">🗺️ Térkép</a>
        </div>
    </div>

    <audio id="story-audio-1" src="" preload="auto"></audio>
    <audio id="story-audio-2" src="" preload="auto"></audio>

    <script>
        (function() {
            const CONFIG_PATH = 'game_config.json';
            const PROGRESS_KEY = 'gameProgress';
            const GALLERY_VIEW_KEY = 'lastSeenGalleryPageIndexGame';

            let CONFIG = {};
            let currentPartIndex = 0;
            let currentHelpIndex = 0;
            let currentScale = 1.0; 
            let watchId = null;

            const els = {
                storyDisplay: document.getElementById('story-text-display'),
                storyImage: document.getElementById('story-image'),
                avatarImg: document.getElementById('avatar-img'),
                contentBox: document.getElementById('content-box'),
                nextBtn: document.getElementById('next-page-button'),
                prevBtn: document.getElementById('prev-page-button'),
                discreetBackBtn: document.getElementById('discreet-back-button'),
                interactionCont: document.getElementById('interaction-container'),
                passCont: document.getElementById('password-container'),
                multiChoiceCont: document.getElementById('multi-choice-container'),
                passInput: document.getElementById('password-input'),
                checkBtn: document.getElementById('check-password-button'),
                msgDisplay: document.getElementById('message'),
                distModal: document.getElementById('distanceModal'),
                distDisplay: document.getElementById('distance-modal-display'),
                distStatus: document.getElementById('distance-status'),
                helpModal: document.getElementById('help-modal'),
                helpText: document.getElementById('help-text-display'),
                galleryModal: document.getElementById('galleryModal'),
                galleryContainer: document.getElementById('gallery-container'),
                fullImageModal: document.getElementById('full-image-display'),
                fullImage: document.getElementById('fullImageDisplay'),
                galleryNotif: document.getElementById('galeria-ertisites')
            };

            async function loadConfig() {
                try {
                    const response = await fetch(CONFIG_PATH);
                    if (!response.ok) throw new Error("A konfiguráció nem érhető el.");
                    CONFIG = await response.json();
                } catch (e) {
                    throw new Error("Hiba a game_config.json betöltésekor: " + e.message);
                }
            }

            function updateUI() {
                const page = CONFIG.storyPages[currentPartIndex];
                if (!page) return;

                // Háttér
                let activeBg = CONFIG.BACKGROUND_URL;
                for(let i = 0; i <= currentPartIndex; i++) {
                    if (CONFIG.storyPages[i] && CONFIG.storyPages[i].customBackgroundUrl) {
                        activeBg = CONFIG.storyPages[i].customBackgroundUrl;
                    }
                }
                els.storyImage.src = activeBg;

                // Avatar és szöveg
                const prefix = page.content.split(' ')[0];
                let avatarUrl = CONFIG.AVATARS.DEFAULT_AVATAR_URL;
                let opacity = 1;
                let text = page.content;

                if (page.customAvatarUrl) {
                    avatarUrl = page.customAvatarUrl;
                    if (CONFIG.AVATARS.AVATAR_MAP[prefix] || CONFIG.AVATARS.HIDDEN_PREFIXES.includes(prefix)) {
                        text = text.substring(prefix.length).trim();
                    }
                } else if (CONFIG.AVATARS.AVATAR_MAP[prefix]) { 
                    avatarUrl = CONFIG.AVATARS.AVATAR_MAP[prefix]; 
                    text = text.substring(prefix.length).trim(); 
                } else if (CONFIG.AVATARS.HIDDEN_PREFIXES.includes(prefix)) { 
                    opacity = 0; text = text.substring(prefix.length).trim();
                }

                els.avatarImg.src = avatarUrl;
                els.avatarImg.style.opacity = opacity;
                els.avatarImg.style.display = (opacity === 0 && !page.customAvatarUrl) ? 'none' : 'block';
                els.storyDisplay.innerHTML = text;

                // Galéria értesítés pötty
                checkGalleryNotification();

                // Interakciók
                els.interactionCont.style.display = 'flex';
                els.passCont.classList.remove('visible');
                els.multiChoiceCont.style.display = 'none';
                els.msgDisplay.textContent = '';
                els.passInput.value = '';
                document.getElementById('audio-container-1').style.display = 'none';
                document.getElementById('audio-container-2').style.display = 'none';

                if (page.type === 'password') {
                    els.interactionCont.style.display = 'none';
                    els.passCont.classList.add('visible');
                    document.getElementById('help-button').style.display = (page.helpMessage && page.helpMessage.length > 0) ? 'inline-block' : 'none';
                } else if (page.type === 'choice') {
                    els.interactionCont.style.display = 'none';
                    els.multiChoiceCont.style.display = 'flex';
                    els.multiChoiceCont.innerHTML = '';
                    page.choices.forEach(choice => {
                        const btn = document.createElement('button');
                        btn.className = 'choice-button';
                        btn.textContent = choice.text;
                        btn.onclick = () => { currentPartIndex = choice.nextIndex; saveProgress(); showStory(); };
                        els.multiChoiceCont.appendChild(btn);
                    });
                } else if (page.type === 'audio') {
                    document.getElementById('audio-container-' + (page.audioId || 1)).style.display = 'block';
                }

                els.nextBtn.textContent = (currentPartIndex === CONFIG.storyPages.length - 1) ? "Célpont Keresése" : "Tovább";
                els.prevBtn.disabled = (currentPartIndex === 0);
                els.discreetBackBtn.disabled = (currentPartIndex === 0);
            }

            function checkGalleryNotification() {
                const lastSeenIndex = parseInt(localStorage.getItem(GALLERY_VIEW_KEY) || "-1");
                let hasNewImage = false;
                for (let i = 0; i <= currentPartIndex; i++) {
                    const p = CONFIG.storyPages[i];
                    if (p && p.customGalleryUrl && p.customGalleryUrl.trim() !== "" && i > lastSeenIndex) {
                        hasNewImage = true;
                        break;
                    }
                }
                if (hasNewImage) els.galleryNotif.classList.add('visible');
                else els.galleryNotif.classList.remove('visible');
            }

            function showStory() {
                els.contentBox.classList.add('content-hidden');
                setTimeout(() => {
                    updateUI();
                    els.contentBox.classList.remove('content-hidden');
                }, 100);
            }

            function getGalleryImages() {
                let images = [];
                for(let i = 0; i <= currentPartIndex; i++) {
                    const p = CONFIG.storyPages[i];
                    if (!p) continue;
                    if (p.galleryMode === 'clear') images = [];
                    if (p.customGalleryUrl) {
                        const urls = p.customGalleryUrl.split(/[\n,]/).map(u => u.trim()).filter(u => u);
                        urls.forEach(url => {
                            const idx = images.indexOf(url);
                            if (p.galleryMode === 'remove_url') { if (idx > -1) images.splice(idx, 1); }
                            else { if (idx === -1) images.push(url); }
                        });
                    }
                }
                return images;
            }

            function openGallery() {
                localStorage.setItem(GALLERY_VIEW_KEY, currentPartIndex.toString());
                els.galleryNotif.classList.remove('visible');
                els.galleryContainer.innerHTML = '';
                const images = getGalleryImages();
                if (images.length === 0) {
                    els.galleryContainer.innerHTML = '<p style="grid-column: 1/-1; color:gray;">Még nincsenek képek.</p>';
                } else {
                    images.forEach(url => {
                        const div = document.createElement('div');
                        div.className = 'gallery-thumbnail';
                        div.innerHTML = `<img src="${url}" alt="Kép">`;
                        div.onclick = () => { els.fullImage.src = url; currentScale = 1; els.fullImage.style.transform = 'scale(1)'; els.fullImageModal.style.display = 'flex'; };
                        els.galleryContainer.appendChild(div);
                    });
                }
                els.galleryModal.style.display = 'block';
                document.body.classList.add('modal-open');
            }

            function saveProgress() { localStorage.setItem(PROGRESS_KEY, currentPartIndex); }

            async function initializeGame() {
                try {
                    await loadConfig();
                    document.body.style.opacity = 1;
                    
                    const saved = localStorage.getItem(PROGRESS_KEY);
                    if (saved) currentPartIndex = Math.min(parseInt(saved), CONFIG.storyPages.length - 1);

                    els.nextBtn.onclick = () => {
                        if (currentPartIndex === CONFIG.storyPages.length - 1) { startGPS(); return; }
                        currentPartIndex++; saveProgress(); showStory();
                    };
                    els.prevBtn.onclick = () => { if (currentPartIndex > 0) { currentPartIndex--; saveProgress(); showStory(); } };
                    els.discreetBackBtn.onclick = els.prevBtn.onclick;
                    document.getElementById('image-button').onclick = openGallery;
                    document.getElementById('map-button').onclick = () => window.open(CONFIG.MENU_LINKS.MAP_LINK_URL, '_blank');
                    
                    document.querySelectorAll('.close-gallery').forEach(btn => btn.onclick = () => {
                        els.galleryModal.style.display = 'none';
                        els.fullImageModal.style.display = 'none';
                        document.body.classList.remove('modal-open');
                    });

                    els.checkBtn.onclick = () => {
                        const page = CONFIG.storyPages[currentPartIndex];
                        if (els.passInput.value.trim().toLowerCase() === page.correctPassword.toLowerCase()) {
                            els.msgDisplay.textContent = "Helyes!";
                            els.msgDisplay.style.color = '#00ff00';
                            setTimeout(() => { 
                                currentPartIndex = (page.nextIndexSuccess === -1) ? currentPartIndex : page.nextIndexSuccess;
                                if (page.nextIndexSuccess === -1) startGPS();
                                else { saveProgress(); showStory(); }
                            }, 1000);
                        } else {
                            els.msgDisplay.textContent = "Hibás kód!";
                            els.msgDisplay.style.color = 'red';
                        }
                    };

                    updateUI();
                    els.contentBox.classList.remove('content-hidden');
                } catch (err) {
                    const errorDiv = document.createElement('div');
                    errorDiv.style.cssText = "color:#ff5555; padding:30px; text-align:center; background:rgba(0,0,0,0.8); border: 2px solid red; margin: 10vh auto; max-width: 90%; border-radius: 10px;";
                    errorDiv.innerHTML = `<h1>❌ HIBA ❌</h1><p>${err.message}</p>`;
                    document.body.appendChild(errorDiv);
                    document.body.style.opacity = 1;
                }
            }

            function startGPS() {
                els.contentBox.classList.add('content-hidden'); 
                els.distModal.style.display = 'flex';
                if (!navigator.geolocation) { els.distStatus.textContent = "GPS nem támogatott."; return; }
                watchId = navigator.geolocation.watchPosition(pos => {
                    const lat = pos.coords.latitude, lon = pos.coords.longitude;
                    const R = 6371e3, dLat = (CONFIG.GPS_COMPASS.TARGET_LATITUDE - lat) * Math.PI/180, dLon = (CONFIG.GPS_COMPASS.TARGET_LONGITUDE - lon) * Math.PI/180;
                    const a = Math.sin(dLat/2)**2 + Math.cos(lat*Math.PI/180) * Math.cos(CONFIG.GPS_COMPASS.TARGET_LATITUDE*Math.PI/180) * Math.sin(dLon/2)**2;
                    const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    els.distDisplay.textContent = Math.round(dist) + " M";
                    els.distStatus.textContent = `Pontosság: ${Math.round(pos.coords.accuracy)}m`;
                    if (dist < CONFIG.GPS_COMPASS.SUCCESS_RADIUS_M) { 
                        els.distStatus.textContent = "MEGÉRKEZTÉL!";
                        setTimeout(() => window.location.href = CONFIG.GPS_COMPASS.SUCCESS_REDIRECT_URL, 3000);
                    }
                }, e => els.distStatus.textContent = "GPS Hiba: " + e.message, { enableHighAccuracy: true });
            }

            window.onload = initializeGame;
        })();
    </script>
</body>
</html>
