<style>
    /* ... korábbi stílusok ... */
    .menu-button { position: relative; } /* Kell a jelzés pozícionálásához */
    .notification-dot {
        position: absolute;
        top: 5px;
        right: 8px;
        width: 10px;
        height: 10px;
        background-color: #ff0000;
        border-radius: 50%;
        border: 1px solid #1a1a1a;
        display: none; /* Alapból rejtve */
        box-shadow: 0 0 5px rgba(255, 0, 0, 0.8);
        z-index: 60;
    }
</style>

<button class="menu-button" id="open-gallery-btn" title="Galéria">
    <i class="fas fa-images"></i>
    <span id="gallery-dot" class="notification-dot"></span>
</button>

<script>
    // ... meglévő változók ...
    const galleryDot = document.getElementById('gallery-dot');

    // Módosítsd az updatePage függvényt az alábbi résszel:
    function updatePage() {
        const page = CONFIG.pages[currentPageIndex];
        // ... (szöveg, háttér, avatar frissítése marad) ...

        // ÚJ RÉSZ: Galéria jelzés kezelése
        if (page.galleryImage && page.galleryImage.trim() !== "") {
            galleryDot.style.display = 'block';
        }
    }

    // Módosítsd a galéria megnyitó eseményt:
    document.getElementById('open-gallery-btn').addEventListener('click', () => {
        galleryDot.style.display = 'none'; // Eltüntetjük a pontot, ha megnézte
        openModal(galleryModal);
        renderGallery();
    });
</script>
