<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title>Játék Konfiguráció V3.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: #e0e0e0; }
        .card { background-color: #2c2c2c; border: 2px solid #8a2be2; box-shadow: 0 0 20px rgba(138, 43, 226, 0.4); }
        .input-style { background-color: #3f3f46; color: #00ffff; border: 1px solid #6b7280; }
        .btn-primary { background-color: #8a2be2; color: white; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #7b1cd1; }
        .btn-secondary { background-color: #00ffff; color: #1a1a1a; font-weight: bold; }
        .btn-danger { background-color: #ef4444; color: white; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-4xl font-black mb-8 text-center text-white italic tracking-tighter">
            <i class="fa-solid fa-gears text-purple-500 mr-2"></i>JÁTÉK ADMINISZTRÁCIÓ V3.8
        </h1>

        <!-- Globális Beállítások -->
        <div class="card p-6 rounded-xl mb-8">
            <h2 class="text-2xl font-bold mb-4 text-purple-400 border-b border-purple-800 pb-2">Globális Beállítások</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block mb-1 font-bold">Játék Címe</label>
                    <input type="text" id="app-title" class="w-full p-2 rounded input-style" placeholder="Pl: Anna és Márk">
                </div>
                <div>
                    <label class="block mb-1 font-bold">Alapértelmezett Háttér URL</label>
                    <input type="text" id="background-url" class="w-full p-2 rounded input-style">
                </div>
                <div>
                    <label class="block mb-1 font-bold">Háttérszín (Body BG)</label>
                    <input type="color" id="body-bg-color" class="w-full h-10 p-1 rounded input-style">
                </div>
                <div>
                    <label class="block mb-1 font-bold">Szövegszín (Body Text)</label>
                    <input type="color" id="body-text-color" class="w-full h-10 p-1 rounded input-style">
                </div>
            </div>
        </div>

        <!-- Avatárok Beállítása -->
        <div class="card p-6 rounded-xl mb-8">
            <h2 class="text-2xl font-bold mb-4 text-purple-400 border-b border-purple-800 pb-2">Avatár Beállítások</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block mb-1 font-bold">Alapértelmezett Avatár URL</label>
                    <input type="text" id="default-avatar" class="w-full p-2 rounded input-style">
                </div>
                <div>
                    <label class="block mb-1 font-bold">§M (Márk) Avatár URL</label>
                    <input type="text" id="avatar-m" class="w-full p-2 rounded input-style">
                </div>
                <div>
                    <label class="block mb-1 font-bold">§A (Anna) Avatár URL</label>
                    <input type="text" id="avatar-a" class="w-full p-2 rounded input-style">
                </div>
                <div>
                    <label class="block mb-1 font-bold">§R (Rejtélyes) Avatár URL</label>
                    <input type="text" id="avatar-r" class="w-full p-2 rounded input-style">
                </div>
            </div>
        </div>

        <!-- GPS / Iránytű Beállítások -->
        <div class="card p-6 rounded-xl mb-8">
            <h2 class="text-2xl font-bold mb-4 text-cyan-400 border-b border-cyan-800 pb-2">GPS & Iránytű Beállítások</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block mb-1 font-bold text-xs">Cél Szélesség (Latitude)</label>
                    <input type="number" id="target-lat" step="0.00001" class="w-full p-2 rounded input-style">
                </div>
                <div>
                    <label class="block mb-1 font-bold text-xs">Cél Hosszúság (Longitude)</label>
                    <input type="number" id="target-lon" step="0.00001" class="w-full p-2 rounded input-style">
                </div>
                <div>
                    <label class="block mb-1 font-bold text-xs">Siker Sugár (méter)</label>
                    <input type="number" id="success-radius" class="w-full p-2 rounded input-style" placeholder="25">
                </div>
            </div>
            <div class="mt-4">
                <label class="block mb-1 font-bold">Siker utáni átirányítás URL</label>
                <input type="text" id="success-redirect" class="w-full p-2 rounded input-style" placeholder="busz.html">
            </div>
        </div>

        <!-- Történet Oldalak -->
        <div class="card p-6 rounded-xl mb-8">
            <div class="flex justify-between items-center mb-4 border-b border-purple-800 pb-2">
                <h2 class="text-2xl font-bold text-purple-400">Történet Oldalak</h2>
                <button onclick="addPage()" class="btn-secondary px-4 py-2 rounded-lg text-sm">
                    <i class="fa-solid fa-plus mr-1"></i> Új Oldal
                </button>
            </div>
            
            <div id="pages-container" class="space-y-6">
                <!-- Dinamikusan generált oldalak -->
            </div>
        </div>

        <!-- Mentés és Akciók -->
        <div class="fixed bottom-0 left-0 w-full p-4 bg-black/80 backdrop-blur-md border-t border-purple-500 z-50 flex justify-center gap-4">
            <button onclick="saveSettings()" class="btn-primary px-8 py-3 rounded-xl font-bold text-lg shadow-lg">
                <i class="fa-solid fa-save mr-2"></i> BEÁLLÍTÁSOK MENTÉSE
            </button>
            <button onclick="downloadJson()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg">
                <i class="fa-solid fa-download mr-2"></i> JSON LETÖLTÉSE
            </button>
            <button onclick="resetSettings()" class="btn-danger px-6 py-3 rounded-xl font-bold shadow-lg">
                <i class="fa-solid fa-trash mr-2"></i> RESET
            </button>
        </div>

        <div id="message" class="text-center mt-4 font-bold h-8"></div>
        <div class="h-24"></div> <!-- Alsó margó a rögzített gomboknak -->
    </div>

    <script>
        const STORAGE_KEY = 'DYNAMIC_CONFIG';
        let config = null;

        function getDefaultConfig() {
            return {
                APP_TITLE: "Anna és Márk",
                BACKGROUND_URL: "https://treasurehuntsites.github.io/annaesmark/Img/kr.jpg",
                BODY_BG_COLOR: "#1a1a1a",
                BODY_TEXT_COLOR: "#e0e0e0",
                AVATARS: {
                    DEFAULT_AVATAR_URL: "https://placehold.co/70x70/1A1A1A/FFFFFF?text=?",
                    AVATAR_MAP: { '§M': "https://treasurehuntsites.github.io/annaesmark/Img/mark.png", '§A': "https://treasurehuntsites.github.io/annaesmark/Img/anna.png", '§R': "" },
                    HIDDEN_PREFIXES: ['§N', '§KOD', '§H', '§RESET']
                },
                MENU_LINKS: { MAP_LINK_URL: 'https://maps.google.com' },
                PASSWORD_PAGE: { PROMPT_TEXT: "Kód:", CHECK_BUTTON_TEXT: "Ellenőrzés", BACK_BUTTON_TEXT: "Vissza", SUCCESS_MESSAGE: "Helyes!", ERROR_MESSAGE: "Hibás kód!" },
                GPS_COMPASS: { TARGET_LATITUDE: 47.47407, TARGET_LONGITUDE: 19.04001, SUCCESS_RADIUS_M: 25, SUCCESS_REDIRECT_URL: "busz.html", MAP_BUTTON_URL: 'https://maps.google.com' },
                MEDIA: { AUDIO_1_URL: "", AUDIO_2_URL: "" },
                storyPages: [{ type: 'text', content: '§A Szia! Üdvözöllek a játékban.', nextIndex: 1 }]
            };
        }

        function loadFromStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            config = saved ? JSON.parse(saved) : getDefaultConfig();
            renderAdmin();
        }

        function renderAdmin() {
            document.getElementById('app-title').value = config.APP_TITLE;
            document.getElementById('background-url').value = config.BACKGROUND_URL;
            document.getElementById('body-bg-color').value = config.BODY_BG_COLOR;
            document.getElementById('body-text-color').value = config.BODY_TEXT_COLOR;
            document.getElementById('default-avatar').value = config.AVATARS.DEFAULT_AVATAR_URL;
            document.getElementById('avatar-m').value = config.AVATARS.AVATAR_MAP['§M'] || '';
            document.getElementById('avatar-a').value = config.AVATARS.AVATAR_MAP['§A'] || '';
            document.getElementById('avatar-r').value = config.AVATARS.AVATAR_MAP['§R'] || '';
            document.getElementById('target-lat').value = config.GPS_COMPASS.TARGET_LATITUDE;
            document.getElementById('target-lon').value = config.GPS_COMPASS.TARGET_LONGITUDE;
            document.getElementById('success-radius').value = config.GPS_COMPASS.SUCCESS_RADIUS_M;
            document.getElementById('success-redirect').value = config.GPS_COMPASS.SUCCESS_REDIRECT_URL;

            renderPages();
        }

        function renderPages() {
            const container = document.getElementById('pages-container');
            container.innerHTML = '';
            config.storyPages.forEach((page, index) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'card p-4 rounded-lg bg-black/30 border-purple-900/50';
                pageDiv.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="bg-purple-800 text-xs px-2 py-1 rounded font-bold">#${index} OLDAL</span>
                        <div class="flex gap-2">
                            <button onclick="movePage(${index}, -1)" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-up"></i></button>
                            <button onclick="movePage(${index}, 1)" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-down"></i></button>
                            <button onclick="removePage(${index})" class="text-red-500 hover:text-red-400 ml-2"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">Oldal Típusa</label>
                            <select onchange="updatePage(${index}, 'type', this.value)" class="w-full p-2 rounded input-style text-sm">
                                <option value="text" ${page.type === 'text' ? 'selected' : ''}>Sima Szöveg</option>
                                <option value="password" ${page.type === 'password' ? 'selected' : ''}>Jelszó / Kód</option>
                                <option value="choice" ${page.type === 'choice' ? 'selected' : ''}>Választás (Több gomb)</option>
                                <option value="audio" ${page.type === 'audio' ? 'selected' : ''}>Audio lejátszó</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">Tartalom (Prefixxel pl: §A Szia!)</label>
                            <textarea onchange="updatePage(${index}, 'content', this.value)" class="w-full p-2 rounded input-style text-sm h-20">${page.content}</textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-400 mb-1">Következő Index</label>
                                <input type="number" value="${page.nextIndex || ''}" onchange="updatePage(${index}, 'nextIndex', parseInt(this.value))" class="w-full p-2 rounded input-style text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 mb-1">Vissza Index</label>
                                <input type="number" value="${page.backIndex || ''}" onchange="updatePage(${index}, 'backIndex', parseInt(this.value))" class="w-full p-2 rounded input-style text-sm">
                            </div>
                        </div>
                        <div class="border-t border-gray-700 pt-3 mt-3">
                             <label class="block text-xs font-bold text-purple-400 mb-1 italic">Galéria Kezelése (Új URL-ek / Üres = nincs változás)</label>
                             <textarea onchange="updatePage(${index}, 'customGalleryUrl', this.value)" placeholder="https://image1.jpg" class="w-full p-2 rounded input-style text-xs h-12">${page.customGalleryUrl || ''}</textarea>
                             <select onchange="updatePage(${index}, 'galleryMode', this.value)" class="w-full mt-1 p-1 rounded input-style text-xs">
                                <option value="add_url" ${page.galleryMode === 'add_url' ? 'selected' : ''}>Hozzáadás</option>
                                <option value="remove_url" ${page.galleryMode === 'remove_url' ? 'selected' : ''}>Eltávolítás</option>
                                <option value="clear" ${page.galleryMode === 'clear' ? 'selected' : ''}>Galéria Ürítése</option>
                             </select>
                        </div>
                    </div>
                `;
                container.appendChild(pageDiv);
            });
        }

        function updatePage(idx, key, val) {
            config.storyPages[idx][key] = val;
        }

        function addPage() {
            config.storyPages.push({ type: 'text', content: 'Új oldal szövege...', nextIndex: config.storyPages.length + 1 });
            renderPages();
        }

        function removePage(idx) {
            if(confirm("Biztosan törlöd ezt az oldalt?")) {
                config.storyPages.splice(idx, 1);
                renderPages();
            }
        }

        function movePage(idx, dir) {
            const newIdx = idx + dir;
            if (newIdx >= 0 && newIdx < config.storyPages.length) {
                const temp = config.storyPages[idx];
                config.storyPages[idx] = config.storyPages[newIdx];
                config.storyPages[newIdx] = temp;
                renderPages();
            }
        }

        function saveSettings() {
            // Globális adatok gyűjtése
            config.APP_TITLE = document.getElementById('app-title').value;
            config.BACKGROUND_URL = document.getElementById('background-url').value;
            config.BODY_BG_COLOR = document.getElementById('body-bg-color').value;
            config.BODY_TEXT_COLOR = document.getElementById('body-text-color').value;
            config.AVATARS.DEFAULT_AVATAR_URL = document.getElementById('default-avatar').value;
            config.AVATARS.AVATAR_MAP['§M'] = document.getElementById('avatar-m').value;
            config.AVATARS.AVATAR_MAP['§A'] = document.getElementById('avatar-a').value;
            config.AVATARS.AVATAR_MAP['§R'] = document.getElementById('avatar-r').value;
            config.GPS_COMPASS.TARGET_LATITUDE = parseFloat(document.getElementById('target-lat').value);
            config.GPS_COMPASS.TARGET_LONGITUDE = parseFloat(document.getElementById('target-lon').value);
            config.GPS_COMPASS.SUCCESS_RADIUS_M = parseInt(document.getElementById('success-radius').value);
            config.GPS_COMPASS.SUCCESS_REDIRECT_URL = document.getElementById('success-redirect').value;

            // Galéria Értesítés Logika: megkeressük az utolsó indexet, ahol új kép kerül a galériába
            let lastTrigger = -1;
            config.storyPages.forEach((p, idx) => {
                if (p.customGalleryUrl && p.customGalleryUrl.trim() !== "") {
                    lastTrigger = idx;
                }
            });
            config.LAST_GALLERY_ADD_INDEX = lastTrigger;

            localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
            const msg = document.getElementById('message');
            msg.textContent = "Sikeresen mentve a böngészőbe!";
            msg.style.color = "#00ff00";
            setTimeout(() => msg.textContent = "", 3000);
        }

        function downloadJson() {
            saveSettings();
            const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'game_config.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function resetSettings() {
            if(confirm("MINDEN beállítás törlődik és visszaáll az alapértelmezettre! Folytatod?")) {
                config = getDefaultConfig();
                localStorage.removeItem(STORAGE_KEY);
                renderAdmin();
            }
        }

        window.onload = loadFromStorage;
    </script>
</body>
</html>
