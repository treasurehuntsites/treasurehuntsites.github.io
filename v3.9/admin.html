<script>
    const STORAGE_KEY = 'game_config_preview'; // Ez az összekötő kulcs

    function saveSettings(showAlert = true) {
        const config = {
            appTitle: document.getElementById('appTitle').value,
            backgroundUrl: document.getElementById('backgroundUrl').value,
            avatarMUrl: document.getElementById('avatarMUrl').value,
            avatarAUrl: document.getElementById('avatarAUrl').value,
            avatarRUrl: document.getElementById('avatarRUrl').value,
            avatarDefaultUrl: document.getElementById('avatarDefaultUrl').value,
            pages: CONFIG.pages // A szerkesztett oldalak listája
        };

        // Mentés a böngésző memóriájába az Előnézet számára
        localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        
        if (showAlert) {
            const msg = document.getElementById('messageDisplay');
            msg.textContent = "Sikeresen mentve az előnézethez!";
            msg.style.color = "#00FFFF";
            setTimeout(() => msg.textContent = "", 3000);
        }
    }
    
    document.getElementById('saveButton').addEventListener('click', () => saveSettings(true));
</script>
