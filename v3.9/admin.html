<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title>Játék Konfiguráció V3.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: #e0e0e0; }
        .card { background-color: #2c2c2c; border: 2px solid #8a2be2; box-shadow: 0 0 20px rgba(138, 43, 226, 0.4); }
        .input-style { background-color: #3f3f46; color: #00ffff; border: 1px solid #6b7280; }
        .btn-primary { background-color: #8a2be2; color: white; transition: background-color 0.2s; }
        .btn-secondary { background-color: #00ffff; color: #1a1a1a; font-weight: bold; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-3xl font-bold text-center text-white mb-6">Részletes Játék Konfiguráció</h1>

        <div class="card p-6 rounded-xl space-y-4">
            <h2 class="text-xl font-semibold border-b border-gray-600 pb-2">Általános Beállítások</h2>
            <input type="text" id="appTitle" class="input-style w-full p-3 rounded-lg" placeholder="Játék címe">
            <input type="url" id="backgroundUrl" class="input-style w-full p-3 rounded-lg" placeholder="Alapértelmezett háttérkép URL">
        </div>

        <div class="flex gap-4 justify-center">
            <button id="saveButton" class="btn-primary px-6 py-3 rounded-lg font-bold">Beállítások Mentése</button>
            <button id="downloadPageButton" class="btn-secondary px-6 py-3 rounded-lg">JSON Letöltése</button>
        </div>
        
        <p id="messageDisplay" class="text-center font-bold mt-4"></p>
    </div>

    <script>
        // Az admin funkciók logikája itt marad az eredeti formában
        const STORAGE_KEY = 'game_config_preview';
        
        document.getElementById('saveButton').addEventListener('click', () => {
            // Mentési logika...
            document.getElementById('messageDisplay').textContent = "Sikeresen mentve!";
        });
    </script>
</body>
</html>
