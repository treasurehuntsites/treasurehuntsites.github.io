<!doctype html>
<html lang="hu">
<head>
    </head>
<body>
    <script>
        function renderPage() {
            const page = config.pages[currentPageIndex];
            // ... tartalom frissítése (text, avatar, background) ...

            interactionContainer.innerHTML = '';

            if (page.type === 'story') {
                const nextBtn = document.createElement('button');
                nextBtn.className = 'page-button';
                nextBtn.textContent = 'Tovább';
                nextBtn.onclick = () => {
                    // MÓDOSÍTÁS: Ha van URL, átirányít, különben lapoz
                    if (page.redirectUrl && page.redirectUrl.trim() !== "") {
                        window.location.href = page.redirectUrl;
                    } else {
                        if (currentPageIndex < config.pages.length - 1) {
                            currentPageIndex++;
                            renderPage();
                        }
                    }
                };
                interactionContainer.appendChild(nextBtn);
            }
            // ... choice és password kezelése változatlanul ...
        }
    </script>
</body>
</html>
