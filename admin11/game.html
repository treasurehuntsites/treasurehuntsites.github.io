<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title id="app-title">Játék</title>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; }
        body { margin: 0; padding: 0; font-family: 'Play', sans-serif; background: var(--bg-color); color: var(--text-color); min-height: 100vh; visibility: hidden; opacity: 0; transition: opacity 0.4s; }
        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background: #000; }
        .bg-layer img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45); }
        
        .content-box {
            background-color: rgba(0, 0, 0, 0.88); padding: 40px 20px 15px 20px; 
            border-radius: 10px 10px 0 0; max-width: 800px; width: calc(100% - 40px);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.65); border: 3px solid #8a2be2;
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); 
            z-index: 10; text-align: left; min-height: 250px;
        }

        #story-text { font-size: 1.25em; font-weight: 700; line-height: 1.6; margin-bottom: 25px; white-space: pre-wrap; }
        .interaction-area { display: flex; gap: 12px; border-top: 1px dashed #8a2be2; padding-top: 15px; flex-wrap: wrap; }
        .nav-btn { flex: 1; padding: 15px; background: #8a2be2; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 1.1em; transition: 0.2s; }
        .nav-btn:active { transform: scale(0.96); }

        .avatar { position: absolute; top: -55px; left: -10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #00ffff; display: none; box-shadow: 0 0 15px #00ffff88; }
        .anna-msg { color: #ff69b4; } .mark-msg { color: #4169e1; } .system-msg { color: #00ffff; font-style: italic; }

        .fixed-menu-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 50px; background-color: #1a1a1a; border-top: 2px solid #8a2be2; z-index: 50; display: flex; justify-content: space-around; align-items: center; }
        .menu-button { background: none; border: none; color: white; font-size: 1.6em; cursor: pointer; }
    </style>
</head>
<body>
    <div class="bg-layer"><img id="bg-img" src=""></div>
    <div class="content-box">
        <img id="avatar-img" class="avatar" src="">
        <div id="story-text"></div>
        <div class="interaction-area" id="btn-container"></div>
    </div>
    <div class="fixed-menu-bar">
        <button class="menu-button" id="map-icon-btn"><i class="fa-solid fa-map-location-dot"></i></button>
        <button class="menu-button"><i class="fa-solid fa-image"></i></button>
    </div>

    <script>
        (async function() {
            let config;
            try {
                const res = await fetch('game_config.json');
                config = await res.json();
                document.getElementById('app-title').textContent = config.appTitle;
                document.documentElement.style.setProperty('--bg-color', config.bgColor);
                document.documentElement.style.setProperty('--text-color', config.textColor);
                
                if(!config.showMapIcon) document.getElementById('map-icon-btn').style.display = 'none';
                document.getElementById('map-icon-btn').onclick = () => { if(config.mapUrl) window.open(config.mapUrl, '_blank'); };

                document.body.style.visibility = 'visible';
                document.body.style.opacity = 1;
                render(0);
            } catch (e) { document.body.innerHTML = "<h1 style='color:white; text-align:center;'>Hiba: game_config.json?</h1>"; }

            function render(idx) {
                const page = config.storyPages[idx];
                if(!page) return;
                const textEl = document.getElementById('story-text');
                textEl.innerHTML = page.content
                    .replace(/§A/g, '<span class="anna-msg">Anna:</span>')
                    .replace(/§M/g, '<span class="mark-msg">Márk:</span>')
                    .replace(/§R/g, '<span class="system-msg">[Rendszer]:</span>');
                
                document.getElementById('bg-img').src = page.customBackgroundUrl || "";
                
                const avatar = document.getElementById('avatar-img');
                avatar.style.display = 'none';
                if(page.content.includes("§A") && config.annaAvatarUrl) { avatar.src = config.annaAvatarUrl; avatar.style.display = 'block'; }
                else if(page.content.includes("§M") && config.markAvatarUrl) { avatar.src = config.markAvatarUrl; avatar.style.display = 'block'; }

                const container = document.getElementById('btn-container');
                container.innerHTML = '';

                if(page.pageType === 'story' || !page.pageType) {
                    const bBtn = document.createElement('button'); bBtn.className = 'nav-btn'; bBtn.textContent = 'Vissza';
                    bBtn.onclick = () => render(page.prevIndex !== undefined ? page.prevIndex : Math.max(0, idx - 1));
                    container.appendChild(bBtn);

                    const nBtn = document.createElement('button'); nBtn.className = 'nav-btn'; nBtn.textContent = 'Tovább';
                    nBtn.onclick = () => {
                        if(page.redirectUrl) { window.location.href = page.redirectUrl; return; }
                        render(page.nextIndex !== undefined ? page.nextIndex : idx + 1);
                    };
                    container.appendChild(nBtn);
                } else if(page.pageType === 'choice') {
                    page.choices.forEach(c => {
                        const btn = document.createElement('button'); btn.className = 'nav-btn'; btn.textContent = c.text;
                        btn.onclick = () => { if(c.url) window.location.href = c.url; else render(parseInt(c.target)); };
                        container.appendChild(btn);
                    });
                }
            }
        })();
    </script>
</body>
</html>
