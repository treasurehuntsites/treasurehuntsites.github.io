<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title id="app-title">Anna és Márk (Játék)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; }
        html { overflow-x: hidden; overflow-y: auto; }
        body {
            visibility: hidden; opacity: 0; transition: opacity 0.5s ease-in-out;
            margin: 0; padding: 0; font-family: 'Play', sans-serif;
            color: var(--text-color); background-color: var(--bg-color);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background-size: cover; background-position: center; filter: brightness(0.4); }
        .content-box {
            background-color: rgba(0, 0, 0, 0.85); padding: 30px; border-radius: 15px;
            max-width: 600px; width: 90%; box-shadow: 0 0 30px rgba(138, 43, 226, 0.5);
            border: 2px solid #8a2be2; position: relative; z-index: 10; margin: auto;
            transition: opacity 0.4s;
        }
        .btn-game { background: #8a2be2; color: white; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; transition: transform 0.1s; }
        .btn-game:active { transform: scale(0.98); }
        .system-msg { color: #00ffff; font-style: italic; }
        .anna-msg { color: #ff69b4; }
        .mark-msg { color: #4169e1; }
    </style>
</head>
<body>
    <div id="bg-layer" class="bg-overlay"></div>
    <div class="content-box" id="game-box">
        <div id="story-display" class="text-lg leading-relaxed mb-6"></div>
        <div id="interaction-area" class="space-y-3"></div>
    </div>

    <script>
        (async function() {
            let config = null;

            async function loadConfig() {
                const res = await fetch('game_config.json');
                if (!res.ok) throw new Error("A game_config.json nem található!");
                config = await res.json();
                document.getElementById('app-title').textContent = config.appTitle;
                document.documentElement.style.setProperty('--bg-color', config.bgColor);
                document.documentElement.style.setProperty('--text-color', config.textColor);
                document.body.style.visibility = 'visible';
                document.body.style.opacity = 1;
                renderPage(0);
            }

            function formatText(text) {
                return text
                    .replace(/§A/g, '<span class="anna-msg font-bold">Anna:</span>')
                    .replace(/§M/g, '<span class="mark-msg font-bold">Márk:</span>')
                    .replace(/§R/g, '<span class="system-msg">[Rendszer]:</span>');
            }

            function renderPage(index) {
                const page = config.storyPages[index];
                const display = document.getElementById('story-display');
                const area = document.getElementById('interaction-area');
                const bg = document.getElementById('bg-layer');

                display.innerHTML = formatText(page.content);
                bg.style.backgroundImage = page.customBackgroundUrl ? `url('${page.customBackgroundUrl}')` : '';
                area.innerHTML = '';

                if (page.pageType === 'story') {
                    const btn = document.createElement('button');
                    btn.className = 'btn-game';
                    btn.textContent = 'Tovább';
                    btn.onclick = () => {
                        if (page.redirectUrl && page.redirectUrl.trim() !== "") {
                            window.location.href = page.redirectUrl;
                            return;
                        }
                        if (page.nextIndex !== undefined) renderPage(page.nextIndex);
                    };
                    area.appendChild(btn);
                } else if (page.pageType === 'choice') {
                    page.choices.forEach(c => {
                        const btn = document.createElement('button');
                        btn.className = 'btn-game';
                        btn.textContent = c.text;
                        btn.onclick = () => renderPage(c.targetIndex);
                        area.appendChild(btn);
                    });
                }
                // ... egyéb típusok (password, gps) logikája ...
            }

            loadConfig().catch(err => alert(err.message));
        })();
    </script>
</body>
</html>
