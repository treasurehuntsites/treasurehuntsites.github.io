<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title id="app-title">Betöltés...</title>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; }
        body { margin: 0; padding: 0; font-family: 'Play', sans-serif; background: var(--bg-color); color: var(--text-color); min-height: 100vh; overflow-x: hidden; }
        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background: #000; }
        .bg-layer img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); }
        .content-box {
            background-color: rgba(0, 0, 0, 0.85); padding: 40px 20px 10px 20px; 
            border-radius: 10px 10px 0 0; max-width: 800px; width: calc(100% - 40px);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.7); border: 3px solid #8a2be2;
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); 
            z-index: 10; text-align: left; min-height: 250px;
        }
        #story-text { font-size: 1.2em; font-weight: 700; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }
        .interaction-area { display: flex; gap: 10px; border-top: 1px dashed #8a2be2; padding-top: 15px; flex-wrap: wrap; }
        .nav-btn { flex: 1; padding: 15px; background: #8a2be2; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; min-width: 120px; }
        .avatar { position: absolute; top: -50px; left: -10px; width: 70px; height: 70px; border-radius: 50%; border: 2px solid #00ffff; display: none; }
        .anna-msg { color: #ff69b4; } .mark-msg { color: #4169e1; }
    </style>
</head>
<body>
    <div class="bg-layer"><img id="bg-img" src=""></div>
    <div class="content-box">
        <img id="avatar-img" class="avatar" src="">
        <div id="story-text"></div>
        <div class="interaction-area" id="btn-container"></div>
    </div>

    <script>
        (async function() {
            let config;
            try {
                const res = await fetch('game_config.json');
                config = await res.json();
                document.getElementById('app-title').textContent = config.appTitle;
                render(0);
            } catch (e) { document.body.innerHTML = "Hiba: game_config.json?"; }

            function render(idx) {
                const page = config.storyPages[idx];
                const textEl = document.getElementById('story-text');
                textEl.innerHTML = page.content.replace(/§A/g, '<span class="anna-msg">Anna:</span>').replace(/§M/g, '<span class="mark-msg">Márk:</span>');
                document.getElementById('bg-img').src = page.customBackgroundUrl || "";
                
                const avatar = document.getElementById('avatar-img');
                avatar.style.display = 'none';
                if(page.content.includes("§A")) { avatar.src = config.annaAvatarUrl; avatar.style.display = 'block'; }
                else if(page.content.includes("§M")) { avatar.src = config.markAvatarUrl; avatar.style.display = 'block'; }

                const container = document.getElementById('btn-container');
                container.innerHTML = '';

                if(page.pageType === 'story' || !page.pageType) {
                    const bBtn = document.createElement('button'); bBtn.className = 'nav-btn'; bBtn.textContent = 'Vissza';
                    bBtn.onclick = () => render(page.prevIndex !== undefined ? page.prevIndex : Math.max(0, idx - 1));
                    container.appendChild(bBtn);

                    const nBtn = document.createElement('button'); nBtn.className = 'nav-btn'; nBtn.textContent = 'Tovább';
                    nBtn.onclick = () => {
                        if(page.redirectUrl) { window.location.href = page.redirectUrl; return; }
                        render(page.nextIndex !== undefined ? page.nextIndex : idx + 1);
                    };
                    container.appendChild(nBtn);
                } else if(page.pageType === 'choice') {
                    page.choices.forEach(c => {
                        const btn = document.createElement('button'); btn.className = 'nav-btn'; btn.textContent = c.text;
                        btn.onclick = () => { if(c.url) window.location.href = c.url; else render(parseInt(c.target)); };
                        container.appendChild(btn);
                    });
                }
            }
        })();
    </script>
</body>
</html>
