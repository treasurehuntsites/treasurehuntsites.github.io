<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title>Játék Konfiguráció V3.8+ (Redirect)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: #e0e0e0; }
        .card { background-color: #2c2c2c; border: 2px solid #8a2be2; box-shadow: 0 0 20px rgba(138, 43, 226, 0.4); }
        .input-style { background-color: #3f3f46; color: #00ffff; border: 1px solid #6b7280; }
        .btn-primary { background-color: #8a2be2; color: white; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #7b1cd1; }
        .btn-secondary { background-color: #00ffff; color: #1a1a1a; font-weight: bold; transition: background-color 0.2s; }
        .btn-secondary:hover { background-color: #00ddee; }
        .btn-add { background-color: #007bff; color: white; transition: background-color 0.2s; }
        .btn-add:hover { background-color: #0069d9; }
        .btn-danger { background-color: #dc3545; color: white; transition: background-color 0.2s; }
        .btn-danger:hover { background-color: #c82333; }
        .hidden { display: none; }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; margin-bottom: 4px; border-radius: 6px; background-color: #3f3f46; cursor: grab; }
        .page-item.selected { background-color: #8a2be2; border: 1px solid #00ffff; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-4xl font-bold text-center text-white mb-6">Játék Konfiguráció - Átirányítással</h1>

        <div class="card p-6 rounded-xl space-y-4">
            <h2 class="text-2xl font-semibold text-white border-b border-gray-600 pb-2">Történet Szöveg Szerkesztése</h2>
            
            <div id="pageListContainer" class="mb-4 space-y-1"></div>
            <button id="addPageButton" class="btn-add px-4 py-2 rounded-lg text-sm w-full mb-4">+ Új Oldal Hozzáadása</button>

            <div class="space-y-4">
                <div>
                    <label for="pageRedirectUrl" class="block text-sm font-medium text-gray-300 mb-1">Tovább gomb átirányítási URL (Opcionális)</label>
                    <input type="url" id="pageRedirectUrl" class="input-style w-full p-3 rounded-lg" placeholder="https://pelda.hu">
                </div>

                <div>
                    <label for="pageType" class="block text-sm font-medium text-gray-300 mb-1">Oldal Típusa</label>
                    <select id="pageType" class="input-style w-full p-3 rounded-lg">
                        <option value="story">Sima Történet (Tovább gomb)</option>
                        <option value="choice">Választási Lehetőség (Több gomb)</option>
                        <option value="password">Jelszavas Kapu</option>
                    </select>
                </div>
                </div>
            <button id="saveSettingsButton" class="btn-primary w-full p-3 rounded-lg font-bold">BEÁLLÍTÁSOK MENTÉSE</button>
        </div>
    </div>

    <script>
        // JS részletek: a mentésnél és betöltésnél a #pageRedirectUrl értékét is kezeljük
        // saveSettings: page.redirectUrl = document.getElementById('pageRedirectUrl').value;
        // loadPageIntoEditor: document.getElementById('pageRedirectUrl').value = page.redirectUrl || '';
    </script>
</body>
</html>
