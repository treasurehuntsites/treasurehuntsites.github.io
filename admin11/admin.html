<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title>Játék Konfiguráció V3.8 (Gomb Elrendezés Javítva)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: #e0e0e0; }
        .card { background-color: #2c2c2c; border: 2px solid #8a2be2; box-shadow: 0 0 20px rgba(138, 43, 226, 0.4); }
        .input-style { background-color: #3f3f46; color: #00ffff; border: 1px solid #6b7280; }
        .btn-primary { background-color: #8a2be2; color: white; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #7b1cd1; }
        .btn-secondary { background-color: #00ffff; color: #1a1a1a; font-weight: bold; transition: background-color 0.2s; }
        .btn-secondary:hover { background-color: #00ddee; }
        .btn-danger { background-color: #dc3545; color: white; transition: background-color 0.2s; }
        .btn-danger:hover { background-color: #c82333; }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; margin-bottom: 4px; border-radius: 6px; background-color: #3f3f46; cursor: move; border: 1px solid transparent; transition: all 0.2s; }
        .page-item:hover { background-color: #4b5563; }
        .page-item.selected { background-color: #8a2be2; border-color: #00ffff; }
        .scrollbar-custom::-webkit-scrollbar { width: 8px; }
        .scrollbar-custom::-webkit-scrollbar-track { background: #1f2937; }
        .scrollbar-custom::-webkit-scrollbar-thumb { background: #8a2be2; border-radius: 4px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-6xl mx-auto space-y-8">
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-bold text-white tracking-tight">Játék Konfiguráció <span class="text-purple-500">V3.8</span></h1>
            <p class="text-gray-400 italic">Állítsd be a történetet, a színeket és a gombokat</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <section class="card p-6 rounded-xl space-y-4">
                    <h2 class="text-xl font-semibold text-white border-b border-gray-700 pb-2 flex items-center">
                        <i class="fa fa-cog mr-2 text-purple-500"></i> Alapbeállítások
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label for="appTitle" class="block text-sm font-medium text-gray-300 mb-1">Weboldal Címe</label>
                            <input type="text" id="appTitle" class="input-style w-full p-3 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1">Háttérszín</label>
                                <input type="color" id="bgColor" class="input-style w-full h-12 rounded-lg cursor-pointer">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1">Szövegszín</label>
                                <input type="color" id="textColor" class="input-style w-full h-12 rounded-lg cursor-pointer">
                            </div>
                        </div>
                    </div>
                </section>

                <section class="card p-6 rounded-xl space-y-4">
                    <h2 class="text-xl font-semibold text-white border-b border-gray-700 pb-2 flex items-center">
                        <i class="fa fa-users mr-2 text-purple-500"></i> Avatar Képek
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label for="annaAvatarUrl" class="block text-sm font-medium text-pink-400 mb-1">Anna Avatar URL</label>
                            <input type="url" id="annaAvatarUrl" class="input-style w-full p-2 rounded-lg text-xs" placeholder="https://...">
                        </div>
                        <div>
                            <label for="markAvatarUrl" class="block text-sm font-medium text-blue-400 mb-1">Márk Avatar URL</label>
                            <input type="url" id="markAvatarUrl" class="input-style w-full p-2 rounded-lg text-xs" placeholder="https://...">
                        </div>
                    </div>
                </section>

                <section class="card p-6 rounded-xl space-y-4">
                    <h2 class="text-xl font-semibold text-white border-b border-gray-700 pb-2 flex items-center">
                        <i class="fa fa-bars mr-2 text-purple-500"></i> Menü és GPS
                    </h2>
                    <div class="space-y-4">
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="showMapIcon" class="w-4 h-4 text-purple-600 bg-gray-700 border-gray-600 rounded">
                            <label for="showMapIcon" class="text-sm text-gray-300">Térkép ikon megjelenítése</label>
                        </div>
                        <div>
                            <label for="mapUrl" class="block text-sm font-medium text-gray-300 mb-1">Google Maps Link</label>
                            <input type="url" id="mapUrl" class="input-style w-full p-2 rounded-lg text-xs">
                        </div>
                    </div>
                </section>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <section id="editorSection" class="card p-6 rounded-xl space-y-6 hidden relative">
                    <div class="flex justify-between items-center">
                        <h2 id="editingTitle" class="text-2xl font-bold text-cyan-400">Oldal Szerkesztése</h2>
                        <button id="deletePageButton" class="btn-danger px-4 py-2 rounded-lg text-sm"><i class="fa fa-trash mr-2"></i>Törlés</button>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <label for="pageText" class="block text-sm font-medium text-gray-300 mb-1">Történet Szövege</label>
                            <textarea id="pageText" rows="6" class="input-style w-full p-3 rounded-lg focus:ring-purple-500 outline-none"></textarea>
                            <p class="text-xs text-gray-500 mt-1">§A (Anna), §M (Márk), §R (Rendszer)</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label for="prevIndex" class="block text-sm font-medium text-gray-300 mb-1">Vissza Index</label>
                                <input type="number" id="prevIndex" class="input-style w-full p-3 rounded-lg">
                            </div>
                            <div>
                                <label for="nextIndex" class="block text-sm font-medium text-gray-300 mb-1">Tovább Index</label>
                                <input type="number" id="nextIndex" class="input-style w-full p-3 rounded-lg">
                            </div>
                            <div>
                                <label for="pageRedirectUrl" class="block text-sm font-medium text-gray-300 mb-1">Átirányítás URL</label>
                                <input type="url" id="pageRedirectUrl" class="input-style w-full p-3 rounded-lg focus:ring-purple-500" placeholder="https://...">
                            </div>
                        </div>

                        <div>
                            <label for="pageType" class="block text-sm font-medium text-gray-300 mb-1">Oldal típusa</label>
                            <select id="pageType" class="input-style w-full p-3 rounded-lg">
                                <option value="story">Normál (Vissza/Tovább)</option>
                                <option value="choice">Választás (Egyéni gombok)</option>
                                <option value="password">Jelszó</option>
                                <option value="gps">GPS feloldás</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="pt-4 flex justify-end">
                        <button id="savePageButton" class="btn-primary px-8 py-3 rounded-lg font-bold">Oldal Mentése</button>
                    </div>
                </section>
                
                <section class="card p-4 rounded-xl">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-white">Oldalak (Húzd az átrendezéshez)</h2>
                        <button id="openPreviewButton" class="btn-secondary px-4 py-2 rounded-lg text-sm">Előnézet</button>
                    </div>
                    <div id="pageList" class="space-y-1 max-h-80 overflow-y-auto scrollbar-custom"></div>
                    <button id="addPageButton" class="btn-primary w-full p-3 mt-4 rounded-lg font-bold">+ Új Oldal</button>
                </section>
            </div>
        </div>

        <div class="flex justify-center gap-4 pt-8">
            <button id="downloadPageButton" class="btn-secondary px-8 py-4 rounded-xl text-lg flex items-center">
                <i class="fa fa-download mr-3"></i> Konfiguráció (.json)
            </button>
            <button id="loadConfigButton" class="text-gray-500 hover:text-cyan-400 text-sm">JSON betöltése</button>
            <input type="file" id="loadConfigInput" class="hidden" accept=".json">
        </div>
        <p id="messageDisplay" class="text-center text-sm font-bold mt-4"></p>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'DYNAMIC_CONFIG';
            let config = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { appTitle: "Játék", bgColor: "#1a1a1a", textColor: "#e0e0e0", annaAvatarUrl: "", markAvatarUrl: "", showMapIcon: true, mapUrl: "", storyPages: [] };
            let currentEditingIndex = -1;

            const fields = {
                appTitle: document.getElementById('appTitle'),
                bgColor: document.getElementById('bgColor'),
                textColor: document.getElementById('textColor'),
                annaAvatarUrl: document.getElementById('annaAvatarUrl'),
                markAvatarUrl: document.getElementById('markAvatarUrl'),
                showMapIcon: document.getElementById('showMapIcon'),
                mapUrl: document.getElementById('mapUrl'),
                pageList: document.getElementById('pageList'),
                editorSection: document.getElementById('editorSection'),
                pageText: document.getElementById('pageText'),
                prevIndex: document.getElementById('prevIndex'),
                nextIndex: document.getElementById('nextIndex'),
                pageRedirectUrl: document.getElementById('pageRedirectUrl'),
                pageType: document.getElementById('pageType')
            };

            function renderPageList() {
                fields.pageList.innerHTML = '';
                config.storyPages.forEach((page, index) => {
                    const div = document.createElement('div');
                    div.className = `page-item ${index === currentEditingIndex ? 'selected' : ''}`;
                    div.setAttribute('data-index', index);
                    div.innerHTML = `<span><i class="fa fa-bars mr-3 text-gray-600"></i>#${index}: ${page.content.substring(0, 40)}...</span>`;
                    div.onclick = (e) => { if(!e.target.classList.contains('fa-bars')) loadPageSettings(index); };
                    fields.pageList.appendChild(div);
                });

                // Újra inicializáljuk a Sortable-t minden renderelés után
                new Sortable(fields.pageList, {
                    animation: 150,
                    handle: '.fa-bars',
                    onEnd: function(evt) {
                        const movedItem = config.storyPages.splice(evt.oldIndex, 1)[0];
                        config.storyPages.splice(evt.newIndex, 0, movedItem);
                        saveToLocal();
                        renderPageList();
                    }
                });
            }

            function loadPageSettings(index) {
                currentEditingIndex = index;
                const page = config.storyPages[index];
                fields.editorSection.classList.remove('hidden');
                document.getElementById('editingTitle').textContent = `Szerkesztés (#${index})`;
                fields.pageText.value = page.content || "";
                fields.prevIndex.value = page.prevIndex !== undefined ? page.prevIndex : "";
                fields.nextIndex.value = page.nextIndex !== undefined ? page.nextIndex : "";
                fields.pageRedirectUrl.value = page.redirectUrl || "";
                fields.pageType.value = page.pageType || "story";
                renderPageList();
            }

            function saveToLocal() {
                config.appTitle = fields.appTitle.value;
                config.bgColor = fields.bgColor.value;
                config.textColor = fields.textColor.value;
                config.annaAvatarUrl = fields.annaAvatarUrl.value;
                config.markAvatarUrl = fields.markAvatarUrl.value;
                config.showMapIcon = fields.showMapIcon.checked;
                config.mapUrl = fields.mapUrl.value;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
            }

            document.getElementById('savePageButton').onclick = () => {
                if (currentEditingIndex === -1) return;
                const p = config.storyPages[currentEditingIndex];
                p.content = fields.pageText.value;
                p.prevIndex = fields.prevIndex.value !== "" ? parseInt(fields.prevIndex.value) : undefined;
                p.nextIndex = fields.nextIndex.value !== "" ? parseInt(fields.nextIndex.value) : undefined;
                p.redirectUrl = fields.pageRedirectUrl.value;
                p.pageType = fields.pageType.value;
                saveToLocal();
                document.getElementById('messageDisplay').textContent = "Mentve!";
                setTimeout(() => document.getElementById('messageDisplay').textContent = "", 2000);
                renderPageList();
            };

            document.getElementById('addPageButton').onclick = () => {
                config.storyPages.push({ content: "Új tartalom...", pageType: "story" });
                loadPageSettings(config.storyPages.length - 1);
            };

            document.getElementById('openPreviewButton').onclick = () => { saveToLocal(); window.open('preview.html', '_blank'); };

            // Init
            fields.appTitle.value = config.appTitle;
            fields.bgColor.value = config.bgColor;
            fields.textColor.value = config.textColor;
            fields.annaAvatarUrl.value = config.annaAvatarUrl;
            fields.markAvatarUrl.value = config.markAvatarUrl;
            fields.showMapIcon.checked = config.showMapIcon;
            fields.mapUrl.value = config.mapUrl;
            renderPageList();
        })();
    </script>
</body>
</html>
