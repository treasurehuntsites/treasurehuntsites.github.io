<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title>Játék Konfiguráció V3.9 - Link Támogatással</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: #e0e0e0; }
        .card { background-color: #2c2c2c; border: 2px solid #8a2be2; box-shadow: 0 0 20px rgba(138, 43, 226, 0.4); }
        .input-style { background-color: #3f3f46; color: #00ffff; border: 1px solid #6b7280; }
        .btn-primary { background-color: #8a2be2; color: white; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #7b1cd1; }
        .btn-secondary { background-color: #00ffff; color: #1a1a1a; font-weight: bold; transition: background-color 0.2s; }
        .btn-secondary:hover { background-color: #00ddee; }
        .btn-add { background-color: #007bff; color: white; transition: background-color 0.2s; }
        .btn-add:hover { background-color: #0069d9; }
        .btn-danger { background-color: #dc3545; color: white; transition: background-color 0.2s; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-reset { background-color: #ff5733; color: white; transition: background-color 0.2s; }
        .btn-reset:hover { background-color: #c70039; }
        .hidden { display: none; }
        .game-preview-box { background-color: rgba(0, 0, 0, 0.85); border: 2px solid #8a2be2; border-radius: 10px; padding: 20px; margin-top: 20px; position: relative; color: #e0e0e0; font-family: 'Play', sans-serif; background-size: cover; background-position: center; }
        .preview-avatar { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #00ffff; object-fit: cover; margin-right: 15px; }
        .preview-btn { background-color: #8a2be2; color: white; padding: 8px 16px; border-radius: 4px; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; margin: 2px; }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; margin-bottom: 4px; border-radius: 6px; background-color: #3f3f46; cursor: grab; transition: background-color 0.1s; border: 1px solid transparent; font-size: 0.9rem; }
        .page-item.selected { background-color: #8a2be2; font-weight: bold; border: 1px solid #00ffff; }
        .page-item.dragging { opacity: 0.5; border: 2px dashed #00ffff; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-4xl font-bold text-center text-white mb-6">Játék Konfiguráció V3.9 <span id="configVersion" class="text-lg text-yellow-400"></span></h1>

        <div class="card p-6 rounded-xl space-y-6">
            <h2 class="text-2xl font-semibold text-white border-b border-gray-600 pb-2">Általános Beállítások</h2>
            <div>
                <label for="appTitle" class="block text-sm font-medium text-gray-300 mb-1">Weboldal Címe</label>
                <input type="text" id="appTitle" class="input-style w-full p-3 rounded-lg focus:ring-purple-500" placeholder="Cím">
            </div>
            <div>
                <label for="backgroundUrl" class="block text-sm font-medium text-gray-300 mb-1">Globális Háttérkép URL</label>
                <input type="url" id="backgroundUrl" class="input-style w-full p-3 rounded-lg" placeholder="https://...">
            </div>
        </div>
        
        <div class="card p-6 rounded-xl space-y-6">
            <h2 class="text-2xl font-semibold text-white border-b border-gray-600 pb-2">Történet Szöveg Szerkesztése</h2>
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-gray-300 mb-1">Oldal kiválasztása (Index)</label>
                    <div id="pageListContainer" class="input-style w-full p-3 rounded-lg h-40 overflow-y-auto space-y-1 border border-purple-500/50"></div>
                    <div class="flex gap-2 mt-2">
                        <button id="addPageButton" class="btn-add w-1/3 p-2 rounded-lg text-sm font-bold uppercase">Új a végére</button>
                        <button id="insertPageBeforeButton" class="btn-add w-1/3 p-2 rounded-lg text-sm font-bold uppercase">Beszúrás elé</button>
                        <button id="deletePageButton" class="btn-danger w-1/3 p-2 rounded-lg text-sm font-bold uppercase">Törlés</button>
                    </div>
                </div>

                <div>
                    <label for="pageContent" class="block text-sm font-medium text-gray-300 mb-1">Oldal Szövege</label>
                    <textarea id="pageContent" rows="4" class="input-style w-full p-3 rounded-lg"></textarea>
                </div>

                <div class="p-4 bg-blue-900/20 border border-blue-500/30 rounded-lg">
                    <label for="nextUrl" class="block text-sm font-medium text-blue-400 mb-1">Külső Link (Next URL) - Ha kitöltöd, a Tovább gomb ide navigál</label>
                    <input type="text" id="nextUrl" class="input-style w-full p-3 rounded-lg" placeholder="Pl: masik_oldal.html vagy https://google.com">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="nextIndex" class="block text-sm font-medium text-gray-300 mb-1">Ugrás Index (Next Index)</label>
                        <input type="number" id="nextIndex" class="input-style w-full p-3 rounded-lg">
                    </div>
                    <div>
                        <label for="backIndex" class="block text-sm font-medium text-gray-300 mb-1">Vissza Index (Back Index)</label>
                        <input type="number" id="backIndex" class="input-style w-full p-3 rounded-lg">
                    </div>
                </div>

                <div>
                    <label for="pageType" class="block text-sm font-medium text-gray-300 mb-1">Oldal típusa</label>
                    <select id="pageType" class="input-style w-full p-3 rounded-lg">
                        <option value="text">Szöveg / Párbeszéd</option>
                        <option value="audio">Audio Lejátszás (Gomb)</option>
                        <option value="password">Jelszó Kérése</option>
                        <option value="choice">Elágazás (Választás)</option>
                    </select>
                </div>
            </div>

            <div id="textBlock">
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <input type="url" id="customAvatarUrl" class="input-style w-full p-3 rounded-lg" placeholder="Egyedi Avatar URL">
                    <input type="url" id="customBackgroundUrl" class="input-style w-full p-3 rounded-lg" placeholder="Egyedi Háttér URL">
                 </div>
                 <textarea id="customGalleryUrl" class="hidden"></textarea><select id="galleryMode" class="hidden"><option value="add_url"></option></select>
            </div>

            <div id="audioBlock" class="hidden space-y-2">
                <select id="audioId" class="input-style w-full p-3 rounded-lg"><option value="1">Audio 1</option><option value="2">Audio 2</option></select>
                <input type="text" id="audioNextButtonText" class="input-style w-full p-3 rounded-lg" placeholder="Tovább gomb felirata">
            </div>

            <div id="passwordBlock" class="hidden space-y-2">
                <input type="text" id="correctPassword" class="input-style w-full p-3 rounded-lg" placeholder="Helyes kód">
                <input type="number" id="nextIndexSuccess" class="input-style w-full p-3 rounded-lg" placeholder="Siker ugrás index">
                <textarea id="passwordHelpMessage" class="input-style w-full p-3 rounded-lg" placeholder="Súgó üzenetek"></textarea>
            </div>

            <div id="choiceBlock" class="hidden space-y-2">
                <div id="choicesContainer" class="space-y-2"></div>
                <button id="addChoiceBtn" class="btn-secondary w-full p-2 rounded">Új választás</button>
            </div>
            
            <div id="previewContainer"></div>
        </div>

        <div class="hidden">
            <input type="url" id="avatarMUrl"> <input type="url" id="avatarAUrl"> <input type="url" id="avatarRUrl"> <input type="url" id="avatarDefaultUrl">
            <input type="url" id="menuMapLink"> <input type="text" id="targetLat"> <input type="text" id="targetLon"> <input type="text" id="successRedirectUrl"> <input type="url" id="gpsMapLink">
            <input type="url" id="audio1Url"> <input type="url" id="audio2Url"> <input type="text" id="passwordPromptText">
            <input type="color" id="bgColor"> <input type="color" id="textColor">
        </div>

        <div class="flex flex-wrap justify-between gap-4 pt-4">
            <button id="saveButton" class="btn-primary flex-1 p-4 rounded-xl font-bold uppercase">Mentés</button>
            <button id="resetButton" class="btn-reset flex-1 p-4 rounded-xl font-bold uppercase">Törlés</button>
            <a href="preview.html" target="_blank" class="btn-secondary flex-1 p-4 rounded-xl font-bold uppercase text-center">Preview</a>
            <button id="downloadPageButton" class="bg-pink-600 text-white flex-1 p-4 rounded-xl font-bold uppercase">Export (JSON)</button>
        </div>
        <p id="message" class="text-center mt-4 font-bold"></p>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'DYNAMIC_CONFIG';
            let currentStoryPages = [];
            let currentLoadedIndex = 0;

            const fields = {
                appTitle: document.getElementById('appTitle'),
                backgroundUrl: document.getElementById('backgroundUrl'),
                pageListContainer: document.getElementById('pageListContainer'),
                pageContent: document.getElementById('pageContent'),
                nextUrl: document.getElementById('nextUrl'), // ÚJ
                nextIndex: document.getElementById('nextIndex'),
                backIndex: document.getElementById('backIndex'),
                pageType: document.getElementById('pageType'),
                customAvatarUrl: document.getElementById('customAvatarUrl'),
                customBackgroundUrl: document.getElementById('customBackgroundUrl'),
                audioId: document.getElementById('audioId'),
                audioNextButtonText: document.getElementById('audioNextButtonText'),
                correctPassword: document.getElementById('correctPassword'),
                nextIndexSuccess: document.getElementById('nextIndexSuccess'),
                passwordHelpMessage: document.getElementById('passwordHelpMessage'),
                choicesContainer: document.getElementById('choicesContainer'),
                // Dummy mezők a kompatibilitáshoz
                bgColor: document.getElementById('bgColor'), textColor: document.getElementById('textColor'),
                avatarMUrl: document.getElementById('avatarMUrl'), avatarAUrl: document.getElementById('avatarAUrl'), avatarRUrl: document.getElementById('avatarRUrl'), avatarDefaultUrl: document.getElementById('avatarDefaultUrl'),
                menuMapLink: document.getElementById('menuMapLink'), targetLat: document.getElementById('targetLat'), targetLon: document.getElementById('targetLon'), successRedirectUrl: document.getElementById('successRedirectUrl'), gpsMapLink: document.getElementById('gpsMapLink'),
                audio1Url: document.getElementById('audio1Url'), audio2Url: document.getElementById('audio2Url'), passwordPromptText: document.getElementById('passwordPromptText'),
                customGalleryUrl: document.getElementById('customGalleryUrl'), galleryMode: document.getElementById('galleryMode')
            };

            function loadStoryPage(index) {
                saveCurrentStoryPageContent();
                currentLoadedIndex = index;
                const page = currentStoryPages[index];
                if (!page) return;

                fields.pageContent.value = page.content || '';
                fields.nextUrl.value = page.nextUrl || ''; // ÚJ
                fields.nextIndex.value = page.nextIndex !== undefined ? page.nextIndex : '';
                fields.backIndex.value = page.backIndex !== undefined ? page.backIndex : '';
                fields.pageType.value = page.type || 'text';
                fields.customAvatarUrl.value = page.customAvatarUrl || '';
                fields.customBackgroundUrl.value = page.customBackgroundUrl || '';
                
                // Blokkok kapcsolása
                document.getElementById('audioBlock').classList.toggle('hidden', page.type !== 'audio');
                document.getElementById('passwordBlock').classList.toggle('hidden', page.type !== 'password');
                document.getElementById('choiceBlock').classList.toggle('hidden', page.type !== 'choice');

                renderPageList();
            }

            function saveCurrentStoryPageContent() {
                if (!currentStoryPages[currentLoadedIndex]) return;
                const page = currentStoryPages[currentLoadedIndex];
                page.content = fields.pageContent.value;
                page.nextUrl = fields.nextUrl.value; // ÚJ
                page.nextIndex = fields.nextIndex.value !== '' ? parseInt(fields.nextIndex.value) : undefined;
                page.backIndex = fields.backIndex.value !== '' ? parseInt(fields.backIndex.value) : undefined;
                page.type = fields.pageType.value;
                page.customAvatarUrl = fields.customAvatarUrl.value;
                page.customBackgroundUrl = fields.customBackgroundUrl.value;
                
                if (page.type === 'password') {
                    page.correctPassword = fields.correctPassword.value;
                    page.nextIndexSuccess = parseInt(fields.nextIndexSuccess.value);
                }
            }

            function renderPageList() {
                fields.pageListContainer.innerHTML = '';
                currentStoryPages.forEach((p, i) => {
                    const div = document.createElement('div');
                    div.className = `page-item ${i === currentLoadedIndex ? 'selected' : ''}`;
                    div.innerHTML = `<span>${i}. [${p.type}] ${p.content.substring(0,20)}...</span>`;
                    div.onclick = () => loadStoryPage(i);
                    fields.pageListContainer.appendChild(div);
                });
            }

            document.getElementById('saveButton').onclick = () => {
                saveCurrentStoryPageContent();
                const config = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                config.storyPages = currentStoryPages;
                config.APP_TITLE = fields.appTitle.value;
                config.BACKGROUND_URL = fields.backgroundUrl.value;
                config.AVATARS = config.AVATARS || { AVATAR_MAP: {}, HIDDEN_PREFIXES: [] };
                config.MENU_LINKS = config.MENU_LINKS || {};
                config.GPS_COMPASS = config.GPS_COMPASS || {};
                config.MEDIA = config.MEDIA || {};
                config.PASSWORD_PAGE = config.PASSWORD_PAGE || {};
                
                localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
                alert("Mentve!");
            };

            document.getElementById('addPageButton').onclick = () => {
                currentStoryPages.push({ type: 'text', content: 'Új oldal', nextUrl: '' });
                loadStoryPage(currentStoryPages.length - 1);
            };

            // Init
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const conf = JSON.parse(saved);
                currentStoryPages = conf.storyPages || [];
                fields.appTitle.value = conf.APP_TITLE || '';
                fields.backgroundUrl.value = conf.BACKGROUND_URL || '';
                if (currentStoryPages.length > 0) renderPageList();
            }
        })();
    </script>
</body>
</html>
