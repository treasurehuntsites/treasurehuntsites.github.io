<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title>Játék Konfiguráció V3.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: #e0e0e0; }
        .card { background-color: #2c2c2c; border: 2px solid #8a2be2; box-shadow: 0 0 20px rgba(138, 43, 226, 0.4); }
        .input-style { background-color: #3f3f46; color: #00ffff; border: 1px solid #6b7280; }
        .btn-primary { background-color: #8a2be2; color: white; transition: 0.2s; }
        .btn-secondary { background-color: #00ffff; color: #1a1a1a; font-weight: bold; }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 6px; border-radius: 8px; background-color: #3f3f46; cursor: grab; border: 1px solid transparent; }
        .page-item.selected { border-color: #00ffff; background-color: #4c1d95; }
        .scrollbar-custom::-webkit-scrollbar { width: 8px; }
        .scrollbar-custom::-webkit-scrollbar-thumb { background: #8a2be2; border-radius: 4px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-6xl mx-auto space-y-8">
        <header class="text-center">
            <h1 class="text-4xl font-bold text-white">Játék Konfiguráció <span class="text-purple-500">V3.9</span></h1>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <section class="card p-6 rounded-xl space-y-4">
                    <h2 class="text-xl font-semibold text-white border-b border-gray-700 pb-2"><i class="fa fa-cog mr-2"></i>Alapbeállítások</h2>
                    <input type="text" id="appTitle" class="input-style w-full p-2 rounded" placeholder="Weboldal Címe">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="color" id="bgColor" class="input-style w-full h-10 rounded">
                        <input type="color" id="textColor" class="input-style w-full h-10 rounded">
                    </div>
                </section>
                <section class="card p-6 rounded-xl space-y-4">
                    <h2 class="text-xl font-semibold text-white border-b border-gray-700 pb-2"><i class="fa fa-users mr-2"></i>Avatarok</h2>
                    <input type="url" id="annaAvatarUrl" class="input-style w-full p-2 text-xs rounded" placeholder="Anna Avatar URL">
                    <input type="url" id="markAvatarUrl" class="input-style w-full p-2 text-xs rounded" placeholder="Márk Avatar URL">
                </section>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <section id="editorSection" class="card p-6 rounded-xl space-y-6 hidden">
                    <h2 id="editingTitle" class="text-2xl font-bold text-cyan-400">Oldal Szerkesztése</h2>
                    <textarea id="pageText" rows="5" class="input-style w-full p-3 rounded-lg outline-none"></textarea>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="text-xs text-gray-400">Vissza Index</label>
                            <input type="number" id="prevIndex" class="input-style w-full p-2 rounded">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400">Tovább Index</label>
                            <input type="number" id="nextIndex" class="input-style w-full p-2 rounded">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400">Átirányítás URL</label>
                            <input type="url" id="pageRedirectUrl" class="input-style w-full p-2 rounded" placeholder="https://...">
                        </div>
                    </div>

                    <select id="pageType" class="input-style w-full p-3 rounded-lg" onchange="toggleTypeSections()">
                        <option value="story">Normál történet</option>
                        <option value="choice">Választás (Gombok)</option>
                        <option value="gps">GPS feloldás</option>
                    </select>

                    <div id="gpsSection" class="hidden space-y-3 p-4 bg-gray-800 rounded-lg">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="targetLat" class="input-style p-2 rounded text-xs" placeholder="Lat (Szélesség)">
                            <input type="text" id="targetLon" class="input-style p-2 rounded text-xs" placeholder="Lon (Hosszúság)">
                        </div>
                        <input type="url" id="pageMapUrl" class="input-style w-full p-2 text-xs rounded" placeholder="Egyedi Google Maps Link">
                    </div>

                    <div id="choiceSection" class="hidden space-y-3">
                        <label class="text-sm font-bold text-purple-400">Választási Gombok</label>
                        <div id="choiceContainer" class="space-y-2"></div>
                        <button onclick="addChoiceRow()" class="text-xs text-cyan-400">+ Gomb hozzáadása</button>
                    </div>

                    <div class="flex justify-between">
                        <button id="deletePageButton" class="bg-red-600 px-4 py-2 rounded">Törlés</button>
                        <button id="savePageButton" class="btn-primary px-8 py-2 rounded font-bold">Oldal Mentése</button>
                    </div>
                </section>

                <section class="card p-4 rounded-xl">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-white">Oldalak (Húzd az átrendezéshez)</h2>
                        <button id="openPreviewButton" class="btn-secondary px-4 py-2 rounded text-sm">Előnézet</button>
                    </div>
                    <div id="pageList" class="space-y-1 max-h-80 overflow-y-auto scrollbar-custom"></div>
                    <button id="addPageButton" class="btn-primary w-full p-3 mt-4 rounded-lg">+ Új Oldal</button>
                </section>
            </div>
        </div>
        <div class="flex justify-center gap-4 py-8">
            <button id="downloadPageButton" class="btn-secondary px-8 py-4 rounded-xl text-lg">Konfiguráció Letöltése</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'DYNAMIC_CONFIG';
        let config = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { appTitle: "Játék", bgColor: "#1a1a1a", textColor: "#e0e0e0", storyPages: [] };
        let currentEditingIndex = -1;

        function toggleTypeSections() {
            const type = document.getElementById('pageType').value;
            document.getElementById('gpsSection').classList.toggle('hidden', type !== 'gps');
            document.getElementById('choiceSection').classList.toggle('hidden', type !== 'choice');
        }

        function addChoiceRow(data = {text: '', target: '', url: ''}) {
            const div = document.createElement('div');
            div.className = "flex flex-col gap-2 p-2 bg-gray-700 rounded";
            div.innerHTML = `
                <input type="text" class="c-text input-style p-1 rounded text-xs" placeholder="Gomb szöveg" value="${data.text}">
                <div class="flex gap-2">
                    <input type="number" class="c-target input-style flex-1 p-1 rounded text-xs" placeholder="Cél Index" value="${data.target}">
                    <input type="url" class="c-url input-style flex-1 p-1 rounded text-xs" placeholder="Vagy Link" value="${data.url}">
                    <button class="text-red-500" onclick="this.parentElement.parentElement.remove()">X</button>
                </div>`;
            document.getElementById('choiceContainer').appendChild(div);
        }

        function renderPageList() {
            const list = document.getElementById('pageList');
            list.innerHTML = '';
            config.storyPages.forEach((p, i) => {
                const item = document.createElement('div');
                item.className = `page-item ${i === currentEditingIndex ? 'selected' : ''}`;
                item.innerHTML = `<span><i class="fa fa-bars mr-3 opacity-50"></i>#${i}: ${p.content.substring(0, 30)}...</span>`;
                item.onclick = (e) => { if(!e.target.classList.contains('fa-bars')) loadPage(i); };
                list.appendChild(item);
            });
            new Sortable(list, { animation: 150, handle: '.fa-bars', onEnd: (evt) => {
                const moved = config.storyPages.splice(evt.oldIndex, 1)[0];
                config.storyPages.splice(evt.newIndex, 0, moved);
                save(false); renderPageList();
            }});
        }

        function loadPage(i) {
            currentEditingIndex = i;
            const p = config.storyPages[i];
            document.getElementById('editorSection').classList.remove('hidden');
            document.getElementById('pageText').value = p.content;
            document.getElementById('prevIndex').value = p.prevIndex ?? "";
            document.getElementById('nextIndex').value = p.nextIndex ?? "";
            document.getElementById('pageRedirectUrl').value = p.redirectUrl || "";
            document.getElementById('pageType').value = p.pageType || "story";
            document.getElementById('targetLat').value = p.targetLat || "";
            document.getElementById('targetLon').value = p.targetLon || "";
            document.getElementById('pageMapUrl').value = p.pageMapUrl || "";
            document.getElementById('choiceContainer').innerHTML = '';
            if(p.choices) p.choices.forEach(c => addChoiceRow(c));
            toggleTypeSections();
            renderPageList();
        }

        function save(showMsg = true) {
            if(currentEditingIndex !== -1) {
                const p = config.storyPages[currentEditingIndex];
                p.content = document.getElementById('pageText').value;
                p.prevIndex = document.getElementById('prevIndex').value !== "" ? parseInt(document.getElementById('prevIndex').value) : undefined;
                p.nextIndex = document.getElementById('nextIndex').value !== "" ? parseInt(document.getElementById('nextIndex').value) : undefined;
                p.redirectUrl = document.getElementById('pageRedirectUrl').value;
                p.pageType = document.getElementById('pageType').value;
                p.targetLat = document.getElementById('targetLat').value;
                p.targetLon = document.getElementById('targetLon').value;
                p.pageMapUrl = document.getElementById('pageMapUrl').value;
                p.choices = Array.from(document.getElementById('choiceContainer').children).map(row => ({
                    text: row.querySelector('.c-text').value,
                    target: row.querySelector('.c-target').value,
                    url: row.querySelector('.c-url').value
                }));
            }
            config.appTitle = document.getElementById('appTitle').value;
            config.bgColor = document.getElementById('bgColor').value;
            config.textColor = document.getElementById('textColor').value;
            config.annaAvatarUrl = document.getElementById('annaAvatarUrl').value;
            config.markAvatarUrl = document.getElementById('markAvatarUrl').value;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
            if(showMsg) alert("Mentve!");
            renderPageList();
        }

        document.getElementById('savePageButton').onclick = () => save(true);
        document.getElementById('addPageButton').onclick = () => { config.storyPages.push({content: "Új oldal...", pageType: "story"}); loadPage(config.storyPages.length-1); };
        document.getElementById('openPreviewButton').onclick = () => { save(false); window.open('preview.html', '_blank'); };
        document.getElementById('downloadPageButton').onclick = () => { save(false); const blob = new Blob([JSON.stringify(config, null, 2)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'game_config.json'; a.click(); };

        document.getElementById('appTitle').value = config.appTitle;
        document.getElementById('bgColor').value = config.bgColor;
        document.getElementById('textColor').value = config.textColor;
        document.getElementById('annaAvatarUrl').value = config.annaAvatarUrl;
        document.getElementById('markAvatarUrl').value = config.markAvatarUrl;
        renderPageList();
    </script>
</body>
</html>
