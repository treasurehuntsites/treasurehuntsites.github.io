<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title id="app-title">Anna és Márk - Előnézet V3.9</title>
    
    <meta http-equiv="Permissions-Policy" content="geolocation=*">
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; }
        html { overflow-x: hidden; overflow-y: auto; }
        body {
            visibility: hidden; opacity: 0; transition: opacity 0.3s ease-in-out; 
            margin: 0; padding: 0; font-family: 'Play', sans-serif;
            color: var(--text-color); background-color: var(--bg-color);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; text-align: center; padding-bottom: 60px; 
        }
        .full-width-image-container {
            width: 100%; height: 100vh; overflow: hidden; position: absolute;
            top: 0; left: 0; z-index: 0; background-color: #111111;
        }
        .full-width-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .content-box {
            background-color: rgba(0, 0, 0, 0.85); padding: 40px 20px 10px 20px; 
            border-radius: 10px 10px 0 0; max-width: 800px; width: calc(100% - 40px);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.7); border: 3px solid #8a2be2;
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); 
            z-index: 10; text-align: left; min-height: 250px; display: flex; flex-direction: column;
            justify-content: space-between; transition: opacity 0.5s ease-in-out; 
        }
        .content-hidden { opacity: 0; }
        #story-text-display { font-size: 1.2em; font-weight: 700; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }
        .bottom-bar { padding-top: 10px; border-top: 1px dashed #8a2be2; width: 100%; }
        .interaction-container { display: flex; justify-content: space-between; gap: 10px; }
        .page-button {
            padding: 12px 20px; color: #ffffff; background-color: #8a2be2; border: none; border-radius: 5px;
            font-size: 1.1em; font-weight: 700; cursor: pointer; text-transform: uppercase; flex: 1;
        }
        .page-button:disabled { background-color: #555555; opacity: 0.6; }
        .avatar-image {
            position: absolute; top: -50px; left: -10px; width: 70px; height: 70px;
            border-radius: 50%; object-fit: cover; z-index: 20; border: 2px solid #00ffff;
        }
        .fixed-menu-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 50px;
            background-color: #1a1a1a; border-top: 2px solid #8a2be2; z-index: 50;
            display: flex; justify-content: space-around; align-items: center;
        }
        .menu-button { background: none; border: none; color: #ffffff; font-size: 1.5em; cursor: pointer; }
    </style>
</head>
<body>
    <div class="full-width-image-container">
        <img id="story-image" alt="Háttér">
    </div>

    <div class="content-box content-hidden" id="content-box"> 
        <img id="avatar-img" class="avatar-image" src="" alt="Avatar">
        <p id="story-text-display"></p>
        <div class="bottom-bar">
            <div class="interaction-container" id="interaction-container">
                <button id="prev-page-button" class="page-button" disabled>Vissza</button>
                <button id="next-page-button" class="page-button">Tovább</button>
            </div>
        </div>
    </div>
    
    <div class="fixed-menu-bar">
        <button class="menu-button"><i class="fa-solid fa-map-location-dot"></i></button>
        <button class="menu-button"><i class="fa-solid fa-image"></i></button>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'DYNAMIC_CONFIG';
            let config = JSON.parse(localStorage.getItem(STORAGE_KEY));
            let currentPartIndex = 0;

            const els = {
                storyDisplay: document.getElementById('story-text-display'),
                storyImage: document.getElementById('story-image'),
                avatarImg: document.getElementById('avatar-img'),
                contentBox: document.getElementById('content-box'),
                nextBtn: document.getElementById('next-page-button'),
                prevBtn: document.getElementById('prev-page-button')
            };

            function updateUI() {
                const page = config.storyPages[currentPartIndex];
                if (!page) return;

                // Szöveg és háttér
                els.storyDisplay.textContent = page.content;
                if (page.customBackgroundUrl) els.storyImage.src = page.customBackgroundUrl;
                
                // Avatar kezelés
                if (page.customAvatarUrl) {
                    els.avatarImg.src = page.customAvatarUrl;
                    els.avatarImg.style.display = 'block';
                } else {
                    els.avatarImg.style.display = 'none';
                }

                els.prevBtn.disabled = currentPartIndex === 0;
            }

            function handleNavigation() {
                const page = config.storyPages[currentPartIndex];

                // --- ÚJ ÁTIRÁNYÍTÁSI LOGIKA ---
                if (page.redirectUrl && page.redirectUrl.trim() !== "") {
                    if (confirm("Az előnézet most átirányítana erre a linkre:\n" + page.redirectUrl)) {
                        window.location.href = page.redirectUrl;
                    }
                    return;
                }

                // Hagyományos léptetés
                if (page.nextIndex !== undefined) {
                    currentPartIndex = page.nextIndex;
                } else {
                    currentPartIndex++;
                }
                
                renderWithFade();
            }

            function renderWithFade() {
                els.contentBox.classList.add('content-hidden');
                setTimeout(() => {
                    updateUI();
                    els.contentBox.classList.remove('content-hidden');
                }, 300);
            }

            els.nextBtn.onclick = handleNavigation;
            els.prevBtn.onclick = () => {
                currentPartIndex = Math.max(0, currentPartIndex - 1);
                renderWithFade();
            };

            // Indítás
            if (config && config.storyPages) {
                document.body.style.visibility = 'visible';
                document.body.style.opacity = 1;
                updateUI();
                els.contentBox.classList.remove('content-hidden');
            } else {
                alert("Nincs betölthető konfiguráció! Menj az admin felületre és mentsd el.");
            }
        })();
    </script>
</body>
</html>
