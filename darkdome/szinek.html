<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biztonsági Panel</title>
    <!-- Tailwind CSS beillesztése CDN-ről -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .style-engraved {
            text-shadow: 0px 1px 1px rgba(255,255,255,0.2), 0px -1px 1px rgba(0,0,0,0.8);
        }
        .tap-highlight-transparent {
            -webkit-tap-highlight-color: transparent;
        }
        /* A kijelző ragyogásának dinamikus osztálya */
        .glow-red {
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
        }
    </style>
</head>
<body class="bg-zinc-900 min-h-screen flex items-center justify-center p-4 font-sans select-none overflow-hidden">

    <!-- Fő Panel - Élethű fém doboz -->
    <div class="relative w-full max-w-[450px] aspect-[4/6] bg-gradient-to-br from-zinc-700 to-zinc-800 border-8 border-zinc-600 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.8)] overflow-hidden">
        
        <!-- Fém karcolások és textúra -->
        <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-black pointer-events-none"></div>

        <!-- Csavarok a sarkokban -->
        <div class="absolute top-3 left-3 w-4 h-4 bg-zinc-400 rounded-full shadow-inner flex items-center justify-center"><div class="w-full h-0.5 bg-zinc-600 rotate-45"></div></div>
        <div class="absolute top-3 right-3 w-4 h-4 bg-zinc-400 rounded-full shadow-inner flex items-center justify-center"><div class="w-full h-0.5 bg-zinc-600 -rotate-45"></div></div>
        <div class="absolute bottom-3 left-3 w-4 h-4 bg-zinc-400 rounded-full shadow-inner flex items-center justify-center"><div class="w-full h-0.5 bg-zinc-600 rotate-12"></div></div>
        <div class="absolute bottom-3 right-3 w-4 h-4 bg-zinc-400 rounded-full shadow-inner flex items-center justify-center"><div class="w-full h-0.5 bg-zinc-600 -rotate-12"></div></div>

        <!-- Gravírozott tipp -->
        <div class="absolute top-6 right-8 text-zinc-900 opacity-60 text-xs font-bold tracking-widest style-engraved">
            S-N: 3-5-2
        </div>

        <!-- SVG Vezetékek -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none z-0" viewBox="0 0 450 675" preserveAspectRatio="none">
            <!-- Árnyék/Fekete körvonal -->
            <g stroke="#18181b" stroke-width="12" fill="none" stroke-linecap="round">
                <path d="M 225 150 C 225 220, 90 220, 90 337.5" />
                <path d="M 225 150 C 225 250, 225 250, 225 337.5" />
                <path d="M 225 150 C 225 220, 360 220, 360 337.5" />
                <path d="M 90 337.5 C 90 500, 90 480, 90 575" />
                <path d="M 225 337.5 C 225 500, 225 480, 225 575" />
                <path d="M 360 337.5 C 360 500, 360 480, 360 575" />
            </g>
            <!-- Színes belső vezetékek -->
            <g stroke-width="6" fill="none" stroke-linecap="round">
                <path d="M 225 150 C 225 220, 90 220, 90 337.5" stroke="#ef4444" /> <!-- Piros -->
                <path d="M 225 150 C 225 250, 225 250, 225 337.5" stroke="#3b82f6" /> <!-- Kék -->
                <path d="M 225 150 C 225 220, 360 220, 360 337.5" stroke="#22c55e" /> <!-- Zöld -->
                <path d="M 90 337.5 C 70 450, 110 450, 90 575" stroke="#ef4444" />
                <path d="M 225 337.5 C 245 450, 205 450, 225 575" stroke="#3b82f6" />
                <path d="M 360 337.5 C 340 450, 380 450, 360 575" stroke="#22c55e" />
            </g>
        </svg>

        <!-- Interaktív Elemek Rétege -->
        <div class="absolute inset-0 z-10 flex flex-col items-center justify-between py-12 pointer-events-none">
            
            <!-- Digitális Kijelző -->
            <div class="pointer-events-auto relative mt-4 w-48 h-20 bg-zinc-950 rounded-lg border-4 border-zinc-900 shadow-[inset_0_4px_15px_rgba(0,0,0,1)] flex items-center justify-center overflow-hidden">
                <div class="absolute top-0 w-full h-1/2 bg-gradient-to-b from-white/10 to-transparent pointer-events-none"></div>
                <div id="digital-display" class="font-mono text-4xl font-bold tracking-widest text-red-900 opacity-50 transition-all duration-300">
                    ----
                </div>
            </div>

            <!-- Csúszkák szekció -->
            <div class="pointer-events-auto flex justify-between w-full px-[15%] h-56 mt-16">
                <!-- Piros (0) -->
                <div class="relative w-10 h-full flex justify-center">
                    <div class="absolute -left-3 top-0 h-full w-2 flex flex-col justify-between py-2">
                        <div class="w-full h-0.5 bg-zinc-500/50"></div><div class="w-full h-0.5 bg-zinc-500/50"></div><div class="w-full h-0.5 bg-zinc-500/50"></div><div class="w-full h-0.5 bg-zinc-500/50"></div><div class="w-full h-0.5 bg-zinc-500/50"></div>
                    </div>
                    <div class="w-4 h-full bg-zinc-950 rounded-full shadow-[inset_0_5px_10px_rgba(0,0,0,1)] relative">
                        <div id="slider-0" class="absolute left-1/2 -translate-x-1/2 w-10 h-8 bg-gradient-to-b from-zinc-300 to-zinc-500 rounded border-y border-zinc-200 shadow-[0_4px_6px_rgba(0,0,0,0.6),inset_0_-2px_4px_rgba(0,0,0,0.3)] transition-all duration-300 ease-out z-20" style="bottom: 0%;">
                            <div class="absolute inset-0 flex flex-col items-center justify-center gap-0.5"><div class="w-6 h-0.5 bg-zinc-600/50"></div><div class="w-6 h-0.5 bg-zinc-600/50"></div><div class="w-6 h-0.5 bg-zinc-600/50"></div></div>
                        </div>
                    </div>
                </div>
                <!-- Kék (1) -->
                <div class="relative w-10 h-full flex justify-center">
                    <div class="absolute -left-3 top-0 h-full w-2 flex flex-col justify-between py-2">
                        <div class="w-full h-0.5 bg-zinc-500/50"></div><div class="w-full h-0.5 bg-zinc-500/50"></div><div class="w-full h-0.5 bg-zinc-500/50"></div><div class="w-full h-0.5 bg-zinc-500/50"></div><div class="w-full h-0.5 bg-zinc-500/50"></div>
                    </div>
                    <div class="w-4 h-full bg-zinc-950 rounded-full shadow-[inset_0_5px_10px_rgba(0,0,0,1)] relative">
                        <div id="slider-1" class="absolute left-1/2 -translate-x-1/2 w-10 h-8 bg-gradient-to-b from-zinc-300 to-zinc-500 rounded border-y border-zinc-200 shadow-[0_4px_6px_rgba(0,0,0,0.6),inset_0_-2px_4px_rgba(0,0,0,0.3)] transition-all duration-300 ease-out z-20" style="bottom: 0%;">
                            <div class="absolute inset-0 flex flex-col items-center justify-center gap-0.5"><div class="w-6 h-0.5 bg-zinc-600/50"></div><div class="w-6 h-0.5 bg-zinc-600/50"></div><div class="w-6 h-0.5 bg-zinc-600/50"></div></div>
                        </div>
                    </div>
                </div>
                <!-- Zöld (2) -->
                <div class="relative w-10 h-full flex justify-center">
                    <div class="absolute -left-3 top-0 h-full w-2 flex flex-col justify-between py-2">
                        <div class="w-full h-0.5 bg-zinc-500/50"></div><div class="w-full h-0.5 bg-zinc-500/50"></div><div class="w-full h-0.5 bg-zinc-500/50"></div><div class="w-full h-0.5 bg-zinc-500/50"></div><div class="w-full h-0.5 bg-zinc-500/50"></div>
                    </div>
                    <div class="w-4 h-full bg-zinc-950 rounded-full shadow-[inset_0_5px_10px_rgba(0,0,0,1)] relative">
                        <div id="slider-2" class="absolute left-1/2 -translate-x-1/2 w-10 h-8 bg-gradient-to-b from-zinc-300 to-zinc-500 rounded border-y border-zinc-200 shadow-[0_4px_6px_rgba(0,0,0,0.6),inset_0_-2px_4px_rgba(0,0,0,0.3)] transition-all duration-300 ease-out z-20" style="bottom: 0%;">
                            <div class="absolute inset-0 flex flex-col items-center justify-center gap-0.5"><div class="w-6 h-0.5 bg-zinc-600/50"></div><div class="w-6 h-0.5 bg-zinc-600/50"></div><div class="w-6 h-0.5 bg-zinc-600/50"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Gombok szekció -->
            <div class="pointer-events-auto flex justify-between w-full px-[15%] mb-4">
                <button onclick="handlePress(0)" class="w-16 h-16 rounded-full bg-gradient-to-b from-red-500 to-red-600 shadow-[0_8px_0_#7f1d1d,0_15px_20px_rgba(0,0,0,0.5)] active:shadow-[0_2px_0_#7f1d1d,0_5px_10px_rgba(0,0,0,0.5)] active:translate-y-[6px] transition-all border border-red-400 outline-none tap-highlight-transparent cursor-pointer"></button>
                <button onclick="handlePress(1)" class="w-16 h-16 rounded-full bg-gradient-to-b from-blue-500 to-blue-600 shadow-[0_8px_0_#1e3a8a,0_15px_20px_rgba(0,0,0,0.5)] active:shadow-[0_2px_0_#1e3a8a,0_5px_10px_rgba(0,0,0,0.5)] active:translate-y-[6px] transition-all border border-blue-400 outline-none tap-highlight-transparent cursor-pointer"></button>
                <button onclick="handlePress(2)" class="w-16 h-16 rounded-full bg-gradient-to-b from-green-500 to-green-600 shadow-[0_8px_0_#14532d,0_15px_20px_rgba(0,0,0,0.5)] active:shadow-[0_2px_0_#14532d,0_5px_10px_rgba(0,0,0,0.5)] active:translate-y-[6px] transition-all border border-green-400 outline-none tap-highlight-transparent cursor-pointer"></button>
            </div>

        </div>
    </div>

    <!-- Logika és UI szinkronizáció -->
    <script>
        // Stabil konfiguráció
        const TARGET_POSITIONS = [2, 4, 1]; // Piros, Kék, Zöld
        const SECRET_CODE = "4285";
        
        // Rendszerállapot
        let sliders = [0, 0, 0];
        let isUnlocked = false;

        // Elemek hivatkozásai a gyorsabb elérésért
        const displayEl = document.getElementById('digital-display');
        const sliderEls = [
            document.getElementById('slider-0'),
            document.getElementById('slider-1'),
            document.getElementById('slider-2')
        ];

        // Gombnyomás kezelése - ez a logika változatlan maradt
        function handlePress(index) {
            if (isUnlocked) return; // Zárolás, ha megoldva

            // Visszajelzés mobilra
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }

            // Csúszka állapotának növelése (0-4 között, majd körbeér)
            sliders[index] = (sliders[index] + 1) % 5;
            
            // Állapotellenőrzés
            checkUnlock();
            
            // Felület frissítése az új állapottal
            updateUI();
        }

        // Kód ellenőrzése
        function checkUnlock() {
            // Ellenőrizzük, hogy minden csúszka a helyén van-e
            let solved = true;
            for (let i = 0; i < sliders.length; i++) {
                if (sliders[i] !== TARGET_POSITIONS[i]) {
                    solved = false;
                    break;
                }
            }

            // Ha most oldottuk fel, rezgés visszajelzés
            if (solved && !isUnlocked && navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 200]);
            }
            
            isUnlocked = solved;
        }

        // DOM frissítése a belső állapot (state) alapján
        function updateUI() {
            // 1. Csúszkák mozgatása
            // Kiszámítjuk a bottom értéket: 0 pozíció = 0%, 4 pozíció = 100% (mínusz a gomb magassága)
            for (let i = 0; i < sliders.length; i++) {
                const pos = sliders[i];
                sliderEls[i].style.bottom = `calc(${pos * 25}% - ${pos * 8}px)`;
            }

            // 2. Kijelző frissítése
            if (isUnlocked) {
                displayEl.textContent = SECRET_CODE;
                displayEl.classList.remove('text-red-900', 'opacity-50');
                displayEl.classList.add('text-red-500', 'glow-red');
            } else {
                displayEl.textContent = '----';
                displayEl.classList.remove('text-red-500', 'glow-red');
                displayEl.classList.add('text-red-900', 'opacity-50');
            }
        }

        // Kezdeti kirajzolás
        updateUI();
    </script>
</body>
</html>
