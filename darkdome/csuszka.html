<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sötét Mechanizmus - Csúszkák 3524</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        .label {
            margin-bottom: 40px;
            color: #444;
            letter-spacing: 3px;
            font-size: 0.85em;
            text-align: center;
        }

        .panel {
            background: #1a1a1a;
            padding: 40px 20px;
            border: 2px solid #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 360px;
            gap: 15px;
        }

        .slider-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .symbol-box {
            width: 50px;
            height: 50px;
            margin-bottom: 20px;
            background: #080808;
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 80%;
            height: 80%;
        }

        /* Függőleges csúszka stílusa */
        .slider-container {
            height: 200px;
            width: 40px;
            background: #111;
            border: 1px solid #333;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 0;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 180px;
            height: 40px;
            background: transparent;
            transform: rotate(-90deg);
            position: absolute;
            top: 80px;
            left: -70px;
            cursor: pointer;
            margin: 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 35px;
            width: 35px;
            border-radius: 50%;
            background: #222;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
            cursor: pointer;
        }

        #status {
            margin-top: 40px;
            height: 20px;
            color: #00ffcc;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>
<body>

    <div class="label">ÁLLÍTSD BE A MEGFELELŐ ÉRTÉKEKET</div>

    <div class="panel">
        <div class="slider-column">
            <div class="symbol-box"><canvas id="s0"></canvas></div>
            <div class="slider-container">
                <input type="range" id="sl0" min="1" max="5" value="1" oninput="check()">
            </div>
        </div>
        <div class="slider-column">
            <div class="symbol-box"><canvas id="s1"></canvas></div>
            <div class="slider-container">
                <input type="range" id="sl1" min="1" max="5" value="1" oninput="check()">
            </div>
        </div>
        <div class="slider-column">
            <div class="symbol-box"><canvas id="s2"></canvas></div>
            <div class="slider-container">
                <input type="range" id="sl2" min="1" max="5" value="1" oninput="check()">
            </div>
        </div>
        <div class="slider-column">
            <div class="symbol-box"><canvas id="s3"></canvas></div>
            <div class="slider-container">
                <input type="range" id="sl3" min="1" max="5" value="1" oninput="check()">
            </div>
        </div>
    </div>

    <div id="status"></div>

    <script>
        const targetUrl = "https://treasurehuntsites.github.io/konyvmegallo/2/game.html";
        
        // A HELYES KÓD: 1. csúszka=3, 2.=5, 3.=2, 4.=4
        const solution = [3, 5, 2, 4];

        function drawSymbols() {
            for(let i=0; i<4; i++) {
                const canvas = document.getElementById('s' + i);
                const ctx = canvas.getContext('2d');
                canvas.width = 100;
                canvas.height = 100;
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffcc';

                ctx.beginPath();
                if(i === 0) { // Spirál
                    ctx.moveTo(20,20); ctx.lineTo(80,20); ctx.lineTo(80,80); ctx.lineTo(40,80); ctx.lineTo(40,40);
                } else if(i === 1) { // Szem
                    ctx.rect(20,35,60,30); ctx.moveTo(50,35); ctx.lineTo(50,65);
                } else if(i === 2) { // Háromszög
                    ctx.moveTo(50,20); ctx.lineTo(80,80); ctx.lineTo(20,80); ctx.closePath();
                } else if(i === 3) { // Kereszt
                    ctx.moveTo(25,50); ctx.lineTo(75,50); ctx.moveTo(50,25); ctx.lineTo(50,75);
                }
                ctx.stroke();
            }
        }

        function check() {
            const current = [
                parseInt(document.getElementById('sl0').value),
                parseInt(document.getElementById('sl1').value),
                parseInt(document.getElementById('sl2').value),
                parseInt(document.getElementById('sl3').value)
            ];

            const isSolved = current.every((val, index) => val === solution[index]);

            if (isSolved) {
                document.getElementById('status').textContent = "MECHANIZMUS AKTIVÁLVA";
                document.querySelectorAll('input').forEach(el => el.disabled = true);
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 1500);
            }
        }

        window.onload = drawSymbols;
    </script>
</body>
</html>
