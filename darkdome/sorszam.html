<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSEI Sorszámhívó Kijelző</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        
        /* A TV képernyő specifikus stílusai */
        .tv-screen {
            background: linear-gradient(135deg, #2a2c41 0%, #1e2030 100%);
            border: 12px solid #000;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0,0,0,0.5);
            aspect-ratio: 16 / 9;
            color: #dbeafe; /* Világoskék/fehér szöveg */
        }

        .tv-header {
            letter-spacing: 0.2em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .table-border {
            border: 2px solid rgba(147, 197, 253, 0.3);
        }

        .row-border {
            border-bottom: 2px solid rgba(147, 197, 253, 0.3);
        }

        .highlight-animation {
            animation: flash 1.5s ease-out;
        }

        @keyframes flash {
            0% { background-color: rgba(255, 255, 255, 0.4); }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-7xl w-full flex flex-col lg:flex-row gap-8">
        
        <!-- VEZÉRLŐPULT (ADMIN) -->
        <div class="w-full lg:w-1/3 bg-white p-6 rounded-2xl shadow-xl flex flex-col h-fit">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Vezérlőpult</h2>
            
            <form id="callForm" class="flex flex-col gap-4">
                <div>
                    <label for="hivoszam" class="block text-sm font-medium text-gray-700 mb-1">Hívószám</label>
                    <input type="text" id="hivoszam" required placeholder="pl. 267" 
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-xl font-semibold">
                </div>
                
                <div>
                    <label for="rendelo" class="block text-sm font-medium text-gray-700 mb-1">Rendelő</label>
                    <input type="text" id="rendelo" required placeholder="pl. C110" 
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-xl font-semibold uppercase">
                </div>
                
                <button type="submit" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-lg shadow-lg hover:shadow-xl transition-all transform active:scale-95 text-lg">
                    Sorszám Behívása
                </button>
            </form>

            <div class="mt-8 text-sm text-gray-500">
                <p>ℹ️ Az új hívószám mindig a bal felső sarokban jelenik meg, a régebbiek pedig csúsznak lefelé és jobbra.</p>
            </div>
        </div>

        <!-- KIJELZŐ (TV KÉPERNYŐ) -->
        <div class="w-full lg:w-2/3 tv-screen p-4 md:p-6 lg:p-8 flex flex-col relative overflow-hidden">
            
            <!-- Főcím -->
            <div class="text-center mb-4 md:mb-6">
                <h1 class="text-3xl md:text-5xl font-bold tv-header pb-2 border-b-4 border-blue-200/30 inline-block px-12">
                    OSEI I. EMELET
                </h1>
            </div>

            <!-- Táblázat konténer -->
            <div class="flex-1 flex gap-4 md:gap-8 w-full h-full">
                
                <!-- Bal oldali oszlop -->
                <div class="w-1/2 flex flex-col table-border bg-white/5 rounded-lg overflow-hidden">
                    <div class="flex justify-between px-4 md:px-8 py-2 md:py-3 row-border bg-white/10 text-lg md:text-2xl font-semibold tracking-wider">
                        <span>Hívószám</span>
                        <span>|</span>
                        <span>Rendelő</span>
                    </div>
                    <div id="leftColumn" class="flex-1 flex flex-col">
                        <!-- Ide kerülnek a sorok (1-4) -->
                    </div>
                </div>

                <!-- Jobb oldali oszlop -->
                <div class="w-1/2 flex flex-col table-border bg-white/5 rounded-lg overflow-hidden">
                    <div class="flex justify-between px-4 md:px-8 py-2 md:py-3 row-border bg-white/10 text-lg md:text-2xl font-semibold tracking-wider">
                        <span>Hívószám</span>
                        <span>|</span>
                        <span>Rendelő</span>
                    </div>
                    <div id="rightColumn" class="flex-1 flex flex-col">
                        <!-- Ide kerülnek a sorok (5-8) -->
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        // Kezdeti adatok a kép alapján (8 férőhely van összesen a két oszlopban)
        // A legújabb hívás van elöl (index 0)
        let queueData = [
            { number: '195', room: 'C110' },
            { number: '256', room: 'C111' },
            { number: '262', room: 'C128' },
            { number: '40',  room: 'C110' },
            { number: '266', room: 'C110' },
            { number: '196', room: 'C110' },
            { number: '40',  room: 'C110' },
            { number: '40',  room: 'C110' }
        ];

        const leftColumn = document.getElementById('leftColumn');
        const rightColumn = document.getElementById('rightColumn');
        const callForm = document.getElementById('callForm');

        // Funkció egy sor HTML elemének legenerálására
        function createRowHTML(item, isNewest) {
            // Ha nincs adat (üres hely), akkor üres sort renderelünk
            if (!item) {
                return `
                    <div class="flex justify-between px-4 md:px-8 py-4 md:py-6 row-border last:border-0 flex-1 items-center">
                        <span class="text-4xl md:text-6xl font-light opacity-0">-</span>
                        <span class="text-4xl md:text-6xl font-light opacity-0">-</span>
                    </div>
                `;
            }

            const animationClass = isNewest ? 'highlight-animation' : '';

            return `
                <div class="flex justify-between px-4 md:px-8 py-4 md:py-6 row-border last:border-0 flex-1 items-center ${animationClass}">
                    <span class="text-4xl md:text-7xl font-light tracking-wide">${item.number}</span>
                    <span class="text-4xl md:text-7xl font-light tracking-wide">${item.room}</span>
                </div>
            `;
        }

        // A képernyő frissítése
        function renderDisplay(animateFirst = false) {
            leftColumn.innerHTML = '';
            rightColumn.innerHTML = '';

            // Bal oszlop (első 4 elem)
            for (let i = 0; i < 4; i++) {
                leftColumn.innerHTML += createRowHTML(queueData[i], animateFirst && i === 0);
            }

            // Jobb oszlop (második 4 elem)
            for (let i = 4; i < 8; i++) {
                rightColumn.innerHTML += createRowHTML(queueData[i], false);
            }
        }

        // Form beküldésének kezelése
        callForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const numberInput = document.getElementById('hivoszam').value.trim();
            const roomInput = document.getElementById('rendelo').value.trim().toUpperCase();

            if (numberInput && roomInput) {
                // Új elem hozzáadása a tömb elejére
                queueData.unshift({
                    number: numberInput,
                    room: roomInput
                });

                // Ha több mint 8 elem van, a legutolsót eldobjuk
                if (queueData.length > 8) {
                    queueData.pop();
                }

                // Képernyő frissítése animációval
                renderDisplay(true);

                // Mezők ürítése és fókusz visszaadása
                document.getElementById('hivoszam').value = '';
                document.getElementById('hivoszam').focus();
            }
        });

        // Kezdeti renderelés
        renderDisplay();
    </script>
</body>
</html>
