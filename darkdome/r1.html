<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sötét Mechanizmus - Kunyhó</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .puzzle-box {
            width: 90%;
            max-width: 380px;
            background: #141414;
            border: 2px solid #2a2a2a;
            padding: 30px 20px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            border-radius: 4px;
            text-align: center;
        }

        /* Szimbólum rács rögzített helyekkel */
        .symbol-row {
            display: flex;
            justify-content: space-around;
            background: #080808;
            padding: 15px;
            border-radius: 2px;
            margin-bottom: 40px;
            border: 1px solid #1a1a1a;
            height: 60px;
        }

        canvas {
            width: 50px;
            height: 50px;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        canvas.active {
            opacity: 1;
        }

        /* Nyilak (D-PAD) - Mind a 4 látszik */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 0 auto;
            width: 220px;
        }

        .btn {
            background: #1d1d1d;
            border: 1px solid #333;
            color: #666;
            padding: 20px;
            font-size: 22px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.1s;
            touch-action: manipulation;
        }

        .btn:active {
            background: #2a2a2a;
            color: #00ffcc;
            border-color: #00ffcc;
        }

        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }

        #win-box {
            display: none;
            margin-top: 30px;
            padding: 15px;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            font-size: 1.2em;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>
<body>

    <div class="puzzle-box">
        <div class="symbol-row">
            <canvas id="canv0" width="100" height="100"></canvas>
            <canvas id="canv1" width="100" height="100"></canvas>
            <canvas id="canv2" width="100" height="100"></canvas>
            <canvas id="canv3" width="100" height="100"></canvas>
        </div>

        <div class="controls">
            <button class="btn up" onclick="handleInput('FEL')">▲</button>
            <button class="btn left" onclick="handleInput('BAL')">◀</button>
            <button class="btn right" onclick="handleInput('JOBB')">▶</button>
            <button class="btn down" onclick="handleInput('LE')">▼</button>
        </div>

        <div id="win-box">KÓD: 1924</div>
    </div>

    <script>
        // Szekvenciák a kérésed alapján
        const sequences = [
            ['LE', 'LE', 'LE', 'JOBB', 'JOBB'], // 1. Spirális alakzat
            ['JOBB', 'JOBB', 'JOBB', 'LE', 'LE'], // 2. Szögletes szemforma
            ['LE', 'LE', 'JOBB', 'JOBB', 'JOBB'], // 3. Háromszög-kombináció
            ['JOBB', 'JOBB', 'LE', 'LE', 'LE']  // 4. Labirintus jel
        ];

        let solvedSymbols = 0;
        let inputBuffer = [];

        // Szimbólumok megrajzolása (Dark Dome stílusú absztrakt jelek)
        function drawSymbols() {
            const ctx0 = document.getElementById('canv0').getContext('2d');
            const ctx1 = document.getElementById('canv1').getContext('2d');
            const ctx2 = document.getElementById('canv2').getContext('2d');
            const ctx3 = document.getElementById('canv3').getContext('2d');
            
            const style = (ctx) => {
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 6;
                ctx.lineJoin = 'round';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffcc';
            };

            // 1. Spirális absztrakt (LE LE LE JOBB JOBB)
            style(ctx0);
            ctx0.beginPath();
            ctx0.moveTo(20, 20); ctx0.lineTo(80, 20); ctx0.lineTo(80, 80); ctx0.lineTo(40, 80); ctx0.lineTo(40, 40);
            ctx0.stroke();

            // 2. Szögletes szem (JOBB JOBB JOBB LE LE)
            style(ctx1);
            ctx1.beginPath();
            ctx1.rect(20, 35, 60, 30);
            ctx1.moveTo(50, 40); ctx1.lineTo(50, 60);
            ctx1.stroke();

            // 3. Háromszög alapú (LE LE JOBB JOBB JOBB)
            style(ctx2);
            ctx2.beginPath();
            ctx2.moveTo(50, 20); ctx2.lineTo(80, 80); ctx2.lineTo(20, 80); ctx2.closePath();
            ctx2.stroke();

            // 4. Labirintus/Kereszt (JOBB JOBB LE LE LE)
            style(ctx3);
            ctx3.beginPath();
            ctx3.moveTo(20, 50); ctx3.lineTo(80, 50); ctx3.moveTo(50, 20); ctx3.lineTo(50, 80);
            ctx3.stroke();
        }

        function handleInput(dir) {
            if (solvedSymbols >= 4) return;

            inputBuffer.push(dir);
            const targetSeq = sequences[solvedSymbols];
            
            const isCorrectSoFar = inputBuffer.every((val, index) => val === targetSeq[index]);

            if (!isCorrectSoFar) {
                inputBuffer = [];
                if (dir === targetSeq[0]) inputBuffer.push(dir);
                return;
            }

            if (inputBuffer.length === targetSeq.length) {
                document.getElementById(`canv${solvedSymbols}`).classList.add('active');
                solvedSymbols++;
                inputBuffer = [];
                
                if (solvedSymbols === 4) {
                    setTimeout(() => {
                        document.getElementById('win-box').style.display = "block";
                    }, 500);
                }
            }
        }

        // Rajzolás inicializálása
        drawSymbols();
    </script>
</body>
</html>
