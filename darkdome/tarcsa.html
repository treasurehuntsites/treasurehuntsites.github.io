<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kőtárcsa Rejtvény</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            background-color: #08090a;
            background-image: radial-gradient(circle at 50% 40%, #1a1c1e 0%, #050606 100%);
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-svg {
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            filter: drop-shadow(0 30px 40px rgba(0,0,0,0.9));
        }

        .piece {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .piece-inner {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
            transform-origin: 0px 0px;
        }

        /* Realistic interaction: slightly lifting the stone piece */
        .piece:hover .piece-inner {
            filter: brightness(1.08);
        }

        .piece.selected .piece-inner {
            transform: scale(1.03);
            filter: brightness(1.15) drop-shadow(0 15px 20px rgba(0,0,0,0.7));
        }

        .leaf-bg {
            fill: #44484c; /* Base stone color */
            stroke: #1a1c1e;
            stroke-width: 1.5px;
        }

        /* Dark hole effect with bottom rim highlight for deep carving illusion */
        .carving-fill {
            fill: #141517;
            filter: drop-shadow(0px 1.5px 1px rgba(255, 255, 255, 0.35)) drop-shadow(0px -1px 2px rgba(0,0,0,0.8));
        }
        
        .carving-path {
            fill: none;
            stroke: #141517;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0px 1px 0.5px rgba(255, 255, 255, 0.3));
        }

        #paper-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            backdrop-filter: blur(8px);
        }

        #paper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280px;
            height: 180px;
            background-color: #d1b88a;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.15) 100%),
                radial-gradient(circle at 50% 50%, #e6d3a5 0%, #a6844b 100%);
            box-shadow: 
                inset 0 0 30px rgba(70, 40, 10, 0.7),
                0 25px 50px rgba(0,0,0,0.9);
            z-index: 50;
            transform: translate(-50%, -20%) scale(0.7) rotate(-8deg);
            opacity: 0;
            pointer-events: none;
            transition: all 1.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* Organic torn edge look */
            clip-path: polygon(
                1% 2%, 97% 1%, 99% 96%, 94% 99%, 4% 97%, 0% 6%
            );
        }

        #paper-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        #paper.show {
            transform: translate(-50%, -50%) scale(1) rotate(1deg);
            opacity: 1;
            pointer-events: auto;
        }

        .code-text {
            font-family: 'Courier Prime', monospace;
            font-size: 5rem;
            font-weight: bold;
            color: #2b1f13;
            text-shadow: 1px 1.5px 1px rgba(255,255,255,0.4), -1px -1px 2px rgba(0,0,0,0.6);
            letter-spacing: 0.15em;
            transform: rotate(-1deg);
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        
        <svg id="game-svg" viewBox="-180 -180 360 360">
            <defs>
                <filter id="realistic-stone" x="-20%" y="-20%" width="140%" height="140%">
                    <!-- Generate detailed rock grain -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="4" result="fineNoise" />
                    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="largeNoise" />
                    <feBlend mode="overlay" in="fineNoise" in2="largeNoise" result="combinedNoise" />
                    
                    <!-- Map noise to realistic granite/slate colors -->
                    <feColorMatrix type="matrix" values="
                        0 0 0 0 0.28
                        0 0 0 0 0.30
                        0 0 0 0 0.32
                        1 0 0 0 0
                    " in="combinedNoise" result="coloredNoise" />
                    
                    <!-- Base stone color layer -->
                    <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="baseTexture" />
                    
                    <!-- Add 3D surface bumps and lighting -->
                    <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur" />
                    <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.7" specularExponent="20" lighting-color="#e8ebf0" result="specular">
                        <fePointLight x="-150" y="-150" z="150" />
                    </feSpecularLighting>
                    <feComposite operator="in" in="specular" in2="SourceAlpha" result="specularMasked" />
                    
                    <!-- Combine texture with lighting -->
                    <feBlend mode="screen" in="specularMasked" in2="baseTexture" result="litStone" />
                    
                    <!-- Final blend with original shape color for tinting -->
                    <feBlend mode="multiply" in="litStone" in2="SourceGraphic" result="finalStone" />
                </filter>
                
                <filter id="dial-shadow">
                    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.8"/>
                </filter>
            </defs>

            <circle cx="0" cy="0" r="155" fill="#323538" filter="url(#dial-shadow)"/>
            <circle cx="0" cy="0" r="152" fill="#3a3d40" filter="url(#realistic-stone)" stroke="#1a1c1e" stroke-width="3"/>
            <circle cx="0" cy="0" r="142" fill="#44484c" filter="url(#realistic-stone)"/>
            
            <!-- Pieces group -->
            <g id="dial-group" transform="rotate(-90)"></g>

            <circle cx="0" cy="0" r="35" fill="#3a3d40" filter="url(#realistic-stone)" stroke="#141517" stroke-width="4"/>
            <circle cx="0" cy="0" r="28" fill="#4a4e52" filter="url(#realistic-stone)"/>
            
            <!-- Deep central carvings -->
            <path d="M-12,0 L12,0 M0,-12 L0,12" stroke="#141517" stroke-width="3" stroke-linecap="round" filter="drop-shadow(0px 1px 1px rgba(255,255,255,0.4))"/>
            <circle cx="0" cy="0" r="5" fill="#141517" filter="drop-shadow(0px 1px 1px rgba(255,255,255,0.4))"/>
        </svg>

        <div id="paper-overlay"></div>
        <div id="paper">
            <div class="code-text">5439</div>
        </div>
    </div>

    <script>
        const animalsData = [
            { 
                id: 'bagoly',
                // Realistic perched owl silhouette
                path: `
                    <path class="carving-fill" d="M -5,-18 C -2,-18 0,-20 2,-20 C 4,-20 6,-18 8,-16 C 10,-14 11,-10 10,-6 C 14,-2 15,4 13,12 C 12,18 8,22 4,22 L -2,22 C -6,22 -10,18 -11,12 C -13,4 -11,-2 -8,-6 C -9,-10 -8,-14 -5,-18 Z" />
                    <!-- Eye details -->
                    <circle fill="#4a4e52" cx="0" cy="-12" r="1.5"/>
                    <circle fill="#4a4e52" cx="6" cy="-12" r="1.5"/>
                    <!-- Wing line -->
                    <path class="carving-path" d="M -6,0 C -4,8 -6,16 -6,16" stroke-width="1.5"/>
                `
            },
            { 
                id: 'roka',
                // Realistic standing fox with bushy tail
                path: `
                    <path class="carving-fill" d="M 12,-6 L 16,-12 L 14,-4 C 18,-2 22,2 20,6 L 22,14 L 18,14 C 18,10 16,8 12,8 C 10,12 6,16 0,16 L -2,22 L -6,22 L -4,16 C -10,14 -16,18 -20,14 C -24,10 -22,0 -14,6 C -10,8 -6,6 -2,2 C 2,-2 6,-4 12,-6 Z" />
                    <circle fill="#4a4e52" cx="14" cy="0" r="1"/>
                `
            },
            { 
                id: 'szarvas',
                // Realistic stag head with detailed antlers
                path: `
                    <path class="carving-fill" d="M 4,-2 C 6,4 4,10 0,14 C -4,18 -10,20 -10,20 C -10,20 -6,14 -8,8 C -10,2 -12,-2 -10,-8 L -14,-12 L -10,-14 L -16,-20 L -12,-20 L -10,-16 L -6,-22 L -4,-22 L -2,-16 L 0,-22 L 2,-22 L 6,-16 L 8,-20 L 12,-20 L 8,-14 L 10,-12 Z" />
                    <circle fill="#4a4e52" cx="-2" cy="0" r="1"/>
                `
            },
            { 
                id: 'galamb',
                // Realistic flying dove profile
                path: `
                    <path class="carving-fill" d="M 14,-10 C 18,-14 24,-12 22,-8 C 16,-4 10,2 14,8 C 16,12 18,18 14,22 C 8,18 2,12 0,6 C -6,14 -14,18 -18,14 C -22,10 -16,0 -8,2 C -2,4 4,6 6,0 C 8,-4 10,-6 14,-10 Z" />
                    <circle fill="#4a4e52" cx="16" cy="6" r="1"/>
                `
            },
            { 
                id: 'medve',
                // Realistic heavy walking bear
                path: `
                    <path class="carving-fill" d="M 16,0 C 20,0 24,4 22,8 L 22,18 L 18,18 L 18,12 C 14,14 10,16 6,16 L 6,22 L 0,22 L 0,16 C -6,16 -12,18 -16,14 C -20,10 -20,0 -14,-4 C -8,-8 0,-10 6,-6 C 12,-2 14,-2 16,0 Z" />
                    <circle fill="#4a4e52" cx="18" cy="6" r="1"/>
                `
            },
            { 
                id: 'mokus',
                // Realistic upright squirrel with large tail
                path: `
                    <path class="carving-fill" d="M 10,18 L 4,18 C 0,18 -2,14 -2,10 C -2,6 0,2 -2,-2 C -4,-6 -2,-14 2,-14 C 6,-14 10,-10 8,-4 C 12,-4 16,0 16,6 C 16,12 14,18 10,18 Z M -2,-2 C -8,-8 -16,-8 -18,-2 C -20,6 -14,18 -6,18 C -10,12 -10,6 -2,-2 Z" />
                    <circle fill="#4a4e52" cx="10" cy="0" r="1"/>
                `
            }
        ];

        const targetOrder = ['bagoly', 'roka', 'szarvas', 'galamb', 'medve', 'mokus'];
        let pieces = [];
        let selectedIndex = null;
        let isLocked = false;

        function initializeGame() {
            const dialGroup = document.getElementById('dial-group');
            
            // Randomize until unsolved state is generated
            let shuffledAnimals;
            do {
                shuffledAnimals = [...animalsData].sort(() => Math.random() - 0.5);
            } while (shuffledAnimals.every((a, i) => a.id === targetOrder[i]));

            shuffledAnimals.forEach((animal, index) => {
                const rotation = index * 60;
                const pieceObj = {
                    id: animal.id,
                    currentSlot: index,
                    totalRotation: rotation,
                    element: null,
                    innerElement: null
                };
                
                // Leaf shape adjusted to fit tightly
                const leafPath = "M 36 0 C 60 -36, 110 -36, 138 0 C 110 36, 60 36, 36 0 Z";

                const gOuter = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                gOuter.setAttribute('class', 'piece');
                gOuter.setAttribute('id', `piece-${animal.id}`);
                
                // Outer group handles the rotational position
                gOuter.style.transform = `rotate(${rotation}deg)`;
                gOuter.style.transformOrigin = "0px 0px";
                gOuter.style.transition = "transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)";
                
                gOuter.onclick = () => handlePieceClick(pieceObj);

                // Inner group handles the hover/selection interaction (scaling, lighting)
                const gInner = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                gInner.setAttribute('class', 'piece-inner');
                
                gInner.innerHTML = `
                    <path d="${leafPath}" class="leaf-bg" filter="url(#realistic-stone)"/>
                    <!-- Engraving placed nicely inside the stone leaf -->
                    <g transform="translate(95, 0) rotate(90) scale(1.2)">
                        ${animal.path}
                    </g>
                `;

                gOuter.appendChild(gInner);
                dialGroup.appendChild(gOuter);
                
                pieceObj.element = gOuter;
                pieceObj.innerElement = gInner;
                pieces.push(pieceObj);
            });
        }

        function handlePieceClick(clickedPiece) {
            if (isLocked) return;

            const clickedIdx = pieces.findIndex(p => p.id === clickedPiece.id);

            // Select piece if none is selected
            if (selectedIndex === null) {
                selectedIndex = clickedIdx;
                clickedPiece.element.classList.add('selected');
                return;
            }

            const selectedPiece = pieces[selectedIndex];

            // Deselect if clicking the same piece
            if (selectedPiece.id === clickedPiece.id) {
                selectedPiece.element.classList.remove('selected');
                selectedIndex = null;
                return;
            }

            // Check adjacency for swapping
            const diff = clickedPiece.currentSlot - selectedPiece.currentSlot;
            const isAdjacent = Math.abs(diff) === 1 || Math.abs(diff) === 5;

            if (isAdjacent) {
                selectedPiece.element.classList.remove('selected');
                
                // Rotate taking the shortest path
                let deltaRotation = (diff === 1 || diff === -5) ? 60 : -60;

                selectedPiece.totalRotation += deltaRotation;
                clickedPiece.totalRotation -= deltaRotation;

                // Swap indices
                let tempSlot = selectedPiece.currentSlot;
                selectedPiece.currentSlot = clickedPiece.currentSlot;
                clickedPiece.currentSlot = tempSlot;

                // Apply animation
                selectedPiece.element.style.transform = `rotate(${selectedPiece.totalRotation}deg)`;
                clickedPiece.element.style.transform = `rotate(${clickedPiece.totalRotation}deg)`;

                selectedIndex = null;

                // Validate win condition after transition ends
                setTimeout(checkWinCondition, 650);
            } else {
                // Change selection
                selectedPiece.element.classList.remove('selected');
                clickedPiece.element.classList.add('selected');
                selectedIndex = clickedIdx;
            }
        }

        function checkWinCondition() {
            let solved = true;
            
            targetOrder.forEach((targetId, expectedSlot) => {
                const piece = pieces.find(p => p.id === targetId);
                if (piece.currentSlot !== expectedSlot) {
                    solved = false;
                }
            });

            if (solved) {
                isLocked = true;
                
                // Clear any selections
                pieces.forEach(p => p.element.classList.remove('selected'));

                // Reveal the code paper
                document.getElementById('paper-overlay').classList.add('show');
                document.getElementById('paper').classList.add('show');
            }
        }

        // Boot
        document.addEventListener('DOMContentLoaded', initializeGame);

    </script>
</body>
</html>
