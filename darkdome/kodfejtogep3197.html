<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kódfejtő Gép</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Black Ops One', cursive;
        }

        #game-container {
            position: relative;
            width: 800px;
            max-width: 95vw;
            height: 500px;
        }

        .secret-compartment {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            border-radius: 12px;
            box-shadow: inset 0 0 50px rgba(0,0,0,1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .paper {
            background-color: #f4f1ea;
            width: 300px;
            height: 150px;
            transform: rotate(-3deg);
            box-shadow: 2px 5px 15px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Caveat', cursive;
            font-size: 5rem;
            color: #b91c1c;
            border-radius: 2px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .paper.revealed {
            opacity: 1;
        }

        .machine-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #576574 0%, #222f3e 100%);
            border: 4px solid #111;
            border-radius: 12px;
            box-shadow: 
                inset 0 0 100px rgba(0,0,0,0.8),
                0 15px 30px rgba(0,0,0,0.6);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            padding: 20px;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.5s ease;
        }

        .machine-panel.open {
            transform: translateY(110%);
            opacity: 0.5;
        }

        .screw {
            position: absolute;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, #7f8c8d 30%, #2c3e50 90%);
            border-radius: 50%;
            box-shadow: inset -1px -1px 3px rgba(0,0,0,0.8), 1px 1px 2px rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screw::after {
            content: '';
            width: 14px;
            height: 3px;
            background: #111;
            transform: rotate(45deg);
            border-radius: 1px;
        }

        .screw.tl { top: 15px; left: 15px; }
        .screw.tr { top: 15px; right: 15px; }
        .screw.bl { bottom: 15px; left: 15px; transform: rotate(20deg); }
        .screw.br { bottom: 15px; right: 15px; transform: rotate(-15deg); }

        .row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            padding: 0 40px;
        }

        .number-label {
            font-size: 2rem;
            color: #1e272e;
            text-shadow: -1px -1px 1px rgba(255,255,255,0.1), 1px 1px 2px rgba(0,0,0,0.8);
            width: 60px;
            text-align: center;
        }

        .button-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, #111, #333);
            box-shadow: 
                0 4px 6px rgba(0,0,0,0.6),
                inset 0 2px 4px rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #000;
        }

        .button-inner-ring {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.8);
        }

        .push-button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ef4444, #7f1d1d);
            border: 1px solid #450a0a;
            box-shadow: 
                inset -2px -2px 5px rgba(0,0,0,0.5),
                inset 2px 2px 5px rgba(255,255,255,0.3),
                0 2px 4px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.1s ease;
            outline: none;
        }

        .push-button:active {
            transform: scale(0.9);
            box-shadow: 
                inset -1px -1px 3px rgba(0,0,0,0.5),
                inset 1px 1px 3px rgba(255,255,255,0.2),
                0 0px 1px rgba(0,0,0,0.5);
        }

        .push-button.flash-green {
            background: radial-gradient(circle at 30% 30%, #4ade80, #14532d);
            border-color: #064e3b;
            box-shadow: 
                0 0 15px #22c55e,
                inset -2px -2px 5px rgba(0,0,0,0.5),
                inset 2px 2px 5px rgba(255,255,255,0.5);
        }

        .push-button.flash-red {
            background: radial-gradient(circle at 30% 30%, #f87171, #991b1b);
            box-shadow: 0 0 20px #ef4444;
        }

        .symbols-panel {
            background: #1e272e;
            border-radius: 8px;
            height: 60px;
            margin: 10px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
            border: 1px solid #111;
        }

        .symbol {
            font-family: sans-serif;
            font-size: 2.2rem;
            color: #8c9cad;
            text-shadow: 0 0 5px rgba(140, 156, 173, 0.4);
            user-select: none;
        }
        
        .button-group-bg {
            background: rgba(0,0,0,0.15);
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.5);
            padding: 10px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- Rejtett rekesz a jelszóval -->
        <div class="secret-compartment">
            <div class="paper" id="secret-paper">3197</div>
        </div>

        <!-- Fő gép panel -->
        <div class="machine-panel" id="machine">
            <div class="screw tl"></div>
            <div class="screw tr"></div>
            <div class="screw bl"></div>
            <div class="screw br"></div>

            <!-- Felső számok -->
            <div class="row">
                <div class="number-label">1</div>
                <div class="number-label">2</div>
                <div class="number-label">3</div>
                <div class="number-label">4</div>
                <div class="number-label">5</div>
            </div>

            <!-- Felső gombok -->
            <div class="row button-group-bg">
                <div class="button-wrapper"><div class="button-inner-ring"><button class="push-button" data-val="1"></button></div></div>
                <div class="button-wrapper"><div class="button-inner-ring"><button class="push-button" data-val="2"></button></div></div>
                <div class="button-wrapper"><div class="button-inner-ring"><button class="push-button" data-val="3"></button></div></div>
                <div class="button-wrapper"><div class="button-inner-ring"><button class="push-button" data-val="4"></button></div></div>
                <div class="button-wrapper"><div class="button-inner-ring"><button class="push-button" data-val="5"></button></div></div>
            </div>

            <!-- Középső szimbólumok -->
            <div class="symbols-panel">
                <svg class="symbol" width="40" height="40" viewBox="0 0 24 24" stroke="#8c9cad" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="5"></circle>
                    <line x1="12" y1="13" x2="12" y2="21"></line>
                    <line x1="8" y1="17" x2="16" y2="17"></line>
                </svg>
                <svg class="symbol" width="40" height="40" viewBox="0 0 24 24" stroke="#8c9cad" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 7 c 0 -4, 6 -4, 6 0 c 0 4, -6 5, -6 9 c 0 4, 6 4, 6 0 c 0 -4, -6 -5, -6 -9"></path>
                </svg>
                <svg class="symbol" width="40" height="40" viewBox="0 0 24 24" stroke="#8c9cad" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 5 C 10 3, 6 7, 7 13 C 8 18, 14 19, 17 15 C 19 11, 15 8, 12 11"></path>
                    <circle cx="13" cy="14" r="1.5" fill="#8c9cad" stroke="none"></circle>
                </svg>
                <svg class="symbol" width="40" height="40" viewBox="0 0 24 24" stroke="#8c9cad" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="7"></circle>
                    <circle cx="12" cy="12" r="2" fill="#8c9cad" stroke="none"></circle>
                </svg>
            </div>

            <!-- Alsó gombok -->
            <div class="row button-group-bg">
                <div class="button-wrapper"><div class="button-inner-ring"><button class="push-button" data-val="6"></button></div></div>
                <div class="button-wrapper"><div class="button-inner-ring"><button class="push-button" data-val="7"></button></div></div>
                <div class="button-wrapper"><div class="button-inner-ring"><button class="push-button" data-val="8"></button></div></div>
                <div class="button-wrapper"><div class="button-inner-ring"><button class="push-button" data-val="9"></button></div></div>
                <div class="button-wrapper"><div class="button-inner-ring"><button class="push-button" data-val="10"></button></div></div>
            </div>

            <!-- Alsó számok -->
            <div class="row">
                <div class="number-label">6</div>
                <div class="number-label">7</div>
                <div class="number-label">8</div>
                <div class="number-label">9</div>
                <div class="number-label">10</div>
            </div>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.push-button');
        const machine = document.getElementById('machine');
        const paper = document.getElementById('secret-paper');
        
        const CORRECT_CODE = "1859";
        let currentSequence = [];
        let isUnlocked = false;

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isUnlocked) return; // Ha már nyitva van, ne csináljon semmit

                const val = btn.getAttribute('data-val');
                
                // Zöld villanás effektus
                btn.classList.add('flash-green');
                setTimeout(() => {
                    btn.classList.remove('flash-green');
                }, 300);

                // Kód hozzáadása a sorozathoz
                currentSequence.push(val);
                
                // Csak az utolsó 4 gombnyomást tartjuk meg
                if (currentSequence.length > 4) {
                    currentSequence.shift();
                }

                // Ellenőrzés
                if (currentSequence.length === 4) {
                    if (currentSequence.join('') === CORRECT_CODE) {
                        unlockMachine();
                    }
                }
            });
        });

        function unlockMachine() {
            isUnlocked = true;
            
            // Rövid várakozás, majd nyitási animáció
            setTimeout(() => {
                // Minden gomb zölden világít a sikeresség jeleként
                buttons.forEach(b => b.classList.add('flash-green'));
                
                setTimeout(() => {
                    machine.classList.add('open');
                    
                    // Papír felfedése miután a panel lecsúszott
                    setTimeout(() => {
                        paper.classList.add('revealed');
                    }, 800);

                }, 500);

            }, 400);
        }
    </script>
</body>
</html>
