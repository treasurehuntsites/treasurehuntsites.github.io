<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejövő hívás...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
        }

        /* Teljesen átlátszó, láthatatlan indító réteg */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0); /* Teljesen átlátszó */
            z-index: 9999;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tipp: Ha üres az oldal, a felhasználó nem tudja hova kattintson. 
           Ezért egy halvány jelzést hagytam, de ezt is kiveheted. */
        #overlay p {
            color: rgba(255,255,255,0.1);
            font-size: 0.8rem;
        }

        .phone-screen {
            display: none; /* Alaphelyzetben rejtve */
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            background: linear-gradient(to bottom, #2c3e50, #000000);
            padding: 60px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .caller-info h1 {
            font-size: 2.2rem;
            margin: 10px 0;
        }

        .caller-info p {
            color: #bdc3c7;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            justify-content: space-around;
            padding-bottom: 80px;
        }

        .button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .decline { background-color: #ff3b30; }
        .accept { background-color: #4cd964; }

        .button svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        .pulse {
            animation: pulse-animation 1.5s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(76, 217, 100, 0.5); }
            100% { box-shadow: 0 0 0 30px rgba(76, 217, 100, 0); }
        }

        #status-text {
            display: none;
            font-size: 1.3rem;
            color: #4cd964;
            margin-bottom: 150px;
        }
    </style>
</head>
<body>

<div id="overlay" onclick="initCall()">
    <p></p>
</div>

<div class="phone-screen" id="main-screen">
    <div class="caller-info">
        <p>Bejövő hívás</p>
        <h1>Ismeretlen szám</h1>
        <p>Magyarország</p>
    </div>

    <div id="status-text">Hívás folyamatban...</div>

    <div class="controls" id="button-container">
        <button class="button decline" onclick="answerCall()">
            <svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z" transform="rotate(135 12 12)"/></svg>
        </button>
        
        <button class="button accept pulse" onclick="answerCall()">
            <svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>
        </button>
    </div>
</div>

<audio id="ringtone" src="media/chirptone.wav" loop></audio>
<audio id="audio1" src="media/audio1.mp3"></audio>

<script>
    const ringtone = document.getElementById('ringtone');
    const audio1 = document.getElementById('audio1');
    const targetUrl = " https://goo.gl/maps/RVNTKULSiVMahYHg9?g_st=ac"; // Ide írd az átirányítási címet

    // Amikor a felhasználó bárhova rákattint az üres oldalon
    function initCall() {
        // Láthatatlan réteg eltávolítása
        document.getElementById('overlay').style.display = 'none';
        // Hívóképernyő megjelenítése
        document.getElementById('main-screen').style.display = 'flex';
        // Csengőhang indítása
        ringtone.play().catch(e => console.log("Lejátszási hiba:", e));
    }

    function answerCall() {
        // Csengőhang leállítása
        ringtone.pause();
        ringtone.currentTime = 0;

        // Gombok elrejtése, állapotjelző mutatása
        document.getElementById('button-container').style.display = 'none';
        document.getElementById('status-text').style.display = 'block';

        // Audio 1 indítása
        audio1.play();

        // Ha vége az audiónak, átirányítás
        audio1.onended = function() {
            window.location.href = targetUrl;
        };
    }
</script>

</body>
</html>
