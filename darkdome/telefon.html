<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejövő hívás...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Mobil konténer szimuláció */
        .phone-screen {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: linear-gradient(to bottom, #2c3e50, #000000);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .caller-info h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .caller-info p {
            font-size: 1rem;
            color: #bdc3c7;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            justify-content: space-around;
            margin-bottom: 50px;
        }

        .button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .button:active {
            transform: scale(0.9);
        }

        .decline { background-color: #ff3b30; }
        .accept { background-color: #4cd964; }

        .button svg {
            width: 35px;
            height: 35px;
            fill: white;
        }

        /* Pulzáló effekt az elfogadás gombon */
        .pulse {
            animation: pulse-animation 1.5s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(76, 217, 100, 0.4); }
            100% { box-shadow: 0 0 0 20px rgba(76, 217, 100, 0); }
        }

        #status-text {
            margin-top: 20px;
            font-style: italic;
            color: #4cd964;
            display: none;
        }
    </style>
</head>
<body>

<div class="phone-screen">
    <div class="caller-info">
        <p>Bejövő hívás...</p>
        <h1 id="caller-name">Ismeretlen szám</h1>
        <p>Magyarország</p>
    </div>

    <div>
        <div id="status-text">Hívás tartásban...</div>
        <div class="controls">
            <button class="button decline" onclick="startSequence()">
                <svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z" transform="rotate(135 12 12)"/></svg>
            </button>
            
            <button class="button accept pulse" onclick="startSequence()">
                <svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>
            </button>
        </div>
    </div>
</div>

<audio id="audio1" src="audio1.mp3"></audio>
<audio id="audio2" src="audio2.mp3"></audio>

<script>
    function startSequence() {
        const audio1 = document.getElementById('audio1');
        const audio2 = document.getElementById('audio2');
        const statusText = document.getElementById('status-text');
        const targetUrl = "https://www.google.com"; // Ide írd a linket, ahová irányítson

        // Felület frissítése
        statusText.style.display = "block";
        statusText.innerText = "Hívás folyamatban...";
        document.querySelector('.controls').style.visibility = "hidden";

        // Első audio lejátszása
        audio1.play().catch(e => console.error("Lejátszási hiba:", e));

        // Amikor az első véget ér, indul a második
        audio1.onended = function() {
            audio2.play();
        };

        // Amikor a második is véget ér, átirányítás
        audio2.onended = function() {
            window.location.href = targetUrl;
        };
    }
</script>

</body>
</html>
