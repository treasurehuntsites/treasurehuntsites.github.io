<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Telefon Interaktív Kijelző</title>
    <style>
        :root {
            --phone-color: #e3d5b8;
            --shadow-color: #c5b89a;
            --display-bg: #9eb19e;
            --button-bg: #f5f0e1;
            --text-color: #333;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .phone-body {
            background-color: var(--phone-color);
            width: 320px;
            padding: 40px 30px;
            border-radius: 40px;
            box-shadow: 
                inset -10px -10px 20px var(--shadow-color),
                inset 10px 10px 20px #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .display-container {
            width: 180px;
            height: 60px;
            background-color: #bbb;
            margin-bottom: 30px;
            border-radius: 8px;
            padding: 5px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #lcd-screen {
            width: 100%;
            height: 100%;
            background-color: var(--display-bg);
            border-radius: 4px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            color: #2b332b;
            box-sizing: border-box;
            overflow: hidden;
            letter-spacing: 2px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background-color: rgba(0,0,0,0.05);
            padding: 20px;
            border-radius: 15px;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.1);
        }

        .key {
            width: 60px;
            height: 60px;
            background-color: var(--button-bg);
            border: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 4px 0 #b0a68e,
                0 5px 10px rgba(0,0,0,0.2);
            transition: all 0.1s;
            user-select: none;
        }

        .key:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #b0a68e;
        }

        .label-plate {
            margin-top: 30px;
            background-color: #fff;
            padding: 5px 20px;
            border: 2px solid #b0a68e;
            border-radius: 4px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            letter-spacing: 2px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="phone-body">
        <div class="display-container">
            <div id="lcd-screen"></div>
        </div>

        <div class="keypad">
            <button class="key" onclick="press('1')">1</button>
            <button class="key" onclick="press('2')">2</button>
            <button class="key" onclick="press('3')">3</button>
            
            <button class="key" onclick="press('4')">4</button>
            <button class="key" onclick="press('5')">5</button>
            <button class="key" onclick="press('6')">6</button>
            
            <button class="key" onclick="press('7')">7</button>
            <button class="key" onclick="press('8')">8</button>
            <button class="key" onclick="press('9')">9</button>
            
            <button class="key" onclick="press('*')">*</button>
            <button class="key" onclick="press('0')">0</button>
            <button class="key" onclick="press('#')">#</button>
        </div>

        <div class="label-plate">NEWNEWS</div>
    </div>

    <script>
        let currentNumber = "";
        const targetCode = "2682684";
        // Az új cél link beállítása
        const redirectUrl = "https://kalandmotor.com/?gameId=f61a9da6-b3db-4fb2-838e-34b9c7d6e9e8";
        const screen = document.getElementById('lcd-screen');
        let isLocked = false; 

        function press(num) {
            if (isLocked) return;

            currentNumber += num;
            screen.innerText = currentNumber;
            
            // 7 karakter után ellenőrzés
            if (currentNumber.length === 7) {
                checkCode();
            }
        }

        function checkCode() {
            isLocked = true; 

            if (currentNumber === targetCode) {
                // Helyes kód esetén átirányítás 1 másodperc után
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1000);
            } else {
                // Helytelen kód esetén DENIED kiírása, majd törlés
                screen.innerText = "DENIED";
                
                setTimeout(() => {
                    currentNumber = "";
                    screen.innerText = "";
                    isLocked = false; 
                }, 1500);
            }
        }
    </script>
</body>
</html>
