<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sötét PIN Pad - Egyedi Gombok</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            user-select: none;
            overflow: hidden;
        }

        .label {
            margin-bottom: 25px;
            color: #555;
            letter-spacing: 3px;
            font-size: 0.85em;
            text-align: center;
        }

        /* 3x3-as rács elrendezés - Mobilra optimalizálva */
        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: #1a1a1a;
            padding: 15px;
            border: 2px solid #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            width: 100%;
            max-width: 320px;
        }

        .key {
            aspect-ratio: 1 / 1;
            background: #222;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
            touch-action: manipulation;
        }

        /* Kép stílusa a gombon belül */
        .key img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none; /* Hogy ne akadályozza a kattintást */
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .key:active {
            border-color: #00ffcc;
            transform: scale(0.92);
        }

        .key:active img {
            opacity: 1;
            filter: brightness(1.2) drop-shadow(0 0 5px #00ffcc);
        }

        #status {
            margin-top: 30px;
            height: 20px;
            color: #00ffcc;
            font-size: 0.9em;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>
<body>

    <div class="label">ÍRD BE A HELYES KÓDOT</div>

    <div class="pin-pad" id="pad">
        <div class="key" onclick="pressKey(1)"><img src="1.png" alt="1"></div>
        <div class="key" onclick="pressKey(2)"><img src="2.png" alt="2"></div>
        <div class="key" onclick="pressKey(3)"><img src="3.png" alt="3"></div>
        <div class="key" onclick="pressKey(4)"><img src="4.png" alt="4"></div>
        <div class="key" onclick="pressKey(5)"><img src="5.png" alt="5"></div>
        <div class="key" onclick="pressKey(6)"><img src="6.png" alt="6"></div>
        <div class="key" onclick="pressKey(7)"><img src="7.png" alt="7"></div>
        <div class="key" onclick="pressKey(8)"><img src="8.png" alt="8"></div>
        <div class="key" onclick="pressKey(9)"><img src="9.png" alt="9"></div>
    </div>

    <div id="status"></div>

    <script>
        // Cél link az átirányításhoz
        const targetUrl = "https://treasurehuntsites.github.io/konyvmegallo/2/game.html";
        
        // A kért kód: 1. gomb, 3. gomb, 5. gomb, 7. gomb
        const correctSequence = [1, 3, 5, 7];
        let inputBuffer = [];

        function pressKey(num) {
            inputBuffer.push(num);
            
            // Ha mobilon játszanak, egy rövid rezgés visszajelzésnek
            if (navigator.vibrate) navigator.vibrate(20);

            // Csak akkor ellenőrizzük, ha beütöttünk 4 gombot
            if (inputBuffer.length === correctSequence.length) {
                const isCorrect = inputBuffer.every((val, index) => val === correctSequence[index]);
                
                if (isCorrect) {
                    document.getElementById('status').textContent = "HOZZÁFÉRÉS ELFOGADVA";
                    document.getElementById('pad').style.pointerEvents = 'none';
                    
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 1200);
                } else {
                    // Ha hibás, rezgés és puffer ürítése (visszajelzés nélkül, Dark Dome stílusban)
                    inputBuffer = [];
                    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
                }
            }
        }
    </script>
</body>
</html>
