<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Biztonsági Panel</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #loading {
            position: fixed;
            color: #444;
            font-family: sans-serif;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="loading">BETÖLTÉS...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, pinpad, raycaster, mouse;
        let buttons = [];
        let currentInput = "";
        let attempts = 0;
        const CORRECT_CODE = "618";
        
        let displaySlots = [];
        let digitTextures = {};
        let emptyTexture;
        let statusLight;

        function createDigitTexture(text, color = '#00ff00', bgColor = '#111111') {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, 128, 128);
            if (text !== null) {
                ctx.fillStyle = color;
                ctx.font = 'Bold 90px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 64, 64);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            document.getElementById('loading').remove();

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            emptyTexture = createDigitTexture(null);
            for(let i = 1; i <= 9; i++) {
                digitTextures[i] = createDigitTexture(i);
            }

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(5, 5, 10);
            pointLight.castShadow = true;
            scene.add(pointLight);

            createPinpad();

            window.addEventListener('resize', onWindowResize, false);
            // Pointer events használata a dupla bevitel (touch + mouse) elkerülésére
            window.addEventListener('pointerdown', onPointerDown, false);
            window.addEventListener('pointermove', onPointerMove, false);

            animate();
        }

        function createPinpad() {
            pinpad = new THREE.Group();

            const caseGeo = new THREE.BoxGeometry(6, 9, 1);
            const caseMat = new THREE.MeshPhongMaterial({ color: 0x222222, shininess: 100 });
            const caseMesh = new THREE.Mesh(caseGeo, caseMat);
            caseMesh.receiveShadow = true;
            pinpad.add(caseMesh);

            const screenGeo = new THREE.PlaneGeometry(4.5, 1.5);
            const screenMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
            const screen = new THREE.Mesh(screenGeo, screenMat);
            screen.position.set(0, 3.2, 0.51);
            pinpad.add(screen);

            const smallDotGeo = new THREE.CircleGeometry(0.08, 32);
            const smallDotMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const smallDot = new THREE.Mesh(smallDotGeo, smallDotMat);
            smallDot.position.set(0, -3.8, 0.52);
            pinpad.add(smallDot);

            const lightGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
            statusLight = new THREE.Mesh(lightGeo, lightMat);
            statusLight.position.set(1.9, 3.2, 0.55);
            pinpad.add(statusLight);

            for(let i = 0; i < 3; i++) {
                const slotGeo = new THREE.PlaneGeometry(0.8, 1);
                const slotMat = new THREE.MeshBasicMaterial({ map: emptyTexture });
                const slot = new THREE.Mesh(slotGeo, slotMat);
                slot.position.set(-1.0 + (i * 1.0), 3.2, 0.52);
                pinpad.add(slot);
                displaySlots.push(slot);
            }

            for (let i = 1; i <= 9; i++) {
                const btnGroup = new THREE.Group();
                const btnGeo = new THREE.BoxGeometry(1.2, 1.2, 0.4);
                const btnTexture = createDigitTexture(i, '#000000', '#eeeeee');

                const materials = [
                    new THREE.MeshPhongMaterial({ color: 0x444444 }),
                    new THREE.MeshPhongMaterial({ color: 0x444444 }),
                    new THREE.MeshPhongMaterial({ color: 0x444444 }),
                    new THREE.MeshPhongMaterial({ color: 0x444444 }),
                    new THREE.MeshPhongMaterial({ map: btnTexture }),
                    new THREE.MeshPhongMaterial({ color: 0x444444 })
                ];

                const btnMesh = new THREE.Mesh(btnGeo, materials);
                btnMesh.castShadow = true;
                btnMesh.userData = { id: i };
                
                const row = Math.floor((i-1) / 3);
                const col = (i-1) % 3;
                
                btnGroup.position.set(-1.6 + (col * 1.6), 1.2 - (row * 1.6), 0.5);
                btnGroup.add(btnMesh);
                pinpad.add(btnGroup);
                buttons.push(btnMesh);
            }

            scene.add(pinpad);
        }

        function handleKeyPress(btn) {
            const val = btn.userData.id;
            
            btn.position.z = -0.2;
            setTimeout(() => { btn.position.z = 0; }, 100);

            if (currentInput.length < 3) {
                currentInput += val;
                updateDisplay();

                if (currentInput.length === 3) {
                    setTimeout(validateCode, 500);
                }
            }
        }

        function updateDisplay() {
            displaySlots.forEach((slot, index) => {
                if (index < currentInput.length) {
                    const digit = currentInput[index];
                    slot.material.map = digitTextures[digit];
                } else {
                    slot.material.map = emptyTexture;
                }
                slot.material.needsUpdate = true;
            });
        }

        function validateCode() {
            if (currentInput === CORRECT_CODE) {
                statusLight.material.color.setHex(0x00ff00);
                setTimeout(() => {
                    const fadeOut = setInterval(() => {
                        renderer.domElement.style.opacity = parseFloat(renderer.domElement.style.opacity || 1) - 0.05;
                        if(renderer.domElement.style.opacity <= 0) {
                            clearInterval(fadeOut);
                            document.body.innerHTML = "";
                        }
                    }, 50);
                }, 1000);
            } else {
                attempts++;
                statusLight.material.color.setHex(0xff0000);
                
                const startPos = pinpad.position.x;
                let shakeCount = 0;
                const shakeInterval = setInterval(() => {
                    pinpad.position.x = startPos + (Math.random() - 0.5) * 0.3;
                    shakeCount++;
                    if(shakeCount > 10) {
                        clearInterval(shakeInterval);
                        pinpad.position.x = startPos;
                        resetInput();
                    }
                }, 30);
            }
        }

        function resetInput() {
            currentInput = "";
            updateDisplay();
            statusLight.material.color.setHex(0x333333);
            
            if (attempts >= 3) {
                attempts = 0;
                displaySlots.forEach(s => s.material.map = createDigitTexture("X", "#ff0000"));
                setTimeout(updateDisplay, 600);
            }
        }

        function onPointerMove(event) {
            const x = (event.clientX / window.innerWidth) * 2 - 1;
            const y = -(event.clientY / window.innerHeight) * 2 + 1;
            if(pinpad) {
                pinpad.rotation.y = THREE.MathUtils.lerp(pinpad.rotation.y, x * 0.15, 0.1);
                pinpad.rotation.x = THREE.MathUtils.lerp(pinpad.rotation.x, -y * 0.15, 0.1);
            }
        }

        function onPointerDown(event) {
            // Frissítjük az egér pozíciót a pointer eseményből
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(buttons);
            if (intersects.length > 0) {
                handleKeyPress(intersects[0].object);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
