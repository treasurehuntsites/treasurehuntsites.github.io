<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Biztonsági Panel</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }
        canvas {
            display: block;
            transition: opacity 0.1s linear;
        }
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 100;
        }
        /* CSS alapú papírcetli dizájn */
        #paper-note {
            display: none;
            width: 300px;
            height: 200px;
            background-color: #fdfae3;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 50px rgba(0,0,0,0.05);
            position: relative;
            transform: rotate(-2deg);
            pointer-events: auto;
            cursor: pointer;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: paperSpawn 0.3s ease-out forwards;
            /* Tépett szél effekt */
            clip-path: polygon(
                0% 2%, 5% 0%, 10% 3%, 15% 1%, 20% 4%, 25% 1%, 30% 5%, 35% 2%, 40% 6%, 45% 2%, 50% 5%, 55% 1%, 60% 4%, 65% 1%, 70% 3%, 75% 0%, 80% 4%, 85% 1%, 90% 5%, 95% 1%, 100% 4%,
                98% 10%, 100% 20%, 97% 30%, 100% 40%, 98% 50%, 100% 60%, 97% 70%, 100% 80%, 99% 90%, 100% 100%,
                95% 98%, 90% 100%, 85% 97%, 80% 100%, 75% 98%, 70% 100%, 65% 97%, 60% 100%, 55% 98%, 50% 100%, 45% 97%, 40% 100%, 35% 98%, 30% 100%, 25% 97%, 20% 100%, 15% 98%, 10% 100%, 5% 97%, 0% 100%,
                2% 90%, 0% 80%, 3% 70%, 1% 60%, 4% 50%, 1% 40%, 3% 30%, 0% 20%, 2% 10%
            );
        }
        #paper-note::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, transparent 70%, rgba(0,0,0,0.05) 100%);
            pointer-events: none;
        }
        #paper-text {
            font-family: 'Brush Script MT', 'Comic Sans MS', cursive;
            font-size: 32px;
            color: #1a1a1a;
            text-align: center;
            user-select: none;
        }
        @keyframes paperSpawn {
            from { opacity: 0; transform: scale(0.8) rotate(5deg); }
            to { opacity: 1; transform: scale(1) rotate(-2deg); }
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div id="paper-note" onclick="closeApp()">
            <div id="paper-text">Jelszó: LOOT</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, pinpad, raycaster, mouse;
        let buttons = [];
        let currentInput = "";
        let attempts = 0;
        let isProcessing = false;
        let isFullscreenTriggered = false;
        const CORRECT_CODE = "618";
        
        let displaySlots = [];
        let digitTextures = {};
        let emptyTexture;
        let statusLight;

        function createDigitTexture(text, color = '#00ff00', bgColor = '#111111') {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, 128, 128);
            if (text !== null) {
                ctx.fillStyle = color;
                ctx.font = 'Bold 90px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 64, 64);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function showPaperNote() {
            const paper = document.getElementById('paper-note');
            paper.style.display = 'flex';
        }

        function closeApp() {
            document.body.style.transition = "opacity 0.4s";
            document.body.style.opacity = "0";
            setTimeout(() => {
                // Megpróbáljuk bezárni az ablakot, ha nem lehet, csak kiürítjük
                document.body.innerHTML = "";
                window.close();
            }, 400);
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            emptyTexture = createDigitTexture(null);
            for(let i = 1; i <= 9; i++) {
                digitTextures[i] = createDigitTexture(i);
            }

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(5, 5, 10);
            pointLight.castShadow = true;
            scene.add(pointLight);

            createPinpad();

            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('pointerdown', onPointerDown, false);
            window.addEventListener('pointermove', onPointerMove, false);

            animate();
        }

        function createPinpad() {
            pinpad = new THREE.Group();

            const caseGeo = new THREE.BoxGeometry(6, 9, 1);
            const caseMat = new THREE.MeshPhongMaterial({ color: 0x222222, shininess: 100 });
            const caseMesh = new THREE.Mesh(caseGeo, caseMat);
            caseMesh.receiveShadow = true;
            pinpad.add(caseMesh);

            const screenGeo = new THREE.PlaneGeometry(4.5, 1.5);
            const screenMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
            const screen = new THREE.Mesh(screenGeo, screenMat);
            screen.position.set(0, 3.2, 0.51);
            pinpad.add(screen);

            // Fekete pont a 8-as gomb alatt
            const smallDotGeo = new THREE.CircleGeometry(0.08, 32);
            const smallDotMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const smallDot = new THREE.Mesh(smallDotGeo, smallDotMat);
            smallDot.position.set(0, -3.8, 0.52);
            pinpad.add(smallDot);

            const lightGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
            statusLight = new THREE.Mesh(lightGeo, lightMat);
            statusLight.position.set(1.9, 3.2, 0.55);
            pinpad.add(statusLight);

            for(let i = 0; i < 3; i++) {
                const slotGeo = new THREE.PlaneGeometry(0.8, 1);
                const slotMat = new THREE.MeshBasicMaterial({ map: emptyTexture });
                const slot = new THREE.Mesh(slotGeo, slotMat);
                slot.position.set(-1.0 + (i * 1.0), 3.2, 0.52);
                pinpad.add(slot);
                displaySlots.push(slot);
            }

            for (let i = 1; i <= 9; i++) {
                const btnGroup = new THREE.Group();
                const btnGeo = new THREE.BoxGeometry(1.2, 1.2, 0.4);
                const btnTexture = createDigitTexture(i, '#000000', '#eeeeee');

                const materials = [
                    new THREE.MeshPhongMaterial({ color: 0x444444 }),
                    new THREE.MeshPhongMaterial({ color: 0x444444 }),
                    new THREE.MeshPhongMaterial({ color: 0x444444 }),
                    new THREE.MeshPhongMaterial({ color: 0x444444 }),
                    new THREE.MeshPhongMaterial({ map: btnTexture }),
                    new THREE.MeshPhongMaterial({ color: 0x444444 })
                ];

                const btnMesh = new THREE.Mesh(btnGeo, materials);
                btnMesh.castShadow = true;
                btnMesh.userData = { id: i };
                
                const row = Math.floor((i-1) / 3);
                const col = (i-1) % 3;
                
                btnGroup.position.set(-1.6 + (col * 1.6), 1.2 - (row * 1.6), 0.5);
                btnGroup.add(btnMesh);
                pinpad.add(btnGroup);
                buttons.push(btnMesh);
            }

            scene.add(pinpad);
        }

        function handleKeyPress(btn) {
            // Teljes képernyő kérése az első interakciónál
            if (!isFullscreenTriggered) {
                const doc = window.document;
                const docEl = doc.documentElement;
                const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
                if (requestFullScreen) {
                    requestFullScreen.call(docEl).catch(e => console.log("Fullscreen error: ", e));
                }
                isFullscreenTriggered = true;
            }

            if(isProcessing) return;
            const val = btn.userData.id;
            
            btn.position.z = -0.2;
            setTimeout(() => { btn.position.z = 0; }, 100);

            if (currentInput.length < 3) {
                currentInput += val;
                updateDisplay();

                if (currentInput.length === 3) {
                    isProcessing = true;
                    setTimeout(validateCode, 200);
                }
            }
        }

        function updateDisplay() {
            displaySlots.forEach((slot, index) => {
                if (index < currentInput.length) {
                    const digit = currentInput[index];
                    slot.material.map = digitTextures[digit];
                } else {
                    slot.material.map = emptyTexture;
                }
                slot.material.needsUpdate = true;
            });
        }

        function validateCode() {
            if (currentInput === CORRECT_CODE) {
                statusLight.material.color.setHex(0x00ff00);
                // Azonnali eltüntetés
                renderer.domElement.style.opacity = '0';
                setTimeout(() => {
                    renderer.domElement.style.display = 'none';
                    showPaperNote();
                }, 100);
            } else {
                attempts++;
                statusLight.material.color.setHex(0xff0000);
                
                const startPos = pinpad.position.x;
                let shakeCount = 0;
                const shakeInterval = setInterval(() => {
                    pinpad.position.x = startPos + (Math.random() - 0.5) * 0.3;
                    shakeCount++;
                    if(shakeCount > 10) {
                        clearInterval(shakeInterval);
                        pinpad.position.x = startPos;
                        resetInput();
                    }
                }, 30);
            }
        }

        function resetInput() {
            currentInput = "";
            updateDisplay();
            statusLight.material.color.setHex(0x333333);
            isProcessing = false;
            
            if (attempts >= 3) {
                attempts = 0;
                const xTexture = createDigitTexture("X", "#ff0000");
                displaySlots.forEach(s => s.material.map = xTexture);
                setTimeout(updateDisplay, 600);
            }
        }

        function onPointerMove(event) {
            if(isProcessing) return;
            const x = (event.clientX / window.innerWidth) * 2 - 1;
            const y = -(event.clientY / window.innerHeight) * 2 + 1;
            if(pinpad) {
                pinpad.rotation.y = THREE.MathUtils.lerp(pinpad.rotation.y, x * 0.15, 0.1);
                pinpad.rotation.x = THREE.MathUtils.lerp(pinpad.rotation.x, -y * 0.15, 0.1);
            }
        }

        function onPointerDown(event) {
            if(isProcessing) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(buttons);
            if (intersects.length > 0) {
                handleKeyPress(intersects[0].object);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
