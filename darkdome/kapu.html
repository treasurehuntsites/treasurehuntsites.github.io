<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sötét PIN Pad - Szimbólumok</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0a0a0a;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            user-select: none;
            overflow: hidden;
        }

        .label {
            margin-bottom: 25px;
            color: #444;
            letter-spacing: 3px;
            font-size: 0.8em;
            text-align: center;
        }

        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: #141414;
            padding: 15px;
            border: 2px solid #222;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0,0,0,1);
            width: 100%;
            max-width: 320px;
        }

        .key {
            aspect-ratio: 1 / 1;
            background: #1d1d1d;
            border: 1px solid #333;
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            touch-action: manipulation;
        }

        .key:active {
            background: #222;
            border-color: #00ffcc;
            transform: scale(0.94);
        }

        canvas {
            width: 85%;
            height: 85%;
        }

        #status {
            margin-top: 25px;
            height: 20px;
            color: #00ffcc;
            font-size: 0.9em;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>
<body>

    <div class="label">ADD MEG A SZIMBÓLUM-KÓDOT</div>

    <div class="pin-pad" id="pad">
        <div class="key" onclick="pressKey(1)"><canvas id="k1"></canvas></div>
        <div class="key" onclick="pressKey(2)"><canvas id="k2"></canvas></div>
        <div class="key" onclick="pressKey(3)"><canvas id="k3"></canvas></div>
        <div class="key" onclick="pressKey(4)"><canvas id="k4"></canvas></div>
        <div class="key" onclick="pressKey(5)"><canvas id="k5"></canvas></div>
        <div class="key" onclick="pressKey(6)"><canvas id="k6"></canvas></div>
        <div class="key" onclick="pressKey(7)"><canvas id="k7"></canvas></div>
        <div class="key" onclick="pressKey(8)"><canvas id="k8"></canvas></div>
        <div class="key" onclick="pressKey(9)"><canvas id="k9"></canvas></div>
    </div>

    <div id="status"></div>

    <script>
        const targetUrl = "https://treasurehuntsites.github.io/konyvmegallo/2/game.html";
        const correctSequence = [1, 3, 5, 7];
        let inputBuffer = [];

        function drawSymbol(id) {
            const canvas = document.getElementById('k' + id);
            const ctx = canvas.getContext('2d');
            canvas.width = 100;
            canvas.height = 100;
            
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#00ffcc';

            ctx.beginPath();
            // A barna négyzeteken látható minták sziluettjeinek implementálása
            switch(id) {
                case 1: // Spirális törvonal (Fent-Jobbra-Le-Balra)
                    ctx.moveTo(20, 20); ctx.lineTo(80, 20); ctx.lineTo(80, 80); ctx.lineTo(40, 80); ctx.lineTo(40, 40); break;
                case 2: // Fordított 'Z' vagy villám-szerű
                    ctx.moveTo(80, 20); ctx.lineTo(20, 20); ctx.lineTo(80, 80); ctx.lineTo(20, 80); break;
                case 3: // 'C' alakzat belső töréssel
                    ctx.moveTo(80, 20); ctx.lineTo(20, 20); ctx.lineTo(20, 80); ctx.lineTo(80, 80); ctx.moveTo(40, 40); ctx.lineTo(40, 60); break;
                case 4: // Sakk-lépés vagy 'L' tükrözve
                    ctx.moveTo(20, 20); ctx.lineTo(20, 80); ctx.lineTo(80, 80); ctx.moveTo(20, 50); ctx.lineTo(50, 50); break;
                case 5: // Központi négyzet belső kereszttel
                    ctx.rect(30, 30, 40, 40); ctx.moveTo(50, 30); ctx.lineTo(50, 70); ctx.moveTo(30, 50); ctx.lineTo(70, 50); break;
                case 6: // Dupla 'U' vagy létra-fok
                    ctx.moveTo(20, 20); ctx.lineTo(20, 80); ctx.lineTo(40, 80); ctx.lineTo(40, 20); ctx.moveTo(60, 20); ctx.lineTo(60, 80); ctx.lineTo(80, 80); ctx.lineTo(80, 20); break;
                case 7: // Háromszög-ék belső vonallal
                    ctx.moveTo(50, 20); ctx.lineTo(80, 80); ctx.lineTo(20, 80); ctx.closePath(); ctx.moveTo(50, 40); ctx.lineTo(50, 80); break;
                case 8: // Fésű-szerű szimbólum
                    ctx.moveTo(20, 20); ctx.lineTo(20, 80); ctx.moveTo(20, 20); ctx.lineTo(80, 20); ctx.moveTo(20, 50); ctx.lineTo(70, 50); ctx.moveTo(20, 80); ctx.lineTo(80, 80); break;
                case 9: // Homokóra-szerű absztrakt
                    ctx.moveTo(20, 20); ctx.lineTo(80, 20); ctx.lineTo(20, 80); ctx.lineTo(80, 80); ctx.closePath(); break;
            }
            ctx.stroke();
        }

        function pressKey(num) {
            inputBuffer.push(num);
            if (navigator.vibrate) navigator.vibrate(20);

            if (inputBuffer.length === correctSequence.length) {
                const isCorrect = inputBuffer.every((val, index) => val === correctSequence[index]);
                if (isCorrect) {
                    document.getElementById('status').textContent = "MECHANIZMUS AKTIVÁLVA";
                    document.getElementById('pad').style.pointerEvents = 'none';
                    setTimeout(() => { window.location.href = targetUrl; }, 1000);
                } else {
                    inputBuffer = [];
                    // Dark Dome stílusú néma hiba (csak rezgés ha elrontja)
                    if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
                }
            }
        }

        window.onload = () => { for(let i=1; i<=9; i++) drawSymbol(i); };
    </script>
</body>
</html>
