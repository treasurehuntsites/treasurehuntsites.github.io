<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szabadulószoba - Képfeladvány</title>
    <style>
        /* Alapvető szabadulószoba atmoszféra: sötét, rejtélyes */
        body {
            background-color: #121212;
            color: #d4af37; /* Arany / pergamen szín a szövegnek */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            margin-bottom: 10px;
        }

        p.instructions {
            text-align: center;
            max-width: 600px;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #a0a0a0;
        }

        /* A játéktábla reszponzív rács elrendezése */
        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 100%;
            max-width: 500px; /* Maximális méret asztali gépen */
            aspect-ratio: 1 / 1; /* Mindig négyzet alakú */
            gap: 2px;
            background-color: #2a2a2a;
            border: 4px solid #4a3b22;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.2);
            padding: 4px;
            position: relative;
        }

        /* Az egyes képrészletek (csempék) stílusa */
        .tile {
            width: 100%;
            height: 100%;
            cursor: pointer;
            background-image: url('https://cdn.imgchest.com/files/ccb8c79a335e.jpg');
            background-size: 400% 400%; /* Mivel 4x4 a rács, a kép 4x akkora kell legyen a csempén belül */
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
            box-sizing: border-box;
        }

        .tile:hover {
            filter: brightness(1.2);
        }

        /* Kijelölt állapot stílusa cseréhez */
        .tile.selected {
            outline: 3px solid #ff4500;
            outline-offset: -3px;
            transform: scale(0.95);
            box-shadow: inset 0 0 15px rgba(255, 69, 0, 0.8);
            z-index: 10;
        }

        /* Győzelmi üzenet elrejtve alapból */
        #success-message {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: rgba(30, 25, 10, 0.9);
            border: 2px solid #d4af37;
            text-align: center;
            border-radius: 8px;
            animation: fadeIn 1.5s ease-in-out;
            max-width: 500px;
        }

        #success-message h2 {
            margin: 0 0 10px 0;
            color: #4CAF50;
            text-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Gomb stílus (pl. újrakezdéshez) */
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4a3b22;
            color: #d4af37;
            border: 1px solid #d4af37;
            font-family: inherit;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #d4af37;
            color: #121212;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

    </style>
</head>
<body>

    <h1>A Rejtélyes Festmény</h1>
    <p class="instructions">A kijáratot egy ősi mechanizmus védi. Válaszd ki az első képrészletet, majd egy másikat, hogy megcseréld őket. Állítsd helyre az eredeti képet a zár kinyitásához!</p>

    <div id="game-board"></div>

    <div id="success-message">
        <h2>*KATT*</h2>
        <p>A mechanizmus a helyére ugrott. A rejtett ajtó feltárult előtted!</p>
        <button onclick="initGame()">Zár Visszaállítása (Új játék)</button>
    </div>

    <script>
        // Moduláris felépítés a jövőbeli bővíthetőség és a meglévő kód védelme érdekében
        const board = document.getElementById('game-board');
        const successMessage = document.getElementById('success-message');
        const GRID_SIZE = 4; // 4x4-es rács
        const TOTAL_TILES = GRID_SIZE * GRID_SIZE; // 16 csempe

        let tiles = []; // A jelenlegi csempék sorrendjét tárolja (az index mutatja a helyet, az érték a kép eredeti id-ját)
        let selectedTileIndex = null; // A cseréhez kiválasztott első csempe indexe
        let isGameWon = false;

        /**
         * Inicializálja a játékot: generálja a csempéket, megkeveri őket és lerendereli a táblát.
         * A moduláris felépítés miatt ez a rész nem sérül, ha később a kattintás logikát módosítjuk.
         */
        function initGame() {
            successMessage.style.display = 'none';
            isGameWon = false;
            selectedTileIndex = null;
            tiles = [];

            // Létrehozzuk a helyes sorrendet (0-tól 15-ig)
            for (let i = 0; i < TOTAL_TILES; i++) {
                tiles.push(i);
            }

            // Megkeverjük a tömböt, hogy a kép darabokban legyen
            shuffle(tiles);

            // Újrarajzoljuk a táblát
            renderBoard();
        }

        /**
         * Fisher-Yates keverési algoritmus.
         * Teljesen véletlenszerű sorrendet biztosít. (Cserélős feladványnál minden állapot megoldható).
         */
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        /**
         * Kiszámítja egy adott csempe helyes háttér-pozícióját az eredeti indexe alapján.
         * Százalékos értéket használ, így reszponzív marad a tábla.
         */
        function getBackgroundPosition(originalIndex) {
            const col = originalIndex % GRID_SIZE;
            const row = Math.floor(originalIndex / GRID_SIZE);
            
            // A background-position %-os számítása: (oszlop/sor / (grid méret - 1)) * 100
            const x = (col / (GRID_SIZE - 1)) * 100;
            const y = (row / (GRID_SIZE - 1)) * 100;

            return `${x}% ${y}%`;
        }

        /**
         * Felépíti a DOM elemeket a játéktáblán a 'tiles' tömb alapján.
         */
        function renderBoard() {
            board.innerHTML = ''; // Tábla ürítése
            
            tiles.forEach((originalIndex, currentIndex) => {
                const tileElement = document.createElement('div');
                tileElement.classList.add('tile');
                
                // Beállítjuk a háttérkép pozícióját aszerint, hogy ez a darab eredetileg hol volt
                tileElement.style.backgroundPosition = getBackgroundPosition(originalIndex);
                
                // Ha ez volt az elsőnek kiválasztott csempe (cserénél), jelöljük
                if (currentIndex === selectedTileIndex) {
                    tileElement.classList.add('selected');
                }

                // Kattintás eseménykezelő hozzáadása
                tileElement.addEventListener('click', () => handleTileClick(currentIndex));

                board.appendChild(tileElement);
            });
        }

        /**
         * Kezeli a felhasználói kattintásokat. 
         * Kijelöli az elsőt, és cserél a másodikkal.
         */
        function handleTileClick(index) {
            if (isGameWon) return; // Ha nyert, nincs több lépés

            if (selectedTileIndex === null) {
                // Első kattintás: csempe kijelölése
                selectedTileIndex = index;
                renderBoard(); // Újrarajzoljuk, hogy a '.selected' stílus megjelenjen
            } else {
                // Második kattintás:
                if (selectedTileIndex === index) {
                    // Ha ugyanarra kattintott újra, vonjuk vissza a kijelölést
                    selectedTileIndex = null;
                    renderBoard();
                } else {
                    // Cseréljük meg a két csempét a tömbben
                    const temp = tiles[selectedTileIndex];
                    tiles[selectedTileIndex] = tiles[index];
                    tiles[index] = temp;

                    // Kijelölés törlése
                    selectedTileIndex = null;
                    
                    // Frissítjük a nézetet
                    renderBoard();
                    
                    // Ellenőrizzük, hogy kirakta-e a képet
                    checkWin();
                }
            }
        }

        /**
         * Ellenőrzi a győzelmi feltételt: a 'tiles' tömb elemei sorrendben vannak-e (0, 1, 2... 15).
         * Mivel ez a függvény független, könnyen bővíthető pl. egy "Ajtónyitó" animáció hívásával.
         */
        function checkWin() {
            let won = true;
            for (let i = 0; i < TOTAL_TILES; i++) {
                if (tiles[i] !== i) {
                    won = false;
                    break;
                }
            }

            if (won) {
                isGameWon = true;
                setTimeout(() => {
                    successMessage.style.display = 'block';
                    // Extra vizuális visszajelzés a táblán
                    board.style.borderColor = '#4CAF50';
                    board.style.boxShadow = '0 0 30px rgba(76, 175, 80, 0.8)';
                }, 300); // Kis késleltetés a drámai hatás kedvéért
            }
        }

        // Játék indítása az oldal betöltésekor
        initGame();

    </script>
</body>
</html>
