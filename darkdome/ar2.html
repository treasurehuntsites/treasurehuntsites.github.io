<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saját AR Célpont Felismerő - Fix URL</title>
    
    <!-- A-Frame és MindAR könyvtárak -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        html, body { width: 100vw; height: 100vh; margin: 0; padding: 0; overflow: hidden; background: #0f172a; color: white; }
        #ar-render-container { position: absolute; inset: 0; z-index: 10; display: none; width: 100vw; height: 100vh; }
        
        .ui-card { background: rgba(30, 41, 59, 0.7); border: 2px solid rgba(71, 85, 105, 0.5); border-radius: 1rem; padding: 1.5rem; transition: all 0.3s; }
        .ui-card.active { border-color: #6366f1; background: rgba(79, 70, 229, 0.1); }

        /* Kamera videó védelem */
        video { 
            position: absolute !important; top: 0 !important; left: 0 !important; 
            width: 100vw !important; height: 100vh !important; 
            object-fit: cover !important; z-index: 1 !important; 
        }
        .a-canvas { 
            position: absolute !important; top: 0 !important; left: 0 !important; 
            width: 100vw !important; height: 100vh !important; z-index: 2 !important; 
        }
        
        /* Scanner keret */
        .scanner-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 300px; aspect-ratio: 1;
            border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
            z-index: 105; pointer-events: none; transition: opacity 0.3s;
        }
        .corner { position: absolute; width: 30px; height: 30px; border-color: #10b981; border-style: solid; }
        .top-left { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 10px; }
        .top-right { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 10px;}
        .bottom-left { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 10px;}
        .bottom-right { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 10px;}
        
        .silhouette {
            position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px);
            object-fit: contain; opacity: 0.25;
            filter: grayscale(100%) contrast(150%) drop-shadow(0 0 5px rgba(16, 185, 129, 0.3));
            z-index: -1;
        }
    </style>
</head>
<body>

    <!-- BEÁLLÍTÁSI FELÜLET -->
    <div id="setup-ui" class="fixed inset-0 z-[100] flex flex-col items-center justify-center p-6 bg-slate-900 overflow-y-auto">
        <div class="max-w-md w-full text-center">
            <h1 class="text-4xl font-black mb-2 text-indigo-400 tracking-tight">AR GENERÁTOR</h1>
            <p class="text-slate-400 mb-8 text-sm">Add meg a képek URL-jét!</p>

            <div class="space-y-6">
                <!-- 1. URL: MARKER -->
                <div id="card-1" class="ui-card flex flex-col items-center">
                    <span class="bg-indigo-600 text-[10px] font-bold px-3 py-1 rounded-full mb-3 uppercase tracking-wider">1. Célpont Kép URL</span>
                    <input type="url" id="marker-url-input" placeholder="https://..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:border-indigo-500 outline-none mb-3">
                    <img id="marker-preview" crossorigin="anonymous" class="h-20 w-20 object-cover rounded-lg border-2 border-indigo-500/30 hidden">
                </div>

                <!-- 2. URL: OVERLAY -->
                <div id="card-2" class="ui-card flex flex-col items-center">
                    <span class="bg-emerald-600 text-[10px] font-bold px-3 py-1 rounded-full mb-3 uppercase tracking-wider">2. Megjelenő Kép URL</span>
                    <input type="url" id="overlay-url-input" placeholder="https://..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:border-emerald-500 outline-none mb-3">
                    <img id="overlay-preview" crossorigin="anonymous" class="h-20 w-20 object-contain rounded-lg border-2 border-emerald-500/30 bg-black/50 hidden">
                </div>
            </div>

            <button id="start-btn" disabled class="mt-10 w-full bg-indigo-600 disabled:bg-slate-800 disabled:text-slate-600 text-white font-bold py-4 px-8 rounded-2xl shadow-2xl transition-all active:scale-95 text-lg">
                Várom az URL-eket...
            </button>
            
            <p id="status-msg" class="mt-4 text-[11px] text-slate-400 uppercase tracking-widest font-bold">Rendszer indul...</p>
        </div>
    </div>

    <!-- HUD & Scanner UI -->
    <div id="ar-hud" class="hidden fixed top-8 left-0 right-0 z-[110] flex justify-center pointer-events-none">
        <div class="bg-slate-900/80 backdrop-blur-lg text-white px-6 py-3 rounded-2xl border border-white/10 text-sm font-bold shadow-2xl" id="hud-text">
            Kamera betöltése...
        </div>
    </div>

    <div id="scanner-ui" class="hidden">
        <div class="scanner-container" id="scanner-box">
            <div class="corner top-left"></div><div class="corner top-right"></div><div class="corner bottom-left"></div><div class="corner bottom-right"></div>
            <img id="target-silhouette" src="" alt="" class="silhouette">
        </div>
        <div class="fixed bottom-12 left-0 right-0 text-center z-[110] pointer-events-none px-6">
            <p id="hint-text" class="text-white bg-black/70 backdrop-blur px-4 py-3 rounded-xl text-xs inline-block border border-white/20">
                Keresés... <span class="text-slate-300 block mt-1 text-[10px]">Illeszd a tárgyat a körvonalba!</span>
            </p>
        </div>
    </div>

    <!-- Kamera feloldó gomb -->
    <div id="camera-overlay" class="hidden fixed inset-0 z-[120] bg-slate-900/95 flex flex-col items-center justify-center text-center p-6">
        <h2 class="text-2xl font-bold mb-4">Kamera blokkolva</h2>
        <button id="resume-btn" class="bg-emerald-600 text-white font-bold py-4 px-10 rounded-full shadow-lg">Indítás</button>
    </div>

    <div id="ar-render-container"></div>

    <script>
        const elements = {
            markerInput: document.getElementById('marker-url-input'),
            overlayInput: document.getElementById('overlay-url-input'),
            markerPreview: document.getElementById('marker-preview'),
            overlayPreview: document.getElementById('overlay-preview'),
            startBtn: document.getElementById('start-btn'),
            statusMsg: document.getElementById('status-msg'),
            setupUi: document.getElementById('setup-ui'),
            arHud: document.getElementById('ar-hud'),
            hudText: document.getElementById('hud-text'),
            scannerUi: document.getElementById('scanner-ui'),
            scannerBox: document.getElementById('scanner-box'),
            targetSilhouette: document.getElementById('target-silhouette'),
            hintText: document.getElementById('hint-text'),
            arContainer: document.getElementById('ar-render-container'),
            cameraOverlay: document.getElementById('camera-overlay'),
            resumeBtn: document.getElementById('resume-btn')
        };

        let state = {
            mindFileUrl: null,
            overlayImageUrl: null,
            overlayWidth: 1,
            overlayHeight: 1,
            isProcessing: false
        };

        // Könyvtár ellenőrzés
        function checkLibs() {
            if (window.MINDAR && window.MINDAR.IMAGE && window.MINDAR.IMAGE.Compiler) {
                elements.statusMsg.innerText = "Készen áll az adatokra";
                elements.startBtn.innerText = "Adj meg URL-eket";
            } else {
                setTimeout(checkLibs, 500);
            }
        }
        checkLibs();

        async function optimizeImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxDim = 800;
                    let w = img.width, h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                        else { w = Math.round(w * maxDim / h); h = maxDim; }
                    }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.onerror = () => reject("Kép betöltési hiba (CORS vagy érvénytelen URL)");
                img.src = url;
            });
        }

        elements.markerInput.addEventListener('blur', async () => {
            const url = elements.markerInput.value;
            if (!url || state.isProcessing) return;
            
            state.isProcessing = true;
            elements.statusMsg.innerText = "Célpont feldolgozása...";
            elements.startBtn.disabled = true;

            try {
                const optimizedDataUrl = await optimizeImage(url);
                elements.markerPreview.src = optimizedDataUrl;
                elements.markerPreview.classList.remove('hidden');

                const compiler = new window.MINDAR.IMAGE.Compiler();
                const img = new Image();
                img.src = optimizedDataUrl;
                await new Promise(r => img.onload = r);
                
                await compiler.compileImageTargets([img], (p) => {
                    elements.startBtn.innerText = `AI Tanítás: ${Math.round(p)}%`;
                });
                
                const buffer = await compiler.exportData();
                if (state.mindFileUrl) URL.revokeObjectURL(state.mindFileUrl);
                state.mindFileUrl = URL.createObjectURL(new Blob([buffer]));
                
                elements.statusMsg.innerText = "Célpont kész!";
                checkReady();
            } catch (e) {
                elements.statusMsg.innerText = "Hiba: " + e;
            } finally {
                state.isProcessing = false;
            }
        });

        elements.overlayInput.addEventListener('blur', () => {
            const url = elements.overlayInput.value;
            if (!url) return;
            
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                const aspect = img.width / img.height;
                if (aspect > 1) { state.overlayWidth = 1.2; state.overlayHeight = 1.2 / aspect; }
                else { state.overlayHeight = 1.2; state.overlayWidth = 1.2 * aspect; }
                
                state.overlayImageUrl = url;
                elements.overlayPreview.src = url;
                elements.overlayPreview.classList.remove('hidden');
                elements.statusMsg.innerText = "Megjelenő kép kész!";
                checkReady();
            };
            img.onerror = () => elements.statusMsg.innerText = "Hiba az overlay képnél.";
            img.src = url;
        });

        function checkReady() {
            if (state.mindFileUrl && state.overlayImageUrl) {
                elements.startBtn.disabled = false;
                elements.startBtn.innerText = "AR Kamera Indítása";
                elements.statusMsg.innerText = "Minden kész!";
            }
        }

        elements.startBtn.addEventListener('click', () => {
            elements.setupUi.style.display = 'none';
            elements.arHud.classList.remove('hidden');
            elements.scannerUi.classList.remove('hidden');
            elements.targetSilhouette.src = elements.markerPreview.src;
            elements.arContainer.style.display = 'block';

            const params = `imageTargetSrc: ${state.mindFileUrl}; autoStart: true; uiScanning: no; warmupTolerance: 2; missTolerance: 5; filterMinCF: 0.0001; filterBeta: 0.001;`;
            
            elements.arContainer.innerHTML = `
                <a-scene mindar-image="${params}" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false">
                    <a-assets><img id="ovl" src="${state.overlayImageUrl}" crossorigin="anonymous"></a-assets>
                    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                    <a-entity mindar-image-target="targetIndex: 0" id="target">
                        <a-image src="#ovl" width="${state.overlayWidth}" height="${state.overlayHeight}"
                                 animation="property: position; from: 0 0 0; to: 0 0.1 0.1; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine"></a-image>
                    </a-entity>
                </a-scene>
            `;

            setInterval(() => {
                const v = document.querySelector('video');
                if (v && (v.paused || v.ended)) {
                    elements.cameraOverlay.classList.remove('hidden');
                    elements.resumeBtn.onclick = () => { v.play(); elements.cameraOverlay.classList.add('hidden'); };
                }
            }, 500);

            setTimeout(() => {
                const t = document.getElementById('target');
                t.addEventListener('targetFound', () => {
                    elements.hudText.innerText = "Sikeres pozicionálás!";
                    elements.hudText.className = "bg-emerald-500 text-white px-6 py-3 rounded-2xl text-sm font-bold shadow-2xl";
                    elements.scannerBox.style.opacity = '0';
                });
                t.addEventListener('targetLost', () => {
                    elements.hudText.innerText = "Keresés...";
                    elements.hudText.className = "bg-slate-900/80 backdrop-blur text-white px-6 py-3 rounded-2xl text-sm font-bold shadow-2xl";
                    elements.scannerBox.style.opacity = '1';
                });
            }, 1000);
        });
    </script>
</body>
</html>
