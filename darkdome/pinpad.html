<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sötét PIN Pad - Kunyhó</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            user-select: none;
            overflow: hidden;
        }

        .label {
            margin-bottom: 30px;
            color: #444;
            letter-spacing: 3px;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        /* 3x3-as rács elrendezés */
        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #1a1a1a;
            padding: 20px;
            border: 2px solid #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            width: 100%;
            max-width: 320px;
        }

        .key {
            aspect-ratio: 1 / 1;
            background: #222;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            touch-action: manipulation;
        }

        .key:active {
            background: #333;
            border-color: #00ffcc;
            transform: scale(0.92);
        }

        canvas {
            width: 80%;
            height: 80%;
        }

        #status {
            margin-top: 30px;
            height: 20px;
            color: #00ffcc;
            font-size: 0.9em;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00ffcc;
        }
    </style>
</head>
<body>

    <div class="label">Írd be a szimbólum-kódot</div>

    <div class="pin-pad" id="pad">
        <div class="key" onclick="pressKey(1)"><canvas id="k1"></canvas></div>
        <div class="key" onclick="pressKey(2)"><canvas id="k2"></canvas></div>
        <div class="key" onclick="pressKey(3)"><canvas id="k3"></canvas></div>
        <div class="key" onclick="pressKey(4)"><canvas id="k4"></canvas></div>
        <div class="key" onclick="pressKey(5)"><canvas id="k5"></canvas></div>
        <div class="key" onclick="pressKey(6)"><canvas id="k6"></canvas></div>
        <div class="key" onclick="pressKey(7)"><canvas id="k7"></canvas></div>
        <div class="key" onclick="pressKey(8)"><canvas id="k8"></canvas></div>
        <div class="key" onclick="pressKey(9)"><canvas id="k9"></canvas></div>
    </div>

    <div id="status"></div>

    <script>
        const targetUrl = "https://treasurehuntsites.github.io/konyvmegallo/2/game.html";
        
        // A kért kód: 1, 3, 5, 7
        const correctSequence = [1, 3, 5, 7];
        let inputBuffer = [];

        function drawSymbol(id, type) {
            const canvas = document.getElementById('k' + id);
            const ctx = canvas.getContext('2d');
            canvas.width = 100;
            canvas.height = 100;
            
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffcc';

            ctx.beginPath();
            switch(type) {
                case 1: // Spirál-szerű
                    ctx.moveTo(20,20); ctx.lineTo(80,20); ctx.lineTo(80,80); ctx.lineTo(40,80); ctx.lineTo(40,40); break;
                case 2: // Átlós kereszt
                    ctx.moveTo(25,25); ctx.lineTo(75,75); ctx.moveTo(75,25); ctx.lineTo(25,75); break;
                case 3: // Szögletes szem
                    ctx.rect(20,35,60,30); ctx.moveTo(50,35); ctx.lineTo(50,65); break;
                case 4: // Háromszög
                    ctx.moveTo(50,20); ctx.lineTo(80,80); ctx.lineTo(20,80); ctx.closePath(); break;
                case 5: // Kör közepén pont
                    ctx.arc(50,50,30,0,Math.PI*2); ctx.moveTo(53,50); ctx.arc(50,50,2,0,Math.PI*2); break;
                case 6: // L-alakzat ponttal
                    ctx.moveTo(30,20); ctx.lineTo(30,80); ctx.lineTo(80,80); ctx.moveTo(70,30); ctx.arc(70,30,2,0,Math.PI*2); break;
                case 7: // Kereszt
                    ctx.moveTo(20,50); ctx.lineTo(80,50); ctx.moveTo(50,20); ctx.lineTo(50,80); break;
                case 8: // Rombusz
                    ctx.moveTo(50,20); ctx.lineTo(80,50); ctx.lineTo(50,80); ctx.lineTo(20,50); ctx.closePath(); break;
                case 9: // Három párhuzamos vonal
                    ctx.moveTo(30,25); ctx.lineTo(30,75); ctx.moveTo(50,25); ctx.lineTo(50,75); ctx.moveTo(70,25); ctx.lineTo(70,75); break;
            }
            ctx.stroke();
        }

        function pressKey(num) {
            inputBuffer.push(num);
            
            // Csak akkor ellenőrizzük, ha elértük a 4 hosszt
            if (inputBuffer.length === correctSequence.length) {
                const isCorrect = inputBuffer.every((val, index) => val === correctSequence[index]);
                
                if (isCorrect) {
                    document.getElementById('status').textContent = "HOZZÁFÉRÉS MEGADVA";
                    document.getElementById('pad').style.pointerEvents = 'none';
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 1000);
                } else {
                    // Csendes hiba, mint a Dark Dome-ban
                    inputBuffer = [];
                    // Egy pillanatra pirosas villanás a gombokon (opcionális)
                    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
                }
            }
        }

        // Minden gomb kirajzolása betöltéskor
        window.onload = () => {
            for(let i=1; i<=9; i++) drawSymbol(i, i);
        };
    </script>
</body>
</html>
