<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Szimbólum Tárcsás Zár - Kunyhó</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
            overflow: hidden;
        }

        .label {
            margin-bottom: 25px;
            color: #555;
            letter-spacing: 2px;
            font-size: 0.8em;
            text-align: center;
            max-width: 300px;
        }

        /* Középre rendezett, rugalmas konténer */
        .lock-container {
            background: #1a1a1a;
            padding: 35px 15px;
            border: 3px solid #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0,0,0,1), inset 0 0 20px rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 360px; /* Biztosítja, hogy beférjen mobilon */
        }

        .dial {
            flex: 1; /* Egyenlő szélességű tárcsák */
            max-width: 75px;
            height: 100px;
            background: linear-gradient(to bottom, #0a0a0a, #262626, #0a0a0a);
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, border-color 0.3s;
        }

        .dial:active { transform: scale(0.94); }

        canvas {
            width: 90%;
            height: auto;
            max-width: 50px;
        }

        #status {
            margin-top: 30px;
            height: 24px;
            color: #00ffcc;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="label">KERESD MEG A KINYERT JELEKET</div>

    <div class="lock-container">
        <div class="dial" onclick="rotateDial(0)"><canvas id="c0"></canvas></div>
        <div class="dial" onclick="rotateDial(1)"><canvas id="c1"></canvas></div>
        <div class="dial" onclick="rotateDial(2)"><canvas id="c2"></canvas></div>
        <div class="dial" onclick="rotateDial(3)"><canvas id="c3"></canvas></div>
    </div>

    <div id="status"></div>

    <script>
        const targetUrl = "https://treasurehuntsites.github.io/konyvmegallo/2/game.html";

        // 7 szimbólumunk van összesen
        // 0-3: A helyesek, 4-6: A "zaj" (nehezítés)
        let currentState = [4, 6, 5, 4]; 
        const solution = [0, 1, 2, 3]; 

        function drawSymbol(ctx, type) {
            ctx.clearRect(0, 0, 100, 100);
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00ffcc';

            ctx.beginPath();
            switch(type) {
                case 0: // Spirál
                    ctx.moveTo(20, 20); ctx.lineTo(80, 20); ctx.lineTo(80, 80); ctx.lineTo(40, 80); ctx.lineTo(40, 40); break;
                case 1: // Szem
                    ctx.rect(20, 30, 60, 40); ctx.moveTo(50, 35); ctx.lineTo(50, 65); break;
                case 2: // Háromszög
                    ctx.moveTo(50, 15); ctx.lineTo(85, 85); ctx.lineTo(15, 85); ctx.closePath(); break;
                case 3: // Kereszt
                    ctx.moveTo(25, 50); ctx.lineTo(75, 50); ctx.moveTo(50, 25); ctx.lineTo(50, 75); break;
                case 4: // ÚJ: Négyzet (Zaj)
                    ctx.rect(25, 25, 50, 50); break;
                case 5: // ÚJ: Fordított V (Zaj)
                    ctx.moveTo(20, 80); ctx.lineTo(50, 20); ctx.lineTo(80, 80); break;
                case 6: // ÚJ: Körív pöttyel (Zaj)
                    ctx.arc(50, 50, 30, 0, Math.PI * 1.5); ctx.moveTo(50, 50); ctx.arc(50, 50, 2, 0, Math.PI * 2); break;
            }
            ctx.stroke();
        }

        function updateAllDials() {
            for(let i = 0; i < 4; i++) {
                const canvas = document.getElementById('c' + i);
                const ctx = canvas.getContext('2d');
                canvas.width = 100;
                canvas.height = 100;
                drawSymbol(ctx, currentState[i]);
            }
            checkSolution();
        }

        function rotateDial(index) {
            currentState[index] = (currentState[index] + 1) % 7; // 7 szimbólumon pörög körbe
            updateAllDials();
            if (navigator.vibrate) navigator.vibrate(15);
        }

        function checkSolution() {
            const isSolved = currentState.every((val, index) => val === solution[index]);
            if (isSolved) {
                document.getElementById('status').textContent = "MECHANIZMUS KIOLDVA";
                document.querySelectorAll('.dial').forEach(d => d.style.pointerEvents = 'none');
                setTimeout(() => { window.location.href = targetUrl; }, 1200);
            }
        }

        window.onload = updateAllDials;
    </script>
</body>
</html>
