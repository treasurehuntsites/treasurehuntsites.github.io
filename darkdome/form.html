<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visszajelzés - Titkos Küldetés</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Play', sans-serif; 
            background-color: #1a1a1a; /* Megegyezik a játék hátterével */
            color: #e0e0e0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .glass-card { 
            background: #2c2c2c; 
            border: 2px solid #8a2be2; 
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.5);
            width: 100%;
            max-width: 700px;
            margin: 20px;
            border-radius: 1rem;
            overflow: hidden;
        }
        .neon-title {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        /* Tally konténer simítása */
        .tally-container {
            width: 100%;
            background: transparent;
        }
        iframe {
            display: block;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="p-6 text-center border-b border-purple-900/50">
            <h1 class="text-2xl font-bold neon-title">Küldetés Jelentés</h1>
            <p class="text-gray-400 text-sm mt-2 italic">Csatolj bizonyítékot és értékeld a műveletet!</p>
        </div>
        
        <div class="tally-container">
            <iframe 
                src="https://tally.so/r/dWNXYd?hideTitle=1&transparentBackground=1" 
                width="100%" 
                height="600" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0" 
                title="Visszajelzés">
            </iframe>
        </div>

        <div class="p-4 bg-[#232323] text-center">
            <a href="game.html" class="inline-block px-8 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-full transition-all shadow-lg active:scale-95">
                VISSZA A JÁTÉKHOZ
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>
</html>
