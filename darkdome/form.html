<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visszajelzés - Titkos Küldetés</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Play', sans-serif; 
            background-color: #1a1a1a; 
            color: #e0e0e0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Enyhe neon ragyogás a háttérben */
            background: radial-gradient(circle at center, #251b33 0%, #1a1a1a 100%);
        }
        .glass-card { 
            background: #2c2c2c; 
            border: 2px solid #8a2be2; 
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.6);
            width: 100%;
            max-width: 650px;
            margin: 15px;
            border-radius: 1.5rem;
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .neon-title {
            color: #00ffff;
            text-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
            letter-spacing: 3px;
        }
        .tally-wrapper {
            position: relative;
            width: 100%;
            /* A Tally űrlap magasságához igazítva */
            height: 650px; 
            background: transparent;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="p-6 text-center border-b border-purple-900/40 bg-[#242424]">
            <h1 class="text-2xl font-bold neon-title uppercase">Küldetés Jelentés</h1>
            <p class="text-gray-400 text-sm mt-1 italic">Töltsd fel a bizonyítékot az adatbázisba!</p>
        </div>
        
        <div class="tally-wrapper">
            <iframe 
                src="https://tally.so/embed/dWNXYd?hideTitle=1&transparentBackground=1&dynamicHeight=1" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0" 
                title="Játék visszajelzés">
            </iframe>
        </div>

        <div class="p-5 bg-[#1f1f1f] flex justify-center border-t border-purple-900/20">
            <a href="game.html" class="px-10 py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-full transition-all hover:scale-105 active:scale-95 shadow-[0_0_15px_rgba(138,43,226,0.4)]">
                VISSZA A JÁTÉKHOZ
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>
</html>
