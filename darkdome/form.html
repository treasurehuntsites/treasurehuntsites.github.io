<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Játék Értékelés - Titkos Küldetés</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Play', sans-serif; 
            background-color: #1a1a1a; 
            color: #e0e0e0;
            background-image: radial-gradient(circle at center, #2c2c2c 0%, #1a1a1a 100%);
        }
        .glass-card { 
            background: rgba(44, 44, 44, 0.8); 
            border: 2px solid #8a2be2; 
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
            backdrop-filter: blur(10px);
        }
        .neon-text { color: #00ffff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
        .form-input {
            background-color: #3f3f46;
            border: 1px solid #6b7280;
            color: white;
            transition: all 0.3s;
        }
        .form-input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            outline: none;
        }
        iframe {
            width: 100%;
            height: 700px;
            border: none;
            border-radius: 8px;
            filter: invert(90%) hue-rotate(180deg) brightness(1.1); /* Ez "sötétíti" be a fehér Google Formot */
        }
    </style>
</head>
<body class="p-4 min-h-screen flex flex-col items-center">

    <div class="max-w-2xl w-full glass-card p-6 rounded-2xl mt-8">
        <h1 class="text-3xl font-bold mb-2 neon-text text-center uppercase tracking-widest">Küldetés Értékelése</h1>
        <p class="text-gray-400 text-center mb-6 italic">Oszd meg velünk a tapasztalataidat, ügynök!</p>
        
        <div class="rounded-lg overflow-hidden border border-gray-700">
            <iframe src="https://forms.gle/gEyYH5qYH6yE1r6Y9?embedded=true">
                Betöltés...
            </iframe>
        </div>

        <div class="mt-6 flex justify-center">
            <a href="game.html" class="px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-full transition-all shadow-lg">
                <i class="fas fa-arrow-left mr-2"></i> Vissza a játékhoz
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>
</html>
