<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <!-- TÁJOLÁS ZÁR: Ideiglenesen kikapcsolva az előnézet miatt -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title>Titkok kora - Az omladozó ház</title>
    
    <!-- GPS és Ikonok -->
    <meta http-equiv="Permissions-Policy" content="geolocation=*">
    <link rel="icon" type="image/png" href="Img/ikon.png">
    <link rel="apple-touch-icon" href="Img/ikon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" xintegrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* --- Zoomolás és Görgetés Letiltása (A távolságmodal miatt) --- */
        html, body.modal-open {
            overflow: hidden;
            height: 100%;
            touch-action: none;
        }

        /* Alapvető reszet és sötét háttér */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Play', sans-serif;
            color: #e0e0e0; 
            background-color: #1a1a1a; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding-bottom: 60px; 
            
            /* FOUC (szöveg előzetes megjelenése) ellen */
            visibility: hidden; 
            opacity: 0;
            transition: opacity 0.5s ease-in-out; 
        }
        
        /* Teljes szélességű KÉP (Háttér) */
        .full-width-image-container {
            width: 100%;
            height: 100vh; 
            overflow: hidden;
            position: fixed; 
            top: 0;
            left: 0;
            z-index: 0; 
        }

        .full-width-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            object-position: center top; 
        }

        /* Tartalom doboz - FIX ALULRA ZÁRVA */
        .content-box {
            background-color: rgba(0, 0, 0, 0.7); 
            padding: 40px; 
            margin: 0; 
            border-radius: 10px 10px 0 0; 
            max-width: 800px;
            width: calc(100% - 20px);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.7);
            border: 3px solid #8a2be2;
            box-sizing: border-box;
            position: fixed; 
            bottom: 50px; 
            left: 50%;
            transform: translateX(-50%); 
            z-index: 10;
            text-align: left;
            min-height: 250px; 
            display: flex; 
            flex-direction: column;
            justify-content: space-between; 
            opacity: 1; 
            transition: none;
        }

        /* Történet szövege */
        #story-text-display {
            font-size: 1.3em;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap; 
        }
        
        /* Audio gombok... */
        .audio-container {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .audio-button {
            padding: 12px 20px; 
            text-decoration: none;
            color: #1a1a1a;
            background-color: #00FFFF; 
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .audio-button:hover {
            background-color: #00DDEE;
        }

        /* --- ALSÓ INTERAKCIÓS SÁV (a történet gombjai) --- */
        .bottom-bar {
            padding-top: 10px;
            border-top: 1px dashed #8a2be2;
            min-height: 48px;
            width: 100%;
        }

        .interaction-container {
            display: flex;
            /* Flex-grow-val kezelt Vissza gomb */
            justify-content: space-between; 
            align-items: center;
            width: 100%;
        }

        .page-button {
            padding: 12px 20px; 
            text-decoration: none;
            color: #ffffff;
            background-color: #8a2be2;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(138, 43, 226, 0.4);
            /* A Folytatás gomb legyen teljes szélességű az index 4-nél */
            margin: 5px;
        }
        
        .page-button#next-page-button.full-width {
            width: 100%;
            flex-grow: 1; /* Biztosítja a teljes szélességet */
            margin-left: 0;
            margin-right: 0;
        }
        
        .page-button:hover:not(:disabled) {
            background-color: #7b1cd1;
            transform: translateY(-1px);
        }

        .page-button:disabled {
            background-color: #555555;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.6;
        }
        
        /* Több gomb konténer - ÚJ a két választáshoz */
        .multi-choice-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            padding: 0;
            margin: 0;
        }
        
        /* ÚJ: Diszkrét Vissza Gomb - CSAK CHOICE ESETEKBEN */
        .discreet-back-button {
            position: absolute;
            top: 5px; /* Belülről fentről */
            left: 10px; /* Belülről balról */
            z-index: 30; 
            background-color: rgba(138, 43, 226, 0.5); /* Félátlátszó lila */
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 50%; /* Kör alakú gomb */
            width: 40px;
            height: 40px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none; 
            transition: background-color 0.2s;
            text-transform: none;
            margin: 0;
            border: none;
        }

        .discreet-back-button:hover:not(:disabled) {
            background-color: rgba(138, 43, 226, 0.8);
            transform: none; 
        }
        .discreet-back-button:disabled {
             background-color: rgba(90, 90, 90, 0.5);
             opacity: 0.5;
             cursor: not-allowed;
        }


        /* Jelszó konténer */
        #password-container {
            display: none;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            text-align: center;
        }

        #password-container.visible {
            display: flex;
        }
        
        #password-input {
            padding: 12px;
            border: 2px solid #8a2be2;
            border-radius: 5px;
            background-color: #2c2c2c;
            color: #00ffff;
            font-size: 1.2em;
            text-align: center;
            font-family: 'Play', sans-serif;
            margin-bottom: 5px; 
        }

        /* A "Add meg a kódot" sor flexbe igazítva a kérdőjellel */
        #password-container p {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .password-interaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        #check-password-button, #back-button-password {
            padding: 12px 20px; 
            font-size: 1.1em; 
        }
        
        #back-button-password {
            color: #ffffff;
            background-color: #8a2be2; 
        }
        
        #check-password-button {
            color: #ffffff;
            background-color: #00ffff;
            box-shadow: 0 4px 10px rgba(0, 255, 255, 0.4); 
            flex-grow: 1; 
        }
        
        #check-password-button:hover {
            background-color: #00ddee;
            transform: translateY(-1px); 
        }

        #message {
            margin-top: 10px;
            font-weight: 700;
            color: #ff4500;
        }

        /* Avatar kép */
        .avatar-image {
            position: absolute;
            top: -50px; 
            left: -10px; 
            width: 70px; 
            height: 70px; 
            border-radius: 50%; 
            object-fit: cover; 
            z-index: 20; 
            display: block; 
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.5); 
            transition: opacity 0.3s ease-in-out; 
        }
        
        /* --- FIX ALSÓ MENÜSOR --- */
        .fixed-menu-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #1a1a1a;
            border-top: 2px solid #8a2be2;
            z-index: 50; 
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 15px rgba(138, 43, 226, 0.5);
        }

        .menu-button {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5em;
            cursor: pointer;
            padding: 5px 10px;
            transition: color 0.3s;
        }

        .menu-button:hover {
            color: #00ffff;
        }

        /* --- GALÉRIA MODAL STÍLUSOK (1935.html) --- */
        #galleryModal {
            display: none; 
            position: fixed;
            z-index: 100; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow-y: scroll; 
            background-color: rgba(0, 0, 0, 0.95);
        }
        
        #gallery-container {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 10px;
            padding: 15px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .gallery-thumbnail {
            width: 100%;
            height: 150px; 
            overflow: hidden;
            border: 2px solid #8a2be2;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.4);
            transition: transform 0.2s;
        }

        .gallery-thumbnail:hover {
            transform: scale(1.03);
        }

        .gallery-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }
        
        /* Teljes képernyős modál konténer a zoomolható képnek */
        #full-image-display {
            display: none;
            position: fixed;
            z-index: 101;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.98);
            overflow: auto; 
        }
        
        .full-image-content {
            width: 100vw; 
            height: 100vh;
            display: flex;
            align-items: center; 
            justify-content: center; 
        }

        #fullImageDisplay {
            display: block;
            width: auto; 
            height: auto;
            max-width: 100%; 
            max-height: 100%;
            touch-action: pan-x pan-y; 
            cursor: move;
            margin: auto;
        }

        .close-gallery {
            position: absolute;
            top: 15px;
            right: 33px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            z-index: 110;
        }
        
        .close-gallery:hover,
        .close-gallery:focus {
            color: #00ffff;
        }
        
        /* --- SÚGÓ (HELP) MODAL STÍLUSOK (1935.html) --- */
        #help-modal {
            display: none;
            position: fixed;
            z-index: 200; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
        }

        .help-content {
            background-color: #1a1a1a;
            margin: 30% auto; 
            padding: 30px;
            border: 3px solid #00ffff;
            border-radius: 10px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            text-align: center;
        }

        #help-text-display {
            font-size: 1.2em;
            font-weight: 700;
            color: #e0e0e0;
            margin-bottom: 25px;
            min-height: 80px;
        }

        #help-next-button, #help-close-button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        #help-next-button {
            background-color: #00ffff;
            color: #1a1a1a;
        }

        #help-next-button:hover {
            background-color: #00ddee;
        }
        
        #help-close-button:hover {
            background-color: #777777 !important;
        }

        .help-icon {
            background: none;
            border: none;
            color: #00ffff;
            font-size: 1.5em;
            cursor: pointer;
            transition: color 0.3s;
            line-height: 0; 
        }
        
        /* --- TÁVOLSÁG MODAL STÍLUSOK (GPS MODAL - compass4c.html) --- */
        #distanceModal {
            display: none; 
            position: fixed;
            z-index: 250; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(2px);
            
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .distance-content {
            padding: 20px;
            max-width: 90%;
            background-color: rgba(0, 0, 0, 0.85); 
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            border: 2px solid #00ffff;
        }

        #distance-modal-display {
            font-size: 5em;
            font-weight: bold;
            color: #00ff00; 
            margin: 20px 0;
            padding: 10px;
            border-radius: 8px;
            min-width: 200px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5); 
            background-color: rgba(0, 0, 0, 0.5);
        }
        
        #distance-status {
            color: #aaaaaa;
            font-size: 1.1em;
            margin-bottom: 25px;
            visibility: hidden; 
            height: 0; 
            margin-top: -20px; 
        }
        
        #distance-status.visible {
            visibility: visible;
            height: auto;
            margin-top: 10px;
        }

        #distance-modal-map-button {
            background-color: transparent;
            border: 2px solid #00ffff; 
            color: #00ffff; 
            padding: 15px 30px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
        }

        #distance-modal-map-button:hover {
            background-color: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 1);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Távolság Modal (GPS MODAL) -->

    <script>
        // --- KÉP/TÖRTÉNET ADATOK (1935.html) ---
        // FRISSÍTVE: A háttérkép a varoshaza.jpg-re cserélve
        const STABLE_IMAGE_URL = "Img/varoshaza.jpg"; 
        // FRISSÍTVE az új avatárokra
        const MARK_AVATAR_URL = "Img/Martin2.png"; // Martin avatár (M) - Standard
        const TOURIST_AVATAR_URL = "Img/turista.png"; // Turista avatár (T)
        const PAINTER_AVATAR_URL = "Img/festo.png"; // Festő avatár (F)
        
        // ÚJ AVATÁROK A TELEFONHÍVÁSHOZ
        const FRANCOIS_AVATAR_URL = "Img/Francois.png"; 
        const MARK_PHONE_AVATAR_URL = "Img/Martintelefonal2.jpg"; 

        // GALÉRIA KÉPEK TELJES LISTÁJA ÉS FELOLDÁSI FÜGGVÉNY
        const ALL_GALLERY_ITEMS = [
            { id: 'helyszin', url: STABLE_IMAGE_URL, title: "Helyszín", unlocked: true }, 
            // NYOM KÉPEK ELTÁVOLÍTVA
            { id: 'portre', url: "Img/portre.png", title: "Festő Portréja", unlocked: false }, // Új feloldandó elem
            // ÚJ: Cetli kép a galériába, a cetli megjelenésekor ez is feloldódik
            { id: 'cetli', url: "Img/cetli.png", title: "Titkos üzenet", unlocked: false }
        ];

        // TÖRTÉNETRÉSZEK (FRISSÍTVE az új szöveggel és interakciókkal)
        const storyPages = [
            // 0. Bevezetés (A régi indexekkel: 0-3)
            { type: 'text', content: `<i>Késő este érkeztem Budapestre.</i>`, speaker: 'Mark', image: STABLE_IMAGE_URL },
            { type: 'text', content: `<i>Egy taxi elvitt Budafokra, ekkor már minden kihalt volt.</i>`, speaker: 'Mark', image: STABLE_IMAGE_URL },
            { type: 'text', content: `<i>A Városháza térig csak 5 percet kellett sétálni.</i>`, speaker: 'Mark', image: STABLE_IMAGE_URL },
            { type: 'text', content: `<i>Kicsit elkéstem, remélem Éva türelmes volt és megvár.</i>`, speaker: 'Mark', image: STABLE_IMAGE_URL }, 

            // 4. (Régi index 5)
            { type: 'text', content: `<i>Éva nincs itt.. Lehet, hogy túl későn érkeztem.</i>`, speaker: 'Mark', image: STABLE_IMAGE_URL },

            // 5. (Régi index 6) VÁLASZTÁS PONT 1 (Multi-choice)
            { 
                type: 'choice', 
                content: ``, 
                speaker: 'Narrator', 
                image: STABLE_IMAGE_URL,
                choices: [
                    // Indexek: Turista ág (6), Festő ág (8)
                    { text: 'Áll egy turista, odamész hozzá', nextIndex: 6 }, 
                    { text: 'Egy festőt látsz, megnézed mit fest', nextIndex: 8 } 
                ]
            },

        // GPS/TÁVOLSÁG FUNKCIÓK
        
        function tavolsagotKiszamol(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
            
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            
            return R * c; 
        }
        
        function restartCompassTracking() {
            console.log("GPS Hiba történt, újrapróbálkozás 2 másodperc múlva...");
            setTimeout(startCompassTracking, 2000);
        }
        
        function setDistanceStatus(message, isError = false) {
            distanceStatus.textContent = message;
            if (isError || message.includes("Hiba") || message.includes("várjon")) {
                distanceStatus.classList.add('visible');
            } else {
                distanceStatus.classList.remove('visible');
            }
        }

        function startCompassTracking() {
            if (!("geolocation" in navigator)) {
                setDistanceStatus("Hiba: A böngészője nem támogatja a helymeghatározást.", true);
                console.error("Geolocation API not supported.");
                return;
            }
            
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            setDistanceStatus("Helymeghatározás indítása, kérjük várjon...", true);
            distanceDisplay.textContent = "-- M"; 

            console.log("Calling watchPosition...");

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const latDeg = position.coords.latitude;
                    const lonDeg = position.coords.longitude;
                    
                    console.log(`GPS OK: Lat=${latDeg}, Lon=${lonDeg}, Accuracy=${position.coords.accuracy}`);

                    const tavolsag = tavolsagotKiszamol(latDeg, lonDeg, COMPASS_LAT, COMPASS_LON);
                    
                    distanceDisplay.textContent = `${tavolsag.toFixed(0)} M`; 
                    setDistanceStatus(`Pontosság: ±${position.coords.accuracy.toFixed(0)} m. Jelenlegi távolság:`, false);

                    if (tavolsag <= COMPASS_RADIUS) {
                        setDistanceStatus("Cél elérve! Átirányítás 5 másodperc múlva...", true);
                        navigator.geolocation.clearWatch(watchId);
                        watchId = null;
                        setTimeout(() => {
                            window.location.href = SUCCESS_LINK; // Átirányítás a next.html-re
                        }, 5000);
                        return;
                    }
                },
                
                (error) => {
                    console.error("GPS Error Code:", error.code, "Message:", error.message);
                    
                    if (watchId) {
                        navigator.geolocation.clearWatch(watchId);
                        watchId = null;
                    }
                    
                    if (error.code === error.PERMISSION_DENIED) {
                        setDistanceStatus("Hiba: Kérjük, engedélyezze a helymeghatározást (engedély letiltva).", true);
                        distanceDisplay.textContent = "X";
                    } else if (error.code === error.POSITION_UNAVAILABLE) {
                           setDistanceStatus("Hiba: A helyzetadatok nem érhetők el (rossz GPS vétel). Újrapróbálkozás...", true);
                           distanceDisplay.textContent = "X";
                           restartCompassTracking(); 
                    } else if (error.code === error.TIMEOUT) {
                           setDistanceStatus("Hiba: Túl sokáig tartott a helyzet meghatározása. Újrapróbálkozás...", true);
                           distanceDisplay.textContent = "X";
                           restartCompassTracking(); 
                    } else {
                        setDistanceStatus("Hiba a helymeghatározásban.", true);
                        distanceDisplay.textContent = "X";
                    }
                },
                
                {
                    enableHighAccuracy: true,
                    timeout: 15000, 
                    maximumAge: 0 
                }
            );
        }

        function showDistanceModal() {
            // Elrejti a fő tartalomdobozt (történet)
            contentBox.style.display = 'none'; 
            
            document.body.classList.add('modal-open');
            distanceModal.style.display = 'flex'; 
            
            // Beállítja a GPS modal térkép gomb linkjét
            document.getElementById('distance-modal-map-button').href = GPS_MODAL_MAP_URL;
            
            // Elindítja a GPS követést
            startCompassTracking(); 
        }
        
        // TÖRTÉNET/INTERAKCIÓ FUNKCIÓK

        function updateButtons() {
            stopAllAudio(); 
            multiChoiceContainer.style.display = 'none'; 
            passwordContainer.classList.remove('visible');
            discreetBackButton.style.display = 'none'; // Alapértelmezett: diszkrét nyíl elrejtve
            
            // Visszaállítjuk a gombokat az alapértelmezett állapotukra (teljes szélesség nélkül)
            nextButton.classList.remove('full-width'); 
            prevButton.style.visibility = 'visible'; 
            prevButton.style.display = 'block'; // Visszaállítja a Vissza gombot (alapértelmezett)
            prevButton.disabled = false;


            if (currentPartIndex < storyPages.length) {
                const currentPage = storyPages[currentPartIndex];
                
                const isChoicePage = currentPage.type === 'choice';
                const isFinalNotePage = currentPage.customAction === 'open_distance_modal'; // Az új cetli oldal
                
                if (isChoicePage) {
                    // 1. CHOICE PAGE LOGIC (Diszkrét vissza gomb + választási gombok)
                    interactionContainer.style.display = 'none';
                    multiChoiceContainer.style.display = 'flex';
                    
                    choice1Button.textContent = currentPage.choices[0].text;
                    choice1Button.dataset.nextIndex = currentPage.choices[0].nextIndex;

                    choice2Button.textContent = currentPage.choices[1].text;
                    choice2Button.dataset.nextIndex = currentPage.choices[1].nextIndex;
                    
                    // Diszkrét gomb megjelenítése (CSAK ITT)
                    discreetBackButton.style.display = 'flex';
                    discreetBackButton.disabled = currentPartIndex === 0;

                } else {
                    // 2. SEQUENTIAL PAGE LOGIC (Alapértelmezett alsó gombok)
                    interactionContainer.style.display = 'flex';
                    multiChoiceContainer.style.display = 'none';
                    interactionContainer.style.justifyContent = 'space-between'; // ALAPÉRTELMEZETT VISSZAÁLLÍTÁS
                    
                    // Vissza gomb láthatósága
                    prevButton.style.visibility = 'visible';
                    prevButton.disabled = currentPartIndex === 0;
                    
                    // Folytatás gomb beállítása
                    const customText = currentPage.nextButtonText;
                    const nextIndexDefined = currentPage.nextIndex !== undefined;
                    
                    if (customText) {
                        nextButton.textContent = customText;
                    } else if (nextIndexDefined) {
                        nextButton.textContent = 'Tovább';
                    } else {
                        nextButton.textContent = 'Folytatás';
                    }
                    
                    nextButton.dataset.forcedNextIndex = nextIndexDefined ? currentPage.nextIndex : '';
                    
                    // CÉLPONT ELÉRÉS GOMB LEKEZELÉSÉHEZ (Cetli oldal és a párbeszéd vége):
                    if (currentPartIndex === 61 || isFinalNotePage) { // Index 61 (Cetli) és a párbeszéd vége (Index 83)
                        nextButton.classList.remove('full-width'); 
                        interactionContainer.style.justifyContent = 'center'; // KÖZÉPRE IGAZÍTÁS
                        prevButton.style.display = 'none'; // TELJES ELTÁVOLÍTÁS
                        prevButton.disabled = true;
                    } else {
                         // Ha nincs custom action, marad az alapértelmezett (space-between, prevButton block)
                         prevButton.style.display = 'block'; // Biztosítja, hogy alapértelmezettként megjelenjen
                    }
                }

            } else {
                // 3. PASSWORD PAGE LOGIC
                interactionContainer.style.display = 'none';
                multiChoiceContainer.style.display = 'none';
                passwordContainer.classList.add('visible');
                discreetBackButton.style.display = 'none';
            }
        }

        function updateAvatar(pageIndex) {
            const speaker = pageIndex < storyPages.length ? storyPages[pageIndex].speaker : 'Narrator';
            
            let avatarUrl = MARK_AVATAR_URL;
            let avatarAlt = 'Márk avatar';
            let opacity = 1;
            
            if (speaker === 'Tourist') {
                avatarUrl = TOURIST_AVATAR_URL;
                avatarAlt = 'Turista avatar';
            } else if (speaker === 'Painter') {
                avatarUrl = PAINTER_AVATAR_URL;
                avatarAlt = 'Festő avatar';
            } else if (speaker === 'Francois') { // Professzor
                avatarUrl = FRANCOIS_AVATAR_URL;
                avatarAlt = 'Professzor avatar';
            } else if (speaker === 'MarkPhone') { // Martin telefonál
                avatarUrl = MARK_PHONE_AVATAR_URL;
                avatarAlt = 'Márk telefonál avatar';
            } else if (speaker === 'Mark') {
                avatarUrl = MARK_AVATAR_URL;
                avatarAlt = 'Márk avatar';
            } else { // Narrator/Választás
                avatarUrl = MARK_AVATAR_URL; 
                avatarAlt = 'Narrátor';
                opacity = 0; 
            }
            
            avatarImg.src = avatarUrl;
            avatarImg.alt = avatarAlt;
            avatarImg.style.opacity = opacity;
        }

        function showStoryPart() {
            messageDisplay.textContent = ''; 
            passwordInput.value = ''; // Töröljük a jelszó inputot
            contentBox.style.opacity = 0;

            setTimeout(() => {
                audioContainer1.style.display = 'none';
                audioContainer2.style.display = 'none';
                storyDisplay.innerHTML = ''; 

                if (currentPartIndex < storyPages.length) {
                    const currentPage = storyPages[currentPartIndex];
                    
                    updateAvatar(currentPartIndex); 
                    
                    if (currentPage.type === 'text' || currentPage.type === 'audio' || currentPage.type === 'choice' || currentPage.type === 'note_image') {
                        // Ha a tartalom üres (note_image), ne jelenítsünk meg üres szöveget
                        if (currentPage.content.trim() !== '') {
                           storyDisplay.innerHTML = currentPage.content;
                        }
                        
                        if (currentPage.type === 'audio') {
                            if (currentPage.audioId === 1) {
                                audioContainer1.style.display = 'block';
                            } else if (currentPage.audioId === 2) {
                                audioContainer2.style.display = 'block';
                            }
                        }
                    }
                    
                    storyImage.src = currentPage.image || STABLE_IMAGE_URL; 
                    
                } else {
                    // Jelszó beviteli képernyő: Index 84 (storyPages.length)
                    updateAvatar(currentPartIndex);
                    storyImage.src = STABLE_IMAGE_URL; // Alap kép visszaállítása a fülkére
                    storyDisplay.innerHTML = 'Nézz körül az igazi fülkében!';
                }

                contentBox.style.opacity = 1;
                updateButtons();
            }, 100); 
        }
        
        // --- ESEMÉNYKEZELŐK ---
        
        window.addEventListener('popstate', function(event) {
            if (fullImageDisplayModal.style.display === 'block') {
                closeFullImage();
                history.pushState(null, null, '#gallery'); 
            } else if (galleryModal.style.display === 'block') {
                closeGallery();
                history.pushState(null, null, window.location.pathname + window.location.search);
            }
        });

        document.querySelector('#galleryModal .close-gallery').onclick = () => { history.back(); };
        document.querySelector('#full-image-display .close-gallery').onclick = () => { history.back(); };

        nextButton.addEventListener('click', () => {
            // UNLOCK LOGIC for PORTRAIT: 58. index után
            if (currentPartIndex === 58) {
                localStorage.setItem('isPortraitUnlocked', 'true');
                console.log("Festő Portréja feloldva!");
            }
            
            const currentPage = storyPages[currentPartIndex];
            
            // ÚJ LOGIKA: Egyedi akció kezelése (GPS modal)
            if (currentPage && currentPage.customAction === 'open_distance_modal') {
                 // A Cetli feloldása már a checkButton-ban megtörtént, csak a GPS-t indítjuk.
                stopAllAudio();
                localStorage.removeItem('gameProgress'); // Töröljük a mentést, ha elindítjuk a GPS-t
                showDistanceModal(); 
                return;
            }


            const forcedNextIndex = nextButton.dataset.forcedNextIndex;
            if (forcedNextIndex !== undefined && forcedNextIndex !== '') {
                // Kényszerített ugrás a megadott indexre
                currentPartIndex = parseInt(forcedNextIndex);
            } else {
                // Normál lépés a következő oldalra
                currentPartIndex++;
            }
            saveProgress();
            showStoryPart();
        });

        // VISSZAÁLLÍTVA: A szekvenciális oldalak normál "Vissza" gombjának eseménykezelője
        prevButton.addEventListener('click', () => {
            if (currentPartIndex > 0) {
                currentPartIndex--;
                saveProgress();
                showStoryPart();
            }
        });

        backButtonPassword.addEventListener('click', () => {
            // A jelszóbeviteli képernyőről az utolsó történetoldalra lépünk vissza (Index 60)
            currentPartIndex = 60; 
            saveProgress();
            showStoryPart();
        });

        checkButton.addEventListener('click', () => {
            const enteredPassword = passwordInput.value.trim();

            if (enteredPassword === CORRECT_PASSWORD) {
                messageDisplay.textContent = 'Kód elfogadva! Egy üzenetet találtál...';
                messageDisplay.style.color = '#00FF00';
                
                // *** MÓDOSÍTÁS A KÉRÉSNEK MEGFELELŐEN: CETLI FELOLDÁSA A GALÉRIÁBAN ***
                localStorage.setItem('isNoteUnlocked', 'true');
                
                // MÓDOSÍTVA: Ugrás az új CETLI oldalra (Index 61)
                setTimeout(() => {
                    currentPartIndex = 61; // Új cetli oldal indexe
                    saveProgress();
                    showStoryPart(); // Megjeleníti a cetli oldalt
                }, 1000);
                
            } else {
                messageDisplay.textContent = 'Helytelen jelszó! Próbáld újra.';
                messageDisplay.style.color = '#FF4500';
                passwordInput.value = '';
            }
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkButton.click(); 
            }
        });
        
        playAudioButton1.addEventListener('click', () => toggleAudio(storyAudio1, playAudioButton1, '1'));
        playAudioButton2.addEventListener('click', () => toggleAudio(storyAudio2, playAudioButton2, '2'));

        imageButton.addEventListener('click', openGallery);
        
        mapButton.addEventListener('click', () => {
            // Megnyitja az 1935.html térképét
            window.open(MENU_MAP_URL, '_blank');
        });

        if (helpButton) {
            helpButton.addEventListener('click', () => {
                currentHelpIndex = 0; 
                showHelpMessage();
            });
        }

        if (helpNextButton) {
            helpNextButton.addEventListener('click', nextHelpStep);
        }
        
        if (helpCloseButton) {
            helpCloseButton.addEventListener('click', closeHelpModal);
        }

        // Choice button eseménykezelők
        [choice1Button, choice2Button].forEach(button => {
            button.addEventListener('click', (e) => {
                const nextIndex = parseInt(e.currentTarget.dataset.nextIndex);
                currentPartIndex = nextIndex;
                saveProgress();
                showStoryPart();
            });
        });

        // ÚJ: Diszkrét Vissza gomb eseménykezelő (csak a choice képernyőn látszik)
        discreetBackButton.addEventListener('click', () => {
            if (currentPartIndex > 0) {
                // Visszaugrunk a legutolsó szekvenciális oldalra
                let targetIndex = currentPartIndex - 1;
                while (targetIndex > 0 && storyPages[targetIndex].type === 'choice') {
                    targetIndex--;
                }
                currentPartIndex = targetIndex; 

                saveProgress();
                showStoryPart();
            }
        });


        function initializeApp() {
            if (document.body.style.visibility === 'visible') return; 

            loadProgress(); 
            showStoryPart();
            
            document.body.style.visibility = 'visible';
            document.body.style.opacity = 1;
        }

        window.onload = () => {
             // Google Forms beküldés (1935.html-ből megőrizve)
            const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScMxfTwsgk0nyIiuJ1o9mWHbRkyPA9hBI792mABbOzJOVlONA/formResponse";
            fetch(FORM_URL, {
                method: 'POST',
                mode: 'no-cors'
            }).then(() => {
                console.log("Látogatási adat sikeresen elküldve.");
            }).catch(error => {
                console.error("Hiba történt a látogatási kérés küldésekor:", error);
            });
            
            initializeApp(); 
        };
    </script>
</body>
