<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Titkok kora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Play', sans-serif; background-color: #000; color: #f8fafc; overflow: hidden; }
        .game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #viewport { position: relative; flex-grow: 1; overflow: hidden; }
        #bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; }
        #content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 40px; min-height: 250px; max-height: 70%; display: flex; flex-direction: column; box-shadow: 0 -10px 25px rgba(0,0,0,0.5); }
        .avatar-frame { position: absolute; top: -40px; left: 10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .action-btn { flex: 1; background: #8b5cf6; color: white; padding: 16px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.25rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .action-btn:active { transform: scale(0.98); background: #a855f7; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #475569; }
        .btn-back { background: #334155; }
        .bottom-nav { height: 75px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; position: relative; transition: color 0.3s; }
        .nav-item.active { color: #8b5cf6; }
        .badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; }
        #story-text { text-align: justify; hyphens: auto; font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 15px; }
        #inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 50; display: none; padding: 25px; padding-top: 50px; overflow-y: auto; }
        .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item-card { position: relative; background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 15px; text-align: center; cursor: pointer; }
        .item-card img { width: 65px; height: 65px; object-fit: contain; margin: 0 auto 10px; }
        .item-unread-dot { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 5px rgba(239, 68, 68, 0.8); }
        #qr-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #qr-reader { width: 280px; height: 280px; border: 3px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; }
        #zoom-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; align-items: center; justify-content: center; touch-action: none; overflow: hidden; }
        #zoom-img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px; transition: transform 0.1s ease-out; cursor: zoom-out; user-select: none; }
        .loading-screen { position: fixed; inset: 0; background: #0f172a; z-index: 6000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .gps-monitor { display: none; text-align: center; padding: 1rem; background: rgba(15,23,42,0.8); border: 1px solid rgba(34,211,238,0.4); border-radius: 1.5rem; margin-top: 1rem; }
        
        /* Modal for Hints */
        #hint-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9998; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-box { background: #1e293b; border: 2px solid #8b5cf6; border-radius: 1.5rem; padding: 2rem; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="loading" class="loading-screen"><div id="loading-text" class="text-purple-400 font-bold uppercase text-sm mb-6">Betöltés...</div></div>
    <div id="qr-layer"><div id="qr-reader"></div><button onclick="stopQR(true)" class="action-btn mt-6 !w-auto !flex-none px-12">MÉGSE</button></div>
    <div id="zoom-viewer" onclick="closeZoom(false)"><img id="zoom-img" src="" onclick="event.stopPropagation()"></div>
    
    <div id="hint-modal">
        <div class="modal-box">
            <div id="hint-step-confirm">
                <h3 class="text-xl font-bold mb-4 uppercase text-cyan-400">Segítség kérése</h3>
                <p class="text-slate-400 mb-8">Biztosan látni akarod a következő segítséget?</p>
                <div class="flex gap-4">
                    <button onclick="closeHintModal()" class="flex-1 bg-slate-700 p-3 rounded-xl font-bold uppercase text-xs">Mégse</button>
                    <button id="hint-show-btn" class="flex-1 bg-purple-600 p-3 rounded-xl font-bold uppercase text-xs">Igen, kérem</button>
                </div>
            </div>
            <div id="hint-display-area" class="hidden">
                <h3 class="text-xl font-bold mb-4 uppercase text-purple-400">Útmutatás</h3>
                <div id="hint-content-text" class="text-white text-lg font-bold mb-8 italic"></div>
                <button onclick="closeHintModal()" class="w-full bg-cyan-600 p-3 rounded-xl font-bold uppercase text-xs">Értem</button>
            </div>
        </div>
    </div>

    <div class="game-wrapper">
        <div id="viewport">
            <img id="bg-layer" src="">
            <div id="inventory-overlay"><h2 class="text-center text-cyan-400 font-bold mb-8 uppercase tracking-widest">Hátizsák</h2><div id="item-list" class="item-grid"></div></div>
            <div id="content-layer">
                <div class="dialog-box">
                    <img id="avatar-img" class="avatar-frame" src="">
                    <div id="scroll-area" class="overflow-y-auto pr-1 flex-grow">
                        <img id="page-illustration" class="w-full rounded-xl mb-4 hidden shadow-xl" src="">
                        <div id="story-text"></div>
                        <div id="gps-monitor" class="gps-monitor">
                            <div class="text-[10px] text-cyan-500 uppercase font-bold tracking-widest mb-1">Célpont távolsága</div>
                            <div class="text-3xl font-bold text-white"><span id="live-dist">...</span> <span class="text-sm opacity-50">méter</span></div>
                            <div id="gps-hint" class="text-[10px] text-slate-400 mt-2 italic">Menj közelebb! (20m)</div>
                        </div>
                    </div>
                    <div id="button-container" class="mt-4 flex flex-col gap-3"></div>
                </div>
            </div>
        </div>
        <div class="bottom-nav">
            <button id="nav-map" class="nav-item active" onclick="switchView('map')"><i class="fa fa-map-marked-alt"></i></button>
            <button id="nav-inv" class="nav-item" onclick="switchView('inv')"><i class="fa-solid fa-briefcase"></i><div id="inv-badge" class="badge hidden">0</div></button>
            <button class="nav-item" onclick="resetGame()"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="nav-item" onclick="toggleFullscreen()"><i class="fa fa-expand"></i></button>
        </div>
    </div>

            document.getElementById('hint-show-btn').onclick = () => {
                const ha = hints.split('\n').filter(x => x.trim());
                document.getElementById('hint-content-text').textContent = ha[Math.min(currentHint, ha.length-1)];
                c.classList.add('hidden'); d.classList.remove('hidden');
                currentHint++;
            };
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
        }

        if("geolocation" in navigator) {
            navigator.geolocation.watchPosition(p => {
                userPos = {lat: p.coords.latitude, lng: p.coords.longitude};
                const cur = config.storyPages[simIdx];
                if(cur?.pageType === 'gps' && userPos) {
                    const d = getDistance(userPos.lat, userPos.lng, cur.targetLat, cur.targetLng);
                    document.getElementById('live-dist').textContent = d;
                    const hint = document.getElementById('gps-hint');
                    if(d <= 20) {
                        hint.textContent = "Megérkeztél! Átirányítás...";
                        hint.className = "text-[10px] text-emerald-400 mt-2 font-bold";
                        if(lastAutoGps !== simIdx) {
                            lastAutoGps = simIdx;
                            setTimeout(() => { if(cur.redirectUrl) window.open(cur.redirectUrl, '_blank'); else { simIdx = (cur.nextIdx !== "" && cur.nextIdx !== undefined) ? parseInt(cur.nextIdx) : simIdx + 1; updateUI(); } }, 800);
                        }
                    } else { hint.textContent = "Menj közelebb! (20m)"; hint.className = "text-[10px] text-slate-400 mt-2 italic"; }
                }
            }, null, {enableHighAccuracy: true});
        }

        function initGame() { document.title = config.appTitle || "Kaland Játék"; simIdx = 0; inventory = []; updateUI(); document.getElementById('loading').style.display = 'none'; }
        
        function updateUI() {
            const p = config.storyPages[simIdx]; if(!p) return; 
            handleReward(p); 
            const bg = document.getElementById('bg-layer'); bg.style.opacity = 0;
            setTimeout(() => { bg.src = p.pageBg || config.globalBg || ""; bg.style.opacity = 1; }, 200);

            let text = p.content || ""; 
            const avImg = document.getElementById('avatar-img'); avImg.style.display = 'none';
            config.avatars.forEach(av => { if(text.includes('§'+av.id)) { avImg.src = av.url || ""; avImg.style.display = av.url ? 'block' : 'none'; avImg.style.borderColor = av.color; text = text.replace(new RegExp('§'+av.id, 'g'), '<span style="color:'+av.color+'">'+av.name+':</span>'); } });
            document.getElementById('story-text').innerHTML = text;

            const ill = document.getElementById('page-illustration'); if(p.pageImage) { ill.src = p.pageImage; ill.classList.remove('hidden'); } else { ill.classList.add('hidden'); }
            document.getElementById('gps-monitor').style.display = p.pageType === 'gps' ? 'block' : 'none';
            
            const container = document.getElementById('button-container'); container.innerHTML = '';
            if (p.pageType === 'qr') addBtn("QR BEOLVASÁSA", startQR, "fa-camera");
            else if(p.pageType === 'password') {
                if (p.hints) {
                    const hBtn = document.createElement('button'); hBtn.className = "block mx-auto mb-4 text-cyan-400 text-4xl hover:text-cyan-300 transition-colors border-none bg-transparent"; hBtn.innerHTML = '<i class="fa fa-circle-question"></i>';
                    hBtn.onclick = () => openHintConfirm(p.hints);
                    container.appendChild(hBtn);
                }
                const inp = document.createElement('input'); inp.className = "w-full bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-lg text-center font-bold text-xl mb-2"; inp.placeholder = "KÓD...";
                container.appendChild(inp);
                
                addBtn("NYITÁS", () => { if(inp.value.trim().toLowerCase() == (p.password||"").toLowerCase()) { simIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : simIdx + 1; lastAutoGps = -1; currentHint = 0; updateUI(); } });
            } else if(p.pageType === 'choice' && p.choices) { p.choices.forEach(c => { if (c.req && !inventory.find(i => i.name.toLowerCase() === c.req.toLowerCase())) return; addBtn(c.text, () => { simIdx = parseInt(c.target); lastAutoGps = -1; currentHint = 0; updateUI(); }); }); } 
            if(p.pageType === 'gps' && p.mapLink) addBtn("TÉRKÉP MEGNYITÁSA", () => window.open(p.mapLink, '_blank'), "fa-map");

            const navRow = document.createElement('div'); navRow.className = "flex gap-3 w-full";
            if(simIdx > 0 || (p.prevIdx !== "" && p.prevIdx !== undefined)) { const b = document.createElement('button'); b.className = "action-btn btn-back"; b.innerHTML = "VISSZA"; b.onclick = () => { simIdx = (p.prevIdx !== "" && p.prevIdx !== undefined) ? parseInt(p.prevIdx) : simIdx - 1; lastAutoGps = -1; currentHint = 0; updateUI(); }; navRow.appendChild(b); }
            if (p.pageType !== 'choice' && p.pageType !== 'password' && p.pageType !== 'qr' && p.pageType !== 'gps') { const b = document.createElement('button'); b.className = "action-btn"; b.innerHTML = "TOVÁBB"; b.onclick = () => { if(p.redirectUrl) window.open(p.redirectUrl, '_blank'); else { simIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : simIdx + 1; lastAutoGps = -1; currentHint = 0; updateUI(); } }; navRow.appendChild(b); }
            container.appendChild(navRow);
        }

        function openZoom(url) { 
            pushNav(); zoomActive = true; 
            const v = document.getElementById('zoom-viewer'), i = document.getElementById('zoom-img'); 
            i.src = url; zoomScale = 1; i.style.transform = "scale("+zoomScale+")"; v.style.display = 'flex'; 
            let isMoving = false;
            v.ontouchstart = (e) => { if (e.touches.length === 2) initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); isMoving = false; };
            v.ontouchmove = (e) => { isMoving = true; if (e.touches.length === 2 && initialDist > 0) { const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); zoomScale = Math.min(Math.max(0.5, zoomScale * (dist / initialDist)), 5); i.style.transform = "scale("+zoomScale+")"; initialDist = dist; } };
            v.ontouchend = () => { if (!isMoving) closeZoom(false); };
            v.onclick = () => { if(!isMoving) closeZoom(false); };
        }

        function closeZoom(manBack) { document.getElementById('zoom-viewer').style.display = 'none'; zoomActive = false; if(manBack) try { history.back(); } catch(e) {} }
        function addBtn(text, fn, icon = "") { const b = document.createElement('button'); b.className = "action-btn"; b.innerHTML = text + (icon ? ' <i class="fa '+icon+' ml-2 opacity-50"></i>' : ''); b.onclick = fn; document.getElementById('button-container').appendChild(b); }
        function startQR() { pushNav(); document.getElementById('qr-layer').style.display = 'flex'; qrScanner = new Html5Qrcode("qr-reader"); qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (t) => { const p = config.storyPages[simIdx]; if (t.trim().toUpperCase() === (p.qrCode || "").trim().toUpperCase()) { stopQR(false, () => { if (p.redirectUrl) window.open(p.redirectUrl, '_blank'); else { simIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : simIdx + 1; lastAutoGps = -1; currentHint = 0; updateUI(); } }); } }).catch(() => stopQR(true)); }
        function stopQR(manual, callback) { if (manual) history.back(); if (isStoppingQR) return; const layer = document.getElementById('qr-layer'); if (!qrScanner) { layer.style.display = 'none'; if(callback) callback(); return; } isStoppingQR = true; qrScanner.stop().catch(() => {}).finally(() => { layer.style.display = 'none'; qrScanner = null; isStoppingQR = false; if (callback) callback(); }); }
        function handleReward(p) { if (p.rewards) { inventory = p.rewards.filter(r => r.name && r.name.trim() !== "").map(r => ({ name: r.name, icon: r.icon || '📦', url: r.url || '', seen: false })); } else { inventory = []; } updateBadge(); }
        function updateBadge() { const b = document.getElementById('inv-badge'), un = inventory.filter(i => !i.seen).length; b.textContent = un; b.classList.toggle('hidden', un === 0); }
        function switchView(t) { 
            const inv = document.getElementById('inventory-overlay'), navInv = document.getElementById('nav-inv'), navMap = document.getElementById('nav-map');
            if (t === 'inv') { 
                if (inv.style.display === 'block') { inv.style.display = 'none'; navInv.classList.remove('active'); navMap.classList.add('active'); } 
                else { renderInventory(); inv.style.display = 'block'; navInv.classList.add('active'); navMap.classList.remove('active'); } 
            } else { inv.style.display = 'none'; navInv.classList.remove('active'); navMap.classList.add('active'); } 
        }

        function renderInventory() { 
            const l = document.getElementById('item-list'); l.innerHTML = ''; 
            inventory.forEach(it => { 
                const d = document.createElement('div'); d.className = "item-card"; 
                d.innerHTML = it.url ? '<img src="'+it.url+'"><div class="text-[10px] uppercase font-bold">'+it.name+'</div>' : '<div class="text-4xl mb-2">'+it.icon+'</div><div class="text-[10px] font-bold uppercase">'+it.name+'</div>'; 
                if (!it.seen) d.innerHTML += '<div class="item-unread-dot"></div>'; 
                d.onclick = () => { if(it.url) openZoom(it.url); it.seen = true; updateBadge(); renderInventory(); }; 
                l.appendChild(d); 
            }); 
        }

        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function resetGame() { if(confirm("Újrakezded?")) { simIdx = 0; inventory = []; lastAutoGps = -1; currentHint = 0; updateBadge(); switchView('map'); updateUI(); } }
        window.onload = initGame;
    </script>
</body>
</html>
