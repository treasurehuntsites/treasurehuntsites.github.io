<!doctype html>
<html lang="hu">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Város Legendája</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Play', sans-serif; background-color: #000; color: #f8fafc; overflow: hidden; }
        .game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #viewport { position: relative; flex-grow: 1; overflow: hidden; }
        #bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; }
        #content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 40px; min-height: 250px; max-height: 70%; display: flex; flex-direction: column; box-shadow: 0 -10px 25px rgba(0,0,0,0.5); }
        .avatar-frame { position: absolute; top: -40px; left: 10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .action-btn { flex: 1; background: #8b5cf6; color: white; padding: 16px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.25rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .action-btn:active { transform: scale(0.98); background: #a855f7; }
        .btn-back { background: #334155; }
        .bottom-nav { height: 75px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; position: relative; transition: color 0.3s; }
        .nav-item.active { color: #8b5cf6; }
        .badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; }
        #story-text { text-align: justify; hyphens: auto; font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 15px; }
        #inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 50; display: none; padding: 25px; padding-top: 50px; overflow-y: auto; }
        .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item-card { position: relative; background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 15px; text-align: center; cursor: pointer; }
        .item-card img { width: 65px; height: 65px; object-fit: contain; margin: 0 auto 10px; }
        .item-unread-dot { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 5px rgba(239, 68, 68, 0.8); }
        #qr-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #qr-reader { width: 280px; height: 280px; border: 3px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; }
        #zoom-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; align-items: center; justify-content: center; touch-action: none; overflow: hidden; }
        #zoom-img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px; transition: transform 0.1s ease-out; cursor: zoom-out; user-select: none; }
        .loading-screen { position: fixed; inset: 0; background: #0f172a; z-index: 6000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .gps-monitor { display: none; text-align: center; padding: 1rem; background: rgba(15,23,42,0.8); border: 1px solid rgba(34,211,238,0.4); border-radius: 1.5rem; margin-top: 1rem; }
        #hint-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9998; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-box { background: #1e293b; border: 2px solid #8b5cf6; border-radius: 1.5rem; padding: 2rem; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        @keyframes fadeInOutSplash { 0% { opacity: 0; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } 90% { opacity: 0; transform: scale(1.02); } 100% { opacity: 0; } }
        .splash-text-anim { font-family: 'Special Elite', cursive; animation: fadeInOutSplash 10s ease-in-out forwards; text-transform: uppercase; letter-spacing: 0.1em; }
        #splash-screen { position: absolute; inset: 0; background: #000; z-index: 500; display: none; align-items: center; justify-content: center; }
        .phone-ui { background: linear-gradient(to bottom, #2c3e50, #000000); height: 100%; width: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 15% 20px; box-sizing: border-box; text-align: center; color: white; font-family: sans-serif; }
        .phone-btn { width: 80px; height: 80px; border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .phone-btn.decline { background-color: #ff3b30; }
        .phone-btn.accept { background-color: #4cd964; }
        .phone-btn svg { width: 40px; height: 40px; fill: white; }
        .pulse { animation: pulse-anim 1.5s infinite; }
        @keyframes pulse-anim { 0% { box-shadow: 0 0 0 0px rgba(76, 217, 100, 0.5); } 100% { box-shadow: 0 0 0 30px rgba(76, 217, 100, 0); } }
        #call-screen { position: absolute; inset: 0; z-index: 800; background: #000; display: none; }
    </style>
</head>

    <div id="loading" class="loading-screen"><div id="loading-text" class="text-purple-400 font-bold uppercase text-sm mb-6">Betöltés...</div></div>

            </div>
            <div id="hint-display-area" class="hidden">

    </div>
    <div class="game-wrapper">
        <div id="viewport">
            <img id="bg-layer" src="">
            <div id="splash-screen"><div id="splash-text" class="text-white text-center p-6 splash-text-anim text-4xl"></div></div>

                    </div>
                </div>
            </div>
            <div id="inventory-overlay"><h2 class="text-center text-cyan-400 font-bold mb-8 uppercase tracking-widest">Hátizsák</h2><div id="item-list" class="item-grid"></div></div>
            <div id="content-layer">
                <div class="dialog-box">
                    <img id="avatar-img" class="avatar-frame" src="">
                    <div id="scroll-area" class="overflow-y-auto pr-1 flex-grow">
                        <img id="page-illustration" class="w-full rounded-xl mb-4 hidden shadow-xl" src="">
                        <div id="story-text"></div>
                        <div id="gps-monitor" class="gps-monitor">
                            <div class="text-[10px] text-cyan-500 uppercase font-bold tracking-widest mb-1">Célpont távolsága</div>
                            <div class="text-3xl font-bold text-white"><span id="live-dist">...</span> <span class="text-sm opacity-50">méter</span></div>

                        </div>
                    </div>
                    <div id="button-container" class="mt-4 flex flex-col gap-3"></div>
                </div>
            </div>
        </div>
        <div class="bottom-nav">

            <button id="nav-inv" class="nav-item" onclick="switchView('inv')"><i class="fa-solid fa-briefcase"></i><div id="inv-badge" class="badge hidden">0</div></button>

            <button class="nav-item" onclick="toggleFullscreen()"><i class="fa fa-expand"></i></button>
        </div>
    </div>

        let simIdx = 0, inventory = [], qrScanner = null, isStoppingQR = false, userPos = null, zoomActive = false;

        function initGame() { document.title = config.appTitle || "Kaland Játék"; simIdx = 0; updateUI(); document.getElementById('loading').style.display = 'none'; }
        function stopAudio() { 
            const r = document.getElementById('ringtone-audio'); const v = document.getElementById('voice-audio');
            r.pause(); r.currentTime = 0; v.pause(); v.currentTime = 0;
        }
        function answerCall() {
            stopAudio(); document.getElementById('call-btns').style.display = 'none'; document.getElementById('call-status').style.display = 'block';
            const v = document.getElementById('voice-audio'); const p = config.storyPages[simIdx];
            v.src = p.audioUrl || ""; v.play().catch(e => endCall()); v.onended = endCall;
        }
        function endCall() {
            stopAudio(); const p = config.storyPages[simIdx];
            if(p.redirectUrl) window.open(p.redirectUrl, '_blank');
            else { simIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : simIdx + 1; updateUI(); }
        }
        function updateUI() {
            clearTimeout(sTimer); stopAudio();
            const p = config.storyPages[simIdx]; if(!p) return; 
            const splash = document.getElementById('splash-screen');
            const call = document.getElementById('call-screen');
            const layer = document.getElementById('content-layer');
            const nav = document.querySelector('.bottom-nav');
            
            if (p.pageType === 'splash') {
                splash.style.display = 'flex'; call.style.display = 'none'; layer.classList.add('hidden'); nav.style.display = 'none';
                const st = document.getElementById('splash-text'); st.textContent = p.content || "";
                st.style.animation = 'none'; void st.offsetWidth; st.style.animation = 'fadeInOutSplash 10s ease-in-out forwards';
                sTimer = setTimeout(() => { if(p.redirectUrl) window.open(p.redirectUrl, '_blank'); else { simIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : simIdx + 1; updateUI(); } }, 10500);
            } else if (p.pageType === 'call') {
                splash.style.display = 'none'; call.style.display = 'block'; layer.classList.add('hidden'); nav.style.display = 'none';
                document.getElementById('call-name').textContent = p.content || "Ismeretlen";
                document.getElementById('call-btns').style.display = 'flex';
                document.getElementById('call-status').style.display = 'none';
                const r = document.getElementById('ringtone-audio');
                r.src = p.ringtoneUrl || "https://cdn.pixabay.com/audio/2022/03/15/audio_73663a7587.mp3";
                r.play().catch(e => {});
            } else {
                splash.style.display = 'none'; call.style.display = 'none'; layer.classList.remove('hidden'); nav.style.display = 'flex';
                const bg = document.getElementById('bg-layer'); bg.src = p.pageBg || config.globalBg || "";
                let text = p.content || ""; 
                const avImg = document.getElementById('avatar-img'); avImg.style.display = 'none';
                config.avatars.forEach(av => { if(text.includes('§'+av.id)) { avImg.src = av.url || ""; avImg.style.display = 'block'; avImg.style.borderColor = av.color; text = text.replace(new RegExp('§'+av.id, 'g'), '<span style="color:'+av.color+'">'+av.name+':</span>'); } });
                document.getElementById('story-text').innerHTML = text;
                const container = document.getElementById('button-container'); container.innerHTML = '';
                addBtn("TOVÁBB", () => { simIdx++; updateUI(); });
            }
        }
        function addBtn(text, fn) { const b = document.createElement('button'); b.className = "action-btn"; b.innerHTML = text; b.onclick = fn; document.getElementById('button-container').appendChild(b); }
