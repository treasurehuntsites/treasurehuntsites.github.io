<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Titkok kora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Play', sans-serif; background-color: #000; color: #f8fafc; overflow: hidden; }
        .game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #viewport { position: relative; flex-grow: 1; overflow: hidden; }
        #bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; }
        #content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 40px; min-height: 250px; max-height: 70%; display: flex; flex-direction: column; box-shadow: 0 -10px 25px rgba(0,0,0,0.5); }
        .avatar-frame { position: absolute; top: -40px; left: 10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .action-btn { flex: 1; background: #8b5cf6; color: white; padding: 16px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.25rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .action-btn:active { transform: scale(0.98); background: #a855f7; }
        .btn-back { background: #334155; }
        .bottom-nav { height: 75px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; position: relative; transition: color 0.3s; }
        .nav-item.active { color: #8b5cf6; }
        .badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; }
        #story-text { text-align: justify; hyphens: auto; font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 15px; }
        #inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 50; display: none; padding: 25px; padding-top: 50px; overflow-y: auto; }
        .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item-card { position: relative; background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 15px; text-align: center; cursor: pointer; }
        .item-card img { width: 65px; height: 65px; object-fit: contain; margin: 0 auto 10px; }
        .item-unread-dot { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 5px rgba(239, 68, 68, 0.8); }
        #qr-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #qr-reader { width: 280px; height: 280px; border: 3px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; }
        #zoom-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; align-items: center; justify-content: center; touch-action: none; overflow: hidden; }
        #zoom-img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px; transition: transform 0.1s ease-out; cursor: zoom-out; user-select: none; }
        .loading-screen { position: fixed; inset: 0; background: #0f172a; z-index: 6000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .gps-monitor { display: none; text-align: center; padding: 1rem; background: rgba(15,23,42,0.8); border: 1px solid rgba(34,211,238,0.4); border-radius: 1.5rem; margin-top: 1rem; }
        #hint-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9998; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-box { background: #1e293b; border: 2px solid #8b5cf6; border-radius: 1.5rem; padding: 2rem; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        @keyframes fadeInOutSplash { 0% { opacity: 0; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } 90% { opacity: 0; transform: scale(1.02); } 100% { opacity: 0; } }
        .splash-text-anim { font-family: 'Special Elite', cursive; animation: fadeInOutSplash 10s ease-in-out forwards; text-transform: uppercase; letter-spacing: 0.1em; }
        #splash-screen { position: absolute; inset: 0; background: #000; z-index: 500; display: none; align-items: center; justify-content: center; }
        .phone-ui { background: linear-gradient(to bottom, #2c3e50, #000000); height: 100%; width: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 15% 20px; box-sizing: border-box; text-align: center; color: white; font-family: sans-serif; }
        .phone-btn { width: 80px; height: 80px; border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .phone-btn.decline { background-color: #ff3b30; }
        .phone-btn.accept { background-color: #4cd964; }
        .phone-btn svg { width: 40px; height: 40px; fill: white; }
        .pulse { animation: pulse-anim 1.5s infinite; }
        @keyframes pulse-anim { 0% { box-shadow: 0 0 0 0px rgba(76, 217, 100, 0.5); } 100% { box-shadow: 0 0 0 30px rgba(76, 217, 100, 0); } }
        #call-screen { position: absolute; inset: 0; z-index: 800; background: #000; display: none; }
    </style>
</head>
<body>
    <div id="loading" class="loading-screen"><div id="loading-text" class="text-purple-400 font-bold uppercase text-sm mb-6">Betöltés...</div></div>
    <div id="qr-layer"><div id="qr-reader"></div><button onclick="stopQR(true)" class="action-btn mt-6 !w-auto !flex-none px-12">MÉGSE</button></div>
    <div id="zoom-viewer" onclick="closeZoom(false)"><img id="zoom-img" src="" onclick="event.stopPropagation()"></div>
    <div id="hint-modal">
        <div class="modal-box">
            <div id="hint-step-confirm">
                <h3 class="text-xl font-bold mb-4 uppercase text-cyan-400">Segítség kérése</h3>
                <p class="text-slate-400 mb-8">Biztosan látni akarod a következő segítséget?</p>
                <div class="flex gap-4">
                    <button onclick="closeHintModal()" class="flex-1 bg-slate-700 p-3 rounded-xl font-bold uppercase text-xs">Mégse</button>
                    <button id="hint-show-btn" class="flex-1 bg-purple-600 p-3 rounded-xl font-bold uppercase text-xs">Igen, kérem</button>
                </div>
            </div>
            <div id="hint-display-area" class="hidden">
                <h3 class="text-xl font-bold mb-4 uppercase text-purple-400">Útmutatás</h3>
                <div id="hint-content-text" class="text-white text-lg font-bold mb-8 italic"></div>
                <button onclick="closeHintModal()" class="w-full bg-cyan-600 p-3 rounded-xl font-bold uppercase text-xs">Értem</button>
            </div>
        </div>
    </div>
    <div class="game-wrapper">
        <div id="viewport">
            <img id="bg-layer" src="">
            <div id="splash-screen"><div id="splash-text" class="text-white text-center p-6 splash-text-anim text-4xl"></div></div>
            <div id="call-screen">
                <div class="phone-ui">
                    <div class="mt-20"><p class="text-sm uppercase tracking-widest opacity-60">Bejövő hívás</p><h1 id="call-name" class="text-4xl mt-2">Ismeretlen</h1><p class="mt-2 opacity-50">Magyarország</p></div>
                    <div id="call-status" class="hidden text-emerald-400 text-xl font-light mb-20">Hívás folyamatban...</div>
                    <div id="call-btns" class="flex justify-around pb-20 w-full max-w-md mx-auto">
                        <button onclick="endCall()" class="phone-btn decline"><svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z" transform="rotate(135 12 12)"/></svg></button>
                        <button onclick="answerCall()" class="phone-btn accept pulse"><svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg></button>
                    </div>
                </div>
            </div>
            <div id="inventory-overlay"><h2 class="text-center text-cyan-400 font-bold mb-8 uppercase tracking-widest">Hátizsák</h2><div id="item-list" class="item-grid"></div></div>
            <div id="content-layer">
                <div class="dialog-box">
                    <img id="avatar-img" class="avatar-frame" src="">
                    <div id="scroll-area" class="overflow-y-auto pr-1 flex-grow">
                        <img id="page-illustration" class="w-full rounded-xl mb-4 hidden shadow-xl" src="">
                        <div id="story-text"></div>
                        <div id="gps-monitor" class="gps-monitor" style="display:none;">
                            <div class="text-[10px] text-cyan-500 uppercase font-bold tracking-widest mb-1">Célpont távolsága</div>
                            <div class="text-3xl font-bold text-white"><span id="live-dist">...</span> <span class="text-sm opacity-50">méter</span></div>
                            <div id="gps-hint" class="text-[10px] text-slate-400 mt-2 italic">Menj közelebb! (20m)</div>
                        </div>
                    </div>
                    <div id="button-container" class="mt-4 flex flex-col gap-3"></div>
                </div>
            </div>
        </div>
        <div class="bottom-nav">
            <button id="nav-map" class="nav-item active" onclick="switchView('map')"><i class="fa fa-map-marked-alt"></i></button>
            <button id="nav-inv" class="nav-item" onclick="switchView('inv')"><i class="fa-solid fa-briefcase"></i><div id="inv-badge" class="badge hidden">0</div></button>
            <button class="nav-item" onclick="resetGame()"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="nav-item" onclick="toggleFullscreen()"><i class="fa fa-expand"></i></button>
        </div>
    </div>
    <audio id="ringtone-audio" loop></audio>
    <audio id="voice-audio"></audio>

        function updateUI() { clearTimeout(sTimer); stopAudio(); const p = config.storyPages[simIdx]; if(!p) return; const splash = document.getElementById('splash-screen'); const call = document.getElementById('call-screen'); const layer = document.getElementById('content-layer'); const nav = document.querySelector('.bottom-nav'); const bg = document.getElementById('bg-layer'); splash.classList.add('hidden'); call.style.display = 'none'; layer.classList.remove('hidden'); nav.style.display = 'flex'; if (p.pageType === 'splash') { splash.classList.remove('hidden'); nav.style.display = 'none'; layer.classList.add('hidden'); const st = document.getElementById('splash-text'); st.textContent = p.content || ""; st.style.animation = 'none'; void st.offsetWidth; st.style.animation = 'fadeInOutSplash 10s ease-in-out forwards'; sTimer = setTimeout(() => { if(p.redirectUrl) window.open(p.redirectUrl, '_blank'); else { simIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : simIdx + 1; updateUI(); } }, 10500); } else if (p.pageType === 'call') { splash.style.display = 'none'; call.style.display = 'block'; layer.classList.add('hidden'); nav.style.display = 'none'; document.getElementById('call-name').textContent = p.content || "Ismeretlen"; document.getElementById('call-btns').style.display = 'flex'; document.getElementById('call-status').style.display = 'none'; const r = document.getElementById('ringtone-audio'); r.src = p.ringtoneUrl || "https://cdn.pixabay.com/audio/2022/03/15/audio_73663a7587.mp3"; r.play().catch(e => {}); } else { handleReward(p); bg.style.opacity = 0; setTimeout(() => { bg.src = p.pageBg || config.globalBg || ""; bg.style.opacity = 1; }, 200); let text = p.content || ""; const avImg = document.getElementById('avatar-img'); avImg.style.display = 'none'; config.avatars.forEach(av => { if(text.includes('§'+av.id)) { avImg.src = av.url || ""; avImg.style.display = av.url ? 'block' : 'none'; avImg.style.borderColor = av.color; text = text.replace(new RegExp('§'+av.id, 'g'), '<span style="color:'+av.color+'">'+av.name+':</span>'); } }); document.getElementById('story-text').innerHTML = text; const ill = document.getElementById('page-illustration'); if(p.pageImage) { ill.src = p.pageImage; ill.classList.remove('hidden'); } else { ill.classList.add('hidden'); } document.getElementById('gps-monitor').style.display = (p.pageType === 'gps' ? 'block' : 'none'); const container = document.getElementById('button-container'); container.innerHTML = ''; if(p.pageType === 'qr') addBtn("QR BEOLVASÁSA", startQR, "fa-camera"); else if(p.pageType === 'password') { if(p.hints) { const h = document.createElement('button'); h.className = "bg-transparent text-cyan-400 text-4xl mb-4 mx-auto block"; h.innerHTML = '<i class="fa-solid fa-circle-question"></i>'; h.onclick = () => openHintModal(p.hints); container.appendChild(h); } const inp = document.createElement('input'); inp.className = "w-full bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-lg text-center font-bold text-2xl mb-2"; inp.placeholder = "KÓD..."; container.appendChild(inp); addBtn("NYITÁS", () => { if(inp.value.trim().toLowerCase() == (p.password||"").toLowerCase()) { simIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : simIdx + 1; currentHint = 0; updateUI(); } }); } else if(p.pageType === 'choice' && p.choices) { p.choices.forEach(c => { if (c.req && !inventory.find(i => i.name.toLowerCase() === c.req.toLowerCase())) return; addBtn(c.text, () => { simIdx = parseInt(c.target); currentHint = 0; updateUI(); }); }); } if(p.pageType === 'gps' && p.mapLink) { const m = document.createElement('button'); m.className = "action-btn bg-cyan-700 mb-2"; m.innerHTML = 'TÉRKÉP MEGNYITÁSA'; m.onclick = () => window.open(p.mapLink, '_blank'); container.appendChild(m); } const navRow = document.createElement('div'); navRow.className = "flex gap-3 w-full"; if(simIdx > 0 || (p.prevIdx !== "" && p.prevIdx !== undefined)) { const b = document.createElement('button'); b.className = "action-btn btn-back"; b.innerHTML = "VISSZA"; b.onclick = () => { simIdx = (p.prevIdx !== "" && p.prevIdx !== undefined) ? parseInt(p.prevIdx) : simIdx - 1; currentHint = 0; updateUI(); }; navRow.appendChild(b); } if(p.pageType !== 'choice' && p.pageType !== 'password' && p.pageType !== 'qr' && p.pageType !== 'gps') { const b = document.createElement('button'); b.className = "action-btn"; b.innerHTML = "TOVÁBB"; b.onclick = () => { if(p.redirectUrl) window.open(p.redirectUrl, '_blank'); else { simIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : simIdx + 1; currentHint = 0; updateUI(); } }; navRow.appendChild(b); } if(navRow.hasChildNodes()) container.appendChild(navRow); } updateGps(); }
        function addBtn(text, fn, icon) { const b = document.createElement('button'); b.className = "action-btn"; b.innerHTML = text + (icon ? ' <i class="fa '+icon+' ml-2 opacity-50"></i>' : ''); b.onclick = fn; document.getElementById('button-container').appendChild(b); }
        function handleReward(p) { if (p.rewards && p.rewards.length > 0) { p.rewards.forEach(r => { if (r.name && !inventory.find(i => i.name === r.name)) { inventory.push({ name: r.name, icon: r.icon || '📦', url: r.url || '', seen: false }); } }); } updateBadge(); }
        function updateBadge() { const b = document.getElementById('inv-badge'), u = inventory.filter(i => !i.seen).length; b.textContent = u; b.classList.toggle('hidden', u === 0); }
        function switchView(t) { const inv = document.getElementById('inventory-overlay'), nI = document.getElementById('nav-inv'), nM = document.getElementById('nav-map'); if (t === 'inv') { if (inv.style.display === 'block') { inv.style.display = 'none'; nI.classList.remove('active'); nM.classList.add('active'); } else { renderInv(); inv.style.display = 'block'; nI.classList.add('active'); nM.classList.remove('active'); } } else if (t === 'map') { if (config.initialMapLink) window.open(config.initialMapLink, '_blank'); inv.style.display = 'none'; nI.classList.remove('active'); nM.classList.add('active'); } }
        function renderInv() { const list = document.getElementById('item-list'); list.innerHTML = ''; inventory.forEach(item => { const d = document.createElement('div'); d.className = "item-card"; d.innerHTML = item.url ? '<img src="'+item.url+'">' : '<div class="text-4xl mb-2">'+item.icon+'</div>'; d.innerHTML += '<div class="text-[10px] font-bold text-white uppercase">'+item.name+'</div>'; if(!item.seen) d.innerHTML += '<div class="item-unread-dot"></div>'; d.onclick = () => { if(item.url) openZoom(item.url); item.seen = true; updateBadge(); renderInv(); }; list.appendChild(d); }); }
        function openZoom(url) { zoomActive = true; zoomScale = 1; const v = document.getElementById('zoom-viewer'), i = document.getElementById('zoom-img'); i.src = url; i.style.transform = 'scale(1)'; v.style.display = 'flex'; }
        function closeZoom() { zoomActive = false; document.getElementById('zoom-viewer').style.display = 'none'; }
        function openHintModal(hints) { const m = document.getElementById('hint-modal'); const conf = document.getElementById('hint-step-confirm'); const disp = document.getElementById('hint-display-area'); const btn = document.getElementById('hint-show-btn'); conf.classList.remove('hidden'); disp.classList.add('hidden'); m.style.display = 'flex'; btn.onclick = () => { const list = hints.split('\n').filter(h => h.trim()); const text = list[Math.min(currentHint, list.length-1)]; document.getElementById('hint-content-text').textContent = text; conf.classList.add('hidden'); disp.classList.remove('hidden'); currentHint++; }; }
        function closeHintModal() { document.getElementById('hint-modal').style.display = 'none'; }
        function startQR() { document.getElementById('qr-layer').style.display = 'flex'; qrScanner = new Html5Qrcode("qr-reader"); qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => { const p = config.storyPages[simIdx]; if (txt.trim().toUpperCase() === (p.qrCode || "").trim().toUpperCase()) { stopQR(false, () => { simIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : simIdx + 1; updateUI(); }); } }).catch(() => stopQR(true)); }
        function stopQR(manual, cb) { if (!qrScanner) { document.getElementById('qr-layer').style.display = 'none'; if(cb) cb(); return; } qrScanner.stop().finally(() => { document.getElementById('qr-layer').style.display = 'none'; qrScanner = null; if(cb) cb(); }); }
        function resetGame() { if(confirm("Biztosan újrakezded?")) { simIdx = 0; inventory = []; updateUI(); switchView('map'); } }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        window.onload = initGame;
    </script>
