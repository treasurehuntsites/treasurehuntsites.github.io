<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title>Kaland Játék Player V8.6 ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #eee; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .play-font { font-family: 'Play', sans-serif; }
        
        /* Mobil Szimulátor Keret */
        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.2);
        }

        @media (min-width: 640px) {
            .game-container {
                height: 90vh;
                border: 8px solid #222;
                border-radius: 2.5rem;
                overflow: hidden;
            }
        }

        #game-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #111; }
        #game-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); z-index: 0; transition: opacity 0.5s; }
        #game-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; padding-bottom: 30px; }
        
        /* Szövegdoboz és Avatar */
        .sim-box { 
            position: relative;
            background: rgba(0,0,0,0.85); 
            border: 2px solid #8a2be2; 
            border-radius: 1rem; 
            padding: 15px; 
            min-height: 160px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }
        
        .sim-avatar { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            border: 2px solid #00ffff; 
            background: #000; 
            z-index: 20; 
            object-fit: cover; 
            display: none; 
        }

        #sim-text { transition: padding 0.2s; font-size: 14px; line-height: 1.6; }

        /* Gombok */
        .sim-btn { flex: 1; background: #8a2be2; color: white; padding: 10px; border-radius: 0.5rem; font-weight: bold; text-align: center; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; border: none; }
        .sim-btn:hover { background: #a855f7; transform: scale(1.02); }
        .sim-btn-cyan { background: #00ffff; color: #000; }
        .sim-btn-secondary { background: #333; }
        
        /* Alsó Navigáció */
        .bottom-bar { height: 60px; background: #1a1a1a; border-top: 2px solid #8a2be2; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .menu-btn { color: #888; font-size: 1.4rem; cursor: pointer; transition: 0.2s; border: none; background: none; }
        .menu-btn.active { color: #8a2be2; text-shadow: 0 0 10px rgba(138, 43, 226, 0.6); }

        /* Diszkrét Vissza Nyíl */
        .sim-back-arrow {
            color: #666;
            cursor: pointer;
            font-size: 1.3rem;
            margin-bottom: 10px;
            width: fit-content;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }
        .sim-back-arrow:hover { color: #8a2be2; }

        /* Jelszó Beviteli Mező */
        .sim-input { background: rgba(255,255,255,0.08); border: 1px solid #444; color: #fff; border-radius: 6px; padding: 10px; font-size: 14px; outline: none; transition: 0.3s; width: 100%; margin-bottom: 10px; }
        .sim-input:focus { border-color: #8a2be2; background: rgba(255,255,255,0.12); }
        
        /* Súgó Kör Gomb */
        .hint-circle-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            margin: 0 auto 10px auto;
            color: #aaa;
        }
        .hint-circle-btn:hover { border-color: #8a2be2; color: #fff; background: rgba(138, 43, 226, 0.2); }

        /* Inventory Overlay */
        #inventory-view { position: absolute; inset: 0; background: #111; z-index: 50; display: none; padding: 20px; padding-top: 60px; overflow-y: auto; }
        .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .inv-item-card { background: #222; border: 1px solid #333; border-radius: 12px; overflow: hidden; text-align: center; }
        .inv-item-img { width: 100%; height: 100px; object-fit: cover; }
        .inv-item-name { font-size: 12px; padding: 8px; color: #ccc; font-weight: 600; }

        /* Indító Képernyő */
        #start-screen { position: absolute; inset: 0; z-index: 1000; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        
        /* Karakter Színek */
        .anna-txt { color: #ff69b4; } .mark-txt { color: #4169e1; } .sys-txt { color: #00ffff; font-style: italic; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Kezdőképernyő / Betöltés -->
        <div id="start-screen">
            <i class="fa fa-shuttle-space text-5xl text-purple-500 mb-6"></i>
            <h1 id="game-title" class="text-2xl font-bold mb-4 uppercase tracking-widest">Kaland Játék</h1>
            <p id="start-msg" class="text-gray-400 text-sm mb-8">Konfiguráció betöltése...</p>
            <input type="file" id="file-input" class="hidden" accept=".json" onchange="handleFileSelect(event)">
            <button id="upload-btn" onclick="document.getElementById('file-input').click()" class="sim-btn w-full max-w-xs mb-4 hidden">
                <i class="fa fa-upload mr-2"></i> Konfiguráció Kiválasztása
            </button>
        </div>

        <div id="game-viewport">
            <img id="game-bg" src="">
            
            <div id="game-content">
                <div class="sim-box play-font">
                    <img id="sim-avatar" class="sim-avatar" src="">
                    <div id="sim-text-header" class="flex flex-col"></div>
                    <div id="sim-text" class="text-white flex-grow overflow-y-auto pr-1"></div>
                    <div id="sim-actions" class="mt-4 flex flex-row gap-2"></div>
                </div>
            </div>

            <!-- Inventory Nézet -->
            <div id="inventory-view" class="play-font">
                <h2 class="text-purple-400 font-bold text-center mb-6 uppercase tracking-wider">Tárgyaid</h2>
                <div id="inv-grid" class="inv-grid"></div>
                <p id="inv-empty" class="text-gray-600 text-center mt-20 italic">Még üres az eszköztárad.</p>
            </div>
        </div>

        <!-- Alsó Menü -->
        <div class="bottom-bar">
            <button class="menu-btn active" id="btn-home" onclick="switchView('game')">
                <i class="fa fa-house"></i>
            </button>
            <button class="menu-btn" id="btn-map" onclick="openMap()">
                <i class="fa-solid fa-map-location-dot"></i>
            </button>
            <button class="menu-btn" id="btn-inv" onclick="switchView('inventory')">
                <i class="fa-solid fa-briefcase"></i>
            </button>
        </div>
    </div>

    <script>
        let gameConfig = null;
        let currentIdx = 0;
        let hintIdx = 0;
        let gpsWatchId = null;

        // Automatikus betöltés az oldal indulásakor
        window.onload = () => {
            fetch('game_config.json')
                .then(response => {
                    if (!response.ok) throw new Error("Fájl nem található");
                    return response.json();
                })
                .then(data => {
                    gameConfig = data;
                    startGame();
                })
                .catch(err => {
                    console.log("Nincs automatikus konfiguráció, manuális feltöltés szükséges.");
                    document.getElementById('start-msg').textContent = "Töltsd be a játékfájlt a kezdéshez";
                    document.getElementById('upload-btn').classList.remove('hidden');
                });
        };

        // Manuális fájlválasztás kezelése
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    gameConfig = JSON.parse(e.target.result);
                    startGame();
                } catch (err) {
                    alert("Hiba: Érvénytelen JSON fájl!");
                }
            };
            reader.readAsText(file);
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-title').textContent = gameConfig.appTitle || "Kaland Játék";
            currentIdx = 0;
            updateUI();
        }

        function switchView(view) {
            const invView = document.getElementById('inventory-view');
            const homeBtn = document.getElementById('btn-home');
            const invBtn = document.getElementById('btn-inv');

            if (view === 'inventory') {
                invView.style.display = 'block';
                invBtn.classList.add('active');
                homeBtn.classList.remove('active');
                renderInventory();
            } else {
                invView.style.display = 'none';
                homeBtn.classList.add('active');
                invBtn.classList.remove('active');
            }
        }

        function openMap() {
            if (gameConfig && gameConfig.mapUrl) {
                window.open(gameConfig.mapUrl, '_blank');
            }
        }

        function updateUI() {
            if (gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
            const p = gameConfig.storyPages[currentIdx];
            if (!p) return;

            document.getElementById('game-bg').src = p.pageBg || gameConfig.globalBg || "";
            const formattedText = p.content
                .replace(/§A/g, '<span class="anna-txt font-bold">Anna:</span>')
                .replace(/§M/g, '<span class="mark-txt font-bold">Márk:</span>')
                .replace(/§R/g, '<span class="sys-txt font-bold">[Rendszer]:</span>');
            
            const simText = document.getElementById('sim-text');
            simText.innerHTML = formattedText;

            const av = document.getElementById('sim-avatar');
            av.style.display = 'none';
            simText.style.paddingLeft = "0px";

            if (p.content.includes("§A") && gameConfig.annaAvatar) {
                av.src = gameConfig.annaAvatar;
                av.style.display = 'block';
                simText.style.paddingLeft = "60px";
            } else if (p.content.includes("§M") && gameConfig.markAvatar) {
                av.src = gameConfig.markAvatar;
                av.style.display = 'block';
                simText.style.paddingLeft = "60px";
            }

            const header = document.getElementById('sim-text-header');
            const actions = document.getElementById('sim-actions');
            header.innerHTML = '';
            actions.innerHTML = '';

            const hasBack = currentIdx > 0 || (p.prevIdx !== undefined && p.prevIdx !== "");
            const goBack = () => { 
                currentIdx = (p.prevIdx !== undefined && p.prevIdx !== "") ? parseInt(p.prevIdx) : currentIdx - 1; 
                hintIdx = 0;
                updateUI(); 
            };

            if (hasBack) {
                if (p.pageType === 'choice' || p.pageType === 'password') {
                    const arrow = document.createElement('div');
                    arrow.className = "sim-back-arrow";
                    if (av.style.display === 'block') arrow.style.marginLeft = "60px";
                    arrow.innerHTML = '<i class="fa fa-chevron-left mr-1"></i>';
                    arrow.onclick = goBack;
                    header.appendChild(arrow);
                } else {
                    const bBack = document.createElement('div');
                    bBack.className = "sim-btn sim-btn-secondary";
                    bBack.textContent = "Vissza";
                    bBack.onclick = goBack;
                    actions.appendChild(bBack);
                }
            }

            if (p.pageType === 'choice' && p.choices) {
                const wrapper = document.createElement('div');
                wrapper.className = "flex flex-col gap-2 flex-grow";
                p.choices.forEach(c => {
                    const b = document.createElement('div');
                    b.className = "sim-btn";
                    b.textContent = c.text;
                    b.onclick = () => { currentIdx = parseInt(c.target); hintIdx = 0; updateUI(); };
                    wrapper.appendChild(b);
                });
                actions.appendChild(wrapper);
            } 
            else if (p.pageType === 'password') {
                const passWrap = document.createElement('div');
                passWrap.className = "flex flex-col gap-1 flex-grow items-center";

                const hintBtn = document.createElement('div');
                hintBtn.className = "hint-circle-btn";
                hintBtn.innerHTML = '<i class="fa fa-question text-xs"></i>';
                hintBtn.onclick = () => {
                    if (p.hints && p.hints.length > 0) {
                        const hint = p.hints[hintIdx % p.hints.length];
                        const msg = document.createElement('div');
                        msg.className = "text-[11px] text-cyan-400 mb-2 italic text-center hint-msg";
                        msg.innerHTML = `Tipp: ${hint}`;
                        const old = passWrap.querySelector('.hint-msg');
                        if (old) old.remove();
                        passWrap.insertBefore(msg, input);
                        hintIdx++;
                    }
                };
                passWrap.appendChild(hintBtn);

                const input = document.createElement('input');
                input.className = "sim-input";
                input.placeholder = "Írd be a megfejtést...";
                input.id = "p-input";
                passWrap.appendChild(input);

                const okBtn = document.createElement('div');
                okBtn.className = "sim-btn w-full";
                okBtn.textContent = "Ellenőrzés";
                okBtn.onclick = () => {
                    const v = document.getElementById('p-input').value.trim().toLowerCase();
                    const sol = (p.password || "").trim().toLowerCase();
                    if (v === sol) {
                        currentIdx = parseInt(p.nextIdx || currentIdx + 1);
                        hintIdx = 0;
                        updateUI();
                    } else {
                        document.getElementById('p-input').style.borderColor = "red";
                        setTimeout(() => document.getElementById('p-input').style.borderColor = "", 1000);
                    }
                };
                passWrap.appendChild(okBtn);
                actions.appendChild(passWrap);
            }
            else if (p.pageType === 'gps') {
                const gpsWrap = document.createElement('div');
                gpsWrap.className = "flex flex-col gap-2 flex-grow";
                const distBox = document.createElement('div');
                distBox.className = "text-center p-3 bg-black/60 rounded-lg border border-cyan-500/30 text-xs";
                distBox.innerHTML = `Távolság: <span id="gps-dist" class="font-bold text-cyan-400 text-lg ml-2">-- m</span>`;
                gpsWrap.appendChild(distBox);

                const testBtn = document.createElement('div');
                testBtn.className = "sim-btn sim-btn-cyan";
                testBtn.textContent = "Cél elérése (Szimuláció)";
                testBtn.onclick = () => { currentIdx = parseInt(p.nextIdx || currentIdx + 1); updateUI(); };
                gpsWrap.appendChild(testBtn);
                actions.appendChild(gpsWrap);

                if (navigator.geolocation) {
                    gpsWatchId = navigator.geolocation.watchPosition(pos => {
                        const d = calculateDistance(pos.coords.latitude, pos.coords.longitude, parseFloat(p.targetLat), parseFloat(p.targetLon));
                        const el = document.getElementById('gps-dist');
                        if (el) el.textContent = `${Math.round(d)} m`;
                        if (d < 25) { 
                            navigator.geolocation.clearWatch(gpsWatchId); 
                            currentIdx = parseInt(p.nextIdx || currentIdx + 1); 
                            updateUI(); 
                        }
                    }, null, { enableHighAccuracy: true });
                }
            } else {
                const bNext = document.createElement('div');
                bNext.className = "sim-btn";
                bNext.textContent = "Tovább";
                bNext.onclick = () => { currentIdx = parseInt(p.nextIdx || currentIdx + 1); updateUI(); };
                actions.appendChild(bNext);
            }
        }

        function calculateDistance(la1, lo1, la2, lo2) {
            const R = 6371e3; 
            const f1 = la1 * Math.PI / 180;
            const f2 = la2 * Math.PI / 180;
            const df = (la2 - la1) * Math.PI / 180;
            const dl = (lo2 - lo1) * Math.PI / 180;
            const a = Math.sin(df/2) * Math.sin(df/2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function renderInventory() {
            const grid = document.getElementById('inv-grid');
            const empty = document.getElementById('inv-empty');
            grid.innerHTML = '';
            if (!gameConfig || !gameConfig.inventory || gameConfig.inventory.length === 0) {
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';
                gameConfig.inventory.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "inv-item-card";
                    card.innerHTML = `<img src="${item.url}" class="inv-item-img" onerror="this.src='https://placehold.co/150x100?text=Err'"><div class="inv-item-name">${item.name}</div>`;
                    grid.appendChild(card);
                });
            }
        }
    </script>
</body>
</html>
