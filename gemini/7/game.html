<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaland Játék Lejátszó V9.6 ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Play', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Fő konténer */
        .game-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 900px;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }

        /* Játéktér - a menü feletti rész */
        #viewport {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        /* Fix teljes képernyős háttér (nem nagyítható) */
        .bg-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        #game-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.4);
            transition: opacity 0.5s ease-in-out;
        }

        #ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            pointer-events: none;
        }

        .dialog-box {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.94);
            border-top: 3px solid #8b5cf6;
            border-radius: 2rem 2rem 0 0;
            padding: 25px;
            padding-top: 45px;
            min-height: 35%;
            max-height: 60%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -15px 40px rgba(0,0,0,0.9);
            position: relative;
        }

        .avatar-frame {
            position: absolute;
            top: -40px;
            left: 25px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #8b5cf6;
            background: #000;
            z-index: 20;
            overflow: hidden;
            display: none;
        }
        .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }

        .btn-game {
            background: #8b5cf6;
            color: white;
            padding: 14px;
            border-radius: 1rem;
            font-weight: 700;
            text-align: center;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-shadow: 0 4px 0 #6d28d9;
        }
        .btn-game:active { transform: translateY(2px); box-shadow: 0 2px 0 #6d28d9; }
        .btn-back { background: #334155; box-shadow: 0 4px 0 #1e293b; }

        /* Alsó menü - Mindig látható */
        .bottom-nav {
            height: 75px;
            background: #0f172a;
            border-top: 1px solid rgba(139, 92, 246, 0.3);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 500; /* Legfelül legyen */
        }

        .nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; position: relative; transition: 0.3s; }
        .nav-item.active { color: #8b5cf6; transform: scale(1.1); }
        .nav-badge { position: absolute; top: -6px; right: -10px; background: #ef4444; color: white; font-size: 10px; padding: 2px 7px; border-radius: 50%; font-weight: bold; border: 2px solid #0f172a; }

        /* Képernyő Fedőrétegek - csak a viewportot takarják */
        .screen-overlay {
            position: absolute;
            inset: 0;
            background: #0f172a;
            z-index: 300;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
        }

        #start-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #1e1b4b, #020617);
        }

        .qr-overlay {
            background: rgba(0,0,0,0.98);
            justify-content: center;
            align-items: center;
            display: none;
            z-index: 400;
        }

        #reader-wrapper {
            width: 260px;
            height: 260px;
            border: 2px solid #22d3ee;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
            background: #000;
        }
        #reader { width: 100%; height: 100%; }
        .scan-line {
            position: absolute;
            top: 0; width: 100%; height: 3px; background: #22d3ee;
            box-shadow: 0 0 15px #22d3ee;
            animation: scan-move 2.5s linear infinite;
            z-index: 10;
        }
        @keyframes scan-move { 0%, 100% { top: 0; } 50% { top: 100%; } }

        .inv-item { background: #1e293b; border-radius: 1rem; padding: 20px; text-align: center; border: 1px solid #334155; }

        .gps-status-box {
            background: rgba(34, 211, 238, 0.15);
            border: 2px solid #22d3ee;
            border-radius: 1rem;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-dark {
            background: #020617;
            border: 2px solid #334155;
            color: #22d3ee;
            border-radius: 1rem;
            padding: 15px;
            width: 100%;
            outline: none;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .fade-text { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- JÁTÉKTÉR -->
        <div id="viewport">
            
            <div class="bg-layer">
                <img id="game-bg" src="" draggable="false">
            </div>

            <!-- KEZDŐ KÉPERNYŐ -->
            <div id="start-screen" class="screen-overlay">
                <div class="mb-8">
                    <i class="fa-solid fa-map-location-dot text-7xl text-purple-500 animate-bounce"></i>
                </div>
                <h1 id="game-title-display" class="text-3xl font-bold mb-4 tracking-tighter">KALAND JÁTÉK</h1>
                <p class="text-slate-400 text-sm mb-12 px-6 text-center">Töltsd be a JSON fájlt a kezdéshez!</p>
                
                <label class="btn-game cursor-pointer w-full max-w-xs">
                    <i class="fa fa-file-import mr-2"></i> JÁTÉK BETÖLTÉSE
                    <input type="file" id="json-upload" class="hidden" accept=".json">
                </label>
            </div>
            
            <!-- QR SZKENNER -->
            <div id="qr-screen" class="screen-overlay qr-overlay">
                <div id="reader-wrapper">
                    <div id="reader"></div>
                    <div class="scan-line"></div>
                </div>
                <h3 class="text-cyan-400 font-bold mt-8 mb-2">QR KÓD OLVASÁSA</h3>
                <div class="w-full max-w-xs px-4 mt-8">
                    <button onclick="hideQR()" class="btn-game btn-back">MÉGSE</button>
                </div>
            </div>

            <!-- ESZKÖZTÁR -->
            <div id="inventory-screen" class="screen-overlay hidden">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-bold text-cyan-400 tracking-tighter">🎒 HÁTIZSÁK</h2>
                    <button onclick="toggleInventory()" class="text-slate-500"><i class="fa fa-times text-2xl"></i></button>
                </div>
                <div id="inventory-list" class="grid grid-cols-2 gap-4"></div>
                <div id="empty-inventory" class="flex flex-col items-center justify-center py-20 text-slate-600 italic">
                    <p>A táskád jelenleg üres.</p>
                </div>
            </div>

            <!-- JÁTÉK UI (Szövegbox) -->
            <div id="ui-layer" class="hidden">
                <div class="dialog-box">
                    <div id="avatar-container" class="avatar-frame">
                        <img id="avatar-img" src="">
                    </div>
                    
                    <div id="scroll-area" class="overflow-y-auto mb-6 flex-grow scroll-smooth pr-1">
                        <img id="page-illustration" class="w-full rounded-2xl mb-5 hidden border-2 border-slate-800 shadow-2xl" src="">
                        
                        <div id="gps-info" class="hidden gps-status-box">
                            <div class="text-[10px] uppercase tracking-widest text-cyan-500 font-bold mb-1">Célpont távolsága</div>
                            <div id="gps-distance-text" class="text-3xl font-bold text-white">--- m</div>
                        </div>

                        <div id="story-text-content" class="text-white text-[15px] leading-relaxed fade-text"></div>
                    </div>

                    <div id="actions-box" class="flex flex-col gap-3"></div>
                </div>
            </div>
        </div>

        <!-- ALSÓ MENÜ - MINDIG LÁTSZIK -->
        <div id="navigation-bar" class="bottom-nav">
            <div class="nav-item active" onclick="closeOverlays()"><i class="fa fa-location-dot"></i></div>
            <div class="nav-item" onclick="toggleInventory()">
                <i class="fa-solid fa-briefcase"></i>
                <div id="inventory-badge" class="nav-badge hidden">0</div>
            </div>
            <div class="nav-item" onclick="confirmRestart()"><i class="fa-solid fa-rotate-right"></i></div>
        </div>
    </div>

    <script>
        let gameData = null;
        let gameState = {
            currentIndex: 0,
            inventory: [],
            gpsWatcher: null,
            qrScanner: null
        };

        // --- FÁJL BETÖLTÉS ---
        document.getElementById('json-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    gameData = JSON.parse(event.target.result);
                    initGame();
                } catch(err) {
                    alert("Hiba: Érvénytelen játékfájl!");
                }
            };
            reader.readAsText(file);
        });

        function initGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');
            document.title = gameData.appTitle || "Kaland Játék";
            document.getElementById('game-title-display').textContent = gameData.appTitle;
            renderCurrentPage();
        }

        function renderCurrentPage() {
            if (gameState.gpsWatcher) {
                navigator.geolocation.clearWatch(gameState.gpsWatcher);
                gameState.gpsWatcher = null;
            }

            const page = gameData.storyPages[gameState.currentIndex];
            if (!page) return;

            // Háttér beállítása
            const bgImg = document.getElementById('game-bg');
            bgImg.src = gameData.globalBg || "";

            const illust = document.getElementById('page-illustration');
            if (page.pageImage) {
                illust.src = page.pageImage;
                illust.classList.remove('hidden');
            } else {
                illust.classList.add('hidden');
            }

            // Szöveg és Avatar
            let rawText = page.content || "";
            const avatarBox = document.getElementById('avatar-container');
            avatarBox.style.display = 'none';

            if (gameData.avatars) {
                gameData.avatars.forEach(av => {
                    if (rawText.includes(`§${av.id}`)) {
                        const avatarImg = document.getElementById('avatar-img');
                        avatarImg.src = av.url || "";
                        avatarBox.style.display = av.url ? 'block' : 'none';
                        avatarBox.style.borderColor = av.color || "#8b5cf6";
                        rawText = rawText.replace(new RegExp(`§${av.id}`, 'g'), 
                            `<span style="color:${av.color || '#8b5cf6'}; font-weight:bold; text-transform:uppercase; font-size:12px;">${av.name}:</span>`);
                    }
                });
            }
            
            const textContent = document.getElementById('story-text-content');
            textContent.innerHTML = rawText;
            textContent.classList.remove('fade-text');
            void textContent.offsetWidth; 
            textContent.classList.add('fade-text');

            document.getElementById('scroll-area').scrollTop = 0;

            const actions = document.getElementById('actions-box');
            actions.innerHTML = '';
            document.getElementById('gps-info').classList.add('hidden');

            const buttonWrapper = document.createElement('div');
            buttonWrapper.className = "flex flex-col gap-3";
            actions.appendChild(buttonWrapper);

            if (page.pageType === 'choice' && page.choices) {
                page.choices.forEach(c => {
                    const btn = document.createElement('div');
                    btn.className = "btn-game";
                    btn.textContent = c.text;
                    btn.onclick = () => goToPage(parseInt(c.target));
                    buttonWrapper.appendChild(btn);
                });
            } else if (page.pageType === 'qr') {
                const btn = document.createElement('div');
                btn.className = "btn-game bg-cyan-600";
                btn.innerHTML = '<i class="fa fa-camera mr-2"></i> QR KÓD BEOLVASÁSA';
                btn.onclick = showQR;
                buttonWrapper.appendChild(btn);
            } else if (page.pageType === 'password') {
                const input = document.createElement('input');
                input.className = "input-dark mb-1";
                input.placeholder = "KÓD...";
                input.type = "text";
                
                const btn = document.createElement('div');
                btn.className = "btn-game";
                btn.textContent = "ELLENŐRZÉS";
                btn.onclick = () => {
                    if (input.value.trim().toLowerCase() === (page.password || "").toLowerCase()) {
                        goToPage(parseInt(page.nextIdx) || gameState.currentIndex + 1);
                    } else {
                        input.style.borderColor = '#ef4444';
                    }
                };
                buttonWrapper.append(input, btn);
            } else if (page.pageType === 'gps') {
                document.getElementById('gps-info').classList.remove('hidden');
                startGPS(page);
                const skipBtn = document.createElement('div');
                skipBtn.className = "btn-game opacity-20 text-[10px] py-1";
                skipBtn.textContent = "GPS ÁTUGRÁSA (TESZT)";
                skipBtn.onclick = () => goToPage(parseInt(page.nextIdx) || gameState.currentIndex + 1);
                buttonWrapper.appendChild(skipBtn);
            } else {
                const btn = document.createElement('div');
                btn.className = "btn-game";
                btn.innerHTML = 'TOVÁBB <i class="fa fa-chevron-right ml-2 text-xs"></i>';
                btn.onclick = () => goToPage(parseInt(page.nextIdx) || gameState.currentIndex + 1);
                buttonWrapper.appendChild(btn);
            }

            if (gameState.currentIndex > 0 || (page.prevIdx !== undefined && page.prevIdx !== null && page.prevIdx !== "")) {
                const backBtn = document.createElement('div');
                backBtn.className = "btn-game btn-back mt-1 py-2 text-xs opacity-80";
                backBtn.innerHTML = '<i class="fa fa-arrow-left mr-2"></i> VISSZALÉPÉS';
                backBtn.onclick = () => {
                    const target = (page.prevIdx !== undefined && page.prevIdx !== null && page.prevIdx !== "") 
                        ? parseInt(page.prevIdx) 
                        : gameState.currentIndex - 1;
                    goToPage(target);
                };
                buttonWrapper.appendChild(backBtn);
            }
        }

        function goToPage(idx) {
            if (isNaN(idx)) return;
            gameState.currentIndex = idx;
            renderCurrentPage();
        }

        function showQR() {
            document.getElementById('qr-screen').style.display = 'flex';
            if (!gameState.qrScanner) gameState.qrScanner = new Html5Qrcode("reader");
            
            gameState.qrScanner.start(
                { facingMode: "environment" }, 
                { fps: 15, qrbox: 200 },
                (text) => processQRResult(text),
                () => {}
            ).catch(err => {
                alert("Kamera hiba: " + err);
                hideQR();
            });
        }

        function hideQR() {
            if (gameState.qrScanner && gameState.qrScanner.isScanning) {
                gameState.qrScanner.stop().then(() => {
                    document.getElementById('qr-screen').style.display = 'none';
                });
            } else {
                document.getElementById('qr-screen').style.display = 'none';
            }
        }

        function processQRResult(text) {
            const page = gameData.storyPages[gameState.currentIndex];
            const target = (page.qrTargetCode || "").trim().toUpperCase();
            
            if (text.trim().toUpperCase() === target) {
                if (page.qrItemName) {
                    gameState.inventory.push({
                        name: page.qrItemName,
                        icon: page.qrItemIcon || '📦',
                        time: new Date().toLocaleTimeString()
                    });
                    updateInventoryUI();
                }
                hideQR();
                setTimeout(() => goToPage(parseInt(page.nextIdx) || gameState.currentIndex + 1), 300);
            } else {
                document.getElementById('reader-wrapper').style.borderColor = '#ef4444';
            }
        }

        function startGPS(page) {
            if (!navigator.geolocation) return;
            gameState.gpsWatcher = navigator.geolocation.watchPosition(pos => {
                const dist = calculateDistance(
                    pos.coords.latitude, pos.coords.longitude,
                    parseFloat(page.targetLat), parseFloat(page.targetLon)
                );
                document.getElementById('gps-distance-text').textContent = `${Math.round(dist)} m`;
                if (dist < 15) {
                    navigator.geolocation.clearWatch(gameState.gpsWatcher);
                    goToPage(parseInt(page.nextIdx) || gameState.currentIndex + 1);
                }
            }, null, { enableHighAccuracy: true });
        }

        function calculateDistance(la1, lo1, la2, lo2) {
            const R = 6371e3;
            const f1 = la1 * Math.PI/180, f2 = la2 * Math.PI/180;
            const df = (la2-la1) * Math.PI/180, dl = (lo2-lo1) * Math.PI/180;
            const a = Math.sin(df/2) * Math.sin(df/2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function toggleInventory() {
            const screen = document.getElementById('inventory-screen');
            const list = document.getElementById('inventory-list');
            const empty = document.getElementById('empty-inventory');
            
            list.innerHTML = '';
            if (gameState.inventory.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                gameState.inventory.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "inv-item";
                    card.innerHTML = `<div class="text-4xl mb-3">${item.icon}</div><div class="text-[10px] font-bold text-white uppercase">${item.name}</div>`;
                    list.appendChild(card);
                });
            }
            screen.classList.toggle('hidden');
            const navItems = document.querySelectorAll('.nav-item');
            navItems[1].classList.toggle('active', !screen.classList.contains('hidden'));
            navItems[0].classList.toggle('active', screen.classList.contains('hidden'));
        }

        function updateInventoryUI() {
            const badge = document.getElementById('inventory-badge');
            badge.textContent = gameState.inventory.length;
            badge.classList.toggle('hidden', gameState.inventory.length === 0);
        }

        function closeOverlays() {
            document.getElementById('inventory-screen').classList.add('hidden');
            document.querySelectorAll('.nav-item')[1].classList.remove('active');
            document.querySelectorAll('.nav-item')[0].classList.add('active');
        }

        function confirmRestart() {
            if (confirm("Biztosan elölről kezded? Minden tárgyad elvész.")) {
                location.reload();
            }
        }
    </script>
</body>
</html>
