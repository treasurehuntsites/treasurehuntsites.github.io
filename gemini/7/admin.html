<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaland Játék Stúdió V8.9 ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Play', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 1rem; }
        .input-style { background: #0f172a; color: #22d3ee; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.6rem; outline: none; transition: 0.2s; width: 100%; }
        .input-style:focus { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; cursor: pointer; transition: 0.2s; }
        .page-item:hover { background: #334155; }
        .page-item.selected { border-color: #22d3ee; background: #4c1d95; }
        .handle { cursor: grab; padding-right: 15px; color: #64748b; font-size: 1.2rem; }
        
        /* Modal Stílusok */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; }
        
        .sim-container { position: sticky; top: 1rem; width: 320px; height: 600px; background: #000; border: 12px solid #1e293b; border-radius: 3rem; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); display: flex; flex-direction: column; }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { position: relative; background: rgba(0,0,0,0.94); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; min-height: 220px; display: flex; flex-direction: column; }
        .sim-btn { flex: 1; background: #8b5cf6; color: white; padding: 12px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        
        #save-indicator { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; font-size: 0.75rem; font-weight: bold; display: none; z-index: 1000; }
        
        .avatar-card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1rem; display: flex; gap: 1rem; align-items: flex-start; }
        .avatar-preview-container { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
        .avatar-preview { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 3px solid #8b5cf6; background: #0f172a; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div id="save-indicator"><i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...</div>

    <!-- Beszúrás Választó Modal (Új kérés) -->
    <div id="insert-modal" class="modal-overlay">
        <div class="glass-card p-8 w-80 text-center border-cyan-500/30">
            <h2 class="text-xl font-bold mb-2 text-white">Oldal Beszúrása</h2>
            <p class="text-slate-400 text-xs mb-6">Hogyan szeretnél új oldalt hozzáadni?</p>
            <div class="flex flex-col gap-3">
                <button onclick="handleInsert('empty')" class="w-full bg-purple-600 hover:bg-purple-500 p-3 rounded-xl font-bold transition-colors text-sm text-white">
                    <i class="fa fa-file-plus mr-2"></i>ÜRES OLDAL
                </button>
                <button onclick="handleInsert('copy')" class="w-full bg-cyan-600 hover:bg-cyan-500 p-3 rounded-xl font-bold transition-colors text-sm text-white">
                    <i class="fa fa-copy mr-2"></i>OLDAL MÁSOLÁSA
                </button>
                <button onclick="closeInsertModal()" class="w-full bg-slate-700 p-3 rounded-xl font-bold text-xs mt-2 text-white">MÉGSE</button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-4xl font-bold uppercase tracking-tighter text-white">Stúdió <span class="text-purple-500">V8.9</span> ✨</h1>
                <p class="text-slate-400 text-sm">Dinamikus történetvezetés & GPS kaland</p>
            </div>
            <div class="flex gap-3">
                <button onclick="downloadConfig()" class="bg-cyan-500 text-slate-900 px-5 py-2.5 rounded-xl font-bold text-xs uppercase hover:bg-cyan-400 transition-colors">Letöltés</button>
                <button onclick="document.getElementById('uploadInput').click()" class="bg-purple-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase hover:bg-purple-500 transition-colors">Betöltés</button>
                <input type="file" id="uploadInput" class="hidden" accept=".json" onchange="handleFileUpload(event)">
            </div>
        </header>

        <div class="flex flex-col lg:flex-row gap-10">
            <div class="flex-1 space-y-8">
                <!-- Alapbeállítások (Eredetivel megegyező) -->
                <div class="glass-card p-8 space-y-4">
                    <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Alapbeállítások</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="space-y-1">
                            <label class="text-[10px] text-slate-500 ml-1">Játék címe</label>
                            <input type="text" id="appTitle" class="input-style" placeholder="Játék címe" oninput="autoSave()">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] text-slate-500 ml-1">Globális Háttér URL</label>
                            <input type="url" id="globalBg" class="input-style" placeholder="Globális Háttér URL" oninput="autoSave()">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] text-slate-500 ml-1">Térkép Kép URL</label>
                            <input type="url" id="mapUrl" class="input-style" placeholder="Térkép Kép URL" oninput="autoSave()">
                        </div>
                    </div>
                </div>

                <!-- Karakterek / Avatarok (Eredeti mezőkkel) -->
                <div class="glass-card p-8 space-y-6">
                    <div class="flex justify-between items-center">
                        <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Karakterek / Avatarok</h3>
                        <button onclick="addAvatar()" class="text-cyan-400 text-[10px] font-bold uppercase">+ ÚJ KARAKTER</button>
                    </div>
                    <div id="avatarAdminList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>

                <!-- Oldal Lista (Beszúrás gombbal kiegészítve) -->
                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Történet Oldalak</h3>
                        <button onclick="addPage()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg text-[10px] font-bold">+ ÚJ A VÉGÉRE</button>
                    </div>
                    <div id="pageList" class="max-h-96 overflow-y-auto pr-2 space-y-1"></div>
                </div>

                <!-- Oldal Szerkesztő (GPS és Inventory megtartva) -->
                <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                    <div class="space-y-4">
                        <input type="url" id="pageImage" class="input-style" placeholder="Oldal Kép URL (opcionális)" oninput="autoSave()">
                        <textarea id="pageText" rows="5" class="input-style text-sm" placeholder="Történet szövege..." oninput="autoSave()"></textarea>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <select id="pageType" class="input-style text-xs" onchange="updateUI(); autoSave();">
                            <option value="story">Normál</option>
                            <option value="choice">Választás</option>
                            <option value="gps">GPS Célpont</option>
                        </select>
                        <input type="number" id="prevIdx" class="input-style text-xs" placeholder="Vissza ID" oninput="autoSave()">
                        <input type="number" id="nextIdx" class="input-style text-xs" placeholder="Tovább ID" oninput="autoSave()">
                        <input type="url" id="pageBg" class="input-style text-xs" placeholder="Egyedi háttér" oninput="autoSave()">
                    </div>

                    <div id="choiceArea" class="hidden pt-4 border-t border-slate-700">
                        <div class="flex justify-between items-center mb-4">
                            <h4 class="text-cyan-400 text-[10px] font-bold uppercase">Gombok / Választások</h4>
                            <button onclick="addChoiceItem()" class="text-cyan-400 text-[10px] font-bold uppercase">+ ÚJ GOMB</button>
                        </div>
                        <div id="choicesContainer" class="space-y-2"></div>
                    </div>

                    <div id="gpsArea" class="hidden pt-4 border-t border-slate-700 space-y-4">
                        <h4 class="text-orange-400 text-[10px] font-bold uppercase">GPS Koordináták (Lat, Lng)</h4>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="gpsCoords" class="input-style text-xs" placeholder="47.123, 19.456" oninput="autoSave()">
                            <input type="number" id="gpsRadius" class="input-style text-xs" placeholder="Sugár (méter)" oninput="autoSave()">
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-700 space-y-4">
                        <div class="flex justify-between items-center">
                            <h4 class="text-emerald-400 text-[10px] font-bold uppercase">Inventory (Tárgyak kezelése)</h4>
                            <button onclick="addInventoryItem()" class="text-emerald-400 text-[10px] font-bold uppercase">+ TÁRGY</button>
                        </div>
                        <div id="inventoryContainer" class="space-y-2"></div>
                    </div>
                </div>
            </div>

            <div class="w-full lg:w-auto flex justify-center">
                <div class="sim-container">
                    <div id="sim-viewport">
                        <img id="sim-bg" src="">
                        <div id="sim-content">
                            <div class="sim-box">
                                <div id="sim-actual-text" class="text-white text-[13px] leading-relaxed"></div>
                                <div id="sim-actions" class="mt-4 flex flex-col gap-2"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'KALAND_STUDIO_PRO_V89';
        let config = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
            appTitle: "Új Kaland",
            globalBg: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&q=80",
            mapUrl: "",
            avatars: [],
            storyPages: [{ 
                content: "Kezdő oldal...", 
                pageType: "story", 
                nextIdx: 1, 
                prevIdx: 0, 
                choices: [], 
                inventory: [],
                pageImage: "",
                pageBg: ""
            }]
        };

        let currentIdx = -1;
        let simIdx = 0;
        let insertTargetIdx = null;

        function renderAvatarAdmin() {
            const container = document.getElementById('avatarAdminList');
            container.innerHTML = '';
            if(!config.avatars) config.avatars = [];
            config.avatars.forEach((av, i) => {
                const card = document.createElement('div');
                card.className = "avatar-card glass-card";
                card.innerHTML = `
                    <div class="avatar-preview-container">
                        <img src="${av.url || ''}" class="avatar-preview" style="border-color: ${av.color || '#8b5cf6'}" onerror="this.src='https://via.placeholder.com/50'">
                        <input type="color" class="w-8 h-8 rounded border-none cursor-pointer bg-transparent" value="${av.color || '#8b5cf6'}" 
                            oninput="config.avatars[${i}].color=this.value; renderAvatarAdmin(); autoSave()">
                    </div>
                    <div class="flex-1 space-y-2">
                        <div class="flex gap-2">
                            <input type="text" class="input-style text-xs py-1 flex-[2]" placeholder="Karakter neve" value="${av.name || ''}" 
                                oninput="config.avatars[${i}].name=this.value; autoSave()">
                            <input type="text" class="input-style text-xs py-1 flex-1 border-purple-500/50" placeholder="Kód" value="${av.code || ''}" 
                                oninput="config.avatars[${i}].code=this.value; autoSave()">
                        </div>
                        <input type="url" class="input-style text-[10px] py-1" placeholder="Kép URL" value="${av.url || ''}" 
                            oninput="config.avatars[${i}].url=this.value; renderAvatarAdmin(); autoSave()">
                    </div>
                    <button onclick="config.avatars.splice(${i}, 1); renderAvatarAdmin(); autoSave()" class="text-red-400 hover:text-red-200 ml-1">
                        <i class="fa fa-trash-can text-sm"></i>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function addAvatar() {
            if(!config.avatars) config.avatars = [];
            const newCode = "CHAR_" + (config.avatars.length + 1);
            config.avatars.push({ name: "Új Hős", url: "", color: "#8b5cf6", code: newCode });
            renderAvatarAdmin();
            autoSave();
        }

        function renderPageList() {
            const list = document.getElementById('pageList');
            list.innerHTML = '';
            config.storyPages.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `page-item ${i === currentIdx ? 'selected' : ''}`;
                div.innerHTML = `
                    <div class="flex items-center flex-grow overflow-hidden" onclick="loadPage(${i})">
                        <i class="fa fa-bars handle text-slate-600 mr-2"></i>
                        <span class="truncate text-xs font-bold text-slate-200">#${i}: ${p.content.substring(0, 30)}...</span>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="openInsertModal(${i})" class="p-2 text-cyan-500 hover:text-white hover:bg-cyan-600 rounded-lg transition-all" title="Beszúrás ez után">
                            <i class="fa fa-plus text-xs"></i>
                        </button>
                        <button onclick="deletePage(${i}, event)" class="p-2 text-red-400 hover:text-white hover:bg-red-600 rounded-lg transition-all" title="Törlés">
                            <i class="fa fa-trash text-xs"></i>
                        </button>
                    </div>
                `;
                list.appendChild(div);
            });
            
            new Sortable(list, {
                handle: '.handle',
                animation: 150,
                onEnd: (evt) => {
                    const movedItem = config.storyPages.splice(evt.oldIndex, 1)[0];
                    config.storyPages.splice(evt.newIndex, 0, movedItem);
                    autoSave();
                    loadPage(evt.newIndex);
                }
            });
        }

        function loadPage(i) {
            currentIdx = i;
            const p = config.storyPages[i];
            if(!p) return;

            document.getElementById('editorPanel').classList.remove('hidden');
            document.getElementById('pageText').value = p.content;
            document.getElementById('pageType').value = p.pageType;
            document.getElementById('nextIdx').value = (p.nextIdx !== undefined) ? p.nextIdx : "";
            document.getElementById('prevIdx').value = (p.prevIdx !== undefined) ? p.prevIdx : "";
            document.getElementById('pageImage').value = p.pageImage || "";
            document.getElementById('pageBg').value = p.pageBg || "";
            document.getElementById('gpsCoords').value = p.gpsCoords || "";
            document.getElementById('gpsRadius').value = p.gpsRadius || "";
            
            updateUI();
            renderChoices();
            renderInventory();
            renderPageList();
            simIdx = i;
            updateSimulator();
        }

        // Új funkció: Beszúrás bárhová
        function openInsertModal(index) {
            insertTargetIdx = index;
            document.getElementById('insert-modal').style.display = 'flex';
        }

        function closeInsertModal() {
            document.getElementById('insert-modal').style.display = 'none';
        }

        function handleInsert(mode) {
            let newPage;
            if (mode === 'copy') {
                newPage = JSON.parse(JSON.stringify(config.storyPages[insertTargetIdx]));
                newPage.content += " (MÁSODLAT)";
            } else {
                newPage = { 
                    content: "Új beszúrt oldal...", 
                    pageType: "story", 
                    nextIdx: insertTargetIdx + 2, 
                    prevIdx: insertTargetIdx, 
                    choices: [], 
                    inventory: [],
                    pageImage: "",
                    pageBg: ""
                };
            }
            config.storyPages.splice(insertTargetIdx + 1, 0, newPage);
            closeInsertModal();
            autoSave();
            loadPage(insertTargetIdx + 1);
        }

        function addPage() {
            const lastIdx = config.storyPages.length;
            config.storyPages.push({ 
                content: "Új oldal...", 
                pageType: "story", 
                nextIdx: lastIdx + 1, 
                prevIdx: lastIdx - 1, 
                choices: [],
                inventory: []
            });
            autoSave();
            loadPage(config.storyPages.length - 1);
        }

        function deletePage(i, event) {
            event.stopPropagation();
            if(config.storyPages.length <= 1) return;
            if(!confirm("Biztosan törlöd ezt az oldalt?")) return;
            config.storyPages.splice(i, 1);
            currentIdx = -1;
            document.getElementById('editorPanel').classList.add('hidden');
            autoSave();
        }

        function updateUI() {
            const type = document.getElementById('pageType').value;
            document.getElementById('choiceArea').classList.toggle('hidden', type !== 'choice');
            document.getElementById('gpsArea').classList.toggle('hidden', type !== 'gps');
        }

        function renderChoices() {
            const container = document.getElementById('choicesContainer');
            container.innerHTML = '';
            const p = config.storyPages[currentIdx];
            if(!p.choices) p.choices = [];
            p.choices.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = "flex gap-2";
                div.innerHTML = `
                    <input type="text" class="input-style flex-1 text-xs" value="${c.text}" placeholder="Gomb felirat" oninput="config.storyPages[currentIdx].choices[${i}].text=this.value; autoSave()">
                    <input type="number" class="input-style w-16 text-xs" value="${c.target}" placeholder="ID" oninput="config.storyPages[currentIdx].choices[${i}].target=this.value; autoSave()">
                    <button onclick="config.storyPages[currentIdx].choices.splice(${i},1); renderChoices(); autoSave()"><i class="fa fa-times text-red-400"></i></button>
                `;
                container.appendChild(div);
            });
        }

        function addChoiceItem() {
            if(!config.storyPages[currentIdx].choices) config.storyPages[currentIdx].choices = [];
            config.storyPages[currentIdx].choices.push({text: "Új opció", target: 0});
            renderChoices();
            autoSave();
        }

        function renderInventory() {
            const container = document.getElementById('inventoryContainer');
            container.innerHTML = '';
            const p = config.storyPages[currentIdx];
            if(!p.inventory) p.inventory = [];
            p.inventory.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = "flex gap-2";
                div.innerHTML = `
                    <select class="input-style w-24 text-[10px]" onchange="config.storyPages[currentIdx].inventory[${i}].action=this.value; autoSave()">
                        <option value="add" ${item.action==='add'?'selected':''}>Adás</option>
                        <option value="remove" ${item.action==='remove'?'selected':''}>Elvétel</option>
                        <option value="require" ${item.action==='require'?'selected':''}>Feltétel</option>
                    </select>
                    <input type="text" class="input-style flex-1 text-xs" value="${item.name}" placeholder="Tárgy neve" oninput="config.storyPages[currentIdx].inventory[${i}].name=this.value; autoSave()">
                    <button onclick="config.storyPages[currentIdx].inventory.splice(${i},1); renderInventory(); autoSave()"><i class="fa fa-times text-red-400"></i></button>
                `;
                container.appendChild(div);
            });
        }

        function addInventoryItem() {
            if(!config.storyPages[currentIdx].inventory) config.storyPages[currentIdx].inventory = [];
            config.storyPages[currentIdx].inventory.push({action: "add", name: ""});
            renderInventory();
            autoSave();
        }

        function updateSimulator() {
            const p = config.storyPages[simIdx];
            if(!p) return;
            document.getElementById('sim-bg').src = p.pageBg || config.globalBg;
            document.getElementById('sim-actual-text').textContent = p.content;
            const actions = document.getElementById('sim-actions');
            actions.innerHTML = '';
            if (p.pageType === 'choice') {
                if(p.choices) {
                    p.choices.forEach(c => {
                        const b = document.createElement('div');
                        b.className = "sim-btn";
                        b.textContent = c.text;
                        b.onclick = () => { simIdx = parseInt(c.target); updateSimulator(); };
                        actions.appendChild(b);
                    });
                }
            } else if(p.pageType === 'gps') {
                const b = document.createElement('div');
                b.className = "sim-btn bg-orange-600";
                b.textContent = "📍 GPS HELYSZÍN KERESÉSE...";
                actions.appendChild(b);
            } else {
                const b = document.createElement('div');
                b.className = "sim-btn";
                b.textContent = "Tovább";
                b.onclick = () => { 
                    const n = parseInt(p.nextIdx);
                    simIdx = isNaN(n) ? simIdx + 1 : n;
                    updateSimulator(); 
                };
                actions.appendChild(b);
            }
        }

        function autoSave() {
            document.getElementById('save-indicator').style.display = 'block';
            if(currentIdx !== -1) {
                const p = config.storyPages[currentIdx];
                p.content = document.getElementById('pageText').value;
                p.pageType = document.getElementById('pageType').value;
                p.nextIdx = document.getElementById('nextIdx').value;
                p.prevIdx = document.getElementById('prevIdx').value;
                p.pageImage = document.getElementById('pageImage').value;
                p.pageBg = document.getElementById('pageBg').value;
                p.gpsCoords = document.getElementById('gpsCoords').value;
                p.gpsRadius = document.getElementById('gpsRadius').value;
            }
            config.appTitle = document.getElementById('appTitle').value;
            config.globalBg = document.getElementById('globalBg').value;
            config.mapUrl = document.getElementById('mapUrl').value;
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
            renderPageList();
            setTimeout(() => document.getElementById('save-indicator').style.display = 'none', 500);
        }

        function downloadConfig() {
            const blob = new Blob([JSON.stringify(config, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'export.json';
            a.click();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    imported.storyPages.forEach(p => {
                        if(!p.inventory) p.inventory = [];
                        if(!p.choices) p.choices = [];
                    });
                    if(!imported.avatars) imported.avatars = [];
                    config = imported;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
                    document.getElementById('appTitle').value = config.appTitle || "";
                    document.getElementById('globalBg').value = config.globalBg || "";
                    document.getElementById('mapUrl').value = config.mapUrl || "";
                    renderAvatarAdmin();
                    renderPageList();
                    if(config.storyPages && config.storyPages.length > 0) loadPage(0);
                } catch(err) { console.error("Hiba:", err); }
            };
            reader.readAsText(file);
        }

        window.onload = () => {
            document.getElementById('appTitle').value = config.appTitle || "";
            document.getElementById('globalBg').value = config.globalBg || "";
            document.getElementById('mapUrl').value = config.mapUrl || "";
            renderAvatarAdmin();
            renderPageList();
            if(config.storyPages && config.storyPages.length > 0) loadPage(0);
        };
    </script>
</body>
</html>
