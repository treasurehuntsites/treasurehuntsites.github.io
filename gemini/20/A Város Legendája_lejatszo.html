<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaland Játék Lejátszó ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Play', sans-serif; background-color: #000; color: #f8fafc; overflow: hidden; }
        #player-view { position: fixed; inset: 0; z-index: 4000; background: #000; display: flex; flex-direction: column; }
        .p-game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #p-viewport { position: relative; flex-grow: 1; overflow: hidden; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; }
        #p-content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .p-dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 40px; min-height: 250px; max-height: 70%; display: flex; flex-direction: column; box-shadow: 0 -10px 25px rgba(0,0,0,0.5); }
        .p-avatar-frame { position: absolute; top: -40px; left: 10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; }
        .p-action-btn { flex: 1; background: #8b5cf6; color: white; padding: 16px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.25rem; cursor: pointer; text-transform: uppercase; border: none; }
        .p-btn-back { background: #334155; }
        .p-bottom-nav { height: 75px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .p-nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; position: relative; }
        .p-nav-item.active { color: #8b5cf6; }
        .p-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; }
        #p-story-text { font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 15px; }
        #p-inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 50; display: none; padding: 25px; padding-top: 50px; overflow-y: auto; }
        .p-item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .p-item-card { position: relative; background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 15px; text-align: center; }
        .p-item-card img { width: 65px; height: 65px; object-fit: contain; margin: 0 auto 10px; }
        .p-item-unread-dot { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; }
        #p-qr-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #p-qr-reader { width: 280px; height: 280px; border: 3px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; }
        #p-zoom-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; align-items: center; justify-content: center; }
        #p-zoom-img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px; }
        .hint-btn { position: absolute; top: 15px; right: 15px; background: rgba(15, 23, 42, 0.6); color: #94a3b8; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; border: 1px solid rgba(148, 163, 184, 0.3); z-index: 100; }
        #hint-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .modal-box { background: #1e293b; border: 2px solid #8b5cf6; border-radius: 1.5rem; padding: 2rem; max-width: 400px; width: 90%; text-align: center; }
        #config-loader-overlay { position: fixed; inset: 0; background: #0f172a; z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        @keyframes fadeInOutSplash { 0% { opacity: 0; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } 90% { opacity: 0; transform: scale(1.02); } 100% { opacity: 0; } }
        .splash-text-anim { font-family: 'Special Elite', cursive; animation: fadeInOutSplash 10s ease-in-out forwards; text-transform: uppercase; letter-spacing: 0.1em; }
        .phone-ui { background: linear-gradient(to bottom, #2c3e50, #000000); height: 100%; width: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 15% 20px; box-sizing: border-box; text-align: center; }
        .phone-btn { width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .phone-btn.decline { background-color: #ff3b30; }
        .phone-btn.accept { background-color: #4cd964; }
        .pulse { animation: pulse-anim 1.5s infinite; }
        @keyframes pulse-anim { 0% { box-shadow: 0 0 0 0px rgba(76, 217, 100, 0.5); } 100% { box-shadow: 0 0 0 30px rgba(76, 217, 100, 0); } }
    </style>
</head>
<body>
    <div id="config-loader-overlay">
        <h1 class="text-2xl font-bold text-white mb-4">Kaland Játék</h1>
        <p class="text-slate-400 mb-8">A játék adatai nem találhatók vagy betöltés alatt...</p>
        <button onclick="document.getElementById('manual-upload').click()" class="bg-purple-600 px-8 py-4 rounded-2xl font-bold uppercase text-sm tracking-widest shadow-xl">Játékfájl (game.json) betöltése</button>
        <input type="file" id="manual-upload" class="hidden" accept=".json" onchange="pHandleConfigUpload(event)">
    </div>

    <div id="hint-modal">
        <div class="modal-box">
            <div id="hint-step-confirm">
                <h3 class="text-xl font-bold mb-4 uppercase text-cyan-400">Segítség kérése</h3>
                <p class="text-slate-400 mb-8">Biztosan látni akarod a következő segítséget?</p>
                <div class="flex gap-4">
                    <button onclick="closeHintModal()" class="flex-1 bg-slate-700 p-3 rounded-xl font-bold uppercase text-xs">Mégse</button>
                    <button id="hint-show-btn" onclick="pShowActualHint()" class="flex-1 bg-purple-600 p-3 rounded-xl font-bold uppercase text-xs">Igen, kérem</button>
                </div>
            </div>
            <div id="hint-display-area" class="hidden">
                <h3 class="text-xl font-bold mb-4 uppercase text-purple-400">Útmutatás</h3>
                <div id="hint-content-text" class="text-white text-lg font-bold mb-8 italic"></div>
                <button onclick="closeHintModal()" class="w-full bg-cyan-600 p-3 rounded-xl font-bold uppercase text-xs">Értem</button>
            </div>
        </div>
    </div>

    <div id="player-view" style="display:none">
        <div id="p-qr-layer">
            <div id="p-qr-reader"></div>
            <div class="mt-8 w-full max-w-[280px]">
                <button onclick="pStopQR()" class="p-action-btn p-btn-back w-full">MÉGSE</button>
            </div>
        </div>
        <div id="p-zoom-viewer" onclick="pCloseZoom()">
            <img id="p-zoom-img" src="">
        </div>
        <div class="p-game-wrapper">
            <div id="p-viewport">
                <img id="p-bg-layer" src="">
                <div id="p-splash-screen" class="absolute inset-0 bg-black z-[1000] hidden flex items-center justify-center">
                    <div id="p-splash-text" class="text-white text-center p-6 splash-text-anim text-4xl"></div>
                </div>
                <div id="p-call-screen" class="absolute inset-0 z-[1100] hidden">
                    <div class="phone-ui !h-full">
                        <div class="mt-20"><p class="text-sm uppercase tracking-widest opacity-60">Bejövő hívás</p><h1 id="p-call-name" class="text-4xl mt-2">Ismeretlen</h1></div>
                        <div id="p-call-status" class="hidden text-emerald-400 text-xl font-light mb-20">Hívás folyamatban...</div>
                        <div id="p-call-btns" class="flex justify-around pb-20 w-full max-w-md mx-auto">
                            <button onclick="pEndCall()" class="phone-btn decline"><i class="fa fa-phone-slash text-white text-3xl"></i></button>
                            <button onclick="pAnswerCall()" class="phone-btn accept pulse"><i class="fa fa-phone text-white text-3xl"></i></button>
                        </div>
                    </div>
                </div>
                <div id="p-inventory-overlay">
                    <h2 class="text-center text-cyan-400 font-bold mb-8 uppercase tracking-widest">Hátizsák</h2>
                    <div id="p-item-list" class="p-item-grid"></div>
                </div>
                <div id="p-content-layer">
                    <div class="p-dialog-box">
                        <div id="p-hint-trigger-container"></div>
                        <img id="p-avatar-img" class="p-avatar-frame" src="">
                        <div id="p-scroll-area" class="overflow-y-auto flex-grow">
                            <img id="p-page-illustration" class="w-full rounded-xl mb-4 hidden" src="">
                            <div id="p-story-text"></div>
                            <div id="p-gps-monitor" class="hidden text-center p-4 bg-slate-900/80 rounded-2xl mt-4 border border-cyan-500/40">
                                <div class="text-[10px] text-cyan-500 uppercase font-bold tracking-widest mb-1">Célpont távolsága</div>
                                <div class="text-3xl font-bold text-white"><span id="p-distance-val">...</span> <span class="text-sm opacity-50">méter</span></div>
                                <div id="p-gps-hint" class="text-[10px] text-slate-400 mt-2 italic">Menj közelebb!</div>
                            </div>
                        </div>
                        <div id="p-button-container" class="mt-4 flex flex-col gap-3"></div>
                    </div>
                </div>
            </div>
            <div class="p-bottom-nav">
                <button id="p-nav-map" class="p-nav-item active" onclick="pSwitchView('map')"><i class="fa fa-map-marked-alt"></i></button>
                <button id="p-nav-inv" class="p-nav-item" onclick="pSwitchView('inv')"><i class="fa-solid fa-briefcase"></i><div id="p-inv-badge" class="p-badge hidden">0</div></button>
                <button class="p-nav-item" onclick="pResetGame()"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="p-nav-item" onclick="pToggleFullscreen()"><i class="fa fa-expand"></i></button>
            </div>
        </div>
    </div>

    <audio id="p-ringtone-audio" loop></audio>
    <audio id="p-call-voice-audio"></audio>

    <script>
        let config = null;
        let pSimIdx = 0, pAcquiredItems = [], pQrScanner = null, userPos = null, splashTimer = null, pCurrentHintIdx = 0;

        window.addEventListener('load', async () => {
            try {
                const response = await fetch('game.json');
                if (response.ok) {
                    config = await response.json();
                    initGame();
                }
            } catch (e) {
                console.log("Automatic config load failed, waiting for manual upload.");
            }
        });

        function pHandleConfigUpload(e) {
            const f = e.target.files[0];
            if(!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                config = JSON.parse(ev.target.result);
                initGame();
            };
            r.readAsText(f);
        }

        function initGame() {
            if(!config) return;
            document.getElementById('config-loader-overlay').style.display = 'none';
            document.getElementById('player-view').style.display = 'flex';
            document.title = config.appTitle || "Kaland Játék";
            pUpdateUI();
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                const p = config?.storyPages[pSimIdx];
                if (p && p.pageType === 'gps') {
                    const dist = getDistance(userPos.lat, userPos.lng, p.targetLat, p.targetLng);
                    document.getElementById('p-distance-val').textContent = dist;
                    if (dist <= 20) {
                         setTimeout(() => {
                            if (p.redirectUrl) window.open(p.redirectUrl, '_blank');
                            else { pSimIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : pSimIdx + 1; pUpdateUI(); }
                        }, 1000);
                    }
                }
            }, null, { enableHighAccuracy: true });
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
        }

        function pUpdateUI() {
            const p = config.storyPages[pSimIdx];
            if(!p) return;
            clearTimeout(splashTimer); pStopAllAudio();
            pCurrentHintIdx = 0;
            
            if (p.rewards) {
                p.rewards.forEach(r => { if (r.name && !pAcquiredItems.find(it => it.name === r.name)) pAcquiredItems.push({...r, seen: false}); });
            }

            const splash = document.getElementById('p-splash-screen');
            const call = document.getElementById('p-call-screen');
            const layer = document.getElementById('p-content-layer');
            const nav = document.querySelector('.p-bottom-nav');
            const hintTrigger = document.getElementById('p-hint-trigger-container');
            
            splash.classList.add('hidden'); call.classList.add('hidden'); layer.classList.remove('hidden'); nav.style.display = 'flex';
            hintTrigger.innerHTML = '';

            if (p.pageType === 'splash') {
                splash.classList.remove('hidden'); layer.classList.add('hidden'); nav.style.display = 'none';
                document.getElementById('p-splash-text').textContent = p.content || "";
                splashTimer = setTimeout(() => { pSimIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : pSimIdx + 1; pUpdateUI(); }, 10500);
            } else if (p.pageType === 'call') {
                call.classList.remove('hidden'); layer.classList.add('hidden'); nav.style.display = 'none';
                document.getElementById('p-call-name').textContent = p.content || "Ismeretlen";
                document.getElementById('p-call-btns').style.display = 'flex'; document.getElementById('p-call-status').style.display = 'none';
                const ring = document.getElementById('p-ringtone-audio'); ring.src = p.ringtoneUrl || "https://cdn.pixabay.com/audio/2022/03/15/audio_73663a7587.mp3"; ring.play().catch(e => {});
            } else {
                const bg = document.getElementById('p-bg-layer'); bg.src = p.pageBg || config.globalBg || "";
                let text = p.content || "";
                const avImg = document.getElementById('p-avatar-img'); avImg.style.display = 'none';
                config.avatars.forEach(av => { if(text.includes(`§${av.id}`)) { avImg.src = av.url || ""; avImg.style.display = av.url ? 'block' : 'none'; avImg.style.borderColor = av.color; text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color}">${av.name}:</span>`); } });
                document.getElementById('p-story-text').innerHTML = text;
                const ill = document.getElementById('p-page-illustration'); if(p.pageImage) { ill.src = p.pageImage; ill.classList.remove('hidden'); } else { ill.classList.add('hidden'); }
                document.getElementById('p-gps-monitor').classList.toggle('hidden', p.pageType !== 'gps');
                const container = document.getElementById('p-button-container'); container.innerHTML = '';
                
                if (p.pageType === 'password' && p.hints && p.hints.trim() !== "") {
                    const hBtn = document.createElement('div'); hBtn.className = "hint-btn"; hBtn.innerHTML = '<i class="fa fa-question"></i>'; hBtn.onclick = openHintModal; hintTrigger.appendChild(hBtn);
                }
                if (p.pageType === 'qr') {
                    const b = document.createElement('button'); b.className = "p-action-btn"; b.innerHTML = 'QR BEOLVASÁSA <i class="fa fa-camera ml-2 opacity-50"></i>'; b.onclick = pStartQR; container.appendChild(b);
                } else if (p.pageType === 'password') {
                    const inp = document.createElement('input'); inp.className = "w-full bg-slate-900 text-cyan-400 p-4 rounded-lg text-center font-bold text-2xl mb-2"; inp.placeholder = "KÓD..."; container.appendChild(inp);
                    const b = document.createElement('button'); b.className = "p-action-btn"; b.textContent = "NYITÁS"; b.onclick = () => { if(inp.value.trim().toLowerCase() == (p.password||"").toLowerCase()) { pSimIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : pSimIdx + 1; pUpdateUI(); } }; container.appendChild(b);
                } else if (p.pageType === 'choice' && p.choices) {
                    p.choices.forEach(c => { const b = document.createElement('button'); b.className = "p-action-btn"; b.textContent = c.text; b.onclick = () => { pSimIdx = parseInt(c.target); pUpdateUI(); }; container.appendChild(b); });
                }
                const navRow = document.createElement('div'); navRow.className = "flex gap-3 w-full";
                if(pSimIdx > 0 || (p.prevIdx !== "" && p.prevIdx !== undefined)) {
                    const b = document.createElement('button'); b.className = "p-action-btn p-btn-back"; b.textContent = "VISSZA"; b.onclick = () => { pSimIdx = (p.prevIdx !== "" && p.prevIdx !== undefined) ? parseInt(p.prevIdx) : pSimIdx - 1; pUpdateUI(); }; navRow.appendChild(b);
                }
                if (p.pageType !== 'choice' && p.pageType !== 'password' && p.pageType !== 'qr' && p.pageType !== 'gps') {
                    const b = document.createElement('button'); b.className = "p-action-btn"; b.textContent = "TOVÁBB"; b.onclick = () => { pSimIdx = (p.nextIdx !== "" && p.nextIdx !== undefined) ? parseInt(p.nextIdx) : pSimIdx + 1; pUpdateUI(); }; navRow.appendChild(b);
                }
                container.appendChild(navRow);
            }
            pUpdateBadge();
        }

        function pStopAllAudio() {
            const ring = document.getElementById('p-ringtone-audio'); const voice = document.getElementById('p-call-voice-audio');
            ring.pause(); ring.currentTime = 0; voice.pause(); voice.currentTime = 0;
        }

        function pAnswerCall() {
            pStopAllAudio(); document.getElementById('p-call-btns').style.display = 'none'; document.getElementById('p-call-status').style.display = 'block';
            const v = document.getElementById('p-call-voice-audio'); v.src = config.storyPages[pSimIdx].audioUrl || ""; v.play().catch(e => pEndCall()); v.onended = pEndCall;
        }
        function pEndCall() { pStopAllAudio(); pSimIdx = (config.storyPages[pSimIdx].nextIdx !== "" && config.storyPages[pSimIdx].nextIdx !== undefined) ? parseInt(config.storyPages[pSimIdx].nextIdx) : pSimIdx + 1; pUpdateUI(); }

        function openHintModal() { document.getElementById('hint-modal').style.display = 'flex'; document.getElementById('hint-step-confirm').classList.remove('hidden'); document.getElementById('hint-display-area').classList.add('hidden'); }
        function closeHintModal() { document.getElementById('hint-modal').style.display = 'none'; }
        function pShowActualHint() {
            const p = config.storyPages[pSimIdx]; const hintsArray = p.hints.split('\n').filter(h => h.trim() !== "");
            document.getElementById('hint-content-text').textContent = pCurrentHintIdx >= hintsArray.length ? "Nincs több segítség." : hintsArray[pCurrentHintIdx++];
            document.getElementById('hint-step-confirm').classList.add('hidden'); document.getElementById('hint-display-area').classList.remove('hidden');
        }

        function pSwitchView(target) {
            const inv = document.getElementById('p-inventory-overlay');
            if (target === 'inv') { if (inv.style.display === 'block') inv.style.display = 'none'; else { pRenderInventory(); inv.style.display = 'block'; } }
            else { if(target === 'map' && config.initialMapLink) window.open(config.initialMapLink, '_blank'); inv.style.display = 'none'; }
        }

        function pRenderInventory() {
            const list = document.getElementById('p-item-list'); list.innerHTML = '';
            const currentPage = config.storyPages[pSimIdx];
            const visibleItems = pAcquiredItems.filter(item => !(currentPage.visibleItems && currentPage.visibleItems[item.name] === false));
            visibleItems.forEach(item => {
                const d = document.createElement('div'); d.className = "p-item-card"; 
                d.onclick = () => { if(item.url) pOpenZoom(item.url, item); else { item.seen = true; pUpdateBadge(); pRenderInventory(); } };
                d.innerHTML = item.url ? `<img src="${item.url}">` : `<div class="text-4xl mb-2">${item.icon}</div>`;
                d.innerHTML += `<div class="text-[10px] font-bold text-white uppercase">${item.name}</div>`;
                if (!item.seen) { const dot = document.createElement('div'); dot.className = "p-item-unread-dot"; d.appendChild(dot); }
                list.appendChild(d);
            });
        }

        function pOpenZoom(src, item) { if(item) { item.seen = true; pUpdateBadge(); pRenderInventory(); } document.getElementById('p-zoom-img').src = src; document.getElementById('p-zoom-viewer').style.display = 'flex'; }
        function pCloseZoom() { document.getElementById('p-zoom-viewer').style.display = 'none'; }

        function pUpdateBadge() {
            const currentPage = config.storyPages[pSimIdx];
            const unreadCount = pAcquiredItems.filter(item => !item.seen && !(currentPage.visibleItems && currentPage.visibleItems[item.name] === false)).length;
            document.getElementById('p-inv-badge').textContent = unreadCount;
            document.getElementById('p-inv-badge').classList.toggle('hidden', unreadCount === 0);
        }

        function pStartQR() {
            document.getElementById('p-qr-layer').style.display = 'flex'; pQrScanner = new Html5Qrcode("p-qr-reader");
            pQrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
                if (decodedText.trim().toUpperCase() === (config.storyPages[pSimIdx].qrCode || "").trim().toUpperCase()) {
                    pQrScanner.stop().finally(() => { document.getElementById('p-qr-layer').style.display = 'none'; pSimIdx++; pUpdateUI(); });
                }
            }).catch(() => { document.getElementById('p-qr-layer').style.display = 'none'; });
        }
        function pStopQR() { if(pQrScanner) pQrScanner.stop().finally(() => { document.getElementById('p-qr-layer').style.display = 'none'; }); else document.getElementById('p-qr-layer').style.display = 'none'; }

        function pToggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function pResetGame() { if(confirm("Újrakezded?")) { pSimIdx = 0; pAcquiredItems = []; pUpdateUI(); pSwitchView('map'); } }
    </script>
</body>
</html>
