<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaland Játék</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Play', sans-serif; background-color: #000; color: #f8fafc; overflow: hidden; }
        .p-game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #p-viewport { position: relative; flex-grow: 1; overflow: hidden; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: src 0.5s ease-in-out, opacity 0.5s; }
        #p-content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .p-dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 40px; min-height: 250px; max-height: 70%; display: flex; flex-direction: column; box-shadow: 0 -10px 25px rgba(0,0,0,0.5); }
        .p-avatar-frame { position: absolute; top: -40px; left: 10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .p-action-btn { flex: 1; background: #8b5cf6; color: white; padding: 16px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.25rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .p-action-btn:active { transform: scale(0.98); background: #a855f7; }
        .p-btn-back { background: #334155; }
        .p-bottom-nav { height: 75px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .p-nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; position: relative; transition: color 0.3s; }
        .p-nav-item.active { color: #8b5cf6; }
        .p-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; }
        #p-story-text { text-align: justify; hyphens: auto; font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 15px; color: #f8fafc; }
        #p-inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 50; display: none; padding: 25px; padding-top: 50px; overflow-y: auto; }
        .p-item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .p-item-card { position: relative; background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 15px; text-align: center; cursor: pointer; }
        .p-item-card img { width: 65px; height: 65px; object-fit: contain; margin: 0 auto 10px; }
        .p-item-unread-dot { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 5px rgba(239, 68, 68, 0.8); }
        #p-qr-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #p-qr-reader { width: 280px; height: 280px; border: 3px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; }
        #p-zoom-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; align-items: center; justify-content: center; touch-action: none; overflow: hidden; }
        #p-zoom-img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px; transition: transform 0.1s ease-out; cursor: zoom-out; user-select: none; }
        @keyframes fadeInOutSplash { 0% { opacity: 0; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } 90% { opacity: 0; transform: scale(1.02); } 100% { opacity: 0; } }
        .splash-text-anim { font-family: 'Special Elite', cursive; animation: fadeInOutSplash 10s ease-in-out forwards; text-transform: uppercase; letter-spacing: 0.1em; }
        .phone-ui { background: linear-gradient(to bottom, #2c3e50, #000000); height: 100%; width: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 15% 20px; box-sizing: border-box; text-align: center; color: white; font-family: sans-serif; }
        .phone-btn { width: 70px; height: 70px; border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .phone-btn.decline { background-color: #ff3b30; }
        .phone-btn.accept { background-color: #4cd964; }
        .phone-btn svg { width: 35px; height: 35px; fill: white; }
        .pulse { animation: pulse-anim 1.5s infinite; }
        @keyframes pulse-anim { 0% { box-shadow: 0 0 0 0px rgba(76, 217, 100, 0.5); } 100% { box-shadow: 0 0 0 30px rgba(76, 217, 100, 0); } }
        #hint-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9998; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-box { background: #1e293b; border: 2px solid #8b5cf6; border-radius: 1.5rem; padding: 2rem; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        #file-loader-screen { position: fixed; inset: 0; background: #0f172a; z-index: 9000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
        #p-splash-screen, #p-call-screen { position: absolute; inset: 0; z-index: 1000; display: none; }
    </style>
</head>
<body>
    <div id="file-loader-screen">
        <h1 class="text-3xl font-bold mb-6 text-purple-400">KALAND JÁTÉK</h1>
        <p class="mb-10 text-slate-400">Nem találtam automatikus "game.json" fájlt a mappában.</p>
        <button onclick="document.getElementById('manual-upload').click()" class="bg-purple-600 px-8 py-4 rounded-2xl font-bold uppercase tracking-widest shadow-lg">Játék betöltése (.json)</button>
        <input type="file" id="manual-upload" class="hidden" accept=".json" onchange="handleManualLoad(event)">
    </div>

    <div id="hint-modal">
        <div class="modal-box">
            <div id="hint-step-confirm">
                <h3 class="text-xl font-bold mb-4 uppercase text-cyan-400">Segítség kérése</h3>
                <p class="text-slate-400 mb-8">Biztosan látni akarod a következő segítséget?</p>
                <div class="flex gap-4">
                    <button onclick="closeHintModal()" class="flex-1 bg-slate-700 p-3 rounded-xl font-bold uppercase text-xs">Mégse</button>
                    <button id="hint-show-btn" class="flex-1 bg-purple-600 p-3 rounded-xl font-bold uppercase text-xs">Igen, kérem</button>
                </div>
            </div>
            <div id="hint-display-area" class="hidden">
                <h3 class="text-xl font-bold mb-4 uppercase text-purple-400">Útmutatás</h3>
                <div id="hint-content-text" class="text-white text-lg font-bold mb-8 italic"></div>
                <button onclick="closeHintModal()" class="w-full bg-cyan-600 p-3 rounded-xl font-bold uppercase text-xs">Értem</button>
            </div>
        </div>
    </div>

    <div id="player-view" style="display:flex">
        <div id="p-qr-layer">
            <div id="p-qr-reader"></div>
            <button id="p-qr-cancel-btn" onclick="pStopQR(true)" class="p-action-btn mt-6 !w-auto !flex-none px-12">MÉGSE</button>
        </div>
        <div id="p-zoom-viewer" onclick="pCloseZoom(true)">
            <img id="p-zoom-img" src="" onclick="event.stopPropagation()">
        </div>
        <div class="p-game-wrapper">
            <div id="p-viewport">
                <img id="p-bg-layer" src="">
                <div id="p-splash-screen" class="bg-black flex items-center justify-center">
                    <div id="p-splash-text" class="text-white text-center p-6 splash-text-anim text-4xl"></div>
                </div>
                <div id="p-call-screen">
                    <div class="phone-ui !h-full">
                        <div class="mt-20"><p class="text-sm uppercase tracking-widest opacity-60">Bejövő hívás</p><h1 id="p-call-name" class="text-4xl mt-2">Ismeretlen</h1><p class="mt-2 opacity-50">Magyarország</p></div>
                        <div id="p-call-status" class="hidden text-emerald-400 text-xl font-light mb-20">Hívás folyamatban...</div>
                        <div id="p-call-btns" class="flex justify-around pb-20 w-full max-w-md mx-auto">
                            <button onclick="pEndCall()" class="phone-btn decline"><svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z" transform="rotate(135 12 12)"/></svg></button>
                            <button onclick="pAnswerCall()" class="phone-btn accept pulse"><svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg></button>
                        </div>
                    </div>
                </div>
                <div id="p-inventory-overlay">
                    <h2 class="text-center text-cyan-400 font-bold mb-8 uppercase tracking-widest">Hátizsák</h2>
                    <div id="p-item-list" class="p-item-grid"></div>
                </div>
                <div id="p-content-layer">
                    <div class="p-dialog-box">
                        <img id="p-avatar-img" class="p-avatar-frame" src="">
                        <div id="p-scroll-area" class="overflow-y-auto pr-1 flex-grow">
                            <img id="p-page-illustration" class="w-full rounded-xl mb-4 hidden shadow-xl" src="">
                            <div id="p-story-text"></div>
                        </div>
                        <div id="p-button-container" class="mt-4 flex flex-col gap-3"></div>
                    </div>
                </div>
            </div>
            <div class="p-bottom-nav">
                <button id="p-nav-map" class="p-nav-item active" onclick="pSwitchView('map')"><i class="fa fa-map-marked-alt"></i></button>
                <button id="p-nav-inv" class="p-nav-item" onclick="pSwitchView('inv')"><i class="fa-solid fa-briefcase"></i><div id="p-inv-badge" class="p-badge hidden">0</div></button>
                <button class="p-nav-item" onclick="pResetGame()"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="p-nav-item" onclick="pToggleFullscreen()"><i class="fa fa-expand"></i></button>
            </div>
        </div>
    </div>

    <audio id="p-ringtone-audio" loop></audio>
    <audio id="p-call-voice-audio"></audio>

    <script>
        let config = null;
        let pSimIdx = 0, pInventory = [], currentHintIdx = 0, splashTimer = null, pQrScanner = null, isStoppingQR = false, isZooming = false, pZoomScale = 1, pInitialDist = 0;

        async function initGame() {
            try {
                const response = await fetch('game.json');
                if (!response.ok) throw new Error();
                config = await response.json();
                startGame();
            } catch (e) {
                document.getElementById('file-loader-screen').style.display = 'flex';
                document.getElementById('player-view').style.display = 'none';
            }
        }

        function handleManualLoad(e) {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                config = JSON.parse(ev.target.result);
                document.getElementById('file-loader-screen').style.display = 'none';
                document.getElementById('player-view').style.display = 'flex';
                startGame();
            };
            r.readAsText(f);
        }

        function startGame() {
            if (!config) return;
            document.title = config.appTitle || "Kaland Játék";
            pSimIdx = 0;
            pInventory = [];
            currentHintIdx = 0;
            pUpdateUI();
        }

        function pUpdateUI() {
            if (!config || !config.storyPages[pSimIdx]) return;
            const p = config.storyPages[pSimIdx];
            clearTimeout(splashTimer);
            pStopAllAudio();

            const splashScreen = document.getElementById('p-splash-screen');
            const callScreen = document.getElementById('p-call-screen');
            const contentLayer = document.getElementById('p-content-layer');
            const bottomNav = document.querySelector('.p-bottom-nav');
            
            splashScreen.style.display = 'none';
            callScreen.style.display = 'none';
            contentLayer.style.display = 'flex';
            bottomNav.style.display = 'flex';

            if (p.pageType === 'splash') {
                splashScreen.style.display = 'flex';
                contentLayer.style.display = 'none';
                bottomNav.style.display = 'none';
                const st = document.getElementById('p-splash-text');
                st.textContent = p.content || "";
                st.style.animation = 'none';
                void st.offsetWidth;
                st.style.animation = 'fadeInOutSplash 10s ease-in-out forwards';
                splashTimer = setTimeout(() => {
                    if (p.redirectUrl) window.open(p.redirectUrl, '_blank');
                    else { pSimIdx++; pUpdateUI(); }
                }, 10500);
            } else if (p.pageType === 'call') {
                callScreen.style.display = 'block';
                contentLayer.style.display = 'none';
                bottomNav.style.display = 'none';
                document.getElementById('p-call-name').textContent = p.content || "Ismeretlen";
                document.getElementById('p-call-btns').style.display = 'flex';
                document.getElementById('p-call-status').style.display = 'none';
                const ring = document.getElementById('p-ringtone-audio');
                ring.src = p.ringtoneUrl || "https://cdn.pixabay.com/audio/2022/03/15/audio_73663a7587.mp3";
                ring.play().catch(() => {});
            } else {
                pHandleReward(p);
                const bg = document.getElementById('p-bg-layer');
                bg.src = p.pageBg || config.globalBg || "";
                let text = p.content || "";
                const avImg = document.getElementById('p-avatar-img');
                avImg.style.display = 'none';
                if (config.avatars) {
                    config.avatars.forEach(av => {
                        if (text.includes('§' + av.id)) {
                            avImg.src = av.url || "";
                            avImg.style.display = av.url ? 'block' : 'none';
                            avImg.style.borderColor = av.color;
                            text = text.replace(new RegExp('§' + av.id, 'g'), '<span style="color:' + av.color + '">' + av.name + ':</span>');
                        }
                    });
                }
                document.getElementById('p-story-text').innerHTML = text;
                const ill = document.getElementById('p-page-illustration');
                if (p.pageImage) { ill.src = p.pageImage; ill.style.display = 'block'; } else { ill.style.display = 'none'; }
                
                const container = document.getElementById('p-button-container');
                container.innerHTML = '';

                if (p.pageType === 'password') {
                    if (p.hints) {
                        const hBtn = document.createElement('button');
                        hBtn.className = "text-cyan-400 text-4xl mb-4";
                        hBtn.innerHTML = '<i class="fa-solid fa-circle-question"></i>';
                        hBtn.onclick = () => openHintConfirm(p.hints);
                        container.appendChild(hBtn);
                    }
                    const inp = document.createElement('input');
                    inp.className = "w-full bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-lg text-center font-bold text-2xl mb-2";
                    inp.placeholder = "KÓD...";
                    container.appendChild(inp);
                    pAddBtn("NYITÁS", () => {
                        if (inp.value.trim().toLowerCase() == (p.password || "").toLowerCase()) {
                            pSimIdx = p.nextIdx ? parseInt(p.nextIdx) : pSimIdx + 1;
                            currentHintIdx = 0;
                            pUpdateUI();
                        }
                    });
                } else if (p.pageType === 'choice' && p.choices) {
                    p.choices.forEach(c => {
                        if (c.req && !pInventory.find(i => i.name.toLowerCase() === c.req.toLowerCase())) return;
                        pAddBtn(c.text, () => {
                            pSimIdx = parseInt(c.target);
                            currentHintIdx = 0;
                            pUpdateUI();
                        });
                    });
                } else if (p.pageType === 'qr') {
                    pAddBtn("QR BEOLVASÁSA", pStartQR, "fa-camera");
                }

                const navRow = document.createElement('div');
                navRow.className = "flex gap-3 w-full";
                if (pSimIdx > 0 || p.prevIdx) {
                    const b = document.createElement('button');
                    b.className = "p-action-btn p-btn-back";
                    b.innerHTML = "VISSZA";
                    b.onclick = () => {
                        pSimIdx = p.prevIdx ? parseInt(p.prevIdx) : pSimIdx - 1;
                        pUpdateUI();
                    };
                    navRow.appendChild(b);
                }
                if (p.pageType !== 'choice' && p.pageType !== 'password' && p.pageType !== 'qr') {
                    const b = document.createElement('button');
                    b.className = "p-action-btn";
                    b.innerHTML = "TOVÁBB";
                    b.onclick = () => {
                        if (p.redirectUrl) window.open(p.redirectUrl, '_blank');
                        else { pSimIdx = p.nextIdx ? parseInt(p.nextIdx) : pSimIdx + 1; pUpdateUI(); }
                    };
                    navRow.appendChild(b);
                }
                if (navRow.hasChildNodes()) container.appendChild(navRow);
            }
        }

        function pAddBtn(t, fn, icon = "") {
            const b = document.createElement('button');
            b.className = "p-action-btn";
            b.innerHTML = t + (icon ? ' <i class="fa ' + icon + ' ml-2 opacity-50"></i>' : '');
            b.onclick = fn;
            document.getElementById('p-button-container').appendChild(b);
        }

        function pHandleReward(p) {
            if (p.rewards) {
                p.rewards.forEach(r => {
                    if (r.name && !pInventory.find(i => i.name.toLowerCase() === r.name.toLowerCase())) {
                        pInventory.push({ ...r, seen: false });
                    }
                });
                pUpdateBadge();
            }
        }

        function pUpdateBadge() {
            const b = document.getElementById('p-inv-badge'), u = pInventory.filter(i => !i.seen).length;
            b.textContent = u; b.style.display = u === 0 ? 'none' : 'block';
        }

        function pSwitchView(target) {
            const inv = document.getElementById('p-inventory-overlay');
            if (target === 'inv') {
                if (inv.style.display === 'block') inv.style.display = 'none';
                else { pRenderInventory(); inv.style.display = 'block'; }
            } else {
                inv.style.display = 'none';
                if (config.initialMapLink) window.open(config.initialMapLink, '_blank');
            }
        }

        function pRenderInventory() {
            const l = document.getElementById('p-item-list');
            l.innerHTML = '';
            pInventory.forEach(item => {
                const d = document.createElement('div');
                d.className = "p-item-card";
                d.innerHTML = item.url ? '<img src="' + item.url + '"><div class="text-[10px] font-bold text-white uppercase">' + item.name + '</div>' : '<div class="text-4xl mb-2">' + item.icon + '</div><div class="text-[10px] font-bold text-white uppercase">' + item.name + '</div>';
                if (!item.seen) d.innerHTML += '<div class="p-item-unread-dot"></div>';
                d.onclick = () => { if (item.url) pOpenZoom(item.url); item.seen = true; pUpdateBadge(); pRenderInventory(); };
                l.appendChild(d);
            });
        }

        function pOpenZoom(u) {
            isZooming = true;
            const v = document.getElementById('p-zoom-viewer'), i = document.getElementById('p-zoom-img');
            i.src = u; v.style.display = 'flex';
        }

        function pCloseZoom() {
            isZooming = false;
            document.getElementById('p-zoom-viewer').style.display = 'none';
        }

        function pStopAllAudio() {
            const r = document.getElementById('p-ringtone-audio'), v = document.getElementById('p-call-voice-audio');
            r.pause(); r.currentTime = 0; v.pause(); v.currentTime = 0;
        }

        function pAnswerCall() {
            pStopAllAudio();
            document.getElementById('p-call-btns').style.display = 'none';
            document.getElementById('p-call-status').style.display = 'block';
            const v = document.getElementById('p-call-voice-audio');
            v.src = config.storyPages[pSimIdx].audioUrl || "";
            v.play().catch(() => pEndCall());
            v.onended = pEndCall;
        }

        function pEndCall() { pSimIdx++; pUpdateUI(); }

        function openHintConfirm(h) {
            const modal = document.getElementById('hint-modal');
            modal.style.display = 'flex';
            document.getElementById('hint-step-confirm').classList.remove('hidden');
            document.getElementById('hint-display-area').classList.add('hidden');
            document.getElementById('hint-show-btn').onclick = () => {
                const list = h.split('\n').filter(x => x.trim());
                document.getElementById('hint-content-text').textContent = list[Math.min(currentHintIdx, list.length - 1)];
                currentHintIdx++;
                document.getElementById('hint-step-confirm').classList.add('hidden');
                document.getElementById('hint-display-area').classList.remove('hidden');
            };
        }

        function closeHintModal() { document.getElementById('hint-modal').style.display = 'none'; }
        function pResetGame() { if (confirm("Elölről kezded?")) startGame(); }
        function pToggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function pStartQR() { document.getElementById('p-qr-layer').style.display = 'flex'; pQrScanner = new Html5Qrcode("p-qr-reader"); pQrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (t) => { if (t.trim().toUpperCase() === (config.storyPages[pSimIdx].qrCode || "").trim().toUpperCase()) pStopQR(false, () => { pSimIdx++; pUpdateUI(); }); }); }
        function pStopQR(m, cb) { if (pQrScanner) pQrScanner.stop().then(() => { pQrScanner = null; document.getElementById('p-qr-layer').style.display = 'none'; if (cb) cb(); }); else { document.getElementById('p-qr-layer').style.display = 'none'; if (cb) cb(); } }

        window.onload = initGame;
    </script>
</body>
</html>
