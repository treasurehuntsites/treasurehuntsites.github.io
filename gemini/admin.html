<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title>Kaland Játék Stúdió V7.8 - GPS Távolság ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111; color: #eee; overflow-x: hidden; }
        .play-font { font-family: 'Play', sans-serif; }
        
        .glass-card { background: rgba(44, 44, 44, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(138, 43, 226, 0.3); border-radius: 1rem; }
        .input-style { background: #2a2a2e; color: #00ffff; border: 1px solid #444; border-radius: 0.5rem; padding: 0.6rem; outline: none; transition: 0.2s; }
        .input-style:focus { border-color: #8a2be2; box-shadow: 0 0 10px rgba(138, 43, 226, 0.3); }
        
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #333; border: 1px solid transparent; cursor: pointer; transition: 0.2s; }
        .page-item.selected { border-color: #00ffff; background: #4c1d95; }
        .handle { cursor: grab; padding-right: 10px; color: #666; }

        .btn-ai { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; transition: 0.3s; box-shadow: 0 2px 10px rgba(168, 85, 247, 0.3); }
        .btn-ai:hover { transform: translateY(-1px); opacity: 0.9; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.5); }
        
        /* Mobil Szimulátor */
        .sim-container {
            position: sticky;
            top: 1rem;
            width: 320px;
            height: 580px;
            background: #000;
            border: 8px solid #222;
            border-radius: 2.5rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); z-index: 0; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 15px; padding-bottom: 20px; }
        
        /* Alsó menü szimulátor */
        .sim-bottom-bar { height: 50px; background: #1a1a1a; border-top: 2px solid #8a2be2; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .sim-menu-btn { color: #888; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .sim-menu-btn.active { color: #8a2be2; text-shadow: 0 0 8px rgba(138, 43, 226, 0.6); }

        /* Inventory szimulátor nézet */
        #sim-inventory-view { position: absolute; inset: 0; background: #111; z-index: 50; display: none; padding: 15px; padding-top: 40px; overflow-y: auto; }
        .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .inv-item-card { background: #222; border: 1px solid #444; border-radius: 8px; overflow: hidden; text-align: center; cursor: pointer; }
        .inv-item-img { width: 100%; height: 80px; object-fit: cover; }
        .inv-item-name { font-size: 10px; padding: 5px; color: #aaa; }

        /* Szimulátor UI elemek */
        .sim-box { background: rgba(0,0,0,0.85); border: 2px solid #8a2be2; border-radius: 1rem 1rem 0 0; padding: 12px; min-height: 150px; display: flex; flex-direction: column; }
        .sim-btn { background: #8a2be2; color: white; padding: 8px; border-radius: 0.4rem; font-weight: bold; text-align: center; font-size: 0.75rem; margin-top: 5px; cursor: pointer; text-transform: uppercase; }
        .sim-btn-cyan { background: #00ffff; color: #000; }
        .sim-avatar { position: absolute; top: -45px; left: 10px; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #00ffff; background: #000; z-index: 20; object-fit: cover; display: none; }
        
        /* Nagyító modális szimulátor */
        #sim-modal { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
        #sim-modal img { max-width: 100%; border: 2px solid #00ffff; border-radius: 10px; }

        .anna-txt { color: #ff69b4; } .mark-txt { color: #4169e1; } .sys-txt { color: #00ffff; font-style: italic; }

        #save-indicator { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #10b981; color: white; padding: 0.5rem 1rem; border-radius: 2rem; font-size: 0.7rem; font-weight: bold; display: none; z-index: 1000; }
        .ai-loading-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; border-radius: 1rem; flex-direction: column; }
        
        /* Modal for Summary */
        #summary-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; align-items: center; justify-content: center; padding: 2rem; }
        .summary-box { background: #1f1f23; border: 2px solid #a855f7; border-radius: 1rem; max-width: 600px; width: 90%; padding: 2rem; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="save-indicator"><i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...</div>

    <!-- AI Summary Modal -->
    <div id="summary-modal">
        <div class="summary-box">
            <h2 class="text-2xl font-bold text-purple-400 mb-4 flex items-center"><i class="fa fa-magic mr-3"></i> Történet Összefoglaló ✨</h2>
            <div id="summary-text" class="text-gray-300 leading-relaxed space-y-3 mb-6"></div>
            <button onclick="document.getElementById('summary-modal').style.display='none'" class="btn-ai w-full p-3 rounded-lg font-bold">BEZÁRÁS</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold uppercase tracking-tighter text-white">Stúdió <span class="text-purple-500">V7.8</span> ✨</h1>
                <p class="text-gray-500 text-sm">Élő szimulátor Gemini AI támogatással</p>
            </div>
            <div class="flex gap-2">
                <button onclick="geminiAI('summarize_all')" class="bg-gray-800 hover:bg-gray-700 text-purple-400 border border-purple-500/30 px-4 py-2 rounded-lg font-bold text-sm uppercase transition-all">✨ Összefoglaló</button>
                <button onclick="document.getElementById('uploadInput').click()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg font-bold text-sm uppercase transition-colors"><i class="fa fa-upload mr-2"></i>Betöltés</button>
                <button onclick="downloadConfig()" class="bg-cyan-500 hover:bg-cyan-400 text-black px-4 py-2 rounded-lg font-bold text-sm uppercase transition-colors"><i class="fa fa-download mr-2"></i>Letöltés</button>
                <input type="file" id="uploadInput" class="hidden" accept=".json" onchange="handleFileUpload(event)">
            </div>
        </header>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- BAL OLDAL: BEÁLLÍTÁSOK -->
            <div class="flex-1 space-y-6">
                
                <div class="glass-card p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <h3 class="text-purple-400 font-bold uppercase text-xs">Játék alapok</h3>
                        <input type="text" id="appTitle" class="input-style w-full" placeholder="Játék címe" oninput="autoSave()">
                        <input type="url" id="globalBg" class="input-style w-full text-xs" placeholder="Globális Háttér URL" oninput="autoSave()">
                        <input type="url" id="mapUrl" class="input-style w-full text-xs" placeholder="Alapértelmezett Térkép URL" oninput="autoSave()">
                    </div>
                    <div class="space-y-4">
                        <h3 class="text-purple-400 font-bold uppercase text-xs">Avatarok</h3>
                        <input type="url" id="annaAvatar" class="input-style w-full text-xs" placeholder="Anna Avatar URL" oninput="autoSave()">
                        <input type="url" id="markAvatar" class="input-style w-full text-xs" placeholder="Márk Avatar URL" oninput="autoSave()">
                    </div>
                </div>

                <!-- Inventory kezelés -->
                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-purple-400 font-bold uppercase text-xs">Inventory elemek</h3>
                        <button onclick="addInventoryItem()" class="text-cyan-400 text-xs font-bold uppercase">+ Új tárgy</button>
                    </div>
                    <div id="adminInventoryList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>

                <div class="glass-card p-4">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-purple-400 font-bold uppercase text-xs">Történetfolyam</h3>
                        <button onclick="addPage()" class="bg-purple-600 hover:bg-purple-500 px-3 py-1 rounded text-xs font-bold">+ ÚJ OLDAL</button>
                    </div>
                    <div id="pageList" class="max-h-64 overflow-y-auto pr-2 space-y-1"></div>
                </div>

                <div id="editorPanel" class="glass-card p-6 space-y-4 hidden relative">
                    <div id="ai-loading" class="ai-loading-overlay">
                        <i class="fa fa-magic fa-spin text-4xl text-cyan-400 mb-3"></i>
                        <p class="text-cyan-400 font-bold text-sm tracking-widest uppercase">A Gemini AI alkot...</p>
                    </div>
                    <div class="flex justify-between items-center">
                        <h3 class="text-cyan-400 font-bold uppercase text-sm">Szerkesztő</h3>
                        <div class="flex flex-wrap gap-1">
                            <button onclick="geminiAI('story')" class="btn-ai px-3 py-1 rounded text-[10px] font-bold">✨ FOLYTATÁS</button>
                            <button onclick="geminiAI('mystery')" class="btn-ai px-3 py-1 rounded text-[10px] font-bold">✨ REJTÉLY+</button>
                            <button onclick="geminiAI('choice')" class="btn-ai px-3 py-1 rounded text-[10px] font-bold">✨ OPCIÓK</button>
                        </div>
                    </div>
                    <textarea id="pageText" rows="5" class="input-style w-full font-sans text-sm" placeholder="Használd: §A Anna, §M Márk, §R Rendszer" oninput="autoSave()"></textarea>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <select id="pageType" class="input-style w-full text-xs" onchange="updateUI(); autoSave();">
                            <option value="story">Normál</option>
                            <option value="choice">Választás</option>
                            <option value="password">Kód</option>
                            <option value="gps">GPS Kapu</option>
                        </select>
                        <input type="number" id="nextIdx" class="input-style w-full text-xs" placeholder="Cél Index" oninput="autoSave()">
                        <div class="col-span-2">
                            <input type="url" id="pageBg" class="input-style w-full text-xs" placeholder="Egyedi Háttér URL" oninput="autoSave()">
                        </div>
                    </div>

                    <!-- GPS Beállítások -->
                    <div id="gpsArea" class="hidden space-y-2 border-t border-gray-700 pt-4">
                        <h3 class="text-cyan-400 font-bold uppercase text-[10px]">GPS Célpont</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="targetLat" class="input-style w-full text-xs" placeholder="Szélesség (Lat)" oninput="autoSave()">
                            <input type="text" id="targetLon" class="input-style w-full text-xs" placeholder="Hosszúság (Lon)" oninput="autoSave()">
                        </div>
                        <p class="text-[10px] text-gray-500 italic">A rendszer 25 méteren belül engedi tovább a játékost.</p>
                    </div>

                    <div id="choiceArea" class="hidden space-y-2 border-t border-gray-700 pt-4">
                        <div id="choicesContainer" class="space-y-2"></div>
                        <button onclick="addChoiceItem()" class="text-cyan-400 text-[10px] font-bold uppercase">+ Opció hozzáadása</button>
                    </div>

                    <div id="passwordArea" class="hidden space-y-2 border-t border-gray-700 pt-4">
                        <input type="text" id="correctPass" class="input-style w-full text-xs" placeholder="Helyes válasz" oninput="autoSave()">
                        <textarea id="passHints" rows="2" class="input-style w-full text-[10px]" placeholder="Tippek (soronként)" oninput="autoSave()"></textarea>
                    </div>
                </div>
            </div>

            <!-- JOBB OLDAL: SZIMULÁTOR -->
            <div class="w-full lg:w-auto flex justify-center">
                <div class="sim-container">
                    <!-- Fő játék nézet -->
                    <div id="sim-viewport">
                        <img id="sim-bg" src="">
                        <div id="sim-content">
                            <img id="sim-avatar" class="sim-avatar" src="">
                            <div class="sim-box play-font">
                                <div id="sim-text" class="text-white text-[13px] leading-relaxed overflow-y-auto pr-1 flex-grow"></div>
                                <div id="sim-actions" class="mt-3 flex flex-col gap-1"></div>
                            </div>
                        </div>

                        <!-- Inventory Overlay -->
                        <div id="sim-inventory-view" class="play-font">
                            <h2 class="text-purple-400 font-bold text-center mb-4 uppercase text-sm">Inventory</h2>
                            <div id="sim-inv-grid" class="inv-grid"></div>
                            <p id="inv-empty-msg" class="text-gray-600 text-center mt-10 text-xs hidden">Még nincsenek tárgyaid.</p>
                        </div>

                        <!-- Nagyító modális -->
                        <div id="sim-modal" onclick="this.style.display='none'">
                            <img id="sim-modal-img" src="">
                        </div>
                    </div>

                    <!-- Szimulátor alsó sáv -->
                    <div class="sim-bottom-bar">
                        <div class="sim-menu-btn" id="sim-btn-game" onclick="simSwitch('game')"><i class="fa fa-house"></i></div>
                        <div class="sim-menu-btn" id="sim-btn-map" onclick="simOpenMap()"><i class="fa-solid fa-map-location-dot"></i></div>
                        <div class="sim-menu-btn" id="sim-btn-inv" onclick="simSwitch('inventory')"><i class="fa-solid fa-briefcase"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Törlés modális -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-black/90 z-[2000] flex items-center justify-center p-4">
        <div class="glass-card p-8 max-w-xs w-full text-center border-red-500">
            <h3 class="text-xl font-bold mb-4">Törlöd?</h3>
            <div class="flex gap-4">
                <button onclick="closeDeleteModal()" class="flex-1 bg-gray-600 p-2 rounded font-bold">MÉGSE</button>
                <button id="confirmDelete" class="flex-1 bg-red-600 p-2 rounded font-bold uppercase">TÖRLÉS</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'KALAND_STUDIO_V75';
        const apiKey = ""; 
        
        let config = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
            appTitle: "Kaland",
            globalBg: "",
            mapUrl: "",
            annaAvatar: "",
            markAvatar: "",
            inventory: [],
            storyPages: [
                { content: "§R Üdvözöllek a stúdióban! Kezdd el szerkeszteni a történetet.", pageType: "story", nextIdx: 1, choices: [] }
            ]
        };

        let currentIdx = -1;
        let simIdx = 0;
        let simView = 'game';
        let saveTimeout;
        let sortable;
        let gpsWatchId = null;

        // --- GEMINI API CALL UTIL ---
        async function callGemini(userQuery, systemPrompt, mimeType = null) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };
            if (mimeType) payload.generationConfig = { responseMimeType: mimeType };

            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, { method: 'POST', body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error('API hiba');
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (e) {
                    if (i === 4) throw e;
                    const delay = Math.pow(2, i) * 1000;
                    await new Promise(r => setTimeout(r, delay));
                }
            }
        }

        // --- GEMINI AI FUNKCIÓK ---
        async function geminiAI(task) {
            const loader = document.getElementById('ai-loading');
            
            if(task !== 'summarize_all') {
                if(currentIdx === -1) return;
                loader.style.display = 'flex';
            } else {
                document.getElementById('summary-text').innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> Adatok elemzése...';
                document.getElementById('summary-modal').style.display = 'flex';
            }
            
            try {
                let prompt = "";
                let system = "Te egy kreatív kalandjáték író segéd vagy.";
                let query = "";
                let isJson = false;

                if (task === 'story') {
                    system = "Folytasd a történetet 2 izgalmas mondattal. Használd a §A (Anna), §M (Márk) vagy §R (Rendszer) jelöléseket.";
                    query = `Eddigi szöveg: ${config.storyPages[currentIdx].content}`;
                } else if (task === 'mystery') {
                    system = "Írd át a megadott szöveget úgy, hogy sokkal rejtélyesebb, sötétebb és hangulatosabb legyen. Maradj tömör. Tartsd meg a § jelöléseket.";
                    query = `Eredeti szöveg: ${config.storyPages[currentIdx].content}`;
                } else if (task === 'choice') {
                    system = "Generálj 3 logikus választási lehetőséget JSON formátumban: [{text: 'opció', target: 0}]. Csak a JSON-t add vissza.";
                    query = `Kontextus: ${config.storyPages[currentIdx].content}`;
                    isJson = true;
                } else if (task === 'summarize_all') {
                    system = "Foglald össze a teljes kalandjáték történetét és logikáját pontokba szedve, magyar nyelven. Legyél inspiráló.";
                    query = `Játék címe: ${config.appTitle}\nOldalak: ${JSON.stringify(config.storyPages.map(p => p.content))}`;
                }

                const res = await callGemini(query, system, isJson ? "application/json" : null);

                if (task === 'story') {
                    document.getElementById('pageText').value += (document.getElementById('pageText').value ? "\n\n" : "") + res;
                } else if (task === 'mystery') {
                    document.getElementById('pageText').value = res;
                } else if (task === 'choice') {
                    const choices = JSON.parse(res.replace(/```json|```/g, '').trim());
                    config.storyPages[currentIdx].choices = choices;
                    renderChoices();
                } else if (task === 'summarize_all') {
                    document.getElementById('summary-text').innerHTML = res.replace(/\n/g, '<br>');
                }

                autoSave();
                if(task !== 'summarize_all') loadPage(currentIdx);
            } catch (e) {
                console.error(e);
                if(task === 'summarize_all') {
                    document.getElementById('summary-text').innerHTML = '<span class="text-red-400">Hiba történt a generálás során. Kérlek próbáld újra később!</span>';
                }
            } finally {
                loader.style.display = 'none';
            }
        }

        // --- SZIMULÁTOR LOGIKA ---
        function simSwitch(view) {
            simView = view;
            document.getElementById('sim-viewport').style.display = view === 'game' || view === 'inventory' ? 'block' : 'none';
            document.getElementById('sim-inventory-view').style.display = view === 'inventory' ? 'block' : 'none';
            
            document.getElementById('sim-btn-game').classList.toggle('active', view === 'game');
            document.getElementById('sim-btn-inv').classList.toggle('active', view === 'inventory');
            
            if(view === 'game') updateSimulator();
            else if(view === 'inventory') updateInventorySim();
        }

        function simOpenMap(customUrl = null) {
            const url = customUrl || config.mapUrl;
            if(url) window.open(url, '_blank');
        }

        function updateSimulator() {
            if(gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
            
            const p = config.storyPages[simIdx];
            if(!p) {
                document.getElementById('sim-text').textContent = "Vége a kalandnak.";
                document.getElementById('sim-actions').innerHTML = '<div class="sim-btn" onclick="resetSim()">ÚJRAKEZDÉS</div>';
                return;
            }
            document.getElementById('sim-bg').src = p.pageBg || config.globalBg || "";
            const formatted = p.content
                .replace(/§A/g, '<span class="anna-txt font-bold">Anna:</span>')
                .replace(/§M/g, '<span class="mark-txt font-bold">Márk:</span>')
                .replace(/§R/g, '<span class="sys-txt font-bold">[Rendszer]:</span>');
            document.getElementById('sim-text').innerHTML = formatted;

            const av = document.getElementById('sim-avatar');
            av.style.display = 'none';
            if(p.content.includes("§A") && config.annaAvatar) { av.src = config.annaAvatar; av.style.display = 'block'; }
            else if(p.content.includes("§M") && config.markAvatar) { av.src = config.markAvatar; av.style.display = 'block'; }

            const actions = document.getElementById('sim-actions');
            actions.innerHTML = '';

            if(p.pageType === 'choice' && p.choices) {
                p.choices.forEach(c => {
                    const b = document.createElement('div'); b.className = "sim-btn";
                    b.textContent = c.text || "Opció";
                    b.onclick = () => { simIdx = parseInt(c.target); updateSimulator(); };
                    actions.appendChild(b);
                });
            } else if(p.pageType === 'gps') {
                const gpsUI = document.createElement('div');
                gpsUI.className = "text-center p-3 bg-black/60 rounded-lg border border-cyan-500/30 mb-2";
                gpsUI.innerHTML = `
                    <div class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Távolság a célponttól</div>
                    <div id="sim-gps-dist" class="text-3xl font-bold text-cyan-400 tracking-tighter">Várakozás...</div>
                `;
                actions.appendChild(gpsUI);

                const mapBtn = document.createElement('div');
                mapBtn.className = "sim-btn sim-btn-cyan";
                mapBtn.innerHTML = '<i class="fa fa-map-marker-alt mr-2"></i>Térkép megnyitása';
                mapBtn.onclick = () => {
                    const url = `https://www.google.com/maps?q=${p.targetLat},${p.targetLon}`;
                    simOpenMap(url);
                };
                actions.appendChild(mapBtn);

                const simReachBtn = document.createElement('div');
                simReachBtn.className = "sim-btn";
                simReachBtn.style.opacity = "0.5";
                simReachBtn.textContent = "Helyszín szimulálása (Teszt)";
                simReachBtn.onclick = () => { simIdx = parseInt(p.nextIdx || simIdx + 1); updateSimulator(); };
                actions.appendChild(simReachBtn);

                if(navigator.geolocation) {
                    gpsWatchId = navigator.geolocation.watchPosition(pos => {
                        const targetLat = parseFloat(p.targetLat);
                        const targetLon = parseFloat(p.targetLon);
                        
                        if (isNaN(targetLat) || isNaN(targetLon)) {
                            const distEl = document.getElementById('sim-gps-dist');
                            if (distEl) distEl.textContent = "Nincs koord.";
                            return;
                        }

                        const d = calcDist(pos.coords.latitude, pos.coords.longitude, targetLat, targetLon);
                        const distEl = document.getElementById('sim-gps-dist');
                        if (distEl) distEl.textContent = `${Math.round(d)} m`;
                        
                        if(d < 25) { 
                            navigator.geolocation.clearWatch(gpsWatchId); 
                            gpsWatchId = null;
                            simIdx = parseInt(p.nextIdx || simIdx + 1); 
                            updateSimulator(); 
                        }
                    }, (err) => {
                        const distEl = document.getElementById('sim-gps-dist');
                        let msg = "GPS hiba";
                        if (err.code === 1) msg = "Nincs engedély";
                        else if (err.code === 2) msg = "Helyzet hiba";
                        else if (err.code === 3) msg = "Időtúllépés";
                        
                        if (distEl) distEl.textContent = msg;
                    }, {enableHighAccuracy: true, timeout: 10000, maximumAge: 0});
                } else {
                    const distEl = document.getElementById('sim-gps-dist');
                    if (distEl) distEl.textContent = "Nincs GPS";
                }
            } else {
                const b = document.createElement('div'); b.className = "sim-btn";
                b.textContent = "TOVÁBB";
                b.onclick = () => { simIdx = parseInt(p.nextIdx || simIdx + 1); updateSimulator(); };
                actions.appendChild(b);
            }
        }

        function calcDist(la1, lo1, la2, lo2) {
            const R = 6371e3; 
            const f1 = la1 * Math.PI/180; 
            const f2 = la2 * Math.PI/180;
            const df = (la2-la1) * Math.PI/180; 
            const dl = (lo2-lo1) * Math.PI/180;
            const a = Math.sin(df/2) * Math.sin(df/2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function updateInventorySim() {
            const grid = document.getElementById('sim-inv-grid');
            const empty = document.getElementById('inv-empty-msg');
            grid.innerHTML = '';
            if(config.inventory.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                config.inventory.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "inv-item-card";
                    card.innerHTML = `
                        <img src="${item.url}" class="inv-item-img" onerror="this.src='https://placehold.co/100x80?text=Kép+nélkül'">
                        <div class="inv-item-name">${item.name}</div>
                    `;
                    card.onclick = () => {
                        document.getElementById('sim-modal-img').src = item.url;
                        document.getElementById('sim-modal').style.display = 'flex';
                    };
                    grid.appendChild(card);
                });
            }
        }

        window.resetSim = () => { simIdx = 0; simSwitch('game'); };

        // --- ADMIN LOGIKA ---
        function renderInventoryAdmin() {
            const container = document.getElementById('adminInventoryList');
            container.innerHTML = '';
            config.inventory.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = "bg-[#333] p-3 rounded-lg flex flex-col gap-2 relative border border-gray-600";
                div.innerHTML = `
                    <input type="text" class="input-style text-xs py-1" value="${item.name}" placeholder="Tárgy neve" oninput="updateInvItem(${i}, 'name', this.value)">
                    <input type="url" class="input-style text-[10px] py-1" value="${item.url}" placeholder="Kép URL" oninput="updateInvItem(${i}, 'url', this.value)">
                    <button onclick="removeInvItem(${i})" class="absolute -top-2 -right-2 bg-red-600 w-5 h-5 rounded-full text-xs">×</button>
                `;
                container.appendChild(div);
            });
        }

        function addInventoryItem() { config.inventory.push({name: 'Új tárgy', url: ''}); renderInventoryAdmin(); autoSave(); }
        function updateInvItem(i, key, val) { config.inventory[i][key] = val; autoSave(); }
        function removeInvItem(i) { config.inventory.splice(i, 1); renderInventoryAdmin(); autoSave(); }

        function renderPageList() {
            const list = document.getElementById('pageList');
            list.innerHTML = '';
            config.storyPages.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `page-item ${i === currentIdx ? 'selected' : ''}`;
                div.innerHTML = `
                    <div class="flex items-center flex-1 overflow-hidden" onclick="loadPage(${i})">
                        <i class="fa fa-bars handle"></i>
                        <span class="truncate text-xs ml-2">#${i}: ${p.content.substring(0, 30)}...</span>
                    </div>
                    <i class="fa fa-trash text-red-400 text-xs hover:text-red-500 ml-2 cursor-pointer" onclick="openDeleteModal(${i})"></i>
                `;
                list.appendChild(div);
            });
            if(sortable) sortable.destroy();
            sortable = new Sortable(list, {
                handle: '.handle', animation: 150,
                onEnd: (evt) => {
                    const item = config.storyPages.splice(evt.oldIndex, 1)[0];
                    config.storyPages.splice(evt.newIndex, 0, item);
                    currentIdx = -1; document.getElementById('editorPanel').classList.add('hidden');
                    autoSave();
                }
            });
        }

        function loadPage(i) {
            currentIdx = i; const p = config.storyPages[i];
            document.getElementById('editorPanel').classList.remove('hidden');
            document.getElementById('pageText').value = p.content;
            document.getElementById('nextIdx').value = p.nextIdx ?? "";
            document.getElementById('pageType').value = p.pageType || 'story';
            document.getElementById('pageBg').value = p.pageBg || "";
            document.getElementById('targetLat').value = p.targetLat || "";
            document.getElementById('targetLon').value = p.targetLon || "";
            document.getElementById('correctPass').value = p.password || "";
            document.getElementById('passHints').value = (p.hints || []).join('\n');
            
            updateUI(); 
            renderChoices();
            renderPageList();
            simIdx = i; simSwitch('game');
        }

        function renderChoices() {
            const container = document.getElementById('choicesContainer');
            container.innerHTML = '';
            const p = config.storyPages[currentIdx];
            if(!p.choices) p.choices = [];
            p.choices.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = "flex gap-2";
                div.innerHTML = `
                    <input type="text" class="input-style flex-1 text-[10px]" value="${c.text}" placeholder="Gomb felirat" oninput="updateChoice(${i}, 'text', this.value)">
                    <input type="number" class="input-style w-16 text-[10px]" value="${c.target}" placeholder="Cél" oninput="updateChoice(${i}, 'target', this.value)">
                    <button onclick="removeChoice(${i})" class="text-red-400 px-1">×</button>
                `;
                container.appendChild(div);
            });
        }

        function addChoiceItem() { config.storyPages[currentIdx].choices.push({text: 'Opció', target: 0}); renderChoices(); autoSave(); }
        function updateChoice(i, key, val) { config.storyPages[currentIdx].choices[i][key] = val; autoSave(); }
        function removeChoice(i) { config.storyPages[currentIdx].choices.splice(i, 1); renderChoices(); autoSave(); }

        function updateUI() {
            const type = document.getElementById('pageType').value;
            document.getElementById('choiceArea').classList.toggle('hidden', type !== 'choice');
            document.getElementById('passwordArea').classList.toggle('hidden', type !== 'password');
            document.getElementById('gpsArea').classList.toggle('hidden', type !== 'gps');
        }

        function autoSave() {
            clearTimeout(saveTimeout);
            document.getElementById('save-indicator').style.display = 'block';
            saveTimeout = setTimeout(() => {
                if(currentIdx !== -1) {
                    const p = config.storyPages[currentIdx];
                    p.content = document.getElementById('pageText').value;
                    p.nextIdx = document.getElementById('nextIdx').value;
                    p.pageType = document.getElementById('pageType').value;
                    p.pageBg = document.getElementById('pageBg').value;
                    p.targetLat = document.getElementById('targetLat').value;
                    p.targetLon = document.getElementById('targetLon').value;
                    p.password = document.getElementById('correctPass').value;
                    p.hints = document.getElementById('passHints').value.split('\n').filter(t => t.trim());
                    
                    if(p.pageType === 'choice') {
                        p.choices = Array.from(document.getElementById('choicesContainer').children).map(c => ({
                            text: c.querySelector('input[type="text"]').value,
                            target: c.querySelector('input[type="number"]').value
                        }));
                    }
                }
                config.appTitle = document.getElementById('appTitle').value;
                config.globalBg = document.getElementById('globalBg').value;
                config.mapUrl = document.getElementById('mapUrl').value;
                config.annaAvatar = document.getElementById('annaAvatar').value;
                config.markAvatar = document.getElementById('markAvatar').value;

                localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
                renderPageList();
                if(simView === 'game') updateSimulator();
                else updateInventorySim();
                setTimeout(() => document.getElementById('save-indicator').style.display = 'none', 500);
            }, 300);
        }

        function addPage() {
            config.storyPages.push({ content: "Új kaland...", pageType: "story", nextIdx: config.storyPages.length, choices: [] });
            loadPage(config.storyPages.length - 1);
            autoSave();
        }

        let delIdx = -1;
        window.openDeleteModal = (i) => { delIdx = i; document.getElementById('deleteModal').classList.remove('hidden'); };
        window.closeDeleteModal = () => document.getElementById('deleteModal').classList.add('hidden');
        document.getElementById('confirmDelete').onclick = () => {
            config.storyPages.splice(delIdx, 1);
            currentIdx = -1; simIdx = 0;
            document.getElementById('editorPanel').classList.add('hidden');
            autoSave(); closeDeleteModal();
        };

        function downloadConfig() {
            const blob = new Blob([JSON.stringify(config, null, 2)], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = 'game_config.json'; a.click();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const newConfig = JSON.parse(e.target.result);
                    if (!newConfig.storyPages) throw new Error("Érvénytelen konfiguráció");
                    config = newConfig;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
                    window.onload();
                    resetSim();
                    const indicator = document.getElementById('save-indicator');
                    indicator.innerHTML = '<i class="fa fa-check mr-2"></i> KONFIGURÁCIÓ BETÖLTVE!';
                    indicator.style.display = 'block';
                    setTimeout(() => {
                        indicator.style.display = 'none';
                        indicator.innerHTML = '<i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...';
                    }, 2000);
                } catch (err) {
                    alert("Sikertelen betöltés: Érvénytelen JSON fájl!");
                }
            };
            reader.readAsText(file);
            event.target.value = ""; 
        }

        window.onload = () => {
            document.getElementById('appTitle').value = config.appTitle || "";
            document.getElementById('globalBg').value = config.globalBg || "";
            document.getElementById('mapUrl').value = config.mapUrl || "";
            document.getElementById('annaAvatar').value = config.annaAvatar || "";
            document.getElementById('markAvatar').value = config.markAvatar || "";
            currentIdx = -1;
            document.getElementById('editorPanel').classList.add('hidden');
            renderInventoryAdmin();
            renderPageList();
            simSwitch('game');
        };
    </script>
</body>
</html>
