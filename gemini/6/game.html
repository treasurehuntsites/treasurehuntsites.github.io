<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Kaland Játék Lejátszó V1.9 ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --accent: #8b5cf6;
            --sab: env(safe-area-inset-bottom);
            --sat: env(safe-area-inset-top);
        }

        /* Teljes képernyős görgethető alapváz a címsor elrejtéséhez */
        html, body { 
            font-family: 'Play', sans-serif; 
            background-color: var(--bg-dark); 
            color: #f8fafc; 
            margin: 0;
            padding: 0;
            width: 100%;
            /* Magasság növelése a görgethetőség érdekében, hogy a címsor elrejtőzhessen */
            min-height: 120vh;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: none; /* Megakadályozza a felesleges rángatózást */
        }
        
        /* A fő konténer rögzítve marad a nézeten belül, nem mozog a görgetéssel */
        .game-container {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: fixed; 
            top: 0;
            left: 0;
            z-index: 10;
            overflow: hidden;
            /* Biztosítja, hogy ne ugorjon meg a tartalom a méretváltozáskor */
            contain: size layout;
        }

        @media (min-width: 640px) {
            body { display: flex; align-items: center; justify-content: center; background: #0f172a; min-height: 100vh; }
            .game-container {
                position: relative;
                max-width: 420px;
                height: 90vh;
                border: 8px solid #1e293b;
                border-radius: 3rem;
                overflow: hidden;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
        }

        /* Háttér réteg, ami a body-val együtt mozdulhat */
        #bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 150vh; 
            z-index: 0;
        }
        #bg-layer {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.35);
            transition: opacity 0.5s ease;
        }
        
        /* Tartalmi réteg fixálása */
        #content-wrapper {
            position: absolute; 
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: calc(75px + var(--sab)); 
            pointer-events: none; 
        }
        
        .story-box { 
            position: relative;
            pointer-events: auto; 
            background: rgba(0,0,0,0.92); 
            backdrop-filter: blur(20px);
            border-top: 3px solid var(--accent); 
            border-radius: 2rem 2rem 0 0; 
            padding: 24px; 
            padding-top: 50px;
            box-shadow: 0 -15px 40px rgba(0,0,0,0.8);
            /* Megszünteti a jump effektet azzal, hogy az aljához van kötve */
            transform: translateY(0);
        }
        
        .avatar-img { 
            position: absolute; 
            top: -40px; 
            left: 30px; 
            width: 80px; 
            height: 80px; 
            border-radius: 50%; 
            border: 3px solid var(--accent); 
            background: #000; 
            z-index: 25; 
            object-fit: cover; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        #story-text-container {
            text-align: justify;
            hyphens: auto;
            padding: 0 5px;
            line-height: 1.6;
            font-size: 16px;
        }

        .game-btn { 
            flex: 1;
            background: var(--accent); 
            color: white; 
            padding: 16px; 
            border-radius: 14px; 
            font-weight: bold; 
            text-align: center; 
            font-size: 0.95rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-btn:active { transform: scale(0.96); background: #a855f7; }
        .btn-cyan { background: #22d3ee !important; color: #000 !important; }
        .btn-secondary { background: #334155; }
        
        .bottom-nav { 
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(70px + var(--sab)); 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(139, 92, 246, 0.3); 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding-bottom: var(--sab); 
            z-index: 100; 
        }
        
        .nav-btn { position: relative; color: #64748b; font-size: 1.6rem; cursor: pointer; transition: 0.3s; background: none; border: none; }
        .nav-btn.active { color: var(--accent); }

        .notif-dot {
            position: absolute;
            top: -2px;
            right: -5px;
            width: 10px; height: 10px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid #0f172a;
            display: none;
            animation: pulse-red 2s infinite;
        }

        #inventory-view { 
            position: absolute; 
            inset: 0; 
            background: var(--bg-dark); 
            z-index: 150; 
            display: none; 
            padding: calc(30px + var(--sat)) 20px calc(90px + var(--sab)) 20px; 
            overflow-y: auto; 
        }

        .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .inv-card { position: relative; background: #1e293b; border: 1px solid #334155; border-radius: 16px; overflow: hidden; text-align: center; }
        .inv-img { width: 100%; height: 120px; object-fit: cover; }
        .inv-name { font-size: 12px; padding: 12px; color: #cbd5e1; font-weight: 600; }

        #fullscreen-modal { 
            position: absolute; 
            inset: 0; 
            background: rgba(0,0,0,0.98); 
            z-index: 200; 
            display: none; 
            flex-direction: column;
            touch-action: none; 
        }
        #modal-header {
            display: flex;
            justify-content: flex-end;
            padding: calc(15px + var(--sat)) 20px 10px 20px;
            z-index: 210;
        }
        #zoom-viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #modal-img { 
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }

        #import-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg-dark);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .sim-input { 
            font-family: 'Play', sans-serif;
            background: rgba(255,255,255,0.05); 
            border: 1px solid #334155; 
            color: #fff; 
            border-radius: 12px; 
            padding: 16px; 
            font-size: 16px; 
            width: 100%; 
            margin-bottom: 15px;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="bg-container">
        <img id="bg-layer" src="">
    </div>

    <div class="game-container">
        <div id="import-overlay">
            <div class="mb-10">
                <i class="fa-solid fa-wand-magic-sparkles text-8xl text-purple-500 mb-6 block animate-bounce"></i>
                <h1 class="text-3xl font-bold uppercase tracking-widest mb-2">Kaland Vár</h1>
                <p id="status-msg" class="text-slate-400 text-sm">Adatok betöltése...</p>
            </div>
            <div id="manual-import" class="hidden w-full max-w-xs mx-auto">
                <button onclick="document.getElementById('fileInput').click()" class="game-btn w-full">
                    <i class="fa fa-file-import mr-2"></i> Játék betöltése
                </button>
                <input type="file" id="fileInput" class="hidden" accept=".json" onchange="loadGameFile(event)">
            </div>
        </div>

        <div id="viewport" class="flex flex-col h-full">
            <div id="content-wrapper">
                <div class="story-box">
                    <img id="avatar-img" class="avatar-img" style="display:none" src="">
                    <div id="header-area" class="px-2"></div>
                    
                    <div id="text-scroll-area" class="overflow-y-auto pr-1 mb-4 scroll-smooth" style="max-height: 50vh;">
                        <img id="page-illustration" class="w-full rounded-2xl mb-5 hidden shadow-lg border border-white/10" src="">
                        <div id="story-text-container" class="text-white leading-relaxed"></div>
                    </div>

                    <div id="action-area" class="flex gap-2"></div>
                </div>
            </div>

            <div id="inventory-view">
                <h2 class="text-cyan-400 font-bold text-center mb-10 uppercase text-sm tracking-widest">Felszerelés</h2>
                <div id="inv-grid" class="inv-grid"></div>
                <div id="inv-empty" class="text-slate-500 text-center mt-32 text-xs hidden">
                    <i class="fa-solid fa-box-open text-5xl mb-5 opacity-10 block mx-auto"></i>
                    Üres a táskád.
                </div>
            </div>

            <div id="fullscreen-modal">
                <div id="modal-header">
                    <button onclick="closeModal(true)" class="text-white bg-white/10 w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md">
                        <i class="fa fa-times text-xl"></i>
                    </button>
                </div>
                <div id="zoom-viewport">
                    <img id="modal-img" src="">
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn active" id="nav-game" onclick="switchView('game', true)"><i class="fa fa-house"></i></button>
            <button class="nav-btn" id="nav-map" onclick="openMap()"><i class="fa-solid fa-map-location-dot"></i></button>
            <button class="nav-btn" id="nav-inv" onclick="switchView('inventory', true)"><i class="fa-solid fa-briefcase"></i><div id="notif-dot" class="notif-dot"></div></button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'KALAND_STUDIO_V86_DYNAMIC';
        let config = null;
        let simIdx = 0;
        let hintIdx = 0;
        let currentView = 'game';
        let gpsWatchId = null;

        let scale = 1;
        let lastScale = 1;
        let startDist = 0;

        // Vissza gomb kezelő logika (Kilépés gátlással)
        window.onpopstate = function(event) {
            // Galéria zárás
            if (document.getElementById('fullscreen-modal').style.display === 'flex') {
                closeModal(false);
                return;
            } 
            // Eszköztár zárás
            if (currentView === 'inventory') {
                switchView('game', false);
                return;
            }
            
            // Ha a főoldalon vagyunk és vissza akarnak lépni, újra benn tartjuk őket
            history.pushState(null, null, window.location.href);
        };

        function loadConfig(data) {
            config = data;
            config.storyPages.forEach(p => {
                if (p.inventory) {
                    p.inventory.forEach(item => {
                        if (item.seen === undefined) item.seen = true;
                    });
                }
            });
            startGame();
        }

        function loadGameFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try { loadConfig(JSON.parse(e.target.result)); } 
                catch (err) { alert("Hiba a fájl feldolgozásakor!"); }
            };
            reader.readAsText(file);
        }

        function startGame() {
            document.getElementById('import-overlay').style.display = 'none';
            simIdx = 0;
            // Kezdeti history trap beállítása
            history.pushState(null, null, window.location.href);
            renderPage();
        }

        function switchView(view, pushState = true) {
            if (view === currentView) return;
            
            if (pushState) {
                history.pushState({view: view}, "");
            }

            currentView = view;
            document.getElementById('inventory-view').style.display = view === 'inventory' ? 'block' : 'none';
            document.getElementById('nav-game').classList.toggle('active', view === 'game');
            document.getElementById('nav-inv').classList.toggle('active', view === 'inventory');
            
            if (view === 'inventory') {
                document.getElementById('notif-dot').style.display = 'none';
                renderInventory();
            }
        }

        function renderInventory() {
            const grid = document.getElementById('inv-grid');
            const empty = document.getElementById('inv-empty');
            grid.innerHTML = '';
            const p = config.storyPages[simIdx];
            if (!p || !p.inventory || p.inventory.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                p.inventory.forEach((item, i) => {
                    const card = document.createElement('div');
                    card.className = "inv-card";
                    const newTag = item.seen === false ? '<div class="new-tag">Új</div>' : '';
                    card.innerHTML = `${newTag}<img src="${item.url}" class="inv-img" onerror="this.src='https://via.placeholder.com/150x100?text=Kép'"><div class="inv-name">${item.name || 'Tárgy'}</div>`;
                    card.onclick = () => {
                        item.seen = true;
                        if (item.url) openGallery(item.url);
                        renderInventory();
                    };
                    grid.appendChild(card);
                });
            }
        }

        function openGallery(url) {
            history.pushState({modal: "gallery"}, "");
            const img = document.getElementById('modal-img');
            img.src = url;
            scale = 1;
            lastScale = 1;
            img.style.transform = `scale(1)`;
            document.getElementById('fullscreen-modal').style.display = 'flex';
        }

        function closeModal(manual = true) {
            const modal = document.getElementById('fullscreen-modal');
            if (modal.style.display === 'none') return;

            modal.style.display = 'none';
            if (manual) {
                history.back();
            }
        }

        const zoomViewport = document.getElementById('zoom-viewport');
        const modalImg = document.getElementById('modal-img');

        zoomViewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                startDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        });

        zoomViewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                scale = lastScale * (dist / startDist);
                if (scale < 1) scale = 1;
                if (scale > 5) scale = 5;
                modalImg.style.transform = `scale(${scale})`;
            }
        });

        zoomViewport.addEventListener('touchend', (e) => {
            lastScale = scale;
        });

        function openMap() {
            if (config?.mapUrl) window.open(config.mapUrl, '_blank');
            else alert("Nincs térkép megadva.");
        }

        function calcDist(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const f1 = lat1 * Math.PI/180; const f2 = lat2 * Math.PI/180;
            const df = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(df/2) * Math.sin(df/2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function renderPage() {
            if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
            const p = config.storyPages[simIdx];
            if (!p) return;

            document.getElementById('bg-layer').src = p.pageBg || config.globalBg || "";
            const pageImg = document.getElementById('page-illustration');
            if (p.pageImage) { pageImg.src = p.pageImage; pageImg.classList.remove('hidden'); }
            else pageImg.classList.add('hidden');

            let rawText = p.content || "";
            rawText = rawText.replace(/§R/g, '<span class="text-cyan-400 font-bold italic">[Rendszer]:</span>');

            const avImg = document.getElementById('avatar-img');
            avImg.style.display = 'none';
            
            let firstAv = null;
            if (config.avatars) {
                config.avatars.forEach(av => {
                    const regex = new RegExp(`§${av.id}`, 'g');
                    if (rawText.includes(`§${av.id}`)) {
                        if (!firstAv) firstAv = av;
                        rawText = rawText.replace(regex, `<span style="color: ${av.color}; font-weight: bold;">${av.name}:</span>`);
                    }
                });
            }

            if (firstAv?.url) {
                avImg.src = firstAv.url; avImg.style.display = 'block'; avImg.style.borderColor = firstAv.color;
            }
            document.getElementById('story-text-container').innerHTML = rawText;

            const header = document.getElementById('header-area');
            const actions = document.getElementById('action-area');
            header.innerHTML = ''; actions.innerHTML = '';

            const goBack = () => { simIdx = (p.prevIdx !== undefined && p.prevIdx !== "") ? parseInt(p.prevIdx) : Math.max(0, simIdx - 1); hintIdx = 0; renderPage(); };

            const hasNew = p.inventory?.some(i => i.seen === false);
            if (hasNew && currentView !== 'inventory') document.getElementById('notif-dot').style.display = 'block';

            if (simIdx > 0 || (p.prevIdx !== undefined && p.prevIdx !== "")) {
                if (['choice', 'password', 'gps'].includes(p.pageType)) {
                    const arrow = document.createElement('div');
                    arrow.className = "text-slate-400 mb-4 cursor-pointer w-fit p-1";
                    arrow.innerHTML = '<i class="fa fa-chevron-left mr-2"></i>';
                    arrow.onclick = goBack;
                    header.appendChild(arrow);
                } else {
                    const btn = document.createElement('div'); btn.className = "game-btn btn-secondary"; btn.textContent = "Vissza"; btn.onclick = goBack;
                    actions.appendChild(btn);
                }
            }

            if (p.pageType === 'choice') {
                actions.className = "flex flex-col gap-2";
                p.choices.forEach(c => {
                    const btn = document.createElement('div'); btn.className = "game-btn"; btn.textContent = c.text;
                    btn.onclick = () => { simIdx = parseInt(c.target); renderPage(); };
                    actions.appendChild(btn);
                });
            } else if (p.pageType === 'password') {
                actions.className = "flex flex-col w-full";
                const tipArea = document.createElement('div'); tipArea.className = "text-[12px] text-cyan-400 italic text-center mb-3 hidden";
                const hBtn = document.createElement('div'); hBtn.className = "w-10 h-10 rounded-full bg-white/5 border border-slate-700 flex items-center justify-center text-slate-400 mx-auto mb-3 cursor-pointer"; hBtn.innerHTML = '<i class="fa fa-lightbulb"></i>';
                hBtn.onclick = () => { if (p.hints?.length) { tipArea.textContent = "Tipp: " + p.hints[hintIdx % p.hints.length]; tipArea.classList.remove('hidden'); hintIdx++; } };
                const input = document.createElement('input'); input.className = "sim-input"; input.placeholder = "Kód...";
                const ok = document.createElement('div'); ok.className = "game-btn"; ok.textContent = "OK";
                ok.onclick = () => {
                    if (input.value.trim().toLowerCase() === (p.password || "").trim().toLowerCase()) { simIdx = (p.nextIdx !== undefined && p.nextIdx !== "") ? parseInt(p.nextIdx) : simIdx + 1; renderPage(); }
                    else input.style.borderColor = "#ef4444";
                };
                actions.append(tipArea, hBtn, input, ok);
            } else if (p.pageType === 'gps') {
                actions.className = "flex flex-col w-full";
                const info = document.createElement('div'); info.className = "text-center p-5 bg-white/5 rounded-2xl border border-cyan-500/20 mb-4 animate-pulse";
                info.innerHTML = `<div class="text-[10px] uppercase text-slate-500 mb-1">Távolság</div><div id="gps-val" class="text-2xl font-bold text-cyan-400">...</div>`;
                const mapBtn = document.createElement('div'); mapBtn.className = "game-btn btn-cyan mb-2"; mapBtn.innerHTML = '<i class="fa-solid fa-location-dot mr-2"></i> Térkép';
                mapBtn.onclick = openMap;
                actions.append(info, mapBtn);
                if (navigator.geolocation) {
                    gpsWatchId = navigator.geolocation.watchPosition(pos => {
                        const d = calcDist(pos.coords.latitude, pos.coords.longitude, parseFloat(p.targetLat), parseFloat(p.targetLon));
                        const el = document.getElementById('gps-val'); if (el) el.textContent = `${Math.round(d)} m`;
                        if (d < 25) { navigator.geolocation.clearWatch(gpsWatchId); simIdx = (p.nextIdx !== undefined && p.nextIdx !== "") ? parseInt(p.nextIdx) : simIdx + 1; renderPage(); }
                    }, null, { enableHighAccuracy: true });
                }
            } else {
                actions.className = "flex gap-2";
                const next = document.createElement('div'); next.className = "game-btn"; next.textContent = "Tovább";
                next.onclick = () => { simIdx = (p.nextIdx !== undefined && p.nextIdx !== "") ? parseInt(p.nextIdx) : simIdx + 1; renderPage(); };
                actions.appendChild(next);
            }
            document.getElementById('text-scroll-area').scrollTop = 0;
            // Enyhe görgetés a címsor elrejtéséhez, de a UI fix marad
            setTimeout(() => window.scrollTo(0, 1), 100);
        }

        window.onload = async () => {
            try {
                const response = await fetch('export.json');
                if (response.ok) { loadConfig(await response.json()); return; }
            } catch (e) {}

            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) { loadConfig(JSON.parse(saved)); return; }

            document.getElementById('status-msg').textContent = "Válassz egy kalandot!";
            document.getElementById('manual-import').classList.remove('hidden');
        };
    </script>
</body>
</html>
