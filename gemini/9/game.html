<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaland Játék</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            font-family: 'Play', sans-serif; 
            background-color: #000; 
            color: #f8fafc; 
            overflow: hidden; 
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000;
        }

        /* Háttér réteg */
        #viewport { position: relative; flex-grow: 1; overflow: hidden; }
        #bg-layer { 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: brightness(0.4); 
            z-index: 0; 
            transition: src 0.5s ease-in-out; 
        }
        
        /* Tartalom réteg */
        #content-layer { 
            position: relative; 
            z-index: 10; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            padding: 0;
        }
        
        .dialog-box { 
            position: relative;
            background: rgba(0,0,0,0.94); 
            border-top: 3px solid #8b5cf6; 
            border-radius: 1.5rem 1.5rem 0 0; 
            padding: 20px; 
            padding-top: 40px;
            padding-bottom: 30px; 
            min-height: 250px; 
            max-height: 70%;
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
        }
        
        /* Avatar pozíció */
        .avatar-frame { 
            position: absolute; 
            top: -40px; 
            left: 15px; 
            width: 75px; 
            height: 75px; 
            border-radius: 50%; 
            border: 3px solid #8b5cf6; 
            background: #000; 
            z-index: 20; 
            object-fit: cover; 
            display: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Gombok stílusa */
        .action-btn { 
            flex: 1; 
            background: #8b5cf6; 
            color: white; 
            padding: 16px; 
            border-radius: 0.75rem; 
            font-weight: 700; 
            text-align: center; 
            font-size: 1rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%;
            border: none;
        }
        .action-btn:active { transform: scale(0.98); background: #a855f7; }
        .btn-back { background: #334155; }
        
        /* Alsó menüsor */
        .bottom-nav { 
            height: 75px; 
            background: #0f172a; 
            border-top: 1px solid rgba(139, 92, 246, 0.3); 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            z-index: 100; 
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; position: relative; transition: color 0.3s; }
        .nav-item.active { color: #8b5cf6; }
        
        .badge { 
            position: absolute; 
            top: -5px; 
            right: -5px; 
            background: #ef4444; 
            color: white; 
            font-size: 10px; 
            padding: 2px 6px; 
            border-radius: 50%; 
            font-weight: bold; 
        }

        #story-text {
            text-align: justify;
            hyphens: auto;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        #inventory-overlay { 
            position: absolute; 
            inset: 0; 
            background: #0f172a; 
            z-index: 50; 
            display: none; 
            padding: 25px; 
            padding-top: 50px; 
            overflow-y: auto;
        }
        .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item-card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 1rem; 
            padding: 15px; 
            text-align: center; 
            cursor: pointer; 
        }
        .item-card img { width: 65px; height: 65px; object-fit: contain; margin: 0 auto 10px; }

        #zoom-viewer { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.95); 
            z-index: 2000; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
        }
        #zoom-img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px; }

        .loading-screen { 
            position: fixed; 
            inset: 0; 
            background: #0f172a; 
            z-index: 3000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center;
            padding: 20px;
        }

        .manual-load-btn {
            background: #8b5cf6;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-screen">
        <div id="loading-spinner" class="w-12 h-12 border-4 border-slate-800 border-t-purple-500 rounded-full animate-spin mb-4"></div>
        <div id="loading-msg" class="text-purple-400 font-bold uppercase tracking-widest text-sm">Fájl keresése...</div>
        
        <!-- Manuális betöltés felülete (alapértelmezetten rejtett) -->
        <div id="manual-ui" class="hidden flex flex-col items-center">
            <p class="text-slate-400 text-xs mt-4 mb-6 max-w-xs">Nem találtam automatikus játékmegnyitást (game.json). Kérlek válaszd ki a fájlt manuálisan!</p>
            <button onclick="document.getElementById('file-input').click()" class="manual-load-btn">
                <i class="fa fa-file-import mr-2"></i> Játék betöltése
            </button>
            <input type="file" id="file-input" class="hidden" accept=".json" onchange="handleFileSelect(event)">
        </div>
    </div>

    <!-- Kép nagyító -->
    <div id="zoom-viewer" onclick="this.style.display='none'">
        <img id="zoom-img" src="">
    </div>

    <!-- QR Olvasó -->
    <div id="qr-layer" class="hidden fixed inset-0 bg-black/95 z-[60] flex flex-col items-center justify-center p-6">
        <div class="border-2 border-cyan-400 p-8 rounded-2xl mb-6 relative">
            <div class="absolute inset-x-0 top-0 h-1 bg-cyan-400 animate-bounce opacity-50"></div>
            <i class="fa fa-qrcode text-6xl text-white"></i>
        </div>
        <input type="text" id="qr-input" class="w-full max-w-xs bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-lg text-center mb-4" placeholder="Kód...">
        <div class="flex gap-2 w-full max-w-xs">
            <button onclick="checkQR()" class="action-btn">OK</button>
            <button onclick="document.getElementById('qr-layer').classList.add('hidden')" class="action-btn btn-back">X</button>
        </div>
    </div>

    <div class="game-wrapper">
        <div id="viewport">
            <img id="bg-layer" src="">
            <div id="inventory-overlay">
                <h2 class="text-center text-cyan-400 font-bold mb-8 uppercase tracking-widest text-xl">Hátizsák</h2>
                <div id="item-list" class="item-grid"></div>
            </div>

            <div id="content-layer">
                <div class="dialog-box">
                    <img id="avatar-img" class="avatar-frame" src="">
                    <div id="scroll-area" class="overflow-y-auto pr-1 flex-grow scroll-smooth">
                        <img id="page-illustration" class="w-full rounded-xl mb-4 hidden border border-slate-800 shadow-2xl" src="">
                        <div id="gps-display" class="hidden bg-cyan-900/30 border border-cyan-500 p-4 rounded-xl text-center mb-4">
                            <div class="text-[10px] uppercase text-cyan-400 font-bold mb-1">Célpont távolsága</div>
                            <div id="dist-val" class="text-3xl font-bold text-white">--- m</div>
                        </div>
                        <div id="story-text"></div>
                    </div>
                    <div id="button-container" class="mt-4 flex flex-col gap-3"></div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <button id="nav-map" class="nav-item active" onclick="switchView('map')"><i class="fa fa-map-marked-alt"></i></button>
            <button id="nav-inv" class="nav-item" onclick="switchView('inv')">
                <i class="fa-solid fa-briefcase"></i>
                <div id="inv-badge" class="badge hidden">0</div>
            </button>
            <button class="nav-item" onclick="resetGame()"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'KALAND_STUDIO_V10_6';
        let config = null, simIdx = 0, inventory = [], gpsWatcher = null;

        function calcDist(la1, lo1, la2, lo2) {
            const R = 6371e3;
            const f1 = la1 * Math.PI/180, f2 = la2 * Math.PI/180;
            const df = (la2-la1) * Math.PI/180, dl = (lo2-lo1) * Math.PI/180;
            const a = Math.sin(df/2) * Math.sin(df/2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function loadGame() {
            try {
                // 1. Próbáljuk a game.json-t
                const response = await fetch('game.json');
                if (response.ok) {
                    config = await response.json();
                } else {
                    // 2. Próbáljuk a localStorage-et (Stúdió adatok)
                    const local = localStorage.getItem(STORAGE_KEY);
                    if(local) config = JSON.parse(local);
                }
                
                if (config) {
                    initGame();
                    document.getElementById('loading').style.display = 'none';
                } else {
                    showManualLoad();
                }
            } catch (err) {
                showManualLoad();
            }
        }

        function showManualLoad() {
            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('loading-msg').innerHTML = "<span class='text-red-400'>Nincs betöltött játék</span>";
            document.getElementById('manual-ui').classList.remove('hidden');
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    config = JSON.parse(e.target.result);
                    initGame();
                    document.getElementById('loading').style.display = 'none';
                } catch(err) {
                    alert("Hibás JSON fájl!");
                }
            };
            reader.readAsText(file);
        }

        function initGame() { 
            document.title = config.appTitle || "Kaland"; 
            simIdx = 0; 
            inventory = []; 
            updateUI(); 
        }

        function updateUI() {
            if (gpsWatcher) { navigator.geolocation.clearWatch(gpsWatcher); gpsWatcher = null; }
            const p = config.storyPages[simIdx]; 
            if(!p) return;

            handleReward(p);

            document.getElementById('bg-layer').src = p.pageBg || config.globalBg || "";
            const ill = document.getElementById('page-illustration');
            if(p.pageImage) { ill.src = p.pageImage; ill.classList.remove('hidden'); } else { ill.classList.add('hidden'); }

            let text = p.content || "";
            const avImg = document.getElementById('avatar-img');
            avImg.style.display = 'none';
            config.avatars.forEach(av => {
                if(text.includes(`§${av.id}`)) {
                    avImg.src = av.url || "";
                    avImg.style.display = av.url ? 'block' : 'none';
                    avImg.style.borderColor = av.color;
                    text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color}">${av.name}:</span>`);
                }
            });
            document.getElementById('story-text').innerHTML = text;

            const container = document.getElementById('button-container');
            container.innerHTML = '';
            document.getElementById('gps-display').style.display = 'none';

            if (p.pageType === 'gps') {
                document.getElementById('gps-display').style.display = 'block';
                if (navigator.geolocation) {
                    gpsWatcher = navigator.geolocation.watchPosition(pos => {
                        const d = calcDist(pos.coords.latitude, pos.coords.longitude, parseFloat(p.targetLat), parseFloat(p.targetLon));
                        document.getElementById('dist-val').textContent = `${Math.round(d)} m`;
                        if (d < 15) {
                            navigator.geolocation.clearWatch(gpsWatcher);
                            gpsWatcher = null;
                            simIdx = parseInt(p.nextIdx) || simIdx + 1;
                            updateUI();
                        }
                    }, null, { enableHighAccuracy: true });
                }
                addBtn("TOVÁBB", () => { simIdx = parseInt(p.nextIdx) || simIdx + 1; updateUI(); }, "fa-chevron-right");
            } else if(p.pageType === 'qr') {
                addBtn("QR KÓD BEOLVASÁSA", () => document.getElementById('qr-layer').classList.remove('hidden'), "fa-camera");
            } else if(p.pageType === 'password') {
                const inp = document.createElement('input');
                inp.className = "w-full bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-lg text-center mb-2";
                inp.placeholder = "KÓD...";
                addBtn("NYITÁS", () => {
                    if(inp.value.trim().toLowerCase() == (p.password||"").toLowerCase()) {
                        simIdx = parseInt(p.nextIdx) || simIdx + 1;
                        updateUI();
                    } else { inp.style.borderColor = 'red'; }
                });
                container.prepend(inp);
            } else if(p.pageType === 'choice' && p.choices) {
                p.choices.forEach(c => addBtn(c.text, () => { simIdx = parseInt(c.target); updateUI(); }));
            } else {
                addBtn("TOVÁBB", () => { simIdx = parseInt(p.nextIdx) || simIdx + 1; updateUI(); }, "fa-chevron-right");
            }

            if(simIdx > 0 || (p.prevIdx !== undefined && p.prevIdx !== "")) {
                const back = document.createElement('button');
                back.className = "action-btn btn-back";
                back.innerHTML = `<i class="fa fa-arrow-left mr-2 opacity-50"></i> VISSZA`;
                back.onclick = () => {
                    simIdx = (p.prevIdx !== undefined && p.prevIdx !== "") ? parseInt(p.prevIdx) : simIdx - 1;
                    updateUI();
                };
                container.appendChild(back);
            }
        }

        function addBtn(text, fn, icon = "") {
            const b = document.createElement('button');
            b.className = "action-btn";
            b.innerHTML = `${text} ${icon ? `<i class="fa ${icon} ml-2 opacity-50"></i>` : ''}`;
            b.onclick = fn;
            document.getElementById('button-container').appendChild(b);
        }

        function checkQR() {
            const val = document.getElementById('qr-input').value.trim().toUpperCase();
            const p = config.storyPages[simIdx];
            if(val === (p.qrCode || "").toUpperCase()) {
                document.getElementById('qr-layer').classList.add('hidden');
                document.getElementById('qr-input').value = '';
                simIdx = parseInt(p.nextIdx) || simIdx + 1;
                updateUI();
            } else { document.getElementById('qr-input').style.borderColor = 'red'; }
        }

        function handleReward(p) {
            let n = p.storyItemName; if(!n) return;
            if(!inventory.find(item => item.name === n)) {
                inventory.push({ name: n, icon: p.storyItemIcon || '📦', url: p.storyItemUrl || '' });
                updateBadge();
            }
        }

        function updateBadge() {
            const b = document.getElementById('inv-badge');
            b.textContent = inventory.length;
            b.classList.toggle('hidden', inventory.length === 0);
        }

        function switchView(target) {
            const inv = document.getElementById('inventory-overlay');
            const navMap = document.getElementById('nav-map');
            const navInv = document.getElementById('nav-inv');
            if (target === 'inv') {
                if (inv.style.display === 'block') {
                    inv.style.display = 'none';
                    navInv.classList.remove('active');
                    navMap.classList.add('active');
                } else {
                    renderInventory();
                    inv.style.display = 'block';
                    navInv.classList.add('active');
                    navMap.classList.remove('active');
                }
            } else {
                inv.style.display = 'none';
                navInv.classList.remove('active');
                navMap.classList.add('active');
            }
        }

        function renderInventory() {
            const list = document.getElementById('item-list');
            list.innerHTML = '';
            inventory.forEach(item => {
                const d = document.createElement('div');
                d.className = "item-card";
                if(item.url) {
                    d.innerHTML = `<img src="${item.url}"><div class="text-[10px] uppercase font-bold text-slate-300">${item.name}</div>`;
                    d.onclick = () => {
                        document.getElementById('zoom-img').src = item.url;
                        document.getElementById('zoom-viewer').style.display = 'flex';
                        document.getElementById('inv-badge').classList.add('hidden');
                    };
                } else {
                    d.innerHTML = `<div class="text-4xl mb-2">${item.icon}</div><div class="text-[10px] uppercase font-bold text-slate-300">${item.name}</div>`;
                }
                list.appendChild(d);
            });
        }

        function resetGame() {
            if(confirm("Biztosan újrakezded? Minden haladás elvész.")) {
                simIdx = 0; inventory = []; updateBadge();
                switchView('map'); updateUI();
            }
        }

        window.onload = loadGame;
    </script>
</body>
</html>
