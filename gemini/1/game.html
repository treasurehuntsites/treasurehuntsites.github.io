<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kaland Játék Player V8.6 ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #00ffff;
            --bg-dark: #000000;
            --glass: rgba(0, 0, 0, 0.85);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }

        .play-font { font-family: 'Play', sans-serif; }

        /* Teljes képernyős app konténer */
        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Játék nézet */
        #game-viewport {
            position: relative;
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
        }

        #game-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.5);
            z-index: 0;
            transition: opacity 0.8s ease-in-out;
        }

        #game-content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            padding-bottom: 24px;
        }

        /* Interaktív szövegdoboz */
        .sim-box {
            position: relative;
            background: var(--glass);
            border: 2px solid var(--primary);
            border-radius: 1.5rem 1.5rem 0 0;
            padding: 20px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        /* Karakter Avatar a dobozon belül */
        .sim-avatar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid var(--secondary);
            background: #000;
            z-index: 20;
            object-fit: cover;
            display: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        /* Belső kép a szöveg felett */
        .inner-img {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 0.75rem;
            margin-bottom: 12px;
            display: none;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #sim-text {
            transition: padding 0.3s;
            font-size: 15px;
            line-height: 1.6;
            color: #fff;
        }

        /* Gombok és Akciók */
        .actions-container {
            margin-top: 16px;
            display: flex;
            flex-direction: row;
            gap: 12px;
        }

        .sim-btn {
            flex: 1;
            background: var(--primary);
            color: white;
            padding: 12px;
            border-radius: 0.75rem;
            font-weight: bold;
            text-align: center;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            border: none;
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        .sim-btn:active { transform: scale(0.96); opacity: 0.9; }
        .sim-btn-cyan { background: var(--secondary); color: #000; box-shadow: 0 4px 15px rgba(0, 255, 255, 0.4); }
        .sim-btn-secondary { background: #333; box-shadow: none; }

        /* Navigációs alsó sáv */
        .nav-bar {
            height: 70px;
            background: #111;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 100;
        }

        .nav-item {
            color: #666;
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            padding: 10px;
        }

        .nav-item.active {
            color: var(--primary);
            text-shadow: 0 0 15px rgba(138, 43, 226, 0.8);
        }

        /* Diszkrét navigáció nyíl */
        .sim-back-arrow {
            color: #888;
            cursor: pointer;
            font-size: 1.4rem;
            margin-bottom: 12px;
            width: fit-content;
            transition: 0.2s;
            display: flex;
            align-items: center;
        }
        .sim-back-arrow:hover { color: var(--primary); }

        /* Jelszó/Kód szekció */
        .sim-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            outline: none;
            width: 100%;
            margin-bottom: 12px;
            text-align: center;
        }

        .hint-circle-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0 auto 12px auto;
            color: #aaa;
            transition: 0.2s;
        }

        /* Tárgylista Overlay */
        #inventory-screen {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 200;
            display: none;
            padding: 24px;
            padding-top: 60px;
            overflow-y: auto;
        }

        .inv-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .inv-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 1rem;
            overflow: hidden;
            text-align: center;
        }

        .inv-img { width: 100%; height: 110px; object-fit: cover; }
        .inv-name { padding: 10px; font-size: 13px; color: #bbb; font-weight: 600; }

        /* Modal a nagyításhoz */
        #img-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #img-modal img { max-width: 100%; max-height: 80%; border: 2px solid var(--secondary); border-radius: 1rem; }

        /* Indító Screen */
        #splash-screen {
            position: absolute;
            inset: 0;
            z-index: 2000;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }

        /* Karakter színek */
        .anna-txt { color: #ff69b4; } 
        .mark-txt { color: #4169e1; } 
        .sys-txt { color: var(--secondary); font-style: italic; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Kezdő Screen -->
        <div id="splash-screen">
            <div class="mb-8">
                <i class="fa fa-rocket text-6xl text-purple-600 animate-pulse"></i>
            </div>
            <h1 id="splash-title" class="text-3xl font-bold mb-2 tracking-tighter uppercase play-font">Kaland Játék</h1>
            <p id="splash-status" class="text-gray-500 text-sm mb-12 italic">Betöltés...</p>
            
            <input type="file" id="manual-upload" class="hidden" accept=".json" onchange="handleManualLoad(event)">
            <button id="retry-btn" onclick="document.getElementById('manual-upload').click()" class="sim-btn w-64 hidden">
                <i class="fa fa-upload mr-2"></i> Konfiguráció betöltése
            </button>
        </div>

        <!-- Játéktér -->
        <div id="game-viewport">
            <img id="game-bg" src="">
            <div id="game-content">
                <div class="sim-box play-font fade-in">
                    <img id="sim-avatar" class="sim-avatar" src="">
                    <div id="sim-header" class="flex flex-col"></div>
                    <img id="sim-inner-img" class="inner-img" src="">
                    <div id="sim-text" class="overflow-y-auto pr-1"></div>
                    <div id="sim-actions" class="actions-container"></div>
                </div>
            </div>

            <!-- Tárgylista -->
            <div id="inventory-screen" class="play-font">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-bold text-purple-500 uppercase tracking-widest">Eszköztár</h2>
                    <button onclick="toggleInventory(false)" class="text-gray-500 text-2xl"><i class="fa fa-times"></i></button>
                </div>
                <div id="inv-grid" class="inv-grid"></div>
                <p id="inv-empty" class="text-gray-700 text-center mt-32 italic hidden">Ezen a helyszínen nincsenek tárgyaid.</p>
            </div>
        </div>

        <!-- Alsó menü -->
        <div class="nav-bar">
            <button class="nav-item active" id="nav-home" onclick="toggleInventory(false)">
                <i class="fa fa-house"></i>
            </button>
            <button class="nav-item" id="nav-map" onclick="handleMapOpen()">
                <i class="fa-solid fa-map-location-dot"></i>
            </button>
            <button class="nav-item" id="nav-inv" onclick="toggleInventory(true)">
                <i class="fa-solid fa-briefcase"></i>
            </button>
        </div>

        <!-- Nagyító Modal -->
        <div id="img-modal" onclick="this.style.display='none'">
            <img id="modal-target-img" src="">
        </div>
    </div>

    <script>
        let config = null;
        let currentIdx = 0;
        let currentHintIdx = 0;
        let gpsWatchId = null;

        // Automatikus betöltési kísérlet
        window.onload = () => {
            fetch('game_config.json')
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.json();
                })
                .then(data => {
                    config = data;
                    initGame();
                })
                .catch(() => {
                    document.getElementById('splash-status').textContent = "Válaszd ki a játékfájlt a kezdéshez!";
                    document.getElementById('retry-btn').classList.remove('hidden');
                });
        };

        function handleManualLoad(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    config = JSON.parse(ev.target.result);
                    initGame();
                } catch (err) { alert("Hiba a fájl beolvasásakor!"); }
            };
            reader.readAsText(file);
        }

        function initGame() {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('splash-title').textContent = config.appTitle || "Kaland Játék";
                currentIdx = 0;
                renderPage();
            }, 500);
        }

        function toggleInventory(show) {
            document.getElementById('inventory-screen').style.display = show ? 'block' : 'none';
            document.getElementById('nav-inv').classList.toggle('active', show);
            document.getElementById('nav-home').classList.toggle('active', !show);
            if (show) renderInventory();
        }

        function handleMapOpen() {
            if (config && config.mapUrl) window.open(config.mapUrl, '_blank');
        }

        function renderPage() {
            if (gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
            const p = config.storyPages[currentIdx];
            if (!p) return;

            // Háttér beállítása
            const bg = document.getElementById('game-bg');
            bg.style.opacity = '0';
            setTimeout(() => {
                bg.src = p.pageBg || config.globalBg || "";
                bg.style.opacity = '1';
            }, 200);

            // Szöveg formázása
            const simText = document.getElementById('sim-text');
            simText.innerHTML = p.content
                .replace(/§A/g, '<span class="anna-txt font-bold">Anna:</span>')
                .replace(/§M/g, '<span class="mark-txt font-bold">Márk:</span>')
                .replace(/§R/g, '<span class="sys-txt font-bold">[Rendszer]:</span>');

            // Belső kép kezelése
            const innerImg = document.getElementById('sim-inner-img');
            if(p.pageInnerImage) {
                innerImg.src = p.pageInnerImage;
                innerImg.style.display = 'block';
            } else {
                innerImg.style.display = 'none';
            }

            // Avatar kezelése
            const av = document.getElementById('sim-avatar');
            av.style.display = 'none';
            simText.style.paddingLeft = "0px";

            if (p.content.includes("§A") && config.annaAvatar) {
                av.src = config.annaAvatar;
                av.style.display = 'block';
                simText.style.paddingLeft = "64px";
            } else if (p.content.includes("§M") && config.markAvatar) {
                av.src = config.markAvatar;
                av.style.display = 'block';
                simText.style.paddingLeft = "64px";
            }

            // Interakciók renderelése
            const header = document.getElementById('sim-header');
            const actions = document.getElementById('sim-actions');
            header.innerHTML = '';
            actions.innerHTML = '';

            const onBack = () => {
                currentIdx = (p.prevIdx !== undefined && p.prevIdx !== "") ? parseInt(p.prevIdx) : currentIdx - 1;
                currentHintIdx = 0;
                renderPage();
            };

            const hasPrev = currentIdx > 0 || (p.prevIdx !== undefined && p.prevIdx !== "");

            // V8.6 Navigáció
            if (hasPrev) {
                if (p.pageType === 'choice' || p.pageType === 'password' || p.pageType === 'gps') {
                    const arrow = document.createElement('div');
                    arrow.className = "sim-back-arrow";
                    if (av.style.display === 'block') arrow.style.marginLeft = "64px";
                    arrow.innerHTML = '<i class="fa fa-chevron-left mr-2"></i>';
                    arrow.onclick = onBack;
                    header.appendChild(arrow);
                } else {
                    const btn = document.createElement('button');
                    btn.className = "sim-btn sim-btn-secondary";
                    btn.textContent = "Vissza";
                    btn.onclick = onBack;
                    actions.appendChild(btn);
                }
            }

            // Típus specifikus elemek
            if (p.pageType === 'choice' && p.choices) {
                const wrap = document.createElement('div');
                wrap.className = "flex flex-col gap-2 w-full";
                p.choices.forEach(c => {
                    const b = document.createElement('button');
                    b.className = "sim-btn";
                    b.textContent = c.text;
                    b.onclick = () => { currentIdx = parseInt(c.target); currentHintIdx = 0; renderPage(); };
                    wrap.appendChild(b);
                });
                actions.appendChild(wrap);
            } 
            else if (p.pageType === 'password') {
                const wrap = document.createElement('div');
                wrap.className = "flex flex-col w-full";

                const hintDisp = document.createElement('div');
                hintDisp.className = "text-[11px] text-cyan-400 mb-3 italic text-center hidden pass-hint-text";
                wrap.appendChild(hintDisp);

                const hBtn = document.createElement('div');
                hBtn.className = "hint-circle-btn";
                hBtn.innerHTML = '<i class="fa fa-question text-sm"></i>';
                hBtn.onclick = () => {
                    if (p.hints && p.hints.length > 0) {
                        hintDisp.textContent = `Tipp: ${p.hints[currentHintIdx % p.hints.length]}`;
                        hintDisp.classList.remove('hidden');
                        currentHintIdx++;
                    }
                };
                wrap.appendChild(hBtn);

                const input = document.createElement('input');
                input.className = "sim-input";
                input.placeholder = "Kód beírása...";
                input.id = "pass-field";
                wrap.appendChild(input);

                const bOk = document.createElement('button');
                bOk.className = "sim-btn w-full";
                bOk.textContent = "Ellenőrzés";
                bOk.onclick = () => {
                    const val = document.getElementById('pass-field').value.trim().toLowerCase();
                    const target = (p.password || "").trim().toLowerCase();
                    if (val === target) {
                        currentIdx = parseInt(p.nextIdx || currentIdx + 1);
                        currentHintIdx = 0;
                        renderPage();
                    } else {
                        document.getElementById('pass-field').style.borderColor = "red";
                        setTimeout(() => { if(document.getElementById('pass-field')) document.getElementById('pass-field').style.borderColor = ""; }, 1000);
                    }
                };
                wrap.appendChild(bOk);
                actions.appendChild(wrap);
            }
            else if (p.pageType === 'gps') {
                const wrap = document.createElement('div');
                wrap.className = "flex flex-col gap-2 w-full";
                const dBox = document.createElement('div');
                dBox.className = "text-center p-3 bg-black/60 rounded-xl border border-cyan-500/20 text-xs mb-2";
                dBox.innerHTML = `Cél távolsága: <span id="gps-dist-val" class="font-bold text-cyan-400 text-lg ml-2">-- m</span>`;
                wrap.appendChild(dBox);

                const mapBtn = document.createElement('button');
                mapBtn.className = "sim-btn sim-btn-cyan";
                mapBtn.innerHTML = '<i class="fa-solid fa-map-location-dot mr-2"></i> Térkép megnyitása';
                mapBtn.onclick = handleMapOpen;
                wrap.appendChild(mapBtn);
                actions.appendChild(wrap);

                if (navigator.geolocation) {
                    gpsWatchId = navigator.geolocation.watchPosition(pos => {
                        const dist = getDistance(pos.coords.latitude, pos.coords.longitude, parseFloat(p.targetLat), parseFloat(p.targetLon));
                        const el = document.getElementById('gps-dist-val');
                        if (el) el.textContent = `${Math.round(dist)} m`;
                        if (dist < 25) { 
                            navigator.geolocation.clearWatch(gpsWatchId);
                            currentIdx = parseInt(p.nextIdx || currentIdx + 1);
                            renderPage();
                        }
                    }, null, { enableHighAccuracy: true });
                }
            } else {
                const bNext = document.createElement('button');
                bNext.className = "sim-btn";
                bNext.textContent = "Tovább";
                bNext.onclick = () => { currentIdx = parseInt(p.nextIdx || currentIdx + 1); renderPage(); };
                actions.appendChild(bNext);
            }
        }

        function getDistance(la1, lo1, la2, lo2) {
            const R = 6371e3;
            const f1 = la1 * Math.PI/180; const f2 = la2 * Math.PI/180;
            const df = (la2-la1) * Math.PI/180; const dl = (lo2-lo1) * Math.PI/180;
            const a = Math.sin(df/2)**2 + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function renderInventory() {
            const grid = document.getElementById('inv-grid');
            const empty = document.getElementById('inv-empty');
            grid.innerHTML = '';
            
            const currentPage = config.storyPages[currentIdx];
            if (!currentPage || !currentPage.inventory || currentPage.inventory.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                currentPage.inventory.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "inv-card fade-in";
                    card.innerHTML = `
                        <img src="${item.url}" class="inv-img" onerror="this.src='https://placehold.co/200x120?text=Kép hiányzik'">
                        <div class="inv-name">${item.name}</div>
                    `;
                    card.onclick = () => {
                        if(item.url) {
                            document.getElementById('modal-target-img').src = item.url;
                            document.getElementById('img-modal').style.display = 'flex';
                        }
                    };
                    grid.appendChild(card);
                });
            }
        }
    </script>
</body>
</html>
