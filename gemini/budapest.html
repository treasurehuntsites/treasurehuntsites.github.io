<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <!-- Mobil nézet beállítása: fix méret, nagyítás tiltása a splash screen élményhez -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Apple (iOS) teljes képernyős mód beállítások -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Budapest">

    <title>Budapest – Átvezetés</title>
    
    <!-- Tailwind CSS betöltése -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Special Elite -->
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        /* Animáció: 5 másodperc be, 4 másodperc látható, 1 másodperc ki */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
            90% { opacity: 0; transform: scale(1.02); }
            100% { opacity: 0; }
        }

        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            /* Görgetés és "visszapattanó" effekt letiltása mobilon */
            overflow: hidden;
            overscroll-behavior: none;
            
            font-family: 'Special Elite', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            /* iOS Safari 100vh hiba javítása */
            height: -webkit-fill-available;
        }

        html {
            height: -webkit-fill-available;
        }

        #budapest-text {
            color: #fff;
            /* Dinamikus betűméret: mobilon nagyobb arányban */
            font-size: 15vw; 
            font-weight: 700;
            text-align: center;
            animation: fadeInOut 10s ease-in-out forwards;
            line-height: 1.2;
            padding: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Asztali nézet korrekciója */
        @media (min-width: 768px) {
            #budapest-text {
                font-size: 6rem;
            }
        }

        /* Érintés elleni védelem (ne jelenjen meg kijelölés vagy menü hosszas nyomásra) */
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="no-select">

    <div id="budapest-text">Budapest</div>

    <script type="text/javascript">
        // Átirányítási beállítások
        const delayInMilliseconds = 10500;
        const redirectUrl = "varoshaza.html";

        function redirectToNextPage() {
            // Finom átmenet az átirányítás előtt (opcionális logolás)
            console.log("Átirányítás...");
            window.location.href = redirectUrl;
        }

        // Amikor az oldal betöltött, elindul az időzítő
        window.onload = function() {
            // Automatikus görgetés az elejére, hogy elrejtsük a címsort mobilon
            window.scrollTo(0, 1);
            
            setTimeout(redirectToNextPage, delayInMilliseconds);
        };

        // Érintésre történő gyorsítás (ha a felhasználó nem akar várni)
        document.body.addEventListener('click', function() {
            // Opcionális: itt engedélyezhető a manuális továbblépés
            // redirectToNextPage(); 
        });
    </script>
</body>
</html>
