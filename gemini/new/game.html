<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaland Játék</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Play', sans-serif; 
            background-color: #000; 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        .game-wrapper { 
            width: 100%; height: 100%; 
            display: flex; flex-direction: column; 
            position: relative; background: #000; 
        }
        
        #viewport { position: relative; flex-grow: 1; overflow: hidden; }
        
        #bg-layer { 
            position: absolute; inset: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            filter: brightness(0.4); 
            z-index: 0; 
            transition: opacity 0.5s ease-in-out; 
        }
        
        #content-layer { 
            position: relative; z-index: 10; 
            height: 100%; display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
        }
        
        .dialog-box { 
            position: relative; 
            background: rgba(0,0,0,0.92); 
            border-top: 3px solid #8b5cf6; 
            border-radius: 1.5rem 1.5rem 0 0; 
            padding: 20px; 
            padding-top: 40px; 
            min-height: 250px; 
            max-height: 70%; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5); 
        }
        
        .avatar-frame { 
            position: absolute; 
            top: -40px; left: 10px; 
            width: 75px; height: 75px; 
            border-radius: 50%; 
            border: 3px solid #8b5cf6; 
            background: #000; 
            z-index: 20; 
            object-fit: cover; 
            display: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        
        .action-btn { 
            flex: 1; 
            background: #8b5cf6; 
            color: white; 
            padding: 16px; 
            border-radius: 0.75rem; 
            font-weight: 700; 
            text-align: center; 
            font-size: 0.9rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: none; 
        }
        .action-btn:active { transform: scale(0.98); background: #a855f7; }
        .action-btn.btn-secondary { background: #334155; }
        .action-btn.btn-secondary:active { background: #475569; }
        
        .bottom-nav { 
            height: 75px; 
            background: #0f172a; 
            border-top: 1px solid rgba(139, 92, 246, 0.3); 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            z-index: 100; 
            padding-bottom: env(safe-area-inset-bottom); 
        }
        
        .nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; position: relative; transition: color 0.3s; }
        .nav-item.active { color: #8b5cf6; }
        .badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; }
        
        #story-text { 
            text-align: justify; 
            hyphens: auto; 
            font-size: 16px; 
            font-weight: 700; 
            line-height: 1.6; 
            margin-bottom: 15px; 
            color: #e2e8f0;
        }
        
        #inventory-overlay { 
            position: absolute; inset: 0; 
            background: #0f172a; 
            z-index: 50; 
            display: none; 
            padding: 25px; 
            padding-top: 50px; 
            overflow-y: auto; 
        }
        
        .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item-card { 
            position: relative; 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 1rem; 
            padding: 15px; 
            text-align: center; 
            cursor: pointer; 
        }
        .item-card img { width: 65px; height: 65px; object-fit: contain; margin: 0 auto 10px; }
        .item-unread-dot { 
            position: absolute; top: 12px; right: 12px; 
            width: 10px; height: 10px; 
            background: #ef4444; 
            border-radius: 50%; 
            box-shadow: 0 0 5px rgba(239, 68, 68, 0.8); 
        }
        
        #qr-layer { 
            position: absolute; inset: 0; 
            background: rgba(0,0,0,0.95); 
            z-index: 100; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }
        #qr-reader { width: 280px; height: 280px; border: 3px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; }
        
        #zoom-viewer { 
            position: fixed; inset: 0; 
            background: rgba(0,0,0,0.95); 
            z-index: 2000; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
        }
        #zoom-img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px; }
        
        .loading-screen { 
            position: fixed; inset: 0; 
            background: #0f172a; 
            z-index: 3000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        .manual-btn { 
            background: #8b5cf6; 
            color: white; 
            padding: 12px 24px; 
            border-radius: 12px; 
            font-weight: bold; 
            text-transform: uppercase; 
            margin-top: 20px; 
            border: none; 
            cursor: pointer; 
        }

        #notification-toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #8b5cf6;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        #notification-toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="loading" class="loading-screen">
        <div id="loading-text" class="text-purple-400 font-bold uppercase text-sm tracking-widest animate-pulse">Kaland betöltése...</div>
        <div id="manual-loader" class="hidden text-center">
            <p class="text-xs text-slate-500 mb-4 px-10">Töltsd be a Stúdióból exportált <span class="text-purple-400">game.json</span> fájlt.</p>
            <button onclick="document.getElementById('manual-file').click()" class="manual-btn">Játék fájl kiválasztása</button>
            <input type="file" id="manual-file" class="hidden" accept=".json" onchange="handleManualLoad(event)">
        </div>
    </div>

    <div id="notification-toast">Új tárgy a hátizsákban!</div>

    <div id="qr-layer">
        <div id="qr-reader"></div>
        <div class="text-white mt-4 text-xs font-bold uppercase tracking-widest">Szkenneld be a kódot</div>
        <button onclick="stopQR()" class="action-btn mt-6 max-w-xs">MÉGSE</button>
    </div>

    <div id="zoom-viewer" onclick="this.style.display='none'">
        <img id="zoom-img" src="">
    </div>

    <div class="game-wrapper">
        <div id="viewport">
            <img id="bg-layer" src="">
            <div id="inventory-overlay">
                <h2 class="text-center text-cyan-400 font-bold mb-8 uppercase tracking-widest">Hátizsák</h2>
                <div id="item-list" class="item-grid"></div>
                <button onclick="switchView('map')" class="action-btn mt-10">Vissza a játékhoz</button>
            </div>
            <div id="content-layer">
                <div class="dialog-box">
                    <img id="avatar-img" class="avatar-frame" src="">
                    <div id="scroll-area" class="overflow-y-auto pr-1 flex-grow">
                        <img id="page-illustration" class="w-full rounded-xl mb-4 hidden border border-slate-800 shadow-2xl" src="">
                        <div id="story-text"></div>
                    </div>
                    <div id="button-container" class="mt-4"></div>
                </div>
            </div>
        </div>
        <div class="bottom-nav">
            <button id="nav-map" class="nav-item active" onclick="switchView('map')"><i class="fa fa-compass"></i></button>
            <button id="nav-inv" class="nav-item" onclick="switchView('inv')">
                <i class="fa-solid fa-suitcase"></i>
                <div id="inv-badge" class="badge hidden">0</div>
            </button>
            <button class="nav-item" onclick="resetGame()"><i class="fa-solid fa-undo"></i></button>
            <button class="nav-item" onclick="toggleFullscreen()"><i class="fa fa-expand"></i></button>
        </div>
    </div>

    <script>
        let config = null, simIdx = 0, inventory = [], qrScanner = null;

        async function loadGame() {
            try {
                const response = await fetch('game.json');
                if (!response.ok) throw new Error();
                config = await response.json();
                initGame();
                document.getElementById('loading').style.display = 'none';
            } catch (err) {
                document.getElementById('manual-loader').classList.remove('hidden');
                document.getElementById('loading-text').style.display = 'none';
            }
        }

        function handleManualLoad(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => { 
                try {
                    config = JSON.parse(ev.target.result); 
                    initGame(); 
                    document.getElementById('loading').style.display = 'none'; 
                } catch(e) { alert("Hiba a JSON fájl beolvasásakor!"); }
            };
            reader.readAsText(file);
        }

        function initGame() { 
            document.title = config.appTitle || "Kaland Játék"; 
            simIdx = 0; 
            inventory = []; 
            updateUI(); 
        }

        function showToast(text) {
            const el = document.getElementById('notification-toast');
            el.textContent = text;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function updateUI() {
            const p = config.storyPages[simIdx]; if(!p) return;
            
            handleReward(p);

            const bgLayer = document.getElementById('bg-layer');
            bgLayer.style.opacity = 0;
            setTimeout(() => {
                bgLayer.src = p.pageBg || config.globalBg || "";
                bgLayer.style.opacity = 1;
            }, 200);

            let text = p.content || "";
            const avImg = document.getElementById('avatar-img'); 
            avImg.style.display = 'none';

            config.avatars.forEach(av => {
                if(text.includes(`§${av.id}`)) {
                    avImg.src = av.url || ""; 
                    avImg.style.display = av.url ? 'block' : 'none'; 
                    avImg.style.borderColor = av.color;
                    text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color}; font-weight:700;">${av.name}:</span>`);
                }
            });
            document.getElementById('story-text').innerHTML = text;
            
            const ill = document.getElementById('page-illustration'); 
            if(p.pageImage) { 
                ill.src = p.pageImage; 
                ill.classList.remove('hidden'); 
            } else { 
                ill.classList.add('hidden'); 
            }

            const container = document.getElementById('button-container'); 
            container.innerHTML = '';

            // Navigációs gombok egymás mellett
            const navWrapper = document.createElement('div');
            navWrapper.className = "flex gap-3 w-full";
            
            // "VISSZA" gomb hozzáadása, ha lehetséges
            if(p.prevIdx !== undefined && p.prevIdx !== "" && p.prevIdx !== null) {
                const b = createActionBtn("Vissza", () => { simIdx = parseInt(p.prevIdx); updateUI(); }, "fa-arrow-left", true);
                navWrapper.appendChild(b);
            }

            // Fő interakció hozzáadása
            if (p.pageType === 'qr') {
                const b = createActionBtn("Szkennelés", startQR, "fa-qrcode");
                navWrapper.appendChild(b);
            } else if(p.pageType === 'password') {
                const inp = document.createElement('input'); 
                inp.className = "w-full bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-xl text-center mb-3"; 
                inp.placeholder = "KÓD...";
                container.appendChild(inp);
                const b = createActionBtn("Nyitás", () => { 
                    if(inp.value.trim().toLowerCase() == (p.password||"").toLowerCase()) { 
                        simIdx = parseInt(p.nextIdx) || simIdx + 1; 
                        updateUI(); 
                    } else {
                        inp.classList.add('border-red-500');
                        setTimeout(() => inp.classList.remove('border-red-500'), 800);
                        showToast("Helytelen kód!");
                    }
                }, "fa-unlock");
                navWrapper.appendChild(b);
            } else if(p.pageType === 'choice' && p.choices) {
                // Választásoknál függőleges lista, kivéve ha csak egy választás van? 
                // A kérésre való tekintettel a választások maradnak függőlegesek, de a vissza gomb az aljukon lesz vízszintesen ha kell.
                const choicesWrapper = document.createElement('div');
                choicesWrapper.className = "flex flex-col gap-3 w-full mb-3";
                p.choices.forEach(c => {
                    if (c.req && !inventory.find(i => i.name.toLowerCase() === c.req.toLowerCase())) return;
                    const b = createActionBtn(c.text, () => { simIdx = parseInt(c.target); updateUI(); });
                    choicesWrapper.appendChild(b);
                });
                container.appendChild(choicesWrapper);
            } else {
                const b = createActionBtn("Tovább", () => { simIdx = parseInt(p.nextIdx) || simIdx + 1; updateUI(); }, "fa-chevron-right");
                navWrapper.appendChild(b);
            }

            if (navWrapper.hasChildNodes()) {
                container.appendChild(navWrapper);
            }

            document.getElementById('scroll-area').scrollTop = 0;
        }

        function createActionBtn(text, fn, icon = "", isSecondary = false) {
            const b = document.createElement('button'); 
            b.className = `action-btn ${isSecondary ? 'btn-secondary' : ''}`;
            let iconHtml = icon ? (icon.includes('arrow-left') ? `<i class="fa ${icon} mr-2 opacity-50"></i>` : `<i class="fa ${icon} ml-2 opacity-50"></i>`) : '';
            b.innerHTML = icon.includes('arrow-left') ? `${iconHtml}${text}` : `${text}${iconHtml}`;
            b.onclick = fn; 
            return b;
        }

        function startQR() {
            document.getElementById('qr-layer').style.display = 'flex';
            qrScanner = new Html5Qrcode("qr-reader");
            qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
                const p = config.storyPages[simIdx];
                if (decodedText.trim().toUpperCase() === (p.qrCode || "").toUpperCase()) {
                    stopQR(); 
                    simIdx = parseInt(p.nextIdx) || simIdx + 1; 
                    updateUI();
                } else {
                    showToast("Hibás kód!");
                }
            }).catch(() => { 
                alert("Kamera hiba!"); 
                stopQR(); 
            });
        }

        function stopQR() {
            if (qrScanner) {
                qrScanner.stop().then(() => { 
                    document.getElementById('qr-layer').style.display = 'none'; 
                    qrScanner = null; 
                });
            } else {
                document.getElementById('qr-layer').style.display = 'none';
            }
        }

        function handleReward(p) {
            const name = p.storyItemName;
            if(name && !inventory.find(item => item.name === name)) {
                inventory.push({ 
                    name: name, 
                    icon: p.storyItemIcon || '📦', 
                    url: p.storyItemUrl || '', 
                    seen: false 
                });
                updateBadge();
                showToast(`Megszerezted: ${name}!`);
            }
        }

        function updateBadge() {
            const b = document.getElementById('inv-badge');
            const unread = inventory.filter(i => !i.seen).length;
            b.textContent = unread;
            b.classList.toggle('hidden', unread === 0);
        }

        function switchView(target) {
            const inv = document.getElementById('inventory-overlay');
            const navInv = document.getElementById('nav-inv');
            const navMap = document.getElementById('nav-map');

            if (target === 'inv') {
                renderInventory();
                inv.style.display = 'block';
                navInv.classList.add('active');
                navMap.classList.remove('active');
            } else {
                inv.style.display = 'none';
                navInv.classList.remove('active');
                navMap.classList.add('active');
            }
        }

        function renderInventory() {
            const list = document.getElementById('item-list'); 
            list.innerHTML = '';
            if (inventory.length === 0) {
                list.innerHTML = '<div class="col-span-2 text-center text-slate-500 text-xs py-20 italic">A hátizsákod üres.</div>';
            }
            inventory.forEach(item => {
                const d = document.createElement('div'); d.className = "item-card";
                let content = item.url ? 
                    `<img src="${item.url}"><div class="text-[10px] font-bold text-white uppercase">${item.name}</div>` : 
                    `<div class="text-4xl mb-2">${item.icon}</div><div class="text-[10px] font-bold text-white uppercase">${item.name}</div>`;
                
                if (!item.seen) content += `<div class="item-unread-dot"></div>`;
                
                d.innerHTML = content;
                d.onclick = () => {
                    if(item.url) { 
                        document.getElementById('zoom-img').src = item.url; 
                        document.getElementById('zoom-viewer').style.display = 'flex'; 
                    }
                    item.seen = true; 
                    updateBadge(); 
                    renderInventory();
                };
                list.appendChild(d);
            });
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }

        function resetGame() { 
            if(confirm("Újrakezded a kalandot?")) { 
                simIdx = 0; 
                inventory = []; 
                updateBadge(); 
                switchView('map'); 
                updateUI(); 
            } 
        }

        window.onload = loadGame;
    </script>
</body>
</html>
