<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaland Játék Stúdió V11.0 ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Play', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        #studio-view { height: 100%; overflow-y: auto; padding: 2.5rem; }
        .glass-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            border-radius: 1rem; 
        }
        .input-style { 
            background: #0f172a; 
            color: #22d3ee; 
            border: 1px solid #334155; 
            border-radius: 0.5rem; 
            padding: 0.6rem; 
            outline: none; 
            transition: 0.2s; 
            width: 100%; 
        }
        .input-style:focus { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; }
        .page-item.selected { border-color: #22d3ee; background: #4c1d95; }
        .handle { cursor: grab; padding-right: 15px; color: #64748b; font-size: 0.9rem; }

        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s ease-in-out; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { position: relative; background: rgba(0,0,0,0.94); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 35px; min-height: 220px; display: flex; flex-direction: column; }
        .sim-avatar { position: absolute; top: -40px; left: 10px; width: 65px; height: 65px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; }
        .sim-btn { flex: 1; background: #8b5cf6; color: white; padding: 12px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.05rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .sim-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #475569; }
        .sim-btn-back { background: #334155; }
        .sim-bottom-bar { height: 65px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; }

        #player-view { position: fixed; inset: 0; z-index: 4000; background: #000; display: none; flex-direction: column; }
        .p-game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #p-viewport { position: relative; flex-grow: 1; overflow: hidden; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; }
        #p-content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        
        .p-dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 40px; min-height: 250px; max-height: 70%; display: flex; flex-direction: column; box-shadow: 0 -10px 25px rgba(0,0,0,0.5); }
        .p-avatar-frame { position: absolute; top: -40px; left: 10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .p-action-btn { flex: 1; background: #8b5cf6; color: white; padding: 16px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.25rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .p-action-btn:active { transform: scale(0.98); background: #a855f7; }
        .p-btn-back { background: #334155; }
        
        .p-bottom-nav { height: 75px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .p-nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; position: relative; transition: color 0.3s; }
        .p-nav-item.active { color: #8b5cf6; }
        .p-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; }
        
        #p-story-text { text-align: justify; hyphens: auto; font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 15px; color: #f8fafc; }
        
        #p-inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 50; display: none; padding: 25px; padding-top: 50px; overflow-y: auto; }
        .p-item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .p-item-card { position: relative; background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 15px; text-align: center; cursor: pointer; }
        .p-item-card img { width: 65px; height: 65px; object-fit: contain; margin: 0 auto 10px; }
        .p-item-unread-dot { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; }

        #p-qr-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #p-qr-reader { width: 280px; height: 280px; border: 3px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; }
        
        #p-zoom-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; align-items: center; justify-content: center; touch-action: none; overflow: hidden; }
        #p-zoom-img { 
            max-width: 95%; 
            max-height: 90%; 
            object-fit: contain; 
            border-radius: 8px; 
            transition: transform 0.1s ease-out; 
            cursor: zoom-out; 
        }

        .view-toggle-btn {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 6000;
            background: #8b5cf6;
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #save-indicator { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; font-size: 0.75rem; font-weight: bold; display: none; z-index: 1000; }
        #custom-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #1e293b; border: 2px solid #8b5cf6; border-radius: 1.5rem; padding: 2rem; max-width: 400px; width: 90%; text-align: center; }
    </style>
</head>
<body>
    <div id="save-indicator"><i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...</div>

    <div id="custom-modal">
        <div class="modal-box">
            <h3 class="text-xl font-bold mb-4 uppercase">Biztosan törlöd?</h3>
            <p class="text-slate-400 mb-8">Ezt a műveletet nem lehet visszavonni.</p>
            <div class="flex gap-4">
                <button id="modal-cancel" class="flex-1 bg-slate-700 p-3 rounded-xl font-bold uppercase text-xs">Mégse</button>
                <button id="modal-confirm" class="flex-1 bg-red-600 p-3 rounded-xl font-bold uppercase text-xs">Törlés</button>
            </div>
        </div>
    </div>

    <button id="main-view-toggle" class="view-toggle-btn" onclick="toggleMainView(true)">
        <span id="toggle-icon"><i class="fa fa-gamepad"></i></span>
        <span id="toggle-text">Játék Mód</span>
    </button>

    <!-- --- STÚDIÓ NÉZET --- -->
    <div id="studio-view">
        <div class="max-w-7xl mx-auto">
            <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                    <h1 class="text-4xl font-bold uppercase tracking-tighter text-white">Stúdió <span class="text-purple-500">V11.0</span> ✨</h1>
                    <p class="text-cyan-400 text-sm mt-1">Interaktív Kaland Szerkesztő</p>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button id="btnDownloadLive" onclick="downloadLiveHTML()" class="bg-cyan-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase hover:bg-cyan-500 transition-colors">Játék letöltése (.html)</button>
                    <button onclick="downloadConfig()" class="bg-slate-700 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase hover:bg-slate-600 transition-colors">Export game.json</button>
                    <button onclick="document.getElementById('uploadInput').click()" class="bg-purple-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase hover:bg-purple-500 transition-colors">Import</button>
                    <input type="file" id="uploadInput" class="hidden" accept=".json" onchange="handleFileUpload(event)">
                </div>
            </header>

            <div class="flex flex-col lg:flex-row gap-10">
                <!-- Szerkesztő rész ugyanaz maradt -->
                <div class="flex-1 space-y-8">
                    <div class="glass-card p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-4">
                            <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Alapbeállítások</h3>
                            <input type="text" id="appTitle" class="input-style" placeholder="Kaland címe" oninput="autoSave()">
                            <input type="url" id="globalBg" class="input-style" placeholder="Globális Háttér URL" oninput="autoSave()">
                            <input type="url" id="initialMapLink" class="input-style" placeholder="Játék alapértelmezett térkép linkje" oninput="autoSave()">
                        </div>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Avatarok</h3>
                                <button onclick="addAvatar()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ</button>
                            </div>
                            <div id="avatarList" class="space-y-2 max-h-48 overflow-y-auto pr-2"></div>
                        </div>
                    </div>

                    <div class="glass-card p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Történetfolyam</h3>
                            <button onclick="addPage()" class="bg-purple-600 px-4 py-2 rounded-lg text-[10px] font-bold">+ ÚJ OLDAL</button>
                        </div>
                        <div id="pageList" class="max-h-60 overflow-y-auto pr-2 space-y-1"></div>
                    </div>

                    <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                        <div class="space-y-4">
                            <input type="url" id="pageImage" class="input-style text-xs" placeholder="Kép URL" oninput="autoSave()">
                            <textarea id="pageText" rows="5" class="input-style text-base" placeholder="Szöveg..." oninput="autoSave()"></textarea>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-6 gap-4">
                            <select id="pageType" class="input-style text-xs" onchange="updateUI(); autoSave();">
                                <option value="story">Leírás</option>
                                <option value="choice">Választás</option>
                                <option value="qr">QR Kód</option>
                                <option value="password">Kódzár</option>
                                <option value="gps">GPS Pont</option>
                            </select>
                            <input type="number" id="prevIdx" class="input-style text-xs" placeholder="Vissza ID" oninput="autoSave()">
                            <input type="number" id="nextIdx" class="input-style text-xs" placeholder="Tovább ID" oninput="autoSave()">
                            <input type="url" id="redirectUrl" class="input-style text-xs" placeholder="Link" oninput="autoSave()">
                            <input type="url" id="pageBg" class="input-style text-xs" placeholder="Egyedi háttér" oninput="autoSave()">
                            <input type="text" id="qrCode" class="input-style text-xs" placeholder="QR Kód" oninput="autoSave()">
                        </div>
                        
                        <div id="rewardArea" class="border-t border-slate-700/50 pt-4 space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Hátizsák</h3>
                                <button onclick="addRewardItem()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ TÁRGY</button>
                            </div>
                            <div id="rewardsContainer" class="space-y-3"></div>
                        </div>

                        <div id="passwordArea" class="hidden border-t border-slate-700/50 pt-4">
                            <input type="text" id="correctPass" class="input-style text-sm" placeholder="Helyes megoldás" oninput="autoSave()">
                        </div>
                        <div id="gpsArea" class="hidden border-t border-slate-700/50 pt-4 grid grid-cols-3 gap-4">
                            <input type="number" id="targetLat" step="any" class="input-style text-sm" placeholder="Lat" oninput="autoSave()">
                            <input type="number" id="targetLng" step="any" class="input-style text-sm" placeholder="Lng" oninput="autoSave()">
                            <input type="url" id="mapLink" class="input-style text-sm" placeholder="Térkép Link" oninput="autoSave()">
                        </div>
                        <div id="choiceArea" class="hidden border-t border-slate-700/50 pt-4">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Opciók</h3>
                                <button onclick="addChoiceItem()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ GOMB</button>
                            </div>
                            <div id="choicesContainer" class="space-y-2"></div>
                        </div>
                    </div>
                </div>

                <!-- Sim rész ugyanaz maradt -->
                <div class="w-full lg:w-auto flex justify-center">
                    <div class="sim-container">
                        <div id="sim-viewport">
                            <img id="sim-bg" src="">
                            <div id="sim-content">
                                <div class="sim-box">
                                    <img id="sim-avatar" class="sim-avatar" src="">
                                    <div id="sim-scroll" class="overflow-y-auto pr-1 flex-grow">
                                        <img id="sim-page-img" class="w-full rounded-lg mb-4 hidden" src="">
                                        <div id="sim-actual-text" style="font-size: 17px;"></div>
                                        <div id="sim-gps-info" class="hidden text-center p-3 bg-slate-800 rounded-xl mt-4 text-xs text-cyan-400 font-bold border border-cyan-500/30">
                                            <i class="fa fa-location-dot animate-pulse mr-2"></i>Távolság: <span id="sim-distance">...</span>m
                                        </div>
                                    </div>
                                    <div id="sim-actions" class="mt-4"></div>
                                </div>
                            </div>
                        </div>
                        <div class="sim-bottom-bar">
                            <button class="sim-menu-btn active"><i class="fa fa-compass"></i></button>
                            <button class="sim-menu-btn"><i class="fa-solid fa-suitcase"></i></button>
                            <button class="sim-menu-btn" onclick="resetSim()"><i class="fa-solid fa-undo"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- --- JÁTÉKOS NÉZET (PREVIEW) --- -->
    <div id="player-view">
        <div id="p-qr-layer">
            <div id="p-qr-reader"></div>
            <button onclick="pStopQR(true)" class="p-action-btn mt-6 !w-auto px-12">MÉGSE</button>
        </div>
        <div id="p-zoom-viewer" onclick="pCloseZoom(true)">
            <img id="p-zoom-img" src="">
        </div>
        <div class="p-game-wrapper">
            <div id="p-viewport">
                <img id="p-bg-layer" src="">
                <div id="p-inventory-overlay">
                    <h2 class="text-center text-cyan-400 font-bold mb-8 uppercase tracking-widest">Hátizsák</h2>
                    <div id="p-item-list" class="p-item-grid"></div>
                </div>
                <div id="p-content-layer">
                    <div class="p-dialog-box">
                        <img id="p-avatar-img" class="p-avatar-frame" src="">
                        <div id="p-scroll-area" class="overflow-y-auto pr-1 flex-grow">
                            <img id="p-page-illustration" class="w-full rounded-xl mb-4 hidden shadow-xl" src="">
                            <div id="p-story-text"></div>
                            <div id="p-gps-monitor" class="hidden text-center p-4 bg-slate-900/80 rounded-2xl mt-4 border border-cyan-500/40">
                                <div class="text-[10px] text-cyan-500 uppercase font-bold mb-1">Célpont távolsága</div>
                                <div class="text-3xl font-bold text-white"><span id="p-distance-val">...</span> <span class="text-sm opacity-50">méter</span></div>
                                <div id="p-gps-hint" class="text-[10px] text-slate-400 mt-2 italic">Menj közelebb! (20m)</div>
                            </div>
                        </div>
                        <div id="p-button-container" class="mt-4 flex flex-col gap-3"></div>
                    </div>
                </div>
            </div>
            <div class="p-bottom-nav">
                <button id="p-nav-map" class="p-nav-item active" onclick="pSwitchView('map')"><i class="fa fa-map-marked-alt"></i></button>
                <button id="p-nav-inv" class="p-nav-item" onclick="pSwitchView('inv')"><i class="fa-solid fa-briefcase"></i><div id="p-inv-badge" class="p-badge hidden">0</div></button>
                <button class="p-nav-item" onclick="pResetGame()"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="p-nav-item" onclick="pToggleFullscreen()"><i class="fa fa-expand"></i></button>
            </div>
        </div>
    </div>

    <script>
        let config = JSON.parse(localStorage.getItem('KALAND_STUDIO_V11')) || { 
            appTitle: "A Város Legendája", 
            storyPages: [{ content: "Kezdődik a kaland!", pageType: "story", rewards: [] }], 
            avatars: [],
            globalBg: "",
            initialMapLink: ""
        };
        let currentIdx = -1, simIdx = 0, pSimIdx = 0, pInventory = [], saveTimeout, pQrScanner = null, isPlayerMode = false;
        let pZoomActive = false, pQrActive = false, isStoppingQR = false, userPos = null, lastAutoGpsIdx = -1;

        function pushNav() { history.pushState({ nav: true }, ""); }

        window.onpopstate = () => {
            if (pZoomActive) { pCloseZoom(false); return; }
            if (pQrActive) { pStopQR(false); return; }
            if (isPlayerMode) { toggleMainView(false); return; }
        };

        function getDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return 999999;
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                updateGpsDisplays();
            }, null, { enableHighAccuracy: true });
        }

        function updateGpsDisplays() {
            const simP = config.storyPages[simIdx];
            if (simP && simP.pageType === 'gps' && userPos) {
                const dist = getDistance(userPos.lat, userPos.lng, simP.targetLat, simP.targetLng);
                const el = document.getElementById('sim-distance');
                if (el) el.textContent = dist;
                if (dist <= 20 && lastAutoGpsIdx !== simIdx) {
                    lastAutoGpsIdx = simIdx;
                    setTimeout(() => {
                        if (simP.redirectUrl) window.open(simP.redirectUrl, '_blank');
                        else { simIdx = simP.nextIdx || simIdx + 1; updateSimulator(); }
                    }, 800);
                }
            }
            const pP = config.storyPages[pSimIdx];
            if (pP && pP.pageType === 'gps' && userPos) {
                const dist = getDistance(userPos.lat, userPos.lng, pP.targetLat, pP.targetLng);
                const el = document.getElementById('p-distance-val');
                if (el) el.textContent = dist;
                if (dist <= 20 && lastAutoGpsIdx !== pSimIdx) {
                    lastAutoGpsIdx = pSimIdx;
                    setTimeout(() => {
                        if (pP.redirectUrl) window.open(pP.redirectUrl, '_blank');
                        else { pSimIdx = pP.nextIdx || pSimIdx + 1; pUpdateUI(); }
                    }, 800);
                }
            }
        }

        function toggleMainView(shouldPush) {
            isPlayerMode = !isPlayerMode;
            const studio = document.getElementById('studio-view');
            const player = document.getElementById('player-view');
            if (isPlayerMode) {
                if (shouldPush) pushNav();
                studio.style.display = 'none'; player.style.display = 'flex';
                pSimIdx = 0; pInventory = []; lastAutoGpsIdx = -1; pUpdateUI();
            } else {
                studio.style.display = 'block'; player.style.display = 'none';
                lastAutoGpsIdx = -1; updateSimulator();
            }
        }

        function loadPage(i) { 
            currentIdx = i; const p = config.storyPages[i]; if(!p) return;
            document.getElementById('editorPanel').classList.remove('hidden'); 
            document.getElementById('pageText').value = p.content || ""; 
            document.getElementById('pageType').value = p.pageType || 'story'; 
            document.getElementById('nextIdx').value = p.nextIdx || ""; 
            document.getElementById('prevIdx').value = p.prevIdx || ""; 
            document.getElementById('redirectUrl').value = p.redirectUrl || ""; 
            document.getElementById('pageBg').value = p.pageBg || ""; 
            document.getElementById('qrCode').value = p.qrCode || ""; 
            document.getElementById('correctPass').value = p.password || ""; 
            document.getElementById('targetLat').value = p.targetLat || ""; 
            document.getElementById('targetLng').value = p.targetLng || ""; 
            document.getElementById('mapLink').value = p.mapLink || ""; 
            document.getElementById('pageImage').value = p.pageImage || "";
            updateUI(); renderChoices(); renderRewards(); renderPageList(); 
            simIdx = i; updateSimulator(); 
        }

        function addPage() { config.storyPages.push({content: "Új jelenet...", pageType: "story", rewards: []}); loadPage(config.storyPages.length-1); autoSave(); }
        function duplicatePage(i) { config.storyPages.splice(i+1, 0, JSON.parse(JSON.stringify(config.storyPages[i]))); renderPageList(); autoSave(); }
        function addAvatar() { config.avatars.push({id: 'A', name: 'Új Karakter', url: '', color: '#8b5cf6'}); renderAvatarAdmin(); autoSave(); }
        function addChoiceItem() { if(!config.storyPages[currentIdx].choices) config.storyPages[currentIdx].choices = []; config.storyPages[currentIdx].choices.push({text: "Új választás", target: 0, req: ""}); renderChoices(); autoSave(); }
        function addRewardItem() { if(!config.storyPages[currentIdx].rewards) config.storyPages[currentIdx].rewards = []; config.storyPages[currentIdx].rewards.push({name: "", icon: "📦", url: ""}); renderRewards(); autoSave(); }
        function resetSim() { simIdx = 0; lastAutoGpsIdx = -1; updateSimulator(); }

        function autoSave() { 
            clearTimeout(saveTimeout); document.getElementById('save-indicator').style.display = 'block'; 
            saveTimeout = setTimeout(() => { 
                const p = config.storyPages[currentIdx]; 
                if(p) { 
                    p.content = document.getElementById('pageText').value; 
                    p.pageType = document.getElementById('pageType').value; 
                    p.nextIdx = document.getElementById('nextIdx').value; 
                    p.prevIdx = document.getElementById('prevIdx').value; 
                    p.redirectUrl = document.getElementById('redirectUrl').value; 
                    p.pageBg = document.getElementById('pageBg').value; 
                    p.qrCode = document.getElementById('qrCode').value; 
                    p.password = document.getElementById('correctPass').value; 
                    p.targetLat = document.getElementById('targetLat').value; 
                    p.targetLng = document.getElementById('targetLng').value; 
                    p.mapLink = document.getElementById('mapLink').value; 
                    p.pageImage = document.getElementById('pageImage').value;
                } 
                config.appTitle = document.getElementById('appTitle').value; 
                config.globalBg = document.getElementById('globalBg').value; 
                config.initialMapLink = document.getElementById('initialMapLink').value; 
                localStorage.setItem('KALAND_STUDIO_V11', JSON.stringify(config)); 
                renderPageList(); updateSimulator(); 
                setTimeout(() => document.getElementById('save-indicator').style.display = 'none', 500); 
            }, 1000); 
        }

        function renderPageList() { 
            const l = document.getElementById('pageList'); l.innerHTML = ''; 
            config.storyPages.forEach((p, i) => { 
                const d = document.createElement('div'); d.className = `page-item ${i === currentIdx ? 'selected' : ''}`; 
                d.setAttribute('data-id', i);
                d.innerHTML = `<div class="flex items-center overflow-hidden"><i class="fa fa-bars handle"></i><span onclick="loadPage(${i})" class="truncate text-xs font-bold cursor-pointer">#${i}: ${p.content ? p.content.substring(0,25) : '...'}</span></div><div class="flex shrink-0"><button onclick="duplicatePage(${i})" class="mr-2 text-emerald-400"><i class="fa fa-copy"></i></button><button onclick="deletePage(${i})" class="text-red-400"><i class="fa fa-trash"></i></button></div>`; 
                l.appendChild(d); 
            }); 
        }

        function renderAvatarAdmin() { 
            const l = document.getElementById('avatarList'); l.innerHTML = ''; 
            config.avatars.forEach((av, i) => { 
                const d = document.createElement('div'); d.className = "flex gap-2 items-center mb-2 bg-slate-800 p-2 rounded"; 
                d.innerHTML = `<input type="text" class="input-style w-10 text-center" value="${av.id}" oninput="config.avatars[${i}].id=this.value;autoSave()"><input type="text" class="input-style flex-1" value="${av.name}" oninput="config.avatars[${i}].name=this.value;autoSave()"><input type="url" class="input-style flex-1" placeholder="URL" value="${av.url || ''}" oninput="config.avatars[${i}].url=this.value;autoSave()"><input type="color" class="w-8 h-8" value="${av.color}" oninput="config.avatars[${i}].color=this.value;autoSave()"><button onclick="config.avatars.splice(${i},1);renderAvatarAdmin();autoSave()" class="text-red-400"><i class="fa fa-trash"></i></button>`; 
                l.appendChild(d); 
            }); 
        }

        function updateUI() { 
            const t = document.getElementById('pageType').value; 
            document.getElementById('choiceArea').classList.toggle('hidden', t !== 'choice'); 
            document.getElementById('passwordArea').classList.toggle('hidden', t !== 'password'); 
            document.getElementById('gpsArea').classList.toggle('hidden', t !== 'gps'); 
            document.getElementById('qrCode').classList.toggle('hidden', t !== 'qr');
        }

        function renderChoices() { 
            const c = document.getElementById('choicesContainer'); c.innerHTML = ''; 
            const p = config.storyPages[currentIdx]; if(!p.choices) return; 
            p.choices.forEach((ch, i) => { 
                const r = document.createElement('div'); r.className = "flex gap-2 items-center bg-slate-800 p-2 rounded"; 
                r.innerHTML = `<input type="text" class="input-style flex-1" value="${ch.text}" oninput="config.storyPages[${currentIdx}].choices[${i}].text=this.value;autoSave()"><input type="number" class="input-style w-20" value="${ch.target}" oninput="config.storyPages[${currentIdx}].choices[${i}].target=this.value;autoSave()"><input type="text" placeholder="Tárgy" class="input-style flex-1" value="${ch.req || ''}" oninput="config.storyPages[${currentIdx}].choices[${i}].req=this.value;autoSave()"><button onclick="config.storyPages[${currentIdx}].choices.splice(${i},1);renderChoices();autoSave()">X</button>`; 
                c.appendChild(r); 
            }); 
        }

        function renderRewards() {
            const container = document.getElementById('rewardsContainer'); container.innerHTML = '';
            const p = config.storyPages[currentIdx]; if (!p.rewards) p.rewards = [];
            p.rewards.forEach((item, i) => {
                const div = document.createElement('div'); div.className = "grid grid-cols-4 gap-2 bg-slate-800 p-2 rounded";
                div.innerHTML = `<input type="text" class="input-style" placeholder="Név" value="${item.name}" oninput="config.storyPages[${currentIdx}].rewards[${i}].name=this.value;autoSave()"><input type="text" class="input-style" placeholder="Ikon" value="${item.icon}" oninput="config.storyPages[${currentIdx}].rewards[${i}].icon=this.value;autoSave()"><input type="url" class="input-style" placeholder="URL" value="${item.url}" oninput="config.storyPages[${currentIdx}].rewards[${i}].url=this.value;autoSave()"><button onclick="config.storyPages[${currentIdx}].rewards.splice(${i},1);renderRewards();autoSave()" class="text-red-400">TÖRLÉS</button>`;
                container.appendChild(div);
            });
        }

        function updateSimulator() {
            const p = config.storyPages[simIdx]; if(!p) return;
            document.getElementById('sim-bg').src = p.pageBg || config.globalBg || "";
            let text = p.content || "";
            const avBox = document.getElementById('sim-avatar'); avBox.style.display = 'none';
            config.avatars.forEach(av => { if(text.includes(`§${av.id}`)) { avBox.src = av.url || ""; avBox.style.display = 'block'; avBox.style.borderColor = av.color; text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color};font-weight:700">${av.name}:</span>`); } });
            document.getElementById('sim-actual-text').innerHTML = text;
            const img = document.getElementById('sim-page-img'); if(p.pageImage) { img.src = p.pageImage; img.classList.remove('hidden'); } else { img.classList.add('hidden'); }
            document.getElementById('sim-gps-info').classList.toggle('hidden', p.pageType !== 'gps');
            const acts = document.getElementById('sim-actions'); acts.innerHTML = '';
            if (p.pageType === 'choice' && p.choices) {
                const col = document.createElement('div'); col.className = "flex flex-col gap-2 w-full mb-2";
                p.choices.forEach(c => { const b = document.createElement('div'); b.className = "sim-btn"; b.textContent = c.text; b.onclick = () => { simIdx = parseInt(c.target); lastAutoGpsIdx = -1; updateSimulator(); }; col.appendChild(b); });
                acts.appendChild(col);
            }
            if (p.pageType === 'gps' && p.mapLink) {
                const b = document.createElement('button'); b.className = "sim-btn bg-cyan-600 mb-2 w-full"; b.innerHTML = '<i class="fa fa-map mr-2"></i>Térkép';

            if(simIdx > 0 || p.prevIdx) { const b = document.createElement('div'); b.className = "sim-btn sim-btn-back"; b.innerHTML = 'VISSZA'; b.onclick = () => { simIdx = p.prevIdx || simIdx - 1; lastAutoGpsIdx = -1; updateSimulator(); }; navRow.appendChild(b); }
            if (p.pageType !== 'choice' && p.pageType !== 'gps') { const b = document.createElement('button'); b.className = "sim-btn"; b.innerHTML = 'TOVÁBB'; b.onclick = () => { if(p.redirectUrl) window.open(p.redirectUrl, '_blank'); else { simIdx = p.nextIdx || simIdx + 1; lastAutoGpsIdx = -1; updateSimulator(); } }; navRow.appendChild(b); }
            acts.appendChild(navRow);
            updateGpsDisplays();
        }

        // PREVIEW (Játék Mód) Függvények
        function pUpdateUI() {
            const p = config.storyPages[pSimIdx]; if(!p) return;
            pHandleReward(p);
            document.getElementById('p-bg-layer').src = p.pageBg || config.globalBg || "";

            const avImg = document.getElementById('p-avatar-img'); avImg.style.display = 'none';
            config.avatars.forEach(av => { if(text.includes(`§${av.id}`)) { avImg.src = av.url || ""; avImg.style.display = av.url ? 'block' : 'none'; avImg.style.borderColor = av.color; text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color}">${av.name}:</span>`); } });

            document.getElementById('p-gps-monitor').style.display = p.pageType === 'gps' ? 'block' : 'none';
            const container = document.getElementById('p-button-container'); container.innerHTML = '';
            if (p.pageType === 'qr') pAddBtn("QR BEOLVASÁSA", pStartQR, "fa-camera");
            else if (p.pageType === 'password') {
                const inp = document.createElement('input'); inp.className = "w-full bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-lg text-center mb-2"; inp.placeholder = "KÓD...";
                pAddBtn("NYITÁS", () => { if(inp.value.trim().toLowerCase() == (p.password||"").toLowerCase()) { pSimIdx = p.nextIdx || pSimIdx + 1; lastAutoGpsIdx = -1; pUpdateUI(); } });
                container.prepend(inp);
            } else if (p.pageType === 'choice' && p.choices) { p.choices.forEach(c => { if (c.req && !pInventory.find(i => i.name.toLowerCase() === c.req.toLowerCase())) return; pAddBtn(c.text, () => { pSimIdx = parseInt(c.target); lastAutoGpsIdx = -1; pUpdateUI(); }); }); }
            if (p.pageType === 'gps' && p.mapLink) { const b = document.createElement('button'); b.className = "p-action-btn bg-cyan-700 mb-2"; b.innerHTML = 'TÉRKÉP <i class="fa fa-map ml-2 opacity-50"></i>'; b.onclick = () => window.open(p.mapLink, '_blank'); container.appendChild(b); }

            if(pSimIdx > 0 || p.prevIdx) { const b = document.createElement('button'); b.className = "p-action-btn p-btn-back"; b.innerHTML = `VISSZA`; b.onclick = () => { pSimIdx = p.prevIdx || pSimIdx - 1; lastAutoGpsIdx = -1; pUpdateUI(); }; navRow.appendChild(b); }
            if (p.pageType !== 'choice' && p.pageType !== 'password' && p.pageType !== 'qr' && p.pageType !== 'gps') { const b = document.createElement('button'); b.className = "p-action-btn"; b.innerHTML = `TOVÁBB`; b.onclick = () => { if(p.redirectUrl) window.open(p.redirectUrl, '_blank'); else { pSimIdx = p.nextIdx || pSimIdx + 1; lastAutoGpsIdx = -1; pUpdateUI(); } }; navRow.appendChild(b); }
            container.appendChild(navRow);
            updateGpsDisplays();
        }

        function pAddBtn(t, fn, i = "") { const b = document.createElement('button'); b.className = "p-action-btn"; b.innerHTML = `${t} ${i ? `<i class="fa ${i} ml-2 opacity-50"></i>` : ''}`; b.onclick = fn; document.getElementById('p-button-container').appendChild(b); }
        function pStartQR() { if (pQrScanner) return; pushNav(); pQrActive = true; document.getElementById('p-qr-layer').style.display = 'flex'; pQrScanner = new Html5Qrcode("p-qr-reader"); pQrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (t) => { const p = config.storyPages[pSimIdx]; if (t.trim().toUpperCase() === (p.qrCode || "").trim().toUpperCase()) { pStopQR(false, () => { if (p.redirectUrl) window.open(p.redirectUrl, '_blank'); else { pSimIdx = p.nextIdx || pSimIdx + 1; lastAutoGpsIdx = -1; pUpdateUI(); } }); } }).catch(() => pStopQR(true)); }
        function pStopQR(manual, cb) { if (manual) history.back(); if (isStoppingQR) return; const l = document.getElementById('p-qr-layer'); if (!pQrScanner) { l.style.display = 'none'; pQrActive = false; if(cb) cb(); return; } isStoppingQR = true; pQrScanner.stop().catch(() => {}).finally(() => { l.style.display = 'none'; pQrScanner = null; isStoppingQR = false; pQrActive = false; if (cb) cb(); }); }
        function pOpenZoom(u) { pushNav(); pZoomActive = true; const v = document.getElementById('p-zoom-viewer'), i = document.getElementById('p-zoom-img'); i.src = u; v.style.display = 'flex'; }
        function pCloseZoom(manual) { pZoomActive = false; document.getElementById('p-zoom-viewer').style.display = 'none'; if (manual) try { history.back(); } catch(e) {} }
        function pHandleReward(p) { if (p.rewards) { pInventory = p.rewards.filter(r => r.name && r.name.trim() !== "").map(r => ({ name: r.name, icon: r.icon || '📦', url: r.url || '', seen: false })); } else { pInventory = []; } pUpdateBadge(); }
        function pUpdateBadge() { const b = document.getElementById('p-inv-badge'), un = pInventory.filter(i => !i.seen).length; b.textContent = un; b.classList.toggle('hidden', un === 0); }
        function pSwitchView(t) { const inv = document.getElementById('p-inventory-overlay'); if (t === 'inv') { if (inv.style.display === 'block') inv.style.display = 'none'; else { pRenderInventory(); inv.style.display = 'block'; } } else inv.style.display = 'none'; }
        function pRenderInventory() { const list = document.getElementById('p-item-list'); list.innerHTML = ''; pInventory.forEach(item => { const d = document.createElement('div'); d.className = "p-item-card"; d.innerHTML = item.url ? `<img src="${item.url}"><div class="text-[10px] font-bold text-white uppercase">${item.name}</div>` : `<div class="text-4xl mb-2">${item.icon}</div><div class="text-[10px] font-bold text-white uppercase">${item.name}</div>`; if (!item.seen) d.innerHTML += `<div class="p-item-unread-dot"></div>`; d.onclick = () => { if(item.url) pOpenZoom(item.url); item.seen = true; pUpdateBadge(); pRenderInventory(); }; list.appendChild(d); }); }
        function pToggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function pResetGame() { pSimIdx = 0; pInventory = []; pUpdateBadge(); lastAutoGpsIdx = -1; pUpdateUI(); }

    <script>
        let config = null, simIdx = 0, inventory = [], qrScanner = null, isStoppingQR = false, userPos = null, lastAutoGps = -1, zoomActive = false, qrActive = false;
        function pushNav() { history.pushState({ nav: true }, ""); }
        window.onpopstate = () => { if (zoomActive) { closeZoom(false); return; } if (qrActive) { stopQR(false); return; } pushNav(); };
        pushNav();
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
        }
        if("geolocation" in navigator) {
            navigator.geolocation.watchPosition(p => {
                userPos = {lat: p.coords.latitude, lng: p.coords.longitude};
                const cur = config?.storyPages[simIdx];
                if(cur?.pageType === 'gps' && userPos) {
                    const d = getDistance(userPos.lat, userPos.lng, cur.targetLat, cur.targetLng);
                    document.getElementById('live-dist').textContent = d;
                    if(d <= 20 && lastAutoGps !== simIdx) { lastAutoGps = simIdx; setTimeout(() => { if(cur.redirectUrl) window.open(cur.redirectUrl, '_blank'); else { simIdx = cur.nextIdx || simIdx + 1; lastAutoGps = -1; updateUI(); } }, 800); }
                }
            }, null, {enableHighAccuracy: true});
        }
        async function loadGame() { try { const r = await fetch('game.json'); config = await r.json(); document.getElementById('loading').style.display = 'none'; updateUI(); } catch (e) { document.getElementById('loading').textContent = 'Hiba a betöltéskor.'; } }
        function updateUI() {
            const p = config.storyPages[simIdx]; if(!p) return; handleReward(p); document.getElementById('bg-layer').src = p.pageBg || config.globalBg || "";
            let text = p.content || ""; const avImg = document.getElementById('avatar-img'); avImg.style.display = 'none';
