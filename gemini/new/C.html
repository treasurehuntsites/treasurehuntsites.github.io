<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Új Kaland</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Play', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        #studio-view { height: 100%; overflow-y: auto; padding: 2.5rem; }
        .glass-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            border-radius: 1rem; 
        }
        .input-style { 
            background: #0f172a; 
            color: #22d3ee; 
            border: 1px solid #334155; 
            border-radius: 0.5rem; 
            padding: 0.6rem; 
            outline: none; 
            transition: 0.2s; 
            width: 100%; 
        }
        .input-style:focus { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; }
        .page-item.selected { border-color: #22d3ee; background: #4c1d95; }
        .handle { cursor: grab; padding-right: 15px; color: #64748b; font-size: 0.9rem; }

        @keyframes fadeInOutSplash {
            0% { opacity: 0; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
            90% { opacity: 0; transform: scale(1.02); }
            100% { opacity: 0; }
        }
        .splash-text-anim {
            font-family: 'Special Elite', cursive;
            animation: fadeInOutSplash 10s ease-in-out forwards;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Simulator Styles */
        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; display: flex; flex-direction: column; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding-top: 60px; }
        .sim-box { position: relative; background: rgba(0,0,0,0.95); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 15px; padding-top: 45px; max-height: 80%; display: flex; flex-direction: column; overflow: visible; z-index: 50; }
        .sim-avatar { position: absolute; top: -45px; left: 10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 100; object-fit: cover; display: none; }
        .sim-btn { flex: 1; background: #8b5cf6; color: white; padding: 10px; border-radius: 0.6rem; font-weight: 700; text-align: center; font-size: 0.9rem; cursor: pointer; text-transform: uppercase; border: none; }
        .sim-btn-back { background: #334155; }
        .sim-bottom-bar { height: 60px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; }

        /* Player Styles */
        #player-view { position: fixed; inset: 0; z-index: 4000; background: #000; display: none; flex-direction: column; }
        .p-game-wrapper { width: 100%; height: 100dvh; display: flex; flex-direction: column; position: relative; background: #000; }
        #p-viewport { position: relative; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; }
        #p-content-layer { position: relative; z-index: 10; height: 100%; flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; overflow: visible; padding-top: 100px; }
        
        .p-dialog-box { 
            position: relative; 
            background: rgba(0,0,0,0.96); 
            border-top: 4px solid #8b5cf6; 
            border-radius: 2rem 2rem 0 0; 
            padding: 20px; 
            padding-top: 60px; 
            max-height: 85%; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 -15px 35px rgba(0,0,0,0.8); 
            overflow: visible;
            z-index: 50;
        }
        .p-avatar-frame { position: absolute; top: -60px; left: 20px; width: 100px; height: 100px; border-radius: 50%; border: 4px solid #8b5cf6; background: #000; z-index: 200; object-fit: cover; display: none; box-shadow: 0 5px 25px rgba(0,0,0,0.7); }
        
        .p-action-btn { flex: 1; background: #8b5cf6; color: white; padding: 18px; border-radius: 1rem; font-weight: 800; text-align: center; font-size: 1.25rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; border: none; box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3); }
        .p-action-btn:active { transform: scale(0.96); background: #a855f7; }
        .p-btn-back { background: #334155; }
        
        .p-bottom-nav { height: 75px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 300; padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
        .p-nav-item { color: #64748b; font-size: 1.6rem; cursor: pointer; border: none; background: transparent; transition: color 0.3s; }
        .p-nav-item.active { color: #8b5cf6; }
        
        #p-story-text { text-align: justify; hyphens: auto; font-size: 21px; font-weight: 700; line-height: 1.6; margin-bottom: 20px; color: #f8fafc; }
        #p-scroll-area { overflow-y: auto; flex-grow: 1; padding-bottom: 10px; }
        
        #p-inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 500; display: none; padding: 30px; padding-top: 70px; overflow-y: auto; }
        #p-button-container { flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; padding-bottom: 10px; }
        .p-nav-row { display: flex; gap: 12px; width: 100%; }

        #p-qr-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #p-qr-reader { width: 280px; height: 280px; border: 3px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; }

        .view-toggle-btn { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 6000; background: #8b5cf6; color: white; padding: 0.75rem 1.25rem; border-radius: 0.75rem; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4); cursor: pointer; border: none; display: flex; align-items: center; gap: 8px; }
        #save-indicator { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; font-size: 0.75rem; font-weight: bold; display: none; z-index: 1000; }
    </style>
</head>
<body>
    <div id="file-loader" class="fixed inset-0 z-[9000] bg-[#0f172a] flex flex-col items-center justify-center p-8 text-center">
        <h1 class="text-white text-3xl font-bold mb-6">Új Kaland</h1>
        <button onclick="document.getElementById('ml').click()" class="bg-purple-600 px-8 py-4 rounded-xl text-white font-bold uppercase shadow-xl">Adatok betöltése (.json)</button>
        <input type="file" id="ml" class="hidden" accept=".json" onchange="hL(event)">
    </div>
    <div id="player-view" style="display:flex">
        <div id="p-qr-layer"><div id="p-qr-reader"></div><button onclick="pStopQR(true)" class="p-action-btn mt-6 !w-auto px-12">MÉGSE</button></div>
        <div class="p-game-wrapper">
            <div id="p-viewport">
                <img id="p-bg-layer" src="">
                <div id="p-content-layer">
                    <div class="p-dialog-box">
                        <img id="p-avatar-img" class="p-avatar-frame" src="">
                        <div id="p-scroll-area">
                            <img id="p-page-illustration" class="w-full rounded-xl mb-4 hidden shadow-xl" src="">
                            <div id="p-story-text"></div>
                        </div>
                        <div id="p-button-container"></div>
                    </div>
                </div>
            </div>
            <div class="p-bottom-nav">
                <button class="p-nav-item active" onclick="pSwitchView('map')"><i class="fa fa-map-marked-alt"></i></button>
                <button class="p-nav-item" onclick="pSwitchView('inv')"><i class="fa-solid fa-briefcase"></i></button>
                <button class="p-nav-item" onclick="pResetGame()"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="p-nav-item" onclick="pToggleFullscreen()"><i class="fa fa-expand"></i></button>
            </div>
        </div>
    </div>
    <script>
        let config = null; let pSimIdx = 0; let pQrScanner = null;
        function hL(e) { const f = e.target.files[0]; const r = new FileReader(); r.onload = (ev) => { config = JSON.parse(ev.target.result); document.getElementById('file-loader').style.display='none'; pUpdateUI(); }; r.readAsText(f); }
        function pUpdateUI() {
            if(!config || !config.storyPages[pSimIdx]) return;
            const p = config.storyPages[pSimIdx];
            document.getElementById('p-bg-layer').src = p.pageBg || config.globalBg || "";
            let text = p.content || "";
            const avImg = document.getElementById('p-avatar-img'); avImg.style.display = 'none';
            config.avatars.forEach(av => { if(text.includes('§' + av.id)) { avImg.src = av.url || ""; avImg.style.display = av.url ? 'block' : 'none'; avImg.style.borderColor = av.color; text = text.replace(new RegExp('§' + av.id, 'g'), '<span style="color:' + av.color + '">' + av.name + ':</span>'); } });
            document.getElementById('p-story-text').innerHTML = text;
            const ill = document.getElementById('p-page-illustration'); if(p.pageImage) { ill.src = p.pageImage; ill.style.display = 'block'; } else { ill.style.display = 'none'; }
            const container = document.getElementById('p-button-container'); container.innerHTML = '';
            if (p.pageType === 'choice' && p.choices) {
                p.choices.forEach(c => { const btn = document.createElement('button'); btn.className = "p-action-btn"; btn.textContent = c.text; btn.onclick = () => { pSimIdx = parseInt(c.target); pUpdateUI(); }; container.appendChild(btn); });
            } else if (p.pageType === 'password') {
                const inp = document.createElement('input'); inp.className = "w-full bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-lg text-center font-bold text-2xl mb-2"; inp.placeholder = "KÓD..."; container.appendChild(inp);
                const btn = document.createElement('button'); btn.className = "p-action-btn"; btn.textContent = "NYITÁS"; btn.onclick = () => { if(inp.value.toLowerCase() === p.password.toLowerCase()) { pSimIdx++; pUpdateUI(); } }; container.appendChild(btn);
            } else if (p.pageType === 'qr') {
                const btn = document.createElement('button'); btn.className = "p-action-btn"; btn.textContent = "QR BEOLVASÁSA"; btn.onclick = pStartQR; container.appendChild(btn);
            }
            const navRow = document.createElement('div'); navRow.className = "flex gap-3 w-full";
            if (pSimIdx > 0 || p.prevIdx) {
                const bBtn = document.createElement('button'); bBtn.className = "p-action-btn p-btn-back"; bBtn.textContent = "VISSZA";
                bBtn.onclick = () => { pSimIdx = p.prevIdx ? parseInt(p.prevIdx) : pSimIdx - 1; pUpdateUI(); };
                navRow.appendChild(bBtn);
            }
            if (p.pageType !== 'choice' && p.pageType !== 'password' && p.pageType !== 'qr') {
                const nBtn = document.createElement('button'); nBtn.className = "p-action-btn"; nBtn.textContent = "TOVÁBB";
                nBtn.onclick = () => { pSimIdx = p.nextIdx ? parseInt(p.nextIdx) : pSimIdx + 1; pUpdateUI(); };
                navRow.appendChild(nBtn);
            }
            if (navRow.hasChildNodes()) container.appendChild(navRow);
            document.getElementById('p-scroll-area').scrollTop = 0;
        }
        function pStartQR() { document.getElementById('p-qr-layer').style.display = 'flex'; pQrScanner = new Html5Qrcode("p-qr-reader"); pQrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (t) => { if(t.toLowerCase() === config.storyPages[pSimIdx].qrCode.toLowerCase()) pStopQR(false, () => { pSimIdx++; pUpdateUI(); }); }); }
        function pStopQR(m, cb) { if(pQrScanner) pQrScanner.stop().then(() => { pQrScanner = null; document.getElementById('p-qr-layer').style.display = 'none'; if(cb) cb(); }); else { document.getElementById('p-qr-layer').style.display = 'none'; if(cb) cb(); } }
        function pResetGame() { if(confirm("Újrakezded?")) { pSimIdx = 0; pUpdateUI(); } }
    </script>
</body>
</html>
