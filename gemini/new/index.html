<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaland Játék</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Play', sans-serif; background-color: #000; color: #f8fafc; overflow: hidden; }
        .game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #viewport { position: relative; flex-grow: 1; overflow: hidden; }
        #bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; }
        #content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 40px; min-height: 250px; max-height: 70%; display: flex; flex-direction: column; box-shadow: 0 -10px 25px rgba(0,0,0,0.5); }
        .avatar-frame { position: absolute; top: -40px; left: 10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .action-btn { flex: 1; background: #8b5cf6; color: white; padding: 16px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.25rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .action-btn:active { transform: scale(0.98); background: #a855f7; }
        .btn-back { background: #334155; }
        .bottom-nav { height: 75px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; position: relative; }
        .nav-item.active { color: #8b5cf6; }
        .badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; }
        #story-text { text-align: justify; hyphens: auto; font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 15px; }
        #inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 50; display: none; padding: 25px; padding-top: 50px; overflow-y: auto; }
        .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item-card { position: relative; background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 15px; text-align: center; cursor: pointer; }
        .item-card img { width: 65px; height: 65px; object-fit: contain; margin: 0 auto 10px; }
        .item-unread-dot { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; }
        #qr-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #qr-reader { width: 280px; height: 280px; border: 3px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; }
        #zoom-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; align-items: center; justify-content: center; cursor: pointer; }
        #zoom-img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px; }
        .loading-screen { position: fixed; inset: 0; background: #0f172a; z-index: 6000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .manual-btn { background: #8b5cf6; color: white; padding: 12px 24px; border-radius: 12px; font-weight: bold; text-transform: uppercase; margin-top: 20px; border: none; cursor: pointer; }
        .gps-overlay { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 15px; background: #0f172a; border: 1px solid #8b5cf6; border-radius: 15px; margin-top: 15px; color: #22d3ee; font-weight: bold; animation: pulse 2s infinite; }
        .map-btn { display: block; width: 100%; background: #0891b2; color: white; padding: 12px; border-radius: 12px; font-size: 12px; font-weight: bold; text-align: center; text-transform: uppercase; border: none; text-decoration: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="loading" class="loading-screen">
        <div id="loading-text" class="text-purple-400 font-bold uppercase text-sm">Betöltés...</div>
        <div id="manual-loader" class="hidden flex flex-col items-center">
            <p class="text-xs text-slate-400 mb-4">Nem találtam automatikus játékfájlt.</p>
            <button onclick="document.getElementById('manual-file').click()" class="manual-btn">Játék betöltése (.json)</button>
            <input type="file" id="manual-file" class="hidden" accept=".json" onchange="handleManualLoad(event)">
        </div>
    </div>
    <div id="qr-layer"><div id="qr-reader"></div><button onclick="stopQR()" class="action-btn mt-6 !w-auto px-12">MÉGSE</button></div>
    <div id="zoom-viewer" onclick="this.style.display='none'"><img id="zoom-img" src=""></div>
    <div class="game-wrapper">
        <div id="viewport">
            <img id="bg-layer" src="">
            <div id="inventory-overlay"><h2 class="text-center text-cyan-400 font-bold mb-8 uppercase tracking-widest">Hátizsák</h2><div id="item-list" class="item-grid"></div></div>
            <div id="content-layer">
                <div class="dialog-box">
                    <img id="avatar-img" class="avatar-frame" src="">
                    <div id="scroll-area" class="overflow-y-auto pr-1 flex-grow">
                        <img id="page-illustration" class="w-full rounded-xl mb-4 hidden border border-slate-800" src="">
                        <div id="story-text"></div>
                        <div id="gps-status" class="gps-overlay hidden">
                            <div class="w-full text-center"><i class="fa fa-location-dot mr-2"></i> Távolság: <span id="dist-val">...</span>m</div>
                            <a id="ext-map-btn" target="_blank" class="map-btn hidden"><i class="fa fa-map-location-dot mr-2"></i> Megnyitás Térképen</a>
                        </div>
                    </div>
                    <div id="button-container" class="mt-4 flex flex-col gap-3"></div>
                </div>
            </div>
        </div>
        <div class="bottom-nav">
            <button id="nav-map" class="nav-item active" onclick="switchView('map')">
                <i class="fa fa-map-marked-alt"></i>
                <div id="map-badge" class="badge hidden">!</div>
            </button>
            <button id="nav-inv" class="nav-item" onclick="switchView('inv')">
                <i class="fa-solid fa-briefcase"></i>
                <div id="inv-badge" class="badge hidden">0</div>
            </button>
            <button class="nav-item" onclick="resetGame()"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="nav-item" onclick="toggleFullscreen()"><i class="fa fa-expand"></i></button>
        </div>
    </div>
    <script>
        let config = null, simIdx = 0, inventory = [], qrScanner = null, geoId = null;
        async function loadGame() {
            try {
                const response = await fetch('game.json');
                if (!response.ok) throw new Error();
                config = await response.json();
                initGame();
                document.getElementById('loading').style.display = 'none';
            } catch (err) {
                document.getElementById('loading-text').classList.add('hidden');
                document.getElementById('manual-loader').classList.remove('hidden');
            }
        }
        function handleManualLoad(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => { config = JSON.parse(ev.target.result); initGame(); document.getElementById('loading').style.display = 'none'; };
            reader.readAsText(file);
        }
        function initGame() { document.title = config.appTitle || "Kaland Játék"; simIdx = 0; inventory = []; updateUI(); }
        function getD(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180; const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180; const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }
        function updateUI() {
            if(geoId) navigator.geolocation.clearWatch(geoId);
            const p = config.storyPages[simIdx]; if(!p) return;
            handleReward(p);
            document.getElementById('bg-layer').style.opacity = 0;
            setTimeout(() => { document.getElementById('bg-layer').src = p.pageBg || config.globalBg || ""; document.getElementById('bg-layer').style.opacity = 1; }, 200);
            let text = p.content || "";
            const avImg = document.getElementById('avatar-img'); avImg.style.display = 'none';
            config.avatars.forEach(av => { if(text.includes('§'+av.id)) { avImg.src = av.url || ""; avImg.style.display = av.url ? 'block' : 'none'; avImg.style.borderColor = av.color; text = text.replace(new RegExp('§'+av.id, 'g'), '<span style="color:'+av.color+'">'+av.name+':</span>'); } });
            document.getElementById('story-text').innerHTML = text;
            const ill = document.getElementById('page-illustration'); if(p.pageImage) { ill.src = p.pageImage; ill.classList.remove('hidden'); } else { ill.classList.add('hidden'); }
            const container = document.getElementById('button-container'); container.innerHTML = '';
            const status = document.getElementById('gps-status'); status.classList.add('hidden');
            const extMap = document.getElementById('ext-map-btn'); extMap.classList.add('hidden');
            const mapBadge = document.getElementById('map-badge'); mapBadge.classList.add('hidden');
            
            if (p.pageType === 'qr') { addBtn("QR BEOLVASÁSA", startQR, "fa-camera"); }
            else if(p.pageType === 'password') {
                const inp = document.createElement('input'); inp.className = "w-full bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-lg text-center mb-2"; inp.placeholder = "KÓD...";
                addBtn("NYITÁS", () => { if(inp.value.trim().toLowerCase() == (p.password||"").toLowerCase()) { simIdx = parseInt(p.nextIdx) || simIdx + 1; updateUI(); } });
                container.prepend(inp);
            } else if(p.pageType === 'gps') {
                status.classList.remove('hidden');
                if (p.mapLink) { 
                    extMap.href = p.mapLink; 
                    extMap.classList.remove('hidden'); 
                    mapBadge.classList.remove('hidden');
                }
                geoId = navigator.geolocation.watchPosition((pos) => {
                    const d = getD(pos.coords.latitude, pos.coords.longitude, parseFloat(p.targetLat), parseFloat(p.targetLng));
                    document.getElementById('dist-val').textContent = Math.round(d);
                    if(d <= 20) { navigator.geolocation.clearWatch(geoId); geoId = null; simIdx = parseInt(p.nextIdx) || simIdx + 1; updateUI(); }
                }, null, {enableHighAccuracy:true});
            } else if(p.pageType === 'choice' && p.choices) {
                p.choices.forEach(c => { if (c.req && !inventory.find(i => i.name.toLowerCase() === c.req.toLowerCase())) return; addBtn(c.text, () => { simIdx = parseInt(c.target); updateUI(); }); });
            } 
            
            // Navigációs sor generálása
            const navRow = document.createElement('div');
            navRow.className = "flex gap-3 w-full";
            
            if(simIdx > 0 || p.prevIdx) {
                const b = document.createElement('button'); b.className = "action-btn btn-back";
                b.innerHTML = "VISSZA";
                b.onclick = () => { simIdx = p.prevIdx ? parseInt(p.prevIdx) : simIdx - 1; updateUI(); };
                navRow.appendChild(b);
            }
            
            if (p.pageType !== 'choice' && p.pageType !== 'password' && p.pageType !== 'qr' && p.pageType !== 'gps') {
                const b = document.createElement('button'); b.className = "action-btn";
                b.innerHTML = "TOVÁBB";
                b.onclick = () => { simIdx = parseInt(p.nextIdx) || simIdx + 1; updateUI(); };
                navRow.appendChild(b);
            }
            
            if (navRow.hasChildNodes()) container.appendChild(navRow);
            
            document.getElementById('scroll-area').scrollTop = 0;
        }
        function addBtn(text, fn, icon = "") {
            const b = document.createElement('button'); b.className = "action-btn";
            b.innerHTML = text + (icon ? ' <i class="fa '+icon+' ml-2 opacity-50"></i>' : '');
            b.onclick = fn; document.getElementById('button-container').appendChild(b);
        }
        function startQR() {
            document.getElementById('qr-layer').style.display = 'flex';
            qrScanner = new Html5Qrcode("qr-reader");
            qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
                const p = config.storyPages[simIdx];
                if (decodedText.toUpperCase() === (p.qrCode || "").toUpperCase()) { stopQR(); simIdx = parseInt(p.nextIdx) || simIdx + 1; updateUI(); }
            }).catch(() => { stopQR(); });
        }
        function stopQR() { if (qrScanner) { try { const state = qrScanner.getState(); if (state === 2 || state === 3) { qrScanner.stop().finally(() => { document.getElementById('qr-layer').style.display = 'none'; qrScanner = null; }); } else { document.getElementById('qr-layer').style.display = 'none'; qrScanner = null; } } catch (e) { document.getElementById('qr-layer').style.display = 'none'; qrScanner = null; } } else { document.getElementById('qr-layer').style.display = 'none'; } }
        function handleReward(p) { if(p.storyItemName && !inventory.find(item => item.name === p.storyItemName)) { inventory.push({ name: p.storyItemName, icon: p.storyItemIcon || '📦', url: p.storyItemUrl || '', seen: false }); updateBadge(); } }
        function updateBadge() { const b = document.getElementById('inv-badge'); const unread = inventory.filter(i => !i.seen).length; b.textContent = unread; b.classList.toggle('hidden', unread === 0); }
        function switchView(target) {
            const inv = document.getElementById('inventory-overlay');
            const p = config.storyPages[simIdx];
            if (target === 'inv') {
                if (inv.style.display === 'block') { inv.style.display = 'none'; document.getElementById('nav-inv').classList.remove('active'); }
                else { renderInventory(); inv.style.display = 'block'; document.getElementById('nav-inv').classList.add('active'); }
            } else if (target === 'map') {
                if (p && p.pageType === 'gps' && p.mapLink) {
                    window.open(p.mapLink, '_blank');
                    document.getElementById('map-badge').classList.add('hidden');
                } else if (config.initialMapLink) {
                    window.open(config.initialMapLink, '_blank');
                } else {
                    inv.style.display = 'none'; 
                    document.getElementById('nav-inv').classList.remove('active');
                }
            }
        }
        function renderInventory() {
            const list = document.getElementById('item-list'); list.innerHTML = '';
            inventory.forEach(item => {
                const d = document.createElement('div'); d.className = "item-card";
                let content = item.url ? '<img src="'+item.url+'"><div class="text-[10px] font-bold text-white uppercase">'+item.name+'</div>' : '<div class="text-4xl mb-2">'+item.icon+'</div><div class="text-[10px] font-bold text-white uppercase">'+item.name+'</div>';
                if (!item.seen) content += '<div class="item-unread-dot"></div>';
                d.innerHTML = content;
                d.onclick = () => { if(item.url) { document.getElementById('zoom-img').src = item.url; document.getElementById('zoom-viewer').style.display = 'flex'; } item.seen = true; updateBadge(); renderInventory(); };
                list.appendChild(d);
            });
        }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
        function resetGame() { if(confirm("Újrakezded?")) { simIdx = 0; inventory = []; updateBadge(); switchView('map'); updateUI(); } }
        window.onload = loadGame;
    </script>
</body>
</html>
