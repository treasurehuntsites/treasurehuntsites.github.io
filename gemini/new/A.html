<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Új Kaland</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Play', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        #studio-view { height: 100%; overflow-y: auto; padding: 2.5rem; }
        .glass-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            border-radius: 1rem; 
        }
        .input-style { 
            background: #0f172a; 
            color: #22d3ee; 
            border: 1px solid #334155; 
            border-radius: 0.5rem; 
            padding: 0.6rem; 
            outline: none; 
            transition: 0.2s; 
            width: 100%; 
        }
        .input-style:focus { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; }
        .page-item.selected { border-color: #22d3ee; background: #4c1d95; }
        .handle { cursor: grab; padding-right: 15px; color: #64748b; font-size: 0.9rem; }

        @keyframes fadeInOutSplash {
            0% { opacity: 0; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
            90% { opacity: 0; transform: scale(1.02); }
            100% { opacity: 0; }
        }
        .splash-text-anim {
            font-family: 'Special Elite', cursive;
            animation: fadeInOutSplash 10s ease-in-out forwards;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .phone-ui {
            background: linear-gradient(to bottom, #2c3e50, #000000);
            height: 100%; width: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 15% 20px; box-sizing: border-box; text-align: center;
            color: white; font-family: sans-serif;
        }
        .phone-btn {
            width: 70px; height: 70px; border-radius: 50%; border: none;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .phone-btn.decline { background-color: #ff3b30; }
        .phone-btn.accept { background-color: #4cd964; }
        .phone-btn svg { width: 35px; height: 35px; fill: white; }
        .pulse { animation: pulse-anim 1.5s infinite; }
        @keyframes pulse-anim {
            0% { box-shadow: 0 0 0 0px rgba(76, 217, 100, 0.5); }
            100% { box-shadow: 0 0 0 30px rgba(76, 217, 100, 0); }
        }

        .avatar-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 0.75rem;
            display: grid;
            grid-template-columns: 45px 1fr 1fr 40px auto;
            gap: 10px;
            align-items: center;
        }

        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s ease-in-out; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { position: relative; background: rgba(0,0,0,0.94); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 35px; min-height: 220px; display: flex; flex-direction: column; max-height: 80%; }
        .sim-avatar { position: absolute; top: -40px; left: 10px; width: 65px; height: 65px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; }
        .sim-btn { flex: 1; background: #8b5cf6; color: white; padding: 12px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.05rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .sim-btn-back { background: #334155; }
        .sim-bottom-bar { height: 65px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; }

        #player-view { position: fixed; inset: 0; z-index: 4000; background: #000; display: none; flex-direction: column; }
        .p-game-wrapper { width: 100%; height: 100dvh; display: flex; flex-direction: column; position: relative; background: #000; }
        #p-viewport { position: relative; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: src 0.5s ease-in-out, opacity 0.5s; }
        #p-content-layer { position: relative; z-index: 10; height: 100%; flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
        
        .p-dialog-box { 
            position: relative; 
            background: rgba(0,0,0,0.92); 
            border-top: 3px solid #8b5cf6; 
            border-radius: 1.5rem 1.5rem 0 0; 
            padding: 20px; 
            padding-top: 40px; 
            max-height: 85%; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5); 
            overflow: hidden;
        }
        .p-avatar-frame { position: absolute; top: -40px; left: 10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .p-action-btn { flex-shrink: 0; background: #8b5cf6; color: white; padding: 14px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1.15rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .p-action-btn:active { transform: scale(0.98); background: #a855f7; }
        .p-btn-back { background: #334155; }
        
        .p-bottom-nav { height: 70px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
        .p-nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; position: relative; transition: color 0.3s; }
        .p-nav-item.active { color: #8b5cf6; }
        .p-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; }
        
        #p-story-text { text-align: justify; hyphens: auto; font-size: 19px; font-weight: 700; line-height: 1.5; margin-bottom: 15px; color: #f8fafc; }
        #p-scroll-area { overflow-y: auto; flex-grow: 1; }
        
        #p-inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 50; display: none; padding: 25px; padding-top: 50px; overflow-y: auto; }
        #p-button-container { flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

        #p-qr-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #p-qr-reader { width: 280px; height: 280px; border: 3px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; }
        
        #p-zoom-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; align-items: center; justify-content: center; touch-action: none; overflow: hidden; }
        #p-zoom-img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px; transition: transform 0.1s ease-out; cursor: zoom-out; user-select: none; }

        .view-toggle-btn { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 6000; background: #8b5cf6; color: white; padding: 0.75rem 1.25rem; border-radius: 0.75rem; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4); cursor: pointer; border: none; display: flex; align-items: center; gap: 8px; }
        #save-indicator { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; font-size: 0.75rem; font-weight: bold; display: none; z-index: 1000; }
        #custom-modal, #hint-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #1e293b; border: 2px solid #8b5cf6; border-radius: 1.5rem; padding: 2rem; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="file-loader" class="fixed inset-0 z-[9000] bg-[#0f172a] flex flex-col items-center justify-center p-8 text-center">
        <h1 class="text-white text-3xl font-bold mb-6">Új Kaland</h1>
        <p class="text-slate-400 mb-10">Töltsd be a játékhoz tartozó adatfájlt.</p>
        <button onclick="document.getElementById('ml').click()" class="bg-purple-600 px-8 py-4 rounded-xl text-white font-bold uppercase tracking-widest shadow-xl">Játék betöltése (.json)</button>
        <input type="file" id="ml" class="hidden" accept=".json" onchange="hL(event)">
    </div>

    <div id="hint-modal">
        <div class="modal-box">
            <div id="hint-step-confirm">
                <h3 class="text-xl font-bold mb-4 uppercase text-cyan-400">Segítség kérése</h3>
                <p class="text-slate-400 mb-8">Biztosan látni akarod a következő segítséget?</p>
                <div class="flex gap-4">
                    <button onclick="closeHintModal()" class="flex-1 bg-slate-700 p-3 rounded-xl font-bold uppercase text-xs">Mégse</button>
                    <button id="hint-show-btn" class="flex-1 bg-purple-600 p-3 rounded-xl font-bold uppercase text-xs">Igen, kérem</button>
                </div>
            </div>
            <div id="hint-display-area" class="hidden">
                <h3 class="text-xl font-bold mb-4 uppercase text-purple-400">Útmutatás</h3>
                <div id="hint-content-text" class="text-white text-lg font-bold mb-8 italic"></div>
                <button onclick="closeHintModal()" class="w-full bg-cyan-600 p-3 rounded-xl font-bold uppercase text-xs">Értem</button>
            </div>
        </div>
    </div>

    <div id="player-view" style="display:flex">
        <div id="p-qr-layer">
            <div id="p-qr-reader"></div>
            <button onclick="pStopQR(true)" class="p-action-btn mt-6 !w-auto px-12">MÉGSE</button>
        </div>
        <div id="p-zoom-viewer" onclick="pCloseZoom(true)">
            <img id="p-zoom-img" src="" onclick="event.stopPropagation()">
        </div>
        <div class="p-game-wrapper">
            <div id="p-viewport">
                <img id="p-bg-layer" src="">
                <div id="p-splash-screen" class="absolute inset-0 bg-black z-[1000] hidden flex items-center justify-center">
                    <div id="p-splash-text" class="text-white text-center p-6 splash-text-anim text-4xl"></div>
                </div>
                <div id="p-call-screen" class="absolute inset-0 z-[1100] hidden">
                    <div class="phone-ui !h-full">
                        <div class="mt-20"><p class="text-sm uppercase tracking-widest opacity-60">Bejövő hívás</p><h1 id="p-call-name" class="text-4xl mt-2">Ismeretlen</h1></div>
                        <div id="p-call-btns" class="flex justify-around pb-20 w-full max-w-md mx-auto">
                            <button onclick="pEndCall()" class="phone-btn decline"><svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z" transform="rotate(135 12 12)"/></svg></button>
                            <button onclick="pAnswerCall()" class="phone-btn accept pulse"><svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg></button>
                        </div>
                    </div>
                </div>
                <div id="p-inventory-overlay">
                    <h2 class="text-center text-cyan-400 font-bold mb-8 uppercase tracking-widest">Hátizsák</h2>
                    <div id="p-item-list" class="p-item-grid"></div>
                </div>
                <div id="p-content-layer">
                    <div class="p-dialog-box">
                        <img id="p-avatar-img" class="p-avatar-frame" src="">
                        <div id="p-scroll-area" class="overflow-y-auto pr-1 flex-grow">
                            <img id="p-page-illustration" class="w-full rounded-xl mb-4 hidden shadow-xl" src="">
                            <div id="p-story-text"></div>
                            <div id="p-gps-monitor" class="hidden text-center p-4 bg-slate-900/80 rounded-2xl mt-4 border border-cyan-500/40">
                                <div class="text-[10px] text-cyan-500 uppercase font-bold tracking-widest mb-1">Célpont távolsága</div>
                                <div class="text-3xl font-bold text-white"><span id="p-distance-val">...</span> <span class="text-sm opacity-50">méter</span></div>
                            </div>
                        </div>
                        <div id="p-button-container"></div>
                    </div>
                </div>
            </div>
            <div class="p-bottom-nav">
                <button class="p-nav-item active" onclick="pSwitchView('map')"><i class="fa fa-map-marked-alt"></i></button>
                <button class="p-nav-item" onclick="pSwitchView('inv')"><i class="fa-solid fa-briefcase"></i><div id="p-inv-badge" class="p-badge hidden">0</div></button>
                <button class="p-nav-item" onclick="pResetGame()"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="p-nav-item" onclick="pToggleFullscreen()"><i class="fa fa-expand"></i></button>
            </div>
        </div>
    </div>

    <audio id="p-ringtone-audio" loop></audio>
    <audio id="p-call-voice-audio"></audio>

    <script>
        let config = null;
        let pSimIdx = 0, pInventory = [], currentHintIdx = 0, pQrScanner = null, userPos = null, lastAutoGpsIdx = -1, splashTimer = null;

        async function init() {
            try {
                const r = await fetch('game.json');
                if(r.ok) { config = await r.json(); document.getElementById('file-loader').style.display='none'; start(); }
            } catch(e){}
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => { userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude }; updateGps(); }, null, { enableHighAccuracy: true });
            }
        }

        function hL(e) {
            const f = e.target.files[0];
            const r = new FileReader();
            r.onload = (ev) => { config = JSON.parse(ev.target.result); document.getElementById('file-loader').style.display='none'; start(); };
            r.readAsText(f);
        }

        function start() { pUpdateUI(); }

        function pUpdateUI() {
            if(!config || !config.storyPages[pSimIdx]) return;
            const p = config.storyPages[pSimIdx];
            pStopAllAudio(); pHandleReward(p);
            
            const bg = document.getElementById('p-bg-layer');
            bg.src = p.pageBg || config.globalBg || "";
            
            let text = p.content || "";
            const avImg = document.getElementById('p-avatar-img');
            avImg.style.display = 'none';
            config.avatars.forEach(av => {
                if(text.includes('§' + av.id)) {
                    avImg.src = av.url || "";
                    avImg.style.display = av.url ? 'block' : 'none';
                    avImg.style.borderColor = av.color;
                    text = text.replace(new RegExp('§' + av.id, 'g'), '<span style="color:' + av.color + '">' + av.name + ':</span>');
                }
            });
            document.getElementById('p-story-text').innerHTML = text;
            
            const ill = document.getElementById('p-page-illustration');
            if(p.pageImage) { ill.src = p.pageImage; ill.style.display = 'block'; } else { ill.style.display = 'none'; }
            
            document.getElementById('p-gps-monitor').classList.toggle('hidden', p.pageType !== 'gps');
            
            const container = document.getElementById('p-button-container');
            container.innerHTML = '';
            
            if (p.pageType === 'choice' && p.choices) {
                p.choices.forEach(c => {
                    const btn = document.createElement('button'); btn.className = "p-action-btn"; btn.textContent = c.text;
                    btn.onclick = () => { pSimIdx = parseInt(c.target); pUpdateUI(); }; container.appendChild(btn);
                });
            } else if (p.pageType === 'password') {
                const inp = document.createElement('input'); inp.className = "w-full bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-lg text-center font-bold text-2xl mb-2"; inp.placeholder = "KÓD...";
                container.appendChild(inp);
                const btn = document.createElement('button'); btn.className = "p-action-btn"; btn.textContent = "NYITÁS";
                btn.onclick = () => { if(inp.value.toLowerCase() === p.password.toLowerCase()) { pSimIdx++; pUpdateUI(); } }; container.appendChild(btn);
            } else if (p.pageType === 'qr') {
                const btn = document.createElement('button'); btn.className = "p-action-btn"; btn.textContent = "QR BEOLVASÁSA";
                btn.onclick = pStartQR; container.appendChild(btn);
            } else {
                const b = document.createElement('button'); b.className = "p-action-btn"; b.textContent = "TOVÁBB";
                b.onclick = () => { pSimIdx++; pUpdateUI(); }; container.appendChild(b);
            }
        }

        function pHandleReward(p) { if(p.rewards) p.rewards.forEach(r => { if(r.name && !pInventory.find(i => i.name === r.name)) pInventory.push({...r, seen: false}); }); pUpdateBadge(); }
        function pUpdateBadge() { const b = document.getElementById('p-inv-badge'), u = pInventory.filter(i => !i.seen).length; b.textContent = u; b.style.display = u === 0 ? 'none' : 'block'; }
        function pSwitchView(target) { const inv = document.getElementById('p-inventory-overlay'); if(target === 'inv') { inv.style.display = inv.style.display === 'block' ? 'none' : 'block'; pRenderInv(); } else { inv.style.display = 'none'; if(config.initialMapLink) window.open(config.initialMapLink, '_blank'); } }
        function pRenderInv() { const l = document.getElementById('p-item-list'); l.innerHTML = ''; pInventory.forEach(item => { const d = document.createElement('div'); d.className = "p-item-card"; d.innerHTML = '<div class="text-3xl">' + item.icon + '</div><div>' + item.name + '</div>'; d.onclick = () => { item.seen = true; pUpdateBadge(); pRenderInv(); }; l.appendChild(d); }); }
        function pStopAllAudio() { document.getElementById('p-ringtone-audio').pause(); document.getElementById('p-call-voice-audio').pause(); }
        function pResetGame() { if(confirm("Újrakezded?")) { pSimIdx = 0; pInventory = []; pUpdateUI(); } }
        function pToggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function pStartQR() { document.getElementById('p-qr-layer').style.display = 'flex'; pQrScanner = new Html5Qrcode("p-qr-reader"); pQrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (t) => { if(t.toLowerCase() === config.storyPages[pSimIdx].qrCode.toLowerCase()) pStopQR(false, () => { pSimIdx++; pUpdateUI(); }); }); }
        function pStopQR(m, cb) { if(pQrScanner) pQrScanner.stop().then(() => { pQrScanner = null; document.getElementById('p-qr-layer').style.display = 'none'; if(cb) cb(); }); else { document.getElementById('p-qr-layer').style.display = 'none'; if(cb) cb(); } }
        function pAnswerCall() { document.getElementById('p-call-voice-audio').play(); }
        function pEndCall() { pSimIdx++; pUpdateUI(); }
        function closeHintModal() { document.getElementById('hint-modal').style.display = 'none'; }
        
        init();
    </script>
</body>
</html>
