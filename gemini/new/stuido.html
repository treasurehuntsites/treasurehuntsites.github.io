<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaland Játék Stúdió V11.0 ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Play', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            overflow-x: hidden; 
        }
        
        .glass-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            border-radius: 1rem; 
        }
        
        .input-style { 
            background: #0f172a; 
            color: #22d3ee; 
            border: 1px solid #334155; 
            border-radius: 0.5rem; 
            padding: 0.6rem; 
            outline: none; 
            transition: 0.2s; 
            width: 100%; 
        }
        .input-style:focus { 
            border-color: #8b5cf6; 
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); 
        }
        
        .page-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0.75rem; 
            margin-bottom: 0.5rem; 
            border-radius: 0.5rem; 
            background: #1e293b; 
            border: 1px solid transparent; 
            transition: 0.2s; 
        }
        .page-item:hover { background: #334155; }
        .page-item.selected { border-color: #22d3ee; background: #4c1d95; }
        .handle { cursor: grab; padding-right: 15px; color: #64748b; }

        /* Mobil Szimulátor */
        .sim-container {
            position: sticky;
            top: 1rem;
            width: 320px;
            height: 600px;
            background: #000;
            border: 10px solid #1e293b;
            border-radius: 2.5rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
        }

        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.35); z-index: 0; transition: opacity 0.5s ease-in-out; }
        
        #sim-content { 
            position: relative; 
            z-index: 10; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            padding: 0;
        }
        
        .sim-box { 
            position: relative;
            background: rgba(0,0,0,0.94); 
            border-top: 3px solid #8b5cf6; 
            border-radius: 1.5rem 1.5rem 0 0; 
            padding: 20px; 
            padding-top: 35px;
            min-height: 220px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
        }
        
        .sim-avatar { 
            position: absolute; 
            top: -40px; 
            left: 10px; 
            width: 65px; 
            height: 65px; 
            border-radius: 50%; 
            border: 3px solid #8b5cf6; 
            background: #000; 
            z-index: 20; 
            object-fit: cover; 
            display: none; 
        }

        .sim-btn { 
            flex: 1; 
            background: #8b5cf6; 
            color: white; 
            padding: 12px; 
            border-radius: 0.75rem; 
            font-weight: 700; 
            text-align: center; 
            font-size: 0.85rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%;
            border: none;
        }
        .sim-btn:hover { background: #a855f7; transform: translateY(-1px); }
        .sim-btn-back { background: #334155; }
        
        .sim-bottom-bar { 
            height: 65px; 
            background: #0f172a; 
            border-top: 1px solid rgba(139, 92, 246, 0.3); 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            z-index: 100; 
        }
        
        .sim-menu-btn { color: #64748b; font-size: 1.3rem; cursor: pointer; border: none; background: transparent; position: relative; transition: color 0.3s; }
        .sim-menu-btn.active { color: #8b5cf6; }
        
        .badge { 
            position: absolute; 
            top: -5px; 
            right: -5px; 
            background: #ef4444; 
            color: white; 
            font-size: 8px; 
            padding: 2px 5px; 
            border-radius: 50%; 
            font-weight: bold; 
        }

        #sim-actual-text {
            text-align: justify;
            hyphens: auto;
            padding: 0 5px;
            font-size: 14px; 
            font-weight: 700;
            line-height: 1.5;
            color: #e2e8f0;
        }

        #sim-inventory-view { position: absolute; inset: 0; background: #0f172a; z-index: 50; display: none; padding: 20px; padding-top: 40px; overflow-y: auto; }
        .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .inv-card { 
            position: relative;
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 0.75rem; 
            padding: 10px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .inv-card:hover { border-color: #8b5cf6; }

        #sim-zoom-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: pointer;
        }
        #sim-zoom-img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px; }

        .avatar-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 0.75rem;
            display: grid;
            grid-template-columns: 50px 1fr 50px auto;
            gap: 10px;
            align-items: center;
        }

        #save-indicator { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; font-size: 0.75rem; font-weight: bold; display: none; z-index: 1000; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div id="save-indicator"><i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...</div>

    <div id="sim-zoom-overlay" onclick="closeImageZoom()">
        <img id="sim-zoom-img" src="">
    </div>

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-4xl font-bold uppercase tracking-tighter text-white">Stúdió <span class="text-purple-500">V11.0</span> ✨</h1>
                <p class="text-cyan-400 text-sm mt-1">Szerkesztő felület</p>
            </div>
            <div class="flex gap-3">
                <button onclick="downloadConfig()" class="bg-slate-700 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest">Export game.json</button>
                <button onclick="document.getElementById('uploadInput').click()" class="bg-purple-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest">Import</button>
                <input type="file" id="uploadInput" class="hidden" accept=".json" onchange="handleFileUpload(event)">
            </div>
        </header>

        <div class="flex flex-col lg:flex-row gap-10">
            <div class="flex-1 space-y-8">
                <!-- GLOBÁLIS BEÁLLÍTÁSOK -->
                <div class="glass-card p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Alapbeállítások</h3>
                        <input type="text" id="appTitle" class="input-style" placeholder="Kaland címe" oninput="autoSave()">
                        <input type="url" id="globalBg" class="input-style" placeholder="Globális Háttérkép URL" oninput="autoSave()">
                    </div>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Avatarok</h3>
                            <button onclick="addAvatar()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ</button>
                        </div>
                        <div id="avatarList" class="space-y-2 max-h-40 overflow-y-auto pr-2"></div>
                    </div>
                </div>

                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Történetfolyam</h3>
                        <button onclick="addPage()" class="bg-purple-600 px-4 py-2 rounded-lg text-[10px] font-bold">+ ÚJ OLDAL</button>
                    </div>
                    <div id="pageList" class="max-h-60 overflow-y-auto pr-2 space-y-1"></div>
                </div>

                <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                    <div class="space-y-4">
                        <input type="url" id="pageImage" class="input-style text-xs" placeholder="Kép URL" oninput="autoSave()">
                        <textarea id="pageText" rows="5" class="input-style text-base" placeholder="Szöveg..." oninput="autoSave()"></textarea>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                        <select id="pageType" class="input-style text-xs" onchange="updateUI(); autoSave();">
                            <option value="story">Leírás</option>
                            <option value="choice">Választás</option>
                            <option value="qr">QR Kód</option>
                            <option value="password">Kódzár</option>
                        </select>
                        <input type="number" id="prevIdx" class="input-style text-xs" placeholder="Vissza ID" oninput="autoSave()">
                        <input type="number" id="nextIdx" class="input-style text-xs" placeholder="Tovább ID" oninput="autoSave()">
                        <input type="url" id="pageBg" class="input-style text-xs" placeholder="Egyedi háttér" oninput="autoSave()">
                        <input type="text" id="qrCode" class="input-style text-xs" placeholder="QR Kód" oninput="autoSave()">
                    </div>
                    <div id="rewardArea" class="border-t border-slate-700/50 pt-4 space-y-4">
                        <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Jelenet Jutalom</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <input type="text" id="storyItemName" class="input-style text-xs" placeholder="Név" oninput="autoSave()">
                            <input type="text" id="storyItemIcon" class="input-style text-xs" placeholder="Ikon" oninput="autoSave()">
                            <input type="url" id="storyItemUrl" class="input-style text-xs" placeholder="Kép URL" oninput="autoSave()">
                        </div>
                    </div>
                    <div id="passwordArea" class="hidden border-t border-slate-700/50 pt-4">
                        <input type="text" id="correctPass" class="input-style text-sm" placeholder="Helyes megoldás" oninput="autoSave()">
                    </div>
                    <div id="choiceArea" class="hidden border-t border-slate-700/50 pt-4">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Opciók</h3>
                            <button onclick="addChoiceItem()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ GOMB</button>
                        </div>
                        <div id="choicesContainer" class="space-y-2"></div>
                    </div>
                </div>
            </div>

            <!-- SZIMULÁTOR -->
            <div class="w-full lg:w-auto flex justify-center">
                <div class="sim-container">
                    <div id="sim-viewport">
                        <img id="sim-bg" src="">
                        <div id="sim-inventory-view">
                            <h2 class="text-center text-cyan-400 font-bold mb-6 uppercase text-sm">Hátizsák</h2>
                            <div id="sim-inv-list" class="inv-grid"></div>
                        </div>
                        <div id="sim-content">
                            <div class="sim-box">
                                <img id="sim-avatar" class="sim-avatar" src="">
                                <div id="sim-scroll" class="overflow-y-auto pr-1 flex-grow scroll-smooth">
                                    <img id="sim-page-img" class="w-full rounded-lg mb-4 hidden border border-slate-800" src="">
                                    <div id="sim-actual-text"></div>
                                </div>
                                <div id="sim-actions" class="mt-4"></div>
                            </div>
                        </div>
                    </div>
                    <div class="sim-bottom-bar">
                        <button class="sim-menu-btn active" onclick="toggleSimView('map')"><i class="fa fa-compass"></i></button>
                        <button class="sim-menu-btn" onclick="toggleSimView('inv')">
                            <i class="fa-solid fa-suitcase"></i>
                            <div id="sim-inv-badge" class="badge hidden">0</div>
                        </button>
                        <button class="sim-menu-btn" onclick="resetSim()"><i class="fa-solid fa-undo"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let config = JSON.parse(localStorage.getItem('KALAND_STUDIO_V11')) || { 
            appTitle: "A Város Legendája", 
            storyPages: [{ content: "Kezdődik a kaland!", pageType: "story" }], 
            avatars: [],
            globalBg: ""
        };
        let currentIdx = -1, simIdx = 0, simInv = [], saveTimeout;

        function updateSimulator() {
            const p = config.storyPages[simIdx]; if(!p) return;
            handleReward(p);
            document.getElementById('sim-bg').src = p.pageBg || config.globalBg || "";
            let text = p.content || "";
            const avBox = document.getElementById('sim-avatar'); avBox.style.display = 'none';
            
            config.avatars.forEach(av => { 
                if(text.includes(`§${av.id}`)) { 
                    avBox.src = av.url || ""; 
                    avBox.style.display = 'block'; 
                    avBox.style.borderColor = av.color; 
                    text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color};font-weight:700">${av.name}:</span>`); 
                } 
            });
            
            document.getElementById('sim-actual-text').innerHTML = text;
            const img = document.getElementById('sim-page-img'); 
            if(p.pageImage) { img.src = p.pageImage; img.classList.remove('hidden'); } else { img.classList.add('hidden'); }
            
            const acts = document.getElementById('sim-actions'); acts.innerHTML = '';
            
            // Navigációs gombok egymás mellett konténer
            const navRow = document.createElement('div');
            navRow.className = "flex gap-2 w-full";

            if (p.pageType === 'choice' && p.choices) {
                const choiceCol = document.createElement('div');
                choiceCol.className = "flex flex-col gap-2 w-full mb-2";
                p.choices.forEach(c => {
                    const b = document.createElement('div'); b.className = "sim-btn"; b.textContent = c.text;
                    b.onclick = () => { simIdx = parseInt(c.target); updateSimulator(); };
                    choiceCol.appendChild(b);
                });
                acts.appendChild(choiceCol);
            }

            // Vissza gomb hozzáadása balra
            if(simIdx > 0 || (p.prevIdx !== undefined && p.prevIdx !== "" && p.prevIdx !== null)) {
                const back = document.createElement('div'); 
                back.className = "sim-btn sim-btn-back"; 
                back.innerHTML = '<i class="fa fa-arrow-left mr-1 text-[10px]"></i> VISSZA';
                back.onclick = () => { 
                    simIdx = (p.prevIdx !== undefined && p.prevIdx !== "") ? parseInt(p.prevIdx) : simIdx - 1; 
                    updateSimulator(); 
                };
                navRow.appendChild(back);
            }

            if (p.pageType === 'story' || p.pageType === 'qr' || p.pageType === 'password') {
                const next = document.createElement('div'); 
                next.className = "sim-btn"; 
                let btnLabel = p.pageType === 'story' ? 'TOVÁBB' : (p.pageType === 'qr' ? 'SCAN' : 'NYITÁS');
                next.innerHTML = `${btnLabel} <i class="fa fa-chevron-right ml-1 text-[10px]"></i>`;
                next.onclick = () => { simIdx = parseInt(p.nextIdx) || simIdx + 1; updateSimulator(); };
                navRow.appendChild(next);
            }

            if (navRow.hasChildNodes()) acts.appendChild(navRow);
            document.getElementById('sim-scroll').scrollTop = 0;
        }

        function handleReward(p) { 
            if(p.storyItemName && !simInv.find(i => i.name === p.storyItemName)) { 
                simInv.push({name: p.storyItemName, icon: p.storyItemIcon || '📦', url: p.storyItemUrl || '', seen: false}); 
                updateInvBadge(); 
            } 
        }
        
        function updateInvBadge() { 
            const b = document.getElementById('sim-inv-badge'); 
            const c = simInv.filter(i => !i.seen).length; 
            b.textContent = c; 
            b.classList.toggle('hidden', c === 0); 
        }
        
        function toggleSimView(t) { 
            const v = document.getElementById('sim-inventory-view'); 
            if(t === 'inv') { renderInventory(); v.style.display = 'block'; } else v.style.display = 'none'; 
        }
        
        function renderInventory() { 
            const l = document.getElementById('sim-inv-list'); l.innerHTML = ''; 
            simInv.forEach(i => { 
                const d = document.createElement('div'); 
                d.className = "inv-card"; 
                d.innerHTML = `<div class="text-2xl">${i.icon}</div><div class="text-[9px] uppercase font-bold">${i.name}</div>`; 
                d.onclick = () => { i.seen = true; updateInvBadge(); renderInventory(); }; 
                l.appendChild(d); 
            }); 
        }
        
        function resetSim() { 
            if(confirm("Újrakezded a szimulációt?")) { 
                simIdx = 0; simInv = []; updateInvBadge(); toggleSimView('map'); updateSimulator(); 
            } 
        }
        
        function loadPage(i) { 
            currentIdx = i; const p = config.storyPages[i]; 
            document.getElementById('editorPanel').classList.remove('hidden'); 
            document.getElementById('pageText').value = p.content || ""; 
            document.getElementById('pageType').value = p.pageType || 'story'; 
            document.getElementById('nextIdx').value = p.nextIdx || ""; 
            document.getElementById('prevIdx').value = p.prevIdx || ""; 
            document.getElementById('pageBg').value = p.pageBg || ""; 
            document.getElementById('qrCode').value = p.qrCode || ""; 
            document.getElementById('correctPass').value = p.password || ""; 
            document.getElementById('storyItemName').value = p.storyItemName || ""; 
            document.getElementById('storyItemIcon').value = p.storyItemIcon || ""; 
            document.getElementById('storyItemUrl').value = p.storyItemUrl || ""; 
            updateUI(); 
            renderChoices(); 
            renderPageList(); 
            simIdx = i; 
            updateSimulator(); 
        }
        
        function autoSave() { 
            clearTimeout(saveTimeout); 
            document.getElementById('save-indicator').style.display = 'block'; 
            saveTimeout = setTimeout(() => { 
                const p = config.storyPages[currentIdx]; 
                if(p) { 
                    p.content = document.getElementById('pageText').value; 
                    p.pageType = document.getElementById('pageType').value; 
                    p.nextIdx = document.getElementById('nextIdx').value; 
                    p.prevIdx = document.getElementById('prevIdx').value; 
                    p.pageBg = document.getElementById('pageBg').value; 
                    p.qrCode = document.getElementById('qrCode').value; 
                    p.password = document.getElementById('correctPass').value; 
                    p.storyItemName = document.getElementById('storyItemName').value; 
                    p.storyItemIcon = document.getElementById('storyItemIcon').value; 
                    p.storyItemUrl = document.getElementById('storyItemUrl').value; 
                } 
                config.appTitle = document.getElementById('appTitle').value; 
                config.globalBg = document.getElementById('globalBg').value; 
                localStorage.setItem('KALAND_STUDIO_V11', JSON.stringify(config)); 
                renderPageList(); 
                updateSimulator(); 
                setTimeout(() => document.getElementById('save-indicator').style.display = 'none', 500); 
            }, 1000); 
        }
        
        function renderPageList() { 
            const l = document.getElementById('pageList'); l.innerHTML = ''; 
            config.storyPages.forEach((p, i) => { 
                const d = document.createElement('div'); 
                d.className = `page-item ${i === currentIdx ? 'selected' : ''}`; 
                d.innerHTML = `<span onclick="loadPage(${i})" class="truncate text-xs font-bold cursor-pointer uppercase">#${i}: ${p.content ? p.content.substring(0,25).replace(/§\w/g, '') : '...'}</span><div><button onclick="duplicatePage(${i})" class="mr-2 text-emerald-400"><i class="fa fa-copy"></i></button><button onclick="deletePage(${i})" class="text-red-400"><i class="fa fa-trash"></i></button></div>`; 
                l.appendChild(d); 
            }); 
        }
        
        function addAvatar() { 
            config.avatars.push({id: 'A', name: 'Új Karakter', color: '#8b5cf6'}); 
            renderAvatarAdmin(); 
            autoSave(); 
        }
        
        function renderAvatarAdmin() { 
            const l = document.getElementById('avatarList'); l.innerHTML = ''; 
            config.avatars.forEach((av, i) => { 
                const d = document.createElement('div'); 
                d.className = "avatar-card"; 
                d.innerHTML = `
                    <input type="text" class="input-style font-bold text-center" value="${av.id}" oninput="config.avatars[${i}].id=this.value;autoSave()">
                    <input type="text" class="input-style" value="${av.name}" oninput="config.avatars[${i}].name=this.value;autoSave()">
                    <input type="color" value="${av.color}" oninput="config.avatars[${i}].color=this.value;autoSave()">
                    <button onclick="config.avatars.splice(${i},1);renderAvatarAdmin();autoSave()" class="text-red-400"><i class="fa fa-trash"></i></button>`; 
                l.appendChild(d); 
            }); 
        }
        
        function addPage() { config.storyPages.push({content: "Új jelenet...", pageType: "story"}); loadPage(config.storyPages.length-1); }
        function duplicatePage(i) { config.storyPages.splice(i+1, 0, JSON.parse(JSON.stringify(config.storyPages[i]))); renderPageList(); autoSave(); }
        function deletePage(i) { if(confirm("Törlöd ezt az oldalt?")) { config.storyPages.splice(i,1); currentIdx=-1; document.getElementById('editorPanel').classList.add('hidden'); renderPageList(); autoSave(); } }
        function downloadConfig() { const b = new Blob([JSON.stringify(config, null, 2)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'game.json'; a.click(); }
        function handleFileUpload(e) { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = (ev) => { config = JSON.parse(ev.target.result); renderPageList(); renderAvatarAdmin(); loadPage(0); }; r.readAsText(f); }
        function updateUI() { const t = document.getElementById('pageType').value; document.getElementById('choiceArea').classList.toggle('hidden', t !== 'choice'); document.getElementById('passwordArea').classList.toggle('hidden', t !== 'password'); }
        function renderChoices() { const c = document.getElementById('choicesContainer'); c.innerHTML = ''; const p = config.storyPages[currentIdx]; if(!p.choices) return; p.choices.forEach((ch, i) => { const r = document.createElement('div'); r.className = "flex gap-2 items-center bg-slate-800/40 p-2 rounded"; r.innerHTML = `<input type="text" class="input-style flex-1 text-xs" value="${ch.text}" oninput="config.storyPages[${currentIdx}].choices[${i}].text=this.value;autoSave()"><input type="number" class="input-style w-20 text-xs" value="${ch.target}" oninput="config.storyPages[${currentIdx}].choices[${i}].target=this.value;autoSave()"><input type="text" placeholder="Feltétel (tárgy)" class="input-style flex-1 text-[10px]" value="${ch.req || ''}" oninput="config.storyPages[${currentIdx}].choices[${i}].req=this.value;autoSave()"><button class="text-red-500 px-1" onclick="config.storyPages[${currentIdx}].choices.splice(${i},1);renderChoices();autoSave()"><i class="fa fa-times"></i></button>`; c.appendChild(r); }); }
        function addChoiceItem() { if(!config.storyPages[currentIdx].choices) config.storyPages[currentIdx].choices = []; config.storyPages[currentIdx].choices.push({text: "Új választás", target: 0, req: ""}); renderChoices(); autoSave(); }
        
        window.onload = () => { renderPageList(); renderAvatarAdmin(); if(config.storyPages.length > 0) loadPage(0); };
    </script>
