<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kaland Játék Stúdió V11.0 ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Play', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        #studio-view { height: 100%; overflow-y: auto; padding: 2.5rem; transition: opacity 0.3s; }
        .glass-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            border-radius: 1rem; 
        }
        .input-style { 
            background: #0f172a; 
            color: #22d3ee; 
            border: 1px solid #334155; 
            border-radius: 0.5rem; 
            padding: 0.6rem; 
            outline: none; 
            transition: 0.2s; 
            width: 100%; 
        }
        .input-style:focus { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; }
        .page-item.selected { border-color: #22d3ee; background: #4c1d95; }
        .handle { cursor: grab; padding-right: 15px; color: #64748b; font-size: 0.9rem; }

        /* Simulator & Player Common Styles */
        .game-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; display: flex; flex-direction: column; }
        .game-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: opacity 0.5s; }
        .game-content-layer { position: relative; z-index: 10; height: 100%; flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-top: 100px; overflow: visible; }
        
        .dialog-box { 
            position: relative; 
            background: rgba(0,0,0,0.96); 
            border-top: 4px solid #8b5cf6; 
            border-radius: 1.5rem 1.5rem 0 0; 
            padding: 20px; 
            padding-top: 60px; 
            max-height: 80%; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 -15px 35px rgba(0,0,0,0.9); 
            overflow: visible;
            z-index: 50;
        }
        .avatar-frame { 
            position: absolute; 
            top: -60px; 
            left: 15px; 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            border: 4px solid #8b5cf6; 
            background: #000; 
            z-index: 200; 
            object-fit: cover; 
            display: none; 
            box-shadow: 0 5px 25px rgba(0,0,0,0.7); 
        }
        
        .action-btn { 
            flex: 1; 
            background: #8b5cf6; 
            color: white; 
            padding: 16px; 
            border-radius: 1rem; 
            font-weight: 800; 
            text-align: center; 
            font-size: 1.15rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: none; 
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4); 
        }
        .action-btn:active { transform: scale(0.96); background: #a855f7; }
        .btn-back { background: #334155; box-shadow: none; }
        
        .bottom-nav { 
            height: 70px; 
            background: #0f172a; 
            border-top: 1px solid rgba(139, 92, 246, 0.3); 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            z-index: 300; 
            padding-bottom: env(safe-area-inset-bottom); 
            flex-shrink: 0; 
        }
        .nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; transition: color 0.3s; }
        .nav-item.active { color: #8b5cf6; }
        
        .story-text { text-align: justify; hyphens: auto; font-size: 20px; font-weight: 700; line-height: 1.5; margin-bottom: 20px; color: #f8fafc; }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding-bottom: 10px; }
        .button-row { display: flex; gap: 10px; width: 100%; margin-top: 10px; padding-bottom: 5px; }

        /* Simulator Container */
        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }

        /* Fullscreen Player */
        #player-view { position: fixed; inset: 0; z-index: 4000; background: #000; display: none; flex-direction: column; }

        #save-indicator { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; font-size: 0.75rem; font-weight: bold; display: none; z-index: 1000; }
        
        /* QR Reader Overlay */
        #p-qr-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #p-qr-reader { width: 280px; height: 280px; border: 3px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; }
        
        /* Rejtett kapcsoló csak a Stúdió módban létezik */
        .hidden-toggle { position: fixed; top: 0; right: 0; width: 50px; height: 50px; z-index: 9999; cursor: pointer; opacity: 0; }
    </style>
</head>
<body>
    <div id="save-indicator"><i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...</div>

    <!-- Rejtett gomb a szerkesztőbe való visszatéréshez (csak fejlesztőknek a stúdióban) -->
    <div class="hidden-toggle" title="Szerkesztő mód" onclick="toggleMainView()"></div>

    <div id="studio-view">
        <div class="max-w-7xl mx-auto">
            <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                    <h1 class="text-4xl font-bold uppercase tracking-tighter text-white">Stúdió <span class="text-purple-500">V11.0</span> ✨</h1>
                    <p class="text-cyan-400 text-sm mt-1">Interaktív Kaland Szerkesztő</p>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button id="btnDownloadLive" onclick="downloadLiveHTML()" class="bg-cyan-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-cyan-500 transition-colors">Játék letöltése (.html)</button>
                    <button onclick="downloadConfig()" class="bg-slate-700 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-slate-600 transition-colors">Export game.json</button>
                    <button onclick="document.getElementById('uploadInput').click()" class="bg-purple-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-purple-500 transition-colors">Import</button>
                    <input type="file" id="uploadInput" class="hidden" accept=".json" onchange="handleFileUpload(event)">
                    <!-- A TESZTELÉS GOMB ITT MARAD A STÚDIÓBAN -->
                    <button onclick="toggleMainView()" class="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-emerald-500 transition-colors">Tesztelés</button>
                </div>
            </header>

            <div class="flex flex-col lg:flex-row gap-10">
                <div class="flex-1 space-y-8">
                    <!-- Editor Sections -->
                    <div class="glass-card p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-4">
                            <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Alapbeállítások</h3>
                            <input type="text" id="appTitle" class="input-style" placeholder="Kaland címe" oninput="autoSave()">
                            <input type="url" id="globalBg" class="input-style" placeholder="Globális Háttér URL" oninput="autoSave()">
                        </div>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Avatarok</h3>
                                <button onclick="addAvatar()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ</button>
                            </div>
                            <div id="avatarList" class="space-y-2 max-h-48 overflow-y-auto pr-2"></div>
                        </div>
                    </div>

                    <div class="glass-card p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Történetfolyam</h3>
                            <button onclick="addPage()" class="bg-purple-600 px-4 py-2 rounded-lg text-[10px] font-bold">+ ÚJ OLDAL</button>
                        </div>
                        <div id="pageList" class="max-h-60 overflow-y-auto pr-2 space-y-1"></div>
                    </div>

                    <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                        <div class="space-y-4">
                            <input type="url" id="pageImage" class="input-style text-xs" placeholder="Illusztráció URL" oninput="autoSave()">
                            <textarea id="pageText" rows="5" class="input-style text-base" placeholder="Történet szövege... §ID az avatarokhoz." oninput="autoSave()"></textarea>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                            <select id="pageType" class="input-style text-xs" onchange="updateUI(); autoSave();">
                                <option value="story">Leírás</option>
                                <option value="choice">Választás</option>
                                <option value="qr">QR Kód</option>
                                <option value="password">Kódzár</option>
                            </select>
                            <input type="number" id="nextIdx" class="input-style text-xs" placeholder="Tovább ID" oninput="autoSave()">
                            <input type="number" id="prevIdx" class="input-style text-xs" placeholder="Vissza ID" oninput="autoSave()">
                            <input type="url" id="pageBg" class="input-style text-xs" placeholder="Egyedi háttér" oninput="autoSave()">
                            <input type="text" id="qrCode" class="input-style text-xs" placeholder="QR Érték" oninput="autoSave()">
                            <input type="text" id="correctPass" class="input-style text-xs" placeholder="Jelszó" oninput="autoSave()">
                        </div>
                        <div id="choiceArea" class="hidden border-t border-slate-700/50 pt-4">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Opciók</h3>
                                <button onclick="addChoiceItem()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ GOMB</button>
                            </div>
                            <div id="choicesContainer" class="space-y-2"></div>
                        </div>
                    </div>
                </div>

                <!-- Simulator (Preview) -->
                <div class="w-full lg:w-auto flex justify-center">
                    <div class="sim-container">
                        <div id="sim-viewport" class="game-viewport">
                            <img id="sim-bg" class="game-bg-layer" src="">
                            <div id="sim-content" class="game-content-layer">
                                <div id="sim-main-box" class="dialog-box">
                                    <img id="sim-avatar" class="avatar-frame" src="">
                                    <div id="sim-scroll" class="scroll-area">
                                        <div id="sim-actual-text" class="story-text"></div>
                                    </div>
                                    <div id="sim-actions" class="button-row"></div>
                                </div>
                            </div>
                        </div>
                        <div class="bottom-nav">
                            <button class="nav-item active"><i class="fa fa-compass"></i></button>
                            <button onclick="resetSim()"><i class="fa-solid fa-undo"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Player View (Teszteléskor és Exportáláskor látható) -->
    <div id="player-view">
        <div id="p-qr-layer">
            <div id="p-qr-reader"></div>
            <button onclick="pStopQR(true)" class="action-btn mt-6 !w-auto px-12">MÉGSE</button>
        </div>
        <div class="p-game-wrapper">
            <div id="p-viewport" class="game-viewport">
                <img id="p-bg-layer" class="game-bg-layer" src="">
                <div id="p-content-layer" class="game-content-layer">
                    <div class="dialog-box">
                        <img id="p-avatar-img" class="avatar-frame" src="">
                        <div id="p-scroll-area" class="scroll-area">
                            <img id="p-page-illustration" class="w-full rounded-xl mb-4 hidden shadow-xl" src="">
                            <div id="p-story-text" class="story-text"></div>
                        </div>
                        <div id="p-button-container"></div>
                    </div>
                </div>
            </div>
            <div class="bottom-nav">
                <button class="nav-item active" onclick="pSwitchView('map')"><i class="fa fa-map-marked-alt"></i></button>
                <button class="nav-item" onclick="pResetGame()"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="nav-item" onclick="pToggleFullscreen()"><i class="fa fa-expand"></i></button>
            </div>
        </div>
    </div>

    <script>
        let config;
        try {
            config = JSON.parse(localStorage.getItem('KALAND_STUDIO_V11')) || { 
                appTitle: "Új Kaland", 
                storyPages: [{ content: "Kezdés...", pageType: "story", choices: [] }], 
                avatars: [], 
                globalBg: "" 
            };
        } catch(e) { config = { appTitle: "Hiba", storyPages: [{ content: "Hiba", pageType: "story" }], avatars: [] }; }

        let currentIdx = -1, simIdx = 0, pSimIdx = 0, saveTimeout, pQrScanner = null, isPlayerMode = false;

        function toggleMainView() {
            isPlayerMode = !isPlayerMode;
            const studio = document.getElementById('studio-view'), player = document.getElementById('player-view');
            if (isPlayerMode) {
                studio.style.display = 'none'; player.style.display = 'flex';
                pSimIdx = 0; pUpdateUI();
            } else {
                studio.style.display = 'block'; player.style.display = 'none';
                updateSimulator();
            }
        }

        // Billentyűzet shortcut a szerkesztőbe való visszajutáshoz (Esc) a Tesztelés módból
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isPlayerMode) toggleMainView();
        });

        function loadPage(i) { 
            currentIdx = i; const p = config.storyPages[i]; if(!p) return;
            document.getElementById('editorPanel').classList.remove('hidden'); 
            document.getElementById('pageText').value = p.content || ""; 
            document.getElementById('pageType').value = p.pageType || 'story'; 
            document.getElementById('nextIdx').value = p.nextIdx || "";
            document.getElementById('prevIdx').value = p.prevIdx || "";
            document.getElementById('pageBg').value = p.pageBg || "";
            document.getElementById('qrCode').value = p.qrCode || "";
            document.getElementById('correctPass').value = p.password || "";
            document.getElementById('pageImage').value = p.pageImage || "";
            updateUI(); renderChoices(); renderAvatarAdmin(); renderPageList(); 
            simIdx = i; updateSimulator(); 
        }

        function addPage() { config.storyPages.push({content: "Új oldal...", pageType: "story", choices: []}); loadPage(config.storyPages.length-1); autoSave(); }
        function addAvatar() { config.avatars.push({id: 'A', name: 'Név', url: '', color: '#8b5cf6'}); renderAvatarAdmin(); autoSave(); }
        function addChoiceItem() { 
            const p = config.storyPages[currentIdx];
            if(!p.choices) p.choices = []; 
            p.choices.push({text: "Opció", target: 0}); 
            renderChoices(); autoSave(); 
        }

        function autoSave() { 
            clearTimeout(saveTimeout); document.getElementById('save-indicator').style.display = 'block'; 
            saveTimeout = setTimeout(() => { 
                const p = config.storyPages[currentIdx]; 
                if(p) { 
                    p.content = document.getElementById('pageText').value; 
                    p.pageType = document.getElementById('pageType').value; 
                    p.nextIdx = document.getElementById('nextIdx').value; 
                    p.prevIdx = document.getElementById('prevIdx').value; 
                    p.pageBg = document.getElementById('pageBg').value; 
                    p.qrCode = document.getElementById('qrCode').value; 
                    p.password = document.getElementById('correctPass').value; 
                    p.pageImage = document.getElementById('pageImage').value;
                } 
                config.appTitle = document.getElementById('appTitle').value; 
                localStorage.setItem('KALAND_STUDIO_V11', JSON.stringify(config)); 
                renderPageList(); updateSimulator(); 
                document.getElementById('save-indicator').style.display = 'none';
            }, 800); 
        }

        function renderPageList() { 
            const l = document.getElementById('pageList'); l.innerHTML = ''; 
            config.storyPages.forEach((p, i) => { 
                const d = document.createElement('div'); d.className = `page-item ${i === currentIdx ? 'selected' : ''}`; 
                d.innerHTML = `<div class="flex items-center"><i class="fa fa-bars handle"></i><span onclick="loadPage(${i})" class="truncate text-xs font-bold cursor-pointer uppercase">#${i}: ${p.content ? p.content.substring(0,25) : '...'}</span></div><button onclick="config.storyPages.splice(${i},1);renderPageList();autoSave()" class="text-red-400"><i class="fa fa-trash"></i></button>`; 
                l.appendChild(d); 
            }); 
        }

        function renderAvatarAdmin() {
            const l = document.getElementById('avatarList'); l.innerHTML = '';
            config.avatars.forEach((av, i) => {
                const d = document.createElement('div'); d.className = "grid grid-cols-4 gap-2 items-center mb-2 bg-slate-800/40 p-2 rounded";
                d.innerHTML = `<input type="text" class="input-style text-[10px]" value="${av.id}" oninput="config.avatars[${i}].id=this.value;autoSave()"><input type="text" class="input-style text-[10px]" value="${av.name}" oninput="config.avatars[${i}].name=this.value;autoSave()"><input type="url" class="input-style text-[10px] col-span-2" value="${av.url}" oninput="config.avatars[${i}].url=this.value;autoSave()">`;
                l.appendChild(d);
            });
        }

        function renderChoices() {
            const c = document.getElementById('choicesContainer'); c.innerHTML = '';
            const p = config.storyPages[currentIdx]; if(!p || !p.choices) return;
            p.choices.forEach((ch, i) => {
                const r = document.createElement('div'); r.className = "flex gap-2 mb-2";
                r.innerHTML = `<input type="text" class="input-style text-xs" value="${ch.text}" oninput="config.storyPages[${currentIdx}].choices[${i}].text=this.value;autoSave()"><input type="number" class="input-style w-20 text-xs" value="${ch.target}" oninput="config.storyPages[${currentIdx}].choices[${i}].target=this.value;autoSave()"><button onclick="config.storyPages[currentIdx}].choices.splice(${i},1);renderChoices();autoSave()">X</button>`;
                c.appendChild(r);
            });
        }

        function updateUI() { 
            const t = document.getElementById('pageType').value; 
            document.getElementById('choiceArea').classList.toggle('hidden', t !== 'choice'); 
        }

        function updateSimulator() {
            const p = config.storyPages[simIdx]; if(!p) return;
            document.getElementById('sim-bg').src = p.pageBg || config.globalBg || "";
            let text = p.content || "";
            const av = document.getElementById('sim-avatar'); av.style.display = 'none';
            config.avatars.forEach(a => { 
                if(text.includes(`§${a.id}`)) { 
                    av.src = a.url || ""; av.style.display = 'block'; av.style.borderColor = a.color; 
                    text = text.replace(new RegExp(`§${a.id}`, 'g'), `<span style="color:${a.color}">${a.name}:</span>`); 
                } 
            });
            document.getElementById('sim-actual-text').innerHTML = text;
            const acts = document.getElementById('sim-actions'); acts.innerHTML = '';
            
            const btnRow = document.createElement('div'); btnRow.className = "button-row";
            const bBtn = document.createElement('button'); bBtn.className = "action-btn btn-back !py-2 !text-xs"; bBtn.textContent = "VISSZA";
            bBtn.onclick = () => { if(simIdx > 0) { simIdx--; updateSimulator(); } };
            const nBtn = document.createElement('button'); nBtn.className = "action-btn !py-2 !text-xs"; nBtn.textContent = "TOVÁBB";
            nBtn.onclick = () => { if(simIdx < config.storyPages.length - 1) { simIdx++; updateSimulator(); } };
            
            btnRow.appendChild(bBtn); btnRow.appendChild(nBtn);
            acts.appendChild(btnRow);
        }

        function pUpdateUI() {
            if(!config.storyPages[pSimIdx]) return;
            const p = config.storyPages[pSimIdx];
            document.getElementById('p-bg-layer').src = p.pageBg || config.globalBg || "";
            let text = p.content || "";
            const avImg = document.getElementById('p-avatar-img'); avImg.style.display = 'none';
            config.avatars.forEach(av => { 
                if(text.includes('§' + av.id)) { 
                    avImg.src = av.url || ""; avImg.style.display = av.url ? 'block' : 'none'; 
                    avImg.style.borderColor = av.color; 
                    text = text.replace(new RegExp('§' + av.id, 'g'), '<span style="color:' + av.color + '">' + av.name + ':<\/span>'); 
                } 
            });
            document.getElementById('p-story-text').innerHTML = text;
            
            const ill = document.getElementById('p-page-illustration');
            if(p.pageImage) { ill.src = p.pageImage; ill.style.display = 'block'; } else { ill.style.display = 'none'; }
            
            const container = document.getElementById('p-button-container'); container.innerHTML = '';
            
            if (p.pageType === 'choice' && p.choices && p.choices.length > 0) {
                p.choices.forEach(c => {
                    const btn = document.createElement('button'); btn.className = "action-btn mb-2"; btn.textContent = c.text;
                    btn.onclick = () => { pSimIdx = parseInt(c.target); pUpdateUI(); }; container.appendChild(btn);
                });
            } else if (p.pageType === 'password') {
                const inp = document.createElement('input'); inp.className = "w-full bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-lg text-center font-bold text-2xl mb-2"; inp.placeholder = "KÓD...";
                container.appendChild(inp);
                const btn = document.createElement('button'); btn.className = "action-btn"; btn.textContent = "NYITÁS";
                btn.onclick = () => { if(inp.value.toLowerCase() === p.password.toLowerCase()) { pSimIdx++; pUpdateUI(); } }; container.appendChild(btn);
            } else if (p.pageType === 'qr') {
                const btn = document.createElement('button'); btn.className = "action-btn"; btn.textContent = "BEOLVASÁS";
                btn.onclick = pStartQR; container.appendChild(btn);
            }
            
            const navRow = document.createElement('div'); navRow.className = "button-row";
            if (pSimIdx > 0 || p.prevIdx) {
                const bBtn = document.createElement('button'); bBtn.className = "action-btn btn-back"; bBtn.textContent = "VISSZA";
                bBtn.onclick = () => { pSimIdx = p.prevIdx ? parseInt(p.prevIdx) : pSimIdx - 1; pUpdateUI(); };
                navRow.appendChild(bBtn);
            }
            if (p.pageType !== 'choice' && p.pageType !== 'password' && p.pageType !== 'qr') {
                const nBtn = document.createElement('button'); nBtn.className = "action-btn"; nBtn.textContent = "TOVÁBB";
                nBtn.onclick = () => { pSimIdx = p.nextIdx ? parseInt(p.nextIdx) : pSimIdx + 1; pUpdateUI(); };
                navRow.appendChild(nBtn);
            }
            if (navRow.hasChildNodes()) container.appendChild(navRow);
            document.getElementById('p-scroll-area').scrollTop = 0;
        }
