<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaland Játék Stúdió V11.0 ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Play', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        /* --- STÚDIÓ SPECIFIKUS STÍLUSOK --- */
        #studio-view { height: 100%; overflow-y: auto; padding: 2.5rem; }
        .glass-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            border-radius: 1rem; 
        }
        .input-style { 
            background: #0f172a; 
            color: #22d3ee; 
            border: 1px solid #334155; 
            border-radius: 0.5rem; 
            padding: 0.6rem; 
            outline: none; 
            transition: 0.2s; 
            width: 100%; 
        }
        .input-style:focus { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.5rem; background: #1e293b; border: 1px solid transparent; transition: 0.2s; }
        .page-item.selected { border-color: #22d3ee; background: #4c1d95; }
        .handle { cursor: grab; padding-right: 15px; color: #64748b; font-size: 0.9rem; }

        .avatar-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 0.75rem;
            display: grid;
            grid-template-columns: 45px 1fr 1fr 40px auto;
            gap: 10px;
            align-items: center;
        }

        /* Mobil Szimulátor a Stúdióban */
        .sim-container { position: sticky; top: 0; width: 320px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 2.5rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        #sim-viewport { position: relative; flex-grow: 1; overflow: hidden; background: #000; }
        #sim-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.35); z-index: 0; transition: opacity 0.5s ease-in-out; }
        #sim-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        .sim-box { position: relative; background: rgba(0,0,0,0.94); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 35px; min-height: 220px; display: flex; flex-direction: column; }
        .sim-avatar { position: absolute; top: -40px; left: 10px; width: 65px; height: 65px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; }
        .sim-btn { flex: 1; background: #8b5cf6; color: white; padding: 12px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .sim-bottom-bar { height: 65px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; }

        /* --- JÁTÉKOS MÓD STÍLUSOK --- */
        #player-view { position: fixed; inset: 0; z-index: 4000; background: #000; display: none; flex-direction: column; }
        .p-game-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        #p-viewport { position: relative; flex-grow: 1; overflow: hidden; }
        #p-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); z-index: 0; transition: src 0.5s ease-in-out, opacity 0.5s; }
        #p-content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
        
        .p-dialog-box { position: relative; background: rgba(0,0,0,0.92); border-top: 3px solid #8b5cf6; border-radius: 1.5rem 1.5rem 0 0; padding: 20px; padding-top: 40px; min-height: 250px; max-height: 70%; display: flex; flex-direction: column; box-shadow: 0 -10px 25px rgba(0,0,0,0.5); }
        .p-avatar-frame { position: absolute; top: -40px; left: 10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #8b5cf6; background: #000; z-index: 20; object-fit: cover; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .p-action-btn { flex: 1; background: #8b5cf6; color: white; padding: 16px; border-radius: 0.75rem; font-weight: 700; text-align: center; font-size: 1rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; border: none; }
        .p-action-btn:active { transform: scale(0.98); background: #a855f7; }
        
        .p-bottom-nav { height: 75px; background: #0f172a; border-top: 1px solid rgba(139, 92, 246, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .p-nav-item { color: #64748b; font-size: 1.5rem; cursor: pointer; border: none; background: transparent; position: relative; transition: color 0.3s; }
        .p-nav-item.active { color: #8b5cf6; }
        .p-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; }
        
        #p-story-text { text-align: justify; hyphens: auto; font-size: 16px; font-weight: 700; line-height: 1.6; margin-bottom: 15px; color: #f8fafc; }
        
        #p-inventory-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 50; display: none; padding: 25px; padding-top: 50px; overflow-y: auto; }
        .p-item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .p-item-card { position: relative; background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 15px; text-align: center; cursor: pointer; }
        .p-item-card img { width: 65px; height: 65px; object-fit: contain; margin: 0 auto 10px; }
        .p-item-unread-dot { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 5px rgba(239, 68, 68, 0.8); }

        #p-qr-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #p-qr-reader { width: 280px; height: 280px; border: 3px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; }
        
        #p-zoom-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; align-items: center; justify-content: center; cursor: pointer; }
        #p-zoom-img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px; }

        /* --- MÓD VÁLTÓ GOMB --- */
        .view-toggle-btn {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 6000;
            background: #8b5cf6;
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #save-indicator { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; font-size: 0.75rem; font-weight: bold; display: none; z-index: 1000; }
    </style>
</head>
<body>
    <div id="save-indicator"><i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...</div>

    <!-- NÉZETVÁLTÓ GOMB -->
    <button id="main-view-toggle" class="view-toggle-btn" onclick="toggleMainView()">
        <span id="toggle-icon"><i class="fa fa-gamepad"></i></span>
        <span id="toggle-text">Játék Mód</span>
    </button>

    <!-- --- STÚDIÓ NÉZET --- -->
    <div id="studio-view">
        <div class="max-w-7xl mx-auto">
            <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                    <h1 class="text-4xl font-bold uppercase tracking-tighter text-white">Stúdió <span class="text-purple-500">V11.0</span> ✨</h1>
                    <p class="text-cyan-400 text-sm mt-1">Interaktív Kaland Szerkesztő</p>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button onclick="downloadLiveHTML()" class="bg-cyan-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-cyan-500 transition-colors">Játék letöltése (.html)</button>
                    <button onclick="downloadConfig()" class="bg-slate-700 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-slate-600 transition-colors">Export game.json</button>
                    <button onclick="document.getElementById('uploadInput').click()" class="bg-purple-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-purple-500 transition-colors">Import</button>
                    <input type="file" id="uploadInput" class="hidden" accept=".json" onchange="handleFileUpload(event)">
                </div>
            </header>

            <div class="flex flex-col lg:flex-row gap-10">
                <div class="flex-1 space-y-8">
                    <!-- GLOBÁLIS BEÁLLÍTÁSOK -->
                    <div class="glass-card p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-4">
                            <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Alapbeállítások</h3>
                            <input type="text" id="appTitle" class="input-style" placeholder="Kaland címe" oninput="autoSave()">
                            <input type="url" id="globalBg" class="input-style" placeholder="Globális Háttér URL" oninput="autoSave()">
                            <input type="url" id="initialMapLink" class="input-style" placeholder="Játék alapértelmezett térkép linkje" oninput="autoSave()">
                        </div>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Avatarok</h3>
                                <button onclick="addAvatar()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ</button>
                            </div>
                            <div id="avatarList" class="space-y-2 max-h-48 overflow-y-auto pr-2"></div>
                        </div>
                    </div>

                    <div class="glass-card p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Történetfolyam</h3>
                            <button onclick="addPage()" class="bg-purple-600 px-4 py-2 rounded-lg text-[10px] font-bold">+ ÚJ OLDAL</button>
                        </div>
                        <div id="pageList" class="max-h-60 overflow-y-auto pr-2 space-y-1"></div>
                    </div>

                    <div id="editorPanel" class="glass-card p-8 space-y-6 hidden">
                        <div class="space-y-4">
                            <input type="url" id="pageImage" class="input-style text-xs" placeholder="Kép URL" oninput="autoSave()">
                            <textarea id="pageText" rows="5" class="input-style text-base" placeholder="Szöveg..." oninput="autoSave()"></textarea>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                            <select id="pageType" class="input-style text-xs" onchange="updateUI(); autoSave();">
                                <option value="story">Leírás</option>
                                <option value="choice">Választás</option>
                                <option value="qr">QR Kód</option>
                                <option value="password">Kódzár</option>
                                <option value="gps">GPS Pont</option>
                            </select>
                            <input type="number" id="prevIdx" class="input-style text-xs" placeholder="Vissza ID" oninput="autoSave()">
                            <input type="number" id="nextIdx" class="input-style text-xs" placeholder="Tovább ID" oninput="autoSave()">
                            <input type="url" id="pageBg" class="input-style text-xs" placeholder="Egyedi háttér" oninput="autoSave()">
                            <input type="text" id="qrCode" class="input-style text-xs" placeholder="QR Kód" oninput="autoSave()">
                        </div>
                        <div id="rewardArea" class="border-t border-slate-700/50 pt-4 space-y-4">
                            <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Jelenet Jutalom</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <input type="text" id="storyItemName" class="input-style text-xs" placeholder="Név" oninput="autoSave()">
                                <input type="text" id="storyItemIcon" class="input-style text-xs" placeholder="Ikon" oninput="autoSave()">
                                <input type="url" id="storyItemUrl" class="input-style text-xs" placeholder="Kép URL" oninput="autoSave()">
                            </div>
                        </div>
                        <div id="passwordArea" class="hidden border-t border-slate-700/50 pt-4">
                            <input type="text" id="correctPass" class="input-style text-sm" placeholder="Helyes megoldás" oninput="autoSave()">
                        </div>
                        <div id="gpsArea" class="hidden border-t border-slate-700/50 pt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                            <input type="number" id="targetLat" step="any" class="input-style text-sm" placeholder="Lat" oninput="autoSave()">
                            <input type="number" id="targetLng" step="any" class="input-style text-sm" placeholder="Lng" oninput="autoSave()">
                            <input type="url" id="mapLink" class="input-style text-sm" placeholder="Térkép Link (pl. Google Maps)" oninput="autoSave()">
                        </div>
                        <div id="choiceArea" class="hidden border-t border-slate-700/50 pt-4">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-purple-400 font-bold uppercase text-[10px] tracking-widest">Opciók</h3>
                                <button onclick="addChoiceItem()" class="text-cyan-400 text-[10px] font-bold">+ ÚJ GOMB</button>
                            </div>
                            <div id="choicesContainer" class="space-y-2"></div>
                        </div>
                    </div>
                </div>

                <!-- MINI SZIMULÁTOR -->
                <div class="w-full lg:w-auto flex justify-center">
                    <div class="sim-container">
                        <div id="sim-viewport">
                            <img id="sim-bg" src="">
                            <div id="sim-content">
                                <div class="sim-box">
                                    <img id="sim-avatar" class="sim-avatar" src="">
                                    <div id="sim-scroll" class="overflow-y-auto pr-1 flex-grow scroll-smooth">
                                        <img id="sim-page-img" class="w-full rounded-lg mb-4 hidden border border-slate-800" src="">
                                        <div id="sim-actual-text"></div>
                                        <div id="sim-gps-info" class="hidden text-center p-2 bg-slate-800 rounded mt-2 text-xs text-cyan-400 font-bold italic border border-cyan-900/50">
                                            <i class="fa fa-location-dot mr-1"></i> Távolság: <span id="sim-distance">...</span>m
                                        </div>
                                    </div>
                                    <div id="sim-actions" class="mt-4"></div>
                                </div>
                            </div>
                        </div>
                        <div class="sim-bottom-bar">
                            <button class="sim-menu-btn active"><i class="fa fa-compass"></i></button>
                            <button class="sim-menu-btn"><i class="fa-solid fa-suitcase"></i></button>
                            <button class="sim-menu-btn" onclick="resetSim()"><i class="fa-solid fa-undo"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- --- JÁTÉKOS NÉZET --- -->
    <div id="player-view">
        <div id="p-qr-layer">
            <div id="p-qr-reader"></div>
            <button id="p-qr-cancel-btn" onclick="pStopQR()" class="p-action-btn mt-6 !w-auto !flex-none px-12">MÉGSE</button>
        </div>

        <div id="p-zoom-viewer" onclick="this.style.display='none'">
            <img id="p-zoom-img" src="">
        </div>

        <div class="p-game-wrapper">
            <div id="p-viewport">
                <img id="p-bg-layer" src="">
                <div id="p-inventory-overlay">
                    <h2 class="text-center text-cyan-400 font-bold mb-8 uppercase tracking-widest">Hátizsák</h2>
                    <div id="p-item-list" class="p-item-grid"></div>
                </div>
                <div id="p-content-layer">
                    <div class="p-dialog-box">
                        <img id="p-avatar-img" class="p-avatar-frame" src="">
                        <div id="p-scroll-area" class="overflow-y-auto pr-1 flex-grow">
                            <img id="p-page-illustration" class="w-full rounded-xl mb-4 hidden border border-slate-800 shadow-xl" src="">
                            <div id="p-story-text"></div>
                            <div id="p-gps-info" class="hidden flex flex-col items-center gap-3 mt-4">
                                <div class="w-full text-center p-3 bg-slate-900/80 rounded-xl text-sm text-cyan-400 font-bold italic border border-cyan-800/50 animate-pulse">
                                    <i class="fa fa-location-dot mr-2"></i> Távolság: <span id="p-distance-val">...</span> méter
                                </div>
                                <a id="p-map-btn" target="_blank" class="hidden w-full bg-cyan-600 hover:bg-cyan-500 text-white p-3 rounded-xl font-bold text-center text-xs uppercase transition-colors shadow-lg shadow-cyan-900/20">
                                    <i class="fa fa-map-location-dot mr-2 text-base"></i> Útvonalterv / Térkép
                                </a>
                            </div>
                        </div>
                        <div id="p-button-container" class="mt-4 flex flex-col gap-3"></div>
                    </div>
                </div>
            </div>
            <div class="p-bottom-nav">
                <button id="p-nav-map" class="p-nav-item active" onclick="pSwitchView('map')">
                    <i class="fa fa-map-marked-alt"></i>
                    <div id="p-map-badge" class="p-badge hidden">!</div>
                </button>
                <button id="p-nav-inv" class="p-nav-item" onclick="pSwitchView('inv')">
                    <i class="fa-solid fa-briefcase"></i>
                    <div id="p-inv-badge" class="p-badge hidden">0</div>
                </button>
                <button class="p-nav-item" onclick="pResetGame()"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="p-nav-item" onclick="pToggleFullscreen()"><i class="fa fa-expand"></i></button>
            </div>
        </div>
    </div>

    <script>
        let config = JSON.parse(localStorage.getItem('KALAND_STUDIO_V11')) || { 
            appTitle: "A Város Legendája", 
            storyPages: [{ content: "Kezdődik a kaland!", pageType: "story" }], 
            avatars: [],
            globalBg: "",
            initialMapLink: ""
        };
        let currentIdx = -1, simIdx = 0, pSimIdx = 0, pInventory = [], saveTimeout, pQrScanner = null, isPlayerMode = false;
        let geoWatchId = null;

        // --- HELYSZÍN SZÁMÍTÁS ---
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Föld sugara méterben
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // --- NÉZETVÁLTÁS ---
        function toggleMainView() {
            isPlayerMode = !isPlayerMode;
            if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
            const studio = document.getElementById('studio-view');
            const player = document.getElementById('player-view');
            const icon = document.getElementById('toggle-icon');
            const text = document.getElementById('toggle-text');

            if (isPlayerMode) {
                studio.style.display = 'none';
                player.style.display = 'flex';
                icon.innerHTML = '<i class="fa fa-tools"></i>';
                text.textContent = 'Stúdió Mód';
                pSimIdx = 0; pInventory = [];
                pUpdateUI();
            } else {
                studio.style.display = 'block';
                player.style.display = 'none';
                icon.innerHTML = '<i class="fa fa-gamepad"></i>';
                text.textContent = 'Játék Mód';
                updateSimulator();
            }
        }

        // --- STÚDIÓ SZIMULÁTOR ---
        function updateSimulator() {
            const p = config.storyPages[simIdx]; if(!p) return;
            document.getElementById('sim-bg').src = p.pageBg || config.globalBg || "";
            let text = p.content || "";
            const avBox = document.getElementById('sim-avatar'); avBox.style.display = 'none';
            config.avatars.forEach(av => { if(text.includes(`§${av.id}`)) { avBox.src = av.url || ""; avBox.style.display = 'block'; avBox.style.borderColor = av.color; text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color};font-weight:700">${av.name}:</span>`); } });
            document.getElementById('sim-actual-text').innerHTML = text;
            const img = document.getElementById('sim-page-img'); if(p.pageImage) { img.src = p.pageImage; img.classList.remove('hidden'); } else { img.classList.add('hidden'); }
            
            // GPS szimuláció
            const gpsInfo = document.getElementById('sim-gps-info');
            if (p.pageType === 'gps') {
                gpsInfo.classList.remove('hidden');
                document.getElementById('sim-distance').textContent = "SIM";
            } else {
                gpsInfo.classList.add('hidden');
            }

            const acts = document.getElementById('sim-actions'); acts.innerHTML = '';
            const navRow = document.createElement('div'); navRow.className = "flex gap-2 w-full";
            
            if (p.pageType === 'choice' && p.choices) {
                const choiceCol = document.createElement('div'); choiceCol.className = "flex flex-col gap-2 w-full mb-2";
                p.choices.forEach(c => {
                    const b = document.createElement('div'); b.className = "sim-btn"; b.textContent = c.text;
                    b.onclick = () => { simIdx = parseInt(c.target); updateSimulator(); };
                    choiceCol.appendChild(b);
                });
                acts.appendChild(choiceCol);
            }

            if(simIdx > 0 || p.prevIdx) {
                const back = document.createElement('div'); back.className = "sim-btn sim-btn-back"; back.innerHTML = '<i class="fa fa-arrow-left"></i>';
                back.onclick = () => { simIdx = p.prevIdx ? parseInt(p.prevIdx) : simIdx - 1; updateSimulator(); };
                navRow.appendChild(back);
            }
            if (p.pageType !== 'choice') {
                const next = document.createElement('div'); next.className = "sim-btn"; next.innerHTML = 'TOVÁBB <i class="fa fa-chevron-right ml-1"></i>';
                next.onclick = () => { simIdx = parseInt(p.nextIdx) || simIdx + 1; updateSimulator(); };
                navRow.appendChild(next);
            }
            acts.appendChild(navRow);
        }

        // --- JÁTÉKOS MÓD LOGIKA ---
        function pUpdateUI() {
            if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
            const p = config.storyPages[pSimIdx]; if(!p) return;
            pHandleReward(p);

            const bg = document.getElementById('p-bg-layer');
            bg.style.opacity = 0;
            setTimeout(() => { bg.src = p.pageBg || config.globalBg || ""; bg.style.opacity = 1; }, 200);

            let text = p.content || "";
            const avImg = document.getElementById('p-avatar-img'); avImg.style.display = 'none';
            config.avatars.forEach(av => {
                if(text.includes(`§${av.id}`)) {
                    avImg.src = av.url || ""; avImg.style.display = av.url ? 'block' : 'none'; avImg.style.borderColor = av.color;
                    text = text.replace(new RegExp(`§${av.id}`, 'g'), `<span style="color:${av.color}">${av.name}:</span>`);
                }
            });
            document.getElementById('p-story-text').innerHTML = text;
            
            const ill = document.getElementById('p-page-illustration');
            if(p.pageImage) { ill.src = p.pageImage; ill.classList.remove('hidden'); } else { ill.classList.add('hidden'); }

            const container = document.getElementById('p-button-container'); container.innerHTML = '';
            const gpsInfo = document.getElementById('p-gps-info');
            const mapBtn = document.getElementById('p-map-btn');
            const mapBadge = document.getElementById('p-map-badge');

            gpsInfo.classList.add('hidden');
            mapBtn.classList.add('hidden');
            mapBadge.classList.add('hidden');

            if (p.pageType === 'qr') {
                pAddBtn("QR BEOLVASÁSA", pStartQR, "fa-camera");
            } else if (p.pageType === 'password') {
                const inp = document.createElement('input'); 
                inp.className = "w-full bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-lg text-center mb-2"; 
                inp.placeholder = "KÓD...";
                pAddBtn("NYITÁS", () => { if(inp.value.trim().toLowerCase() == (p.password||"").toLowerCase()) { pSimIdx = parseInt(p.nextIdx) || pSimIdx + 1; pUpdateUI(); } });
                container.prepend(inp);
            } else if (p.pageType === 'gps') {
                gpsInfo.classList.remove('hidden');
                if (p.mapLink) { 
                    mapBtn.href = p.mapLink; 
                    mapBtn.classList.remove('hidden'); 
                    mapBadge.classList.remove('hidden');
                }
                const distSpan = document.getElementById('p-distance-val');
                distSpan.textContent = "...";
                
                if (navigator.geolocation) {
                    geoWatchId = navigator.geolocation.watchPosition((pos) => {
                        const d = getDistance(pos.coords.latitude, pos.coords.longitude, parseFloat(p.targetLat), parseFloat(p.targetLng));
                        distSpan.textContent = Math.round(d);
                        if (d <= 20) { 
                            navigator.geolocation.clearWatch(geoWatchId);
                            geoWatchId = null;
                            pSimIdx = parseInt(p.nextIdx) || pSimIdx + 1; 
                            pUpdateUI(); 
                        }
                    }, (err) => { distSpan.textContent = "Hiba: engedélyezd a GPS-t!"; }, { enableHighAccuracy: true });
                } else { distSpan.textContent = "Nincs GPS támogatás!"; }

            } else if (p.pageType === 'choice' && p.choices) {
                p.choices.forEach(c => {
                    if (c.req && !pInventory.find(i => i.name.toLowerCase() === c.req.toLowerCase())) return;
                    pAddBtn(c.text, () => { pSimIdx = parseInt(c.target); pUpdateUI(); });
                });
            } else {
                pAddBtn("TOVÁBB", () => { pSimIdx = parseInt(p.nextIdx) || pSimIdx + 1; pUpdateUI(); }, "fa-chevron-right");
            }
            document.getElementById('p-scroll-area').scrollTop = 0;
        }

        function pAddBtn(text, fn, icon = "") {
            const b = document.createElement('button'); b.className = "p-action-btn";
            b.innerHTML = `${text} ${icon ? `<i class="fa ${icon} ml-2 opacity-50"></i>` : ''}`;
            b.onclick = fn; document.getElementById('p-button-container').appendChild(b);
        }

        function pStartQR() {
            if (pQrScanner) return;
            document.getElementById('p-qr-layer').style.display = 'flex';
            pQrScanner = new Html5Qrcode("p-qr-reader");
            pQrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
                const p = config.storyPages[pSimIdx];
                if (decodedText.toUpperCase() === (p.qrCode || "").toUpperCase()) { pStopQR(); pSimIdx = parseInt(p.nextIdx) || pSimIdx + 1; pUpdateUI(); }
            }).catch((err) => { pStopQR(); });
        }

        function pStopQR() {
            if (pQrScanner) {
                try {
                    const state = pQrScanner.getState();
                    if (state === 2 || state === 3) { pQrScanner.stop().finally(() => { document.getElementById('p-qr-layer').style.display = 'none'; pQrScanner = null; }); } 
                    else { document.getElementById('p-qr-layer').style.display = 'none'; pQrScanner = null; }
                } catch (e) { document.getElementById('p-qr-layer').style.display = 'none'; pQrScanner = null; }
            } else { document.getElementById('p-qr-layer').style.display = 'none'; }
        }

        function pHandleReward(p) {
            if(p.storyItemName && !pInventory.find(item => item.name === p.storyItemName)) {
                pInventory.push({ name: p.storyItemName, icon: p.storyItemIcon || '📦', url: p.storyItemUrl || '', seen: false });
                pUpdateBadge();
            }
        }

        function pUpdateBadge() {
            const b = document.getElementById('p-inv-badge');
            const unread = pInventory.filter(i => !i.seen).length;
            b.textContent = unread; b.classList.toggle('hidden', unread === 0);
        }

        function pSwitchView(target) {
            const inv = document.getElementById('p-inventory-overlay');
            const navInv = document.getElementById('p-nav-inv');
            const navMap = document.getElementById('p-nav-map');
            const p = config.storyPages[pSimIdx];

            if (target === 'inv') {
                if (inv.style.display === 'block') { inv.style.display = 'none'; navInv.classList.remove('active'); navMap.classList.add('active'); }
                else { pRenderInventory(); inv.style.display = 'block'; navInv.classList.add('active'); navMap.classList.remove('active'); }
            } else if (target === 'map') {
                // Ha van térkép link a jelenlegi GPS oldalon, nyissa meg azt.
                // Ha nincs, de van globális link, nyissa meg azt.
                if (p && p.pageType === 'gps' && p.mapLink) {
                    window.open(p.mapLink, '_blank');
                    document.getElementById('p-map-badge').classList.add('hidden');
                } else if (config.initialMapLink) {
                    window.open(config.initialMapLink, '_blank');
                } else {
                    inv.style.display = 'none'; 
                    navInv.classList.remove('active'); 
                    navMap.classList.add('active');
                }
            }
        }

        function pRenderInventory() {
            const list = document.getElementById('p-item-list'); list.innerHTML = '';
            pInventory.forEach(item => {
                const d = document.createElement('div'); d.className = "p-item-card";
                let content = item.url ? `<img src="${item.url}"><div class="text-[10px] font-bold text-white uppercase">${item.name}</div>` : `<div class="text-4xl mb-2">${item.icon}</div><div class="text-[10px] font-bold text-white uppercase">${item.name}</div>`;
                if (!item.seen) content += `<div class="p-item-unread-dot"></div>`;
                d.innerHTML = content;
                d.onclick = () => {
                    if(item.url) { document.getElementById('p-zoom-img').src = item.url; document.getElementById('p-zoom-viewer').style.display = 'flex'; }
                    item.seen = true; pUpdateBadge(); pRenderInventory();
                };
                list.appendChild(d);
            });
        }

        function pToggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
        function pResetGame() { if(confirm("Újrakezded?")) { pSimIdx = 0; pInventory = []; pUpdateBadge(); pSwitchView('map'); pUpdateUI(); } }

        // --- ADMIN FUNKCIÓK ---
        function loadPage(i) { 
            currentIdx = i; const p = config.storyPages[i]; if(!p) return;
            document.getElementById('editorPanel').classList.remove('hidden'); 
            document.getElementById('pageText').value = p.content || ""; 
            document.getElementById('pageType').value = p.pageType || 'story'; 
            document.getElementById('nextIdx').value = (p.nextIdx !== undefined) ? p.nextIdx : ""; 
            document.getElementById('prevIdx').value = (p.prevIdx !== undefined) ? p.prevIdx : ""; 
            document.getElementById('pageBg').value = p.pageBg || ""; 
            document.getElementById('qrCode').value = p.qrCode || ""; 
            document.getElementById('correctPass').value = p.password || ""; 
            document.getElementById('targetLat').value = p.targetLat || ""; 
            document.getElementById('targetLng').value = p.targetLng || "";

            document.getElementById('storyItemUrl').value = p.storyItemUrl || ""; 
            document.getElementById('pageImage').value = p.pageImage || "";

            clearTimeout(saveTimeout); document.getElementById('save-indicator').style.display = 'block'; 
            saveTimeout = setTimeout(() => { 
                const p = config.storyPages[currentIdx]; 
                if(p) { 
                    p.content = document.getElementById('pageText').value;

                    p.prevIdx = document.getElementById('prevIdx').value;

            const l = document.getElementById('pageList'); l.innerHTML = '';

        function duplicatePage(i) { config.storyPages.splice(i+1, 0, JSON.parse(JSON.stringify(config.storyPages[i]))); renderPageList(); autoSave(); }
        function deletePage(i) { if(confirm("Törlés?")) { config.storyPages.splice(i,1); currentIdx=-1; document.getElementById('editorPanel').classList.add('hidden'); renderPageList(); autoSave(); } }

    <script>
        let config = null, simIdx = 0, inventory = [], qrScanner = null, geoId = null;
        async function loadGame() {
            try {
                const response = await fetch('game.json');
                if (!response.ok) throw new Error();
                config = await response.json();
                initGame();
                document.getElementById('loading').style.display = 'none';
            } catch (err) {
                document.getElementById('loading-text').classList.add('hidden');
                document.getElementById('manual-loader').classList.remove('hidden');

        }
        function handleManualLoad(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => { config = JSON.parse(ev.target.result); initGame(); document.getElementById('loading').style.display = 'none'; };
            reader.readAsText(file);
        }
        function initGame() { document.title = config.appTitle || "Kaland Játék"; simIdx = 0; inventory = []; updateUI(); }
        function getD(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180; const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180; const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }
        function updateUI() {
            if(geoId) navigator.geolocation.clearWatch(geoId);
            const p = config.storyPages[simIdx]; if(!p) return;
            handleReward(p);
            document.getElementById('bg-layer').style.opacity = 0;
            setTimeout(() => { document.getElementById('bg-layer').src = p.pageBg || config.globalBg || ""; document.getElementById('bg-layer').style.opacity = 1; }, 200);
            let text = p.content || "";
            const avImg = document.getElementById('avatar-img'); avImg.style.display = 'none';
            config.avatars.forEach(av => { if(text.includes('§'+av.id)) { avImg.src = av.url || ""; avImg.style.display = av.url ? 'block' : 'none'; avImg.style.borderColor = av.color; text = text.replace(new RegExp('§'+av.id, 'g'), '<span style="color:'+av.color+'">'+av.name+':<\/span>'); } });
            document.getElementById('story-text').innerHTML = text;
            const ill = document.getElementById('page-illustration'); if(p.pageImage) { ill.src = p.pageImage; ill.classList.remove('hidden'); } else { ill.classList.add('hidden'); }
            const container = document.getElementById('button-container'); container.innerHTML = '';
            const status = document.getElementById('gps-status'); status.classList.add('hidden');
            const extMap = document.getElementById('ext-map-btn'); extMap.classList.add('hidden');
            const mapBadge = document.getElementById('map-badge'); mapBadge.classList.add('hidden');
            
            if (p.pageType === 'qr') { addBtn("QR BEOLVASÁSA", startQR, "fa-camera"); }
            else if(p.pageType === 'password') {
                const inp = document.createElement('input'); inp.className = "w-full bg-slate-900 border border-slate-700 text-cyan-400 p-4 rounded-lg text-center mb-2"; inp.placeholder = "KÓD...";
                addBtn("NYITÁS", () => { if(inp.value.trim().toLowerCase() == (p.password||"").toLowerCase()) { simIdx = parseInt(p.nextIdx) || simIdx + 1; updateUI(); } });
                container.prepend(inp);
            } else if(p.pageType === 'gps') {
                status.classList.remove('hidden');
                if (p.mapLink) { 
                    extMap.href = p.mapLink; 
                    extMap.classList.remove('hidden'); 
                    mapBadge.classList.remove('hidden');
                }
                geoId = navigator.geolocation.watchPosition((pos) => {
                    const d = getD(pos.coords.latitude, pos.coords.longitude, parseFloat(p.targetLat), parseFloat(p.targetLng));
                    document.getElementById('dist-val').textContent = Math.round(d);
                    if(d <= 20) { navigator.geolocation.clearWatch(geoId); geoId = null; simIdx = parseInt(p.nextIdx) || simIdx + 1; updateUI(); }
                }, null, {enableHighAccuracy:true});
            } else if(p.pageType === 'choice' && p.choices) {
                p.choices.forEach(c => { if (c.req && !inventory.find(i => i.name.toLowerCase() === c.req.toLowerCase())) return; addBtn(c.text, () => { simIdx = parseInt(c.target); updateUI(); }); });
            } else { addBtn("TOVÁBB", () => { simIdx = parseInt(p.nextIdx) || simIdx + 1; updateUI(); }, "fa-chevron-right"); }
            document.getElementById('scroll-area').scrollTop = 0;
        }
        function addBtn(text, fn, icon = "") {
            const b = document.createElement('button'); b.className = "action-btn";
            b.innerHTML = text + (icon ? ' <i class="fa '+icon+' ml-2 opacity-50"><\/i>' : '');
            b.onclick = fn; document.getElementById('button-container').appendChild(b);
        }
        function startQR() {
            document.getElementById('qr-layer').style.display = 'flex';
            qrScanner = new Html5Qrcode("qr-reader");
            qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
                const p = config.storyPages[simIdx];
                if (decodedText.toUpperCase() === (p.qrCode || "").toUpperCase()) { stopQR(); simIdx = parseInt(p.nextIdx) || simIdx + 1; updateUI(); }
            }).catch(() => { stopQR(); });
        }
        function stopQR() { if (qrScanner) { try { const state = qrScanner.getState(); if (state === 2 || state === 3) { qrScanner.stop().finally(() => { document.getElementById('qr-layer').style.display = 'none'; qrScanner = null; }); } else { document.getElementById('qr-layer').style.display = 'none'; qrScanner = null; } } catch (e) { document.getElementById('qr-layer').style.display = 'none'; qrScanner = null; } } else { document.getElementById('qr-layer').style.display = 'none'; } }
        function handleReward(p) { if(p.storyItemName && !inventory.find(item => item.name === p.storyItemName)) { inventory.push({ name: p.storyItemName, icon: p.storyItemIcon || '📦', url: p.storyItemUrl || '', seen: false }); updateBadge(); } }
        function updateBadge() { const b = document.getElementById('inv-badge'); const unread = inventory.filter(i => !i.seen).length; b.textContent = unread; b.classList.toggle('hidden', unread === 0); }
        function switchView(target) {
            const inv = document.getElementById('inventory-overlay');
            const p = config.storyPages[simIdx];
            if (target === 'inv') {
                if (inv.style.display === 'block') { inv.style.display = 'none'; document.getElementById('nav-inv').classList.remove('active'); }
                else { renderInventory(); inv.style.display = 'block'; document.getElementById('nav-inv').classList.add('active'); }
            } else if (target === 'map') {
                if (p && p.pageType === 'gps' && p.mapLink) {
                    window.open(p.mapLink, '_blank');
                    document.getElementById('map-badge').classList.add('hidden');
                } else if (config.initialMapLink) {
                    window.open(config.initialMapLink, '_blank');
                } else {
                    inv.style.display = 'none'; 
                    document.getElementById('nav-inv').classList.remove('active');
                }
            }
        }
        function renderInventory() {
            const list = document.getElementById('item-list'); list.innerHTML = '';
            inventory.forEach(item => {
                const d = document.createElement('div'); d.className = "item-card";
                let content = item.url ? '<img src="'+item.url+'"><div class="text-[10px] font-bold text-white uppercase">'+item.name+'<\/div>' : '<div class="text-4xl mb-2">'+item.icon+'<\/div><div class="text-[10px] font-bold text-white uppercase">'+item.name+'<\/div>';
                if (!item.seen) content += '<div class="item-unread-dot"><\/div>';
                d.innerHTML = content;
                d.onclick = () => { if(item.url) { document.getElementById('zoom-img').src = item.url; document.getElementById('zoom-viewer').style.display = 'flex'; } item.seen = true; updateBadge(); renderInventory(); };
                list.appendChild(d);
            });
        }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
        function resetGame() { if(confirm("Újrakezded?")) { simIdx = 0; inventory = []; updateBadge(); switchView('map'); updateUI(); } }
        window.onload = loadGame;
    <\/script>
<\/body>
<\/html>`;

        window.onload = () => { 
            if(document.getElementById('appTitle')) document.getElementById('appTitle').value = config.appTitle || ""; 
            if(document.getElementById('globalBg')) document.getElementById('globalBg').value = config.globalBg || ""; 
            if(document.getElementById('initialMapLink')) document.getElementById('initialMapLink').value = config.initialMapLink || ""; 
            
            const el = document.getElementById('pageList');
            Sortable.create(el, {
                handle: '.handle',
                animation: 150,
                onEnd: function() {
                    const items = Array.from(el.children);
                    const oldPages = [...config.storyPages];
                    const currentObj = currentIdx !== -1 ? oldPages[currentIdx] : null;
                    const pointers = oldPages.map(p => ({
                        next: (p.nextIdx !== "" && p.nextIdx !== undefined) ? oldPages[parseInt(p.nextIdx)] : null,
                        prev: (p.prevIdx !== "" && p.prevIdx !== undefined) ? oldPages[parseInt(p.prevIdx)] : null,
                        choices: p.choices ? p.choices.map(c => oldPages[parseInt(c.target)]) : []
                    }));
                    const newPages = items.map(item => oldPages[parseInt(item.getAttribute('data-id'))]);
                    newPages.forEach((page) => {
                        const originalIdx = oldPages.indexOf(page);
                        const pData = pointers[originalIdx];
                        if (pData.next) page.nextIdx = newPages.indexOf(pData.next);
                        if (pData.prev) page.prevIdx = newPages.indexOf(pData.prev);
                        if (page.choices && pData.choices) {
                            page.choices.forEach((c, ci) => {
                                if (pData.choices[ci]) c.target = newPages.indexOf(pData.choices[ci]);
                            });
                        }
                    });
                    config.storyPages = newPages;
                    if (currentObj) currentIdx = newPages.indexOf(currentObj);
                    autoSave();
                    renderPageList(); 
                    if (currentIdx !== -1) loadPage(currentIdx);
                }
            });
            renderPageList(); renderAvatarAdmin(); if(config.storyPages.length > 0) loadPage(0); 
        };
    </script>
