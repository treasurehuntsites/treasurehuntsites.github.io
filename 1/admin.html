<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title>Játék Konfiguráció V3.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: #e0e0e0; }
        .card { background-color: #2c2c2c; border: 2px solid #8a2be2; box-shadow: 0 0 20px rgba(138, 43, 226, 0.4); }
        .input-style { background-color: #3f3f46; color: #00ffff; border: 1px solid #6b7280; }
        .btn-primary { background-color: #8a2be2; color: white; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #7b1cd1; }
        .btn-secondary { background-color: #00ffff; color: #1a1a1a; font-weight: bold; transition: background-color 0.2s; }
        .btn-secondary:hover { background-color: #00ddee; }
        .btn-danger { background-color: #dc3545; color: white; transition: background-color 0.2s; }
        .btn-danger:hover { background-color: #c82333; }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 6px; border-radius: 8px; background-color: #3f3f46; cursor: grab; border: 1px solid transparent; transition: all 0.2s; }
        .page-item:hover { background-color: #4b5563; }
        .page-item.selected { background-color: #8a2be2; border-color: #00ffff; }
        .handle { cursor: grab; padding-right: 15px; color: #6b7280; }
        .scrollbar-custom::-webkit-scrollbar { width: 8px; }
        .scrollbar-custom::-webkit-scrollbar-track { background: #1f2937; }
        .scrollbar-custom::-webkit-scrollbar-thumb { background: #8a2be2; border-radius: 4px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-6xl mx-auto space-y-8">
        <header class="text-center">
            <h1 class="text-4xl font-bold text-white tracking-tight uppercase">Konfiguráció <span class="text-purple-500">V3.9</span></h1>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <section class="card p-6 rounded-xl space-y-4">
                    <h2 class="text-xl font-semibold text-white border-b border-gray-700 pb-2 flex items-center"><i class="fa fa-cog mr-2 text-purple-500"></i> Alapok</h2>
                    <input type="text" id="appTitle" class="input-style w-full p-3 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none" placeholder="Játék címe">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="color" id="bgColor" class="input-style w-full h-12 rounded-lg cursor-pointer">
                        <input type="color" id="textColor" class="input-style w-full h-12 rounded-lg cursor-pointer">
                    </div>
                </section>

                <section class="card p-6 rounded-xl space-y-4">
                    <h2 class="text-xl font-semibold text-white border-b border-gray-700 pb-2 flex items-center"><i class="fa fa-users mr-2 text-purple-500"></i> Avatarok</h2>
                    <input type="url" id="annaAvatarUrl" class="input-style w-full p-2 rounded-lg text-xs" placeholder="Anna Avatar Link">
                    <input type="url" id="markAvatarUrl" class="input-style w-full p-2 rounded-lg text-xs" placeholder="Márk Avatar Link">
                </section>

                <section class="card p-6 rounded-xl space-y-4">
                    <h2 class="text-xl font-semibold text-white border-b border-gray-700 pb-2 flex items-center"><i class="fa fa-bars mr-2 text-purple-500"></i> Alsó Menü</h2>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="showMapIcon" checked> <label class="text-sm text-gray-300">Térkép ikon megjelenítése</label>
                    </div>
                    <input type="url" id="mapUrl" class="input-style w-full p-2 text-xs rounded-lg" placeholder="Google Maps URL">
                </section>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <section id="editorSection" class="card p-6 rounded-xl space-y-6 hidden">
                    <h2 id="editingTitle" class="text-2xl font-bold text-cyan-400">Oldal Szerkesztése</h2>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Történet Szövege</label>
                        <textarea id="pageText" rows="6" class="input-style w-full p-3 rounded-lg outline-none" placeholder="§A, §M, §R használható"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="text-xs text-gray-400 italic">Vissza Index</label>
                            <input type="number" id="prevIndex" class="input-style w-full p-3 rounded-lg">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 italic">Tovább Index</label>
                            <input type="number" id="nextIndex" class="input-style w-full p-3 rounded-lg">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 italic">Átirányítás URL</label>
                            <input type="url" id="pageRedirectUrl" class="input-style w-full p-3 rounded-lg" placeholder="https://...">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Oldal típusa</label>
                        <select id="pageType" class="input-style w-full p-3 rounded-lg" onchange="updateUIForType()">
                            <option value="story">Normál történet</option>
                            <option value="choice">Választás (Gombok)</option>
                            <option value="password">Jelszó</option>
                            <option value="gps">GPS Kapu</option>
                        </select>
                    </div>

                    <div id="passwordContainer" class="hidden space-y-4 p-4 bg-gray-800/50 rounded-lg border border-purple-500">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="pagePassword" class="input-style w-full p-2 rounded" placeholder="Helyes Jelszó">
                            <input type="text" id="passwordBtnText" class="input-style w-full p-2 rounded" placeholder="Gomb felirata">
                        </div>
                        <input type="text" id="passwordHint" class="input-style w-full p-2 rounded" placeholder="Segítség (Hint)">
                    </div>

                    <div id="gpsContainer" class="hidden space-y-4 p-4 bg-gray-800/50 rounded-lg border border-cyan-500">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="targetLat" class="input-style p-2 rounded" placeholder="Lat (Szélesség)">
                            <input type="text" id="targetLon" class="input-style p-2 rounded" placeholder="Lon (Hosszúság)">
                        </div>
                        <input type="url" id="pageMapUrl" class="input-style w-full p-2 rounded" placeholder="Egyedi Térkép Link">
                    </div>

                    <div id="choiceContainer" class="hidden space-y-3">
                        <div id="choicesList" class="space-y-2"></div>
                        <button onclick="addChoiceRow()" class="text-cyan-400 text-xs">+ Új gomb hozzáadása</button>
                    </div>

                    <div class="pt-4 flex justify-between">
                        <button id="deleteBtn" class="bg-red-600 px-6 py-2 rounded-lg font-bold">Törlés</button>
                        <button id="savePageBtn" class="btn-primary px-10 py-2 rounded-lg font-bold text-lg">Mentés</button>
                    </div>
                </section>

                <section class="card p-4 rounded-xl">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-white">Oldalak (Átrendezhető)</h2>
                        <button id="previewBtn" class="btn-secondary px-4 py-2 rounded-lg text-sm flex items-center gap-2"><i class="fa fa-eye"></i> Előnézet</button>
                    </div>
                    <div id="pageList" class="space-y-1 max-h-80 overflow-y-auto scrollbar-custom pr-2"></div>
                    <button id="addPageBtn" class="btn-primary w-full p-3 mt-4 rounded-lg font-bold">+ Új Oldal</button>
                </section>
            </div>
        </div>
        <button id="downloadBtn" class="btn-secondary w-full p-4 rounded-xl text-lg"><i class="fa fa-download mr-2"></i> Konfiguráció Letöltése (.json)</button>
    </div>

    <script>
        const STORAGE_KEY = 'DYNAMIC_CONFIG';
        let config = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { appTitle: "Játék", bgColor: "#1a1a1a", textColor: "#e0e0e0", annaAvatarUrl: "", markAvatarUrl: "", showMapIcon: true, mapUrl: "", storyPages: [] };
        let currentIdx = -1;
        let sortable;

        function updateUIForType() {
            const type = document.getElementById('pageType').value;
            document.getElementById('passwordContainer').classList.toggle('hidden', type !== 'password');
            document.getElementById('gpsContainer').classList.toggle('hidden', type !== 'gps');
            document.getElementById('choiceContainer').classList.toggle('hidden', type !== 'choice');
        }

        function addChoiceRow(data = {text: '', target: '', url: ''}) {
            const div = document.createElement('div');
            div.className = "flex flex-col gap-2 bg-gray-700 p-3 rounded-lg border border-gray-600";
            div.innerHTML = `
                <input type="text" placeholder="Gomb szövege" class="c-text input-style w-full p-2 text-xs rounded" value="${data.text}">
                <div class="flex gap-2">
                    <input type="number" placeholder="Cél Index" class="c-target input-style flex-1 p-2 text-xs rounded" value="${data.target}">
                    <input type="url" placeholder="Külső Link" class="c-url input-style flex-1 p-2 text-xs rounded" value="${data.url}">
                    <button onclick="this.parentElement.parentElement.remove()" class="text-red-500 p-1"><i class="fa fa-trash"></i></button>
                </div>`;
            document.getElementById('choicesList').appendChild(div);
        }

        function renderList() {
            const list = document.getElementById('pageList');
            list.innerHTML = '';
            config.storyPages.forEach((p, i) => {
                const item = document.createElement('div');
                item.className = `page-item ${i === currentIdx ? 'selected' : ''}`;
                item.innerHTML = `<span><i class="fa fa-bars handle mr-3"></i>#${i}: ${p.content.substring(0, 35)}...</span>`;
                item.onclick = (e) => { if(!e.target.classList.contains('handle')) loadPage(i); };
                list.appendChild(item);
            });
            if(sortable) sortable.destroy();
            sortable = new Sortable(list, {
                animation: 150, handle: '.handle',
                onEnd: (evt) => {
                    const moved = config.storyPages.splice(evt.oldIndex, 1)[0];
                    config.storyPages.splice(evt.newIndex, 0, moved);
                    saveToLocal(false);
                    renderList();
                }
            });
        }

        function loadPage(i) {
            currentIdx = i;
            const p = config.storyPages[i];
            document.getElementById('editorSection').classList.remove('hidden');
            document.getElementById('pageText').value = p.content || "";
            document.getElementById('prevIndex').value = p.prevIndex ?? "";
            document.getElementById('nextIndex').value = p.nextIndex ?? "";
            document.getElementById('pageRedirectUrl').value = p.redirectUrl || "";
            document.getElementById('pageType').value = p.pageType || "story";
            document.getElementById('pagePassword').value = p.pagePassword || "";
            document.getElementById('passwordBtnText').value = p.passwordBtnText || "";
            document.getElementById('passwordHint').value = p.passwordHint || "";
            document.getElementById('targetLat').value = p.targetLat || "";
            document.getElementById('targetLon').value = p.targetLon || "";
            document.getElementById('pageMapUrl').value = p.pageMapUrl || "";
            document.getElementById('choicesList').innerHTML = '';
            if(p.choices) p.choices.forEach(c => addChoiceRow(c));
            updateUIForType();
            renderList();
        }

        function saveToLocal(msg = true) {
            if(currentIdx !== -1) {
                const p = config.storyPages[currentIdx];
                p.content = document.getElementById('pageText').value;
                p.prevIndex = document.getElementById('prevIndex').value !== "" ? parseInt(document.getElementById('prevIndex').value) : undefined;
                p.nextIndex = document.getElementById('nextIndex').value !== "" ? parseInt(document.getElementById('nextIndex').value) : undefined;
                p.redirectUrl = document.getElementById('pageRedirectUrl').value;
                p.pageType = document.getElementById('pageType').value;
                p.pagePassword = document.getElementById('pagePassword').value;
                p.passwordBtnText = document.getElementById('passwordBtnText').value;
                p.passwordHint = document.getElementById('passwordHint').value;
                p.targetLat = document.getElementById('targetLat').value;
                p.targetLon = document.getElementById('targetLon').value;
                p.pageMapUrl = document.getElementById('pageMapUrl').value;
                p.choices = Array.from(document.getElementById('choicesList').children).map(c => ({
                    text: c.querySelector('.c-text').value,
                    target: c.querySelector('.c-target').value,
                    url: c.querySelector('.c-url').value
                }));
            }
            config.appTitle = document.getElementById('appTitle').value;
            config.bgColor = document.getElementById('bgColor').value;
            config.textColor = document.getElementById('textColor').value;
            config.annaAvatarUrl = document.getElementById('annaAvatarUrl').value;
            config.markAvatarUrl = document.getElementById('markAvatarUrl').value;
            config.showMapIcon = document.getElementById('showMapIcon').checked;
            config.mapUrl = document.getElementById('mapUrl').value;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
            if(msg) alert("Mentve!");
            renderList();
        }

        document.getElementById('savePageBtn').onclick = () => saveToLocal();
        document.getElementById('addPageBtn').onclick = () => { config.storyPages.push({content: "Új oldal...", pageType: "story"}); loadPage(config.storyPages.length-1); };
        document.getElementById('previewBtn').onclick = () => { saveToLocal(false); window.open('preview.html', '_blank'); };
        document.getElementById('deleteBtn').onclick = () => { if(confirm("Törlöd?")) { config.storyPages.splice(currentIdx,1); currentIdx=-1; document.getElementById('editorSection').classList.add('hidden'); saveToLocal(false); } };
        document.getElementById('downloadBtn').onclick = () => { saveToLocal(false); const blob = new Blob([localStorage.getItem(STORAGE_KEY)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'game_config.json'; a.click(); };

        document.getElementById('appTitle').value = config.appTitle;
        document.getElementById('bgColor').value = config.bgColor;
        document.getElementById('textColor').value = config.textColor;
        document.getElementById('annaAvatarUrl').value = config.annaAvatarUrl;
        document.getElementById('markAvatarUrl').value = config.markAvatarUrl;
        document.getElementById('showMapIcon').checked = config.showMapIcon;
        document.getElementById('mapUrl').value = config.mapUrl;
        renderList();
    </script>
</body>
</html>
