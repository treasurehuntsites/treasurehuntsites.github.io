<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title>Játék Konfiguráció V5.5 - Egyedi Modális Törlés</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: #ffffff; }
        .card { background-color: #2c2c2c; border: 2px solid #8a2be2; box-shadow: 0 0 20px rgba(138, 43, 226, 0.3); }
        .input-style { background-color: #3f3f46; color: #00ffff; border: 1px solid #6b7280; outline: none; }
        .input-style:focus { border-color: #00ffff; }
        .btn-primary { background-color: #8a2be2; color: white; transition: 0.2s; }
        .btn-secondary { background-color: #00ffff; color: #1a1a1a; font-weight: bold; }
        .page-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 6px; border-radius: 8px; background-color: #3f3f46; border: 1px solid transparent; transition: 0.2s; }
        .page-item:hover { background-color: #44444f; }
        .page-item.selected { border-color: #00ffff; background-color: #4c1d95; }
        .handle { cursor: grab; padding-right: 15px; color: #6b7280; }
        
        #save-indicator { position: fixed; bottom: 20px; right: 20px; background: #10b981; color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.85rem; font-weight: bold; display: none; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        
        .delete-btn-inline { color: #f87171; padding: 8px; border-radius: 6px; transition: 0.2s; cursor: pointer; }
        .delete-btn-inline:hover { background-color: rgba(248, 113, 113, 0.2); color: #ef4444; }

        #custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-box { background: #2c2c2c; border: 2px solid #ef4444; padding: 2rem; border-radius: 1rem; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 0 30px rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen pb-20">
    <div id="save-indicator"><i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...</div>

    <div id="custom-modal">
        <div class="modal-box">
            <i class="fa fa-exclamation-triangle text-red-500 text-4xl mb-4"></i>
            <h3 class="text-xl font-bold mb-2">Törlés megerősítése</h3>
            <p class="text-gray-400 mb-6 text-sm">Biztosan törölni akarod ezt az oldalt? Ezt a műveletet nem lehet visszavonni.</p>
            <div class="flex gap-4">
                <button id="modal-cancel" class="flex-1 bg-gray-600 p-3 rounded-lg font-bold hover:bg-gray-500 transition-colors">MÉGSE</button>
                <button id="modal-confirm" class="flex-1 bg-red-600 p-3 rounded-lg font-bold hover:bg-red-500 transition-colors uppercase">Törlés</button>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto space-y-8">
        <header class="text-center">
            <h1 class="text-4xl font-bold text-white uppercase tracking-widest">Konfiguráció <span class="text-purple-500">V5.5</span></h1>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <section class="card p-6 rounded-xl space-y-4">
                    <h2 class="text-xl font-semibold text-white border-b border-gray-700 pb-2 flex items-center"><i class="fa fa-sliders mr-2 text-purple-400"></i> Alapbeállítások</h2>
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold">Játék címe</label>
                        <input type="text" id="appTitle" class="input-style w-full p-2 rounded mt-1" placeholder="Cím" oninput="autoSave()">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold">Globális Háttérkép</label>
                        <input type="url" id="globalBgUrl" class="input-style w-full p-2 rounded text-xs mt-1" placeholder="URL" oninput="autoSave()">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-gray-400 uppercase font-bold">Háttérszín</label>
                            <input type="color" id="bgColor" class="input-style w-full h-10 rounded mt-1" oninput="autoSave()">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 uppercase font-bold">Szövegszín</label>
                            <input type="color" id="textColor" class="input-style w-full h-10 rounded mt-1" oninput="autoSave()">
                        </div>
                    </div>
                </section>

                <section class="card p-6 rounded-xl space-y-4">
                    <h2 class="text-xl font-semibold text-white border-b border-gray-700 pb-2 flex items-center"><i class="fa fa-map mr-2 text-purple-400"></i> Navigáció</h2>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="showMapIcon" onchange="autoSave()"> <label class="text-sm">Térkép ikon megjelenítése</label>
                    </div>
                    <input type="url" id="mapUrl" class="input-style w-full p-2 text-xs rounded" placeholder="Google Maps Link" oninput="autoSave()">
                </section>
                
                <section class="card p-6 rounded-xl space-y-4">
                    <h2 class="text-xl font-semibold text-white border-b border-gray-700 pb-2 flex items-center"><i class="fa fa-user-circle mr-2 text-purple-400"></i> Karakterek</h2>
                    <input type="url" id="annaAvatarUrl" class="input-style w-full p-2 text-xs rounded" placeholder="Anna Avatar URL" oninput="autoSave()">
                    <input type="url" id="markAvatarUrl" class="input-style w-full p-2 text-xs rounded" placeholder="Márk Avatar URL" oninput="autoSave()">
                </section>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <section class="card p-4 rounded-xl">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-white">Történetfolyam</h2>
                        <button id="previewBtn" class="btn-secondary px-6 py-2 rounded text-xs uppercase tracking-widest">Előnézet</button>
                    </div>
                    <div id="pageList" class="space-y-1 max-h-72 overflow-y-auto pr-2"></div>
                    <button id="addPageBtn" class="btn-primary w-full p-3 mt-4 rounded-lg font-bold uppercase tracking-widest">+ Új Oldal Hozzáadása</button>
                </section>

                <section id="editorSection" class="card p-6 rounded-xl space-y-6 hidden relative transition-all">
                    <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                        <h2 class="text-2xl font-bold text-cyan-400 uppercase">Tartalom Szerkesztése</h2>
                    </div>
                    
                    <textarea id="pageText" rows="6" class="input-style w-full p-3 rounded-lg outline-none font-sans text-sm" placeholder="Írd ide a történetet..." oninput="autoSave()"></textarea>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="text-[10px] text-gray-400 uppercase font-bold">Vissza gomb célja</label>
                            <input type="number" id="prevIndex" class="input-style w-full p-2 rounded text-sm" placeholder="Index #" oninput="autoSave()">
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-400 uppercase font-bold">Tovább cél (Idx / URL)</label>
                            <input type="number" id="nextIndex" class="input-style w-full p-2 rounded text-sm" placeholder="Index #" oninput="autoSave()">
                            <input type="url" id="pageRedirectUrl" class="input-style w-full p-2 rounded mt-2 text-xs" placeholder="Külső URL" oninput="autoSave()">
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-400 uppercase font-bold">Egyedi Háttérkép</label>
                            <input type="url" id="pageBgUrl" class="input-style w-full p-2 rounded text-xs" placeholder="Kép URL" oninput="autoSave()">
                        </div>
                    </div>

                    <select id="pageType" class="input-style w-full p-3 rounded-lg text-sm" onchange="updateUI(); autoSave();">
                        <option value="story">Normál történet</option>
                        <option value="choice">Választási lehetőségek</option>
                        <option value="password">Kód / Jelszó kérő oldal</option>
                        <option value="gps">GPS Kapu (Pozíció alapú)</option>
                    </select>

                    <div id="passwordSection" class="hidden space-y-3 p-4 bg-[#111] rounded-lg border border-purple-900">
                        <input type="text" id="pagePassword" class="input-style w-full p-2 rounded text-sm" placeholder="Helyes megoldás" oninput="autoSave()">
                        <input type="text" id="passwordBtnText" class="input-style w-full p-2 rounded text-sm" placeholder="Gomb felirata" oninput="autoSave()">
                        <textarea id="passwordHints" rows="3" class="input-style w-full p-2 rounded text-xs" placeholder="Segítségek (soronként egy tipp)" oninput="autoSave()"></textarea>
                    </div>

                    <div id="gpsSection" class="hidden space-y-3 p-4 bg-[#111] rounded-lg border border-cyan-900">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="targetLat" class="input-style p-2 rounded text-xs" placeholder="Lat" oninput="autoSave()">
                            <input type="text" id="targetLon" class="input-style p-2 rounded text-xs" placeholder="Lon" oninput="autoSave()">
                        </div>
                    </div>

                    <div id="choiceSection" class="hidden space-y-2">
                        <div id="choicesList" class="space-y-2"></div>
                        <button onclick="addChoice()" class="text-cyan-400 text-xs font-bold uppercase hover:underline">+ Opció hozzáadása</button>
                    </div>
                </section>
            </div>
        </div>
        
        <button id="downloadBtn" class="btn-secondary w-full p-5 rounded-xl text-lg uppercase shadow-xl mt-4 tracking-widest">
            <i class="fa fa-download mr-3"></i> Konfiguráció letöltése
        </button>
    </div>

    <script>
        const STORAGE_KEY = 'DYNAMIC_CONFIG';
        let config = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { 
            appTitle: "Kaland", storyPages: [], textColor: "#ffffff", bgColor: "#1a1a1a" 
        };
        let currentIdx = -1;
        let saveTimeout;
        let sortable;
        let pageIdxToDelete = -1;

        const modal = document.getElementById('custom-modal');
        const modalConfirm = document.getElementById('modal-confirm');
        const modalCancel = document.getElementById('modal-cancel');

        function updateUI() {
            const type = document.getElementById('pageType').value;
            document.getElementById('passwordSection').classList.toggle('hidden', type !== 'password');
            document.getElementById('gpsSection').classList.toggle('hidden', type !== 'gps');
            document.getElementById('choiceSection').classList.toggle('hidden', type !== 'choice');
        }

        function addChoice(data = {text: '', target: '', url: ''}) {
            const div = document.createElement('div');
            div.className = "flex gap-2 bg-[#333] p-2 rounded border border-gray-600 items-center";
            div.innerHTML = `
                <input type="text" class="c-text input-style flex-1 p-2 text-xs rounded" value="${data.text}" placeholder="Gomb szövege" oninput="autoSave()">
                <input type="number" class="c-target input-style w-16 p-2 text-xs rounded" value="${data.target}" placeholder="Idx" oninput="autoSave()">
                <input type="url" class="c-url input-style flex-1 p-2 text-xs rounded" value="${data.url}" placeholder="URL" oninput="autoSave()">
                <button class="delete-choice text-red-400 font-bold px-2"><i class="fa fa-trash"></i></button>
            `;
            
            div.querySelector('.delete-choice').onclick = () => {
                div.remove();
                autoSave();
            };
            
            document.getElementById('choicesList').appendChild(div);
        }

        function requestDelete(index) {
            pageIdxToDelete = index;
            modal.style.display = 'flex';
        }

        modalConfirm.onclick = () => {
            if (pageIdxToDelete !== -1) {
                if (currentIdx === pageIdxToDelete) {
                    currentIdx = -1;
                    document.getElementById('editorSection').classList.add('hidden');
                } else if (pageIdxToDelete < currentIdx) {
                    currentIdx--;
                }
                
                clearTimeout(saveTimeout);
                config.storyPages.splice(pageIdxToDelete, 1);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
                
                const indicator = document.getElementById('save-indicator');
                indicator.innerHTML = '<i class="fa fa-trash mr-2"></i> OLDAL TÖRÖLVE';
                indicator.style.display = 'block';
                setTimeout(() => { 
                    indicator.style.display = 'none';
                    indicator.innerHTML = '<i class="fa fa-sync-alt fa-spin mr-2"></i> MENTÉS...';
                }, 1000);
                
                modal.style.display = 'none';
                pageIdxToDelete = -1;
                renderList();
            }
        };

        modalCancel.onclick = () => {
            modal.style.display = 'none';
            pageIdxToDelete = -1;
        };

        function renderList() {
            const list = document.getElementById('pageList');
            list.innerHTML = '';
            config.storyPages.forEach((p, i) => {
                const item = document.createElement('div');
                item.className = `page-item ${i === currentIdx ? 'selected' : ''}`;
                
                const mainArea = document.createElement('div');
                mainArea.className = "flex items-center flex-1 overflow-hidden h-full py-1 cursor-pointer";
                mainArea.onclick = () => loadPage(i);
                mainArea.innerHTML = `
                    <i class="fa fa-bars handle mr-3 opacity-30"></i>
                    <span class="truncate text-sm font-medium">#${i}: ${p.content.substring(0, 45)}...</span>
                `;

                const actionArea = document.createElement('div');
                actionArea.className = "flex items-center gap-2";
                
                const badge = document.createElement('span');
                badge.className = "text-[10px] text-gray-500 uppercase font-bold";
                badge.textContent = p.pageType || 'story';

                const delBtn = document.createElement('button');
                delBtn.className = "delete-btn-inline";
                delBtn.innerHTML = '<i class="fa fa-trash"></i>';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    requestDelete(i);
                };

                actionArea.appendChild(badge);
                actionArea.appendChild(delBtn);
                
                item.appendChild(mainArea);
                item.appendChild(actionArea);
                list.appendChild(item);
            });

            if(sortable) sortable.destroy();
            sortable = new Sortable(list, { 
                animation: 150, 
                handle: '.handle', 
                onEnd: (evt) => {
                    const moved = config.storyPages.splice(evt.oldIndex, 1)[0];
                    config.storyPages.splice(evt.newIndex, 0, moved);
                    currentIdx = -1;
                    document.getElementById('editorSection').classList.add('hidden');
                    autoSave();
                    renderList();
                }
            });
        }

        function loadPage(i) {
            currentIdx = i;
            const p = config.storyPages[i];
            if(!p) return;

            document.getElementById('editorSection').classList.remove('hidden');
            document.getElementById('pageText').value = p.content;
            document.getElementById('prevIndex').value = p.prevIndex ?? "";
            document.getElementById('nextIndex').value = p.nextIndex ?? "";
            document.getElementById('pageBgUrl').value = p.pageBgUrl || "";
            document.getElementById('pageRedirectUrl').value = p.redirectUrl || "";
            document.getElementById('pageType').value = p.pageType || "story";
            document.getElementById('pagePassword').value = p.pagePassword || "";
            document.getElementById('passwordBtnText').value = p.passwordBtnText || "";
            document.getElementById('passwordHints').value = (p.hints || []).join('\n');
            document.getElementById('targetLat').value = p.targetLat || "";
            document.getElementById('targetLon').value = p.targetLon || "";
            
            document.getElementById('choicesList').innerHTML = '';
            if(p.choices) p.choices.forEach(c => addChoice(c));
            
            updateUI();
            renderList();
        }

        function autoSave() {
            clearTimeout(saveTimeout);
            const indicator = document.getElementById('save-indicator');
            indicator.style.display = 'block';

            saveTimeout = setTimeout(() => {
                if(currentIdx !== -1 && config.storyPages[currentIdx]) {
                    const p = config.storyPages[currentIdx];
                    p.content = document.getElementById('pageText').value;
                    p.prevIndex = document.getElementById('prevIndex').value !== "" ? parseInt(document.getElementById('prevIndex').value) : undefined;
                    p.nextIndex = document.getElementById('nextIndex').value !== "" ? parseInt(document.getElementById('nextIndex').value) : undefined;
                    p.pageBgUrl = document.getElementById('pageBgUrl').value;
                    p.redirectUrl = document.getElementById('pageRedirectUrl').value;
                    p.pageType = document.getElementById('pageType').value;
                    p.pagePassword = document.getElementById('pagePassword').value;
                    p.passwordBtnText = document.getElementById('passwordBtnText').value;
                    p.hints = document.getElementById('passwordHints').value.split('\n').filter(h => h.trim() !== "");
                    p.targetLat = document.getElementById('targetLat').value;
                    p.targetLon = document.getElementById('targetLon').value;
                    p.choices = Array.from(document.getElementById('choicesList').children).map(c => ({ 
                        text: c.querySelector('.c-text').value, 
                        target: c.querySelector('.c-target').value, 
                        url: c.querySelector('.c-url').value 
                    }));
                }
                config.appTitle = document.getElementById('appTitle').value;
                config.globalBgUrl = document.getElementById('globalBgUrl').value;
                config.bgColor = document.getElementById('bgColor').value;
                config.textColor = document.getElementById('textColor').value;
                config.annaAvatarUrl = document.getElementById('annaAvatarUrl').value;
                config.markAvatarUrl = document.getElementById('markAvatarUrl').value;
                config.showMapIcon = document.getElementById('showMapIcon').checked;
                config.mapUrl = document.getElementById('mapUrl').value;
                
                localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
                setTimeout(() => { indicator.style.display = 'none'; }, 600);
                renderList();
            }, 500);
        }

        document.getElementById('addPageBtn').onclick = () => { 
            config.storyPages.push({content: "Új oldal...", pageType: "story"}); 
            const newIndex = config.storyPages.length - 1;
            loadPage(newIndex); 
            autoSave(); 
        };

        document.getElementById('previewBtn').onclick = () => { 
            window.open('preview.html', '_blank'); 
        };

        document.getElementById('downloadBtn').onclick = () => { 
            const blob = new Blob([localStorage.getItem(STORAGE_KEY)], {type: 'application/json'}); 
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); 
            a.download = 'game_config.json'; a.click(); 
        };

        window.onload = () => {
            document.getElementById('appTitle').value = config.appTitle || "";
            document.getElementById('globalBgUrl').value = config.globalBgUrl || "";
            document.getElementById('bgColor').value = config.bgColor || "#1a1a1a";
            document.getElementById('textColor').value = config.textColor || "#ffffff";
            document.getElementById('annaAvatarUrl').value = config.annaAvatarUrl || "";
            document.getElementById('markAvatarUrl').value = config.markAvatarUrl || "";
            document.getElementById('showMapIcon').checked = config.showMapIcon !== false;
            document.getElementById('mapUrl').value = config.mapUrl || "";
            renderList();
        };
    </script>
</body>
</html>
