<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0">
    <title>Előnézet</title>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; }
        body { margin: 0; padding: 0; font-family: 'Play', sans-serif; background: var(--bg-color); color: var(--text-color); min-height: 100vh; overflow-x: hidden; visibility: hidden; opacity: 0; transition: opacity 0.4s; }
        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background: #000; }
        .bg-layer img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45); }
        .content-box {
            background-color: rgba(0, 0, 0, 0.88); padding: 40px 20px 15px 20px; 
            border-radius: 10px 10px 0 0; max-width: 800px; width: calc(100% - 40px);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.65); border: 3px solid #8a2be2;
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); 
            z-index: 10; text-align: left; min-height: 250px; display: flex; flex-direction: column;
        }
        #story-text { font-size: 1.25em; font-weight: 700; line-height: 1.6; margin-bottom: 25px; white-space: pre-wrap; flex-grow: 1; }
        .interaction-area { display: flex; gap: 10px; border-top: 1px dashed #8a2be2; padding-top: 15px; flex-wrap: wrap; }
        .nav-btn { flex: 1; padding: 15px; background: #8a2be2; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; min-width: 120px; font-size: 1.1em; }
        .avatar { position: absolute; top: -55px; left: -10px; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #00ffff; display: none; box-shadow: 0 0 15px #00ffff; }
        .fixed-menu-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 50px; background-color: #1a1a1a; border-top: 2px solid #8a2be2; z-index: 50; display: flex; justify-content: space-around; align-items: center; }
        .menu-button { background: none; border: none; color: white; font-size: 1.6em; cursor: pointer; }
        .anna-msg { color: #ff69b4; } .mark-msg { color: #4169e1; } .system-msg { color: #00ffff; font-style: italic; }
    </style>
</head>
<body>
    <div class="bg-layer"><img id="bg-img" src=""></div>
    <div class="content-box">
        <img id="avatar-img" class="avatar" src="">
        <div id="story-text"></div>
        <div class="interaction-area" id="btn-container"></div>
    </div>
    <div class="fixed-menu-bar">
        <button class="menu-button" id="map-btn"><i class="fa-solid fa-map-location-dot"></i></button>
        <button class="menu-button"><i class="fa-solid fa-image"></i></button>
    </div>

    <script>
        (function() {
            const config = JSON.parse(localStorage.getItem('DYNAMIC_CONFIG'));
            if(!config) { document.body.innerHTML = "<h2 style='color:white;text-align:center;'>Nincs mentett konfiguráció!</h2>"; document.body.style.visibility='visible'; document.body.style.opacity=1; return; }

            let watchId;
            document.getElementById('app-title').textContent = config.appTitle;
            document.documentElement.style.setProperty('--bg-color', config.bgColor);
            document.documentElement.style.setProperty('--text-color', config.textColor);
            if(!config.showMapIcon) document.getElementById('map-btn').style.display = 'none';
            document.getElementById('map-btn').onclick = () => { if(config.mapUrl) window.open(config.mapUrl, '_blank'); };
            document.body.style.visibility = 'visible'; document.body.style.opacity = 1;

            function format(t) {
                return t.replace(/§A/g, '<span class="anna-msg">Anna:</span>')
                        .replace(/§M/g, '<span class="mark-msg">Márk:</span>')
                        .replace(/§R/g, '<span class="system-msg">[Rendszer]:</span>');
            }

            function render(idx) {
                const p = config.storyPages[idx]; if(!p) return;
                if(watchId) navigator.geolocation.clearWatch(watchId);
                const textEl = document.getElementById('story-text');
                textEl.innerHTML = format(p.content);
                document.getElementById('bg-img').src = p.customBackgroundUrl || "";
                
                const av = document.getElementById('avatar-img'); av.style.display = 'none';
                if(p.content.includes("§A") && config.annaAvatarUrl) { av.src = config.annaAvatarUrl; av.style.display = 'block'; }
                else if(p.content.includes("§M") && config.markAvatarUrl) { av.src = config.markAvatarUrl; av.style.display = 'block'; }

                const cont = document.getElementById('btn-container'); cont.innerHTML = '';

                if(p.pageType === 'story' || !p.pageType) {
                    const b = document.createElement('button'); b.className = 'nav-btn'; b.textContent = 'Vissza';
                    b.onclick = () => render(p.prevIndex !== undefined ? p.prevIndex : Math.max(0, idx - 1));
                    cont.appendChild(b);
                    const n = document.createElement('button'); n.className = 'nav-btn'; n.textContent = 'Tovább';
                    n.onclick = () => {
                        if(p.redirectUrl) { window.location.href = p.redirectUrl; return; }
                        render(p.nextIndex !== undefined ? p.nextIndex : idx + 1);
                    };
                    cont.appendChild(n);
                } else if(p.pageType === 'choice') {
                    p.choices.forEach(c => {
                        const btn = document.createElement('button'); btn.className = 'nav-btn'; btn.textContent = c.text;
                        btn.onclick = () => { if(c.url) window.location.href = c.url; else render(parseInt(c.target)); };
                        cont.appendChild(btn);
                    });
                } else if(p.pageType === 'password') {
                    const input = document.createElement('input'); input.className = 'nav-btn bg-gray-800 text-center'; input.placeholder = 'Jelszó...';
                    if(p.passwordHint) { const hint = document.createElement('p'); hint.className = 'w-full text-center text-xs italic opacity-60'; hint.textContent = 'Segítség: ' + p.passwordHint; cont.appendChild(hint); }
                    const btn = document.createElement('button'); btn.className = 'nav-btn'; btn.textContent = p.passwordBtnText || 'OK';
                    btn.onclick = () => {
                        if(input.value.toLowerCase() === p.pagePassword.toLowerCase()) {
                            if(p.redirectUrl) window.location.href = p.redirectUrl;
                            else render(p.nextIndex !== undefined ? p.nextIndex : idx + 1);
                        } else alert('Hibás jelszó!');
                    };
                    cont.appendChild(input); cont.appendChild(btn);
                } else if(p.pageType === 'gps') {
                    const status = document.createElement('div'); status.className = 'w-full text-center text-cyan-400 font-bold'; status.textContent = 'Helyzet meghatározása...';
                    cont.appendChild(status);
                    const mBtn = document.createElement('button'); mBtn.className = 'nav-btn'; mBtn.textContent = 'Térkép';
                    mBtn.onclick = () => window.open(p.pageMapUrl || config.mapUrl, '_blank');
                    cont.appendChild(mBtn);
                    watchId = navigator.geolocation.watchPosition(pos => {
                        const d = calcDist(pos.coords.latitude, pos.coords.longitude, parseFloat(p.targetLat), parseFloat(p.targetLon));
                        status.textContent = `Távolság: ${Math.round(d)}m`;
                        if(d < 30) {
                            navigator.geolocation.clearWatch(watchId);
                            const ok = document.createElement('button'); ok.className = 'nav-btn bg-green-700'; ok.textContent = 'Megérkeztél! Tovább';
                            ok.onclick = () => { if(p.redirectUrl) window.location.href = p.redirectUrl; else render(p.nextIndex !== undefined ? p.nextIndex : idx + 1); };
                            cont.appendChild(ok);
                        }
                    }, null, {enableHighAccuracy:true});
                }
            }
            function calcDist(la1, lo1, la2, lo2) {
                const R = 6371e3; const f1 = la1 * Math.PI/180; const f2 = la2 * Math.PI/180;
                const df = (la2-la1) * Math.PI/180; const dl = (lo2-lo1) * Math.PI/180;
                const a = Math.sin(df/2) * Math.sin(df/2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            }
            render(0);
        })();
    </script>
</body>
</html>
