<body>
    <script>
        (function() {
            // A kulcsnak meg kell egyeznie az admin.html-ben használt STORAGE_KEY-vel
            const STORAGE_KEY = 'DYNAMIC_CONFIG'; 
            let config = JSON.parse(localStorage.getItem(STORAGE_KEY));

            // Ha nincs adat, hibaüzenet
            if (!config) {
                document.body.innerHTML = `
                    <div style="color:white; padding:50px;">
                        <h1>Nincs betöltött előnézet</h1>
                        <p>Kérjük, mentsd el a beállításokat az admin felületen!</p>
                    </div>`;
                document.body.style.visibility = 'visible';
                document.body.style.opacity = 1;
                return;
            }

            // Inicializálás és indítás
            function initPreview() {
                document.body.style.visibility = 'visible';
                document.body.style.opacity = 1;
                renderPage(0); // Kezdés az első oldalon
            }

            // ... renderPage és egyéb függvények változatlanok ...

            initPreview();
        })();
    </script>
</body>
</html>
