<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Kód Olvasó és Titkos Kulcs Ellenőrző</title>
    <!-- Tailwind CSS CDN for beautiful and responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Set Inter font -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
        }
        /* Custom styling for the video container */
        #reader {
            width: 100%;
            max-width: 400px;
            margin: auto;
            border: 4px solid #3b82f6;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            /* Hide initially until scanner starts */
            display: none; 
        }
    </style>
    <!-- html5-qrcode library for QR code reading -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main application container -->
    <div class="w-full max-w-lg bg-white p-6 md:p-8 rounded-xl shadow-2xl space-y-6">
        
        <header class="text-center">
            <h1 class="text-3xl font-bold text-gray-900">QR Kód Ellenőrző</h1>
            <p class="mt-2 text-gray-500">Az oldal automatikusan kéri a kamera engedélyét. Ha nem jelenik meg, használja a kézi indítás gombot.</p>
        </header>

        <!-- Button to start the scanner manually, or as a fallback/restart -->
        <button id="start-button" onclick="startScanner()" class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition duration-150 ease-in-out disabled:bg-gray-400">
            Kézi Indítás / Újrapróbálás
        </button>

        <!-- The QR code reader display area (hidden initially) -->
        <div id="reader"></div>

        <!-- Status message display -->
        <div id="status-message" class="text-center p-3 rounded-lg font-medium transition-all duration-300 bg-blue-100 text-blue-700">
            Várja a kamera indítását...
        </div>

        <div class="mt-4 text-sm text-gray-400 text-center">
            <p>A működéshez engedélyeznie kell a kamera hozzáférést.</p>
            <p>Titkos kulcs: <span id="secret-display" class="font-mono text-xs">A kód látható a JavaScript kódban.</span></p>
        </div>
    </div>

    <script>
        // --- CONFIGURATION VARIABLES ---
        // The text to compare with the QR code content.
        const SECRET_CODE = "TITKOS_ENGEDELYEZO_KULCS_2024";
        
        // The URL to redirect the user to upon successful match.
        const REDIRECT_URL = "https://www.google.com/search?q=sikeres+ellenorzes";
        
        // Delay the redirect by this many milliseconds (improves user experience)
        const REDIRECT_DELAY_MS = 2000;
        // ------------------------------

        const html5QrCode = new Html5Qrcode("reader");
        const statusMessageEl = document.getElementById("status-message");
        const readerEl = document.getElementById("reader");
        const startButtonEl = document.getElementById("start-button");
        const secretDisplayEl = document.getElementById("secret-display");

        // Runtime settings
        const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            // facingMode is now handled by camera enumeration in startScanner
        };

        /**
         * Handles successful scan (when a QR code is decoded).
         * @param {string} decodedText - The content of the scanned QR code.
         */
        function onScanSuccess(decodedText) {
            // Disable button immediately to prevent double scan/start
            startButtonEl.disabled = true;

            // Stop the reader from scanning continuously
            html5QrCode.stop().then((ignore) => {
                console.log("QR Code reading stopped.");
                readerEl.style.display = 'none';
            }).catch((err) => {
                console.error("Error stopping the scanner:", err);
            });

            // 1. Update status
            statusMessageEl.className = "text-center p-3 rounded-lg font-medium transition-all duration-300 bg-yellow-100 text-yellow-700";
            statusMessageEl.innerHTML = `Sikeresen beolvasva: <b>${decodedText}</b>. Ellenőrzés...`;

            // 2. Comparison
            if (decodedText.trim() === SECRET_CODE) {
                // Match successful
                statusMessageEl.className = "text-center p-3 rounded-lg font-medium transition-all duration-300 bg-green-100 text-green-700";
                statusMessageEl.innerHTML = `Kód EGYEZIK! Átirányítás ${REDIRECT_DELAY_MS / 1000} másodperc múlva ide: <b>${REDIRECT_URL}</b>`;
                
                console.log(`Success! Redirecting to: ${REDIRECT_URL}`);
                
                // Delay the redirect for better user experience
                setTimeout(() => {
                    window.location.href = REDIRECT_URL;
                }, REDIRECT_DELAY_MS);

            } else {
                // Match failed
                statusMessageEl.className = "text-center p-3 rounded-lg font-medium transition-all duration-300 bg-red-100 text-red-700";
                statusMessageEl.innerHTML = `Kód NEM EGYEZIK. Várt kulcs: ${SECRET_CODE.substring(0, 5)}... Próbálja újra 5 másodperc múlva.`;
                
                console.warn(`Failed match. Scanned: "${decodedText}", Expected: "${SECRET_CODE}"`);

                // Re-enable button after 5 seconds to allow manual restart
                setTimeout(() => {
                    startButtonEl.disabled = false;
                    startButtonEl.textContent = "Kézi Indítás / Újrapróbálás";
                }, 5000);
            }
        }

        /**
         * Handles scanning errors (e.g., if the camera doesn't see a QR code).
         * @param {string} errorMessage - The error message.
         */
        function onScanError(errorMessage) {
            // Keep scanning silently
        }

        /**
         * Initializes and starts the QR code reader, explicitly enumerating cameras first.
         * This function is now called automatically on page load, and manually via the button.
         */
        async function startScanner() {
            // Check if scanner is already running (relying on button disabled state)
            if (startButtonEl.disabled && startButtonEl.textContent !== "Kézi Indítás / Újrapróbálás") return; 
            
            startButtonEl.disabled = true;
            startButtonEl.textContent = "Kamera Elérése...";
            readerEl.style.display = 'none'; // Ensure reader is hidden before attempt
            statusMessageEl.className = "text-center p-3 rounded-lg font-medium transition-all duration-300 bg-blue-100 text-blue-700";
            statusMessageEl.innerHTML = "Kamera betöltése. Kérem, engedélyezze a hozzáférést a böngészőben.";

            try {
                // Retrieve available camera devices - this triggers the permission prompt
                const videoInputDevices = await Html5Qrcode.getCameras();

                if (videoInputDevices && videoInputDevices.length) {
                    // Show the reader element
                    readerEl.style.display = 'block';

                    // Use the first device found or try to find the back camera ('environment')
                    let cameraId = videoInputDevices[0].id;
                    let preferredDevice = videoInputDevices.find(device => 
                        device.label.toLowerCase().includes('back') || 
                        device.label.toLowerCase().includes('environment')
                    );

                    if (preferredDevice) {
                        cameraId = preferredDevice.id;
                    }

                    // Attempt to start the scanner with the selected camera ID.
                    await html5QrCode.start(
                        cameraId, 
                        config, 
                        onScanSuccess, 
                        onScanError
                    );

                    statusMessageEl.className = "text-center p-3 rounded-lg font-medium transition-all duration-300 bg-green-100 text-green-700";
                    statusMessageEl.innerHTML = "QR Kód Olvasó Elindítva. Keresés...";
                    startButtonEl.textContent = "Keresés Folyamatban..."; 
                    // Button remains disabled while scanning is active
                    
                    console.log("QR Code Reader successfully started.");

                } else {
                    // No cameras found
                    startButtonEl.disabled = false;
                    startButtonEl.textContent = "Nincs Kamera Található - Újrapróbálás";
                    statusMessageEl.className = "text-center p-3 rounded-lg font-medium transition-all duration-300 bg-yellow-600 text-white";
                    statusMessageEl.innerHTML = "HIBA: Nem találtunk kamerát. Ellenőrizze, hogy van-e csatlakoztatva.";
                    console.error("No cameras found on the device.");
                }

            } catch (err) {
                // Handle camera access failure (e.g., permission denied, browser block, or iframe restriction)
                readerEl.style.display = 'none';
                startButtonEl.disabled = false;
                startButtonEl.textContent = "Kézi Indítás / Újrapróbálás";
                statusMessageEl.className = "text-center p-3 rounded-lg font-medium transition-all duration-300 bg-red-500 text-white";
                statusMessageEl.innerHTML = "HIBA: A kamera indítása sikertelen. Kérem, kattintson a gombra a hozzáférés megadásához, vagy ellenőrizze a böngésző engedélyeit!";
                console.error("Camera startup error (likely permission denied or blocked):", err);
            }
        }
        
        // Initial setup on load - Attempts to start the scanner immediately, fulfilling the user's request.
        window.onload = startScanner; 
    </script>
</body>
</html>
